      - "Load one same-user RecordedV1 row; LegacyV0 refuses PreFeatureRecord and Undone returns AlreadyUndone without writes."
      - "Start ImmediateTransaction and validate the manifest digest and every current non-file row against its recorded after-image in dependency order; for LibraryItem paths moved by the recorded forward report, compare the current path with that report's truthful after-location instead of the generic row image."
      - "On the first mismatch return StaleAfterImage naming table and primary key and roll back every write."
      - "Restore Works first, then prior records, then dependency-ordered before-images; retained content stays byte-identical while its reversible pointer columns restore."
      - "Advance every restored member generation, restore machine-losers with a durable user-distinct marker, and append only eligible lineage rebases whose recorded post-generation equalled this operation's pre-decision generation."
      - "Restore pre-operation cards, cancel pending cards with ids above the recorded high-water that name the merged graph, and retire their actionable notifications."
      - "Set identity_merge_archives lifecycle to undoing and commit; no file I/O occurs inside the transaction."
      - "Run the shared reverse file pass over the union of recorded moved results and the complete both-Work candidate set, persist the report, and set lifecycle to undone only when report.complete is true; otherwise retain undoing for explicit retry."
    completeness_oracle: "For each of the five absorption caller doors, seed all 37 closure tables, all ten bare-pointer registrations, the trigger, a third-Work relationship, cards/notifications, legacy history, staging rows, nested/sibling records, and both-Work files; assert one complete record and exact named restore observables."
  cutover_b4:
    order:
      - "Within production activation, prove marker absence without inferring it from a readable marker row; mint CutoverReadPermit and ConflictCutoverRequest."
      - "Begin one ImmediateTransaction and census pointer-only cards before hydration."
      - "Privately scan every legacy row; classify subject validity, payload validity, keyability, status and close provenance through legacy_adoption_table."
      - "Hydrate/reuse the oldest valid pointer card, cancel extras/missing pointers with diagnostics, and mint/reuse exactly one card per legacy row through the sole card mint."
      - "Translate every still-restorable pre-B4 operation mutation so before is the pending pre-absorption canonical question and after is its cancelled/history live-card state; preserve the legacy row bytes."
      - "Count pending staging rows plus immutable diagnostics only when effective_v2_diagnostic_currentness says the linked operation is active; count inert V1 dismissal keys separately."
      - "Backfill exactly one IdentityPark card per parked Work, validate all expected counts and zero untranslated mutations, switch readers/writers, write marker and report digest last, then commit."
      - "Return ActivationReport with no pre-cutover write permit; a second activation validates stored digest/counts and performs zero mutations."
    no_global_refusal: "An operation in undoing is database-restored and does not block B4; its restored legacy row enters normal adoption and its linked diagnostic is historical."
    typed_delete_close: "Before B4, Work deletion closes an open legacy row as machine work_deleted and records that mutation; after B4, the absent permit makes the close unreachable."
  file_reorganization:
    primitive: "move_no_clobber exclusively reserves the destination, verifies FileRevision, uses same-device no-replace rename or cross-device exclusive durable copy, and never removes the source before a durable destination exists"
    database_truth: "compare_and_set_item_path scopes by user/item/expected path; a failed update attempts safe reversal and reports both locations if reversal also fails"
    per_item_dispositions: [Moved, AlreadyCanonical, RecordHealed, DestinationOccupied, CopiedWithSourceLeft, SourceMissing, RecordMismatch, MoveFailed, RecordUpdateFailed]
    forward_input: "every item owned by either member whose canonical path can change, including survivor-origin items"
    undo_input: "every item actually moved in the recorded forward results plus the complete both-Work candidate inventory from the envelope"
    completion: "FileMoveReport.complete is true only when each result leaves the path record and filesystem truthful and no leftover source is unreported"
    excluded_protocols: "No transition journal, per-file claim, lock owner, timer, startup owner, or automatic crash reconciliation is introduced."

modules:
  - name: identity_authority_contracts
    responsibility: "Own the closed review, proof, absorption, undo, cutover, route, file and error vocabulary without persistence or orchestration."
    dependencies: []
    module_invariants:
      - "Every IR v2 CapturedIdentity reference means the F2 spine type at crates/livrarr-domain/src/identity_layer/status.rs:23."
      - "ConflictAction replaces the existing four-action enum in place; LegacyConflictResolutionAction is distinct history/cutover vocabulary with the machine deletion outcome."
      - "MergeableField remains exactly SeriesName and SeriesPosition, and every choice is keyed by the Work that supplies the value."
    capability_survey:
      - capability: "existing review-kind and F2 identity vocabulary"
        existing_source: "crates/livrarr-domain/src/identity_layer/shared.rs:34"
        reuse_decision: wrap
        rationale: "Extend ReviewKind in place and reuse the F2 foundation types while replacing split card/proof shapes with IR v1 contracts."
    public_api:
      functions:
        - name: "derive_card_cohort"
          signature_ref: "ir-v1-identity-conflict-authority.yaml#/modules/identity_authority_contracts/public_api/functions/derive_card_cohort"
          pseudocode:
            - "Start with every payload Work id and append the optional subject Work id."
            - "Reject no value here; sort by numeric Work id and remove duplicates using the standard ordered set behavior."
            - "Return the canonical vector used by mint, proof, delete, dismissal, cutover and undo consumers."
          call_annotations:
            - { call: "ordered-set sort and dedup", type: STDLIB, target: "std::collections::BTreeSet" }
          postconditions:
            - "The result is ascending, duplicate-free, and includes the subject when present."
          tdd_directives:
            - "Drive POST /identity-review-card/{card_id}/resolve through the real router and real SqliteDb with subject-only, payload-only, overlapping and empty shapes; assert the named ordered identity_review_card_members rows used by cancellation (AC-030). Constructed payload variants are justified because migration 087 must accept every deployed card shape."
        - name: "group_identity_role_kind"
          signature_ref: "ir-v1-identity-conflict-authority.yaml#/modules/identity_authority_contracts/public_api/functions/group_identity_role_kind"
          pseudocode:
            - "Match the closed GroupIdentityRole variant without reading its payload and return the same-named payload-free discriminant."
            - "Because the enum is closed, compilation fails if a future role lacks a mapping."
          call_annotations:
            - { call: "exhaustive role match", type: STDLIB, target: "std::matches" }
          postconditions:
            - "Payload values cannot alter the authorization-table axis."
          tdd_directives:
            - "Drive every GroupIdentity role through the production preview_review door and assert the named role_kind in the action proof and activation digest; include an Unknown card from the nonempty upgrade fixture (AC-001, AC-004)."
        - name: "review_authorization_table"
          signature_ref: "ir-v1-identity-conflict-authority.yaml#/modules/identity_authority_contracts/public_api/functions/review_authorization_table"
          pseudocode:
            - "Return the immutable expansion defined by operational_tables.authorization in canonical enum order."
            - "Encode each legal kind, optional role kind, action, cohort cardinality and payload state exactly once with Card, Election, Refuse or HistoryOnly proof class."
          call_annotations:
            - { call: "borrow immutable static slice", type: STDLIB, target: "std::slice" }
          invariants:
            - "The expanded GroupIdentity behavior projection has exactly ten matrix cells and the conflict behavior projection has exactly twenty."
          tdd_directives:
            - "Boot the production activation seam with the activated-shape and nonempty post-086 fixtures, then drive all action doors; assert authorization_table_digest plus one named outcome per expanded cell (AC-001, AC-020, AC-021, AC-031)."
        - name: "validate_review_authorization_totality"
          signature_ref: "ir-v1-identity-conflict-authority.yaml#/modules/identity_authority_contracts/public_api/functions/validate_review_authorization_totality"
          pseudocode:
            - "Enumerate the closed legal product and index supplied cells by the full five-axis key using an ordered map."
            - "Return DuplicateCell on the first repeated key."
            - "Return IllegalRoleAxis when a non-GroupIdentity cell has a role or a GroupIdentity cell lacks one."
            - "Return RoleKindMismatch when the persisted payload role and indexed role kind disagree."
            - "Return WrongProofClass when an accepted nonabsorbing cell is not Card, an absorbing pair cell is not Election, a refusal is actionable, or unreadable history is actionable."
            - "Return MissingCell for the first legal key absent after enumeration; otherwise return success and no writes."
          call_annotations:
            - { call: "ordered cell index", type: STDLIB, target: "std::collections::BTreeMap" }
            - { call: "group_identity_role_kind", type: NEW, target: "group_identity_role_kind" }
          tdd_directives:
            - "Drive server boot through SqliteIdentityAuthorityActivation with one-cell-missing, duplicate, illegal-role and wrong-proof constructed tables; assert the named ActivationError::CheckFailed cause and zero marker/card rows. Constructed tables are justified as structural corruption fixtures (AC-031)."
        - name: "dismissal_key_v2"
          signature_ref: "ir-v1-identity-conflict-authority.yaml#/modules/identity_authority_contracts/public_api/functions/dismissal_key_v2"
          pseudocode:
            - "Decode the typed ReviewCard payload; return UnreadablePayload without a key if decoding fails."
            - "For a GroupIdentity card derive the canonical cohort, include role, subject, proposal digest and Work-keyed choices; return UnknownRole for the unknown role."
            - "For native route conflicts include the exact contradicted route; return AdoptedRouteConflict for unknown historic contradiction."
            - "For IdentityPark key normalized candidate content and evidence digests, never a consume-once cache handle."
