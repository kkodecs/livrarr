metadata:
  feature: identity-conflict-authority
  stage: v2-operational
  spec_ref: spec-identity-conflict-authority.md
  ir_v1_ref: ir-v1-identity-conflict-authority.yaml
  ir_v1_revision: r8

doors:
  - door: "GET /work"
    surface_kind: handler
    road_entry: "identity_authority_handlers::list"
    wiring: "authenticated Work list handler -> existing batch identity-presentation read -> mandatory response overlay including pending conflict-card projection"
    traced: "crates/livrarr-handlers/src/work.rs:596"
  - door: "GET /work/{id}"
    surface_kind: handler
    road_entry: "identity_authority_handlers::get"
    wiring: "authenticated Work detail handler -> captured-identity overlay plus existing one-Work identity-presentation read -> mandatory pending conflict-card projection"
    traced: "crates/livrarr-handlers/src/work.rs:684"
  - door: "GET /identity-review-card"
    surface_kind: handler
    road_entry: "IdentityAuthorityService::list_review"
    wiring: "authenticated router -> list_review handler -> application service -> IdentityAuthorityRoad::list_review_snapshots"
    traced: "IdentityAuthorityService::list_review"
  - door: "GET /identity-review-card/{card_id}"
    surface_kind: handler
    road_entry: "IdentityAuthorityService::read_review"
    wiring: "authenticated router -> get_review handler -> application service -> IdentityAuthorityRoad::read_review_snapshot"
    traced: "IdentityAuthorityService::read_review"
  - door: "POST /identity-review-card/{card_id}/preview"
    surface_kind: handler
    road_entry: "IdentityAuthorityService::preview_review"
    wiring: "authenticated router -> preview_review handler -> application service -> IdentityAuthorityRoad::preview_review -> signed action views"
    traced: "IdentityAuthorityService::preview_review"
  - door: "POST /identity-review-card/{card_id}/resolve"
    surface_kind: handler
    road_entry: "IdentityAuthorityService::resolve_review"
    wiring: "typed-card handler -> authenticate_review_decision -> IdentityAuthorityRoad::resolve_review -> verified card or election path"
    traced: "crates/livrarr-handlers/src/identity_layer.rs:102"
  - door: "PUT /work/{id} title or author edit"
    surface_kind: handler
    road_entry: "IdentityAuthorityService::resolve_review"
    wiring: "work edit -> existing identity road settlement -> role-bearing GroupIdentity card -> authenticated review continuation"
    traced: "crates/livrarr-handlers/src/work.rs:841"
  - door: "GET /work/{id}/merge/{other_id}/preview"
    surface_kind: handler
    road_entry: "IdentityAuthorityService::preview_merge"
    wiring: "merge preview handler -> application service -> IdentityAuthorityRoad::preview_merge -> elected pair snapshot and proof"
    traced: "crates/livrarr-handlers/src/work.rs:1064"
  - door: "POST /work/{id}/merge/{other_id}"
    surface_kind: handler
    road_entry: "IdentityAuthorityService::execute_merge"
    wiring: "merge handler -> authenticate_merge_execute -> IdentityAuthorityRoad::execute_merge -> repository absorption -> post-commit file pass"
    traced: "crates/livrarr-handlers/src/work.rs:1075"
  - door: "legacy conflict page list/detail"
    surface_kind: handler
    road_entry: "IdentityAuthorityService::list_review"
    wiring: "old conflict routes are superseded by filtered IdentityConflict review-card list and read doors"
    traced: "crates/livrarr-handlers/src/identity_conflicts.rs:46"
  - door: "POST /identity-conflict/{card_id}/resolve"
    surface_kind: handler
    road_entry: "IdentityAuthorityService::resolve_review"
    wiring: "compatibility route -> resolve_conflict handler with action plus opaque proof -> authenticated review continuation"
    traced: "crates/livrarr-handlers/src/identity_conflicts.rs:129"
  - door: "GET /identity-review park list"
    surface_kind: handler
    road_entry: "IdentityAuthorityService::list_review"
    wiring: "legacy park list route -> filtered IdentityPark review cards -> ordinary card views"
    traced: "crates/livrarr-server/src/router.rs:563"
  - door: "park choice and dismiss"
    surface_kind: handler
    road_entry: "IdentityAuthorityService::resolve_review"
    wiring: "park action -> persisted candidate digest plus proof -> ordinary nonabsorbing review decision; no candidate cache id and no absorption"
    traced: "crates/livrarr-handlers/src/identity_review.rs:184"
  - door: "POST /identity-absorption/{record_id}/undo"
    surface_kind: handler
    road_entry: "IdentityAuthorityService::undo_absorption"
    wiring: "undo handler -> IdentityAuthorityRoad::undo_absorption -> one database restore -> post-commit reverse file pass -> report persistence"
    traced: "IdentityAuthorityService::undo_absorption"
  - door: "GET /identity-absorption/{record_id}"
    surface_kind: handler
    road_entry: "IdentityAuthorityService::read_absorption"
    wiring: "history/detail action -> read_absorption handler -> sanitized absorption view"
    traced: "IdentityAuthorityService::read_absorption"
  - door: "user Work deletion"
    surface_kind: handler
    road_entry: "SqliteWorkDelete::delete_work"
    wiring: "work delete service -> repository-held WorkDeleteService -> typed User origin -> one set authority"
    traced: "crates/livrarr-db/src/sqlite_work.rs:740"
  - door: "import rollback Work deletion"
    surface_kind: workflow
    road_entry: "SqliteWorkDelete::delete_work_set"
    wiring: "import rollback -> typed ImportRollback set request -> one set authority"
    traced: "crates/livrarr-db/src/sqlite_import.rs:167"
  - door: "list-import rollback Work deletion"
    surface_kind: workflow
    road_entry: "SqliteWorkDelete::delete_work_set"
    wiring: "list rollback -> typed ListImportRollback set request -> one set authority"
    traced: "crates/livrarr-db/src/sqlite_list_import.rs:224"
  - door: "absorption Work deletion"
    surface_kind: workflow
    road_entry: "SqliteWorkDelete::delete_work_in_tx"
    wiring: "absorb_work_into -> open operation's private delete-authority borrow plus writer -> singleton set authority"
    traced: "crates/livrarr-db/src/identity_layer.rs:3946"
  - door: "settlement automatic absorption"
    surface_kind: workflow
    road_entry: "IdentityAuthorityRoad::execute_settlement_auto_merge"
    wiring: "settlement component snapshot -> closed machine origin -> repository execute_absorption"
    traced: "crates/livrarr-db/src/identity_layer.rs:817"
  - door: "review-continuation absorption"
    surface_kind: workflow
    road_entry: "IdentityAuthorityRoad::resolve_review"
    wiring: "verified election from role/action cell -> closed ReviewContinuation origin -> repository execute_absorption"
    traced: "crates/livrarr-db/src/identity_layer.rs:2071"
  - door: "dedup-residue heal absorption"
    surface_kind: job
    road_entry: "IdentityAuthorityRoad::execute_dedup_residue_heal_absorption"
    wiring: "boot heal scan snapshot -> one closed machine request per pair -> repository execute_absorption"
    traced: "crates/livrarr-db/src/identity_layer.rs:5621"
  - door: "article-duplicate heal absorption"
    surface_kind: job
    road_entry: "IdentityAuthorityRoad::execute_article_duplicate_heal_absorption"
    wiring: "article heal component snapshot -> one closed machine request per winner component -> repository execute_absorption"
    traced: "crates/livrarr-db/src/pool.rs:1608"
  - door: "manual pair absorption"
    surface_kind: handler
    road_entry: "IdentityAuthorityRoad::execute_merge"
    wiring: "election preview -> echoed proof -> verified pair election -> closed ManualPair request -> repository execute_absorption"
    traced: "crates/livrarr-handlers/src/work.rs:1075"
  - door: "runtime identity-conflict raise"
    surface_kind: workflow
    road_entry: "identity_authority_repository::commit_settlement_in_tx"
    wiring: "route-authoritative provider evidence -> F2 captured-route handoff -> deterministic same-provider classifier -> existing settlement transaction -> raise_identity_conflict_in_tx -> sole card mint"
    traced: "crates/livrarr-server/src/identity_layer.rs:550"
  - door: "server boot activation"
    surface_kind: workflow
    road_entry: "SqliteIdentityAuthorityActivation::activate_identity_authority"
    wiring: "post-migration server wrapper -> production database activation -> validation or all-or-nothing B4 -> composition root"
    traced: "crates/livrarr-server/src/identity_layer.rs:1012"
  - door: "behavioral boot oracle"
    surface_kind: workflow
    road_entry: "SqliteIdentityAuthorityActivation::activate_identity_authority"
    wiring: "registered behavioral fixture -> same production database activation used by server boot -> named durable outcomes"
    traced: "tests/behavioral/test_ilr_contracts.rs:5580"
  - door: "ReviewPage review-card actions"
    surface_kind: ui-action
    road_entry: "executeReviewDecision"
    wiring: "card read/preview returns opaque proof -> browser preserves bytes -> action echoes proof -> authenticated handler"
    traced: "frontend/src/pages/review/ReviewPage.tsx:551"
  - door: "ReviewPage conflict actions"
    surface_kind: ui-action
    road_entry: "executeConflictDecision"
    wiring: "conflict card action echoes the proof received on the same action view; old unproved action helper is replaced"
    traced: "frontend/src/pages/review/ReviewPage.tsx:153"

pipelines:
  - pipeline: review decision
    trace: "card/edit/park/conflict door -> application authentication -> road authorization-cell dispatch -> proof snapshot verification -> repository card or election action -> card/audit/route effects -> response"
    seams:
      - seam: "authenticate_review_decision"
        producers: ["identity_authority_handlers::resolve_review", "identity_authority_handlers::resolve_conflict"]
        consumers: ["IdentityAuthorityRoad::resolve_review"]
      - seam: "verify_card_decision"
        producers: ["identity_road::resolve_review"]
        consumers: ["IdentityAuthorityRepository::apply_nonabsorbing_decision"]
      - seam: "verify_election_decision"
        producers: ["identity_road::resolve_review", "identity_road::execute_merge"]
        consumers: ["IdentityAuthorityRepository::execute_absorption"]
      - seam: "apply_nonabsorbing_decision"
        producers: ["identity_road::resolve_review"]
        consumers: ["identity_review_cards", "identity_review_dismissals", "identity_routes", "identity_audit_events"]
  - pipeline: recorded absorption
    trace: "five typed callers -> IdentityAuthorityRepository::execute_absorption -> begin -> route plan/apply -> open operation with existing delete authority -> absorb each loser -> delete authority -> seal -> commit plus worksMerged -> forward files -> persist report"
    seams:
      - seam: "IdentityAuthorityRepository::execute_absorption"
        producers: ["identity_road::execute_merge", "identity_road::resolve_review", "identity_road::execute_settlement_auto_merge", "identity_road::execute_dedup_residue_heal_absorption", "identity_road::execute_article_duplicate_heal_absorption"]
        consumers: ["open_absorption_operation", "absorb_work_into", "seal_absorption_operation"]
      - seam: "open_absorption_operation"
        producers: ["IdentityAuthorityRepository::execute_absorption"]
        consumers: ["absorb_work_into", "seal_absorption_operation"]
      - seam: "SqliteWorkDelete::delete_work_in_tx"
        producers: ["absorb_work_into"]
        consumers: ["SqliteWorkDelete::delete_work_set_in_tx"]
      - seam: "FileReorganizationService::complete_forward"
        producers: ["identity_road::execute_merge", "identity_road::resolve_review", "identity_road::execute_settlement_auto_merge", "identity_road::execute_dedup_residue_heal_absorption", "identity_road::execute_article_duplicate_heal_absorption"]
        consumers: ["IdentityAuthorityRepository::persist_file_report"]
  - pipeline: absorption undo
    trace: "undo door -> repository restore -> validate non-file after-images -> restore before-images and lineage -> lifecycle undoing -> commit -> reverse file pass -> persisted complete or incomplete report -> lifecycle undone or undoing"
    seams:
      - seam: "IdentityAuthorityRepository::restore_absorption"
        producers: ["identity_road::undo_absorption"]
        consumers: ["restore_absorption_in_tx"]
      - seam: "FileReorganizationService::complete_undo"
        producers: ["identity_road::undo_absorption"]
        consumers: ["IdentityAuthorityRepository::persist_file_report"]
      - seam: "IdentityAuthorityRepository::persist_file_report"
        producers: ["identity_road::undo_absorption", "identity_road::execute_merge", "identity_road::resolve_review", "identity_road::execute_settlement_auto_merge", "identity_road::execute_dedup_residue_heal_absorption", "identity_road::execute_article_duplicate_heal_absorption"]
        consumers: ["identity_merge_archives", "IdentityAuthorityRepository::read_absorption_view"]
  - pipeline: runtime conflict and park production
    trace: "route-authoritative F2 handoff or authoritative park trigger -> classifier-selected exact route or persisted park candidates -> owning write transaction -> sole review-card mint -> membership projection -> pending-card readers and optional notification"
    seams:
      - seam: "identity_authority_repository::complete_anchors"
        producers: ["identity_road::converge_work"]
        consumers: ["mint_reuse_or_suppress_review_card_in_tx", "IdentityParkPayloadV1", "same-transaction NeedsReview/Pending status"]
      - seam: "identity_authority_repository::commit_settlement_in_tx"
        producers: ["route-authoritative IdentityRoadServiceImpl::settle"]
        consumers: ["identity_authority_repository::raise_identity_conflict_in_tx", "same-transaction route settlement"]
      - seam: "identity_authority_repository::raise_identity_conflict_in_tx"
        producers: ["identity_authority_repository::commit_settlement_in_tx"]
        consumers: ["mint_reuse_or_suppress_review_card_in_tx"]
      - seam: "mint_reuse_or_suppress_review_card_in_tx"
        producers: ["identity_authority_repository::raise_identity_conflict_in_tx", "identity_authority_repository::complete_anchors", "run_conflict_authority_cutover_in_activation_tx"]
        consumers: ["identity_review_cards", "identity_review_card_members", "ReviewPage review-card actions"]
      - seam: "parked_by_conflicts"
        producers: ["review_card_store::parked_by_conflicts"]
        consumers: ["identity_authority_handlers::list", "identity_authority_handlers::get", "identity_authority_handlers::project_work_identity_presentations", "WorkDetailResponse.parked_by_conflicts", "identity_authority_repository::apply_identity_clear", "ClearedSlot.parked_by_conflicts", "crates/livrarr-metadata/src/work_service.rs:2595", "IdentityEditClear.parked_by_conflicts", "crates/livrarr-handlers/src/work.rs:2066"]
  - pipeline: Work deletion
    trace: "four typed origins -> repository-held SqliteWorkDelete -> begin or operation writer -> set authority -> relational card cancellation -> optional pre-B4 legacy close -> staging diagnostic -> one physical deletion"
    seams:
      - seam: "SqliteWorkDelete::delete_work_set_in_tx"
        producers: ["SqliteWorkDelete::delete_work", "SqliteWorkDelete::delete_work_set", "SqliteWorkDelete::delete_work_in_tx"]
        consumers: ["cancel_cards_naming_works_in_tx", "close_legacy_conflicts_for_work_delete_in_tx", "works"]
      - seam: "cancel_cards_naming_works_in_tx"
        producers: ["SqliteWorkDelete::delete_work_set_in_tx", "restore_absorption_in_tx"]
        consumers: ["identity_review_cards", "notifications"]
  - pipeline: B4 conflict-authority cutover
    trace: "production activation -> marker-absence capability -> immediate transaction -> private cutover helper -> private legacy scan -> pointer census/hydration -> total adoption -> operation-envelope translation -> counts/switch/marker -> sealed activation report"
    seams:
      - seam: "run_conflict_authority_cutover_in_activation_tx"
        producers: ["SqliteIdentityAuthorityActivation::activate_identity_authority"]
        consumers: ["scan_legacy_conflicts_for_cutover_in_tx", "mint_reuse_or_suppress_review_card_in_tx", "identity_merge_archives", "_livrarr_meta"]
      - seam: "scan_legacy_conflicts_for_cutover_in_tx"
        producers: ["run_conflict_authority_cutover_in_activation_tx"]
        consumers: ["legacy adoption table evaluator"]
  - pipeline: reviewed Incoming creation
    trace: "GroupIdentity Incoming DifferentFromAll -> verify every member CertainlyDifferent -> plan routes -> commit Work/routes/user-distinct marker -> CreatedDistinctOutcome -> post-commit added observer"
    seams:
      - seam: "classify_identity_distinctness"
        producers: ["identity_road::resolve_review"]
        consumers: ["IdentityAuthorityRepository::apply_nonabsorbing_decision"]
      - seam: "observe_created_distinct_added"
        producers: ["identity_road::resolve_review"]
        consumers: ["crates/livrarr-domain/src/services/history.rs:25"]
  - pipeline: no-clobber file completion
    trace: "committed operation item snapshot -> path builder -> shared per-item engine -> exclusive no-replace move -> expected-path database comparison -> truthful report -> operation record"
    seams:
      - seam: "reorganize_items"
        producers: ["FileReorganizationService::complete_forward", "FileReorganizationService::complete_undo", "reorganize_work_files"]
        consumers: ["move_no_clobber", "compare_and_set_item_path", "FileMoveReport"]
      - seam: "compare_and_set_item_path"
        producers: ["reorganize_items"]
        consumers: ["library_items.path", "FileMoveResult"]

