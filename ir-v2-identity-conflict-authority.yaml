        - { version: Unknown, lifecycle: "*", survivor: "*", dispositions: [RefuseCorrupt, RefuseCorrupt, RefuseCorrupt, RefuseCorrupt], expand_lifecycles: 4, expand_survivors: 4 }
        - { version: V1, lifecycle: None, survivor: "*", dispositions: [RefuseCorrupt, RefuseCorrupt, RefuseCorrupt, RefuseCorrupt], expand_survivors: 4 }
        - { version: V1, lifecycle: Undoing, survivor: "*", dispositions: [RefuseCorrupt, RefuseCorrupt, RefuseCorrupt, RefuseCorrupt], expand_survivors: 4 }
        - { version: V1, lifecycle: Active, survivor: Live, dispositions: [RetainRestorable, RefuseCorrupt, RetainHistoryOnly, RefuseCorrupt] }
        - { version: V1, lifecycle: Active, survivor: BeingAbsorbed, dispositions: [CaptureThenCascade, CaptureThenCascade, CaptureThenCascade, RefuseCorrupt] }
