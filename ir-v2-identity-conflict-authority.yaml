        - { version: V1, lifecycle: Undone, survivor: MissingCorruptly, dispositions: [RefuseCorrupt, RefuseCorrupt, RefuseCorrupt, RefuseCorrupt] }
    disposition_counts: { RetainRestorable: 1, RetainHistoryOnly: 20, CaptureThenCascade: 6, CascadePermanently: 3, RefuseCorrupt: 162, total: 192 }
    expansion_contract: "Expand wildcard rows by the declared lifecycle/survivor multiplicities and each dispositions vector by cohort_column_order; require exactly 192 unique keys, the declared disposition counts, no wildcard after expansion, and persist the table digest in ActivationReport."
  record_envelope_and_undo:
    envelope_v1:
      - closed request-derived provenance and caller
      - survivor and canonical loser cohort
      - every pre-decision member generation and survivor post-generation
      - applied ValidatedRoutePlan including retirement reasons
      - card-id high-water plus minted/reused/cancelled ids
      - registered prior active records and survivor-generation lineage facts
      - ordered table/primary-key/before/after mutation list for every reversible effect
