      - { role: MergeMembers, action: GroupDifferentFromAll, legal_cohorts: [], proof: "Refuse(UnsupportedReviewKind)", effect: no_write, other_cohorts: "same refusal" }
      - { role: MergeMembers, action: GroupAttachOrMerge, legal_cohorts: [Two], proof: Election, effect: apply_work_keyed_fields_elect_absorb, other_cohorts: "Refuse(PairRequired)" }
      - { role: None, action: GroupDifferentFromAll, legal_cohorts: [One, Two, Many], proof: Card, effect: stamp_subject_distinct_marker_only, other_cohorts: "Refuse(UnsupportedReviewKind)" }
      - { role: None, action: GroupAttachOrMerge, legal_cohorts: [Two], proof: Election, effect: elect_absorb_with_survivor_fields, other_cohorts: "Refuse(PairRequired)" }
      - { role: Unknown, action: GroupDifferentFromAll, legal_cohorts: [], proof: "Refuse(UnknownRole)", effect: no_write, other_cohorts: "same refusal" }
      - { role: Unknown, action: GroupAttachOrMerge, legal_cohorts: [], proof: "Refuse(UnknownRole)", effect: no_write, other_cohorts: "same refusal" }
