operational_tables:
  authorization:
    implementation: "review_authorization_table returns one immutable expansion of the closed domains below; generation is deterministic and checked at activation"
    dimensions:
      card_kinds: [IdentityConflict, PendingRoute, GroupIdentity, IdentityPark, FieldResolution, ContributorOrder, EditionEvidence, ImportIdentity, MigrationRepair, InvariantRepair]
      group_role_kinds: [ReIdentify, Incoming, MergeMembers, None, Unknown]
      actions: [GroupDifferentFromAll, GroupAttachOrMerge, PendingRouteAffirm, ConflictKeepExisting, ConflictAcceptSeparate, ConflictReplaceAnchor, ConflictMerge, Dismiss, ParkChooseCandidate, ParkDismiss, FieldChoosePreservedValue, FieldExplicitAbsence, ContributorOrderResolve, EditionChooseDirectEvidence, EditionRetainUnknownOrAbsent, EditionArchiveEmptyShell, ImportCorrectedMetadataRetry, ImportResolvingIdentifier, ImportExplicitIdentityOrMinimum, MigrationCorrectTypedValue, MigrationAssignScopeAndOwner, MigrationDiscardProvenNonIdentity, InvariantRecompute, InvariantSupplyMissingReference, InvariantDiscardMalformedDerivedRow]
      cohort_cardinalities: [Zero, One, Two, Many]
      payload_states: [NativeReadable, AdoptedReadableNonKeyable, UnknownRole, HistoryOnlyUnreadable]
    static_expansion:
      axis_key_count: 14
      action_count: 25
      cohort_count: 4
      payload_state_count: 4
      expected_cells: 5600
      algorithm:
        - "Enumerate the 25 ReviewActionKind values for each axis key; GroupIdentity uses each of five role kinds and every other ReviewKind uses only a null role kind."
        - "Cross each key with Zero, One, Two and Many cohort cardinality and all four payload states; this yields (5 GroupIdentity role keys + 9 null-role kind keys) x 25 actions x 4 cohorts x 4 payload states."
        - "Assign HistoryOnly to every HistoryOnlyUnreadable key before action dispatch."
        - "For UnknownRole, assign Card only to GroupIdentity Dismiss, Refuse(UnknownRole) to every other GroupIdentity action, and Refuse(UnsupportedReviewKind) to every non-GroupIdentity key."
        - "For AdoptedReadableNonKeyable, assign Card only to IdentityConflict Keep, Accept and Dismiss at cohort One; its Replace/Merge keys at cohort One refuse AdoptedConflictNeedsIdentityEdit, and every other kind/action/cohort key refuses UnsupportedReviewKind."
        - "For NativeReadable GroupIdentity, apply the ten role/action rows at their declared legal cohorts, apply Card to Dismiss at every cohort, and apply each row's declared refusal to its other cohorts."
        - "For NativeReadable IdentityConflict, apply the twenty kind/action rows only at cohort One, apply Card to Dismiss at every cohort, and refuse every other action or cohort as UnsupportedReviewKind."
        - "For every remaining NativeReadable kind, apply the exact other-kind action rows only at cohort One, apply Card to Dismiss at every cohort, and refuse every other action or cohort as UnsupportedReviewKind."
        - "Sort the 5600 cells by kind, optional role, action, cohort and payload discriminants; startup requires the count and one unique row per enumerated key."
    closed_rules:
      - "GroupIdentity uses exactly one non-null role kind; every other kind uses null role kind. A mismatch is IllegalRoleAxis or RoleKindMismatch."
      - "HistoryOnlyUnreadable maps every action to HistoryOnly; UnknownRole maps GroupIdentity actions to Refuse(UnknownRole), while GroupIdentity Dismiss remains Card and writes no key."
      - "AdoptedReadableNonKeyable is legal only for conflict Keep, Accept and Dismiss; it uses Card proof and resolves/cancels only that card. Other conflict actions refuse AdoptedConflictNeedsIdentityEdit."
      - "Every accepted nonabsorbing cell uses Card proof; every absorbing two-member cell uses Election proof; every other action/card pairing is Refuse(UnsupportedReviewKind)."
    group_identity_matrix:
      - { role: ReIdentify, action: GroupDifferentFromAll, legal_cohorts: [One, Two, Many], proof: Card, effect: apply_proposal_to_subject_retire_filled_slots, other_cohorts: "Refuse(UnsupportedReviewKind)" }
      - { role: ReIdentify, action: GroupAttachOrMerge, legal_cohorts: [Two], proof: Election, effect: apply_proposal_elect_absorb, other_cohorts: "Refuse(PairRequired)" }
      - { role: Incoming, action: GroupDifferentFromAll, legal_cohorts: [Zero, One, Two, Many], proof: Card, effect: create_only_after_every_member_certainly_different, other_cohorts: "not applicable" }
