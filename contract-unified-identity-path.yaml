metadata:
  feature: "unified-identity-path"
  spec_ref: "spec-unified-identity-path.md"
  ir_ref: "ir-v1-unified-identity-path.yaml"

module_dependency:
  - source: "livrarr-identity"
    forbidden_targets:
      - "livrarr-db"
      - "livrarr-metadata"
      - "livrarr-enrichment"
      - "livrarr-materialize"
      - "livrarr-server"
      - "livrarr-handlers"
    rationale: >
      The engine in livrarr-identity reaches the database ONLY through livrarr-domain
      traits (IdentityResolver, WorkIdentityRepository). It must not depend on
      livrarr-db (badge + anchor writes go through the domain trait, impl'd by
      SqliteDb), nor on the orchestration/enrichment crates (one-way
      identity -> enrichment, REQ-004). Authoritative check: cargo tree -p livrarr-identity.
  - source: "livrarr-domain"
    forbidden_targets:
      - "livrarr-db"
      - "livrarr-identity"
      - "livrarr-metadata"
      - "livrarr-enrichment"
      - "livrarr-server"
      - "livrarr-handlers"
    rationale: >
      domain is the sink of the dependency graph. The new IdentityMode /
      IdentityReport / ResolverVerdictKind types + the 2 new WorkIdentityRepository
      methods add NO upstream edge.

forbidden_pattern:
  - pattern: 'is_terminal_pending'
    description: "The engine must NOT call the legacy is_terminal_pending helper."
    severity: "P0"
    rationale: >
      ST-002 / Q-007: is_terminal_pending terminalizes NoCandidates, the exact bug
      being corrected. The engine maps the raw Resolution; ANY Unresolved (incl.
      NoCandidates) stays Pending + eligible to retry — never terminalized.
  - pattern: '(cover_url|description_html|set_cover|enrich_work|materialize_work|update_work_enrichment)'
    description: "The engine module must write NO enrichment/metadata payload."
    severity: "P0"
    rationale: >
      REQ-004 one-way invariant: identity flows to enrichment, never the reverse.
      settle_identity settles the badge + anchors and stops. (Reviewer-scoped to the
      identity-engine module; an unrelated match on these names elsewhere is exempt.)
  - pattern: 'set_identity_status\s*\([^)]*NotFound'
    description: "The engine must NEVER write IdentityStatus::NotFound."
    severity: "P1"
    rationale: >
      ST-004: NotFound has no live producer. The engine produces 5 states and only
      RESPECTS an existing NotFound row (REQ-006, a read-only terminal-guard match
      arm referencing IdentityStatus::NotFound is allowed). Writing NotFound is
      forbidden; there is no set_identity_notfound method by design.

reviewer_invariants:
  - "Monotonic, no-downgrade: settle_identity never lowers Confirmed->Provisional/Pending or re-opens a terminal (REQ-004/006/007). Not grep-checkable — verify by the verdict->badge mapping + the AC-008/AC-011 tests."
  - "Engine owns the write: the IdentityReport return is audit-only; no test/caller persists a badge from it (REQ-008/AC-013)."
  - "Faithful fixtures: behavioral tests drive the engine via real Resolution values + real starting badges, never injected end-states (feedback_faithful_fixtures_and_design_first)."
  - "Resolver matching UNCHANGED: the resolver-conflict-payload change extends ONLY the QuorumTie Conflict payload (expose every tied cluster's anchors — Q-008); run_quorum's clustering/quorum DECISION logic and provider fan-out are NOT altered (§4 keeps matching-logic changes out of scope). The added behavior must be: more is reported, the same is decided."
  - "ConflictSource threaded, not hardcoded: settle_identity takes `source` from the caller and passes it to detect_conflicting_anchors / raise_identity_conflict — the engine is shared by all doors so it must not assume a source (google-R-003 r1)."
