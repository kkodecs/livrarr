# Architectural Contract — metadata-refactor
# Machine-checkable rules enforced by the compliance gate (verify.py code + design).
# Minimal by design (P-E). Crate-boundary invariants that make the ONE-pipeline,
# ONE-home-per-policy architecture (P-D) structurally true, not conventional.
#
# ENFORCEMENT NOTE (read before trusting these to fire automatically):
#   * forbidden_pattern is a BLUNT global grep over ALL of source_dirs (crates/ + src/).
#     It is safe ONLY for strings that must appear NOWHERE. So the wall/canary/leaf rules
#     are expressed as module_dependency (path-scoped), NOT as `use livrarr_x` patterns
#     (those would false-positive on every legitimate consumer crate).
#   * module_dependency fires at the code gate via kk-build config.yaml `module_paths`.
#     Today module_paths maps only `enrichment` (+ two NONEXISTENT crates api/core).
#     >>> CODE-STAGE TODO: extend config.yaml module_paths to map every `source` below to
#         its crate `src` dir, and have the check match BOTH `livrarr-x` and `livrarr_x`
#         (use-statements use underscores). Until then these rules are documentary. <<<
#   * The AUTHORITATIVE canary/wall check is `cargo tree` (the crate-extraction playbook
#     GO-gate), per wiki: external-data/materialize/domain must list none of the forbidden
#     crates. The grep is a weak backstop; cargo tree is the real proof.

metadata:
  feature: metadata-refactor
  spec_ref: spec-metadata-refactor.md
  ir_ref: ir-v1-metadata-refactor.yaml

module_dependency:
  - source: livrarr-external-data
    forbidden_targets:
      - livrarr-db
      - livrarr-metadata
      - livrarr-enrichment
      - livrarr-identity
      - livrarr-materialize
    rationale: >-
      THE CANARY (carried from metadata-modularization REQ-006). external-data is the stateless
      dumb-pipe substrate: it depends ONLY on livrarr-domain + livrarr-http. The NEW persistent
      (work,provider) cache (REQ-009) is a livrarr-db impl injected via the domain MetadataCache
      trait — it does NOT live in external-data, so external-data stays DB-free. Any external-data
      -> db edge re-introduces the cycle the whole refactor exists to kill.

  - source: livrarr-materialize
    forbidden_targets:
      - livrarr-enrichment
      - livrarr-identity
      - livrarr-db
      - livrarr-metadata
      - livrarr-external-data
    rationale: >-
      The NEW save crate is a clean leaf (REQ-012, D-002/D-003). It depends ONLY on
      livrarr-domain + livrarr-http + livrarr-tagwrite. It must NOT depend on enrichment
      (failure isolation: a tag-write OOM cannot stall the pipeline; and one-home reuse:
      livrarr-library can call materialize without pulling the enrich/network/LLM stack).
      DB-free: the caller persists cover_path + the change generation. The POSITIVE allowed-deps
      (materialize -> {domain, http, tagwrite}) are in ir-v1 `crate_dependency_edges` (R-002 round 1),
      cargo-tree-verifiable; `cargo tree -p livrarr-materialize` must list none of the forbidden targets.

  - source: livrarr-handlers
    forbidden_targets:
      - livrarr-db
      - livrarr-metadata
      - livrarr-enrichment
      - livrarr-external-data
      - livrarr-identity
      - livrarr-tagwrite
      - livrarr-download
    rationale: >-
      The compile wall (insight 9b). The manual-import door funnels into the single pipeline via
      the EXISTING Has*-capability trait (binds the EnrichmentService / MaterializeService ports
      in livrarr-domain only), never by importing the implementation crates. Structurally prevents
      provider payloads (NormalizedWorkDetail) and the pipeline internals from leaking into handlers.

  - source: livrarr-domain
    forbidden_targets:
      - livrarr-db
      - livrarr-metadata
      - livrarr-enrichment
      - livrarr-external-data
      - livrarr-identity
      - livrarr-materialize
      - livrarr-tagwrite
      - livrarr-matching
      - livrarr-download
      - livrarr-library
      - livrarr-jobs
      - livrarr-handlers
      - livrarr-server
    rationale: >-
      Domain is the leaf (insight 1). This feature's NEW contracts — EnrichmentSeed, ProviderPolicy,
      the MetadataCache / PacingQueue / ProviderPolicySource / MaterializeService traits, and the
      EnrichmentOutcome value — add ZERO outward deps. Domain cannot name a db/provider/materialize
      type because it cannot depend on those crates (insight 9e); ports are traits the siblings impl.

  - source: deterministic-merge
    forbidden_targets:
      - livrarr-db
      - livrarr-http
      - livrarr-materialize
      - livrarr-identity
    rationale: >-
      The merge is PURE (REQ-004/005, P-C): no I/O, no DB write, no save, no network. R-003 round 1
      (gemini): enforce statically. CAVEATS that shape this rule (verified against code): (1) the merge
      LEGITIMATELY names livrarr-external-data (its input `NormalizedWorkDetail` is owned there) and
      livrarr-domain (ProviderPolicy/Work) — so those are NOT forbidden; purity is "no I/O", not "no type
      imports". (2) `LlmCaller` is a livrarr-DOMAIN trait, so it cannot be a forbidden_pattern (would hit
      domain). ENFORCEMENT: deterministic-merge is a MODULE inside livrarr-enrichment (which legitimately
      depends on db/http at the crate level). This rule fires ONLY once the merge is isolated to its own
      module dir (e.g. crates/livrarr-enrichment/src/merge/) and config.yaml module_paths maps
      `deterministic-merge` -> that dir; the DB-bridging helpers (build_apply_request, patch_work_update_field)
      stay with the pipeline, NOT in the merge subtree. The refactor isolates the merge anyway.

forbidden_pattern:
  - pattern: "try_reuse_cached_payloads"
    description: >-
      The cover-bug fork must be DELETED, not survive (REQ-001/REQ-012). This is the second
      enrichment road in work_service that reuses pre-add provider data and SKIPS the cover/save
      step — the originating bug. After cutover (D-008) there is ONE road (EnrichmentWorkflow ->
      materialize); this symbol must have zero occurrences in source.
    severity: P0
    rationale: "REQ-001 'no path may write metadata by any other route' + the deep-passes diagnosis (work_service.rs:2553). Verified present today; the code gate confirms it is gone."

  - pattern: "merge_impl_llm|LlmMergeResponse|LlmFieldSelection"
    description: >-
      The LLM override layer in the enrichment merge must be DELETED (REQ-005/D-010), not just unused.
      R-003 round 1 (codex): the surface is live in livrarr-enrichment today (lib.rs:21-46). These three
      symbols are merge-LLM-specific (distinct from livrarr-identity's llm_validator/llm_scraper and from
      the domain `LlmCaller` trait + external-data `LlmCallerImpl`), so the pattern is safe — it must have
      zero occurrences after cutover. (The merge's purity is also guarded by the deterministic-merge
      module_dependency above; this pattern is the symbol-level backstop for the no-LLM invariant.)
    severity: P1
    rationale: "REQ-005 / P-C (no LLM in enrichment) + spec §1 ('the merge has an LLM override layer'). Enforces the DELETION, not review-only — addresses codex R-003's 'do not rely on review alone'."

  - pattern: "INSERT OR REPLACE"
    description: >-
      Use INSERT ... ON CONFLICT (...) DO UPDATE SET for the NEW provider-policy table and the NEW
      (work,provider) cache table writes. Verified zero occurrences in crates/ today — keep it so.
    severity: P1
    rationale: "Insight 20: INSERT OR REPLACE is DELETE+INSERT in SQLite (rowid churn, FK cascade). Load-bearing for the cache (work FK) + policy rows."

# Invariants that CANNOT be a safe machine pattern — enforced by review + behavioral tests.
# Recorded here so the reviewer and the code-stage auditor check them explicitly.
review_enforced_invariants:
  - id: RE-001
    invariant: "ZERO LLM calls in the enrichment pipeline or the merge (REQ-005, P-C). The existing LLM override layer is DELETED (D-010)."
    why_not_grep: >-
      A BLANKET `llm` grep false-positives on livrarr-identity (legit LLM use) and on the domain
      `LlmCaller` trait. So the full invariant cannot be one global pattern. R-003 round 1 upgraded this
      from review-only to THREE machine layers below + review as catch-all.
    enforced_by: >-
      (1) forbidden_pattern `merge_impl_llm|LlmMergeResponse|LlmFieldSelection` — the merge-LLM symbols
      must be gone post-cutover (safe: merge-specific names). (2) the deterministic-merge module_dependency
      (no db/http/materialize) once the merge is isolated to its own subpath. (3) AC-003 behavioral test
      (a full enrichment completes with zero LLM calls). (4) reviewer check of the merge + gateway signatures.

  - id: RE-002
    invariant: "NEW migrations (provider-policy table, (work,provider) cache table) must NOT add CHECK(... IN (...)) enum constraints; enum validity is enforced in Rust (migration-pattern.md)."
    why_not_grep: >-
      The pattern CHECK\\s*\\(.+\\bIN\\b\\s*\\( hits 6 PRE-EXISTING migrations (001/017/020/026/039/040);
      a global forbidden_pattern would false-positive and fail the code gate on unrelated legacy files.
    enforced_by: "Reviewer inspects the new migration files only; altering a CHECK later requires a full table rebuild (impractical on the Pi target)."

  - id: RE-003
    invariant: "external-data has ZERO livrarr-db dependency; materialize has ZERO livrarr-enrichment dependency (the canary + the save-leaf)."
    why_not_grep: "module_dependency above is the declarative rule, but its grep backstop is weak until module_paths is fixed."
    enforced_by: "`cargo tree -p livrarr-external-data` and `cargo tree -p livrarr-materialize` (the crate-extraction playbook GO-gate) — neither may list any forbidden crate."
