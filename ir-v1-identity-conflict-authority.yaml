metadata:
  feature: identity-conflict-authority
  stage: v1-structural
  spec_ref: spec-identity-conflict-authority.md
  version: 1
  revision: r8
  revision_note: "r8 (pre-ratified design R3 amendment): declare the existing F2 settlement transaction owner required to connect the live route-authoritative conflict classifier to the sole runtime IdentityConflict mint."

system_architecture:
  components:
    - name: Identity authority API and UI
      description: Review cards, pairwise merge preview and execution, conflict actions, park actions, history, and undo.
      type: React client plus thin Axum handlers
    - name: Identity road
      description: The sole application road for same-book classification, the exhaustive action authorization table, stale-decision validation, and user or machine identity decisions.
      type: in-process Rust application service
    - name: Identity authority store
      description: Review-card history and membership, one transactional route plan, complete absorption records, the one Work-delete authority, dismissal keys, cutover, and legacy history reads.
      type: SQLite through livrarr-db
    - name: File reorganization
      description: One shared, blocking-safe, no-clobber move engine used by both forward absorption completion and undo completion, returning an item-complete result report.
      type: livrarr-library service
    - name: Activation gate
      description: Validates the supported build prefix, authorization and route tables, retention table, legacy adoption table, and schema-derived effect manifest; it is the sole mint of the sealed activation report, including the B0-B3 legacy-close permit branch, and runs the one-shot B4 authority cutover before serving requests.
      type: livrarr-db production function with a thin livrarr-server boot caller
    - name: Existing history observer
      description: Receives post-commit added drafts through the existing infallible HistoryService road; worksMerged alone remains an operation-owned transaction-fatal exception.
      type: existing livrarr-domain HistoryService implemented by livrarr-server over livrarr-db
    - name: SQLite database
      description: Existing user-scoped durable state for Works, routes, cards, operation records, histories, staging diagnostics, and the cutover marker.
      type: existing SQLite 3.45.1 datastore with foreign keys enabled
    - name: Library filesystem
      description: Existing user library tree containing the audio files whose canonical Work paths can change during absorption and undo.
      type: existing local or mounted filesystem
  connections:
    - from: Identity authority API and UI
      to: Identity road
      protocol: authenticated JSON/HTTP followed by domain-trait calls
      description: Every actionable read returns an opaque decision proof; every action echoes it.
    - from: Identity road
      to: Identity authority store
      protocol: compile-wall-safe domain repository trait implemented by the SQLite adapter
      description: The adapter owns every sqlx call and BEGIN IMMEDIATE transaction; route-changing actions enter the one route plan before mutation.
    - from: Identity road
      to: File reorganization
      protocol: injected domain service trait
      description: A committed absorption or database restore is followed by the shared simple file pass; database and filesystem work are not one transaction.
    - from: Activation gate
      to: Identity authority store
      protocol: typed startup checks and one BEGIN IMMEDIATE cutover transaction
      description: Startup fails closed on an incomplete effect manifest, an unsupported B0/B1 combination, or a failed all-or-nothing cutover; repository construction passes the sealed report to the delete authority as well as the absorption gate.
    - from: Identity road
      to: Existing history observer
      protocol: injected HistoryService::record after the create transaction commits
      description: Incoming DifferentFromAll submits exactly one added draft with the persisted add_source; the infallible observer cannot refuse or roll back creation.
    - from: Identity authority store
      to: SQLite database
      protocol: sqlx SQLite 3.45.1
      description: Foreign keys remain enabled; applied migrations are immutable and this feature begins at migration 087.
    - from: File reorganization
      to: Library filesystem
      protocol: spawn_blocking filesystem operations
      description: Exclusive destination creation, no-replace rename, copy-then-remove, record compare-and-set, and truthful per-item outcomes share one primitive.
  deployment:
    topology: Existing single Livrarr process, React bundle, library filesystem, and SQLite database; no new service or crate.
    notes: B0 is deliberately non-serving for absorption. B0 plus B1 is the first releasable prefix. Incomplete undo file work is resumed only by an explicit retry of that record, never by a startup owner or file-transition protocol.

languages:
  - language: Rust
    version: edition 2021
    usage: Domain contracts, identity-road orchestration, persistence, cutover, file reorganization, handlers, composition, and behavioral verification.
  - language: TypeScript
    version: "6.0"
    usage: Typed review, conflict, merge-preview, history, park, and undo client surfaces.
  - language: SQL
    version: SQLite 3.45.1
    usage: Additive migration 087, rebuilt history-preserving tables, indexes, triggers, and repository statements owned only by livrarr-db.

frameworks:
  - name: Axum
    version: "0.8"
    usage: Authenticated identity-review, merge, conflict, park, and undo endpoints.
  - name: React
    version: "19.2"
    usage: Decision-proof-bearing review, preview, conflict, park, history, and incomplete-undo UI.
  - name: TanStack Query
    version: "5.96"
    usage: Server-state reads, mutation invalidation, and explicit incomplete-undo retry.
  - name: Tokio
    version: "1"
    usage: Async service traits and spawn_blocking boundaries for every blocking filesystem operation.
  - name: SQLx
    version: "0.8"
    usage: SQLite migrations, schema inspection, and BEGIN IMMEDIATE write transactions.

approved_libraries:
  - name: serde
    version: "1"
    usage: Versioned review payloads, decision-proof payloads, mutation envelopes, and HTTP DTOs.
  - name: serde_json
    version: "1"
    usage: Versioned record envelopes, exact row images, diagnostic payloads, and persisted file reports.
  - name: chrono
    version: "0.4"
    usage: Card, operation, cutover, audit, and resolution timestamps.
  - name: thiserror
    version: "2"
    usage: Closed domain, repository, route-plan, cutover, and file-result error vocabularies.
  - name: trait-variant
    version: "0.1"
    usage: Send async identity-road, authority, repository, delete, and file-service traits.
  - name: sqlx
    version: "0.8"
    usage: Sole SQLite access in livrarr-db.
  - name: tokio
    version: "1"
    usage: Async orchestration and blocking-file isolation.
  - name: hmac
    version: "0.12"
    usage: Existing server-side authentication of opaque decision proofs.
  - name: sha2
    version: "0.10"
    usage: Existing digest primitive for decision snapshots and file identity checks.
  - name: data-encoding
    version: "2"
    usage: Existing URL-safe transport encoding for opaque authenticated proofs.
  - name: tempfile
    version: "3"
    usage: Existing cross-device copy staging inside the shared no-clobber file primitive.

modules:
  - name: identity_authority_contracts
    crate: livrarr-domain
    responsibility: Own the closed review, proof, absorption, undo, route-plan, cutover, and file-result vocabulary plus compile-wall-safe service traits.
    requirements: [REQ-002, REQ-004, REQ-006]
    build_units: [B0, B1, B2, B3, B4]
    dependencies: []
    public_api:
      types:
        - kind: enum
          name: ReviewKind
          fields:
            - { name: IdentityConflict, type: unit }
            - { name: PendingRoute, type: unit }
            - { name: GroupIdentity, type: unit }
            - { name: IdentityPark, type: unit }
            - { name: FieldResolution, type: unit }
            - { name: ContributorOrder, type: unit }
            - { name: EditionEvidence, type: unit }
            - { name: ImportIdentity, type: unit }
            - { name: MigrationRepair, type: unit }
            - { name: InvariantRepair, type: unit }
        - kind: enum
          name: SettlementReviewCard
          fields:
            - { name: IdentityConflict, type: ConflictCardPayloadV1 }
            - { name: PendingRoute, type: "{ work_id: WorkId, candidate: ParkedRouteCandidate }" }
            - { name: GroupIdentity, type: GroupIdentityPayloadV2 }
            - { name: IdentityPark, type: IdentityParkPayloadV1 }
            - { name: FieldResolution, type: "{ work_id: WorkId, evidence_ids: Vec<i64> }" }
            - { name: ContributorOrder, type: "{ work_id: WorkId, contributors: Vec<WorkContributor> }" }
            - { name: EditionEvidence, type: "{ edition_id: EditionId, evidence_ids: Vec<i64> }" }
            - { name: ImportIdentity, type: "{ work_id: Option<WorkId>, evidence: IdentityEvidenceBundle }" }
            - { name: MigrationRepair, type: "{ legacy_key: String, reason: String }" }
            - { name: InvariantRepair, type: "{ work_id: Option<WorkId>, invariant: String }" }
        - kind: enum
          name: GroupIdentityRole
          fields:
            - { name: ReIdentify, type: "{ work_id: WorkId, proposer: ProposalActor }" }
            - { name: Incoming, type: "{ add_source: WorkAddSource }" }
            - { name: MergeMembers, type: unit }
            - { name: None, type: unit }
            - { name: Unknown, type: unit }
        - kind: enum
          name: GroupIdentityRoleKind
          fields:
            - { name: ReIdentify, type: unit }
            - { name: Incoming, type: unit }
            - { name: MergeMembers, type: unit }
            - { name: None, type: unit }
            - { name: Unknown, type: unit }
        - kind: enum
          name: ProposalActor
          fields:
            - { name: User, type: unit }
            - { name: Machine, type: unit }
        - kind: enum
          name: ReviewActionKind
          fields:
            - { name: GroupDifferentFromAll, type: unit }
            - { name: GroupAttachOrMerge, type: unit }
            - { name: PendingRouteAffirm, type: unit }
            - { name: ConflictKeepExisting, type: unit }
            - { name: ConflictAcceptSeparate, type: unit }
            - { name: ConflictReplaceAnchor, type: unit }
            - { name: ConflictMerge, type: unit }
            - { name: Dismiss, type: unit }
            - { name: ParkChooseCandidate, type: unit }
            - { name: ParkDismiss, type: unit }
            - { name: FieldChoosePreservedValue, type: unit }
            - { name: FieldExplicitAbsence, type: unit }
            - { name: ContributorOrderResolve, type: unit }
            - { name: EditionChooseDirectEvidence, type: unit }
            - { name: EditionRetainUnknownOrAbsent, type: unit }
            - { name: EditionArchiveEmptyShell, type: unit }
            - { name: ImportCorrectedMetadataRetry, type: unit }
            - { name: ImportResolvingIdentifier, type: unit }
            - { name: ImportExplicitIdentityOrMinimum, type: unit }
            - { name: MigrationCorrectTypedValue, type: unit }
            - { name: MigrationAssignScopeAndOwner, type: unit }
            - { name: MigrationDiscardProvenNonIdentity, type: unit }
            - { name: InvariantRecompute, type: unit }
            - { name: InvariantSupplyMissingReference, type: unit }
            - { name: InvariantDiscardMalformedDerivedRow, type: unit }
        - kind: enum
          name: ReviewAction
          fields:
            - { name: GroupDifferentFromAll, type: unit }
            - { name: GroupAttachOrMerge, type: unit }
            - { name: PendingRouteAffirm, type: unit }
            - { name: ConflictKeepExisting, type: unit }
            - { name: ConflictAcceptSeparate, type: unit }
            - { name: ConflictReplaceAnchor, type: unit }
            - { name: ConflictMerge, type: unit }
            - { name: Dismiss, type: unit }
            - { name: ParkChooseCandidate, type: "{ candidate_digest: Digest }" }
            - { name: ParkDismiss, type: unit }
            - { name: FieldChoosePreservedValue, type: "{ evidence_id: i64 }" }
            - { name: FieldExplicitAbsence, type: unit }
            - { name: ContributorOrderResolve, type: "{ partition: Vec<ContributorPartition>, order: Vec<AuthorRef>, primary: AuthorRef }" }
            - { name: EditionChooseDirectEvidence, type: "{ evidence_id: i64 }" }
            - { name: EditionRetainUnknownOrAbsent, type: unit }
            - { name: EditionArchiveEmptyShell, type: unit }
            - { name: ImportCorrectedMetadataRetry, type: "{ evidence: IdentityEvidenceBundle }" }
            - { name: ImportResolvingIdentifier, type: "{ route: RouteKey }" }
            - { name: ImportExplicitIdentityOrMinimum, type: "{ choice: ImportIdentityChoice }" }
            - { name: MigrationCorrectTypedValue, type: "{ route: RouteKey }" }
            - { name: MigrationAssignScopeAndOwner, type: "{ route: RouteKey, owner: RouteOwner }" }
            - { name: MigrationDiscardProvenNonIdentity, type: "{ reason: String }" }
            - { name: InvariantRecompute, type: unit }
            - { name: InvariantSupplyMissingReference, type: "{ reference: WorkReference }" }
            - { name: InvariantDiscardMalformedDerivedRow, type: "{ reason: String }" }
        - kind: enum
          name: ConflictAction
          fields:
            - { name: KeepExisting, type: unit }
            - { name: AcceptSeparate, type: unit }
            - { name: ReplaceAnchor, type: unit }
            - { name: Merge, type: unit }
        - kind: enum
          name: ReviewResolutionKind
          fields:
            - { name: UserAction, type: ReviewActionKind }
            - { name: MachineCancellation, type: MachineCancellationReason }
            - { name: WorkDeleted, type: unit }
            - { name: LegacyRecorded, type: String }
        - kind: enum
          name: PayloadState
          fields:
            - { name: NativeReadable, type: unit }
            - { name: AdoptedReadableNonKeyable, type: unit }
            - { name: UnknownRole, type: unit }
            - { name: HistoryOnlyUnreadable, type: unit }
        - kind: enum
          name: CohortCardinality
          fields:
            - { name: Zero, type: unit }
            - { name: One, type: unit }
            - { name: Two, type: unit }
            - { name: Many, type: unit }
        - kind: enum
          name: RequiredDecisionProof
          fields:
            - { name: Card, type: unit }
            - { name: Election, type: unit }
            - { name: Refuse, type: RefusalReason }
            - { name: HistoryOnly, type: unit }
        - kind: struct
          name: ReviewAuthorizationCell
          fields:
            - { name: kind, type: ReviewKind }
            - { name: role_kind, type: "Option<GroupIdentityRoleKind>" }
            - { name: action, type: ReviewActionKind }
            - { name: cohort, type: CohortCardinality }
            - { name: payload_state, type: PayloadState }
            - { name: required_proof, type: RequiredDecisionProof }
        - kind: struct
          name: WorkAbsorption
          visibility: pub
          projection: "origin and actor are derived by derive_absorption_provenance from the closed RecordedAbsorptionRequest variant"
          fields:
            - { name: record_id, type: AbsorptionRecordId }
            - { name: user_id, type: UserId }
            - { name: survivor_work_id, type: WorkId }
            - { name: absorbed_work_ids, type: "Vec<WorkId>" }
            - { name: origin, type: AbsorptionOrigin }
            - { name: actor, type: AbsorptionActor }
            - { name: lifecycle, type: AbsorptionLifecycle }
            - { name: record_revision, type: i64 }
        - kind: enum
          name: ReviewCardPayloadV2
          fields:
            - { name: GroupIdentity, type: GroupIdentityPayloadV2 }
            - { name: IdentityConflict, type: ConflictCardPayloadV1 }
            - { name: IdentityPark, type: IdentityParkPayloadV1 }
            - { name: OpaqueLegacyConflict, type: OpaqueLegacyConflictPayloadV1 }
            - { name: ExistingKind, type: ExistingReviewPayload }
        - kind: enum
          name: ReviewCardDisplayPayload
          fields:
            - { name: GroupIdentity, type: GroupIdentityPayloadV2 }
            - { name: IdentityConflict, type: ConflictCardPayloadV1 }
            - { name: IdentityPark, type: IdentityParkPayloadV1 }
            - { name: OpaqueLegacyHistory, type: OpaqueLegacyHistoryView }
            - { name: ExistingKind, type: ExistingReviewPayload }
        - kind: struct
          name: OpaqueLegacyHistoryView
          fields:
            - { name: source_legacy_conflict_id, type: i64 }
            - { name: legacy_kind, type: String }
            - { name: legacy_source, type: String }
            - { name: resolution_notes, type: "Option<String>" }
            - { name: legacy_raised_at, type: String }
            - { name: legacy_resolved_at, type: "Option<String>" }
            - { name: history_only_reason, type: HistoryOnlyReason }
        - kind: struct
          name: GroupIdentityPayloadV2
          fields:
            - { name: role, type: GroupIdentityRole }
            - { name: work_ids, type: "Vec<WorkId>" }
            - { name: subject_work_id, type: "Option<WorkId>" }
            - { name: proposed_identity, type: "Option<WorkIdentityEvidence>" }
            - { name: merge_choices, type: "Vec<WorkKeyedFieldChoice>" }
            - { name: proposal_digest, type: "Option<Digest>" }
        - kind: enum
          name: LegacyConflictKind
          fields:
            - { name: IncomingDifferentOlKey, type: unit }
            - { name: IncomingDifferentGrKey, type: unit }
            - { name: IncomingDifferentHcKey, type: unit }
            - { name: OlRedirectCollision, type: unit }
            - { name: QuorumTie, type: unit }
        - kind: enum
          name: ContradictedRoute
          fields:
            - { name: Exact, type: RouteKey }
            - { name: NotApplicable, type: unit }
            - { name: UnknownLegacy, type: unit }
        - kind: struct
          name: ConflictCardPayloadV1
          fields:
            - { name: source_legacy_conflict_id, type: "Option<i64>" }
            - { name: class, type: IdentityConflictClass }
            - { name: kind, type: LegacyConflictKind }
            - { name: source, type: LegacyConflictSource }
            - { name: incoming, type: IncomingIdentitySnapshot }
            - { name: contradicted, type: ContradictedRoute }
            - { name: raised_work_id, type: WorkId }
            - { name: raised_at, type: DateTime<Utc> }
            - { name: raised_source_path, type: "Option<String>" }
            - { name: adopted, type: bool }
        - kind: struct
          name: OpaqueLegacyConflictPayloadV1
          fields:
            - { name: source_legacy_conflict_id, type: i64 }
            - { name: raw_user_id, type: i64 }
            - { name: raw_existing_work_id, type: i64 }
            - { name: raw_kind, type: String }
            - { name: raw_incoming_payload, type: String }
            - { name: raw_source, type: String }
            - { name: raw_source_path, type: "Option<String>" }
            - { name: raw_status, type: String }
            - { name: raw_resolution_action, type: "Option<String>" }
            - { name: raw_resolution_notes, type: "Option<String>" }
            - { name: raw_raised_at, type: String }
            - { name: raw_resolved_at, type: "Option<String>" }
            - { name: history_only_reason, type: HistoryOnlyReason }
        - kind: struct
          name: IdentityParkPayloadV1
          fields:
            - { name: work_id, type: WorkId }
            - { name: candidates, type: "Vec<ParkCandidateIdentity>" }
        - kind: struct
          name: ParkCandidateIdentity
          fields:
            - { name: normalized_identity, type: IdentityTitleTuple }
            - { name: primary_author_id, type: AuthorId }
            - { name: routes, type: "Vec<RouteKey>" }
            - { name: evidence_digest, type: Digest }
            - { name: informational_existing_work_id, type: "Option<WorkId>" }
        - kind: struct
          name: ParkCandidateQuestionKey
          fields:
            - { name: normalized_identity, type: IdentityTitleTuple }
            - { name: primary_author_id, type: AuthorId }
            - { name: routes, type: "Vec<RouteKey>" }
            - { name: evidence_digest, type: Digest }
        - kind: enum
          name: ReviewDismissalKeyV2
          fields:
            - { name: GroupIdentity, type: "{ user_id: UserId, role: GroupIdentityRole, cohort: Vec<WorkId>, proposal: Option<ProposalKey>, choices: Vec<WorkKeyedFieldChoice> }" }
            - { name: PendingRoute, type: "{ user_id: UserId, work_id: WorkId, route: RouteKey }" }
            - { name: EditionEvidence, type: "{ user_id: UserId, edition_id: EditionId }" }
            - { name: IdentityConflict, type: "{ user_id: UserId, work_id: WorkId, kind: LegacyConflictKind, incoming: IncomingIdentityKey, contradicted: ContradictedRouteKey, title: IdentityTitleTuple, primary_author_id: AuthorId, year: Option<i32> }" }
            - { name: IdentityPark, type: "{ user_id: UserId, work_id: WorkId, candidates: Vec<ParkCandidateQuestionKey> }" }
        - kind: sealed-proof
          name: DecisionProof
          constructor: identity_authority_application::issue_decision_proof only
          transport: "handler/client serialization and domain request decoding preserve opaque bytes and do not mint or authenticate a proof; verify_decision_proof must still authenticate it"
          fields:
            - { name: opaque, type: "private String" }
        - kind: enum
          name: DecisionProofPayload
          fields:
            - { name: Card, type: CardDecisionSnapshot }
            - { name: Election, type: ElectionDecisionSnapshot }
        - kind: struct
          name: CardDecisionSnapshot
          fields:
            - { name: user_id, type: UserId }
            - { name: card_id, type: ReviewCardId }
            - { name: card_version, type: i64 }
            - { name: authorization, type: ReviewAuthorizationCell }
            - { name: role, type: "Option<GroupIdentityRole>" }
            - { name: cohort_generations, type: "Vec<WorkGeneration>" }
            - { name: proposal_digest, type: "Option<Digest>" }
            - { name: route_plan, type: "Option<RoutePlan>" }
        - kind: enum
          name: ElectionDecisionContext
          fields:
            - { name: DirectPair, type: unit }
            - { name: ReviewCard, type: "{ card_id: ReviewCardId, card_version: i64, authorization: ReviewAuthorizationCell, role: Option<GroupIdentityRole>, proposal_digest: Option<Digest> }" }
        - kind: struct
          name: ElectionDecisionSnapshot
          fields:
            - { name: user_id, type: UserId }
            - { name: context, type: ElectionDecisionContext }
            - { name: pair, type: "[WorkId; 2]" }
            - { name: elected_survivor, type: WorkId }
            - { name: cohort_generations, type: "Vec<WorkGeneration>" }
            - { name: mergeable_fields, type: "Vec<FieldSnapshot>" }
            - { name: keep_from, type: "Vec<WorkKeyedFieldChoice>" }
            - { name: route_plan, type: RoutePlan }
        - kind: enum
          name: IdentityDistinctness
          fields:
            - { name: CertainlySame, type: unit }
            - { name: CertainlyDifferent, type: unit }
            - { name: Unsure, type: DistinctnessCause }
        - kind: enum
          name: IdentityAuthorityError
          fields:
            - { name: InvalidRequest, type: "{ field: String, reason: String }" }
            - { name: NotFound, type: unit }
            - { name: Forbidden, type: unit }
            - { name: StaleDecision, type: StaleDecisionDetail }
            - { name: Refused, type: RefusalReason }
            - { name: EffectManifestIncomplete, type: "Vec<UnclassifiedEffect>" }
            - { name: Storage, type: String }
      functions:
        - name: derive_card_cohort
          inputs:
            - { name: payload_work_ids, type: "&[WorkId]" }
            - { name: subject_work_id, type: "Option<WorkId>" }
          output: "Vec<WorkId>"
          errors: []
        - name: group_identity_role_kind
          inputs:
            - { name: role, type: "&GroupIdentityRole" }
          output: GroupIdentityRoleKind
          errors: []
        - name: review_authorization_table
          inputs: []
          output: "&'static [ReviewAuthorizationCell]"
          errors: []
        - name: validate_review_authorization_totality
          inputs:
            - { name: table, type: "&[ReviewAuthorizationCell]" }
          output: "Result<(), AuthorizationTableError>"
          errors: [MissingCell, DuplicateCell, IllegalRoleAxis, RoleKindMismatch, WrongProofClass]
        - name: dismissal_key_v2
          inputs:
            - { name: card, type: "&ReviewCard" }
          output: "Result<Option<ReviewDismissalKeyV2>, NonKeyableReason>"
          errors: [UnreadablePayload, UnknownRole, AdoptedRouteConflict]
        - name: derive_absorption_provenance
          constructs: AbsorptionProvenance
          mapping: "UserElection(ManualPair|ReviewContinuation, user_id, _) -> matching user origin, AbsorptionActor::User(user_id), and matching caller; MachineSnapshot(named origin, snapshot) -> the matching machine origin, MachineActor, and caller"
          inputs:
            - { name: request, type: "&RecordedAbsorptionRequest" }
          output: AbsorptionProvenance
          errors: []
  - name: identity_authority_services
    crate: livrarr-domain
    responsibility: Expose the only compile-wall-safe application, persistence, delete, and file-reorganization seams.
    requirements: [REQ-002, REQ-004, REQ-006]
    build_units: [B0, B1, B2, B3, B4]
    dependencies: [identity_authority_contracts]
    public_api:
      types:
        - kind: trait
          name: IdentityAuthorityService
          fields:
            - { name: list_review, type: "async (ReviewListQuery) -> Result<Vec<ReviewCardView>, IdentityAuthorityError>" }
            - { name: read_review, type: "async (UserId, ReviewCardId) -> Result<ReviewCardView, IdentityAuthorityError>" }
            - { name: preview_review, type: "async (ReviewPreviewRequest) -> Result<ReviewDecisionPreview, IdentityAuthorityError>" }
            - { name: resolve_review, type: "async (ReviewDecisionRequest) -> Result<ReviewDecisionOutcome, IdentityAuthorityError>" }
            - { name: preview_merge, type: "async (MergePreviewRequest) -> Result<MergePreview, IdentityAuthorityError>" }
            - { name: execute_merge, type: "async (MergeExecuteRequest) -> Result<AbsorptionOutcome, IdentityAuthorityError>" }
            - { name: undo_absorption, type: "async (UndoAbsorptionRequest) -> Result<UndoOutcome, IdentityAuthorityError>" }
            - { name: read_absorption, type: "async (UserId, AbsorptionRecordId) -> Result<AbsorptionView, IdentityAuthorityError>" }
        - kind: trait
          name: IdentityAuthorityRoad
          fields:
            - { name: list_review_snapshots, type: "async (ReviewListQuery) -> Result<Vec<ReviewCardReadSnapshot>, IdentityAuthorityError>" }
            - { name: read_review_snapshot, type: "async (UserId, ReviewCardId) -> Result<ReviewCardReadSnapshot, IdentityAuthorityError>" }
            - { name: preview_review, type: "async (ReviewPreviewRequest) -> Result<ReviewPreviewSnapshot, IdentityAuthorityError>" }
            - { name: resolve_review, type: "async (VerifiedReviewDecisionRequest) -> Result<ReviewDecisionOutcome, IdentityAuthorityError>" }
            - { name: preview_merge, type: "async (MergePreviewRequest) -> Result<MergePreviewSnapshot, IdentityAuthorityError>" }
            - { name: execute_merge, type: "async (VerifiedMergeExecuteRequest) -> Result<AbsorptionOutcome, IdentityAuthorityError>" }
            - { name: execute_settlement_auto_merge, type: "async (MachineAbsorptionSnapshot) -> Result<AbsorptionOutcome, IdentityAuthorityError>" }
            - { name: execute_dedup_residue_heal_absorption, type: "async (MachineAbsorptionSnapshot) -> Result<AbsorptionOutcome, IdentityAuthorityError>" }
            - { name: execute_article_duplicate_heal_absorption, type: "async (MachineAbsorptionSnapshot) -> Result<AbsorptionOutcome, IdentityAuthorityError>" }
            - { name: undo_absorption, type: "async (UndoAbsorptionRequest) -> Result<UndoOutcome, IdentityAuthorityError>" }
            - { name: read_absorption, type: "async (UserId, AbsorptionRecordId) -> Result<AbsorptionView, IdentityAuthorityError>" }
        - kind: trait
          name: IdentityAuthorityRepository
          fields:
            - { name: read_card_snapshot, type: "async (UserId, ReviewCardId) -> Result<ReviewCard, RepositoryError>" }
            - { name: list_review_cards, type: "async (ReviewListQuery) -> Result<Vec<ReviewCard>, RepositoryError>" }
            - { name: apply_nonabsorbing_decision, type: "async (VerifiedCardDecision) -> Result<ReviewDecisionOutcome, RepositoryError>" }
            - { name: execute_absorption, type: "async (RecordedAbsorptionRequest) -> Result<AbsorptionCommit, RepositoryError>" }
            - { name: restore_absorption, type: "async (UndoDatabaseRequest) -> Result<UndoDatabaseOutcome, RepositoryError>" }
            - { name: persist_file_report, type: "async (FileReportUpdate) -> Result<AbsorptionRecord, RepositoryError>" }
            - { name: read_absorption_view, type: "async (UserId, AbsorptionRecordId) -> Result<AbsorptionView, RepositoryError>" }
        - kind: trait
