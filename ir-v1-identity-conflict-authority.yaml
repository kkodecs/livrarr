        - name: "FileReorganizationService::complete_undo"
          inputs:
            - { name: request, type: UndoFileRequest }
          output: "Result<FileMoveReport, FileReorganizationError>"
          errors: [FileReorganizationError]

  - name: identity_authority_transaction
    crate: livrarr-db
    responsibility: Mint the only typed write-transaction capability for this feature, always from the shared BEGIN IMMEDIATE helper with foreign keys enabled.
    requirements: [REQ-002, REQ-004, REQ-006]
    build_units: [B0, B1, B2, B3, B4]
    dependencies: [identity_authority_contracts]
    public_api:
      types:
        - kind: sealed-capability
          name: ImmediateTransaction
          constructor: begin_identity_authority_write only
          fields:
            - { name: connection, type: "private sqlx::SqliteConnection" }
            - { name: immediate_mode, type: "private unit" }
      functions:
        - name: begin_identity_authority_write
          constructs: ImmediateTransaction
          inputs:
            - { name: pool, type: "&sqlx::SqlitePool" }
          output: "Result<ImmediateTransaction, RepositoryError>"
          errors: [RepositoryError]
        - name: commit_identity_authority_write
          inputs:
            - { name: tx, type: ImmediateTransaction }
          output: "Result<(), RepositoryError>"
          errors: [RepositoryError]

  - name: identity_authority_activation_contracts
    crate: livrarr-db
    responsibility: Own the DB-local sealed activation report and its build, marker, cutover, and pre-cutover capabilities without owning a constructor; SqliteIdentityAuthorityActivation::activate_identity_authority is their only mint.
    requirements: [REQ-002, REQ-004, REQ-006]
    build_units: [B0, B1, B2, B3, B4]
    dependencies: [identity_authority_contracts]
    public_api:
      types:
        - kind: sealed-capability-enum
          name: AbsorptionCapability
          visibility: pub(crate)
          constructor: "SqliteIdentityAuthorityActivation::activate_identity_authority only"
          fields:
            - { name: RefuseAll, type: "{ unit: BuildUnitPrefix, reason: String }", construction: "private to activation" }
            - { name: RecordedV1, type: RecordedAbsorptionPermit, construction: "private to activation" }
        - kind: sealed-capability
          name: RecordedAbsorptionPermit
          visibility: pub(crate)
          constructor: "SqliteIdentityAuthorityActivation::activate_identity_authority only after production validation"
          fields:
            - { name: constructor, type: "private to SqliteIdentityAuthorityActivation::activate_identity_authority after production validation" }
        - kind: sealed-capability
          name: ActivationReport
          visibility: "pub opaque outside livrarr-db; movable by the thin server boot wrapper"
          constructor: "SqliteIdentityAuthorityActivation::activate_identity_authority only"
          fields:
            - { name: validation, type: "private Digest" }
            - { name: build_prefix, type: BuildUnitPrefix, visibility: private }
            - { name: absorption_capability, type: AbsorptionCapability, visibility: "crate-private; identity_authority_repository read-only" }
            - { name: legacy_pre_cutover_write_permit, type: "Option<LegacyPreCutoverWritePermit>", visibility: "crate-private; work_delete read-only; Some only for B0-B3, None after B4" }
            - { name: manifest_digest, type: Digest, visibility: private }
            - { name: authorization_table_digest, type: Digest, visibility: private }
            - { name: route_coverage_digest, type: "Option<Digest>", visibility: private }
            - { name: retention_policy_digest, type: Digest, visibility: private }
            - { name: legacy_adoption_digest, type: Digest, visibility: private }
            - { name: cutover_report_digest, type: "Option<Digest>", visibility: private }
        - kind: sealed-request
          name: ConflictCutoverRequest
          visibility: pub(crate)
          constructor: "SqliteIdentityAuthorityActivation::activate_identity_authority only"
          fields:
            - { name: expected_marker_version, type: "private i64" }
            - { name: manifest_digest, type: "private Digest" }
            - { name: activation_id, type: "private Digest" }
        - kind: sealed-capability
          name: MarkerAbsent
          visibility: pub(crate)
          constructor: "SqliteIdentityAuthorityActivation::activate_identity_authority only; never inferred from _livrarr_meta"
          fields:
            - { name: constructor, type: "private unit" }
        - kind: sealed-capability
          name: LegacyPreCutoverWritePermit
          visibility: pub(crate)
          constructor: "SqliteIdentityAuthorityActivation::activate_identity_authority only for B0-B3"
          fields:
            - { name: marker_absent, type: "private MarkerAbsent" }
            - { name: build_prefix, type: BuildUnitPrefix }
        - kind: sealed-capability
          name: CutoverReadPermit
          visibility: pub(crate)
          constructor: "SqliteIdentityAuthorityActivation::activate_identity_authority only for B4"
          fields:
            - { name: marker_absent, type: "private MarkerAbsent" }
            - { name: activation_id, type: Digest }
      functions: []

  - name: review_card_store
    crate: livrarr-db
    responsibility: Own the sole card mint, one cohort projection, card history, V2 dismissal key persistence, card reads, resolution, cancellation, and pending-conflict projection.
    requirements: [REQ-002, REQ-006]
    build_units: [B0, B2, B4]
    dependencies: [identity_authority_contracts, identity_authority_transaction]
    public_api:
      types:
        - kind: struct
          name: ReviewCardWrite
          fields:
            - { name: user_id, type: UserId }
            - { name: subject_work_id, type: "Option<WorkId>" }
            - { name: origin, type: ReviewCardOrigin }
            - { name: payload, type: ReviewCardPayloadV2 }
            - { name: generation, type: i64 }
        - kind: struct
          name: ReviewCardMembership
          fields:
            - { name: card_id, type: ReviewCardId }
            - { name: user_id, type: UserId }
            - { name: work_id, type: WorkId }
            - { name: relation, type: CardMemberRelation }
            - { name: ordinal, type: i64 }
      functions:
        - name: mint_reuse_or_suppress_review_card_in_tx
          inputs:
            - { name: tx, type: "&mut ImmediateTransaction" }
            - { name: draft, type: ReviewCardWrite }
          output: "Result<CardMintOutcome, RepositoryError>"
          errors: [CrossTenantMember, DuplicateQuestion, UnreadablePayload, RepositoryError]
        - name: load_review_card
          inputs:
            - { name: user_id, type: UserId }
            - { name: card_id, type: ReviewCardId }
          output: "Result<ReviewCard, RepositoryError>"
          errors: [NotFound, RepositoryError]
        - name: cancel_cards_naming_works_in_tx
          inputs:
            - { name: tx, type: "&mut ImmediateTransaction" }
            - { name: user_id, type: UserId }
            - { name: work_ids, type: "&[WorkId]" }
            - { name: reason, type: MachineCancellationReason }
          output: "Result<Vec<ReviewCardId>, RepositoryError>"
          errors: [RepositoryError]
        - name: parked_by_conflicts
          inputs:
            - { name: user_id, type: UserId }
            - { name: work_id, type: WorkId }
          output: "Result<bool, RepositoryError>"
          errors: [RepositoryError]

  - name: route_plan
    crate: livrarr-db
    responsibility: Produce and apply the single authoritative route plan from locked live rows for every route-changing action and every absorption.
    requirements: [REQ-002, REQ-004, REQ-006]
    build_units: [B1, B2, B4]
    dependencies: [identity_authority_contracts, identity_authority_transaction]
    public_api:
      types:
        - kind: struct
          name: RoutePlanRequest
          fields:
            - { name: user_id, type: UserId }
            - { name: action, type: RouteChangingAction }
            - { name: cohort, type: "Vec<WorkId>" }
            - { name: elected_survivor, type: "Option<WorkId>" }
            - { name: proposal_routes, type: "Vec<WorkRoute>" }
            - { name: implicated_route, type: ContradictedRoute }
        - kind: enum
          name: RoutePlanError
          fields:
            - { name: ThirdOwner, type: ThirdOwnerConflict }
            - { name: SameProviderSlotContradiction, type: SameProviderContradiction }
            - { name: MissingIncomingRoute, type: IdentityProvider }
            - { name: UnknownContradictedRoute, type: unit }
            - { name: UnsupportedRouteTaxonomy, type: RouteKey }
            - { name: StaleRouteSnapshot, type: unit }
        - kind: struct
          name: RoutePlanCoverageCell
          fields:
            - { name: review_kind, type: "Option<ReviewKind>" }
            - { name: group_role_kind, type: "Option<GroupIdentityRoleKind>" }
            - { name: conflict_kind, type: "Option<LegacyConflictKind>" }
            - { name: action, type: RouteChangingAction }
            - { name: cohort, type: CohortCardinality }
            - { name: effect, type: RouteEffectClass }
        - kind: sealed-capability
          name: ValidatedRoutePlan
          constructor: plan_routes_in_tx only
          fields:
            - { name: plan, type: RoutePlan }
            - { name: validation, type: "private Digest" }
        - kind: enum
          name: RouteMatrixCoverageError
          fields:
            - { name: UnplannedRouteChangingCell, type: ReviewAuthorizationCell }
            - { name: DuplicatePlanner, type: RoutePlanCoverageCell }
      functions:
        - name: plan_routes_in_tx
          constructs: ValidatedRoutePlan
          inputs:
            - { name: tx, type: "&mut ImmediateTransaction" }
            - { name: request, type: RoutePlanRequest }
          output: "Result<ValidatedRoutePlan, RoutePlanError>"
          errors: [ThirdOwner, SameProviderSlotContradiction, MissingIncomingRoute, UnknownContradictedRoute, UnsupportedRouteTaxonomy, StaleRouteSnapshot]
        - name: apply_route_plan_in_tx
          inputs:
            - { name: tx, type: "&mut ImmediateTransaction" }
            - { name: plan, type: "&ValidatedRoutePlan" }
          output: "Result<RoutePlanReceipt, RoutePlanError>"
          errors: [StaleRouteSnapshot, RepositoryError]
        - name: route_plan_coverage_table
          inputs: []
          output: "&'static [RoutePlanCoverageCell]"
          errors: []
        - name: validate_route_matrix_totality
          inputs:
            - { name: authorization, type: "&[ReviewAuthorizationCell]" }
            - { name: coverage, type: "&[RoutePlanCoverageCell]" }
          output: "Result<(), RouteMatrixCoverageError>"
          errors: [UnplannedRouteChangingCell, DuplicatePlanner]

  - name: absorption_store
    crate: livrarr-db
    responsibility: Own the only absorption implementation, schema-derived effect manifest, complete sealed operation record, causal card withdrawals, generation claims, lineage rebasing, undo database restore, and worksMerged history anchor. It depends on work_delete only through the repository-supplied SqliteWorkDelete held privately by an open operation; it contains no raw DELETE FROM works statement.
    requirements: [REQ-004]
    build_units: [B0, B1, B3]
    dependencies: [identity_authority_contracts, identity_authority_activation_contracts, identity_authority_transaction, review_card_store, route_plan, work_delete]
    public_api:
      types:
        - kind: struct
          name: EffectManifest
          fields:
            - { name: schema_version, type: i64 }
            - { name: selectors, type: "Vec<EffectSelector>" }
            - { name: bare_pointers, type: "Vec<BarePointerRegistration>" }
            - { name: trigger_effects, type: "Vec<TriggerEffect>" }
            - { name: digest, type: Digest }
        - kind: sealed-capability
          name: OpenAbsorptionOperation
          constructor: open_absorption_operation only
          lifetime: "'delete borrows the repository's existing SqliteWorkDelete for exactly the open-operation scope"
          fields:
            - { name: operation_id, type: AbsorptionRecordId }
            - { name: caller, type: AbsorptionCaller }
            - { name: operation_writer, type: "private ImmediateTransaction" }
            - { name: route_plan, type: "private ValidatedRoutePlan" }
            - { name: work_delete, type: "private &'delete SqliteWorkDelete", source: "borrowed from SqliteIdentityAuthorityRepository.work_delete; never constructed by absorption_store" }
            - { name: manifest_digest, type: Digest }
        - kind: sealed-operation
          name: SealedAbsorptionOperation
          constructor: seal_absorption_operation only
          fields:
            - { name: transaction, type: ImmediateTransaction, visibility: private }
            - { name: commit, type: AbsorptionCommit, visibility: private }
        - kind: struct
          name: RetentionPolicyCell
          fields:
            - { name: record_version, type: RecordVersionClass }
            - { name: lifecycle, type: "Option<AbsorptionLifecycle>" }
            - { name: survivor_state, type: SurvivorRetentionState }
            - { name: cohort_state, type: CohortRetentionState }
            - { name: disposition, type: RecordRetentionDisposition }
        - kind: enum
          name: AbsorptionError
          fields:
            - { name: AbsorptionDisabled, type: RefusalReason }
            - { name: StaleDecision, type: StaleDecisionDetail }
            - { name: RoutePlan, type: RoutePlanError }
            - { name: WorkDelete, type: WorkDeleteError }
            - { name: IncompleteEffectClosure, type: "Vec<UnclassifiedEffect>" }
            - { name: SealMismatch, type: Digest }
            - { name: Repository, type: RepositoryError }
        - kind: enum
          name: RetentionPolicyError
          fields:
            - { name: MissingRetentionCell, type: String }
            - { name: DuplicateRetentionCell, type: RetentionPolicyCell }
            - { name: CorruptRetentionCell, type: RetentionPolicyCell }
      functions:
        - name: derive_effect_manifest
          inputs:
            - { name: pool, type: "&sqlx::SqlitePool" }
            - { name: registry, type: "&[BarePointerRegistration]" }
          output: "Result<EffectManifest, EffectManifestError>"
          errors: [UnclassifiedWorkReference, UnclassifiedTrigger, SelectorOverlap, MissingReversibleColumn]
        - name: absorb_work_into
          delete_path: "sole absorption-time caller of SqliteWorkDelete::delete_work_in_tx; borrows operation.work_delete and operation.operation_writer, and the singleton delete delegates to delete_work_set_in_tx"
          inputs:
            - { name: operation, type: "&mut OpenAbsorptionOperation<'_>" }
            - { name: absorbed_work_id, type: WorkId }
          output: "Result<(), AbsorptionError>"
          errors: [RoutePlanError, WorkDeleteError, IncompleteEffectClosure, RepositoryError]
        - name: seal_absorption_operation
          constructs: SealedAbsorptionOperation
          inputs:
            - { name: operation, type: "OpenAbsorptionOperation<'_>" }
          output: "Result<SealedAbsorptionOperation, AbsorptionError>"
          errors: [IncompleteEffectClosure, SealMismatch, RepositoryError]
        - name: commit_sealed_absorption_operation
          consumes: SealedAbsorptionOperation
          inputs:
            - { name: sealed, type: SealedAbsorptionOperation }
          output: "Result<AbsorptionCommit, AbsorptionError>"
          errors: [RepositoryError]
        - name: restore_absorption_in_tx
          inputs:
            - { name: tx, type: "&mut ImmediateTransaction" }
            - { name: request, type: UndoDatabaseRequest }
            - { name: manifest, type: "&EffectManifest" }
          output: "Result<UndoDatabaseOutcome, UndoError>"
          errors: [NotFound, PreFeatureRecord, StaleAfterImage, LineageConflict, IncompleteEffectClosure, RepositoryError]
        - name: persist_file_report
          transaction: "begin_identity_authority_write -> one report/revision update -> commit_identity_authority_write"
          inputs:
            - { name: update, type: FileReportUpdate }
          output: "Result<AbsorptionRecord, RepositoryError>"
          errors: [NotFound, StaleRecordVersion, RepositoryError]
        - name: read_absorption_view
          inputs:
            - { name: user_id, type: UserId }
            - { name: record_id, type: AbsorptionRecordId }
          output: "Result<AbsorptionView, RepositoryError>"
          errors: [NotFound, RepositoryError]
        - name: retention_policy_table
          inputs: []
          output: "&'static [RetentionPolicyCell]"
          errors: []
        - name: validate_retention_policy_totality
          inputs:
            - { name: table, type: "&[RetentionPolicyCell]" }
          output: "Result<(), RetentionPolicyError>"
          errors: [MissingRetentionCell, DuplicateRetentionCell, CorruptRetentionCell]
    crate_private_api:
      functions:
        - name: open_absorption_operation
          caller: identity_authority_repository only, after consulting its held ActivationReport; it moves the transaction and borrows its existing work_delete field, retaining no raw writer
          constructs: OpenAbsorptionOperation
          inputs:
            - { name: tx, type: ImmediateTransaction }
            - { name: work_delete, type: "&'delete SqliteWorkDelete", source: "exactly &SqliteIdentityAuthorityRepository.work_delete" }
            - { name: permit, type: "&RecordedAbsorptionPermit" }
            - { name: request, type: RecordedAbsorptionRequest }
            - { name: route_plan, type: ValidatedRoutePlan }
            - { name: manifest, type: "&EffectManifest" }
          output: "Result<OpenAbsorptionOperation<'delete>, AbsorptionError>"
          errors: [AbsorptionDisabled, StaleDecision, RoutePlanError, RepositoryError]

  - name: work_delete
    crate: livrarr-db
    responsibility: Own the production tree's exactly one raw DELETE FROM works statement in delete_work_set_in_tx. Exactly one SqliteWorkDelete is constructed for a repository from the sealed ActivationReport; it retains that report, uses its optional LegacyPreCutoverWritePermit for the pre-B4 machine close, and skips the close when the post-B4 report field is None. User, ImportRollback, and ListImportRollback use that authority in their transaction scopes; execute_absorption lends the same repository instance to OpenAbsorptionOperation, whose absorb_work_into calls delete_work_in_tx with the private operation writer. delete_work_in_tx delegates a singleton set, so the four origins reach one statement, which withdraws cards before deletion, retains card history, and terminalizes v2 staging diagnostics.
    requirements: [REQ-006]
    build_units: [B0, B1, B4]
    dependencies: [identity_authority_contracts, identity_authority_services, identity_authority_activation_contracts, identity_authority_transaction, review_card_store, legacy_identity_conflict_history]
    public_api:
      types:
        - kind: struct
          name: SqliteWorkDelete
          visibility: pub(crate)
          construction: "exactly one per SqliteIdentityAuthorityRepository, returned only by new_work_delete_authority; absorption borrows that instance and never mints another"
          fields:
            - { name: activation_report, type: "private Arc<ActivationReport>" }
      functions:
        - name: new_work_delete_authority
          visibility: pub(crate)
          caller: new_identity_authority_repository only
          inputs:
            - { name: activation_report, type: "Arc<ActivationReport>" }
          output: SqliteWorkDelete
          errors: []
        - name: "SqliteWorkDelete::delete_work"
          transaction: "begin_identity_authority_write -> delete_work_in_tx -> commit_identity_authority_write"
          inputs:
            - { name: self, type: "&SqliteWorkDelete" }
            - { name: request, type: DeleteWorkRequest }
          output: "Result<DeleteWorkOutcome, WorkDeleteError>"
          errors: [CrossTenantWork, PendingCardCancellationFailed, ConflictCloseFailed, RepositoryError]
        - name: "SqliteWorkDelete::delete_work_set"
          transaction: "begin_identity_authority_write -> delete_work_set_in_tx -> commit_identity_authority_write"
          inputs:
            - { name: self, type: "&SqliteWorkDelete" }
            - { name: request, type: DeleteWorkSetRequest }
          output: "Result<DeleteWorkOutcome, WorkDeleteError>"
          errors: [CrossTenantWork, PendingCardCancellationFailed, ConflictCloseFailed, RepositoryError]
        - name: "SqliteWorkDelete::delete_work_in_tx"
          absorption_caller: "absorption_store::absorb_work_into only, through OpenAbsorptionOperation.work_delete and OpenAbsorptionOperation.operation_writer"
          inputs:
            - { name: self, type: "&SqliteWorkDelete" }
            - { name: tx, type: "&mut ImmediateTransaction" }
            - { name: request, type: DeleteWorkRequest }
          output: "Result<DeleteWorkOutcome, WorkDeleteError>"
          errors: [CrossTenantWork, PendingCardCancellationFailed, ConflictCloseFailed, RepositoryError]
        - name: "SqliteWorkDelete::delete_work_set_in_tx"
          absorption_path: "reached only through delete_work_in_tx's singleton delegation; absorption_store owns no physical Work-delete SQL"
          legacy_close_branch: "Some(&LegacyPreCutoverWritePermit) calls close_legacy_conflicts_for_work_delete_in_tx; None skips it and issues no legacy-table write"
          inputs:
            - { name: self, type: "&SqliteWorkDelete" }
            - { name: tx, type: "&mut ImmediateTransaction" }
            - { name: legacy_pre_cutover_write_permit, type: "Option<&LegacyPreCutoverWritePermit>", source: "exactly self.activation_report.legacy_pre_cutover_write_permit.as_ref()" }
            - { name: request, type: DeleteWorkSetRequest }
          output: "Result<DeleteWorkOutcome, WorkDeleteError>"
          errors: [CrossTenantWork, PendingCardCancellationFailed, ConflictCloseFailed, RepositoryError]

  - name: legacy_identity_conflict_history
    crate: livrarr-db
    responsibility: Contain every legacy-table SQL statement; typed marker-absent capabilities gate the B0-B3 close and B4 cutover scan, leaving exactly the read-only history statement reachable after the marker.
    requirements: [REQ-006]
    build_units: [B0, B4]
    dependencies: [identity_authority_contracts, identity_authority_activation_contracts, identity_authority_transaction]
    public_api:
      types:
        - kind: struct
          name: LegacyConflictHistoryRow
          fields:
            - { name: id, type: i64 }
            - { name: user_id, type: UserId }
            - { name: existing_work_id, type: WorkId }
            - { name: raw_kind, type: String }
            - { name: raw_payload, type: String }
            - { name: raw_source, type: String }
            - { name: raised_source_path, type: "Option<String>" }
            - { name: raw_status, type: String }
            - { name: resolution_action, type: "Option<LegacyConflictResolutionAction>" }
            - { name: raw_resolution_action, type: "Option<String>" }
            - { name: resolution_notes, type: "Option<String>" }
            - { name: timestamps, type: LegacyConflictTimestamps }
      functions:
        - name: read_legacy_conflict_history
          inputs:
            - { name: user_id, type: UserId }
            - { name: conflict_id, type: i64 }
          output: "Result<LegacyConflictHistoryRow, RepositoryError>"
          errors: [NotFound, RepositoryError]
    crate_private_api:
      functions:
        - name: close_legacy_conflicts_for_work_delete_in_tx
          caller: SqliteWorkDelete::delete_work_set_in_tx only
          availability: B0-B3 serving prefixes only; its marker-absent write permit is never issued after B4
          inputs:
            - { name: tx, type: "&mut ImmediateTransaction" }
            - { name: permit, type: "&LegacyPreCutoverWritePermit" }
            - { name: user_id, type: UserId }
            - { name: work_ids, type: "&[WorkId]" }
          output: "Result<Vec<LegacyConflictHistoryRow>, RepositoryError>"
          errors: [PostCutoverWriteForbidden, RepositoryError]
        - name: scan_legacy_conflicts_for_cutover_in_tx
          caller: run_conflict_authority_cutover_in_activation_tx only
          availability: B4 activation transaction with marker absent only
          inputs:
            - { name: tx, type: "&mut ImmediateTransaction" }
            - { name: permit, type: "&CutoverReadPermit" }
          output: "Result<Vec<LegacyConflictHistoryRow>, RepositoryError>"
          errors: [InvalidCutoverPermit, RepositoryError]

  - name: conflict_cutover
    crate: livrarr-db
    responsibility: Own B4's once-only all-or-nothing adoption, v2 diagnostic counting, corrected undo translation, post-marker access guard, and total legacy mapping.
    requirements: [REQ-006]
    build_units: [B0, B1, B4]
    dependencies: [identity_authority_contracts, identity_authority_activation_contracts, identity_authority_transaction, review_card_store, absorption_store, legacy_identity_conflict_history]
    public_api:
      types:
        - kind: sealed-report
          name: ConflictCutoverReport
          visibility: pub(crate)
          constructor: run_conflict_authority_cutover_in_activation_tx only
          fields:
            - { name: marker_version, type: i64 }
            - { name: adoption_counts, type: "Vec<LegacyAdoptionCount>" }
            - { name: adopted_pending, type: u64 }
            - { name: adopted_resolved, type: u64 }
            - { name: adopted_cancelled, type: u64 }
            - { name: work_deleted_history, type: u64 }
            - { name: non_keyable_route_conflicts, type: u64 }
            - { name: history_only, type: u64 }
            - { name: extra_pointer_cards_cancelled, type: u64 }
            - { name: pointer_cards_without_row_cancelled, type: u64 }
            - { name: translated_absorption_records, type: u64 }
            - { name: park_cards_backfilled, type: u64 }
            - { name: v2_pending, type: u64 }
            - { name: v2_current_diagnostics, type: u64 }
            - { name: inert_v1_group_dismissals, type: u64 }
            - { name: report_digest, type: Digest }
        - kind: struct
          name: LegacyAdoptionCell
          fields:
            - { name: subject, type: LegacySubjectValidity }
            - { name: payload, type: LegacyPayloadValidity }
            - { name: keyability, type: LegacyKeyability }
            - { name: status, type: LegacyConflictStatus }
            - { name: close_provenance, type: LegacyCloseProvenance }
            - { name: disposition, type: LegacyAdoptionDisposition }
        - kind: struct
          name: LegacyAdoptionCount
          fields:
            - { name: cell, type: LegacyAdoptionCell }
            - { name: count, type: u64 }
        - kind: enum
          name: LegacyAdoptionTableError
          fields:
            - { name: MissingAdoptionCell, type: String }
            - { name: DuplicateAdoptionCell, type: LegacyAdoptionCell }
            - { name: IllegalLedgerEffect, type: LegacyAdoptionCell }
      functions:
        - name: effective_v2_diagnostic_currentness
          inputs:
            - { name: diagnostic, type: "&StagingConflictDiagnostic" }
            - { name: operation, type: "Option<&AbsorptionRecord>" }
          output: bool
          errors: []
        - name: legacy_adoption_table
          inputs: []
          output: "&'static [LegacyAdoptionCell]"
          errors: []
        - name: validate_legacy_adoption_totality
          inputs:
            - { name: table, type: "&[LegacyAdoptionCell]" }
          output: "Result<(), LegacyAdoptionTableError>"
          errors: [MissingAdoptionCell, DuplicateAdoptionCell, IllegalLedgerEffect]
    crate_private_api:
      functions:
        - name: run_conflict_authority_cutover_in_activation_tx
          caller: SqliteIdentityAuthorityActivation::activate_identity_authority only
          constructs: ConflictCutoverReport
          inputs:
            - { name: tx, type: "&mut ImmediateTransaction" }
            - { name: permit, type: CutoverReadPermit }
            - { name: request, type: ConflictCutoverRequest }
          output: "Result<ConflictCutoverReport, ConflictCutoverError>"
          errors: [PointerCensusMismatch, TranslationPolarityMismatch, CountMismatch, RepositoryError]

  - name: identity_authority_repository
    crate: livrarr-db
    responsibility: Implement IdentityAuthorityRepository by composing the sole card, route-plan, absorption, delete, legacy-history, and conflict-state authorities inside one ImmediateTransaction per action; also house the existing SQLite identity-clear, F2 settlement, runtime-conflict, and claimed-completion adapters that consume the same card authority without exposing another seam. execute_absorption moves that writer and a borrow of the repository's existing SqliteWorkDelete into OpenAbsorptionOperation; after open the repository retains neither a raw writer nor a second delete authority.
    requirements: [REQ-002, REQ-004, REQ-006]
    build_units: [B0, B1, B2, B3, B4]
    dependencies: [identity_authority_contracts, identity_authority_services, identity_authority_activation_contracts, identity_authority_transaction, review_card_store, route_plan, absorption_store, work_delete, legacy_identity_conflict_history, conflict_cutover]
    public_api:
      types:
        - kind: struct
          name: SqliteIdentityAuthorityRepository
          transaction_ownership: "each mutating IdentityAuthorityRepository method calls begin_identity_authority_write and commits exactly once; execute_absorption moves the resulting capability into open_absorption_operation together with &self.work_delete, so only the open operation can lend the writer to the one delete authority until seal"
          fields:
            - { name: pool, type: "private sqlx::SqlitePool" }
            - { name: effect_manifest, type: "private Arc<EffectManifest>" }
            - { name: activation_report, type: "private Arc<ActivationReport>" }
            - { name: work_delete, type: "private SqliteWorkDelete" }
      functions:
        - name: new_identity_authority_repository
          construction: "wrap ActivationReport in Arc, retain one Arc on the repository, and pass an Arc clone to new_work_delete_authority"
          inputs:
            - { name: pool, type: "sqlx::SqlitePool" }
            - { name: effect_manifest, type: "Arc<EffectManifest>" }
            - { name: activation_report, type: ActivationReport }
          output: SqliteIdentityAuthorityRepository
          errors: []
    crate_private_api:
      functions:
        - name: apply_identity_clear
          caller: "existing WorkIdentityRepository::apply_identity_clear implementation; clear_identity_slot transports its result"
          inputs:
            - { name: self, type: "&SqliteDb" }
            - { name: work_id, type: WorkId }
            - { name: user_id, type: UserId }
            - { name: slot, type: AnchorType }
          output: "Result<ClearedSlot, IdentityEditError>"
          errors: [IdentityEditError]
        - name: raise_identity_conflict_in_tx
          caller: "commit_settlement_in_tx on the live F2 road; raise_identity_conflict and the claimed-completion path remain pre-cutover compatibility callers; conn is borrowed from the caller's already-open immediate write transaction"
          inputs:
            - { name: conn, type: "&mut SqliteConnection" }
            - { name: conflict, type: "&NewIdentityConflict" }
          output: "Result<i64, sqlx::Error>"
          errors: [sqlx::Error]
        - name: commit_settlement_in_tx
          caller: "persist_settlement plus the existing settle_manual_import_minimum attach/create arms; the live F2 IdentityRoadServiceImpl::settle reaches persist_settlement through commit_settlement_with_review_context"
          inputs:
            - { name: tx, type: "&mut sqlx::Transaction<'static, sqlx::Sqlite>" }
            - { name: command, type: "&SettlementCommit" }
            - { name: origin, type: ReviewCardMintOrigin }
            - { name: validated_explicit_choice, type: bool }
          output: "Result<SettlementTxResult, IdentityRepositoryError>"
          errors: [IdentityRepositoryError]
        - name: complete_anchors
          caller: "existing WorkIdentityRepository::complete_anchors implementation; route-authoritative convergence supplies IdentityPark completion through this seam, while the existing async-resolver caller is pre-cutover compatibility only"
          inputs:
            - { name: self, type: "&SqliteDb" }
            - { name: work_id, type: WorkId }
            - { name: expected_generation, type: i64 }
            - { name: completion, type: IdentityCompletion }
          output: "Result<IdentityCompletionOutcome, WorkIdentityError>"
          errors: [WorkIdentityError]

  - name: identity_road
    crate: livrarr-metadata
    responsibility: Run the same-book rule inside the one identity road, authorize every typed continuation, construct pairwise elections, coordinate DB-first then file completion, hand a committed Incoming create to the existing infallible HistoryService observer without making that observer part of create success, carry a route-authoritative same-provider contradiction into the existing F2 settlement transaction, and own the existing convergence function's route-authoritative post-B4 park trigger through its existing database repository trait.
    requirements: [REQ-002, REQ-004, REQ-006]
    build_units: [B0, B1, B2, B3, B4]
    dependencies: [identity_authority_contracts, identity_authority_services]
    public_api:
      types:
        - kind: struct
          name: IdentityRoad
          fields:
            - { name: repository, type: "Arc<R> where R: IdentityAuthorityRepository" }
            - { name: files, type: "Arc<F> where F: FileReorganizationService" }
            - { name: history, type: "Arc<H> where H: HistoryService" }
      functions:
        - name: new_identity_road
          inputs:
            - { name: repository, type: "Arc<R> where R: IdentityAuthorityRepository" }
            - { name: files, type: "Arc<F> where F: FileReorganizationService" }
            - { name: history, type: "Arc<H> where H: HistoryService" }
          output: "IdentityRoad<R, F, H>"
          errors: []
        - name: classify_identity_distinctness
          inputs:
            - { name: proposal, type: "&WorkIdentityEvidence" }
            - { name: member, type: "&CapturedIdentity" }
          output: IdentityDistinctness
          errors: []
        - name: list_review_snapshots
          inputs:
            - { name: query, type: ReviewListQuery }
          output: "Result<Vec<ReviewCardReadSnapshot>, IdentityAuthorityError>"
          errors: [Storage]
        - name: read_review_snapshot
          inputs:
            - { name: user_id, type: UserId }
            - { name: card_id, type: ReviewCardId }
          output: "Result<ReviewCardReadSnapshot, IdentityAuthorityError>"
          errors: [NotFound, Forbidden, Storage]
        - name: preview_review
          inputs:
            - { name: request, type: ReviewPreviewRequest }
          output: "Result<ReviewPreviewSnapshot, IdentityAuthorityError>"
          errors: [NotFound, Forbidden, Refused, EffectManifestIncomplete, Storage]
        - name: resolve_review
          absorbing_request: "only an accepted absorbing card action constructs UserElection { origin: ReviewContinuation { card_id }, user_id, decision }; nonabsorbing actions construct no absorption request"
          inputs:
            - { name: request, type: VerifiedReviewDecisionRequest }
          output: "Result<ReviewDecisionOutcome, IdentityAuthorityError>"
          errors: [StaleDecision, Refused, EffectManifestIncomplete, Storage]
        - name: preview_merge
          inputs:
            - { name: request, type: MergePreviewRequest }
          output: "Result<MergePreviewSnapshot, IdentityAuthorityError>"
          errors: [InvalidRequest, NotFound, Refused, Storage]
        - name: execute_merge
          absorbing_request: "construct UserElection { origin: ManualPair, user_id, decision }; no caller supplies a unified origin or actor"
          inputs:
            - { name: request, type: VerifiedMergeExecuteRequest }
          output: "Result<AbsorptionOutcome, IdentityAuthorityError>"
          errors: [StaleDecision, Refused, EffectManifestIncomplete, Storage]
        - name: execute_settlement_auto_merge
          absorbing_request: "construct MachineSnapshot { origin: SettlementAutoMerge, snapshot }; the named wrapper fixes the origin"
          inputs:
            - { name: snapshot, type: MachineAbsorptionSnapshot }
          output: "Result<AbsorptionOutcome, IdentityAuthorityError>"
          errors: [StaleDecision, Refused, EffectManifestIncomplete, Storage]
        - name: execute_dedup_residue_heal_absorption
          absorbing_request: "construct MachineSnapshot { origin: DedupResidueHeal, snapshot }; the named wrapper fixes the origin"
          inputs:
            - { name: snapshot, type: MachineAbsorptionSnapshot }
          output: "Result<AbsorptionOutcome, IdentityAuthorityError>"
          errors: [StaleDecision, Refused, EffectManifestIncomplete, Storage]
        - name: execute_article_duplicate_heal_absorption
          absorbing_request: "construct MachineSnapshot { origin: ArticleDuplicateHeal, snapshot }; the named wrapper fixes the origin"
          inputs:
            - { name: snapshot, type: MachineAbsorptionSnapshot }
          output: "Result<AbsorptionOutcome, IdentityAuthorityError>"
          errors: [StaleDecision, Refused, EffectManifestIncomplete, Storage]
        - name: undo_absorption
          inputs:
            - { name: request, type: UndoAbsorptionRequest }
          output: "Result<UndoOutcome, IdentityAuthorityError>"
          errors: [NotFound, StaleDecision, Refused, EffectManifestIncomplete, Storage]
        - name: read_absorption
          inputs:
            - { name: user_id, type: UserId }
            - { name: record_id, type: AbsorptionRecordId }
          output: "Result<AbsorptionView, IdentityAuthorityError>"
          errors: [NotFound, Forbidden, Storage]
    crate_private_api:
      functions:
        - name: verify_card_decision
          caller: IdentityRoad::resolve_review only
          constructs: VerifiedCardDecision
          inputs:
            - { name: self, type: "&IdentityRoad<R, F, H>" }
            - { name: request, type: "&VerifiedReviewDecisionRequest" }
          output: "Result<VerifiedCardDecision, IdentityAuthorityError>"
          errors: [StaleDecision, Refused, Storage]
        - name: verify_election_decision
          caller: IdentityRoad::resolve_review or IdentityRoad::execute_merge only
          constructs: VerifiedElectionDecision
          inputs:
            - { name: self, type: "&IdentityRoad<R, F, H>" }
            - { name: user_id, type: UserId }
            - { name: snapshot, type: ElectionDecisionSnapshot }
          output: "Result<VerifiedElectionDecision, IdentityAuthorityError>"
          errors: [StaleDecision, Refused, Storage]
        - name: observe_created_distinct_added
          caller: IdentityRoad::resolve_review only, after the repository has committed CreatedDistinct
          observer: "call the injected infallible HistoryService::record exactly once with history_events::added and the persisted CreatedDistinctOutcome.add_source"
          inputs:
            - { name: self, type: "&IdentityRoad<R, F, H>" }
            - { name: user_id, type: UserId }
            - { name: created, type: "&CreatedDistinctOutcome" }
          output: unit
          errors: []
        - name: converge_work
          caller: "WorkService::converge_work thin wrapper only"
          generic_bounds:
            - "D: WorkDb + WorkDbCreate + AuthorDb + LibraryItemDb + GrabDb + ProvenanceDb + EnrichmentRetryDb + livrarr_db::ProviderRetryStateDb + ConfigDb + livrarr_db::SeriesDb + livrarr_db::HistoryDb + livrarr_db::AuthorLinkDb + livrarr_domain::services::WorkIdentityRepository + livrarr_domain::identity_layer::WorkIdentityRepository + Send + Sync"
            - "E: EnrichmentWorkflow + Send + Sync"
            - "H: HttpFetcher + Clone + Send + Sync + 'static"
          inputs:
            - { name: svc, type: "&WorkServiceImpl<D, E, H>" }
            - { name: user_id, type: UserId }
            - { name: work_id, type: WorkId }
            - { name: threshold, type: u32 }
            - { name: source_provider_data, type: "Option<SourceProviderData>" }
          output: "Result<ConvergencePass, WorkServiceError>"
          errors: [WorkServiceError]

  - name: library_item_path_store
    crate: livrarr-db
    responsibility: Own the user-scoped LibraryItem path reads and the sole expected-path compare-and-set update used by the no-clobber reorganization result seam; library_items gains no revision column.
    requirements: [REQ-004]
    build_units: [B1, B3]
    dependencies: [identity_authority_contracts, identity_authority_transaction]
    public_api:
      types: []
      functions:
        - name: list_work_item_paths
          inputs:
            - { name: user_id, type: UserId }
            - { name: work_ids, type: "&[WorkId]" }
          output: "Result<Vec<LibraryItemPathSnapshot>, RepositoryError>"
          errors: [RepositoryError]
        - name: compare_and_set_item_path
          transaction: "begin_identity_authority_write -> one user/item/expected-path update -> commit_identity_authority_write"
          inputs:
            - { name: user_id, type: UserId }
            - { name: item_id, type: LibraryItemId }
            - { name: expected_path, type: "&Path" }
            - { name: new_path, type: "&Path" }
          output: "Result<PathCompareAndSetOutcome, RepositoryError>"
          errors: [RepositoryError]

  - name: file_reorganization
    crate: livrarr-library
    responsibility: Replace the split check-and-move path with one no-clobber primitive and expose the shared forward/undo item-complete result seam; reorganize_items is the sole FileMoveReport constructor and the service/work wrappers only transport its report.
    requirements: [REQ-004]
    build_units: [B1, B3]
    dependencies: [identity_authority_contracts, identity_authority_services, library_item_path_store]
    public_api:
      types:
        - kind: enum
          name: NoClobberMoveOutcome
          fields:
            - { name: Moved, type: "{ method: MoveMethod, destination: PathBuf }" }
            - { name: DestinationOccupied, type: "{ source: PathBuf, destination: PathBuf }" }
            - { name: CopiedWithSourceLeft, type: "{ source: PathBuf, destination: PathBuf }" }
            - { name: SourceMissing, type: "{ recorded: PathBuf, destination: PathBuf }" }
            - { name: Failed, type: "{ source: PathBuf, destination: PathBuf, reason: String }" }
        - kind: struct
          name: FileReorganizer
          fields:
            - { name: item_repository, type: "Arc<D> where D: LibraryItemDb" }
            - { name: path_builder, type: "Arc<P> where P: PathBuilder" }
      functions:
        - name: move_no_clobber
          inputs:
            - { name: request, type: NoClobberMoveRequest }
          output: "Result<NoClobberMoveOutcome, FileReorganizationError>"
          errors: [InvalidPath, FilesystemFailure]
        - name: reorganize_items
          constructs: FileMoveReport
          inputs:
            - { name: request, type: FileReorganizationRequest }
          output: "Result<FileMoveReport, FileReorganizationError>"
          errors: [InvalidPath, RepositoryFailure]
        - name: reorganize_work_files
          returns: "the FileMoveReport returned by reorganize_items; no second construction"
          inputs:
            - { name: request, type: WorkFileReorganizationRequest }
          output: "Result<FileMoveReport, FileReorganizationError>"
          errors: [InvalidPath, RepositoryFailure]

  - name: identity_authority_activation
    crate: livrarr-db
    responsibility: Own the only constructor of every type in identity_authority_activation_contracts. The production function derives the compiled build prefix, validates every totality table and the live-schema effect manifest, returns a sealed ActivationReport with Some(LegacyPreCutoverWritePermit) only for B0-B3, or runs the one-shot B4 cutover and returns that field as None.
    requirements: [REQ-002, REQ-004, REQ-006]
    build_units: [B0, B1, B2, B3, B4]
    dependencies: [identity_authority_contracts, identity_authority_activation_contracts, identity_authority_transaction, review_card_store, route_plan, absorption_store, legacy_identity_conflict_history, conflict_cutover]
    public_api:
      types:
        - kind: enum
          name: ActivationCheck
          fields:
            - { name: AuthorizationTable, type: unit }
            - { name: RouteMatrixCoverage, type: unit }
            - { name: RetentionPolicy, type: unit }
            - { name: LegacyAdoption, type: unit }
            - { name: EffectManifest, type: unit }
            - { name: ConflictCutover, type: unit }
        - kind: enum
          name: ActivationError
          fields:
            - { name: UnsupportedBuildPrefix, type: BuildUnitPrefix }
            - { name: CheckFailed, type: "{ check: ActivationCheck, detail: String }" }
            - { name: EffectManifestIncomplete, type: "Vec<UnclassifiedEffect>" }
            - { name: ConflictCutover, type: String }
            - { name: Storage, type: String }
        - kind: struct
          name: SqliteIdentityAuthorityActivation
          fields:
            - { name: pool, type: "private sqlx::SqlitePool" }
      functions:
        - name: "SqliteIdentityAuthorityActivation::activate_identity_authority"
          constructs: [MarkerAbsent, LegacyPreCutoverWritePermit, CutoverReadPermit, ConflictCutoverRequest, RecordedAbsorptionPermit, AbsorptionCapability, ActivationReport]
          consumes: "the ConflictCutoverReport returned by run_conflict_authority_cutover_in_activation_tx on B4, recording its digest in ActivationReport"
          construction_branches: "B0-B3 derive marker absence from the activation-owned check and seal Some(LegacyPreCutoverWritePermit) into the report; B4 uses CutoverReadPermit plus ConflictCutoverRequest in the private cutover chain and seals None after commit; no branch infers absence from a readable _livrarr_meta row"
          inputs:
            - { name: self, type: "&SqliteIdentityAuthorityActivation" }
          output: "Result<ActivationReport, ActivationError>"
          errors: [UnsupportedBuildPrefix, CheckFailed, EffectManifestIncomplete, ConflictCutover, Storage]

  - name: identity_authority_application
    crate: livrarr-server
    responsibility: Thinly call the livrarr-db production activation function before serve, consume its sealed report to compose the road, repository, proof codec, file service, and route handlers, and perform no prefix, table, manifest, or cutover policy itself.
    requirements: [REQ-002, REQ-004, REQ-006]
    build_units: [B0, B1, B2, B3, B4]
    dependencies: [identity_authority_contracts, identity_authority_services, identity_authority_activation_contracts, identity_authority_activation, identity_authority_repository, identity_road, file_reorganization, identity_authority_handlers]
    public_api:
      types:
        - kind: newtype
          name: SecretBytes
          fields:
            - { name: bytes, type: "private Vec<u8>" }
        - kind: struct
          name: AuthenticatedDecisionProofCodec
          fields:
            - { name: key_id, type: String }
            - { name: signing_key, type: "private SecretBytes" }
        - kind: struct
          name: IdentityAuthorityApplication
          fields:
            - { name: road, type: "Arc<R> where R: IdentityAuthorityRoad" }
            - { name: proof_codec, type: AuthenticatedDecisionProofCodec }
      functions:
        - name: issue_decision_proof
          constructs: DecisionProof
          inputs:
            - { name: payload, type: DecisionProofPayload }
          output: "Result<DecisionProof, DecisionProofError>"
          errors: [SerializationFailure, SigningFailure]
        - name: verify_decision_proof
          inputs:
            - { name: user_id, type: UserId }
            - { name: proof, type: "&DecisionProof" }
          output: "Result<DecisionProofPayload, DecisionProofError>"
          errors: [Malformed, UnknownKey, InvalidAuthentication, WrongUser]
        - name: activate_identity_authority
          composition: "call the DB activation function, pass its report into new_identity_authority_repository, and pass the repository plus the existing file and history services into new_identity_road"
          inputs:
            - { name: activation, type: "&SqliteIdentityAuthorityActivation" }
            - { name: files, type: "Arc<F> where F: FileReorganizationService" }
            - { name: history, type: "Arc<H> where H: HistoryService" }
          output: "Result<IdentityAuthorityApplication, ActivationError>"
          errors: [ActivationError]
    crate_private_api:
      functions:
        - name: authenticate_review_decision
          caller: IdentityAuthorityService::resolve_review only
          constructs: VerifiedReviewDecisionRequest
          inputs:
            - { name: codec, type: "&AuthenticatedDecisionProofCodec" }
            - { name: request, type: ReviewDecisionRequest }
          output: "Result<VerifiedReviewDecisionRequest, DecisionProofError>"
          errors: [Malformed, UnknownKey, InvalidAuthentication, WrongUser]
        - name: authenticate_merge_execute
          caller: IdentityAuthorityService::execute_merge only
          constructs: VerifiedMergeExecuteRequest
          inputs:
            - { name: codec, type: "&AuthenticatedDecisionProofCodec" }
            - { name: request, type: MergeExecuteRequest }
          output: "Result<VerifiedMergeExecuteRequest, DecisionProofError>"
          errors: [Malformed, UnknownKey, InvalidAuthentication, WrongUser]

  - name: identity_authority_handlers
    crate: livrarr-handlers
    responsibility: In identity_authority.rs, validate HTTP shapes, echo opaque proofs to the domain service, and map typed outcomes; in the existing Work list/detail handlers and secondary Work projection helper, transport repository-provided identity presentation fields without deriving them; contain no identity, route, SQL, or filesystem logic. The old identity_conflicts.rs module is deleted; if a routing shim remains, it only re-exports the new handler, declares no request DTO, and may not retain removed request members.
    requirements: [REQ-002, REQ-004, REQ-006]
    build_units: [B0, B2, B3, B4]
    dependencies: [identity_authority_contracts, identity_authority_services]
    public_api:
      types:
        - kind: trait
          name: HasIdentityAuthorityService
          fields:
            - { name: identity_authority_service, type: "&S where S: IdentityAuthorityService" }
        - kind: struct
          name: ReviewListHttpQuery
          fields:
            - { name: statuses, type: "Vec<ReviewCardStatus>" }
            - { name: kinds, type: "Vec<ReviewKind>" }
            - { name: work_id, type: "Option<i64>" }
        - kind: struct
          name: ReviewPreviewHttpRequest
          fields:
            - { name: action, type: ReviewAction }
            - { name: elected_survivor_id, type: "Option<i64>" }
            - { name: keep_from, type: "Vec<WorkKeyedFieldChoice>" }
        - kind: struct
          name: MergePreviewHttpRequest
          fields:
            - { name: other_work_id, type: i64 }
            - { name: elected_survivor_id, type: i64 }
            - { name: keep_from, type: "Vec<WorkKeyedFieldChoice>" }
        - kind: struct
          name: MergeExecuteHttpRequest
          fields:
            - { name: decision_proof, type: String }
        - kind: struct
          name: DecisionHttpRequest
          fields:
            - { name: action, type: ReviewAction }
            - { name: decision_proof, type: String }
        - kind: enum
          name: ConflictDecisionHttpAction
          fields:
            - { name: KeepExisting, type: unit }
            - { name: AcceptSeparate, type: unit }
            - { name: ReplaceAnchor, type: unit }
            - { name: Merge, type: unit }
            - { name: Dismiss, type: unit }
        - kind: struct
          name: ConflictDecisionHttpRequest
          serde_unknown_fields: ignored
          fields:
            - { name: action, type: ConflictDecisionHttpAction }
            - { name: decision_proof, type: String }
        - kind: enum
          name: DecisionHttpOutcome
          fields:
            - { name: Body, type: ReviewDecisionOutcome }
            - { name: NoContent, type: unit }
        - kind: struct
          name: UndoAbsorptionHttpRequest
          fields:
            - { name: record_id, type: i64 }
            - { name: expected_record_revision, type: i64 }
      functions:
        - name: list
          generic_bounds:
            - "S: HasWorkService + HasFileService + HasIdentityLayerRepository"
          inputs:
            - { name: state, type: "State<S>" }
            - { name: ctx, type: AuthContext }
            - { name: pq, type: "Query<crate::PaginationQuery>" }
          output: "Result<Json<crate::PaginatedResponse<WorkDetailResponse>>, ApiError>"
          errors: [ApiError]
        - name: get
          generic_bounds:
            - "S: HasWorkService + HasFileService + HasIdentityLayerRepository"
          inputs:
            - { name: state, type: "State<S>" }
            - { name: ctx, type: AuthContext }
            - { name: id, type: "Path<i64>" }
          output: "Result<Json<WorkDetailResponse>, ApiError>"
          errors: [ApiError]
        - name: list_review
          inputs:
            - { name: state, type: "State<S: HasIdentityAuthorityService>" }
            - { name: query, type: ReviewListHttpQuery }
          output: "Result<Json<Vec<ReviewCardView>>, AppError>"
          errors: [BadRequest, Forbidden, Internal]
        - name: get_review
          inputs:
            - { name: state, type: "State<S: HasIdentityAuthorityService>" }
            - { name: card_id, type: i64 }
          output: "Result<Json<ReviewCardView>, AppError>"
          errors: [Forbidden, NotFound, Internal]
        - name: preview_review
          inputs:
            - { name: state, type: "State<S: HasIdentityAuthorityService>" }
            - { name: card_id, type: i64 }
            - { name: request, type: ReviewPreviewHttpRequest }
          output: "Result<Json<ReviewDecisionPreview>, AppError>"
          errors: [BadRequest, Forbidden, NotFound, Conflict, Internal]
        - name: preview_merge
          inputs:
            - { name: state, type: "State<S: HasIdentityAuthorityService>" }
            - { name: work_id, type: i64 }
            - { name: request, type: MergePreviewHttpRequest }
          output: "Result<Json<MergePreview>, AppError>"
          errors: [BadRequest, Forbidden, Conflict, Internal]
        - name: execute_merge
          inputs:
            - { name: state, type: "State<S: HasIdentityAuthorityService>" }
            - { name: request, type: MergeExecuteHttpRequest }
          output: "Result<Json<AbsorptionOutcome>, AppError>"
          errors: [BadRequest, Forbidden, NotFound, Conflict, Internal]
        - name: resolve_review
          inputs:
            - { name: state, type: "State<S: HasIdentityAuthorityService>" }
            - { name: card_id, type: i64 }
            - { name: request, type: DecisionHttpRequest }
          output: "Result<DecisionHttpOutcome, AppError>"
          errors: [BadRequest, Forbidden, NotFound, Conflict, Internal]
        - name: resolve_conflict
          inputs:
            - { name: state, type: "State<S: HasIdentityAuthorityService>" }
            - { name: card_id, type: i64 }
            - { name: request, type: ConflictDecisionHttpRequest }
          output: "Result<DecisionHttpOutcome, AppError>"
          errors: [BadRequest, Forbidden, NotFound, Conflict, Internal]
        - name: undo_absorption
          inputs:
            - { name: state, type: "State<S: HasIdentityAuthorityService>" }
            - { name: request, type: UndoAbsorptionHttpRequest }
          output: "Result<Json<UndoOutcome>, AppError>"
          errors: [BadRequest, Forbidden, NotFound, Conflict, Internal]
        - name: read_absorption
          inputs:
            - { name: state, type: "State<S: HasIdentityAuthorityService>" }
            - { name: record_id, type: i64 }
          output: "Result<Json<AbsorptionView>, AppError>"
          errors: [Forbidden, NotFound, Internal]
    crate_private_api:
      functions:
        - name: project_work_identity_presentations
          caller: "author page, series detail, and Work add/update/merge/refresh/clear-response projections only; the Work list and Work detail GET handlers do not call this helper"
          generic_bounds:
            - "S: HasIdentityLayerRepository"
          inputs:
            - { name: state, type: "&S" }
            - { name: user_id, type: "livrarr_domain::UserId" }
            - { name: details, type: "&mut [WorkDetailResponse]" }
          output: "Result<(), ApiError>"
          errors: [ApiError]

  - name: identity_authority_client
    crate: frontend
    responsibility: Present only server-authorized actions, preserve Work-keyed choices, echo decision proofs, and show retired routes plus truthful per-file forward or undo results.
    requirements: [REQ-002, REQ-004, REQ-006]
    build_units: [B0, B2, B3, B4]
    dependencies: [identity_authority_contracts, identity_authority_handlers]
    public_api:
      types:
        - kind: type-alias
          name: ReviewKindDto
          fields:
            - { name: value, type: "'identity_conflict' | 'pending_route' | 'group_identity' | 'identity_park' | 'field_resolution' | 'contributor_order' | 'edition_evidence' | 'import_identity' | 'migration_repair' | 'invariant_repair'" }
        - kind: type-alias
          name: ReviewActionKindDto
          fields:
            - { name: value, type: "'group_different_from_all' | 'group_attach_or_merge' | 'pending_route_affirm' | 'conflict_keep_existing' | 'conflict_accept_separate' | 'conflict_replace_anchor' | 'conflict_merge' | 'dismiss' | 'park_choose_candidate' | 'park_dismiss' | 'field_choose_preserved_value' | 'field_explicit_absence' | 'contributor_order_resolve' | 'edition_choose_direct_evidence' | 'edition_retain_unknown_or_absent' | 'edition_archive_empty_shell' | 'import_corrected_metadata_retry' | 'import_resolving_identifier' | 'import_explicit_identity_or_minimum' | 'migration_correct_typed_value' | 'migration_assign_scope_and_owner' | 'migration_discard_proven_non_identity' | 'invariant_recompute' | 'invariant_supply_missing_reference' | 'invariant_discard_malformed_derived_row'" }
        - kind: type-alias
          name: ReviewCardStatusDto
          fields:
            - { name: value, type: "'pending' | 'resolved' | 'cancelled'" }
        - kind: type-alias
          name: GroupIdentityRoleDto
          fields:
            - { name: value, type: "{ kind: 're_identify'; workId: number; proposer: 'user' | 'machine' } | { kind: 'incoming'; addSource: string } | { kind: 'merge_members' | 'none' | 'unknown' }" }
        - kind: type-alias
          name: ReviewCardDisplayPayloadDto
          fields:
            - { name: value, type: "{ kind: 'group_identity'; value: GroupIdentityPayloadV2 } | { kind: 'identity_conflict'; value: ConflictCardPayloadV1 } | { kind: 'identity_park'; value: IdentityParkPayloadV1 } | { kind: 'opaque_legacy_history'; value: { sourceLegacyConflictId: number; legacyKind: string; legacySource: string; resolutionNotes: string | null; legacyRaisedAt: string; legacyResolvedAt: string | null; historyOnlyReason: string } } | { kind: 'existing'; value: ExistingReviewPayload }" }
        - kind: interface
          name: ReviewActionAvailabilityDto
          fields:
            - { name: action, type: ReviewActionKindDto }
            - { name: proofClass, type: "'card' | 'election' | 'refused' | 'history_only'" }
            - { name: decisionProof, type: "string | null" }
            - { name: requiresPreview, type: boolean }
            - { name: refusal, type: "string | null" }
        - kind: interface
          name: ReviewCardDto
          fields:
            - { name: id, type: number }
            - { name: kind, type: ReviewKindDto }
            - { name: subjectWorkId, type: "number | null" }
            - { name: cohortWorkIds, type: "number[]" }
            - { name: role, type: "GroupIdentityRoleDto | null" }
            - { name: origin, type: string }
            - { name: status, type: ReviewCardStatusDto }
            - { name: payload, type: ReviewCardDisplayPayloadDto }
            - { name: resolutionAction, type: "ReviewResolutionKind | null" }
            - { name: resolutionNotes, type: "string | null" }
            - { name: createdAt, type: string }
            - { name: resolvedAt, type: "string | null" }
            - { name: actions, type: "ReviewActionAvailabilityDto[]" }
            - { name: historyOnlyReason, type: "string | null" }
        - kind: interface
          name: MergeFieldPreviewDto
          fields:
            - { name: field, type: string }
            - { name: values, type: "Array<{ workId: number; present: boolean; value: unknown }>" }
            - { name: keepFromWorkId, type: number }
        - kind: interface
          name: RouteRetirementDto
          fields:
            - { name: provider, type: string }
            - { name: kind, type: string }
            - { name: id, type: string }
            - { name: userConfirmed, type: boolean }
            - { name: reason, type: string }
        - kind: interface
          name: FileImpactItemDto
          fields:
            - { name: libraryItemId, type: number }
            - { name: originWorkId, type: number }
            - { name: recordedPath, type: string }
            - { name: destinationPath, type: string }
            - { name: willMove, type: boolean }
        - kind: interface
          name: FileImpactDto
          fields:
            - { name: items, type: "FileImpactItemDto[]" }
            - { name: survivorCanonicalRoot, type: string }
            - { name: explanation, type: string }
        - kind: interface
          name: MergePreviewDto
          fields:
            - { name: pair, type: "[number, number]" }
            - { name: electedSurvivorId, type: number }
            - { name: fields, type: "MergeFieldPreviewDto[]" }
            - { name: retiredRoutes, type: "RouteRetirementDto[]" }
            - { name: fileImpact, type: FileImpactDto }
            - { name: decisionProof, type: string }
        - kind: interface
          name: ReviewDecisionPreviewDto
          fields:
            - { name: card, type: ReviewCardDto }
            - { name: action, type: ReviewActionKindDto }
            - { name: merge, type: "MergePreviewDto | null" }
            - { name: decisionProof, type: string }
        - kind: interface
          name: FileMoveResultDto
          fields:
            - { name: libraryItemId, type: number }
            - { name: originWorkId, type: number }
            - { name: disposition, type: "'moved' | 'already_canonical' | 'record_healed' | 'destination_occupied' | 'copied_with_source_left' | 'source_missing' | 'record_mismatch' | 'move_failed' | 'record_update_failed'" }
            - { name: recordPath, type: string }
            - { name: fileLocations, type: "string[]" }
            - { name: reason, type: "string | null" }
        - kind: interface
          name: UndoFilePreviewDto
          fields:
            - { name: libraryItemId, type: number }
            - { name: currentRecordedPath, type: string }
            - { name: restoreDestination, type: string }
            - { name: forwardDisposition, type: "FileMoveResultDto['disposition'] | null" }
        - kind: interface
          name: AbsorptionViewDto
          fields:
            - { name: recordId, type: number }
            - { name: recordVersion, type: number }
            - { name: recordRevision, type: "number | null" }
            - { name: survivorWorkId, type: "number | null" }
            - { name: absorbedWorkIds, type: "number[]" }
            - { name: state, type: "'active' | 'undoing' | 'undone' | null" }
            - { name: origin, type: "string | null" }
            - { name: undoAvailability, type: "'available' | 'already_undone' | 'retry_file_step' | 'refused'" }
            - { name: undoRefusal, type: "string | null" }
            - { name: forwardFiles, type: "FileMoveResultDto[] | null" }
            - { name: forwardFileComplete, type: "boolean | null" }
            - { name: undoFiles, type: "FileMoveResultDto[] | null" }
            - { name: undoFileComplete, type: "boolean | null" }
            - { name: incompleteFiles, type: "FileMoveResultDto[]" }
            - { name: fileMovesOnUndo, type: "UndoFilePreviewDto[]" }
            - { name: pendingQuestionIds, type: "number[]" }
        - kind: interface
          name: AbsorptionOutcomeDto
          fields:
            - { name: absorption, type: AbsorptionViewDto }
            - { name: survivor, type: Work }
            - { name: forwardFiles, type: "FileMoveResultDto[]" }
        - kind: interface
          name: ReviewDecisionOutcomeDto
          fields:
            - { name: kind, type: "'resolved' | 'cancelled' | 'attached' | 'created_distinct' | 'absorbed' | 'park_resolved' | 'conflict_resolved'" }
            - { name: card, type: "ReviewCardDto | null" }
            - { name: workId, type: "number | null" }
            - { name: survivorWorkId, type: "number | null" }
            - { name: absorptionRecordId, type: "number | null" }
            - { name: files, type: "FileMoveResultDto[]" }
            - { name: message, type: "string | null" }
        - kind: interface
          name: UndoOutcomeDto
          fields:
            - { name: recordId, type: number }
            - { name: state, type: "'undoing' | 'undone'" }
            - { name: alreadyUndone, type: boolean }
            - { name: files, type: "FileMoveResultDto[]" }
      functions:
        - name: listReview
          inputs:
            - { name: query, type: ReviewListHttpQuery }
          output: "Promise<ReviewCardDto[]>"
          errors: [ApiError]
        - name: getReview
          inputs:
            - { name: cardId, type: number }
          output: "Promise<ReviewCardDto>"
          errors: [ApiError]
        - name: previewReview
          inputs:
            - { name: cardId, type: number }
            - { name: request, type: ReviewPreviewHttpRequest }
          output: "Promise<ReviewDecisionPreviewDto>"
          errors: [ApiError]
        - name: previewMerge
          inputs:
            - { name: workId, type: number }
            - { name: request, type: MergePreviewHttpRequest }
          output: "Promise<MergePreviewDto>"
          errors: [ApiError]
        - name: executeMerge
          inputs:
            - { name: request, type: MergeExecuteHttpRequest }
          output: "Promise<AbsorptionOutcomeDto>"
          errors: [ApiError]
        - name: executeReviewDecision
          inputs:
            - { name: cardId, type: number }
            - { name: request, type: DecisionHttpRequest }
          output: "Promise<ReviewDecisionOutcomeDto | null>"
          errors: [ApiError]
        - name: executeConflictDecision
          inputs:
            - { name: cardId, type: number }
            - { name: request, type: ConflictDecisionHttpRequest }
          output: "Promise<ReviewDecisionOutcomeDto | null>"
          errors: [ApiError]
        - name: undoAbsorption
          inputs:
            - { name: request, type: UndoAbsorptionHttpRequest }
          output: "Promise<UndoOutcomeDto>"
          errors: [ApiError]
        - name: readAbsorption
          inputs:
            - { name: recordId, type: number }
          output: "Promise<AbsorptionViewDto>"
          errors: [ApiError]

  - name: identity_authority_oracles
    crate: livrarr-behavioral
    responsibility: House the table-totality, per-door completeness, retention, cutover, route-plan, no-clobber, and supported-prefix oracles without duplicating production policy; the boot matrix calls livrarr-db::identity_authority_activation directly and has no livrarr-server dependency.
    requirements: [REQ-002, REQ-004, REQ-006]
    build_units: [B0, B1, B2, B3, B4]
    dependencies: [identity_authority_contracts, identity_authority_services, identity_authority_activation, identity_authority_repository, review_card_store, route_plan, absorption_store, work_delete, conflict_cutover, identity_road, library_item_path_store, file_reorganization, identity_authority_handlers]
    public_api:
      types:
        - kind: struct
          name: NonemptyUpgradeFixture
          fields:
            - { name: fixture_id, type: String }
            - { name: source_schema_version, type: i64 }
            - { name: seeded_case_ids, type: "Vec<String>" }
            - { name: supported_prefixes, type: "Vec<BuildUnitPrefix>" }
        - kind: struct
          name: AssertionFailure
          fields:
            - { name: oracle, type: String }
            - { name: case_id, type: String }
            - { name: detail, type: String }
      functions:
        - name: assert_authorization_and_route_matrix_totality
          inputs: []
          output: "Result<(), AssertionFailure>"
          errors: [AssertionFailure]
        - name: assert_three_valued_distinctness_matrix
          inputs: []
          output: "Result<(), AssertionFailure>"
          errors: [AssertionFailure]
        - name: assert_absorption_completeness_per_caller
          inputs:
            - { name: caller, type: AbsorptionCaller }
          output: "Result<(), AssertionFailure>"
          errors: [AssertionFailure]
        - name: assert_work_delete_completeness_per_door
          inputs:
            - { name: origin, type: WorkDeleteOrigin }
          output: "Result<(), AssertionFailure>"
          errors: [AssertionFailure]
        - name: assert_effect_manifest_fail_closed
          inputs: []
          output: "Result<(), AssertionFailure>"
          errors: [AssertionFailure]
        - name: assert_decision_proof_bind_matrix
          inputs: []
          output: "Result<(), AssertionFailure>"
          errors: [AssertionFailure]
        - name: assert_retention_table_totality
          inputs: []
          output: "Result<(), AssertionFailure>"
          errors: [AssertionFailure]
        - name: assert_cutover_totality_and_idempotence
          inputs:
            - { name: fixture, type: NonemptyUpgradeFixture }
          output: "Result<(), AssertionFailure>"
          errors: [AssertionFailure]
        - name: assert_absorption_door_routing_and_gate
          inputs: []
          output: "Result<(), AssertionFailure>"
          errors: [AssertionFailure]
        - name: assert_cutover_single_production_entry
          inputs:
            - { name: fixture, type: NonemptyUpgradeFixture }
            - { name: activation, type: "&SqliteIdentityAuthorityActivation" }
          output: "Result<(), AssertionFailure>"
          errors: [AssertionFailure]
        - name: assert_no_clobber_and_truthful_file_matrix
          inputs: []
          output: "Result<(), AssertionFailure>"
          errors: [AssertionFailure]
        - name: assert_supported_prefix_boot_matrix
          inputs:
            - { name: fixture, type: NonemptyUpgradeFixture }
            - { name: activation, type: "&SqliteIdentityAuthorityActivation" }
          output: "Result<(), AssertionFailure>"
          errors: [AssertionFailure]

shared_types:
  - kind: type-alias
    name: ReviewCardId
    fields:
      - { name: value, type: i64 }
  - kind: type-alias
    name: AbsorptionRecordId
    fields:
      - { name: value, type: i64 }
  - kind: newtype
    name: Digest
    fields:
      - { name: bytes, type: "private [u8; 32]" }
  - kind: struct
    name: WorkGeneration
    fields:
      - { name: work_id, type: WorkId }
      - { name: identity_generation, type: i64 }
      - { name: merge_generation, type: i64 }
  - kind: struct
    name: WorkKeyedFieldChoice
    fields:
      - { name: field, type: MergeableField }
      - { name: keep_from, type: WorkId }
  - kind: struct
    name: FieldSnapshot
    fields:
      - { name: work_id, type: WorkId }
      - { name: field, type: MergeableField }
      - { name: value, type: OptionalFieldValue }
  - kind: struct
    name: RoutePlan
    fields:
      - { name: user_id, type: UserId }
      - { name: cohort, type: "Vec<WorkId>" }
      - { name: survivor, type: "Option<WorkId>" }
      - { name: attach, type: "Vec<RouteAttachment>" }
      - { name: retire, type: "Vec<RouteRetirement>" }
      - { name: third_owner_checks, type: "Vec<RouteOwnershipCheck>" }
      - { name: snapshot_digest, type: Digest }
  - kind: struct
    name: RouteRetirement
    fields:
      - { name: route, type: RouteKey }
      - { name: former_owner, type: RouteOwner }
      - { name: user_confirmed, type: bool }
      - { name: reason, type: RouteRetirementReason }
  - kind: enum
    name: AbsorptionOrigin
    construction: "projection only through derive_absorption_provenance; never accepted at the repository door"
    fields:
      - { name: ManualPair, type: unit }
      - { name: ReviewContinuation, type: "{ card_id: ReviewCardId }" }
      - { name: SettlementAutoMerge, type: unit }
      - { name: DedupResidueHeal, type: unit }
      - { name: ArticleDuplicateHeal, type: unit }
  - kind: enum
    name: UserAbsorptionOrigin
    construction: "IdentityRoad::execute_merge fixes ManualPair; an accepted absorbing IdentityRoad::resolve_review fixes ReviewContinuation { card_id }; no other constructor"
    fields:
      - { name: ManualPair, type: unit }
      - { name: ReviewContinuation, type: "{ card_id: ReviewCardId }" }
  - kind: enum
    name: MachineAbsorptionOrigin
