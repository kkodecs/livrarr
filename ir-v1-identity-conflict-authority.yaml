data_flow:
  sources:
    - entity: ReviewCard
      origin: settlement, edit, merge, conflict, park, cutover, and boot-heal decisions
      description: Every producer submits a typed draft through the sole mint; the sole cohort derivation materializes every named Work.
    - entity: ConflictCard
      origin: runtime route contradiction or B4 legacy adoption
      description: Runtime cards carry the exact contradicted route; adopted route-conflict cards carry UnknownLegacy and are non-keyable.
    - entity: DecisionProof
      origin: authenticated card read or elected merge preview
      description: The server signs a complete card or election snapshot; informational counts are excluded.
    - entity: RoutePlan
      origin: locked live route rows inside the action transaction
      description: Every proposal, attachment, retirement, gap-fill, and absorption uses the same planner and third-owner checks.
    - entity: AbsorptionRecord
      origin: user pair merge, absorbing review continuation, machine auto-merge, dedup heal, or article heal
      description: One sealed row covers the whole operation, including caller writes before and after the physical loser deletion.
    - entity: AbsorptionView
      origin: user-scoped projection of an AbsorptionRecord plus current card, lifecycle, and file state
      description: The projection exposes undo availability and effects without exposing generic row images.
    - entity: FileMoveReport
      origin: shared forward or undo file reorganization
      description: Every affected item has a truthful disposition, both locations when mismatched, and named leftover copies.
    - entity: StagingConflictDiagnostic
      origin: lifecycle-triggered close of identity_conflicts_v2
      description: The audit is immutable and effective currentness is derived from the linked absorption lifecycle.
    - entity: IdentityParkPayloadV1
      origin: a Work entering the identity park state
      description: Exactly one card records candidate identity content rather than consume-once candidate ids.
    - entity: HistoryEvent
      origin: committed Incoming DifferentFromAll creation or sealed Work absorption
      description: Creation emits an added draft after commit through the existing infallible observer; absorption alone owns an in-transaction worksMerged anchor.
  sinks:
    - entity: ReviewCard
      destination: identity_review_cards and identity_review_card_members
      description: Pending cards always name live same-user Works; resolved and cancelled cards and membership survive Work deletion as history.
    - entity: ConflictCard
      destination: review list, conflict detail, dismissal ledger when keyable, and audit history
      description: Review cards are the only post-cutover user-facing conflict authority.
    - entity: DecisionProof
      destination: authenticated HTTP client and action validation
      description: The client echoes the opaque proof; the authority verifies authentication and every bound live snapshot before writing.
    - entity: RoutePlan
      destination: route mutations and AbsorptionRecord envelope
      description: Applied attachments and retirements equal the preview-bound plan and are retained for undo and audit.
    - entity: AbsorptionRecord
      destination: identity_merge_archives, internal undo authority, and record-id reference from Work history
      description: Version-1 rows cascade with the surviving Work and retain complete undo state for that lifetime; their generic row images never cross the API.
    - entity: AbsorptionView
      destination: merge and undo responses, Work history UI, and explicit retry UI
      description: The view names the record, lifecycle, affected Works, planned reverse paths, pending-card withdrawals, and truthful file outcomes.
    - entity: FileMoveReport
      destination: absorption record, merge or undo response, and history UI
      description: Forward results are persisted after commit; undo remains incomplete until all records and locations are truthful.
    - entity: StagingConflictDiagnostic
      destination: retained audit and cutover counts only
      description: It never drives badges, lists, suppression, actions, or resolution.
    - entity: IdentityParkPayloadV1
      destination: review card, dismissal key, park list, and typed continuation
      description: Candidate selection never absorbs and dismissal reverts the Work to pending.
    - entity: HistoryEvent
      destination: existing history service and Work history projection
      description: An added observer failure is absorbed and cannot alter create success; a worksMerged storage failure is the sole exception and rolls back its absorption transaction.
  state_machines:
    - entity: AbsorptionRecord
      states: [legacy_v0_history, open_unsealed, active, undoing, undone]
      transitions:
        - { from: open_unsealed, to: active, trigger: "the completeness seal succeeds and the version-1 operation commits" }
        - { from: active, to: undoing, trigger: "database restore commits and the file step is not yet complete" }
        - { from: undoing, to: undone, trigger: "initial completion or explicit retry makes every recorded item truthful without clobber or copy loss" }
        - { from: undone, to: undone, trigger: "an idempotent undo retry returns AlreadyUndone with zero writes" }
    - entity: ReviewCard
      states: [pending, resolved, cancelled]
      transitions:
        - { from: pending, to: resolved, trigger: "an authorized typed continuation commits" }
        - { from: pending, to: cancelled, trigger: "user dismiss, supersession, Work deletion, absorption withdrawal, or cutover duplicate cleanup" }
        - { from: resolved, to: pending, trigger: "undo restores a reversible pre-operation question; the operation's resolving card is excluded" }
        - { from: cancelled, to: pending, trigger: "undo restores a reversible pre-operation question; retained resolution artifacts are excluded" }
    - entity: ConflictCard
      states: [pending_keyable, pending_non_keyable, resolved, cancelled, history_only]
      transitions:
        - { from: pending_keyable, to: resolved, trigger: "KeepExisting, AcceptSeparate, ReplaceAnchor, or Merge" }
        - { from: pending_keyable, to: cancelled, trigger: "Dismiss with a V2 standing key" }
        - { from: pending_non_keyable, to: resolved, trigger: "KeepExisting or AcceptSeparate for this card only" }
        - { from: pending_non_keyable, to: cancelled, trigger: "cancel-only Dismiss" }
        - { from: pending_keyable, to: history_only, trigger: "Work deletion or corrupt ownership discovered before action" }
        - { from: pending_non_keyable, to: history_only, trigger: "Work deletion or payload becomes unreadable before action" }
        - { from: resolved, to: pending_keyable, trigger: "undo restores a reversible exact-route question that was not the operation's resolving card" }
        - { from: resolved, to: pending_non_keyable, trigger: "undo restores a reversible adopted UnknownLegacy question that was not the operation's resolving card" }
        - { from: cancelled, to: pending_keyable, trigger: "undo restores a reversible exact-route question" }
        - { from: cancelled, to: pending_non_keyable, trigger: "undo restores a reversible adopted UnknownLegacy question" }
    - entity: UndoFileStep
      states: [not_started, incomplete, complete]
      transitions:
        - { from: not_started, to: complete, trigger: "every recorded forward-moved item is already canonical, healed, or moved back" }
        - { from: not_started, to: incomplete, trigger: "any item is occupied, duplicated, missing, mismatched, or cannot update its record" }
        - { from: incomplete, to: complete, trigger: "explicit retry resolves every remaining item" }
    - entity: StagingConflictDiagnostic
      states: [pending_staging, terminal_diagnostic_current, terminal_diagnostic_historical]
      transitions:
        - { from: pending_staging, to: terminal_diagnostic_current, trigger: "Work deletion or absorption makes the pair self-referential" }
        - { from: terminal_diagnostic_current, to: terminal_diagnostic_historical, trigger: "linked absorption changes from active to undoing or undone; currentness is derived and the audit row is unchanged" }
        - { from: terminal_diagnostic_historical, to: pending_staging, trigger: "undo restores the original pending row image" }
  invariants:
    - Review-card authority is exhaustive over review kind, optional payload-free GroupIdentityRoleKind, action, cohort cardinality, and payload state; role_kind is Option::None for every non-GroupIdentity kind, and a missing, duplicate, illegally role-indexed, or payload-kind-mismatched authorization cell fails startup closed. The full payload-bearing GroupIdentityRole is bound separately in card and election proofs.
    - Incoming × GroupAttachOrMerge × One × NativeReadable requires a proposal-bound card proof and performs the one-member attach plan; ReIdentify, MergeMembers, and GroupIdentityRoleKind::None × GroupAttachOrMerge × One are explicit refused cells, and MergeMembers × GroupDifferentFromAll is refused; all refused cells remain write-free.
    - A non-absorbing action accepts only a card proof; an absorbing action accepts only an election proof; every refused or history-only cell remains write-free.
    - An actionable card read emits one ReviewActionView per authorization cell. Each non-absorbing action carries its own card proof; an absorbing action carries no card proof and names the required preview that mints its election proof.
    - Decision proofs bind user, card/version when present, the complete sorted cohort generations, role, proposal, all mergeable field values and presence, canonical Work-keyed keep-from choices, route plan, retirements, and elected survivor. Informational counts never stale a decision.
    - The deployed expected-generation-only ReviewResolutionCommand and unbound merge/conflict request shapes are retired at B0; no compatibility adapter may invoke a mutation without the new authenticated proof.
    - ConflictDecisionHttpRequest declares only action and decision_proof; serde ignores unknown legacy JSON members, and no retired request member can become an input to the outcome.
    - The sole cohort is sorted unique payload work_ids union subject_work_id. Mint, delete, cutover, dismissal, and undo consume its relational projection; no delete site parses payload JSON.
    - Same-book certainty is evaluated only inside the identity road and remains three-valued; Unsure never means different.
    - Every user absorption is pairwise and preview-bound to either elected survivor. A machine operation may absorb several losers only when its whole route plan has no contradiction.
    - IdentityAuthorityRepository has exactly one absorption door, execute_absorption(RecordedAbsorptionRequest). User execute supplies UserElection with only UserAbsorptionOrigin plus UserId; the settlement AutoMerge, dedup-residue heal, and article-duplicate heal enter through three named IdentityAuthorityRoad methods that supply MachineSnapshot with only MachineAbsorptionOrigin plus the operation's complete loser set, member generations, and scan_generation.
    - RecordedAbsorptionRequest makes crossed provenance unrepresentable. UserElection admits only ManualPair or ReviewContinuation and derives AbsorptionActor::User; MachineSnapshot admits only SettlementAutoMerge, DedupResidueHeal, or ArticleDuplicateHeal and derives the matching MachineActor. AbsorptionOrigin, AbsorptionActor, AbsorptionCaller, record envelopes, WorkAbsorption, worksMerged anchors, views, DTOs, and B0 refusal names are projections of that variant and are never free repository inputs.
    - No road or machine caller can pass an absorption permit, capability, prefix, or activation result. The repository alone consults the sealed ActivationReport it consumed at construction, returns the B0 named refusal before open under RefuseAll, and accesses crate-private open_absorption_operation only under RecordedV1.
    - A machine same-provider contradiction refuses the entire component before an operation opens and mints or reuses a GroupIdentity review card; no machine tie-break retires either id.
    - Every route-changing matrix cell and every absorption plans from locked live rows through route_plan. A route active on a third Work refuses before any write, and a Work-scoped provider slot never ends with two active ids.
    - "Route-plan ownership follows the existing taxonomy: OpenLibrary and Hardcover Work ids are Work-scoped; a legacy Goodreads book id, ISBN-13, and ASIN are Edition-scoped. Other same-provider Edition routes are not implicated by a Work-route conflict."
    - Incoming DifferentFromAll creates only when every member is certainly different and stamps durable user-distinct state on the created Work.
    - Incoming DifferentFromAll create commits the Work, its routes, and its durable user-distinct marker all-or-nothing and leaves every reviewed member's identity fields and routes unchanged. After that commit, the identity road hands exactly one history_events::added draft carrying the persisted add_source to the existing infallible HistoryService::record observer; an observer write failure cannot refuse or roll back the create, and worksMerged remains the sole transaction-fatal HistoryEvent exception.
    - Every absorption opens one version-1 operation record before its first operation-owned member write, records the schema-complete before/after closure, seals after its last such write, or rolls back whole; only named scan-snapshot card effects may follow under the causal high-water rule.
    - A settlement MachineSnapshot with several losers seals exactly one WorkAbsorption naming the full loser set. Dedup and article scans call the same repository door once per pair/component, so sibling operations remain independently recorded and undoable.
    - OpenAbsorptionOperation linearly owns the ImmediateTransaction while an operation is open and privately borrows the repository's existing SqliteWorkDelete for that scope; no caller retains a raw writer and no second delete authority is minted. absorb_work_into is the only absorption-time caller of delete_work_in_tx, using those two private fields. A successful completeness seal alone moves the transaction into SealedAbsorptionOperation, and commit_sealed_absorption_operation is that seal's only consumer.
    - Undo resolves every recorded selector, table, key column, and reversible column through the current validated EffectManifest; serialized envelope strings are data and are never interpolated as SQL identifiers.
    - The effect manifest combines the live foreign-key graph, triggers, retained-content policies, and a checked registry of non-FK Work pointers; unclassified references, triggers, overlaps, or post-seal writes fail startup or commit closed.
    - Each record pins its manifest schema version and digest. A later migration that changes a covered table must register a typed compatibility mapping before startup can accept new operations or undo an older record.
    - Each active prior record whose survivor is a member has a typed lineage edge recording its survivor post-generation and this operation's pre-decision generation; nested or sibling undo refuses unless the recorded edge still matches after permitted rebases.
    - Generic RowMutation images and the version-1 envelope remain repository-internal; every HTTP surface uses the sanitized AbsorptionView projection.
    - The sole Work delete authority owns the only production statement that physically deletes Works and has exactly four origins: User, ImportRollback, ListImportRollback, and Absorption. new_work_delete_authority is called exactly once during repository construction. For absorption, open_absorption_operation privately stores a borrow of that existing authority beside its writer, and absorb_work_into alone calls delete_work_in_tx; absorption_store contains no DELETE FROM works. delete_work_in_tx delegates to delete_work_set_in_tx, which borrows exactly the authority's optional LegacyPreCutoverWritePermit and is the sole caller of the crate-private legacy close. Some closes a pre-B4 loser's open row as machine work_deleted inside the still-open operation and records that close; None after B4 skips the close and leaves the legacy table byte-identical. The authority also cancels pending cards by membership, preserves history, and stages counted v2 diagnostics.
    - Absorption resolves only its initiating card and withdraws every other pending card it invalidates; it records every minted, reused, resolved, or cancelled card id and never repoints unrelated cards to the survivor.
    - The initiating resolving card is retained through undo with its resolution content and audit unchanged; only its Work pointer follows the reversible lineage. Other pre-operation questions restore from their before-images and post-operation merged-graph questions are cancelled.
    - "Notifications are reversible effects of the cards they name: withdrawal removes actionability, restoration restores it, and no notification points to a withdrawn actionable card."
    - Settlement and continuation keep their two separate generation claims. Every absorbed member is claimed, and undo advances generations on every restored Work.
    - A version-1 absorption record lives exactly as long as its survivor, including when undone. V0 archive rows remain inert history and are never treated as restorable.
    - Database undo validates every non-file after-image and restores every before-image in one BEGIN IMMEDIATE transaction or refuses whole. A forward-moved item's path alone leaves generic row equality; the recorded forward after-location must still equal the user-scoped LibraryItem path until reverse, any unrelated row change refuses, and the truthful current path remains until the file step.
    - Undo advances every restored Work generation. Undo of a machine operation also stamps durable user-distinct state on every restored member, preventing a later machine re-merge while preserving the user merge door.
    - Forward and undo file completion share one no-clobber engine. It never overwrites a destination occupied before or during a move, never destroys the only copy, reports a leftover source, and names both locations whenever record and filesystem disagree.
    - A file batch may fail before its first item on invalid input or repository preflight; after any item side effect begins, filesystem and record failures are per-item dispositions and the batch returns one result for every requested item.
    - After an absorption or database restore commits, incomplete file work is successful result data in FileMoveReport and AbsorptionView, never an error that implies the database transaction rolled back.
    - File completion has no transition journal, file claims, lock protocol, startup owner, automatic crash reconciliation, or timer. An incomplete undo is visible and only explicitly retried.
    - ReviewDismissalKeyV2 is the only new key definition. V1 GroupIdentity remains live only when proposed is None; other V1 group rows are retained but inert. Adopted route-conflict and Unknown-role cards never write a dismissal key.
    - A keyable KeepExisting or AcceptSeparate resolution suppresses only its exact persisted question key; a keyable Dismiss writes the same key to the standing dismissal ledger. Non-keyable Keep, Accept, and Dismiss affect only that card.
    - IdentityPark has one card per parked Work and keys candidate identity content, never consume-once ids. Candidate existing_work_id is informational and choosing a candidate cannot absorb.
    - Newly raised conflict cards persist the exact contradicted route. QuorumTie uses NotApplicable. Every adopted route-conflict uses UnknownLegacy; the current route or mutable anchor ledger is never substituted.
    - identity_conflicts_v2 remains staging only. Its lifecycle diagnostics are immutable audit; currentness is derived from the linked operation lifecycle and it never affects a user surface.
    - A v2 diagnostic linked to an absorption is current if and only if that operation is active; undoing and undone are historical because the database question has already been restored.
    - A v2 staging row closes only when its current Work is deleted or absorption makes its Work-typed pair self-referential; a row pointing at a third Work stays pending, and B4 counts each pending row or current diagnostic exactly once.
    - B4 performs pointer census, total legacy hydration/adoption, corrected record translation, diagnostic counting, authority switch, and marker in one BEGIN IMMEDIATE transaction. It runs once, changes nothing on a second run, and does not globally refuse an operation whose database restore is complete and files remain pending.
    - SqliteIdentityAuthorityActivation::activate_identity_authority is the sole constructor of MarkerAbsent, LegacyPreCutoverWritePermit, CutoverReadPermit, ConflictCutoverRequest, RecordedAbsorptionPermit, AbsorptionCapability, and ActivationReport. For B0-B3 it seals the legacy write permit into the report; for B4 it passes the cutover permit and request to the crate-private helper, whose only scan call is also crate-private, using the same ImmediateTransaction that writes the marker. It never exposes a raw marker or a second constructor.
    - After the B4 marker, no production statement except the named legacy history reader names work_identity_conflicts and every user conflict operation enters review-card authority.
    - No SQL exists outside livrarr-db, handlers contain no business or file logic, every user-scoped query carries user_id, applied migrations remain immutable, and every write transaction is BEGIN IMMEDIATE.

build_units:
  - id: B0
    name: shared contracts, schema, delete authority, and dead surface
    modules: [identity_authority_contracts, identity_authority_services, identity_authority_activation_contracts, identity_authority_transaction, review_card_store, absorption_store, work_delete, legacy_identity_conflict_history, conflict_cutover, identity_authority_activation, identity_authority_repository, identity_road, identity_authority_application, identity_authority_handlers, identity_authority_client, identity_authority_oracles]
    capability: "ActivationReport carries AbsorptionCapability::RefuseAll plus Some(LegacyPreCutoverWritePermit). The five refusal names are projections of the closed user/machine request variants—manual merge, review continuation, settlement AutoMerge, dedup heal, and article heal—and all refuse with zero absorption writes. Repository construction uses the report to construct exactly one SqliteWorkDelete, which borrows its permit only for the pre-B4 legacy close. IdentityPark actions also remain refused."
    release_status: non-releasable alone
  - id: B1
    name: recorded operation and route-plan enforcement
    modules: [identity_authority_contracts, identity_authority_services, identity_authority_activation_contracts, identity_authority_transaction, route_plan, absorption_store, work_delete, conflict_cutover, identity_authority_activation, identity_authority_repository, identity_road, library_item_path_store, file_reorganization, identity_authority_application, identity_authority_oracles]
    capability: "AbsorptionCapability::RecordedV1 is read only from the repository's held ActivationReport. UserElection admits only ManualPair or ReviewContinuation plus user and verified election; MachineSnapshot admits only SettlementAutoMerge, DedupResidueHeal, or ArticleDuplicateHeal plus its complete snapshot. The named road wrapper fixes the variant, and derived provenance feeds the record, views, B0 names, and worksMerged anchor. The one repository door opens and seals one operation with one route plan, its moved ImmediateTransaction, and a private borrow of the repository's sole SqliteWorkDelete; absorb_work_into routes every loser through that authority and card withdrawal. A user pair lacking the B2-supported preview remains a named refusal."
    release_status: "first releasable prefix is exactly B0+B1; B0 and B1 ship in one release"
  - id: B2
    name: role matrix, three-valued decisions, survivor election, preview, and stale proof
    modules: [identity_authority_contracts, identity_authority_services, identity_authority_activation_contracts, identity_authority_transaction, review_card_store, route_plan, identity_authority_activation, identity_authority_repository, identity_road, identity_authority_application, identity_authority_handlers, identity_authority_client, identity_authority_oracles]
    capability: "Activates the complete 5-by-2 GroupIdentity matrix and preview-bound pairwise user decisions. Incoming DifferentFromAll commits Work, routes, and user-distinct marker together, then submits one added draft to the existing infallible history observer."
    release_status: releasable prefix B0+B1+B2
  - id: B3
    name: database undo and simple file move-back
    modules: [identity_authority_contracts, identity_authority_services, identity_authority_activation_contracts, identity_authority_transaction, absorption_store, identity_authority_activation, identity_authority_repository, identity_road, library_item_path_store, file_reorganization, identity_authority_application, identity_authority_handlers, identity_authority_client, identity_authority_oracles]
    capability: "Activates whole-operation database restore, nested and sibling lineage, machine distinctness, causal card withdrawal, shared forward/undo file reports, and explicit incomplete retry."
    release_status: releasable prefix B0+B1+B2+B3
  - id: B4
    name: conflict adoption, action matrix, park authority, projection, and guard
    modules: [identity_authority_contracts, identity_authority_services, identity_authority_activation_contracts, identity_authority_transaction, review_card_store, route_plan, work_delete, legacy_identity_conflict_history, conflict_cutover, identity_authority_activation, identity_authority_repository, identity_road, identity_authority_application, identity_authority_handlers, identity_authority_client, identity_authority_oracles]
    capability: "Runs the one-shot cutover through the crate-private scan/helper chain, returns an ActivationReport whose legacy-close permit is None, and activates the 5-by-4 conflict matrix, non-keyable adopted cards, IdentityPark, parked_by_conflicts, and the post-marker legacy guard. Work deletion then skips legacy close and cannot infer marker absence from _livrarr_meta."
    release_status: releasable full prefix B0+B1+B2+B3+B4

notes:
  - "REQ-008 belongs to the superseded v2 CLI and is explicitly out of scope; this architecture adds no CLI surface."
