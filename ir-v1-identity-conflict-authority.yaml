        - name: "IdentityAuthorityRoad::preview_merge"
          inputs:
            - { name: request, type: MergePreviewRequest }
          output: "Result<MergePreviewSnapshot, IdentityAuthorityError>"
          errors: [IdentityAuthorityError]
        - name: "IdentityAuthorityRoad::execute_merge"
          inputs:
            - { name: request, type: VerifiedMergeExecuteRequest }
          output: "Result<AbsorptionOutcome, IdentityAuthorityError>"
          errors: [IdentityAuthorityError]
        - name: "IdentityAuthorityRoad::execute_settlement_auto_merge"
          inputs:
            - { name: snapshot, type: MachineAbsorptionSnapshot }
          output: "Result<AbsorptionOutcome, IdentityAuthorityError>"
          errors: [IdentityAuthorityError]
        - name: "IdentityAuthorityRoad::execute_dedup_residue_heal_absorption"
          inputs:
            - { name: snapshot, type: MachineAbsorptionSnapshot }
          output: "Result<AbsorptionOutcome, IdentityAuthorityError>"
          errors: [IdentityAuthorityError]
        - name: "IdentityAuthorityRoad::execute_article_duplicate_heal_absorption"
          inputs:
            - { name: snapshot, type: MachineAbsorptionSnapshot }
          output: "Result<AbsorptionOutcome, IdentityAuthorityError>"
          errors: [IdentityAuthorityError]
        - name: "IdentityAuthorityRoad::undo_absorption"
          inputs:
            - { name: request, type: UndoAbsorptionRequest }
          output: "Result<UndoOutcome, IdentityAuthorityError>"
          errors: [IdentityAuthorityError]
        - name: "IdentityAuthorityRoad::read_absorption"
          inputs:
            - { name: user_id, type: UserId }
            - { name: record_id, type: AbsorptionRecordId }
          output: "Result<AbsorptionView, IdentityAuthorityError>"
          errors: [IdentityAuthorityError]
        - name: "IdentityAuthorityRepository::read_card_snapshot"
          inputs:
            - { name: user_id, type: UserId }
            - { name: card_id, type: ReviewCardId }
