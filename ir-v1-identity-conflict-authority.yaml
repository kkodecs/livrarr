amendments:
  - date: "2026-08-29"
    status: adopted (PO, 2026-08-29; canonical model amended the same day)
    entity: WorkAbsorption
    change: Adopt the recorded, user-visible, undoable WorkAbsorption concept as the 21st canonical spine entity.
    reason: It has a durable survivor-scoped lifetime, an active-to-undone lifecycle, user-visible history and file outcomes, and invariants consumed by Work deletion, review cards, routes, undo, and startup activation. The adopted entity is present in domain_entities and identity_authority_contracts exposes the public WorkAbsorption struct required by the canonical reverse gate.

