        - name: "IdentityAuthorityRepository::list_review_cards"
          inputs:
            - { name: query, type: ReviewListQuery }
          output: "Result<Vec<ReviewCard>, RepositoryError>"
          errors: [RepositoryError]
        - name: "IdentityAuthorityRepository::apply_nonabsorbing_decision"
          inputs:
            - { name: request, type: VerifiedCardDecision }
          output: "Result<ReviewDecisionOutcome, RepositoryError>"
