        - name: "IdentityAuthorityRepository::execute_absorption"
          implementation_path: "begin_identity_authority_write -> plan/apply routes -> open_absorption_operation consumes the transaction and borrows &self.work_delete -> absorb_work_into uses both private operation fields -> seal_absorption_operation -> commit_sealed_absorption_operation; the repository retains no raw writer and constructs no second delete authority"
          inputs:
            - { name: request, type: RecordedAbsorptionRequest }
