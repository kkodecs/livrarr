            - { name: record_id, type: AbsorptionRecordId }
          output: "Result<AbsorptionView, IdentityAuthorityError>"
          errors: [IdentityAuthorityError]
        - name: "IdentityAuthorityRoad::list_review_snapshots"
          inputs:
            - { name: query, type: ReviewListQuery }
          output: "Result<Vec<ReviewCardReadSnapshot>, IdentityAuthorityError>"
          errors: [IdentityAuthorityError]
        - name: "IdentityAuthorityRoad::read_review_snapshot"
          inputs:
            - { name: user_id, type: UserId }
            - { name: card_id, type: ReviewCardId }
          output: "Result<ReviewCardReadSnapshot, IdentityAuthorityError>"
          errors: [IdentityAuthorityError]
        - name: "IdentityAuthorityRoad::preview_review"
          inputs:
            - { name: request, type: ReviewPreviewRequest }
          output: "Result<ReviewPreviewSnapshot, IdentityAuthorityError>"
          errors: [IdentityAuthorityError]
        - name: "IdentityAuthorityRoad::resolve_review"
          inputs:
            - { name: request, type: VerifiedReviewDecisionRequest }
          output: "Result<ReviewDecisionOutcome, IdentityAuthorityError>"
