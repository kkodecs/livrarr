# Data-flow contract — the map the code is held to.
data_flow:
  sources:
    - { entity: ProviderCallRecord, origin: "instrumentation", description: "every provider fetch attempt across lookup/identity/enrich/cover — network, cache-served, or skipped — emitted at the client/pipeline site through ProviderCallSink (REQ-001)" }
    - { entity: FieldDissent, origin: "merge-engine", description: "conflict detection at provider or field granularity, incl. known-incompatible language on foreign works (REQ-013/014)" }
    - { entity: Release, origin: "http-api", description: "indexer Torznab/Newznab searches — unchanged behavior, conforming type (REQ-004)" }
    - { entity: CapturedIdentity, origin: "identity-track", description: "anchors enter ONLY via add-time resolution (REQ-010), refresh-time completion (REQ-008), or user edit — never enrichment (REQ-007)" }
    - { entity: LogSurfaceStatus, origin: "startup", description: "tracing init outcome captured at boot; failure recorded, not swallowed (REQ-003)" }
    - { entity: Work, origin: "stored-cover-decode", description: "cover width/height read from the stored image file at save/re-resolve, trust-independent (REQ-017)" }
  sinks:
    - { entity: ProviderCallRecord, destination: "provider_call_records table -> status-page provider panel (24h aggregates); retention-evicted at 30d/100k oldest-first (REQ-001/002)" }
    - { entity: FieldDissent, destination: "work_field_dissents table, queryable per work; superseded when the work's next merge generation records anew (REQ-014)" }
    - { entity: Work, destination: "works table via the guarded merge write (no-clobber on anchors/cover_url/language) and update_cover_dimensions (REQ-009/017)" }
    - { entity: LogSurfaceStatus, destination: "status page log section + stderr at startup (REQ-003)" }
  state_machines:
    - entity: BulkRefreshGuard
      states: ["idle", "running"]
      transitions:
        - { from: idle, to: running, trigger: "try_start_bulk_refresh -> Some(guard)" }
        - { from: running, to: idle, trigger: "guard Drop — completion, error return, panic unwind, or task abort; never leaks (REQ-016)" }
    - entity: AnchorCompletionReport
      states: ["eligible", "suppressed", "resolved"]
      transitions:
        - { from: eligible, to: resolved, trigger: "deterministic match or LLM confirmation (REQ-008)" }
        - { from: eligible, to: suppressed, trigger: "completion failed/not-found -> existing per-provider retry-suppression records it" }
        - { from: suppressed, to: eligible, trigger: "identity inputs change (user edit, new anchor) or explicit user retry — never plain refresh repetition" }
    - entity: EnrichmentStatus
      states: ["Unenriched", "Enriched", "Thin", "Failed"]
      transitions:
        - { from: Unenriched, to: Enriched, trigger: "add with identity leg + sync enrichment (REQ-010 ends the permanently-unenriched add)" }
        - { from: Unenriched, to: Thin, trigger: "same road, sparse payloads" }
        - { from: Unenriched, to: Failed, trigger: "enrichment failure; whole-work Conflict outcome retired (REQ-014)" }
    - entity: CapturedIdentity
      states: ["anchor-absent", "anchor-established", "conflict-raised"]
      transitions:
        - { from: anchor-absent, to: anchor-established, trigger: "identity track only: add-time resolve, refresh completion, user edit (REQ-007/008/010)" }
        - { from: anchor-established, to: anchor-established, trigger: "user edit only (monotonicity; enrichment can never mutate)" }
        - { from: anchor-established, to: conflict-raised, trigger: "contradicting evidence -> IdentityConflict raised to the user (existing flow, unchanged)" }
  invariants:
    - "Only the identity track creates, mutates, or clears anchors — across all three stores: inline works columns, work_identity_anchors, external_ids (REQ-007, ST-006)"
    - "Enrichment-phase fetches are constructible only from stored anchors (AnchorQuery); no text-search path exists in any enrichment fetch (REQ-006, AC-007)"
    - "A merge-driven work update never overwrites a populated anchor, cover_url, or language with NULL/empty (REQ-009; language is policy-load-bearing)"
    - "A skipped provider always beats an unanchored fetch — correctness over coverage (spec principle 2)"
    - "Dissent isolates at provider or field granularity and never discards the work's merge (REQ-014); identity-level conflicts keep their existing user-facing flow"
    - "No OpenLibrary or Hardcover metadata is ever written onto a foreign-language work, on any path (REQ-012, canonical language-integrity invariant)"
    - "Call records survive restart and stay within 30d/100k bounds, oldest evicted (REQ-001)"
    - "Every fix lands at an existing chokepoint (merge engine, identity resolver, the one save home, the single WorkService doors); no new pipeline paths or per-door special cases (spec principle 4)"
    - "User-set covers survive every refresh and bulk refresh; provenance order User > Provider > System is absolute (REQ-019, canonical invariant)"

