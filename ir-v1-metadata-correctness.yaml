# IR v1 — Structural
# Feature: metadata-correctness (Sprint B of the alpha-6 correctness cycle)
# System structure, module boundaries, types, and APIs. No pseudocode.
# Governing frame: architecture/canonical-model.yaml (entity spine + seams).
# All signatures below verified against main @ ac296ad by direct read.

metadata:
  feature: "metadata-correctness"
  stage: v1-structural
  spec_ref: "spec-metadata-correctness.md"
  version: 1

system_architecture:
  components:
    - { name: "livrarr-domain", description: "shared types + service traits: call-record types and sink trait, dissent types, anchor-query type, Release entity home, log-surface status", type: "rust-crate" }
    - { name: "livrarr-db", description: "persistence: provider_call_records + work_field_dissents tables, retention eviction, hardened apply_enrichment_merge (anchor binds removed, no-clobber guards), WorkFilter language scoping, drop works.metadata_source", type: "rust-crate" }
    - { name: "livrarr-external-data", description: "provider clients: anchor-only enrichment fetch surface (AnchorQuery), per-fetch call-record emission via injected sink; text search remains only on lookup/identity surfaces", type: "rust-crate" }
    - { name: "livrarr-identity", description: "identity-grade anchor acquisition: refresh-time anchor completion (new) and add-time full resolution incl. ASIN; bounded by existing per-provider retry-suppression", type: "rust-crate" }
    - { name: "livrarr-enrichment", description: "anchor-grounded scatter (skip+record when anchor missing), per-field/per-provider dissent isolation in merge, merge output stripped of all identity/anchor writes", type: "rust-crate" }
    - { name: "livrarr-metadata", description: "orchestration: identity-completion-before-scatter on refresh, add-door identity leg for anchor-less candidates, filter-scoped Refresh All, RAII bulk-refresh guard, cover-dimension persistence", type: "rust-crate" }
    - { name: "livrarr-library", description: "import save rerouted through livrarr-materialize; direct livrarr-tagwrite dependency removed", type: "rust-crate" }
    - { name: "livrarr-materialize", description: "the one save home: import-time tag persistence entry consumed by library; cover save returns stored-image dimensions read via the image crate", type: "rust-crate" }
    - { name: "livrarr-handlers", description: "HTTP surface behind the compile wall: status-page provider panel + truthful log section, Refresh All passing the active view filters", type: "rust-crate" }
    - { name: "livrarr-server", description: "composition root: buffered ProviderCallSink impl writing via livrarr-db, retention sweep scheduling, tracing init that surfaces log-dir failure (status + stderr), removal of the dead duplicate AppState.refresh_in_progress guard", type: "rust-crate" }
    - { name: "livrarr-matching", description: "Tier-A variant-title acceptance: (Unabridged) suffixes, ': <subtitle>, Book N' forms, translated-subtitle variants, diacritic folding (unicode-normalization); no new false positives", type: "rust-crate" }
    - { name: "livrarr-download", description: "consumes the domain Release type; release search/grab/RSS behavior unchanged (rename conformance only)", type: "rust-crate" }
    - { name: "livrarr-behavioral", description: "behavioral test harness: regression pins (discovery language, foreign HC/OL exclusion, user-cover survival) and the new suites for anchors/dissent/instrumentation", type: "rust-crate" }
    - { name: "ui-frontend", description: "status page: provider panel + log section; library: language filter facet (Refresh All button unchanged, scope follows filters)", type: "react-spa" }
  connections:
    - { from: "ui-frontend", to: "livrarr-server", protocol: "HTTP/JSON (axum 0.8)", description: "provider stats panel, log surface status, library language facet, refresh-all under active filters" }
    - { from: "livrarr-server", to: "sqlite", protocol: "sqlx 0.8 / SQLite WAL", description: "works + the three anchor stores, provider_call_records, work_field_dissents" }
    - { from: "livrarr-server", to: "metadata-providers", protocol: "HTTPS (reqwest+rustls)", description: "Goodreads autocomplete only (ST-012), Google Books keyed only (ST-014), Hardcover, OpenLibrary app-UA only (ST-015), Audnexus, Audible" }
    - { from: "livrarr-server", to: "llm-endpoint", protocol: "HTTPS", description: "identity disambiguation only (Goodreads requires LLM); no new LLM call sites in this feature" }
  deployment:
    topology: "single Docker container (existing); SQLite WAL on the data volume"
    notes: "no deployment changes; new tables + column drop ride migrations 059+ (current max 058)"

languages:
  - { language: "Rust", version: "2021 edition (workspace)", usage: "all backend crates" }
  - { language: "TypeScript", version: "existing ui/ stack", usage: "status panel + library facet UI" }

frameworks:
  - { name: "axum", version: "0.8", usage: "HTTP handlers (existing)" }
  - { name: "sqlx", version: "0.8", usage: "SQLite persistence + migrations (existing)" }
  - { name: "React", version: "existing ui/ stack", usage: "frontend components (existing patterns)" }

# No NEW dependencies. Every entry below already exists in the workspace.
approved_libraries:
  - { name: "sqlx", version: "0.8", usage: "call-record + dissent tables, retention eviction, migrations" }
  - { name: "chrono", version: "workspace", usage: "timestamps on records/dissents (project-wide rule: chrono, never time)" }
  - { name: "image", version: "0.25", usage: "cover width/height decode from the stored image file (already a dep of enrichment/metadata/server)" }
  - { name: "tracing", version: "0.1", usage: "instrumentation points" }
  - { name: "tracing-appender", version: "0.2", usage: "existing daily rolling file appender (REQ-003 surfaces its init truthfully)" }
  - { name: "serde", version: "workspace", usage: "API DTOs" }
  - { name: "trait-variant", version: "workspace", usage: "async service traits (make(Send)); NOT used for ProviderCallSink which is deliberately sync+dyn-safe" }
  - { name: "tokio", version: "workspace", usage: "guards, spawned bulk task, buffered sink channel" }
  - { name: "unicode-normalization", version: "0.1", usage: "diacritic folding in variant-title matching (already a dep of livrarr-matching)" }
  - { name: "rapidfuzz", version: "0.5", usage: "existing matcher core (unchanged)" }
  - { name: "regex", version: "1", usage: "variant-form parsing in matching (existing dep)" }

modules:
  # ---------------------------------------------------------------- domain
  - name: livrarr-domain
    responsibility: >
      Shared vocabulary for the feature. New: provider call-record types + the
      dyn-safe ProviderCallSink trait (REQ-001), provider-stats DTO + async stats
      service trait (REQ-002), field-dissent types (REQ-013/014), AnchorQuery (the
      type that makes text search unconstructible from enrichment fetches, REQ-006),
      LogSurfaceStatus (REQ-003), WorkFilter gains language (REQ-015). Release
      struct moves here from livrarr-download (REQ-004) per the canonical spine
      (entity home: livrarr-domain); field-for-field identical, all-primitive.
    req_refs: [REQ-001, REQ-002, REQ-003, REQ-004, REQ-006, REQ-013, REQ-014, REQ-015]
    dependencies: []
    public_api:
      types:
        - kind: struct
          name: ProviderCallRecord
          fields:
            - { name: provider, type: "String" }
            - { name: operation, type: "CallOperation" }
            - { name: work_id, type: "Option<WorkId>" }
            - { name: started_at, type: "DateTime<Utc>" }
            - { name: duration_ms, type: "i64" }
            - { name: outcome, type: "CallOutcomeClass" }
            - { name: detail, type: "Option<String>  # short outcome detail, e.g. error class; never payload bodies" }
        - kind: enum
          name: CallOperation
          fields:
            - { name: Lookup, type: "" }
            - { name: Identity, type: "" }
            - { name: Enrich, type: "" }
            - { name: Cover, type: "" }
        - kind: enum
          name: CallOutcomeClass
          fields:
            - { name: Success, type: "" }
            - { name: NotFound, type: "" }
            - { name: RateLimited, type: "" }
            - { name: Timeout, type: "" }
            - { name: Error, type: "" }
            - { name: SkippedNoAnchor, type: "" }
            - { name: SkippedPolicy, type: "" }
            - { name: LlmRejected, type: "" }
            - { name: Cached, type: "" }
        - kind: struct
          name: ProviderStats
          fields:
            - { name: provider, type: "String" }
            - { name: calls_24h, type: "i64" }
            - { name: success_rate, type: "f64" }
            - { name: median_latency_ms, type: "i64" }
            - { name: last_error, type: "Option<(String, DateTime<Utc>)>" }
            - { name: last_success, type: "Option<DateTime<Utc>>" }
        - kind: struct
          name: FieldDissent
          fields:
            - { name: work_id, type: "WorkId" }
            - { name: provider, type: "String" }
            - { name: field, type: "String  # work column name; empty-marker variant NOT used — payload-level dissent lists affected fields" }
            - { name: offered_value, type: "String" }
            - { name: winning_value, type: "Option<String>" }
            - { name: reason, type: "DissentReason" }
            - { name: merge_generation, type: "i64" }
            - { name: recorded_at, type: "DateTime<Utc>" }
        - kind: enum
          name: DissentReason
          fields:
            - { name: PayloadMismatch, type: "  # provider appears to describe a different book" }
            - { name: FieldConflict, type: "  # contradictory value for one field" }
            - { name: LanguageIncompatible, type: "  # REQ-013: known-incompatible payload language on a foreign work" }
        - kind: enum
          name: AnchorQuery
          fields:
            - { name: Isbn13, type: "String" }
            - { name: GrKey, type: "String" }
            - { name: HcKey, type: "String" }
            - { name: OlKey, type: "String" }
            - { name: Asin, type: "String" }
        - kind: struct
          name: Release
          fields:
            - { name: title, type: "String" }
            - { name: indexer, type: "String" }
            - { name: size, type: "i64" }
            - { name: guid, type: "String" }
            - { name: download_url, type: "String" }
            - { name: seeders, type: "Option<i32>" }
            - { name: leechers, type: "Option<i32>" }
            - { name: publish_date, type: "Option<String>" }
            - { name: categories, type: "Vec<i32>" }
        - kind: struct
          name: LogSurfaceStatus
          fields:
            - { name: active_path, type: "PathBuf  # the daily rolling file actually written" }
            - { name: init_error, type: "Option<String>  # log-dir creation/write failure, surfaced not swallowed" }
        - kind: struct
          name: AnchorCompletionReport
          fields:
            - { name: resolved, type: "Vec<(String, String)>  # (anchor_type, value) newly established via identity track" }
            - { name: skipped, type: "Vec<(String, String)>  # (provider, reason: suppressed | not_found | unresolvable)" }
      functions:
        - name: "ProviderCallSink::record"
          inputs:
            - { name: rec, type: "ProviderCallRecord" }
          output: "()  # fire-and-forget; sync + dyn-safe (Arc<dyn ProviderCallSink>) so external-data can record without a db edge or trait_variant generics"
          errors: []
        - name: "ProviderStatsService::provider_stats_24h"
          inputs: []
          output: "Result<Vec<ProviderStats>, ServiceError>  # async trait (trait_variant), impl in server, queried by handlers via a Has* bound"
          errors: ["ServiceError"]

  # ---------------------------------------------------------------- db
  - name: livrarr-db
    responsibility: >
      Three migrations (numbers from current max 058): provider_call_records table
      (REQ-001), work_field_dissents table (REQ-014), drop works.metadata_source
      (REQ-018; new migration, applied migrations never edited). Call-record write
      batch + 24h stats query + retention eviction (30 days / 100k, oldest first).
      apply_enrichment_merge hardened: ApplyEnrichmentMergeRequest loses all anchor
      fields so the UPDATE no longer carries hc_key/gr_key/ol_key/isbn_13/asin binds
      (REQ-007 made structural), and cover_url + language gain no-clobber COALESCE
      guards alongside the existing populated-never-overwritten-by-NULL provenance
      rule extended to them (REQ-009). WorkFilter.language threads into the works
      query (REQ-015). update_cover_dimensions (verified zero callers today) gains
      its first caller via livrarr-metadata (REQ-017).
    req_refs: [REQ-001, REQ-002, REQ-007, REQ-009, REQ-014, REQ-015, REQ-017, REQ-018]
    dependencies: [livrarr-domain]
    public_api:
      types:
        - kind: struct
          name: RetentionPolicy
          fields:
            - { name: max_age_days, type: "u32  # default 30" }
            - { name: max_records, type: "u64  # default 100_000" }
      functions:
        - name: record_provider_calls
          inputs:
            - { name: batch, type: "Vec<ProviderCallRecord>" }
          output: "Result<(), DbError>"
          errors: ["DbError"]
        - name: query_provider_stats_24h
          inputs: []
          output: "Result<Vec<ProviderStats>, DbError>"
          errors: ["DbError"]
        - name: evict_call_records
          inputs:
            - { name: policy, type: "RetentionPolicy" }
          output: "Result<u64, DbError>  # rows evicted"
          errors: ["DbError"]
        - name: record_field_dissents
          inputs:
            - { name: work_id, type: "WorkId" }
            - { name: dissents, type: "Vec<FieldDissent>" }
          output: "Result<(), DbError>  # supersedes prior generation's dissents for the work"
          errors: ["DbError"]
        - name: list_field_dissents
          inputs:
            - { name: work_id, type: "WorkId" }
          output: "Result<Vec<FieldDissent>, DbError>"
          errors: ["DbError"]
        - name: apply_enrichment_merge
          inputs:
            - { name: req, type: "ApplyEnrichmentMergeRequest  # MODIFIED existing type: anchor fields removed; cover_url/language guarded" }
          output: "Result<ApplyMergeOutcome, DbError>"
          errors: ["DbError"]

  # ---------------------------------------------------------------- external-data
  - name: livrarr-external-data
    responsibility: >
      The anchor-only enrichment fetch surface: one entry per provider taking
      AnchorQuery — no seed, no title/author parameters reachable from enrichment
      (REQ-006, AC-007 'no text-search request constructible'). Existing
      title/author search functions remain but only on the lookup/identity
      surfaces. Every fetch attempt (network, cache-served, skipped, LLM-rejected)
      emits one ProviderCallRecord through the constructor-injected
      Arc<dyn ProviderCallSink> (REQ-001). Substrate seam unchanged: depends only
      on domain + http; recording crosses to storage via the domain trait, never a
      db edge.
    req_refs: [REQ-001, REQ-006]
    dependencies: [livrarr-domain, livrarr-http]
    public_api:
      types: []
      functions:
        - name: "ProviderClient::fetch_by_anchor"
          inputs:
            - { name: query, type: "AnchorQuery" }
            - { name: language, type: "Option<String>  # work language for policy gates, not for search" }
          output: "ProviderOutcome<NormalizedWorkDetail>  # EXISTING outcome type; NotFound when the anchor doesn't resolve — never falls back to text search"
          errors: []

  # ---------------------------------------------------------------- identity
  - name: livrarr-identity
    responsibility: >
      Anchor completion with identity rigor (REQ-008): deterministic matching
      first, LLM disambiguation where the provider requires it (Goodreads, ST-012),
      never first-hit adoption; a failed completion leaves the anchor absent.
      Re-attempt boundedness honors the existing per-provider retry-suppression
      semantics; suppression state is read/written by the orchestrator layer
      (identity has no db edge — results return in AnchorCompletionReport and the
      caller persists via the identity repository). Add-time resolution extended to
      populate all resolvable anchors including ASIN (REQ-010 / Sprint E
      prerequisite). Emits Identity-operation call records via the sink (REQ-001).
    req_refs: [REQ-001, REQ-008, REQ-010]
    dependencies: [livrarr-domain, livrarr-external-data, livrarr-http]
    public_api:
      types: []
      functions:
        - name: complete_anchors
          inputs:
            - { name: user_id, type: "UserId" }
            - { name: work, type: "&Work" }
            - { name: suppressed_providers, type: "Vec<String>  # caller-supplied from provider_retry_state; identity stays db-free" }
          output: "Result<AnchorCompletionReport, WorkIdentityError>"
          errors: ["WorkIdentityError"]

  # ---------------------------------------------------------------- enrichment
  - name: livrarr-enrichment
    responsibility: >
      Scatter consumes stored anchors only: per provider, derive AnchorQuery from
      the work's anchors; no anchor means skip + record SkippedNoAnchor (REQ-006).
      The merge cannot write identity: EnrichmentResult/merge output lose anchor
      values and the external-id upsert emission entirely — across all three anchor
      stores (REQ-007, ST-006). Per-field/per-provider dissent: a conflicting
      contribution is excluded at provider or field granularity, recorded as
      FieldDissent, and the rest merges normally; the whole-work Conflict outcome
      is retired (REQ-014). Known-incompatible payload language on a foreign work
      is dissent, unknown language is not (REQ-013). The foreign HC/OL drop stays
      documented at the merge chokepoint (REQ-012, ST-002). Emits Enrich/Cover
      call records incl. Cached and SkippedPolicy (REQ-001).
    req_refs: [REQ-001, REQ-006, REQ-007, REQ-012, REQ-013, REQ-014]
    dependencies: [livrarr-domain, livrarr-external-data, livrarr-db, livrarr-http]
    public_api:
      types:
        - kind: struct
          name: EnrichmentResult
          fields:
            - { name: "(existing fields)", type: "unchanged" }
            - { name: dissents, type: "Vec<FieldDissent>  # NEW: recorded by the pipeline after merge" }
      functions:
        - name: "EnrichmentService::enrich_work"
          inputs:
            - { name: user_id, type: "UserId" }
            - { name: work_id, type: "WorkId" }
            - { name: mode, type: "EnrichmentMode" }
            - { name: candidate_id, type: "Option<CandidateId>" }
          output: "Result<EnrichmentResult, EnrichmentError>  # EXISTING signature unchanged (the one road); internals become anchor-grounded"
          errors: ["EnrichmentError"]

  # ---------------------------------------------------------------- metadata (orchestrator)
  - name: livrarr-metadata
    responsibility: >
      Ordering and doors. refresh (any door, any mode) runs identity anchor
      completion BEFORE the enrichment scatter and persists newly resolved anchors
      via the identity repository honoring monotonicity (REQ-008). add runs the
      identity leg for anchor-less candidates (today: GB-sourced) so every add door
      produces anchors + the standard synchronous enrichment leg (REQ-010); all six
      creation doors already funnel through WorkService::add (door->road trace at
      design). Refresh All operates on exactly the active-filter selection via
      WorkFilter incl. the new language facet (REQ-015). try_start_bulk_refresh
      returns an RAII BulkRefreshGuard whose Drop releases the per-user slot —
      panic or early exit can no longer leave a permanent 409 (REQ-016). Cover
      resolution persists stored-image dimensions via update_cover_dimensions,
      for new, refreshed, and user-locked covers alike (REQ-017). Emits Lookup
      call records from the discovery fan-out (REQ-001).
    req_refs: [REQ-001, REQ-008, REQ-010, REQ-015, REQ-016, REQ-017]
    dependencies: [livrarr-domain, livrarr-db, livrarr-external-data, livrarr-identity, livrarr-enrichment, livrarr-materialize, livrarr-http, livrarr-matching]
    public_api:
      types:
        - kind: struct
          name: BulkRefreshGuard
          fields:
            - { name: "(opaque)", type: "holds the shared per-user slot set + user id; Drop releases; not Clone" }
      functions:
        - name: "WorkService::try_start_bulk_refresh"
          inputs:
            - { name: user_id, type: "UserId" }
          output: "Option<BulkRefreshGuard>  # MODIFIED from bool; None = already running (handler keeps 409)"
          errors: []
        - name: "WorkService::refresh_all_filtered"
          inputs:
            - { name: user_id, type: "UserId" }
            - { name: filter, type: "WorkFilter  # language/monitored/enrichment_status/media_type intersected" }
          output: "Result<BulkRefreshReport, WorkServiceError>"
          errors: ["WorkServiceError"]

  # ---------------------------------------------------------------- library + materialize
  - name: livrarr-library
    responsibility: >
      Import-time metadata/tag persistence goes through livrarr-materialize (the
      one save home); the direct livrarr-tagwrite dependency is removed (REQ-005,
      canonical amendment S1 conformance; AC-006 checked via cargo tree). Observable
      import behavior unchanged: EPUB tag writes load-bearing, audio writes remain
      disabled.
    req_refs: [REQ-005]
    dependencies: [livrarr-domain, livrarr-db, livrarr-materialize]
    public_api:
      types: []
      functions: []

  - name: livrarr-materialize
    responsibility: >
      Gains the import-save entry consumed by livrarr-library (REQ-005). Cover save
      additionally decodes the stored image's dimensions (image crate) and returns
      them to the orchestrator; materialize keeps no db edge, so persistence of
      dimensions happens in livrarr-metadata (REQ-017).
    req_refs: [REQ-005, REQ-017]
    dependencies: [livrarr-domain, livrarr-http, livrarr-tagwrite]
    public_api:
      types:
        - kind: struct
          name: SavedCover
          fields:
            - { name: path, type: "PathBuf" }
            - { name: width, type: "i32" }
            - { name: height, type: "i32" }
      functions:
        - name: save_import_tags
          inputs:
            - { name: item, type: "LibraryItem" }
            - { name: metadata, type: "TagMetadata-equivalent domain type (design pins the exact existing materialize entry)" }
          output: "Result<(), MaterializeError>"
          errors: ["MaterializeError"]

  # ---------------------------------------------------------------- handlers + server
  - name: livrarr-handlers
    responsibility: >
      Status page: provider panel endpoint returning ProviderStats per provider
      (REQ-002, replaces the ok/error-only view) and the truthful log section —
      actual rolling-file path + last-write mtime + loud init-error state (REQ-003).
      refresh_all accepts the active view filters and passes a WorkFilter through
      (REQ-015); 409 semantics for genuine concurrent runs unchanged (REQ-016).
      New narrow capability bounds (Has* traits in context.rs) for the stats
      service and log-surface accessor; compile wall untouched.
    req_refs: [REQ-002, REQ-003, REQ-015, REQ-016]
    dependencies: [livrarr-domain, livrarr-http, livrarr-matching, livrarr-jobs]
    public_api:
      types: []
      functions:
        - name: provider_stats
          inputs:
            - { name: state, type: "S: HasProviderStats" }
          output: "Json<Vec<ProviderStats>>"
          errors: ["ApiError"]

  - name: livrarr-server
    responsibility: >
      Composition: buffered ProviderCallSink impl (mpsc channel + writer task
      batching into record_provider_calls; recording overhead negligible vs RTTs,
      ST-010) injected into external-data clients, identity, enrichment, and the
      cover path; daily + threshold-triggered retention sweep (REQ-001). Tracing
      init returns LogSurfaceStatus instead of swallowing dir-creation errors with
      .ok(); failure surfaces on the status page and stderr (REQ-003). Wires
      ProviderStatsService impl over livrarr-db; the legacy in-memory
      ProviderHealthState provider view is replaced by record-fed stats (REQ-002).
      Removes the dead duplicate AppState.refresh_in_progress guard (verified:
      constructed at main.rs:589, zero readers) in favor of the single RAII guard
      in livrarr-metadata (REQ-016).
    req_refs: [REQ-001, REQ-002, REQ-003, REQ-016]
    dependencies: [livrarr-domain, livrarr-http, livrarr-db, livrarr-matching, livrarr-external-data, livrarr-identity, livrarr-enrichment, livrarr-metadata, livrarr-download, livrarr-library, livrarr-tagwrite, livrarr-materialize, livrarr-jobs, livrarr-handlers]
    public_api:
      types: []
      functions: []

  # ---------------------------------------------------------------- matching + download + behavioral
  - name: livrarr-matching
    responsibility: >
      Tier-A auto-match accepts the four documented variant-title form classes:
      '(Unabridged)' suffixes, ': <subtitle>, Book N' forms, translated-subtitle
      variants, diacritic-only differences (REQ-020). Acceptance is
      normalization-based (existing rapidfuzz + unicode-normalization deps); the
      existing match suite must show no new false positives. The four concrete
      staging fixtures are pinned at the Tests stage (Q-001 resolution, AC-022).
    req_refs: [REQ-020]
    dependencies: [livrarr-domain]
    public_api:
      types: []
      functions: []

  - name: livrarr-download
    responsibility: >
      Switches to the domain Release type (REQ-004): the release-search struct
      moves field-for-field to livrarr-domain (all-primitive fields, verified) and
      the old name disappears workspace-wide (AC-005); search/grab/RSS behavior
      unchanged. Clears the canonical model's deliberate-red 1 of 2.
    req_refs: [REQ-004]
    dependencies: [livrarr-domain, livrarr-http, livrarr-db]
    public_api:
      types: []
      functions: []

  - name: livrarr-behavioral
    responsibility: >
      Regression pins: discovery results never carry query-inferred language
      (REQ-011, AC-013 — fix already on main, pin only); foreign works never
      receive HC/OL writes on cached or network paths (REQ-012, AC-014); user-set
      covers survive single + bulk refresh (REQ-019, AC-021). New behavioral
      suites for the anchor/dissent/instrumentation ACs land at the Tests stage.
    req_refs: [REQ-011, REQ-012, REQ-019]
    dependencies: [livrarr-domain, livrarr-http, livrarr-db, livrarr-matching, livrarr-external-data, livrarr-identity, livrarr-enrichment, livrarr-metadata, livrarr-download, livrarr-library, livrarr-tagwrite, livrarr-materialize, livrarr-jobs, livrarr-handlers]
    public_api:
      types: []
      functions: []

shared_types:
  - { kind: struct, name: ProviderCallRecord, fields: ["see livrarr-domain"] }
  - { kind: enum, name: CallOperation, fields: ["Lookup", "Identity", "Enrich", "Cover"] }
  - { kind: enum, name: CallOutcomeClass, fields: ["Success", "NotFound", "RateLimited", "Timeout", "Error", "SkippedNoAnchor", "SkippedPolicy", "LlmRejected", "Cached"] }
