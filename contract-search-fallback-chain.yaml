# Architectural Contract
# Produced by: Tech Lead (Stage 2: Architecture)
# Purpose: Machine-checkable rules enforced by the compliance gate.

metadata:
  feature: search-fallback-chain
  spec_ref: spec-search-fallback-chain.md
  ir_ref: ir-v1-search-fallback-chain.yaml

module_dependency:
  - source: livrarr-handlers
    forbidden_targets:
      - livrarr-db
      - livrarr-metadata
      - livrarr-tagwrite
      - livrarr-download
    rationale: "Compile wall (insight 9b). Handlers generic over AppContext. PreaddCoverService and WorkService accessed via Has* traits in livrarr-domain."

  - source: audible-provider
    forbidden_targets:
      - livrarr-db
      - livrarr-handlers
      - livrarr-server
    rationale: "Provider clients live in livrarr-metadata, depend on domain+http only."

  - source: frontend-search-flow
    forbidden_targets:
      - livrarr-metadata
      - livrarr-db
      - livrarr-server
    rationale: "Frontend communicates via REST API only."

  - source: async-add-handler
    forbidden_targets:
      - livrarr-db
      - livrarr-metadata
    rationale: "Handler-layer async-add depends only on livrarr-domain. DB/metadata changes are in async-add-service."

forbidden_pattern:
  - pattern: "dyn WorkService|dyn HttpFetcher|dyn EnrichmentWorkflow|dyn PreaddCoverService"
    description: "trait_variant::make(Send) traits are not dyn-compatible"
    severity: P1
    rationale: "Insight 8: Use generics or enum dispatch, not dyn Trait."

  - pattern: "OnceLock"
    description: "OnceLock pattern banned — use explicit constructor injection"
    severity: P1
    rationale: "Insight 9d: Zero OnceLocks remain. Do not reintroduce."

# Behavioral enforcement (not regex — these are verified by tests):
#
# - ASIN merge correctness (REQ-016): Behavioral test AC-013 verifies ASIN is
#   preserved on re-enrichment when provider returns WillRetry. The SQL is
#   multi-column; regex cannot reliably validate it.
#
# - ISBN fallback correctness (REQ-012): Behavioral tests per provider simulate
#   ISBN NotFound and assert title+author fallback is attempted before terminal
#   NotFound. Regex on Rust match arms is too brittle.
#
# - Cover proxy enforcement (REQ-019): PreaddCoverCandidate uses `proxy_url`
#   (not raw URL). Implementation must convert raw provider URLs to proxy URLs
#   before returning to handlers/frontend. Verified by test: pre-add response
#   URLs start with /api/v1/coverproxy.
#
# - SSRF split: Fixed provider API endpoints (Audible catalog, OL, HC, GR, GB)
#   use HttpFetcher (standard client). Cover URLs from provider responses are
#   runtime-derived and pass through the cover proxy (http_client_safe). This is
#   the existing architecture; no new forbidden pattern needed.
