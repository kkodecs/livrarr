decisions:
  - id: "D-V2-CONVERGE-WORK"
    title: "Per-work convergence is a WorkService trait method converge_work, called by a thin job tick"
    decision: >
      A background job (livrarr-server) cannot call the private run_unified_enrichment / ensure_* helpers on
      WorkServiceImpl (compile wall + privacy). So the per-work convergence orchestration (settle_identity →
      Background enrich → dead-end bump) is a NEW public WorkService trait method `converge_work`
      (livrarr-domain decl, livrarr-metadata impl). The convergence_tick (livrarr-server) is THIN: select via
      list_convergence_due, call converge_work, pace via set_next_convergence_at. Keeps orchestration in
      metadata (insight 9g; no orchestration in server jobs).
    grounded: "run_unified_enrichment is private (survey §6); spawn_job/tick pattern (survey §5)."
  - id: "D-V2-CONVERGE-CONFIG"
    title: "Convergence interval + batch + dead-end threshold come from a new TOML [convergence] block"
    decision: >
      Existing jobs hardcode their interval at registration (survey §5 — no per-job config field). The
      convergence loop's cadence is load-bearing for the REQ-007 GB-volume gate, so it is configurable:
      a new [convergence] TOML block (enabled=false default, interval, batch_size, attempt_threshold=3).
      No env (Servarr/TOML-only convention). This is a NEW config surface vs the hardcoded-interval jobs —
      justified by REQ-007 (the cadence is a quota lever) + the PO threshold call (3).
    grounded: "survey §5: intervals hardcoded in start(); no cadence config field exists."
  - id: "D-V2-PROVENANCE-SIDECAR"
    title: "AnchorProvenance is a sidecar on Resolution::Resolved/Unresolved, not a field on CapturedIdentity"
    decision: >
      CapturedIdentity is used project-wide (seeds, IdentityState, conflict payloads); widening its fields to
      carry MatchBasis would ripple far and is unnecessary (provenance is only needed for the harvest
      write-step). So project_cluster returns (CapturedIdentity, AnchorProvenance) and the two anchor-bearing
      Resolution verdicts carry the sidecar. CapturedIdentity is byte-unchanged.
    grounded: "CapturedIdentity shape (survey §2, identity.rs:114); Resolution (survey §3, identity.rs:220)."
  - id: "D-V2-HARD-SUBSET-MERGE"
    title: "The harvest writes the HARD subset via merge_missing_anchors, the FUZZY anchors via record_pending_anchor"
    decision: >
      settle_identity builds a hard-only CapturedIdentity (fuzzy fields nulled) and passes ONLY that to
      merge_missing_anchors (existing confirmed + works.* path); each fuzzy (type,value) goes to the new
      record_pending_anchor (ledger only). The badge is derived from the hard subset (has_work_anchor) so a
      fuzzy work-key never raises the badge. This keeps the existing confirmed-write path intact and isolates
      the new safety behavior to the partition + the new writer.
    grounded: "merge_missing_anchors/confirm_anchor works.* sync (survey §1); has_work_anchor (async_resolver.rs:426, read)."
