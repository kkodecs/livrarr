metadata:
  feature: "unified-identity-path"
  stage: v1-structural
  spec_ref: "spec-unified-identity-path.md"
  version: 1
  review_round: 2
  round1_dispositions: >
    r1 both families FAIL. ACCEPTED: google R-001/openai R-001 (L1 → bring the resolver-payload
    change in-scope, per Q-008); google R-003 (add source: ConflictSource to settle_identity);
    openai R-002 (dependency_graph uses full crate names). HELD: google R-002 (drop/expand
    IdentityMode for Bulk) — relitigates the spec's Q-003 (two binary modes; Bulk maps onto
    Background) + §4 (per-item pacing deferred); mapping made explicit instead. See decisions D-MODE.

system_architecture:
  summary: >
    One in-process identity engine — a single async free function
    `settle_identity(resolver, repo, user_id, work, mode, source) -> IdentityReport` in
    livrarr-identity. It resolves a work's identity via the EXISTING IdentityResolver, maps the
    raw 4 Resolution verdicts (plus the work's current badge) to a final IdentityStatus
    monotonically, and performs the badge + anchor writes itself (REQ-001/REQ-008). It also
    closes the AC-018 settled-work-conflict gap by extending the resolver's QuorumTie Conflict
    payload to expose ALL tied clusters' anchors (Q-008). Engine ONLY: no caller is wired onto it
    and no background selection/pacing is built (spec §4).
  components:
    - { name: "identity-engine",                crate: "livrarr-identity",   kind: "library free function" }
    - { name: "resolver-conflict-payload",      crate: "livrarr-identity",   kind: "resolver payload extension (+ domain type)" }
    - { name: "domain-identity-engine-types",   crate: "livrarr-domain",     kind: "shared types + trait methods" }
    - { name: "db-identity-badge-setters",      crate: "livrarr-db",         kind: "trait impl (SqliteDb)" }
    - { name: "behavioral-identity-engine-stub", crate: "livrarr-behavioral", kind: "test stub impl" }
  connections:
    - "identity-engine calls IdentityResolver::resolve (existing livrarr-domain trait; impl LiveEnglishIdentityResolver in livrarr-identity)"
    - "identity-engine calls WorkIdentityRepository writes: merge_missing_anchors, detect_conflicting_anchors, raise_identity_conflict, set_needs_review, set_identity_confirmed(NEW), set_identity_provisional(NEW)"
    - "identity-engine reads the work's current badge + denormalized anchors from the passed-in &Work (in-memory; no db read for established anchors)"
    - "resolver-conflict-payload: run_quorum's QuorumTie branch emits all tied clusters' captured anchors → settle_identity checks each against the established anchor"
  deployment: "In-process workspace library code. No new service, endpoint, job, or DB migration."

languages: ["Rust"]

frameworks:
  - "tokio (async)"
  - "trait_variant::make(Send) for the async service trait (insight 8 — non-dyn, generics/enum dispatch only)"

approved_libraries:
  - { name: "trait-variant", use: "Send-bounded async trait (existing convention)" }
  - { name: "thiserror",     use: "WorkIdentityError (existing)" }
  - note: "NO new third-party dependency. The engine uses only existing livrarr-domain types + std."

modules:
  - name: "domain-identity-engine-types"
    crate: "livrarr-domain"
    responsibility: >
      The caller-visible patience knob (REQ-005) + the audit report (REQ-008) + the two missing
      badge-setters that complete the Confirmed/Provisional half of the resolve->badge write
      (REQ-003). WorkIdentityRepository ALREADY owns set_identity_pending / set_needs_review /
      raise_identity_conflict; this adds the Confirmed and Provisional setters so the entire badge
      write lives on the domain identity trait, letting the engine (in livrarr-identity) own every
      transition WITHOUT depending on livrarr-db.
    dependencies: []
    public_api:
      types:
        - kind: enum
          name: "IdentityMode"
          fields:
            - { name: "Interactive", type: "" }
            - { name: "Background", type: "" }
          note: >
            REQ-005 patience knob — exactly two modes (spec Q-003, P5-locked). mode->LatencyTier
            for the resolve() call: Interactive->Interactive; Background->Background. The resolver's
            third tier, Bulk (per-item seconds budget), maps ONTO Background (Q-003: "tiers map onto
            the two modes") — its per-item budget is background SELECTION+PACING, explicitly deferred
            (§4). So the engine does not surface Bulk; a future bulk caller uses Background mode and
            the deferred pacing layer governs cadence. (Holds google-R-002 r1; see decisions D-MODE.)
        - kind: struct
          name: "IdentityReport"
          fields:
            - { name: "prior_status",   type: "IdentityStatus" }
            - { name: "final_status",   type: "IdentityStatus" }
            - { name: "anchors_merged", type: "Vec<String>" }
            - { name: "verdict",        type: "Option<ResolverVerdictKind>" }
          note: "REQ-008 audit-only return. verdict = None when the terminal guard skipped resolve (REQ-006 no-op), else Some(..). NOT a value any caller persists; the engine already performed every write."
        - kind: enum
          name: "ResolverVerdictKind"
          fields:
            - { name: "Resolved",         type: "" }
            - { name: "NeedsConfirmation", type: "" }
            - { name: "Conflict",         type: "" }
            - { name: "Unresolved",       type: "" }
          note: "Which raw Resolution variant came back, for audit/logging (ST-002 — engine maps the raw 4, never the legacy LowConfidence/PendingReason buckets)."
      functions:
        - name: "WorkIdentityRepository::set_identity_confirmed"
          kind: "NEW trait method"
          inputs: [{ name: "work_id", type: "WorkId" }]
          output: "Result<(), WorkIdentityError>"
          errors: ["WorkIdentityError"]
          note: "Models set_needs_review (work_id only; impl derives user from the row). Writes IdentityStatus::Confirmed. REQ-003/REQ-008."
        - name: "WorkIdentityRepository::set_identity_provisional"
          kind: "NEW trait method"
          inputs: [{ name: "work_id", type: "WorkId" }]
          output: "Result<(), WorkIdentityError>"
          errors: ["WorkIdentityError"]
          note: "Writes IdentityStatus::Provisional. REQ-003/REQ-008."

  - name: "identity-engine"
    crate: "livrarr-identity"
    responsibility: >
      REQ-001: the single path that settles a work's identity. Resolves via the existing resolver,
      maps (Resolution x current badge) -> target IdentityStatus monotonically (REQ-003/REQ-004),
      performs the badge + anchor writes itself (REQ-008), returns an audit IdentityReport.
      Respects terminal states (REQ-006), idempotent (REQ-007), never terminalizes a transient
      Unresolved incl. NoCandidates (ST-002), writes ZERO enrichment (REQ-004). Same generics
      (R + D) as converge_identity_pending / complete_anchors, which it supersedes by ADDING the
      badge flip they omit (ST-003/ST-005). Engine only — callers NOT wired (spec §4).
    dependencies: ["domain-identity-engine-types", "resolver-conflict-payload"]
    public_api:
      functions:
        - name: "settle_identity"
          signature: "pub async fn settle_identity<R: EnglishIdentityResolver, D: WorkIdentityRepository>(resolver: &R, repo: &D, user_id: UserId, work: &Work, mode: IdentityMode, source: ConflictSource) -> Result<IdentityReport, WorkIdentityError>"
          inputs:
            - { name: "resolver", type: "&R (R: EnglishIdentityResolver)" }
            - { name: "repo",     type: "&D (D: WorkIdentityRepository)" }
            - { name: "user_id",  type: "UserId" }
            - { name: "work",     type: "&Work" }
            - { name: "mode",     type: "IdentityMode" }
            - { name: "source",   type: "ConflictSource (caller supplies; the engine is shared by all doors so it cannot hardcode it — google-R-003 r1)" }
          output: "Result<IdentityReport, WorkIdentityError>"
          errors: ["WorkIdentityError"]
          maps_reqs: ["REQ-001","REQ-002","REQ-003","REQ-004","REQ-005","REQ-006","REQ-007","REQ-008"]
          control_flow_summary: >
            (1) Terminal guard (REQ-006): work.identity_status in {Conflict, NotFound, NeedsReview}
            -> no-op report. (2) seed_from_work(work); resolve(user_id, &seed, mode->tier). (3) Map
            the Resolution variant + work.identity_status -> target badge per REQ-003 (detail
            ir-v2). (4) On a settled (Provisional/Confirmed) work re-resolving to Conflict: call
            detect_conflicting_anchors(work.id, &captured, source) AND — for a QuorumTie — against
            EACH tied cluster's captured set (from resolver-conflict-payload); any same-kind
            contradiction of the established anchor -> Conflict, else preserve (AC-018). (5)
            merge_missing_anchors(work.id, captured) when the verdict carries anchors (additive).
            (6) Write the target badge via the matching WorkIdentityRepository setter ONLY on a
            monotonic raise (REQ-004/007). (7) Return IdentityReport.

  - name: "resolver-conflict-payload"
    crate: "livrarr-identity (+ livrarr-domain type)"
    responsibility: >
      Closes the AC-018 / D-Q008 blind spot (r1 google-R-001 P0 + openai-R-001): extend
      run_quorum's QuorumTie branch (english_identity_resolver.rs:353-373) so the Resolution
      Conflict payload carries the captured anchor set of EVERY tied cluster (today it carries only
      the representative's — captured_from_detail(rep, seed) at :372; both tied clusters are
      already in scope as `competing[0..]` at the tie point :366-368). settle_identity then checks
      the established anchor against each tied set. This makes REQ-003 From-Confirmed/From-Provisional
      + AC-018 fully implementable — an anchored-cluster QuorumTie carrying a different same-kind
      work anchor raises Conflict even when the dissenting anchor is on a non-representative cluster.
      This is the resolver-PAYLOAD exposure Q-008 explicitly authorized at architecture; it does NOT
      change how the resolver decides a match (clustering/quorum logic unchanged — that stays §4).
    dependencies: ["domain-identity-engine-types"]
    public_api:
      functions:
        - name: "run_quorum (MODIFIED, english_identity_resolver.rs:368-373)"
          note: "no_majority branch emits ALL tied clusters' captured anchor sets, not just the representative's."
        - name: "Resolution::Conflict payload (EXTENDED)"
          note: "Gains a tied-anchors field (e.g. `tied: Vec<CapturedIdentity>`); exact placement on Resolution::Conflict vs NewIdentityConflict = ir-v2. captured stays for back-compat."

  - name: "db-identity-badge-setters"
    crate: "livrarr-db"
    responsibility: >
      SqliteDb impl of the two new WorkIdentityRepository methods (UPDATE works SET identity_status
      = 'confirmed' / 'provisional' WHERE id = ?). Reuses the existing badge UPDATE path
      (sqlite_work.rs:558). REQ-003/REQ-008.
    dependencies: ["domain-identity-engine-types"]
    public_api:
      functions:
        - name: "impl WorkIdentityRepository::set_identity_confirmed for SqliteDb"
          inputs: [{ name: "work_id", type: "WorkId" }]
          output: "Result<(), WorkIdentityError>"
          errors: ["WorkIdentityError"]
        - name: "impl WorkIdentityRepository::set_identity_provisional for SqliteDb"
          inputs: [{ name: "work_id", type: "WorkId" }]
          output: "Result<(), WorkIdentityError>"
          errors: ["WorkIdentityError"]

  - name: "behavioral-identity-engine-stub"
    crate: "livrarr-behavioral"
    responsibility: >
      AMENDED 2026-06-21 (Code stage, grounded): NO WorkIdentityRepository stub exists in the
      workspace — the behavioral tests exercise the repo via the REAL in-memory SqliteDb
      (create_test_db()); only the RESOLVER is a scripted double. A controllable resolver drives
      settle_identity through every Resolution variant x current badge over a real DB for the
      behavioral tests (REQ-001..REQ-008 ACs), incl. the anchored-tie Conflict with the dissenting
      anchor on the NON-representative cluster (AC-018). Faithful-fixture rule: real Resolution
      values + real starting badges on a real DB, never injected end-states. Detail: ir-v2 module
      behavioral-identity-engine-tests.
    dependencies: ["domain-identity-engine-types"]
    public_api:
      types: []
      functions: []

shared_types:
  - { name: "IdentityMode",        where: "livrarr-domain (NEW) — binary patience knob (Q-003)" }
  - { name: "IdentityReport",      where: "livrarr-domain (NEW)" }
  - { name: "ResolverVerdictKind", where: "livrarr-domain (NEW)" }
  - { name: "Resolution",          where: "livrarr-domain (existing, EXTENDED) — raw 4 verdicts (ST-002); Conflict variant gains the tied-anchors field" }
  - { name: "IdentityStatus",      where: "livrarr-domain (existing) — 6 badges (ST-001)" }
  - { name: "CapturedIdentity",    where: "livrarr-domain (existing) — federated anchor set carried by Resolution (incl. each tied cluster)" }
  - { name: "ConflictSource",      where: "livrarr-domain (existing) — caller-supplied attribution for detect_conflicting_anchors / raise_identity_conflict" }
  - { name: "WorkIdentityAnchor",  where: "livrarr-domain (existing) — anchor ledger row written by merge_missing_anchors" }
  - { name: "WorkIdentityError",   where: "livrarr-domain (existing) — engine error type" }

dependency_graph:
  - { source: "livrarr-identity",   target: "livrarr-domain" }
  - { source: "livrarr-db",         target: "livrarr-domain" }
  - { source: "livrarr-behavioral", target: "livrarr-domain" }

data_flow:
  sources:
    - { entity: "Work",          origin: "caller",                   description: "The work to settle; carries its current IdentityStatus + denormalized anchors (read in-memory)." }
    - { entity: "Resolution",    origin: "IdentityResolver::resolve", description: "Raw verdict: Resolved / NeedsConfirmation / Conflict (now carrying all tied clusters' anchors) / Unresolved (ST-002)." }
    - { entity: "IdentityMode",  origin: "caller",                   description: "Interactive | Background patience knob (REQ-005)." }
    - { entity: "ConflictSource", origin: "caller",                  description: "Which door triggered this settle; attributes any raised conflict (google-R-003)." }
  sinks:
    - { entity: "IdentityStatus",     destination: "works table (badge column)",                          description: "The engine performs the badge write (REQ-008) via the WorkIdentityRepository setters." }
    - { entity: "WorkIdentityAnchor", destination: "work_identity_anchors ledger + denormalized columns", description: "merge_missing_anchors — additive/monotonic (REQ-004)." }
    - { entity: "IdentityReport",     destination: "caller (audit/log only)",                             description: "REQ-008: report of what changed; NOT persisted by the caller." }
  state_machines:
    - entity: "IdentityStatus"
      states: ["Pending","Provisional","Confirmed","Conflict","NeedsReview","NotFound"]
      transitions:
        - { from: "Pending",     to: "Confirmed",   trigger: "Resolved + work anchor OL/GR/HC (REQ-003)" }
        - { from: "Pending",     to: "Provisional", trigger: "Resolved + ISBN/ASIN bridge only (REQ-003)" }
        - { from: "Pending",     to: "Pending",     trigger: "Unresolved ANY reason incl. NoCandidates — transient; merge captured anchors; stay eligible (REQ-003/005, ST-002)" }
        - { from: "Pending",     to: "NeedsReview", trigger: "NeedsConfirmation in BACKGROUND mode (REQ-005)" }
        - { from: "Pending",     to: "Pending",     trigger: "NeedsConfirmation in INTERACTIVE mode — await user pick (REQ-005)" }
        - { from: "Pending",     to: "Conflict",    trigger: "Conflict verdict (REQ-003)" }
        - { from: "Provisional", to: "Confirmed",   trigger: "a work anchor arrives — upgrade (REQ-003/007)" }
        - { from: "Provisional", to: "Provisional", trigger: "non-contradicting verdict (bridge / transient Unresolved / NeedsConfirmation / Conflict not contradicting established) — never downgraded (REQ-003/004)" }
        - { from: "Provisional", to: "Conflict",    trigger: "fresh resolution genuinely contradicts established anchor (same-kind) — checked vs every tied cluster via detect_conflicting_anchors (REQ-003, AC-018, D-Q008)" }
        - { from: "Confirmed",   to: "Confirmed",   trigger: "new anchor merges / non-contradicting verdict — never downgraded (REQ-004/007)" }
        - { from: "Confirmed",   to: "Conflict",    trigger: "fresh resolution genuinely contradicts established anchor (same-kind), incl. anchored QuorumTie whose dissenting cluster carries a different work anchor (REQ-003, AC-018, D-Q008)" }
        - { from: "Conflict",    to: "Conflict",    trigger: "terminal — engine leaves untouched (REQ-006)" }
        - { from: "NeedsReview", to: "NeedsReview", trigger: "terminal — engine leaves untouched; user/manual reset only (REQ-006)" }
        - { from: "NotFound",    to: "NotFound",    trigger: "legacy terminal — engine NEVER produces, leaves untouched (ST-004, REQ-006)" }
  invariants:
    - "Monotonic: the badge only rises (Pending->Provisional->Confirmed) or moves to Conflict; never downgraded (REQ-004)."
    - "No-clobber: only MISSING anchors are added; an established anchor is never overwritten (REQ-004; merge_missing_anchors)."
    - "One-way: the engine writes ZERO enrichment/metadata (no cover/description/tags/series) — identity -> enrichment only (REQ-004)."
    - "Transient never terminalized: any Unresolved (incl. NoCandidates) keeps the work Pending + eligible; the legacy is_terminal_pending NoCandidates->terminal bug is NOT reproduced (ST-002, Q-007)."
    - "Mode affects ONLY ambiguous NeedsConfirmation on a Pending work; a resolvable work reaches the same identity in both modes (REQ-005)."
    - "Settled-work Conflict is contradiction-based vs EVERY tied cluster's anchors, never the Conflict kind (REQ-003, AC-018, D-Q008) — no QuorumTie blind spot."
    - "Terminal-respect: Conflict / NotFound / NeedsReview are left untouched (REQ-006)."
    - "Idempotent: re-running on a settled work is a no-op or a monotonic improvement; never a downgrade, re-open, or duplicate anchor (REQ-007)."
    - "Engine owns the write: every badge + anchor write the engine produces is performed BY the engine; the IdentityReport is audit-only (REQ-001/008)."

domain_entities:
  - Work
  - IdentityStatus
  - CapturedIdentity

decisions:
  - id: "D-Q008"
    title: "Settled-work Conflict is contradiction-based; the resolver QuorumTie payload is extended IN-SCOPE to expose all tied anchors"
    decision: >
      On Resolution::Conflict for a settled (Provisional/Confirmed) work the engine checks the
      work's established confirmed anchor against the fresh resolution's captured anchors via
      WorkIdentityRepository::detect_conflicting_anchors(work.id, captured, source) — non-empty →
      Conflict, empty → preserve (no downgrade). REQ-003/AC-018 contradiction-based, NOT kind-based
      (ST-002). For a QuorumTie the engine checks EVERY tied cluster's anchor set, because
      resolver-conflict-payload extends run_quorum's QuorumTie branch to carry all tied clusters'
      captured anchors (previously only the representative's — :372). This is the resolver-PAYLOAD
      exposure Q-008 explicitly authorized at architecture; the resolver's matching/clustering logic
      is unchanged (that stays §4-deferred).
    history: >
      r1 IR DEFERRED this exposure (limitation L1) and accepted the blind spot. BOTH families
      (google-R-001 P0, openai-R-001 P1) rejected the deferral: AC-018 REQUIRES an anchored-tie
      with a different same-kind anchor to raise Conflict, so deferring ships a spec-violating gap
      (M9 silent limbo), and Q-008 already authorized the payload fix. Disposition: ACCEPTED —
      change brought in-scope; L1 retired.
  - id: "D-MODE"
    title: "Engine keeps exactly two binary patience modes; Bulk-tier pacing stays deferred (holds google-R-002 r1)"
    decision: >
      settle_identity takes IdentityMode {Interactive, Background} (spec Q-003, P5-locked: exactly
      two patience modes). mode->LatencyTier for resolve(): Interactive->Interactive,
      Background->Background. The resolver's Bulk tier (per-item seconds budget) maps ONTO Background
      (Q-003: "tiers map onto the two modes"); its per-item budget is background SELECTION+PACING,
      explicitly DEFERRED to the convergence feature (§4) — not an engine concern. google-R-002
      asked to drop IdentityMode for a raw 3-valued LatencyTier or expand it for Bulk; both
      contradict the locked two-mode decision. HELD: the binary mode is correct for the engine; a
      future bulk caller uses Background mode and the deferred pacing layer governs cadence (it can
      pace the loop externally rather than pass Bulk through the engine). If review insists, this is
      a Q-003 spec-revisit for the PO, not a unilateral architecture change.
  - id: "D-PLACE"
    title: "Engine lives in livrarr-identity; badge-setter surface completed on the domain trait"
    decision: >
      settle_identity is a free function in livrarr-identity (same R+D generics as
      converge_identity_pending / complete_anchors), co-located with the resolver it reuses and the
      primitives it supersedes. Only structural change to the WRITE surface: add
      set_identity_confirmed / set_identity_provisional to WorkIdentityRepository (livrarr-domain —
      which already owns set_identity_pending / set_needs_review / raise_identity_conflict), so the
      engine owns every badge transition without livrarr-identity depending on livrarr-db. SqliteDb
      already implements the badge UPDATE (sqlite_work.rs:558). Alternative considered + rejected:
      host the engine in livrarr-metadata (uses existing WorkDb::set_identity_status, zero trait
      change) — worse home, above the resolver/identity layer, far from the primitives it supersedes.
  - id: "D-NOWIRE"
    title: "Engine only — no caller wired, primitives not yet removed"
    decision: >
      Per spec §4 this feature builds + tests settle_identity (and the resolver payload extension)
      standalone. The 3 ST-003 wrappers (ensure_identity_and_enrichment, retry_all_incomplete, the
      former converge path) and the converge_identity_pending / complete_anchors primitives are LEFT
      in place; collapsing callers onto settle_identity is the next (wiring) feature. Duplicate
      writers coexisting in this build is accepted (spec REQ-008 note).
