# IR v2 — Design (operational detail)
# Feature: metadata-modularization
#
# EXTENDS IR v1. IR v1 is authoritative for: the crate decomposition, the full
# dependency_graph (acyclic, one-way), the seam_map, shared_types, and decisions
# D-001..D-007. This artifact ADDS the design layer: the ORDERED extraction sequence
# (Track 0/1/2 with build-green checkpoints), the livrarr-external-data PORT design
# (the two surfaces + the relocated contract types), per-seam CUT pseudocode
# (discovery / cover / status / bug#2), and the FALSIFIABLE CANARY as build step 1.
# It does NOT re-list IR v1's crate map — read ir-v1-metadata-modularization.yaml alongside.
#
# Grounding: every EXISTING/RELOCATE annotation cites a real symbol verified this cycle
# against /mnt/opt/livrarr (decision brief §2.1/§2.2 trace; Serena + code-index).
#
# v1 (2026-06-02): initial design pass. Sequencing per decision brief §6/§8 (C').

metadata:
  feature: metadata-modularization
  stage: v2-design
  spec_ref: spec-metadata-modularization.md
  ir_v1_ref: ir-v1-metadata-modularization.yaml
  decision_ref: docs/decision-metadata-modularization-sequencing.md
  version: 1

# Identical to IR v1 (D-012 carried from WCC: no new deps).
approved_libraries:
  - { name: serde, version: "1", usage: "Serialization (existing)" }
  - { name: sqlx, version: "0.8", usage: "DB queries + migrations (existing)" }
  - { name: chrono, version: "0.4", usage: "DateTime (existing)" }
  - { name: tokio, version: "1", usage: "Async runtime, spawn_blocking (existing)" }
  - { name: reqwest, version: "0.12", usage: "Provider HTTP via livrarr-http clients (existing)" }
  - { name: quick-xml, version: "0.37", usage: "EPUB OPF parsing (existing)" }
  - { name: trait-variant, version: "0.1", usage: "Send async traits (existing)" }
  - { name: thiserror, version: "2", usage: "Typed error enums (existing)" }
  - { name: uuid, version: "1", usage: "v4 token (existing direct dep; moves with external-data)" }
  - { name: governor, version: "0.10", usage: "GCRA rate limiter (existing; moves into external-data)" }

# ---------------------------------------------------------------------------
# Design-stage decisions (continue IR v1's D-001..D-007). Per feedback_arch_internals_delegated,
# CC proceeds on architecture-internal calls + trusts the cross-family review gate; items with
# user-visible / principle impact are flagged po_confirm.
# ---------------------------------------------------------------------------
design_decisions:
  - id: D-008
    topic: "Extraction ORDER — external-data (canary), then contract+traits, then materialize, then the 3 feature-cuts (REORDERED — REVIEW-FIX r1)"
    choice: "Track 1 order: (1) extract livrarr-external-data [THE CANARY — REQ-011]; (2) promote the EstablishedIdentity contract + IdentityContradiction event + the 3 service traits into domain [REORDERED before materialize — materialize impls MaterializeService; REVIEW-FIX r1, both families]; (3) extract livrarr-materialize [pure downstream, low coupling]. THEN Track 2 feature-cuts, in risk order: (4) status two-state-machine split [unblocks the one-way violation seam #2]; (5) discovery re-home + GR ladder [the #97 + seam #5/#6, incl. the seam #6 cache leak]; (6) cover-decouple [seam #3/#7]. Each step ends at cargo build + cargo test GREEN before the next begins (REQ-009)."
    rationale: "Providers first because it is the falsifiable canary — if it fails, nothing else should start. Contract+traits SECOND (was third) because step 3 materialize implements MaterializeService and step 4 status needs identity state in domain — a later step cannot supply a trait an earlier step implements (REVIEW-FIX r1). Materialize third — LEAST coupled (domain/db/tagwrite/http — D-003). Status before discovery because seam #2 is the active one-way VIOLATION. Cover last — lowest risk, decoupled by the generation counter. NOTE: seam #6 (concrete cache leak) is closed in step 5, NOT the canary — the canary GO does not assume it."
    po_confirm: false
  - id: D-009
    topic: "external-data port shape — TWO traits (ProviderDiscovery + ProviderFetch), not one god-trait"
    choice: "livrarr-external-data exposes two SEPARATE traits: ProviderDiscovery (search by seed -> Vec<NormalizedWorkDetail>, warms cache) and ProviderFetch (fetch(&Work,&req) -> ProviderOutcome<NormalizedWorkDetail>, the existing enrichment shape). A provider client impls whichever surface(s) it supports. trait_variant::make(Send); non-dyn -> enum dispatch over the provider set (insight 8)."
    rationale: "Decision brief §6.2: the discovery shape != the fetch shape. Two narrow traits keep each consumer bound only to the surface it uses (insight 9h capability-narrowing applied at the crate boundary). A single trait with both methods would force discovery-only consumers to depend on the fetch surface and vice-versa."
    po_confirm: false
  - id: D-010
    resolves: "spec Q-003"
    topic: "EstablishedIdentity = promote the existing federated types, not a new parallel struct"
    choice: "EstablishedIdentity is a thin envelope { work_id, anchors: CapturedIdentity (EXISTING WCC type), state: IdentityState (EXISTING, federated), method: IdentityMethod (EXISTING), generation: i64 (EXISTING merge_generation lineage) }. NO new anchor/identity type is introduced; the envelope just names the one-way hand-off explicitly. Relocate CapturedIdentity/IdentityState's DEFINITIONS so they sit at the domain leaf (they already do — WCC landed them in livrarr-domain::identity)."
    rationale: "WCC D-001 (reuse-and-widen; never build parallel identity types). The federated CapturedIdentity already IS the anchor payload; wrapping it with the {state,method,generation} envelope completes REQ-007 with zero new types. A parallel EstablishedIdentity struct would re-introduce exactly the duplication WCC removed."
    po_confirm: false
  - id: D-011
    topic: "Materialize trigger + COVER DATA CONTRACT (REVIEW-FIX r1 — cover selection vs fetch split; bg job covers too)"
    choice: "SPLIT cover candidate SELECTION (which URL — provider-payload-driven, lives enrichment/identity-side) from cover artifact FETCH+STORE (the bytes — lives in materialize). The merge persists the chosen cover reference to a DB column (`selected_cover_url` / CoverRef on the work) BEFORE materialize runs. MaterializeService::materialize_cover(work_id) then reads that resolved ref from the DB (no provider/enrichment payload coupling — materialize never re-runs selection). REVIEW-FIX r1 (codex BLOCKER): work_id alone was insufficient; the resolved CoverRef must exist in the DB first. Trigger: after a merge bumps merge_generation, a server-composed materialize JOB (existing bg tick) scans `merge_generation > tag_generation` and projects BOTH artifacts — materialize_tags AND a cover refresh when the persisted cover ref changed/absent (REVIEW-FIX r1, gemini MAJOR: else background cover upgrades are lost). The SYNC materialize_cover is also called by the ADD path so a cover is present at creation. No livrarr-enrichment -> livrarr-materialize crate edge (D-003)."
    rationale: "codex BLOCKER: a sync materialize_cover(work_id) with no data contract would force materialize to re-query DB/cache and reimplement provider-priority selection — re-coupling it to enrichment/external-data. Persisting the resolved CoverRef pre-call keeps materialize a pure projector. gemini MAJOR: the generation-delta job only doing tags loses cover upgrades found by background enrichment — so the job must evaluate the cover ref too. REQ-021 idempotency (generation guard) + REQ-003 isolation (no crate edge) preserved."
    po_confirm: false
  - id: D-012
    topic: "Canary NO-GO fallback — PREDECLARED allowed relocations + a hard scope cap (REVIEW-FIX r1, codex)"
    choice: "The canary's allowed back-edge resolutions are PREDECLARED + BOUNDED so 'relocate and retry' cannot expand scope until it 'passes': (a) ALLOWED relocation — a genuinely PURE value type (e.g. LookupResult, a provider-key newtype) may move into livrarr-domain (leaf) and retry; HARD CAP: at most ~3 such type relocations, all pure data, no behavior. (b) EnrichmentContext is NOT allowed to move to domain — REVIEW-FIX r1 (codex BLOCKER): it encodes enrichment POLICY (mode/priority), so relocating it to the leaf hides the cycle instead of removing it. Instead external-data's fetch takes a external-data-local mechanical FetchRequest (just the provider + key + language it needs); EnrichmentContext/mode/priority stay enrichment-side and are mapped to FetchRequest at the call site. (c) provider_queue / its retry traits are NOT relocated — they stay in enrichment (REVIEW-FIX r1 #1). (d) If, after the capped pure-type relocations, ANY back-edge remains (external-data needing EnrichmentContext, a queue trait, livrarr-db, or to CALL BACK into metadata) -> NO-GO: stop, leave the worktree, write 'CANARY NO-GO' with the exact edge, fall back to plan A."
    rationale: "codex: 'relocate to domain and retry' described as always-expected made the experiment non-binary (it could keep expanding until green). Predeclaring the allowed set (pure data only, capped) + explicitly forbidding the impure relocations (EnrichmentContext, queue) restores falsifiability: the canary either fits within the cap or it's a NO-GO."
    po_confirm: false
  - id: D-013
    topic: "Two-state-machine split — additive identity_state column, backfilled from ANCHORS not status (REVIEW-FIX r1, both families BLOCKER)"
    choice: "Add a NEW `identity_state` column (Pending|Confirmed|Provisional|Conflict|NeedsReview). REVIEW-FIX r1 — the backfill derives identity_state from the work's ACTUAL IDENTITY (anchors/ISBN), NOT from EnrichmentStatus (which cannot distinguish Confirmed/Provisional/Pending). Backfill rule, in priority order per row:
        1. an open identity-conflict row exists (work_identity_conflicts) -> Conflict;
        2. EnrichmentStatus is the explicit NeedsReview (WCC) -> NeedsReview;
        3. a confirmed WORK anchor (ol_work/gr_work/hc_work) exists -> Confirmed;
        4. else an isbn_13/asin bridge exists but NO work anchor -> Provisional (REQ-016 de-facto identity);
        5. else (no anchor, no bridge) -> Pending.
      The ENRICHMENT track (Unenriched|Enriched|Thin) maps from EnrichmentStatus: Enriched->Enriched; Unenriched->Unenriched; Conflict/IdentityPending are identity concerns (they move to identity_state, enrichment track defaults Unenriched); a confirmed work with no meaningful text -> Thin. **Failed is NOT an enrichment-track state** — it is RETRY state and stays in provider_retry_state (so retry/backoff semantics are preserved); the enrichment track only describes content-completeness. An AUDIT query flags ambiguous rows (e.g. a 'Confirmed' EnrichmentStatus with no anchor) for manual review rather than silently mis-mapping. Never edit an applied migration (insight 19) — new migration file; ON CONFLICT upsert (insight 20)."
    rationale: "REVIEW-FIX r1 (both families): the old 'else Confirmed' mis-elevated ISBN-only works (should be Provisional, REQ-016) and orphaned Failed/NeedsReview. Identity state is a function of the ANCHORS, not the old conflated status enum, so the backfill must read identity columns. Keeping Failed in provider_retry_state preserves retry semantics the enrichment track does not model."
    po_confirm: true
    po_confirm_note: "User-visible: the single status badge splits into TWO badges (identity track + enrichment track). The backfill is anchor-derived (work-anchor->Confirmed, ISBN-only->Provisional, none->Pending, open-conflict->Conflict) with an audit query for ambiguous rows. Confirm the badge split + this anchor-derived mapping before this Track-2 step lands."
  - id: D-014
    topic: "Migration choreography for FOUR new crates — re-export shim during extraction, delete after"
    choice: "During each Track-1 extraction, livrarr-metadata keeps a `pub use livrarr_external_data::*;` (etc.) re-export shim so the ~37 dependent modules compile UNCHANGED mid-migration; the shim is deleted only after all consumers are switched to import directly from the new crate. This makes each extraction a small, independently-green commit rather than one big-bang rewrite (REQ-009). REVIEW-FIX r1 (codex MAJOR) — DELETION GATE: each extraction SLICE is not complete until its re-export shim is removed; enforced by AC-021 (a check that livrarr-metadata exposes NO `pub use livrarr_{external_data,materialize}::` re-exports at slice end) + a direct-import scan. The shim is a TRANSIENT migration scaffold, never a permanent facade through which new code may import."
    rationale: "A re-export shim is the standard Rust crate-split idiom: it decouples 'move the code' from 'update the imports', so each is a separately-revertible green step. codex MAJOR: without a deletion gate the monolith remains a permanent re-export facade and new code keeps importing through it — defeating the wall. The gate (AC-021) forces the shim gone before the slice counts as done."
    po_confirm: false

# ---------------------------------------------------------------------------
# THE EXTRACTION SEQUENCE — ordered build steps, each ending GREEN (REQ-009).
# Track 0 = baseline; Track 1 = stable/behavior-preserving; Track 2 = feature-cuts.
# ---------------------------------------------------------------------------
extraction_sequence:
  - step: 0
    track: 0
    name: "Stabilize baseline"
    action: "The worktree at HEAD (d612465) IS the clean baseline. cargo build + cargo test green (verified iter 1: build green). No WCC uncommitted churn here by design."
    green_gate: "cargo build (DONE — exit 0, 50.9s)"
  - step: 1
    track: 1
    name: "Extract livrarr-external-data  [THE CANARY — REQ-011]"
    action: "New crate; relocate the substrate modules + the contract types out of metadata lib.rs (see external-data-port-design below); leave lookup_filtered + enrich_work as consumers; re-export shim (D-014)."
    green_gate: "cargo build + cargo test green AND `cargo tree -p livrarr-external-data` shows NO edge to metadata/identity/enrichment. GO -> step 2. NO-GO -> D-012 fallback + STOP."
    canary: true
  - step: 2
    track: 1
    name: "Promote the EstablishedIdentity contract + service traits into domain  [REORDERED before materialize — REVIEW-FIX r1, both families]"
    action: "Add to livrarr-domain (the leaf): the EstablishedIdentity envelope (D-010), the IdentityContradiction event (REVIEW-FIX r1), and ALL THREE cross-crate service traits — DiscoveryService, EnrichmentService, MaterializeService. No logic change — wires the contract surface the sibling split + materialize impl will use. MUST precede step 3 (materialize impls MaterializeService)."
    green_gate: "cargo build + cargo test green."
  - step: 3
    track: 1
    name: "Extract livrarr-materialize"
    action: "New crate; relocate cover*/cover_alternatives/preadd_cover_service/tag-projection; depends on domain+db+tagwrite+http; impls the MaterializeService trait (already promoted to domain in step 2). Behavior-preserving (cover/tags still fire from the same call sites, now via the port). Cover CANDIDATE selection stays enrichment/identity-side; materialize takes a resolved CoverRef (REVIEW-FIX r1, see D-011)."
    green_gate: "cargo build + cargo test green AND `cargo tree -p livrarr-materialize` shows NO edge to enrichment (REQ-003)."
  - step: 4
    track: 2
    name: "Status two-state-machine split  [seam #2/#4 — REQ-014/019]"
    action: "Split EnrichmentStatus -> identity_state + enrichment track (D-013 migration). Cut seam #2: enrich_work STOPS writing identity-Conflict (one-way violation healed — Conflict is an identity state). Cut seam #4: merge_impl step-6 reclassifies (Enriched = identity + >=1 text; cover decoupled; textless -> Thin). Relocate the merge engine into livrarr-enrichment."
    green_gate: "cargo build + cargo test green; new RED tests for the split go green."
  - step: 5
    track: 2
    name: "Discovery re-home + GR ladder  [seam #5/#6 — REQ-016/018, #97]"
    action: "Re-home lookup_filtered into livrarr-identity as the discovery policy over ProviderDiscovery; cut seam #6 (replace the concrete transport_cache reach with the external-data cache capability — kills BT-004); build the GR access ladder (DiscoveryRung). Relocate english/async/bulk resolvers + llm_validator into livrarr-identity. Identity & enrichment are now non-dependent siblings (D-002) — verify by cargo tree."
    green_gate: "cargo build + cargo test green; `cargo tree` confirms identity ⊥ enrichment."
  - step: 6
    track: 2
    name: "Cover-decouple finalize  [seam #3/#7 — REQ-019]"
    action: "Move the inline phase-1 cover + cover-upgrade calls (seam #7) behind MaterializeService::materialize_cover (sync, add path) + the generation-delta materialize_tags job (D-011). Confirm seam #3 (cover-gate) is fully removed from enrich_work."
    green_gate: "cargo build + cargo test green; AC-015 (OL-anchored, cover-less work is Enriched + tagged) green."

# ---------------------------------------------------------------------------
# THE livrarr-external-data PORT DESIGN (the canary's content) — REQ-005/008/011.
# ---------------------------------------------------------------------------
external_data_port_design:
  new_crate: "crates/livrarr-external-data"
  cargo_deps: [livrarr-domain, livrarr-http, reqwest, serde, serde_json, governor, uuid, thiserror, tokio, chrono, quick-xml]
  relocate_out_of_metadata_lib_rs:
    - { type: NormalizedWorkDetail, from: "livrarr-metadata/src/lib.rs", to: "livrarr-external-data/src/types.rs", note: "THE canary type #1 (BT-003). Every consumer imports it from external-data." }
    - { type: ProviderOutcome, from: "livrarr-metadata/src/lib.rs", to: "livrarr-external-data/src/types.rs", note: "THE canary type #2. Relocates with NormalizedWorkDetail." }
  relocate_modules:
    [provider_client, openlibrary, hardcover, google_books, goodreads, audnexus, audible, llm_caller, transport_cache, language, parsers, normalize]
  NOT_relocated_REVIEW_FIX_r1:
    - "provider_queue -> STAYS in livrarr-enrichment (DB-stateful: provider_queue.rs:33 imports livrarr_db::{DbError, ProviderRetryStateDb}; durable provider_retry_state). Moving it here would force external-data->db and doom the canary (BLOCKER, both families)."
    - "llm_scraper -> livrarr-identity (GR scrape policy + prompts; not dumb-pipe mechanism — gemini #1)."
    - "title_cleanup -> livrarr-identity (matching heuristic; not dumb-pipe mechanism — gemini #1)."
  surfaces:
    - name: ProviderDiscovery
      signature: "async fn discover(&self, seed: &WorkSeed, tier: LatencyTier) -> Vec<NormalizedWorkDetail>"
      consumed_by: "livrarr-identity (the re-homed lookup_filtered discovery policy)"
      note: "Surface (a). Cost-ordered/timeout-bounded search; warms cache_warm(provider, key, payload). The Track-2 END-STATE (after discovery step 5) generalizes cover_alternatives::fetch_internal_alternatives's join_all-under-timeout mechanism to KEEP the full payload (stops discarding all-but-cover_url — decision brief §2.1). REVIEW-FIX r1: the CANARY only relocates the existing code; the keep-payload behavior change lands in step 5, not the canary (behavior-preserving, REQ-009)."
    - name: ProviderFetch
      signature: "async fn fetch(&self, work: &Work, req: &FetchRequest) -> ProviderOutcome<NormalizedWorkDetail>"
      consumed_by: "livrarr-enrichment (the enrich spine)"
      note: "Surface (b). The EXISTING ProviderClient::fetch shape, relocated. FetchRequest is the provider-agnostic request (seam #1 — EnrichmentContext does NOT cross into the queue; it stays enrichment-side)."
  cache:
    key: "(MetadataProvider, provider_key: String)   # NOT work_id (REQ-008)"
    api: ["cache_warm(provider, key, payload)", "cache_take(provider, key) -> Option<NormalizedWorkDetail>"]
    retention: "CONSUME-ONCE / pass-scoped (PO 2026-06-03): evict on consume (canonical data persisted to the Work DB); short safety TTL reaps abandoned passes. No long-lived cache (REQ-023, spec Q-002 resolved)."

# ---------------------------------------------------------------------------
# PER-SEAM CUT PSEUDOCODE (the Track-2 forcing functions).
# ---------------------------------------------------------------------------
modules:

  - name: canary-extract-external-data
    component: livrarr-external-data
    responsibility: "Build step 1 — the falsifiable canary (REQ-011). Relocate the substrate + contract types; verify no back-edge."
    req_ids: [REQ-005, REQ-006, REQ-008, REQ-011]
    dependencies: [domain-established-identity]
    capability_survey:
      - { capability: "Provider clients + dispatch", status: RELOCATE, location: "metadata provider_client.rs (ProviderClient::fetch), 6 client modules", note: "Move wholesale; behavior-preserving. The enum dispatch over external-data (insight 8) moves with it." }
      - { capability: "Contract types", status: RELOCATE, location: "metadata lib.rs NormalizedWorkDetail + ProviderOutcome", note: "THE canary. Move to external-data/src/types.rs; metadata re-exports during migration (D-014)." }
      - { capability: "Discovery fan-out mechanism", status: EXISTS-RELOCATE, location: "metadata cover_alternatives.rs::fetch_internal_alternatives (join_all under 10s timeout, DISCARDS all but cover_url+title :38-54)", note: "REVIEW-FIX r1 (codex BLOCKER): the CANARY MOVES THIS CODE AS-IS (behavior-preserving, REQ-009) — it does NOT change the discard behavior. Generalizing the fan-out to KEEP the full NormalizedWorkDetail (stop discarding, REQ-017) is a Track-2 DISCOVERY-FEATURE change deferred to extraction step 5, not the canary." }
      - { capability: "Rate limit + breaker", status: RELOCATE, location: "governor GCRA limiter + the circuit breaker", note: "Move into external-data; both consumers share them (REQ-022)." }
    public_api:
      functions:
        - name: "external-data-extraction (the canary procedure)"
          signature: "-- workspace surgery, not a runtime fn"
          pseudocode:
            - "Create crates/livrarr-external-data (Cargo.toml: deps per external_data_port_design.cargo_deps). Add to the workspace members."
            - "MOVE NormalizedWorkDetail + ProviderOutcome from metadata/src/lib.rs -> external-data/src/types.rs."
            - "MOVE the relocate_modules list -> external-data/src/. Fix their internal imports (now intra-external-data)."
            - "In metadata/src/lib.rs add `pub use livrarr_external_data::{NormalizedWorkDetail, ProviderOutcome, ...};` re-export shim (D-014) so lookup_filtered/enrich_work and the other ~37 modules compile UNCHANGED."
            - "cargo build. If a back-edge is forced (external-data wants LookupResult/EnrichmentContext/a queue trait from metadata): RELOCATE that type to livrarr-domain (D-012 (a)) and retry — expected, not failure."
            - "GO GATE: cargo build + cargo test green AND `cargo tree -p livrarr-external-data` lists NONE of livrarr-metadata, livrarr-identity, livrarr-enrichment, OR livrarr-db (REVIEW-FIX r2: livrarr-db MUST be in the forbidden set — a external-data->db edge is the canary-killer). -> commit 'extract livrarr-external-data (canary GO)'."
            - "NO-GO: a genuine logic cycle remains (external-data must CALL metadata) -> STOP, leave worktree, write 'CANARY NO-GO' + the exact edge, recommend plan-A (D-012 (b))."
          call_annotations:
            - { type: RELOCATE, call: "ProviderClient::fetch + the 6 clients", target: "livrarr-metadata::provider_client -> livrarr-external-data" }
            - { type: RELOCATE, call: "NormalizedWorkDetail / ProviderOutcome", target: "livrarr-metadata::lib -> livrarr-external-data::types" }
          invariants: ["Behavior-preserving: no logic edited, only relocated (REQ-009).", "No external-data->{metadata,identity,enrichment} edge (REQ-006) — the GO condition."]
          tdd:
            - "RED->GREEN (AC-004): a test in livrarr-enrichment does `use livrarr_external_data::NormalizedWorkDetail;` and compiles; the reverse import in external-data does NOT exist."
            - "RED->GREEN (AC-005): `cargo tree -p livrarr-external-data | grep -E 'livrarr-(metadata|identity|enrichment|db)'` is EMPTY (the canary assertion — db INCLUDED, REVIEW-FIX r2)."
            - "GREEN (AC-007): the pre-extraction test set stays green post-extraction."

  - name: cut-status-two-state-machines
    component: livrarr-enrichment
    responsibility: "Cut seams #2 + #4 (REQ-014/019). Split the overloaded EnrichmentStatus into an identity track (domain IdentityState) + an enrichment track (Unenriched/Enriched/Thin). Heal the one-way violation: enrich_work stops writing identity-Conflict. Relocate the merge engine into livrarr-enrichment."
    req_ids: [REQ-002, REQ-014, REQ-019]
    dependencies: [domain-established-identity, external-data-substrate]
    capability_survey:
      - { capability: "Overloaded status enum", status: EXISTS-SPLIT, location: "metadata lib.rs EnrichmentStatus (Unenriched/Enriched/Failed/Conflict/IdentityPending) + merge_impl step-6 (lib.rs:886) classification", note: "Split: Conflict+IdentityPending -> domain IdentityState (identity track); keep Unenriched/Enriched; ADD Thin. Cut cover from the Enriched test (REQ-019)." }
      - { capability: "One-way violation site (seam #2)", status: EXISTS-CUT, location: "enrich_work -> EnrichmentStatus::Conflict writeback", note: "REVIEW-FIX r1 (both families BLOCKER): enrichment STILL DETECTS remote contradictions but must not WRITE identity state. Replacement path: EnrichmentService::enrich returns EnrichOutcome::Contradiction(IdentityContradiction) (domain event); livrarr-server catches it and invokes DiscoveryService (identity) to set state->Conflict transactionally. Without this path, conflicts would be silently dropped. Enrichment's own track emits only Enriched/Thin." }
    public_api:
      functions:
        - name: "merge_impl status classification (CHANGED — Fork-F, seam #4)"
          signature: "fn classify_enrichment(established: &EstablishedIdentity, merged: &MergedFields) -> EnrichmentState"
          pseudocode:
            - "Precondition: only reached when established.state is Confirmed/Provisional (REQ-015 gate; Pending/Conflict/NeedsReview never enrich)."
            - "If merged has >=1 meaningful text field (e.g. description) -> EnrichmentState::Enriched. Cover presence is NOT consulted (REQ-019) — cover is a materialize backfill asset."
            - "Else (confirmed identity, zero meaningful text) -> EnrichmentState::Thin, and surface the work to the needs-review queue (REQ-014). Do NOT loop Unenriched (the BT-005/REQ-030 churn fix)."
            - "NEVER set an identity state here (one-way, REQ-002) — identity-Conflict/NeedsReview belong to DiscoveryService."
          call_annotations:
            - { type: RELOCATE, call: "the merge engine field-merge + provider priority", target: "livrarr-metadata lib.rs -> livrarr-enrichment" }
            - { type: NEW, call: "EnrichmentState::{Enriched,Thin}", target: "livrarr-domain (the enrichment track)" }
          invariants: ["Enriched is independent of cover (REQ-019).", "Enrichment never writes an identity state (REQ-002 one-way)."]
          tdd:
            - "RED (AC-015): an OL-anchored work with a description but no cover -> Enriched (not Unenriched); its file tags get written; no re-merge loop."
            - "RED (REQ-002): a code-level test that livrarr-enrichment cannot name livrarr_identity (cargo tree / a doc-test that the import fails)."

  - name: cut-discovery-and-gr-ladder
    component: livrarr-identity
    responsibility: "Cut seams #5 + #6 (REQ-016/018, #97). Re-home lookup_filtered as the identity discovery policy over ProviderDiscovery; replace the concrete transport_cache reach (BT-004) with the external-data cache capability; build the GR access ladder. Relocate english/async/bulk resolvers + llm_validator."
    req_ids: [REQ-008, REQ-016, REQ-018]
    dependencies: [domain-established-identity, external-data-substrate]
    capability_survey:
      - { capability: "Inline discovery (seam #5)", status: EXISTS-REHOME, location: "work_service.rs:1378-1564 lookup_filtered (concrete self.lookup_google_books/openlibrary/hardcover/goodreads)", note: "Re-home into livrarr-identity; the concrete self.lookup_* calls become ProviderDiscovery::discover. THE #97 fix (single-provider-first-hit -> fan-out)." }
