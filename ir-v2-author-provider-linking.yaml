metadata:
  feature: author-provider-linking
  stage: v2-operational
  spec_ref: /mnt/opt/livrarr/spec-author-provider-linking.md
  ir_v1_ref: ir-v1-author-provider-linking.yaml

doors:
  - door: "Add-box work/author path"
    surface_kind: handler
    road_entry: "AuthorLinkService::attach_selected_route or guard_author_route plus AuthorLinkWorkflow::enqueue"
    wiring: "POST work add -> WorkService::add_fast -> shared author create/adopt gate -> an explicitly selected author route uses AuthorLinkService::attach_selected_route; a provider author ref inherited from the selected keyed work uses guard_author_route; AuthorLinkWorkflow::enqueue remains durable in either case"
    traced: "crates/livrarr-handlers/src/work.rs:171"
  - door: "Standalone add-author path"
    surface_kind: handler
    road_entry: "AuthorLinkService::attach_selected_route plus AuthorLinkWorkflow::enqueue"
    wiring: "POST author add -> AuthorService::add -> shared author create/adopt gate -> an explicit lookup selection uses AuthorLinkService::attach_selected_route after the durable gate; with no selected route, enqueue only"
    traced: "crates/livrarr-handlers/src/author.rs:60"
  - door: "Manual import"
    surface_kind: handler
    road_entry: "AuthorLinkService::attach_selected_route or guard_author_route plus AuthorLinkWorkflow::enqueue"
    wiring: "manual-import handler -> find_or_create_work -> WorkService::add -> shared author create/adopt gate -> an explicitly selected author route uses AuthorLinkService::attach_selected_route; a provider author ref inferred from the mapped/keyed work uses guard_author_route; AuthorLinkWorkflow::enqueue remains durable in either case"
    traced: "crates/livrarr-handlers/src/manual_import.rs:844"
  - door: "List import confirm"
    surface_kind: workflow
    road_entry: "AuthorLinkWorkflow::enqueue"
    wiring: "ListService::confirm -> WorkService::add -> shared author create/adopt gate -> real author-link enqueue trigger; no author-route choice exists at this door, and any later work-key inheritance is keyed evidence through guard_author_route"
    traced: "crates/livrarr-metadata/src/list_service.rs:280"
  - door: "Series-monitor roster work creation"
    surface_kind: workflow
    road_entry: "AuthorLinkWorkflow::enqueue"
    wiring: "run_series_monitor_worker -> seed_series_monitor -> WorkService::add -> shared author gate -> ensure/re-arm author task; no author-route choice exists at this door, and any later work-key inheritance is keyed evidence through guard_author_route"
    traced: "crates/livrarr-metadata/src/series_query_service/service.rs:1001"
  - door: "Readarr import author resolution"
    surface_kind: workflow
    road_entry: "guard_author_route then Agreed -> AuthorLinkWorkflow::submit_evidence or Rejected -> AuthorLinkWorkflow::record_readarr_rejection; AuthorLinkWorkflow::enqueue independently"
    wiring: "process_authors_batch -> shared create/adopt gate -> snapshot associated names before recording the Readarr observation -> treat the same-record foreignAuthorId/name assertion as keyed evidence, not a user pick -> parse GR key -> common guard -> Agreed route core or Rejected claimless failed-guard candidate -> independent durable enqueue"
    traced: "crates/livrarr-server/src/readarr_import_workflow.rs:1616"
  - door: "Review Authors list"
    surface_kind: handler
    road_entry: "AuthorLinkService::list_review"
    wiring: "GET author-link-review -> authenticated narrow service -> persisted current-generation review rows"
    traced: "GET /api/v1/author-link-review"
  - door: "Review Authors candidate pick"
    surface_kind: ui-action
    road_entry: "AuthorLinkDb::pick_candidate_as_user"
    wiring: "Review Authors pick -> POST candidate pick -> user-sovereign route transaction -> query invalidation"
    traced: "POST /api/v1/author-link-review/{candidate_id}/pick"
  - door: "Review Authors candidate dismiss"
    surface_kind: ui-action
    road_entry: "AuthorLinkDb::dismiss_candidate_as_user"
    wiring: "Review Authors dismiss -> POST candidate dismiss -> current-generation dismissal transaction -> progress re-derivation"
    traced: "POST /api/v1/author-link-review/{candidate_id}/dismiss"
  - door: "Author rename"
    surface_kind: ui-action
    road_entry: "AuthorDb::rename_author_and_cascade"
    wiring: "author-detail rename -> PUT author name -> AuthorService::rename -> shared display cascade"
    traced: "PUT /api/v1/author/{author_id}/name"
  - door: "Author stored-name variant pick"
    surface_kind: ui-action
    road_entry: "AuthorDb::rename_author_and_cascade"
    wiring: "author-detail display pick -> PUT display-name -> select User variant -> shared display cascade"
    traced: "PUT /api/v1/author/{author_id}/display-name"
  - door: "Author route removal"
    surface_kind: ui-action
    road_entry: "AuthorLinkDb::remove_route_as_user"
    wiring: "author-detail route remove -> DELETE route -> user-scoped tombstone transaction -> enqueue re-derivation"
    traced: "DELETE /api/v1/author/{author_id}/route/{route_id}"
  - door: "Author re-resolution"
    surface_kind: ui-action
    road_entry: "AuthorLinkWorkflow::enqueue"
    wiring: "author-detail re-resolve -> POST resolve -> enqueue UserReResolve -> return 202 without provider wait"
    traced: "POST /api/v1/author/{author_id}/resolve"
  - door: "Author merge UI"
    surface_kind: ui-action
    road_entry: "AuthorDb::merge_authors"
    wiring: "author-detail merge action -> existing POST merge handler -> AuthorService::merge -> one DB merge transaction"
    traced: "crates/livrarr-handlers/src/author.rs:274"
  - door: "Monitor-enable gate"
    surface_kind: ui-action
    road_entry: "AuthorLinkDb::has_active_route"
    wiring: "author-detail monitored toggle -> author update handler -> server-side active-OL existence check -> unchanged validation result"
    traced: "crates/livrarr-metadata/src/author_service.rs:208"
  - door: "Recurring author-link sweep"
    surface_kind: job
    road_entry: "AuthorLinkWorkflow::run_due"
    wiring: "JobRunner interval registration after cutover verification -> author_link_sweep_tick -> bounded durable claims -> run_due"
    traced: "author_link_sweep_tick"
  - door: "Author-link sweep progress"
    surface_kind: handler
    road_entry: "AuthorLinkService::progress"
    wiring: "GET sweep progress -> authenticated narrow service -> persisted user aggregate"
    traced: "GET /api/v1/author-link-sweep/progress"
  - door: "Enrichment-completion author-name observation"
    surface_kind: workflow
    road_entry: "AuthorNameVariantObserver::record_observed_author_names"
    wiring: "cached-reuse, deferred-background, and normal-merge completion paths -> map names from each successful in-hand NormalizedWorkDetail before its return -> infallible observer -> dirty author task"
    traced: "crates/livrarr-enrichment/src/lib.rs:730"
    completion_traces:
      - "cached reuse result: crates/livrarr-enrichment/src/lib.rs:625"
      - "deferred background return: crates/livrarr-enrichment/src/lib.rs:707"
      - "normal merge return: crates/livrarr-enrichment/src/lib.rs:863"
  - door: "Work evidence change wake-up"
    surface_kind: database-trigger
    road_entry: "AuthorLinkTrigger::EvidenceFingerprintChanged"
    wiring: "work identity/status/key DB commit -> migration 078 trigger -> invalidate stale author claim -> EvidenceFingerprintChanged -> due task"
    traced: "crates/livrarr-db/src/sqlite_work_identity.rs:157"

author_route_writer_inventory:
  - site: "Interactive work add/adopt author OL key"
    source: "crates/livrarr-metadata/src/work_service.rs:2837-2908"
    classification: "current legacy-scalar writer; selected-work key is keyed evidence, while a separately explicit UI route requires the user-sovereign door"
    post_f1_fate: "Delete CreateAuthorDbRequest/UpdateAuthorDbRequest route fields; use the atomic shared create/adopt gate, send an explicit UI-selected author route through AuthorLinkService::attach_selected_route, and send inherited keyed-work evidence only through guard_author_route."
    ac005_assertion: "Mechanical scan rejects ol_key/gr_key/hc_key in generic author create/update requests; real add-path tests prove explicit selection uses the user attach service and keyed-work evidence cannot reach a route without AgreedAuthorRouteEvidence."
  - site: "Standalone interactive author add OL key"
    source: "crates/livrarr-metadata/src/author_service.rs:77-184"
    classification: "current explicit UI selection routed through a legacy scalar writer; user-sovereign after F1"
    post_f1_fate: "Delete scalar request writes, converge author creation through the atomic shared gate, then pass an explicit lookup selection to AuthorLinkService::attach_selected_route; with no selection, retain enqueue only."
    ac005_assertion: "Mechanical scan rejects route fields in AddAuthorRequest/CreateAuthorDbRequest; router tests prove an explicit route uses only the classified user operation and a no-key add performs no attach."
  - site: "Author merge scalar key coalescing"
    source: "crates/livrarr-db/src/sqlite_author.rs:316-326"
    classification: "current legacy maintenance writer; F1 route-row merge is a user-sovereign merge consequence"
    post_f1_fate: "Freeze scalar columns and replace COALESCE scalar writes with AuthorDb::merge_authors route-row move/coalescing, preserving tombstones and strongest provenance."
    ac005_assertion: "Mechanical scan rejects ol_key/gr_key/hc_key assignments in merge_authors_tx; real merge tests pin route union, provenance rank, tombstone precedence, and unchanged frozen scalars."
  - site: "Series promotion Goodreads pick"
    source: "frontend/src/components/SeriesPromoteModals.tsx:85"
    classification: "current user-sovereign Goodreads pick sent through the generic author update mutation"
    post_f1_fate: "Delete the generic grKey author update and call AuthorLinkService::attach_selected_route through the dedicated classified user endpoint."
    ac005_assertion: "Frontend mechanical scan rejects grKey/olKey/hcKey in updateAuthor calls; rendered picker test asserts the dedicated user endpoint and no provider call."
  - site: "Author-detail Goodreads pick"
    source: "frontend/src/pages/author-detail/AuthorDetailPage.tsx:1010"
    classification: "current user-sovereign Goodreads pick sent through the generic author update mutation"
    post_f1_fate: "Delete the generic grKey author update; use candidate pick when a persisted candidate exists and AuthorLinkService::attach_selected_route through the dedicated classified user endpoint otherwise."
    ac005_assertion: "Frontend mechanical scan rejects grKey/olKey/hcKey in updateAuthor calls; rendered author picker tests assert only a classified user mutation is invoked."
  - site: "Readarr batch author import"
    source: "crates/livrarr-server/src/readarr_import_workflow.rs:1616-1719"
    classification: "current writer omission: foreign_author_id is not consumed; F1 Goodreads id/name pair is road-guarded keyed evidence"
    post_f1_fate: "After the atomic create/adopt gate, snapshot associated names, parse foreignAuthorId, call guard_author_route, submit only Agreed evidence, persist Rejected evidence for review, and enqueue independently."
    ac005_assertion: "Real Readarr batch tests cover Agreed/Rejected/unusable ids, snapshot-before-observe, independent enqueue, and byte-identical route state for every non-Agree result."
  - site: "Review candidate user pick"
    source: "crates/livrarr-db/src/sqlite_author.rs:452-548 (current generic scalar route path; dedicated AuthorLinkDb source verified absent before F1)"
    classification: "user-sovereign"
    post_f1_fate: "AuthorLinkDb::pick_candidate_as_user remains the candidate-pick entry and delegates canonical ownership/attach/reactivation to the same private attach_route_as_user_tx used by direct selected-route attachment; it writes UserPicked provenance and never writes a legacy scalar."
    ac005_assertion: "Repository/router tests pin both user entry shapes, user scope, current generation for candidate picks, canonical ownership, exact tombstone reactivation, UserPicked provenance, and zero provider/scalar writes; compile walls exclude automatic callers."
  - site: "Guarded Tier-1 contributor attach"
    source: "crates/livrarr-handlers/src/work.rs:305-326 (current automatic writer predecessor; AuthorLinkDb/apply_guarded_route source verified absent before F1)"
    classification: "road-guarded keyed evidence"
    post_f1_fate: "Replace the predecessor with guard_author_route -> opaque AgreedAuthorRouteEvidence -> AuthorLinkDb::apply_guarded_route; Rejected evidence parks and cannot route."
    ac005_assertion: "Compile-wall test proves automatic code cannot construct agreed evidence or call user mutations; real Tier-1 tests assert every Agree attaches independently and every non-Agree leaves scalars/routes unchanged."
  - site: "Legacy scalar route ingestion"
    source: "crates/livrarr-db/src/sqlite_author.rs:31-38; crates/livrarr-db/src/sqlite_author.rs:417-427"
    classification: "legacy-only keyed evidence with LegacyUnguarded provenance"
    post_f1_fate: "Migration 079 stages every nonempty scalar; startup ingestion canonicalizes into route rows idempotently, then all scalar columns are frozen and route-only consumers are enabled."
    ac005_assertion: "Migration-077 fixture tests pin idempotent ingestion, invalid-value reporting, provenance upgrade/contradiction, complete route coverage, and no post-cutover scalar mutation."
  - site: "Work-add Goodreads similarity guesser"
    source: "crates/livrarr-handlers/src/work.rs:305-326"
    classification: "forbidden unkeyed automatic guesser"
    post_f1_fate: "Delete."
    ac005_assertion: "Mechanical scan rejects production author_similarity results flowing to updateAuthor, submit_evidence, apply_guarded_route, or any scalar route field."
  - site: "Standalone author-add Goodreads similarity guesser"
    source: "crates/livrarr-handlers/src/author.rs:118-139"
    classification: "forbidden unkeyed automatic guesser"
    post_f1_fate: "Delete."
    ac005_assertion: "Mechanical scan rejects the >=0.90 mutation block and any replacement that mints guarded evidence from a name-only guess."
  - site: "Series resolve Goodreads similarity guesser"
    source: "crates/livrarr-handlers/src/series.rs:118-139"
    classification: "forbidden unkeyed automatic guesser"
    post_f1_fate: "Delete the auto-link side effect; candidate discovery may remain read-only."
    ac005_assertion: "Mechanical scan rejects handler-level route writes and rendered/API tests prove search results remain candidates until explicit selection."
  - site: "Series service silent Goodreads resolver"
    source: "crates/livrarr-metadata/src/series_query_service/service.rs:228-259"
    classification: "forbidden unkeyed automatic guesser"
    post_f1_fate: "Delete; list/refresh return MissingGoodreadsRoute or the explicit picker state when no active route exists."
    ac005_assertion: "Mechanical scan rejects silently_resolve_author_key and author_similarity in production route consumers; service tests prove no-route paths perform no scalar write."
  - site: "Bibliography first-hit OpenLibrary resolver"
    source: "crates/livrarr-metadata/src/author_service.rs:483-526"
    classification: "forbidden unkeyed automatic guesser"
    post_f1_fate: "Delete; bibliography reads the plural active OpenLibrary route union and then uses the existing Google Books fallback."
    ac005_assertion: "Mechanical scan rejects resolve_ol_key and first-hit scalar updates; bibliography tests prove only active routes are consumed."

modules:
  - name: livrarr-domain
    responsibility: "Define the operational guard, canonical route parsing, and compile-wall-safe service, workflow, and gateway behavior."
    dependencies: []
    module_invariants:
      - "Only guard_author_route constructs AgreedAuthorRouteEvidence or RejectedAuthorRouteEvidence; neither capability is deserializable or exposes a public constructor."
      - "Tier 2 never constructs AgreedAuthorRouteEvidence and never reaches an automatic route write."
      - "UnsupportedProvider is key-local and terminal for one evidence generation; it never escapes to abort siblings."
    capability_survey:
      - capability: "Canonical author-name verdict"
        existing_source: "crates/livrarr-domain/src/identity_matching.rs:296"
        reuse_decision: reuse
        rationale: "The exact author_verdict signature and Agree/Grey/Disagree/Abstain authority already exist."
      - capability: "Provider queue priority and HTTP traits"
        existing_source: "crates/livrarr-domain/src/services/http.rs:14-132; crates/livrarr-domain/src/enrichment_types.rs:214-219"
        reuse_decision: reuse
        rationale: "All new background provider calls use the existing RequestPriority::Low and shared transport contracts."
      - capability: "Canonical provider-specific author routes"
        existing_source: none
        reuse_decision: rewrite
        rationale: "New private OL/GR/HC key newtypes and AuthorRouteKey parsing close raw-string identity bypasses."
    notes:
      - "AuthorLinkService, AuthorLinkWorkflow, and AuthorProviderGateway entries are compile-wall-safe trait contracts declared here; their call annotations constrain concrete metadata/external-data implementations and do not add livrarr-domain dependencies."
    # BRIEF-DRIFT: signature-grounding.md sections 2-3 label author_verdict/title_verdict
    # as livrarr-matching, but the cited source and direct symbol reads place both in livrarr-domain.
    public_api:
      functions:
        - name: guard_author_route
          inputs:
            - { name: current_display_names, type: "&[String]" }
            - { name: provider_ref, type: ProviderAuthorRef }
            - { name: evidence_work_id, type: "Option<WorkId>" }
            - { name: source, type: AuthorRouteEvidenceSource }
          output: "AuthorRouteGuardResult; sole constructor of AgreedAuthorRouteEvidence and sole place that calls canonical author_verdict"
          errors: []
          pseudocode:
            - "Build AuthorRouteEvidence from the canonical provider_ref key, trimmed observed name, evidence_work_id, and source."
            - "Evaluate author_verdict with a one-name provider side and the full current associated-name snapshot."
            - "If the verdict is Agree, construct the private non-deserializable AgreedAuthorRouteEvidence and return Agreed."
            - "Otherwise construct the private non-deserializable RejectedAuthorRouteEvidence from the unchanged evidence and actual Grey, Abstain, or Disagree verdict, then return Rejected."
          call_annotations:
            - { call: "String::trim", type: STDLIB, target: "Rust str::trim" }
            - { call: "author_verdict", type: EXISTING, target: "livrarr_domain::identity_matching::author_verdict(&[String], &[String]) -> AuthorVerdict" }
            - { call: "AgreedAuthorRouteEvidence/RejectedAuthorRouteEvidence private constructors", type: NEW, target: "guard-only constructors for the amended opaque capability types" }
          postconditions:
            - "Agreed is returned if and only if canonical author_verdict returned Agree."
          forbidden_behaviors:
            - "Never accept a caller-supplied verdict or mint the capability for Tier-2 catalog evidence."
          tdd_directives:
            - "Call the real guard with Agree, Grey, Abstain, and Disagree names; prove only Agree can be passed to the concrete guarded DB writer at compile time."

        - name: "AuthorLinkService::list_review"
          inputs:
            - { name: user_id, type: UserId }
          output: "Result<Vec<AuthorLinkReview>, AuthorLinkError>"
          errors: [NotFound, Database]
          pseudocode:
            - "Load current-generation pending author review rows for user_id."
            - "Return rows in stable author then candidate order; map repository failure to AuthorLinkError::Database."
          call_annotations:
            - { call: "AuthorLinkDb::list_review", type: NEW, target: "AuthorLinkDb::list_review(UserId) -> Result<Vec<AuthorLinkReview>, DbError>" }
          postconditions:
            - "No other user's author, route, or candidate is returned."
          tdd_directives:
            - "Drive the real GET review router against an in-memory SqliteDb containing two users and superseded generations; assert only the authenticated user's current pending rows appear."

        - name: "AuthorLinkService::pick_candidate"
          inputs:
            - { name: user_id, type: UserId }
            - { name: candidate_id, type: i64 }
          output: "Result<AuthorRoute, AuthorLinkError>"
          errors: [NotFound, RouteOwnedByOtherAuthor, Database]
          pseudocode:
            - "Execute the user-sovereign candidate-pick transaction for user_id and candidate_id."
            - "Return the attached or reactivated canonical route."
            - "Map ownership collision distinctly and map other repository failures without provider I/O."
          call_annotations:
            - { call: "AuthorLinkDb::pick_candidate_as_user", type: NEW, target: "AuthorLinkDb::pick_candidate_as_user(UserId, i64) -> Result<AuthorRoute, DbError>" }
          forbidden_behaviors:
            - "Never call a provider or route through the automatic guarded-evidence door."
          tdd_directives:
            - "POST through the real router with a real SqliteDb; pin normal pick, tombstone re-pick, stale generation, cross-user denial, and ownership collision."

        - name: "AuthorLinkService::attach_selected_route"
          inputs:
            - { name: user_id, type: UserId }
            - { name: author_id, type: AuthorId }
            - { name: key, type: AuthorRouteKey }
          output: "Result<AuthorRoute, AuthorLinkError>"
          errors: [NotFound, RouteOwnedByOtherAuthor, Database]
          pseudocode:
            - "Accept only an authenticated add-flow's explicitly selected, already canonical AuthorRouteKey after the raw UI value has passed handler parsing."
            - "Call attach_route_as_user for user_id, the converged author_id returned by the already-committed shared create/adopt gate, and key."
            - "Return the inserted, existing, or explicitly reactivated UserPicked route; map ownership collision distinctly and map other repository failures to Database."
            - "Leave the independently committed progress row due whether attachment succeeds or fails, so the add flow never orphans the author."
          call_annotations:
            - { call: "AuthorLinkDb::attach_route_as_user", type: NEW, target: "AuthorLinkDb::attach_route_as_user(UserId, AuthorId, AuthorRouteKey) -> Result<AuthorRoute, DbError>" }
          postconditions:
            - "A successful return records an explicit user-sovereign selection and never claims that the selected key was provider proof."
            - "The converged author and its durable enqueue precede this independently retryable route operation."
          forbidden_behaviors:
            - "Never call a provider, guard_author_route, apply_guarded_route, a generic scalar update, or accept a key inherited only from a selected work."
          tdd_directives:
            - "Drive the real add-box, standalone add-author, and manual-import routers over real SQLite for selected-route create, exact-name adoption, and unambiguous adoption; assert the gate returns the converged author first, the route is UserPicked, and one durable task survives a forced attach failure."
            - "Drive exact tombstone re-pick, cross-user route ownership, and idempotent repeat selection; assert the shared user-attach semantics and zero provider/scalar writes."
            - "Submit malformed raw OL/GR/HC route values through each real router and assert rejection occurs before the repository seam; submit no selected route and assert enqueue occurs with zero attach calls."
            - "Compile-prove the automatic author-link workflow/gateway capability set cannot invoke attach_selected_route."

        - name: "AuthorLinkService::dismiss_candidate"
          inputs:
            - { name: user_id, type: UserId }
            - { name: candidate_id, type: i64 }
          output: "Result<(), AuthorLinkError>"
          errors: [NotFound, Database]
          pseudocode:
            - "Execute the user-scoped current-generation candidate dismissal."
            - "Return success only after progress is atomically re-derived."
          call_annotations:
            - { call: "AuthorLinkDb::dismiss_candidate_as_user", type: NEW, target: "AuthorLinkDb::dismiss_candidate_as_user(UserId, i64) -> Result<(), DbError>" }
          postconditions:
            - "Routes and tombstones are unchanged."
          tdd_directives:
            - "POST through the real dismiss router; prove current pending dismissal succeeds, stale/cross-user ids fail, and the candidate can reappear after explicit re-resolve."

        - name: "AuthorLinkService::remove_route"
          inputs:
            - { name: user_id, type: UserId }
            - { name: author_id, type: AuthorId }
            - { name: route_id, type: i64 }
          output: "Result<(), AuthorLinkError>"
          errors: [NotFound, Database]
          pseudocode:
            - "Mark the selected user-owned active route removed through the classified user transaction."
            - "Enqueue the author for local progress re-derivation without clearing the tombstone."
          call_annotations:
            - { call: "AuthorLinkDb::remove_route_as_user", type: NEW, target: "AuthorLinkDb::remove_route_as_user(UserId, AuthorId, i64) -> Result<(), DbError>" }
            - { call: "AuthorLinkWorkflow::enqueue", type: NEW, target: "AuthorLinkWorkflow::enqueue(UserId, AuthorId, UserReResolve) -> Result<(), AuthorLinkError>" }
          postconditions:
            - "The removed row remains as the permanent automatic-readd tombstone."
          tdd_directives:
            - "DELETE through the real router and real SqliteDb, rerun the real worker with identical evidence, and assert a previously-removed candidate appears while the route remains removed."

        - name: "AuthorLinkService::re_resolve"
          inputs:
            - { name: user_id, type: UserId }
            - { name: author_id, type: AuthorId }
          output: "Result<AuthorLinkProgress, AuthorLinkError>"
          errors: [NotFound, Database]
          pseudocode:
            - "Enqueue the author with UserReResolve, superseding review eligibility without waiting for provider work."
            - "Load and return the durable progress row."
          call_annotations:
            - { call: "AuthorLinkWorkflow::enqueue", type: NEW, target: "AuthorLinkWorkflow::enqueue(UserId, AuthorId, UserReResolve) -> Result<(), AuthorLinkError>" }
            - { call: "AuthorLinkDb::load_progress", type: NEW, target: "internal AuthorLinkDb progress-row read required by the service result" }
          forbidden_behaviors:
            - "Never await OpenLibrary or any other provider before returning."
          tdd_directives:
            - "POST through the real resolve route; assert 202 is returned before a blocking adapter seam is released and the durable row is immediately due."

        - name: "AuthorLinkService::progress"
          inputs:
            - { name: user_id, type: UserId }
          output: "Result<AuthorSweepProgress, AuthorLinkError>"
          errors: [Database]
          pseudocode:
            - "Load the user-scoped aggregate over persisted author progress and current-generation key attempts."
            - "Return author-state counts, key outcome counts, the legacy 0.90 shadow count, and oldest due time."
          call_annotations:
            - { call: "AuthorLinkDb::sweep_progress", type: NEW, target: "AuthorLinkDb::sweep_progress(UserId) -> Result<AuthorSweepProgress, DbError>" }
          tdd_directives:
            - "GET through the real progress router over an in-memory SqliteDb containing mixed current and superseded generations; pin every aggregate field and user isolation."

        - name: "AuthorLinkWorkflow::enqueue"
          inputs:
            - { name: user_id, type: UserId }
            - { name: author_id, type: AuthorId }
            - { name: trigger, type: AuthorLinkTrigger }
          output: "Result<(), AuthorLinkError>"
          errors: [NotFound, Database]
          pseudocode:
            - "Idempotently ensure the user's author progress row exists."
            - "Make the row due according to trigger without stealing or clearing a live lease."
            - "For UserReResolve, reopen eligible dismissed evidence and re-arm terminal key outcomes as allowed by the state machine."
          call_annotations:
            - { call: "AuthorLinkDb::ensure_enqueued", type: NEW, target: "AuthorLinkDb::ensure_enqueued(UserId, AuthorId, AuthorLinkTrigger) -> Result<(), DbError>" }
          invariants:
            - "Repeated enqueue calls converge on one durable author task."
          tdd_directives:
            - "Drive add-box, manual import, list import, series monitor, and Readarr creation through their real entry paths and assert each returned/converged author has one due progress row."

        - name: "AuthorLinkWorkflow::submit_evidence"
          inputs:
            - { name: user_id, type: UserId }
            - { name: author_id, type: AuthorId }
            - { name: evidence, type: AgreedAuthorRouteEvidence }
          output: "Result<RouteWriteOutcome, AuthorLinkError>"
          errors: [NotFound, RouteOwnedByOtherAuthor, Database]
          pseudocode:
            - "Wrap the opaque agreed evidence with author_id and no claim token."
            - "Apply it through the one automatic route repository door."
            - "Return the classified attach, already-active, provenance-upgrade, tombstone, contradiction, or ownership outcome."
          call_annotations:
            - { call: "AuthorLinkDb::apply_guarded_route", type: NEW, target: "AuthorLinkDb::apply_guarded_route(GuardedRouteWrite) -> Result<RouteWriteOutcome, DbError>" }
          forbidden_behaviors:
            - "Never accept raw AuthorRouteEvidence, a verdict value, or a Tier-2 candidate."
          tdd_directives:
            - "Compile-test that raw/rejected evidence cannot call submit_evidence, then exercise the real SqliteDb for idempotent attach, legacy upgrade, tombstone, contradiction, and ownership outcomes."

        - name: "AuthorLinkWorkflow::record_readarr_rejection"
          inputs:
            - { name: user_id, type: UserId }
            - { name: author_id, type: AuthorId }
            - { name: rejected, type: RejectedAuthorRouteEvidence }
          output: "Result<AuthorLinkCandidate, AuthorLinkError>; accepts only source=ReadarrImport and never writes a route"
          errors: [NotFound, Database]
          pseudocode:
            - "Pass the opaque rejected Readarr evidence to the claimless repository operation for the user-owned author."
            - "Return the idempotently recorded current-generation ReadarrNameGuardFailed candidate."
            - "Map repository scope or persistence failures without calling the guarded route writer."
          call_annotations:
            - { call: "AuthorLinkDb::record_readarr_rejection", type: NEW, target: "AuthorLinkDb::record_readarr_rejection(UserId, AuthorId, RejectedAuthorRouteEvidence) -> Result<AuthorLinkCandidate, DbError>" }
          postconditions:
            - "The Readarr name and actual non-Agree verdict are reviewable, and no route or tombstone state changes."
          forbidden_behaviors:
            - "Never accept AgreedAuthorRouteEvidence, raw evidence, a caller-supplied verdict, or an AuthorLinkClaim."
          tdd_directives:
            - "Drive the real Readarr import branch for Grey, Abstain, and Disagree; assert one idempotent ReadarrNameGuardFailed candidate and retained Readarr name, and compile-prove Agreed evidence cannot enter this operation."

        - name: "AuthorLinkWorkflow::run_due"
          inputs:
            - { name: batch_size, type: u32 }
            - { name: cancel, type: CancellationToken }
          output: "Result<AuthorSweepTickSummary, AuthorLinkError>; Tier-1 provider errors are converted to durable key outcomes and do not escape or abort sibling authors"
          errors: [Database]
          pseudocode:
            - "Boundedly create missing progress rows before claiming work."
            - "Claim at most batch_size due or dirty authors with configured leases."
            - "For each claim until cancellation, invoke the concrete run_author operation outside every DB transaction."
            - "Count ClaimLost or database failures per author, continue later claimed authors, and return the tick summary."
            - "Require run_author to convert every classified provider failure, including UnsupportedProvider, into a durable key-local outcome."
          call_annotations:
            - { call: "AuthorLinkDb::ensure_missing_progress_rows", type: NEW, target: "AuthorLinkDb::ensure_missing_progress_rows(u32) -> Result<u32, DbError>" }
            - { call: "AuthorLinkDb::claim_due", type: NEW, target: "AuthorLinkDb::claim_due(DateTime<Utc>, DateTime<Utc>, u32) -> Result<Vec<AuthorLinkClaim>, DbError>" }
            - { call: "AuthorLinkingServiceImpl::run_author", type: NEW, target: "AuthorLinkingServiceImpl::run_author(AuthorLinkClaim) -> Result<AuthorLinkProgressUpdate, AuthorLinkError>" }
            - { call: "CancellationToken::is_cancelled", type: LIBRARY, library: "tokio-util", target: "tokio-util" }
          invariants:
            - "No DB transaction remains open across run_author provider I/O."
          tdd_directives:
            - "Run the real workflow with real in-memory SqliteDb claims and a controllable real gateway adapter seam; interrupt mid-batch, restart, and prove completed siblings are not rolled back or replayed."

        - name: "AuthorProviderGateway::fetch_work_authors"
          inputs:
            - { name: provider, type: AuthorProvider }
            - { name: work_route, type: String }
            - { name: priority, type: RequestPriority }
          output: "Result<Vec<ProviderAuthorRef>, AuthorProviderError>"
          errors: [UnsupportedProvider, NotConfigured, Retryable, Permanent, LayoutDrift]
          pseudocode:
            - "Require RequestPriority::Low for author-road callers."
            - "Dispatch OpenLibrary, Goodreads, or Hardcover to its keyed work-author adapter."
            - "Return every contributor ref associated with the selected work; do not select a winning author here."
            - "Map an unsupported provider to UnsupportedProvider."
            - "At each adapter boundary, parse either Retry-After form at response-receipt time into an absolute UTC retry_not_before; preserve it in AuthorProviderError::Retryable { error, retry_not_before }, using None plus a diagnostic for an absent or invalid header."
          call_annotations:
            - { call: "OpenLibraryClient::fetch_work_authors", type: NEW, target: "OpenLibraryClient::fetch_work_authors(String, RequestPriority)" }
            - { call: "GoodreadsClient::fetch_work_authors", type: NEW, target: "GoodreadsClient::fetch_work_authors(String, RequestPriority)" }
            - { call: "HardcoverClient::fetch_work_authors", type: NEW, target: "HardcoverClient::fetch_work_authors(String, RequestPriority)" }
          preconditions:
            domain_state:
              - "priority is RequestPriority::Low for the background road."
          forbidden_behaviors:
            - "Never scan unrelated Goodreads Contributor entities or widen NormalizedWorkDetail."
          decisions:
            - { key: "retry_hint_seam", value: "typed absolute UTC lower bound in AuthorProviderError::Retryable.retry_not_before", rationale: "The amended enum carries provider timing across all gateway methods without an error-string parsing protocol; invalid or absent Retry-After remains Retryable with None and a diagnostic." }
          tdd_directives:
            - "Drive each concrete adapter seam with multi-contributor fixtures plus unsupported/not-configured/retryable/permanent/layout-drift responses and both Retry-After forms; assert absolute UTC hint preservation, invalid-header None plus diagnostics, every returned ref remains unselected, and priority is Low."

        - name: "AuthorProviderGateway::search_open_library_authors"
          inputs:
            - { name: query, type: String }
            - { name: limit, type: u32 }
            - { name: priority, type: RequestPriority }
          output: "Result<Vec<OpenLibraryAuthorCandidate>, AuthorProviderError>"
          errors: [Retryable, Permanent]
          pseudocode:
            - "Use the refactored single OpenLibrary author-search adapter shared with the existing interactive lookup plumbing."
            - "Send the request through the shared OpenLibrary queue and existing server identity at the supplied priority."
            - "Parse canonical route key, primary name, canonical-distinct alternate names, top_work, and work_count."
            - "On a retryable response, preserve the adapter's absolute UTC retry_not_before in AuthorProviderError::Retryable; absent or invalid Retry-After yields None plus a diagnostic, not Permanent."
            - "Return bounded candidates without constructing route evidence or writing state."
          call_annotations:
            - { call: "OpenLibraryAuthorSearchAdapter::search", type: NEW, target: "shared internal adapter extracted from existing AuthorService::lookup(&str, u32), returning Vec<OpenLibraryAuthorCandidate> with alternate_names" }
            - { call: "AuthorRouteKey::parse", type: NEW, target: "AuthorRouteKey::parse(OpenLibrary, &str)" }
            - { call: "canonical_author_key", type: EXISTING, target: "livrarr_domain::identity_matching::canonical_author_key(&str) -> String" }
          preconditions:
            domain_state:
              - "Background road calls supply RequestPriority::Low."
          decisions:
            - { key: "alternate_names_representation", value: "populate OpenLibraryAuthorCandidate.alternate_names with stable response order after canonical-distinct deduplication against the primary and prior aliases", rationale: "The amended search DTO carries aliases; canonical deduplication prevents one spelling family from producing duplicate verdict rows." }
          tdd_directives:
            - "Exercise the shared paced adapter with a real HTTP adapter seam and a search fixture containing duplicate/canonical-distinct aliases, top_work, and work_count plus valid/invalid Retry-After responses; assert stable alias population, typed absolute retry hint preservation, one request implementation serves both lookup surfaces, and no candidate writes a route."

        - name: "AuthorProviderGateway::fetch_open_library_catalog_page"
          inputs:
            - { name: author_route, type: OpenLibraryAuthorKey }
            - { name: cursor, type: "Option<String>" }
            - { name: priority, type: RequestPriority }
          output: "Result<OpenLibraryCatalogPage, AuthorProviderError>"
          errors: [Retryable, Permanent]
          pseudocode:
            - "Build the canonical OpenLibrary author works request for author_route and cursor."
            - "Fetch through the shared OpenLibrary queue with existing server identity and Low priority."
            - "Return titles and the next cursor; distinguish retryable and permanent failures from a successful empty page."
            - "For retryable responses, preserve the parsed absolute UTC retry_not_before in AuthorProviderError::Retryable; an absent or invalid header remains Retryable with None plus a diagnostic."
          call_annotations:
            - { call: "HttpFetcher::fetch", type: EXISTING, target: "HttpFetcher::fetch(&self, FetchRequest) -> Result<FetchResponse, FetchError>; crates/livrarr-domain/src/services/http.rs:132" }
            - { call: "AuthorRouteKey::parse", type: NEW, target: "AuthorRouteKey canonical accessor validation before request construction" }
          forbidden_behaviors:
            - "Never convert a failed fetch into an empty catalog or computed zero corroboration."
          tdd_directives:
            - "Use the real OpenLibrary adapter seam with paginated, empty, retryable (valid/invalid Retry-After), and permanent fixtures; assert Low priority, absolute retry hint preservation, cursor continuity, and distinct empty-versus-failure outcomes."

        - name: "AuthorRouteKey::parse"
          inputs:
            - { name: provider, type: AuthorProvider }
            - { name: raw, type: "&str" }
          output: "Result<AuthorRouteKey, AuthorLinkError>"
          errors: [InvalidRoute]
          pseudocode:
            - "Trim raw and reject empty input."
            - "For OpenLibrary, accept only the canonical OL<digits>A form or a known OpenLibrary URL or /authors/ prefix that reduces to that form."
            - "For Goodreads and Hardcover, parse a positive u64 decimal and canonicalize without leading zeros."
            - "Reject malformed, overflowed, zero, or provider-mismatched input."
          call_annotations:
            - { call: "str::trim", type: STDLIB, target: "Rust str::trim" }
            - { call: "str::strip_prefix", type: STDLIB, target: "Rust str::strip_prefix" }
            - { call: "str::parse::<u64>", type: STDLIB, target: "Rust FromStr for u64" }
          postconditions:
            - "Equal provider aliases produce one canonical AuthorRouteKey value."
          tdd_directives:
            - "Run parser table tests for canonical values, accepted OL aliases, leading-zero numeric ids, empty/zero/overflow/malformed input, and cross-provider forms; round-trip every success through the real SQLite route uniqueness path."

  - name: livrarr-db
    responsibility: "Implement additive migrations and every atomic author-link route, tombstone, review, name, progress, claim, rename, and merge operation."
    dependencies: [livrarr-domain]
    module_invariants:
      - "All author-provider route SQL lives in livrarr-db::sqlite_author_link or its numbered migrations."
      - "No route uniqueness rule assumes one route per provider; the tuple is author plus provider plus canonical value."
      - "Provider I/O never occurs inside a DB transaction."
      - "Current evidence generation and claim token guard every mutable worker transition."
      - "Only AuthorLinkDb::pick_candidate_as_user and AuthorLinkDb::attach_route_as_user can reach the private attach_route_as_user_tx helper; automatic workflow/gateway capabilities expose neither public user method."
      - "Migration 078's author_link_work_evidence_changed trigger is the write-layer producer for EvidenceFingerprintChanged: a null-safe change to works.identity_status/ol_key/gr_key/hc_key atomically queues the associated existing author-link progress row, makes it due now, and deliberately invalidates its claim while preserving fingerprint, evidence generation, and cursor."
    capability_survey:
      - capability: "Concurrency-safe author create gate"
        existing_source: "crates/livrarr-db/src/sqlite_author.rs:405-450"
        reuse_decision: wrap
        rationale: "Keep the named ON CONFLICT convergence and extend the same transaction to ensure the winner's progress row and initial name variant."
      - capability: "One author merge transaction"
        existing_source: "crates/livrarr-db/src/sqlite_author.rs:86-375"
        reuse_decision: wrap
        rationale: "Extend the proven repoint-before-delete transaction to fold routes, tombstones, variants, candidates, and progress while retaining the exact three-field AuthorMergeReport."
      - capability: "Display-name cascade"
        existing_source: "crates/livrarr-db/src/sqlite_author.rs:86-356"
        reuse_decision: wrap
        rationale: "Reuse the shipped authors.name plus works.author_name rewrite and merge_generation bump; never touch normalized_author."
      - capability: "Resumable due-time sweep storage"
        existing_source: "crates/livrarr-db/src/sqlite_work.rs:1393; crates/livrarr-db/migrations/065_works_next_convergence_at.sql"
        reuse_decision: rewrite
        rationale: "Reuse the due-time pattern but add the ratified token lease and generation-scoped per-key ledger required for partial failures."
      - capability: "Author-link schema and legacy ingestion"
        existing_source: "crates/livrarr-db/migrations/077_authors_normalized_name.sql"
        reuse_decision: rewrite
        rationale: "Allocate new migrations 078 and 079 after the verified head; migration 078 also owns the first SQLite trigger in the codebase, and no applied migration is edited."
    notes:
      - "Migration 078_author_provider_linking_tables.sql adds routes, name variants (including nullable open_library_role), candidates (including primary_name_verdict, top_work_preview, and catalog_evidence_state), author_link_candidate_alternate_name_evidence, progress, key attempts, staging, supporting indexes, and the author_link_work_evidence_changed trigger; no works schema change."
      - "The trigger is exactly AFTER UPDATE OF identity_status, ol_key, gr_key, hc_key ON works with a WHEN disjunction of OLD.column IS NOT NEW.column for all four columns, so SQLite's IS NOT comparison is null-safe and a same-value update is a no-op."
      - "The association is the existing works.author_id foreign key: the trigger joins NEW.author_id to author_link_progress.author_id (scoped to the work's user_id), which is the same join compute_evidence_fingerprint uses to load an author's settled-work tuples. It is never a name match — implementers must not substitute one."
      - "When the changed work's author has an F1 progress row, the trigger updates that row in the same work-write transaction to state Queued, next_attempt_at no later than the transaction's current time, and semantic trigger EvidenceFingerprintChanged; it clears claim_token and lease_until even for a live claim, but leaves evaluated_fingerprint, evidence_generation, and cursor byte-for-byte intact. The stale worker's next token-checked mutation returns ClaimLost."
      - "The trigger performs only local SQL row updates: it does not insert a missing progress row, perform provider I/O, reopen dismissed evidence, reset attempts, or unconditionally re-walk authors. The atomic shared author create/adopt gate guarantees progress existence for F1-created authors."
      - "author_link_candidate_alternate_name_evidence stores candidate_id, ordinal, name, canonical_name, and verdict with uniqueness on (candidate_id, canonical_name)."
      - "Every AuthorNameVariant writer supplies open_library_role explicitly: a picked OL search primary/alias uses Primary/Alias; Tier-1, enrichment, Readarr, import, legacy, and User observations use null because their payload does not establish an OL search role. Merge retains Primary over Alias over null for the same canonical OL name."
      - "Non-Tier2 candidates use primary_name_verdict=name_verdict, empty alternate_name_evidence, top_work_preview=None, catalog_evidence_state=Pending, and corroborated_title_count=0 as not-run fields; Review omits catalog-count presentation for those reasons, so Pending is never shown as a scheduled catalog read."
      - "Migration 079_author_provider_linking_legacy_stage.sql stages every nonempty legacy scalar and every author name, using the exact zero-padded sequence after 077."
      - "CreateAuthorDbRequest and generic update requests lose route fields at the cutover; legacy scalar columns remain physically present and frozen."
    decisions:
      - key: "first_sqlite_trigger_precedent"
        value: "Migration 078 introduces author_link_work_evidence_changed; a verified CREATE TRIGGER search over crates/livrarr-db/migrations returned zero through all 77 existing migrations."
        rationale: "Livrarr repeatedly suffers when one value reaches one writer path but not every writer path. A single null-safe database trigger moves fingerprint wake-up completeness to the write layer, where every identity/status/key mutation commits, instead of requiring every present and future writer to remember a notification."
      - key: "fingerprint_wakeup_claim_policy"
        value: "EvidenceFingerprintChanged deliberately clears a live claim token and lease without resetting evaluated fingerprint, evidence_generation, or cursor."
        rationale: "A worker holding the pre-change snapshot must lose authority before any route/candidate/key-attempt/progress mutation; retained road state lets the replacement claim compare the live fingerprint and restart only when evidence actually differs."
    migration_tdd_directives:
      - "Upgrade a real migration-077 SQLite fixture through migration 078, create an F1 author/progress/work graph, and update identity_status plus each of ol_key/gr_key/hc_key from null-to-value, value-to-different-value, and value-to-null; assert one atomic Queued/due-now EvidenceFingerprintChanged wake-up per statement."
      - "Update all four watched columns to their existing values and update unrelated work columns; assert progress, token, lease, fingerprint, evidence_generation, cursor, and due time are byte-identical."
      - "Hold a live author claim, change watched evidence, and assert the trigger clears only token/lease while retaining evaluated fingerprint/evidence_generation/cursor; every stale route, candidate, key-attempt, and progress mutation must return ClaimLost."
      - "Update evidence for a pre-F1 author with no progress row and assert the trigger performs no insert; then pass the author through the shared create/adopt gate and assert the invariant is repaired without a provider call."
    internal_operations:
      - name: "shared_author_create_or_adopt_gate"
        inputs:
          - { name: request, type: "CreateAuthorGateRequest containing user_id, name, sort_name, import_id, initial_name_source, and trigger but no provider route fields" }
        output: "Result<(Author, bool), DbError>; the bool is true only for the transaction that inserted the author"
        errors: [Constraint, Database]
        pseudocode:
          - "Canonicalize request.name before opening provider-independent write work; reject an unusable canonical identity."
          - "Begin one SQLite transaction shared by every interactive, list, series, manual-import, and Readarr author create/adopt path."
          - "INSERT the author with ON CONFLICT(user_id, normalized_name) DO NOTHING, then select the winning user-owned row on the same transaction connection."
          - "Upsert the winner's initial AuthorNameVariant from request.name and request.initial_name_source with open_library_role null."
          - "Insert the winner's author-link progress row as Queued and due now when absent; when present, make it no later than now under request.trigger without replacing the row or stealing a live lease."
          - "Commit only after author, initial name variant, and progress state all exist; return the winner and whether this transaction inserted it before any caller invokes an independently retryable selected-route operation."
        call_annotations:
          - { call: "canonical_author_key", type: EXISTING, target: "livrarr_domain::identity_matching::canonical_author_key(&str) -> String" }
          - { call: "SqlitePool::begin", type: LIBRARY, library: "sqlx", target: "sqlx" }
          - { call: "sqlx::query", type: LIBRARY, library: "sqlx", target: "sqlx" }
          - { call: "Transaction::commit", type: LIBRARY, library: "sqlx", target: "sqlx" }
        invariants:
          - "No committed F1 author exists without exactly one progress row and at least its initial name variant."
          - "Converged creation-race losers return the same winning author id and report created=false."
        postconditions:
          - "The returned author is durably enqueued even when a later attach_selected_route call fails."
        forbidden_behaviors:
          - "Never accept ol_key, gr_key, hc_key, raw route evidence, or perform provider I/O."
        tdd_directives:
          - "Run five concurrent real SqliteDb gate calls for the same user/canonical name, matching ST-008 import width; assert all succeed with one author id, exactly one created=true, one progress row immediately due, and one canonical initial-name row."
          - "Inject a real SQLite failure after the author insert but before progress/name completion and assert the transaction rolls back every row; repeat from the same request and assert clean success."
          - "Adopt an existing author with missing progress/name state through the gate and assert both are repaired atomically; race the repair and assert no duplicates."
          - "Return created, exact-name-adopted, and unambiguously-adopted winners to each add flow, force the subsequent selected-route attach to fail, and assert the author/name/progress transaction remains committed and due."

      - name: "attach_route_as_user_tx"
        inputs:
          - { name: tx, type: "&mut SqliteConnection" }
          - { name: user_id, type: UserId }
          - { name: author_id, type: AuthorId }
          - { name: key, type: AuthorRouteKey }
        output: "Result<AuthorRoute, DbError>; transaction-internal canonical user attach/reactivation shared by the two public user entry shapes"
        errors: [NotFound, Constraint]
        pseudocode:
          - "Verify author_id belongs to user_id on the caller's transaction connection."
          - "Revalidate key.provider/key.value through AuthorRouteKey::parse so only the canonical tuple reaches SQL."
          - "Load any route row for the same user/provider/canonical value, including removed rows; if it belongs to another author, return the ownership Constraint without mutation."
          - "When this author's exact row is Active, idempotently retain it and promote provenance to UserPicked when necessary."
          - "When this author's exact row is Removed, explicitly reactivate that tombstone, clear removed_at/removed_by_user_id, and set provenance UserPicked."
          - "When no row exists, insert one Active route with UserPicked provenance."
          - "Return the resulting route on the caller's transaction; do not resolve candidates, re-derive progress, or commit because each public caller owns those surrounding steps."
        call_annotations:
          - { call: "AuthorRouteKey::parse", type: NEW, target: "AuthorRouteKey::parse(AuthorProvider, &str)" }
          - { call: "sqlx::query_as", type: LIBRARY, library: "sqlx", target: "sqlx" }
          - { call: "sqlx::query", type: LIBRARY, library: "sqlx", target: "sqlx" }
        invariants:
          - "This is the sole private user-attach transaction helper allowed to clear an exact route tombstone."
          - "Equal canonical tuples share identical ownership, idempotency, provenance, and tombstone behavior for direct selection and review-candidate selection."
        forbidden_behaviors:
          - "Never accept raw strings, call a provider, invoke guard_author_route/apply_guarded_route, clear another author's tombstone, mutate a candidate, or write a legacy scalar."
        tdd_directives:
          - "Call both public user methods against the same real SQLite route fixtures and assert byte-equivalent new attach, active repeat, provenance promotion, exact tombstone reactivation, and other-author ownership outcomes."
          - "Use two users with the same canonical key and assert user scoping permits independent routes; use two authors in one user and assert the second cannot steal the tuple."
          - "Compile-prove no automatic repository capability exposes this helper or either public user method, and mechanically scan the helper for provider and legacy-scalar calls."
    public_api:
      functions:
        - name: "AuthorLinkDb::ensure_enqueued"
          inputs:
            - { name: user_id, type: UserId }
            - { name: author_id, type: AuthorId }
            - { name: trigger, type: AuthorLinkTrigger }
          output: "Result<(), DbError>"
          errors: [NotFound, Constraint]
          pseudocode:
            - "Begin a short transaction and verify author_id belongs to user_id."
            - "Insert a queued progress row when absent."
            - "When present, make next_attempt_at no later than now and apply trigger-specific generation/reopen rules without replacing the row."
            - "Do not alter a non-expired lease token or erase its cursor."
            - "Commit."
          call_annotations:
            - { call: "SqlitePool::begin", type: LIBRARY, library: "sqlx", target: "sqlx" }
            - { call: "Utc::now", type: LIBRARY, library: "chrono", target: "chrono" }
            - { call: "Transaction::commit", type: LIBRARY, library: "sqlx", target: "sqlx" }
          postconditions:
            - "Exactly one progress row exists and is eventually claimable."
          tdd_directives:
            - "Use a real in-memory SqliteDb to race repeated enqueue triggers against a live lease; assert one row, no lease theft, and trigger-correct due/generation behavior."

        - name: "AuthorLinkDb::ensure_missing_progress_rows"
          inputs:
            - { name: limit, type: u32 }
          output: "Result<u32, DbError>; bounded lazy discovery for any pre-existing author lacking progress"
          errors: [Database]
          pseudocode:
            - "Select at most limit authors lacking progress in stable author-id order."
            - "Insert queued progress and the current author-name variant with open_library_role null using ON CONFLICT DO NOTHING."
            - "Return the number of progress rows inserted."
          call_annotations:
            - { call: "sqlx::query", type: LIBRARY, library: "sqlx", target: "sqlx" }
          postconditions:
            - "No author is duplicated and a bounded invocation never scans into provider work."
          tdd_directives:
            - "Start from a real migration-077 fixture with more authors than limit; call repeatedly and assert bounded counts, stable completion, and one progress row per author."

        - name: "AuthorLinkDb::claim_due"
          inputs:
            - { name: now, type: "DateTime<Utc>" }
            - { name: lease_until, type: "DateTime<Utc>" }
            - { name: limit, type: u32 }
          output: "Result<Vec<AuthorLinkClaim>, DbError>; lease-free/expired rows qualify when next_attempt_at<=now OR display_name_dirty=1, including otherwise terminal states"
          errors: [Database]
          pseudocode:
            - "Atomically select at most limit rows whose lease is absent or expired and whose due time has arrived or dirty flag is set."
            - "Assign a fresh claim token and lease_until to each selected row in stable due-time then author-id order."
            - "Snapshot cursor and display_name_generation into each returned claim."
            - "Return only rows updated by this transaction."
          call_annotations:
            - { call: "Uuid::new_v4", type: LIBRARY, library: "uuid", target: "uuid" }
            - { call: "sqlx::query_as", type: LIBRARY, library: "sqlx", target: "sqlx" }
          invariants:
            - "Two concurrent claimers cannot own the same live author lease."
          tdd_directives:
            - "Run two real SqliteDb claimers concurrently over due, future, dirty-terminal, live-lease, expired-lease, and trigger-woken rows; assert disjoint tokens, exact eligibility, and EvidenceFingerprintChanged rows are immediately claimable."

        - name: "AuthorLinkDb::load_road_input"
          inputs:
            - { name: claim, type: AuthorLinkClaim }
          output: "Result<AuthorRoadInput, DbError>"
          errors: [NotFound, ClaimLost]
          pseudocode:
            - "Verify claim token still owns the author's non-expired lease."
            - "Load the author, active routes, all stored name variants, evaluated fingerprint, display generation/dirty state, and works whose status may contribute."
            - "Filter settled_works to Confirmed and Provisional only and compute the live fingerprint from that snapshot."
            - "Return one coherent road input."
          call_annotations:
            - { call: "AuthorLinkDb::compute_evidence_fingerprint", type: NEW, target: "AuthorLinkDb::compute_evidence_fingerprint(UserId, AuthorId)" }
            - { call: "sqlx::query_as", type: LIBRARY, library: "sqlx", target: "sqlx" }
          forbidden_behaviors:
            - "Never include Pending, NeedsReview, Conflict, or NotFound works as Tier-1 evidence."
          tdd_directives:
            - "Populate every IdentityStatus in a real SqliteDb, claim the author, and assert only Confirmed/Provisional works enter settled_works while routes/names/generations are coherent; mutate qualifying work evidence after claim and assert the stale load returns ClaimLost."

        - name: "AuthorLinkDb::compute_evidence_fingerprint"
          inputs:
            - { name: user_id, type: UserId }
            - { name: author_id, type: AuthorId }
          output: "Result<AuthorEvidenceFingerprint, DbError>; sorted Confirmed/Provisional work tuples only"
          errors: [NotFound, Database]
          pseudocode:
            - "Load work id, identity status, and current OL/GR/HC work keys for the user's author."
            - "Keep only Confirmed and Provisional rows and canonicalize every present work key."
            - "Sort tuples by work id, status, provider, and canonical key."
