  - name: livrarr-external-data
    responsibility: "Fetch road-scoped keyed work contributors for OL/GR/HC without carrying route policy or widening shared enrichment payloads."
    dependencies: [livrarr-domain, livrarr-http]
    module_invariants:
      - "Only contributors associated with the selected work become ProviderAuthorRef values."
      - "All author-road requests use the shared outbound queue and RequestPriority::Low."
      - "Adapters report unreadable layout separately from a successfully parsed empty contributor set."
      - "OpenLibrary work-author hydration canonical-deduplicates author keys before lookup; positive names use one bounded TTL cache and same-key singleflight, while misses remain governed by the shared OL one-second bucket with at most two hydration requests in flight."
    capability_survey:
      - capability: "OpenLibrary paced transport"
        existing_source: "crates/livrarr-domain/src/services/http.rs:132; existing OpenLibrary RateBucket"
        reuse_decision: wrap
        rationale: "Reuse shared transport, queue bucket, server identity, and response limits for work and author hydration; add only a positive bounded TTL cache and same-key coalescing above that pacing authority."
      - capability: "Goodreads Apollo detail parser"
        existing_source: "crates/livrarr-external-data/src/goodreads/parsers.rs:622-755"
        reuse_decision: wrap
        rationale: "Extend parse_detail_next_data to follow only the selected Book's primary/secondary contributor edges; preserve warn-and-None layout-drift behavior."
      - capability: "Hardcover GraphQL transport"
        existing_source: "crates/livrarr-external-data/src/hardcover.rs:67-140"
        reuse_decision: wrap
        rationale: "Reuse hc_post and pin the verified books_by_pk.contributions.author.id/name shape with a contract fixture."
    internal_operations:
      - name: "OpenLibraryAuthorHydrator::name_for_key"
        inputs:
          - { name: author_key, type: OpenLibraryAuthorKey }
          - { name: priority, type: RequestPriority }
        output: "Result<String, ProviderFetchError>; one validated nonempty author name"
        errors: [Retryable, Permanent]
        pseudocode:
          - "Require the caller's already-canonical OpenLibrary author key and RequestPriority::Low."
          - "Under a short mutex, return a positive cache entry when its configured TTL has not expired; evict expired entries and maintain the configured bounded capacity in deterministic least-recently-used order."
          - "If the same key already has an in-flight hydration, join that singleflight and return the leader's cloned result without acquiring another queue permit or issuing another request."
          - "Otherwise register this caller as the key's leader, then outside the cache mutex acquire the existing shared OpenLibrary rate bucket and a hydration semaphore. The bucket permits no more than one request start per second and the semaphore permits at most two hydration requests in flight."
          - "Fetch the keyed author record through HttpFetcher at Low priority and validate both the response shape and a trimmed nonempty author name."
          - "On success, publish the name to all same-key waiters and insert only that positive value with the configured TTL; enforce the configured capacity before releasing the flight."
          - "On transport failure, malformed payload, or empty name, publish the typed error to waiters, remove the flight, and do not create a negative cache entry."
        call_annotations:
          - { call: "HttpFetcher::fetch", type: EXISTING, target: "HttpFetcher::fetch(&self, FetchRequest) -> Result<FetchResponse, FetchError>; crates/livrarr-domain/src/services/http.rs:132" }
          - { call: "OpenLibraryRateBucket::acquire", type: EXISTING, target: "existing shared OpenLibrary one-second rate bucket" }
          - { call: "tokio::sync::Mutex", type: LIBRARY, library: "tokio", target: "tokio" }
          - { call: "tokio::sync::Semaphore", type: LIBRARY, library: "tokio", target: "tokio" }
          - { call: "tokio::time::Instant", type: LIBRARY, library: "tokio", target: "tokio" }
          - { call: "HashMap::entry", type: STDLIB, target: "Rust std::collections::HashMap" }
        invariants:
          - "At most one HTTP hydration is active for one canonical key, even across concurrent work lookups."
          - "The cache stores only validated positive names; failures, empty names, and malformed payloads are always eligible for a later real retry."
          - "Successful sibling names remain cached when a later sibling fails, but no caller receives a partial contributor vector."
        decisions:
          - { key: "ol_hydration_cache", value: "deployment-configured positive TTL and bounded capacity with same-key singleflight; no negative cache", rationale: "Repeated contributor keys stop producing N+1 traffic without turning a transient or malformed response into durable absence." }
          - { key: "ol_hydration_pacing", value: "existing shared OL one-second bucket plus max two hydration requests in flight; no new lane", rationale: "The shared OpenLibrary queue remains the sole pacing authority while a small concurrency cap bounds slow in-flight requests." }
        tdd_directives:
          - "Use the real hydrator/HttpFetcher seam for repeated keys within one work, the same key across works, and concurrent same-key calls; assert exactly one hydration request, identical results, Low priority, and the shared one-second bucket."
          - "Advance controlled time past TTL and fill beyond configured capacity; assert expiry and deterministic eviction each cause exactly one new paced request."
          - "Make a later sibling fail after earlier siblings succeed, retry the work, and assert no partial vector escaped, completed names came from cache, and only the failed key was requested again."
          - "Return retryable, permanent, malformed, and empty-name responses; assert none are negatively cached and a later valid response performs a new request and succeeds."
    public_api:
      functions:
        - name: "OpenLibraryClient::fetch_work_authors"
          inputs:
            - { name: work_key, type: String }
            - { name: priority, type: RequestPriority }
          output: "Result<Vec<ProviderAuthorRef>, ProviderFetchError>"
          errors: [Retryable, Permanent]
          pseudocode:
            - "Parse work_key as a canonical OpenLibrary work route and reject malformed input."
            - "Fetch the keyed work record through the shared OpenLibrary queue at priority."
            - "Extract every authors[].author.key associated with that work, parse each through AuthorRouteKey::parse, and canonical-deduplicate keys while retaining first-seen contributor order."
            - "Hydrate each distinct key through OpenLibraryAuthorHydrator::name_for_key; its positive TTL cache, same-key singleflight, shared one-second OL bucket, and maximum-two in-flight semaphore apply across works."
            - "If one hydration fails, return its typed error without a partial contributor vector; keep already completed positive sibling names cached so the retry requests only incomplete keys."
            - "Return one canonical ProviderAuthorRef per distinct associated author key in first-seen order."
            - "Return retryable/permanent transport errors distinctly, preserving any adapter-parsed absolute UTC Retry-After lower bound for the gateway mapping; a valid record with no contributors returns an empty vector."
          call_annotations:
            - { call: "HttpFetcher::fetch", type: EXISTING, target: "HttpFetcher::fetch(&self, FetchRequest) -> Result<FetchResponse, FetchError>; crates/livrarr-domain/src/services/http.rs:132" }
            - { call: "AuthorRouteKey::parse", type: NEW, target: "AuthorRouteKey::parse(OpenLibrary, &str)" }
            - { call: "OpenLibraryAuthorHydrator::name_for_key", type: NEW, target: "shared paced/cacheable internal OL author-name adapter" }
          preconditions:
            domain_state:
              - "priority is RequestPriority::Low for author linking."
          tdd_directives:
            - "Exercise the real OL adapter seam with a multi-author work plus duplicate keys, repeated keys across works, concurrent same-key requests, TTL expiry, capacity eviction, malformed keys, empty authors/names, valid/invalid Retry-After retryable transport, and permanent response; assert canonical first-seen refs, exact HTTP call counts, no negative cache, no partial vector, cached successful siblings on retry, shared one-second pacing, maximum two in flight, typed retry timing, and Low priority."

        - name: "GoodreadsClient::fetch_work_authors"
          inputs:
            - { name: book_key, type: String }
            - { name: priority, type: RequestPriority }
          output: "Result<Vec<ProviderAuthorRef>, ProviderFetchError>"
          errors: [Retryable, Permanent, LayoutDrift]
          pseudocode:
            - "Fetch the selected Goodreads book page through the shared Goodreads queue at priority."
            - "Parse __NEXT_DATA__ and locate the selected Book entity for book_key."
            - "Follow only that Book's primaryContributorEdge and secondaryContributorEdges to referenced Contributor entities."
            - "For legacy layout only, accept numeric /author/show/<id> links attached to that book."
            - "Parse each referenced id through AuthorRouteKey::parse and return its associated name and role."
            - "If the selected-book association shape is unreadable, return LayoutDrift rather than an empty success."
            - "On retryable transport, preserve any adapter-parsed absolute UTC Retry-After lower bound for the gateway mapping."
          call_annotations:
            - { call: "HttpFetcher::fetch", type: EXISTING, target: "HttpFetcher::fetch(&self, FetchRequest) -> Result<FetchResponse, FetchError>; crates/livrarr-domain/src/services/http.rs:132" }
            - { call: "parse_detail_next_data", type: EXISTING, target: "parse_detail_next_data(&str) -> Option<GoodreadsDetailResult>; crates/livrarr-external-data/src/goodreads/parsers.rs:622" }
            - { call: "AuthorRouteKey::parse", type: NEW, target: "AuthorRouteKey::parse(Goodreads, &str)" }
          forbidden_behaviors:
            - "Never scan arbitrary Contributor or legacyId entries outside the selected Book's edges."
          tdd_directives:
            - "Run the real parser/adapter seam against the captured current fixture containing unrelated legacyId carriers, a legacy href fixture, multiple contributors, missing edges, malformed JSON, and transport errors with valid/invalid Retry-After; assert typed retry timing is preserved."

        - name: "HardcoverClient::fetch_work_authors"
          inputs:
            - { name: book_key, type: String }
            - { name: priority, type: RequestPriority }
          output: "Result<Vec<ProviderAuthorRef>, ProviderFetchError>"
          errors: [NotConfigured, Retryable, Permanent, LayoutDrift]
          pseudocode:
            - "If Hardcover is disabled or lacks a token, return NotConfigured without a request."
            - "Parse book_key as the books_by_pk integer id."
            - "Call hc_post with the verified contributions.author.id/name query at priority."
            - "Map retryable transport failures with their typed Retry-After lower bound; map non-retryable GraphQL/response failures that preserve a readable contract boundary to Permanent."
            - "If books_by_pk, contributions, or any contribution's author.id/name association is unreadable or has the wrong shape, return LayoutDrift rather than Permanent, NotConfigured, or an empty success."
            - "Treat a readable books_by_pk object with an empty contributions array as a valid empty contributor set."
            - "Parse every returned author id through AuthorRouteKey::parse and return all associated names."
            - "On retryable transport, preserve any adapter-parsed absolute UTC Retry-After lower bound for the gateway mapping."
          call_annotations:
            - { call: "hc_post", type: EXISTING, target: "hc_post<F: HttpFetcher>(&F, Value, &str, RequestPriority) -> Result<Value, HardcoverError>; crates/livrarr-external-data/src/hardcover.rs:67-140" }
            - { call: "AuthorRouteKey::parse", type: NEW, target: "AuthorRouteKey::parse(Hardcover, &str)" }
            - { call: "str::parse::<u64>", type: STDLIB, target: "Rust FromStr for u64" }
          tdd_directives:
            - "Use the real Hardcover adapter seam with the pinned live-probed books_by_pk.contributions.author.id/name fixture and multiple contributions; assert every associated canonical ref and Low priority."
            - "Disable Hardcover and separately omit its token; assert NotConfigured with zero HTTP requests. Then supply enabled config with missing/wrong-type books_by_pk, contributions, author, author.id, and author.name shapes; assert each is LayoutDrift, never NotConfigured, Permanent, or empty success."
            - "Return a readable empty contributions array and assert an empty success; return GraphQL errors and assert Permanent; return valid/invalid Retry-After transport failures and assert Retryable with exact typed timing."

