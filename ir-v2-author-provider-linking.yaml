        - name: "AuthorLinkingServiceImpl::run_author"
          inputs:
            - { name: claim, type: AuthorLinkClaim }
          output: "Result<AuthorLinkProgressUpdate, AuthorLinkError>; a dirty-name phase ranks/cascades locally and clears dirty only after commit; an otherwise unchanged fingerprint performs no provider I/O; Tier 1 persists each provider-key outcome and continues through siblings"
          errors: [ClaimLost, Database]
          pseudocode:
            - "Load AuthorRoadInput under claim and fail immediately on lost claim."
            - "If display_name_dirty, choose the display variant from current variants and work languages; when it differs, commit rename_author_and_cascade before any dirty clear."
            - "After the local phase, retain dirty in the eventual update unless stored display_name_generation still equals the claim snapshot."
            - "If the live settled-evidence fingerprint equals the evaluated fingerprint and no current-generation key retry is due, perform no provider call; advance only local/due scheduling state."
            - "If the fingerprint changed, increment evidence_generation, supersede older candidates, reset the road cursor, and materialize every canonical OL/GR/HC key on every Confirmed/Provisional work."
            - "If there are no settled works, skip all providers, run the isolated read-only legacy 0.90 shadow metric, and prepare ParkedNoSettledWork with a configured future due time."
            - "Prepare deterministic Pending and due-Retryable key attempts for the current generation."
            - "For each attempt, call fetch_work_authors with Low priority outside a transaction."
            - "For every returned contributor ref, call guard_author_route against the current associated-name snapshot."
            - "For every Agreed result, independently call apply_guarded_route with this claim; continue through all contributors so every Agree attaches."
            - "For every Rejected result, build a NameGuardFailed candidate with the actual verdict mirrored into primary_name_verdict, empty aliases, no preview, Pending/not-run catalog state, and zero count; persist it and never route it."
            - "Only after all contributor effects commit, complete the key attempt as Succeeded."
            - "Map NotConfigured to SkippedNotConfigured, Permanent to SkippedPermanent, LayoutDrift to ParkedLayoutDrift, and UnsupportedProvider to SkippedPermanent with diagnostic unsupported_provider; emit the operator error and continue siblings."
            - "For any Tier-1 or Tier-2 AuthorProviderError::Retryable { error, retry_not_before }, use the relevant persisted key-attempt or author-progress attempt_count and compute base = max(now + capped_backoff(attempt_count), retry_not_before ?? now), then next_attempt_at = base + deterministic per-author/key jitter; capped_backoff and jitter durations come only from deployment configuration, and attempt count alone never terminalizes."
            - "Complete each failed key attempt independently and continue all later siblings."
            - "After runnable Tier 1 keys, if no active OL route and no outstanding retryable OL key, run Tier 2 even when GR/HC retries or terminal failures remain."
            - "Tier 2 searches OL in the background at Low priority; evaluate the primary into primary_name_verdict and each canonical-distinct alternate into AuthorCandidateAlternateNameEvidence, then set name_verdict by strongest result in Agree, Grey, Abstain, Disagree order."
            - "Copy top_work into top_work_preview as a labeled preview and fetch-priority hint; it never increments corroboration."
            - "Fetch candidate catalogs in priority order with resumable cursors; count each local settled work id at most once when any catalog title returns TitleVerdict::Same."
            - "Start catalog_evidence_state as Pending; after a nonterminal successful page use Partial, on a retryable search/catalog fetch use Retrying while retaining cursor and observed N and scheduling the author with the common retry formula, on feed exhaustion or every distinct settled work matching use Complete, and on permanent catalog failure use Unavailable."
            - "For Partial or Retrying with observed matches, present at least N; when failure occurs before any match, present retrying/unavailable with an unknown count rather than zero. Never map a failed catalog read to Complete or computed zero."
            - "Persist every Tier-2 result as a candidate; do not call guard_author_route, submit_evidence, or apply_guarded_route."
            - "After the real road parks, run legacy_guess_metric as a read-only boolean with no route or candidate handle."
            - "Derive final progress: any current-generation retry yields RetryableFailure with earliest key due; otherwise pending candidates yield NeedsReview; otherwise any active route yields Linked; otherwise settled work yields ParkedNoEvidence; no settled work remains ParkedNoSettledWork."
            - "Advance progress with evaluated fingerprint, generation, cursor, diagnostic, shadow metric, and dirty compare-and-set semantics; return the same update."
          call_annotations:
            - { call: "AuthorLinkDb::load_road_input", type: NEW, target: "AuthorLinkDb::load_road_input(AuthorLinkClaim)" }
            - { call: "choose_author_display_name", type: NEW, target: "choose_author_display_name(&[AuthorNameVariant], work languages)" }
            - { call: "AuthorDb::rename_author_and_cascade", type: NEW, target: "AuthorDb::rename_author_and_cascade(RenameAuthorDbRequest)" }
            - { call: "AuthorLinkDb::prepare_key_attempts", type: NEW, target: "AuthorLinkDb::prepare_key_attempts(AuthorLinkClaim, i64, Vec<SettledWorkProviderKey>)" }
            - { call: "AuthorProviderGateway::fetch_work_authors", type: NEW, target: "AuthorProviderGateway::fetch_work_authors(AuthorProvider, String, Low) -> Result<Vec<ProviderAuthorRef>, AuthorProviderError>, including structured Retryable.retry_not_before" }
            - { call: "guard_author_route", type: NEW, target: "guard_author_route(&[String], ProviderAuthorRef, Option<WorkId>, Tier1SettledWork) -> AuthorRouteGuardResult with opaque Agreed/Rejected payloads" }
            - { call: "AuthorLinkDb::apply_guarded_route", type: NEW, target: "AuthorLinkDb::apply_guarded_route(GuardedRouteWrite)" }
            - { call: "AuthorLinkDb::record_candidates", type: NEW, target: "AuthorLinkDb::record_candidates(AuthorLinkClaim, Vec<AuthorLinkCandidate>)" }
            - { call: "AuthorLinkDb::complete_key_attempt", type: NEW, target: "AuthorLinkDb::complete_key_attempt(AuthorLinkClaim, i64, AuthorKeyAttemptOutcome)" }
            - { call: "AuthorProviderGateway::search_open_library_authors", type: NEW, target: "AuthorProviderGateway::search_open_library_authors(String, u32, Low) -> Result<Vec<OpenLibraryAuthorCandidate>, AuthorProviderError>, including alternate_names" }
            - { call: "author_verdict", type: EXISTING, target: "livrarr_domain::identity_matching::author_verdict(&[String], &[String]) -> AuthorVerdict" }
            - { call: "AuthorProviderGateway::fetch_open_library_catalog_page", type: NEW, target: "AuthorProviderGateway::fetch_open_library_catalog_page(OpenLibraryAuthorKey, Option<String>, Low)" }
            - { call: "title_verdict", type: EXISTING, target: "livrarr_domain::identity_matching::title_verdict(&ParsedTitle, &ParsedTitle) -> TitleVerdict" }
            - { call: "legacy_guess_metric", type: NEW, target: "isolated read-only wrapper over livrarr_matching::author_similarity" }
            - { call: "AuthorLinkDb::advance_progress", type: NEW, target: "AuthorLinkDb::advance_progress(AuthorLinkClaim, AuthorLinkProgressUpdate)" }
            - { call: "FNV-1a-64 jitter", type: NEW, target: "local deterministic jitter over user/author/generation/work/provider/route" }
          invariants:
            - "Every provider key and every agreeing contributor is processed; no first-success stop exists."
            - "A failed key never rolls back committed sibling effects or aborts the author batch."
            - "Tier 2 cannot mint evidence capability and cannot write a route."
          forbidden_behaviors:
            - "Never call work matching/settle identity, hold a DB transaction over provider I/O, use Normal/Interactive priority, or read/write legacy scalar author keys."
          decisions:
            - { key: "tier2_fetch_priority", value: "top_work Same-preview first, then summary name verdict, then canonical route key", rationale: "P2 allows top_work as a fetch-priority hint but not evidence; stable secondary keys make restart order deterministic." }
            - { key: "retry_jitter", value: "FNV-1a-64 author/key tuple mapped into the deployment-configured jitter window and added after max(now + capped_backoff(attempt_count), retry_not_before ?? now)", rationale: "Deterministic per-author/key jitter prevents synchronized retries while remaining restart-stable; all durations remain deployment configuration." }
            - { key: "retry_after_transport", value: "destructure AuthorProviderError::Retryable.retry_not_before and apply max(now + capped_backoff(attempt_count), retry_not_before ?? now) before jitter", rationale: "The amended typed hint is an absolute provider lower bound; attempt count remains scheduling input and never a terminality rule." }
            - { key: "tier2_evidence_representation", value: "populate primary_name_verdict, ordered alternate_name_evidence, top_work_preview, catalog_evidence_state, and observed Same-only count on every parked candidate", rationale: "The amended DTO preserves the full evidence protocol across persistence/restart without permitting Tier-2 route writes." }
          tdd_directives:
            - "Drive the concrete service with real in-memory SqliteDb and real adapter seams: all work statuses/keys, multi-contributor attach-each, all verdicts, every provider error including UnsupportedProvider, sibling continuation, exact Retry-After/backoff/jitter precedence and non-exhaustion, restart/claim loss, unchanged/replaced fingerprints, dirty CAS race, Tier-3 re-entry, OL-only Tier-2 deferral, park-always, every catalog state and at-least/unknown presentation, top_work no-count, primary/alias verdict summary, tombstones, legacy contradiction, ownership collision, and shadow metric isolation."
            - "Start ParkedNoSettledWork, commit a work transition to Confirmed through real SQLite, claim the trigger-woken row, and assert run_author detects the changed fingerprint and executes exactly the newly eligible keyed calls."
            - "Start Linked, add one new canonical OL, GR, and HC work key through real SQLite, and assert each trigger wake is resumable and the replacement run processes every new provider key without replaying terminal sibling attempts."
            - "Perform a same-value update of every watched column and an update of unrelated work metadata; assert the trigger does not wake progress and provider call count remains zero."
            - "Wake an author by changing evidence on an unsettled work excluded from the fingerprint; assert the redundant wake is claimed, the fingerprint-unchanged fast path issues zero provider calls, and only scheduling state advances."
            - "Mutate watched work evidence after run_author loads a live claim but before each token-checked route/candidate/key-attempt/progress write; assert ClaimLost, no stale effect, replacement claim ownership, and eventual processing of the new fingerprint."

  - name: livrarr-handlers
    responsibility: "Authenticate and validate author-link HTTP requests, call only narrow domain services, and map typed results without SQL/provider policy."
    dependencies: [livrarr-domain, livrarr-http, livrarr-jobs]
    module_invariants:
      - "No handler waits on author provider I/O or calls livrarr-db/livrarr-metadata directly."
      - "Every user mutation derives user_id from AuthContext and ignores body-supplied ownership."
    capability_survey:
      - capability: "Review handler precedent"
        existing_source: "crates/livrarr-handlers/src/identity_review.rs:55-208"
        reuse_decision: wrap
        rationale: "Reuse authenticated list/resolve/dismiss DTO and error-mapping shape while binding the narrow AuthorLinkService."
      - capability: "Existing author merge handler"
        existing_source: "crates/livrarr-handlers/src/author.rs:274-287"
        reuse_decision: reuse
        rationale: "The server-side merge door already calls AuthorService::merge and remains the UI target."
      - capability: "Existing author update handler"
        existing_source: "crates/livrarr-handlers/src/author.rs:195-240"
        reuse_decision: rewrite
        rationale: "Keep monitor field validation but remove generic grKey mutation; new route and name actions use dedicated endpoints."
    notes:
      - "DELETE crates/livrarr-handlers/src/work.rs:306 author_similarity >= 0.90 route mutation."
      - "DELETE crates/livrarr-handlers/src/author.rs:119 author_similarity >= 0.90 route mutation."
      - "DELETE crates/livrarr-handlers/src/series.rs:119 author_similarity >= 0.90 route mutation."
      - "Remove olKey/grKey/hcKey mutation fields from generic author update DTOs; dedicated classified routes own all route changes."
      - "At Add-box, standalone add-author, and manual-import explicit-selection branches, parse the raw provider/value through AuthorRouteKey::parse before invoking AuthorLinkService::attach_selected_route with AuthContext.user.id and the converged author id; malformed input never reaches the repository."
    public_api:
      functions:
        - name: "GET /api/v1/author-link-review"
          inputs:
            - { name: auth, type: AuthContext }
          output: "Json<Vec<AuthorLinkReviewResponse>>"
          errors: [Unauthorized, Internal]
          pseudocode:
            - "Require authentication and call list_review with auth.user.id."
            - "Map every domain review row through the compile-wall-safe narrow author-view capability and candidate DTO mapping, including primary/alias verdict evidence, top-work preview, catalog state, and ReadarrNameGuardFailed reason."
            - "Return JSON; map database/service failure to Internal."
          call_annotations:
            - { call: "AuthorLinkService::list_review", type: NEW, target: "AuthorLinkService::list_review(UserId)" }
            - { call: "AuthorViewService::route_view", type: NEW, target: "livrarr_domain::services::AuthorViewService narrow trait method" }
          tdd_directives:
            - "GET through the real Axum router backed by real in-memory SqliteDb; pin auth rejection, user isolation, route provenance, all amended candidate evidence fields/states, readarr_name_guard_failed serialization, non-Tier2 catalog omission, and badge mapping."

        - name: "POST /api/v1/author-link-review/{candidate_id}/pick"
          inputs:
            - { name: auth, type: AuthContext }
            - { name: candidate_id, type: i64 }
          output: "Json<AuthorRouteResponse>"
          errors: [Unauthorized, NotFound, Conflict, Internal]
          pseudocode:
            - "Require authentication and parse candidate_id from the path."
            - "Call pick_candidate with auth.user.id."
            - "Map NotFound, ownership/stale conflict, and database failure to the documented HTTP results."
            - "Return the canonical route DTO."
          call_annotations:
            - { call: "AuthorLinkService::pick_candidate", type: NEW, target: "AuthorLinkService::pick_candidate(UserId, i64)" }
          tdd_directives:
            - "POST through the real router/SqliteDb for success, tombstone re-pick, stale candidate, cross-user id, ownership conflict, and internal failure; assert no provider adapter call."

        - name: "POST /api/v1/author-link-review/{candidate_id}/dismiss"
          inputs:
            - { name: auth, type: AuthContext }
            - { name: candidate_id, type: i64 }
          output: StatusCode::NO_CONTENT
          errors: [Unauthorized, NotFound, Internal]
          pseudocode:
            - "Require authentication and parse candidate_id."
            - "Call dismiss_candidate with auth.user.id."
            - "Return 204 only after the transaction succeeds; map typed errors."
          call_annotations:
            - { call: "AuthorLinkService::dismiss_candidate", type: NEW, target: "AuthorLinkService::dismiss_candidate(UserId, i64)" }
          tdd_directives:
            - "POST through the real router/SqliteDb for current, stale, already-resolved, and cross-user candidates; assert routes and tombstones remain byte-for-byte unchanged."

        - name: "DELETE /api/v1/author/{author_id}/route/{route_id}"
          inputs:
            - { name: auth, type: AuthContext }
            - { name: author_id, type: AuthorId }
            - { name: route_id, type: i64 }
          output: StatusCode::NO_CONTENT
          errors: [Unauthorized, NotFound, Internal]
          pseudocode:
            - "Require authentication and parse author_id and route_id."
            - "Call remove_route with auth.user.id."
            - "Return 204 after the tombstone and enqueue commits; map typed errors."
          call_annotations:
            - { call: "AuthorLinkService::remove_route", type: NEW, target: "AuthorLinkService::remove_route(UserId, AuthorId, i64)" }
          tdd_directives:
            - "DELETE through the real router/SqliteDb for owned active, removed, wrong-author, and cross-user routes; assert a durable tombstone and due task."

        - name: "POST /api/v1/author/{author_id}/resolve"
          inputs:
            - { name: auth, type: AuthContext }
            - { name: author_id, type: AuthorId }
          output: StatusCode::ACCEPTED
          errors: [Unauthorized, NotFound, Internal]
          pseudocode:
            - "Require authentication and parse author_id."
            - "Call re_resolve to persist UserReResolve."
            - "Return 202 immediately after enqueue and never poll or await a provider."
          call_annotations:
            - { call: "AuthorLinkService::re_resolve", type: NEW, target: "AuthorLinkService::re_resolve(UserId, AuthorId)" }
          forbidden_behaviors:
            - "Never wait for OpenLibrary or return a final linking result."
          tdd_directives:
            - "POST through the real router while the real adapter seam is deliberately blocked; assert 202 and due progress arrive before the adapter is released."

        - name: "PUT /api/v1/author/{author_id}/name"
          inputs:
            - { name: auth, type: AuthContext }
            - { name: request, type: RenameAuthorRequest }
          output: "Json<AuthorResponse>"
          errors: [Unauthorized, NotFound, Validation, Internal]
          pseudocode:
            - "Require authentication, parse author_id, and validate a nonempty name payload."
            - "Call AuthorService::rename with auth.user.id."
            - "Call the narrow author-view capability and return the full route/name/link-state response."
