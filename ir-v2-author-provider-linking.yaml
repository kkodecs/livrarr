  - name: livrarr-server
    responsibility: "Compose the live service/gateway, gate startup, apply Readarr guarded evidence, register routes, and run the recurring bounded job."
    dependencies: [livrarr-domain, livrarr-http, livrarr-db, livrarr-external-data, livrarr-enrichment, livrarr-metadata, livrarr-jobs, livrarr-handlers]
    module_invariants:
      - "No request is served and no author-link worker is registered until legacy cutover verification is clean and route consumers are live."
      - "Readarr route attach and progress enqueue are independent, idempotent transactions after the converged author id is known."
    capability_survey:
      - capability: "Readarr parsed author identity"
        existing_source: "crates/livrarr-server/src/readarr_client.rs:220-233"
        reuse_decision: reuse
        rationale: "RdAuthor already carries author_name and foreign_author_id together; the latter is a Goodreads author id."
      - capability: "Readarr concurrency-safe batch author gate"
        existing_source: "crates/livrarr-server/src/readarr_import_workflow.rs:1616-1720"
        reuse_decision: wrap
        rationale: "Keep batch snapshot/adopt/create convergence, add pre-observation name snapshot, name retention, independent enqueue, and common guarded evidence."
      - capability: "Recurring job runner"
        existing_source: "crates/livrarr-server/src/jobs/mod.rs:82-143"
        reuse_decision: wrap
        rationale: "Register the new configured interval tick only after the serving gate and all route consumers are installed."
      - capability: "Production list trigger wiring"
        existing_source: "crates/livrarr-server/src/main.rs:373; crates/livrarr-server/src/state.rs:76"
        reuse_decision: rewrite
        rationale: "Replace both production NoOpBibliographyTrigger type/construction sites with the real author-link enqueue trigger; test-only no-ops may remain."
    # BRIEF-DRIFT: the capability survey's direct source check is correct: there are
    # two production NoOpBibliographyTrigger wiring sites, not four; router/test matches are test-only.
    notes:
      - "Readarr import exact order: resolve/create via shared gate; snapshot all associated names before recording the Readarr observation; parse id and build ProviderAuthorRef; common guard; Agreed through submit_evidence; Rejected through record_readarr_rejection; None only for unusable input; enqueue independently regardless of guard outcome."
    public_api:
      functions:
        - name: verify_author_link_cutover_before_serving
          inputs:
            - { name: db, type: "&SqliteDb" }
          output: "Result<AuthorRouteBackfillReport, StartupError>; ingest canonical legacy routes, verify zero missing/invalid values and progress rows, abort startup on any mismatch"
          errors: [StartupError]
          pseudocode:
            - "Run idempotent legacy route ingestion to exhaustion before binding the request listener."
            - "Call verify_cutover_ready."
            - "If missing_routes, invalid_values, or missing_progress_rows is nonzero, return StartupError with the report and do not start handlers/jobs."
            - "Otherwise return the clean report and mark author-link consumer cutover eligible."
          call_annotations:
            - { call: "AuthorLinkDb::ingest_legacy_routes", type: NEW, target: "AuthorLinkDb::ingest_legacy_routes()" }
            - { call: "AuthorLinkDb::verify_cutover_ready", type: NEW, target: "AuthorLinkDb::verify_cutover_ready()" }
          postconditions:
            - "A successful return proves route-only consumers have complete canonical backing."
          tdd_directives:
            - "Boot the real server startup path from clean and defective migration-077 SQLite fixtures; assert listener/job registration occurs only for the clean report."

        - name: author_link_sweep_tick
          inputs:
            - { name: state, type: AppState }
            - { name: cancel, type: CancellationToken }
          output: "Result<(), String>; registered/enabled only after cutover verification and all route consumers are live"
          errors: [JobError]
          pseudocode:
            - "Return without work when deployment config disables the sweep."
            - "Read configured batch size, lease duration, retry durations, jitter window, and recurrence interval."
            - "Call run_due with the configured batch and cancellation token."
            - "Log the persisted tick summary/error; allow the JobRunner cadence to schedule the next tick."
          call_annotations:
            - { call: "AuthorLinkWorkflow::run_due", type: NEW, target: "AuthorLinkWorkflow::run_due(u32, CancellationToken)" }
            - { call: "tracing::info", type: LIBRARY, library: "tracing", target: "tracing" }
            - { call: "tracing::warn", type: LIBRARY, library: "tracing", target: "tracing" }
          preconditions:
            domain_state:
              - "verify_author_link_cutover_before_serving succeeded and all route consumers are active."
          forbidden_behaviors:
            - "Never register before cutover, use a hardcoded retry duration, or run one library-sized transaction."
          tdd_directives:
            - "Start the real JobRunner/server state against real SQLite with enabled/disabled config and cancellation; assert configured batch/interval, post-gate registration, resumable rows, and no pre-gate tick."

        - name: readarr_author_route_evidence
          inputs:
            - { name: rd_author, type: "&RdAuthor" }
            - { name: pre_observation_associated_names, type: "&[String]" }
          output: "Option<AuthorRouteGuardResult>; calls guard_author_route; None only for a missing/empty/invalid id or unusable name; Some preserves both Agreed and Rejected"
          errors: []
          pseudocode:
            - "Trim foreign_author_id; return None when missing or empty."
            - "Parse it through AuthorRouteKey::parse for Goodreads; return None and emit an invalid-id diagnostic when malformed, zero, or overflowed."
            - "Trim rd_author.author_name; return None when no usable name exists."
            - "Build ProviderAuthorRef with the parsed Goodreads key, Readarr name, and no role."
            - "Call guard_author_route with pre_observation_associated_names, no evidence work id, and source ReadarrImport."
            - "Return Some with the unchanged Agreed or Rejected guard result; never construct either capability locally."
            - "At the import door, send Agreed to submit_evidence and Rejected to record_readarr_rejection; record the Readarr observation only after the snapshot, and enqueue independently for every outcome including None."
          call_annotations:
            - { call: "str::trim", type: STDLIB, target: "Rust str::trim" }
            - { call: "AuthorRouteKey::parse", type: NEW, target: "AuthorRouteKey::parse(Goodreads, &str)" }
            - { call: "guard_author_route", type: NEW, target: "guard_author_route(&[String], ProviderAuthorRef, None, ReadarrImport)" }
            - { call: "tracing::warn", type: LIBRARY, library: "tracing", target: "tracing" }
          forbidden_behaviors:
            - "Never add the Readarr observation before snapshotting adopted-author names, fetch Goodreads confirmation, write a scalar key, or bypass the common route core."
          decisions:
            - { key: "readarr_guard_seam", value: "snapshot-before-observe with Option<AuthorRouteGuardResult>; Agreed -> submit_evidence, Rejected -> record_readarr_rejection, None -> retain name/enqueue only", rationale: "The amended signature prevents Readarr self-proof and preserves every computed non-Agree verdict through the opaque claimless persistence seam without widening route-write authority." }
          tdd_directives:
            - "Drive the real Readarr batch helper and real SqliteDb for created/adopted authors, snapshot-before-observe self-proof prevention, valid/empty/malformed/overflow ids, Agreed/Rejected/None splits, all non-Agree verdicts, idempotent failed candidates, concurrent repeats, tombstone, ownership, and independent enqueue/route/rejection transactions."

