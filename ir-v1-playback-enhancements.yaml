metadata:
  feature: playback-enhancements
  stage: v1-structural
  spec_ref: spec-playback-enhancements.md
  version: 1

system_architecture:
  components:
    - name: livrarr-domain
      description: New domain types (AudiobookChapter, Bookmark), extended PlaybackProgress, new service traits (ChapterDb, BookmarkDb), extended PlaybackProgressDb
      type: library
    - name: livrarr-db
      description: SQLite implementations for chapter, bookmark, and extended progress persistence. Three new migrations.
      type: database
    - name: livrarr-tagwrite
      description: New chapter extraction function for M4B files (reads MP4 atoms for Nero/QuickTime chapters)
      type: library
    - name: livrarr-library
      description: Extended import pipeline — calls chapter extraction after M4B import. Extended FileService impl to handle finished_at lifecycle.
      type: library
    - name: livrarr-handlers
      description: New chapter and bookmark endpoints. Extended progress handlers. Modified workfile routes.
      type: service
    - name: livrarr-server
      description: Wire new services into AppState. Add chapter backfill job to startup. Extended router.
      type: service
    - name: frontend
      description: AudioPlayer chapter UI, dual progress bars, bookmarks. EpubReader bookmarks + dark mode fix. WorksPage progress overlay + mobile icons. WorkDetailPage dual progress.
      type: frontend

  connections:
    - from: livrarr-handlers
      to: livrarr-domain
      protocol: in-process
      description: Handlers call service traits defined in domain
    - from: livrarr-library
      to: livrarr-tagwrite
      protocol: in-process
      description: Import pipeline calls chapter extraction after M4B import
    - from: livrarr-library
      to: livrarr-db
      protocol: in-process
      description: FileService impl delegates to Db traits
    - from: livrarr-server
      to: livrarr-library
      protocol: in-process
      description: AppState wires LiveFileService, LiveChapterService, LiveBookmarkService
    - from: livrarr-server
      to: livrarr-db
      protocol: SQL
      description: Direct DB access for backfill job (server-only startup task)
    - from: frontend
      to: livrarr-handlers
      protocol: HTTP
      description: REST API calls for progress, chapters, bookmarks

  deployment:
    topology: single-process
    notes: All backend changes are in the existing Rust binary. Frontend is a React SPA served as static files.

languages:
  - language: Rust
    version: "1.82+"
    usage: primary backend
  - language: TypeScript
    version: "5.x"
    usage: frontend (React SPA)

frameworks:
  - name: axum
    version: "0.8"
    usage: HTTP routing + handlers
  - name: React
    version: "19"
    usage: frontend framework
  - name: sqlx
    version: "0.8"
    usage: SQLite async queries + migrations

approved_libraries:
  # Existing — already in workspace
  - name: mp4ameta
    version: "0.13"
    usage: >
      M4B tag reading/writing (existing) AND chapter extraction (NEW).
      Supports both Nero chapters (chapter_list()) and QuickTime chapter tracks (chapter_track())
      via ReadConfig options. No additional MP4 parsing library needed.
  - name: chrono
    version: workspace
    usage: datetime handling (existing)
  - name: serde/serde_json
    version: workspace
    usage: serialization (existing)
  - name: tokio
    version: workspace
    usage: async runtime (existing)
  - name: tracing
    version: "0.1"
    usage: logging (existing)
  - name: sqlx
    version: "0.8"
    usage: SQLite (existing)
  - name: thiserror
    version: workspace
    usage: error types (existing)

  # Frontend — existing
  - name: react-reader (epubjs-react-wrapper)
    version: existing
    usage: EPUB rendering
  - name: "@radix-ui/react-popover"
    version: existing
    usage: popovers (sleep timer, settings)

modules:
  # ═══════════════════════════════════════════
  # BACKEND MODULES
  # ═══════════════════════════════════════════

  - name: domain-types
    responsibility: Define new domain types and extend existing ones for chapters, bookmarks, and progress lifecycle
    dependencies: []
    public_api:
      types:
        - kind: struct
          name: AudiobookChapter
          fields:
            - name: id
              type: i64
              description: Primary key
            - name: library_item_id
              type: LibraryItemId
              description: FK to library_items
            - name: chapter_index
              type: i32
              description: 0-based position in chapter list
            - name: title
              type: String
              description: Chapter title (fallback "Chapter N" if empty)
            - name: start_time_secs
              type: f64
              description: Start time in seconds from file beginning
            - name: end_time_secs
              type: f64
              description: End time (next chapter start or file duration)

        - kind: struct
          name: Bookmark
          fields:
            - name: id
              type: i64
              description: Primary key
            - name: user_id
              type: UserId
              description: Owner (scoped per user)
            - name: work_id
              type: WorkId
              description: Associated work
            - name: library_item_id
              type: LibraryItemId
              description: Associated library item
            - name: media_type
              type: MediaType
              description: ebook or audiobook
            - name: position
              type: String
              description: CFI string (epub) or seconds as string (audio)
            - name: sort_key
              type: f64
              description: Sortable position (progress_pct for epub, seconds for audio)
            - name: name
              type: String
              description: User-visible name (auto-generated, editable)
            - name: chapter_title
              type: Option<String>
              description: Chapter context at creation time (static, not updated on re-import)
            - name: paired_bookmark_id
              type: Option<i64>
              description: Self-referencing FK for future KASH pairing (ON DELETE SET NULL)
            - name: created_at
              type: DateTime<Utc>
              description: Creation timestamp

        # Extended existing type
        - kind: struct
          name: PlaybackProgress
          fields:
            - name: id
              type: i64
              description: Primary key (existing)
            - name: user_id
              type: UserId
              description: Owner (existing)
            - name: library_item_id
              type: LibraryItemId
              description: FK to library_items (existing)
            - name: position
              type: String
              description: CFI or seconds (existing)
            - name: progress_pct
              type: f64
              description: 0.0–1.0 (existing)
            - name: finished_at
              type: Option<DateTime<Utc>>
              description: "NEW — set when progress_pct >= 0.98, cleared when < 0.95"
            - name: updated_at
              type: DateTime<Utc>
              description: Last update (existing)

        # Extended existing LibraryItem struct (add to livrarr-domain/src/lib.rs)
        - kind: struct
          name: LibraryItem
          fields:
            - name: duration_seconds
              type: Option<f64>
              description: "NEW — file-parsed media duration. Set at import for audiobooks."
            - name: chapter_scan_status
              type: Option<String>
              description: "NEW — 'scanned' | 'no_chapters' | 'parse_error' | NULL (not yet scanned)"

      functions: []

  - name: db-chapters
    responsibility: SQLite persistence for audiobook chapters (CRUD, bulk replace on re-import)
    dependencies: [domain-types]
    public_api:
      types: []
      functions:
        - name: get_chapters
          inputs:
            - name: library_item_id
              type: LibraryItemId
          output: "Result<Vec<AudiobookChapter>, DbError>"
          errors: [DbError]
          description: Get all chapters for a library item, ordered by start_time_secs ascending

        - name: replace_chapters
          inputs:
            - name: library_item_id
              type: LibraryItemId
            - name: chapters
              type: "&[AudiobookChapter]"
          output: "Result<(), DbError>"
          errors: [DbError]
          description: Delete existing chapters for item and insert new ones (atomic, within transaction)

        - name: has_chapters
          inputs:
            - name: library_item_id
              type: LibraryItemId
          output: "Result<bool, DbError>"
          errors: [DbError]
          description: Check if chapters exist for a library item (used by backfill)

        - name: list_unscanned_audiobook_items
          inputs: []
          output: "Result<Vec<(LibraryItemId, String)>, DbError>"
          errors: [DbError]
          description: >
            List library items where chapter_scan_status IS NULL AND media_type = 'audiobook'.
            Returns (id, path) tuples for backfill. Excludes ebooks and already-scanned items.
            Caller filters by file extension (.m4b/.m4a) before attempting mp4ameta parsing.

  - name: db-bookmarks
    responsibility: SQLite persistence for bookmarks (CRUD, user-scoped, sorted by position)
    dependencies: [domain-types]
    public_api:
      types: []
      functions:
        - name: list_bookmarks
          inputs:
            - name: user_id
              type: UserId
            - name: library_item_id
              type: LibraryItemId
          output: "Result<Vec<Bookmark>, DbError>"
          errors: [DbError]
          description: List bookmarks for a user+item, ordered by sort_key ascending

        - name: create_bookmark
          inputs:
            - name: bookmark
              type: "&Bookmark"
          output: "Result<Bookmark, DbError>"
          errors: [DbError]
          description: Insert a new bookmark, return with generated id

        - name: rename_bookmark
          inputs:
            - name: user_id
              type: UserId
            - name: bookmark_id
              type: i64
            - name: name
              type: "&str"
          output: "Result<(), DbError>"
          errors: [DbError]
          description: Rename a bookmark (user-scoped — fails if wrong user)

        - name: delete_bookmark
          inputs:
            - name: user_id
              type: UserId
            - name: bookmark_id
              type: i64
          output: "Result<(), DbError>"
          errors: [DbError]
          description: Delete a bookmark (user-scoped). ON DELETE SET NULL on paired_bookmark_id unpairs the partner.

  - name: db-progress-extended
    responsibility: Extend existing PlaybackProgressDb with finished_at lifecycle
    dependencies: [domain-types]
    public_api:
      types: []
      functions:
        - name: upsert_progress
          inputs:
            - name: user_id
              type: UserId
            - name: library_item_id
              type: LibraryItemId
            - name: position
              type: "&str"
            - name: progress_pct
              type: f64
          output: "Result<(), DbError>"
          errors: [DbError]
          description: >
            MODIFIED — now also manages finished_at hysteresis:
            SET finished_at = CASE
              WHEN pct >= 0.98 AND finished_at IS NULL THEN now (transition only, don't overwrite)
              WHEN pct < 0.95 AND finished_at IS NOT NULL THEN NULL (clear on backward seek)
              ELSE finished_at (no change)
            END.
            Guard for non-finite audiobook duration: when media_type = 'audiobook' AND
            duration_seconds is NULL or non-finite, skip lifecycle (frontend can't compute
            meaningful progress_pct from currentTime/duration). Ebooks always execute the
            lifecycle — they don't use duration_seconds; progress_pct comes directly from
            epub.js location.start.percentage.

        - name: get_progress_for_items
          inputs:
            - name: user_id
              type: UserId
            - name: library_item_ids
              type: "&[LibraryItemId]"
          output: "Result<Vec<PlaybackProgress>, DbError>"
          errors: [DbError]
          description: "NEW — batch fetch progress for multiple items (used by works list to populate LibraryItemResponse.progress_pct)"

  - name: chapter-extraction
    responsibility: Parse M4B files for chapter metadata using mp4ameta (chapter_track + chapter_list)
    dependencies: []
    public_api:
      types:
        - kind: struct
          name: ExtractedChapter
          fields:
            - name: title
              type: String
              description: Chapter title (may be empty — caller normalizes)
            - name: start_time_secs
              type: f64
              description: Chapter start in seconds
        - kind: struct
          name: ChapterExtractionResult
          fields:
            - name: chapters
              type: Vec<ExtractedChapter>
              description: Extracted chapters, sorted by start_time_secs ascending. Empty if none found.
            - name: duration_secs
              type: Option<f64>
              description: File duration in seconds (from mp4ameta Tag::duration). Used for last chapter end_time.
      functions:
        - name: extract_m4b_chapters
          inputs:
            - name: path
              type: "&Path"
          output: "Result<ChapterExtractionResult, ChapterExtractionError>"
          errors: [ChapterExtractionError]
          description: >
            Read M4B file using mp4ameta::Tag with ReadConfig (read_chapter_track=true,
            read_chapter_list=true, read_image_data=false for performance). Check chapter_track()
            first (QuickTime, precedence), then chapter_list() (Nero). Returns chapters sorted by
            start_time_secs ascending plus file duration from Tag::duration(). Filters out
            non-monotonic/out-of-range entries with tracing::warn.

        - kind: enum
          name: ChapterExtractionError
          variants:
            - name: IoError
              description: File not found or read error (transient — retryable)
            - name: ParseError
              description: Corrupt or unparseable MP4 container (terminal — not retried)

  - name: import-chapter-hook
    responsibility: Hook chapter extraction into the import pipeline for M4B files
    dependencies: [chapter-extraction, db-chapters]
    public_api:
      types: []
      functions:
        - name: extract_and_store_chapters
          inputs:
            - name: library_item_id
              type: LibraryItemId
            - name: path
              type: "&Path"
            - name: db
              type: "&D"
          output: "Result<(), anyhow::Error>"
          errors: []
          description: >
            Called after M4B file import. Extracts chapters, normalizes titles (empty → "Chapter N"),
            computes end_time_secs (next start or file duration), stores via replace_chapters.
            Also persists duration_secs on the library_items row for the LibraryItemResponse API.
            Sets chapter_scan_status: 'scanned' (chapters found), 'no_chapters' (valid file, no
            chapters), or 'parse_error' (corrupt file — terminal). IoError propagates (transient,
            chapter_scan_status stays NULL for retry).

  - name: service-chapters
    responsibility: Domain service trait for chapter operations
    dependencies: [domain-types]
    public_api:
      types: []
      functions:
        - name: get_chapters
          inputs:
            - name: user_id
              type: UserId
            - name: library_item_id
              type: LibraryItemId
          output: "Result<Vec<AudiobookChapter>, FileServiceError>"
          errors: [FileServiceError]
          description: Get chapters for a library item (validates user owns the item first)

  - name: service-bookmarks
    responsibility: Domain service trait for bookmark CRUD
    dependencies: [domain-types]
    public_api:
      types: []
      functions:
        - name: list_bookmarks
          inputs:
            - name: user_id
              type: UserId
            - name: library_item_id
              type: LibraryItemId
          output: "Result<Vec<Bookmark>, FileServiceError>"
          errors: [FileServiceError]
          description: List bookmarks for user+item, sorted by sort_key

        - name: create_bookmark
          inputs:
            - name: user_id
              type: UserId
            - name: library_item_id
              type: LibraryItemId
            - name: position
              type: "&str"
            - name: sort_key
              type: f64
            - name: name
              type: "&str"
            - name: chapter_title
              type: "Option<&str>"
          output: "Result<Bookmark, FileServiceError>"
          errors: [FileServiceError]
          description: Create a bookmark (validates user owns the item)

        - name: rename_bookmark
          inputs:
            - name: user_id
              type: UserId
            - name: bookmark_id
              type: i64
            - name: name
              type: "&str"
          output: "Result<(), FileServiceError>"
          errors: [FileServiceError]
          description: Rename a bookmark

        - name: delete_bookmark
          inputs:
            - name: user_id
              type: UserId
            - name: bookmark_id
              type: i64
          output: "Result<(), FileServiceError>"
          errors: [FileServiceError]
          description: Delete a bookmark

  - name: handler-chapters
    responsibility: HTTP endpoints for chapter listing
    dependencies: [service-chapters]
    public_api:
      types: []
      functions:
        - name: get_chapters
          inputs:
            - name: library_item_id
              type: Path<i64>
            - name: auth
              type: AuthContext
          output: "Result<Json<Vec<ChapterResponse>>, ApiError>"
          errors: [ApiError]
          description: "GET /api/v1/workfile/{id}/chapters — returns chapter list for an audiobook"

  - name: handler-bookmarks
    responsibility: HTTP endpoints for bookmark CRUD
    dependencies: [service-bookmarks]
    public_api:
      types:
        - kind: struct
          name: CreateBookmarkRequest
          fields:
            - name: position
              type: String
              description: CFI or seconds
            - name: sort_key
              type: f64
              description: Sortable position value
            - name: name
              type: String
              description: Auto-generated or user-provided name
            - name: chapter_title
              type: Option<String>
              description: Chapter context
        - kind: struct
          name: RenameBookmarkRequest
          fields:
            - name: name
              type: String
              description: New name
      functions:
        - name: list_bookmarks
          inputs:
            - name: library_item_id
              type: Path<i64>
            - name: auth
              type: AuthContext
          output: "Result<Json<Vec<BookmarkResponse>>, ApiError>"
          errors: [ApiError]
          description: "GET /api/v1/workfile/{id}/bookmarks"

        - name: create_bookmark
          inputs:
            - name: library_item_id
              type: Path<i64>
            - name: auth
              type: AuthContext
            - name: body
              type: Json<CreateBookmarkRequest>
          output: "Result<Json<BookmarkResponse>, ApiError>"
          errors: [ApiError]
          description: "POST /api/v1/workfile/{id}/bookmarks"

        - name: rename_bookmark
          inputs:
            - name: bookmark_id
              type: Path<i64>
            - name: auth
              type: AuthContext
            - name: body
              type: Json<RenameBookmarkRequest>
          output: "Result<Json<()>, ApiError>"
          errors: [ApiError]
          description: "PATCH /api/v1/bookmarks/{id}"

        - name: delete_bookmark
          inputs:
            - name: bookmark_id
              type: Path<i64>
            - name: auth
              type: AuthContext
          output: "Result<Json<()>, ApiError>"
          errors: [ApiError]
          description: "DELETE /api/v1/bookmarks/{id}"

  - name: backfill-job
    responsibility: One-time async job to extract chapters from existing M4B library items
    dependencies: [db-chapters, chapter-extraction, import-chapter-hook]
    public_api:
      types: []
      functions:
        - name: run_chapter_backfill
          inputs:
            - name: db
              type: "&SqliteDb"
          output: "Result<(), anyhow::Error>"
          errors: []
          description: >
            Queries M4B library items where chapter_scan_status IS NULL AND media_type = 'audiobook'
            AND path ends with .m4b or .m4a (excludes MP3/FLAC audiobooks that aren't MP4 containers).
            For each: extract chapters, store results, persist duration_seconds from ChapterExtractionResult.
            Set chapter_scan_status: 'scanned' (chapters found), 'no_chapters' (valid M4B, no chapters),
            'parse_error' (terminal corrupt). Leave NULL on transient IoError for retry.
            Non-M4B audiobooks (MP3/FLAC) get chapter_scan_status = 'no_chapters' immediately.
            No global flag needed — the query itself returns only unscanned items.

  - name: works-list-progress
    responsibility: Extend work service to return per-item progress data for the works list
    dependencies: [db-progress-extended]
    public_api:
      types:
        - kind: struct
          name: ItemProgress
          fields:
            - name: library_item_id
              type: LibraryItemId
              description: Which library item
            - name: progress_pct
              type: f64
              description: 0.0–1.0
            - name: finished_at
              type: Option<DateTime<Utc>>
              description: Completion timestamp if >= 0.98
      functions:
        - name: get_progress_for_items
          inputs:
            - name: user_id
              type: UserId
            - name: library_item_ids
              type: "&[LibraryItemId]"
          output: "Result<Vec<ItemProgress>, FileServiceError>"
          errors: [FileServiceError]
          description: >
            Returns domain-level progress data. Handlers map this to LibraryItemResponse fields.
            This is a service-layer method — handlers call it and do the DTO mapping themselves,
            preserving the compile wall (handlers never touch DB types).

  # ═══════════════════════════════════════════
  # FRONTEND MODULES
  # ═══════════════════════════════════════════

  - name: fe-progress-overlay
    responsibility: Progress bar overlay on work cards (poster, table, overview) + text badge
    dependencies: []
    public_api:
      types: []
      functions:
        - name: ProgressBar
          inputs:
            - name: progressPct
              type: "number | null"
          output: React component
          errors: []
          description: Thin bar at bottom of cover area. Hidden when null/0.

        - name: ProgressBadge
          inputs:
            - name: progressPct
              type: "number | null"
            - name: mediaType
              type: MediaType
            - name: durationSeconds
              type: "number | null"
          output: React component
          errors: []
          description: "Format B text: percentage for ebook, time remaining for audiobook"

  - name: fe-mobile-icons
    responsibility: Always-visible read/listen pill on touch devices
    dependencies: []
    public_api:
      types: []
      functions:
        - name: MediaOverlay
          inputs:
            - name: work
              type: WorkDetailResponse
          output: React component
          errors: []
          description: "MODIFIED — detects pointer:coarse via matchMedia, shows pill vs hover overlay"

  - name: fe-chapter-player
    responsibility: Chapter navigation UI in AudioPlayer (chapter row, dual progress bars, chapter panel, prev/next)
    dependencies: []
    public_api:
      types: []
      functions:
        - name: ChapterBar
          inputs: []
          output: React component
          errors: []
          description: Chapter title row + list toggle button

        - name: ChapterProgressBar
          inputs: []
          output: React component
          errors: []
          description: Thin non-interactive bar showing progress within current chapter

        - name: ChapterPanel
          inputs: []
          output: React component
          errors: []
          description: "Slide-in panel (desktop) / bottom sheet (mobile) with chapter list"

  - name: fe-bookmarks
    responsibility: Bookmark UI for both ebook and audiobook
    dependencies: []
    public_api:
      types: []
      functions:
        - name: BookmarkPanel
          inputs: []
          output: React component
          errors: []
          description: "Bookmark list panel with create/jump/rename/delete interactions"

        - name: BookmarkButton
          inputs: []
          output: React component
          errors: []
          description: "Toolbar button — tap creates bookmark at current position"

  - name: fe-sleep-timer
    responsibility: Extended sleep timer with end-of-chapter option
    dependencies: [fe-chapter-player]
    public_api:
      types: []
      functions:
        - name: SleepTimerPopover
          inputs: []
          output: React component
          errors: []
          description: "MODIFIED — adds 'End of chapter' as first option when chapters exist"

  - name: fe-darkmode-fix
    responsibility: Fix ebook reader dark mode frame/chrome
    dependencies: []
    public_api:
      types: []
      functions: []

shared_types:
  - kind: struct
    name: ChapterResponse
    fields:
      - name: id
        type: i64
      - name: chapter_index
        type: i32
      - name: title
        type: String
      - name: start_time_secs
        type: f64
      - name: end_time_secs
        type: f64

  - kind: struct
    name: BookmarkResponse
    fields:
      - name: id
        type: i64
      - name: library_item_id
        type: i64
      - name: media_type
        type: String
      - name: position
        type: String
      - name: sort_key
        type: f64
      - name: name
        type: String
      - name: chapter_title
        type: Option<String>
      - name: paired_bookmark_id
        type: Option<i64>
      - name: created_at
        type: String

  - kind: struct
    name: LibraryItemResponse
    note: "Wire format uses camelCase via serde(rename_all = camelCase)"
    fields:
      - name: id
        type: i64
      - name: path
        type: String
      - name: mediaType
        type: MediaType
      - name: fileSize
        type: i64
      - name: importedAt
        type: String
      - name: progressPct
        type: "Option<f64>"
        description: "NEW — 0.0–1.0, null when no progress. Wire: progressPct"
      - name: durationSeconds
        type: "Option<f64>"
        description: "NEW — library_item.duration_seconds ?? work.duration_seconds. File-parsed preferred, work-level metadata fallback. Wire: durationSeconds"
      - name: finishedAt
        type: "Option<String>"
        description: "NEW — ISO 8601 timestamp when progress >= 0.98, null otherwise. Wire: finishedAt. Frontend shows 'Complete' when non-null regardless of progressPct (hysteresis)."

dependency_graph:
  # Backend
  - source: livrarr-handlers
    target: livrarr-domain
  - source: livrarr-library
    target: livrarr-domain
  - source: livrarr-library
    target: livrarr-db
  - source: livrarr-library
    target: livrarr-tagwrite
  - source: livrarr-db
    target: livrarr-domain
  - source: livrarr-tagwrite
    target: livrarr-domain
  - source: livrarr-server
    target: livrarr-domain
  - source: livrarr-server
    target: livrarr-db
  - source: livrarr-server
    target: livrarr-library
  - source: livrarr-server
    target: livrarr-handlers
  - source: livrarr-server
    target: livrarr-tagwrite

  # Compile wall preserved — handlers does NOT depend on db, tagwrite, library, etc.

  # Frontend
  - source: frontend
    target: livrarr-handlers

# ═══════════════════════════════════════════
# DATABASE MIGRATIONS
# ═══════════════════════════════════════════
migrations:
  - number: "048"
    name: add_audiobook_chapters
    description: >
      CREATE TABLE audiobook_chapters (
        id INTEGER PRIMARY KEY,
        library_item_id INTEGER NOT NULL REFERENCES library_items(id) ON DELETE CASCADE,
        chapter_index INTEGER NOT NULL,
        title TEXT NOT NULL,
        start_time_secs REAL NOT NULL,
        end_time_secs REAL NOT NULL,
        UNIQUE(library_item_id, chapter_index)
      );
      CREATE INDEX idx_chapters_item ON audiobook_chapters(library_item_id);

  - number: "049"
    name: add_bookmarks
    description: >
      CREATE TABLE bookmarks (
        id INTEGER PRIMARY KEY,
        user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        work_id INTEGER NOT NULL REFERENCES works(id) ON DELETE CASCADE,
        library_item_id INTEGER NOT NULL REFERENCES library_items(id) ON DELETE CASCADE,
        media_type TEXT NOT NULL,
        position TEXT NOT NULL,
        sort_key REAL NOT NULL,
        name TEXT NOT NULL,
        chapter_title TEXT,
        paired_bookmark_id INTEGER REFERENCES bookmarks(id) ON DELETE SET NULL,
        created_at TEXT NOT NULL DEFAULT (strftime('%Y-%m-%dT%H:%M:%SZ', 'now'))
      );
      CREATE INDEX idx_bookmarks_user_item ON bookmarks(user_id, library_item_id);
      CREATE INDEX idx_bookmarks_paired ON bookmarks(paired_bookmark_id);

  - number: "050"
    name: add_progress_finished_at_and_item_duration
    description: >
      ALTER TABLE playback_progress ADD COLUMN finished_at TEXT;
      ALTER TABLE library_items ADD COLUMN duration_seconds REAL;
      ALTER TABLE library_items ADD COLUMN chapter_scan_status TEXT;

