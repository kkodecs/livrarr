data_flow:
  sources:
    - entity: AuthorRoute
      origin: keyed provider work records
      description: Tier 1 walks every OL/GR/HC key on Confirmed or Provisional works and accepts only associated contributors whose name reaches author_verdict Agree.
    - entity: AuthorRoute
      origin: user-input
      description: Candidate picks and explicit tombstone re-picks are user-sovereign; a re-pick is the only operation that clears a tombstone.
    - entity: AuthorRoute
      origin: Readarr API
      description: Readarr foreignAuthorId is normalized as a Goodreads author route and still passes the common author-name guard.
    - entity: AuthorRoute
      origin: migration
      description: Existing authors.ol_key/gr_key values are copied as active legacy-unguarded routes without removing or changing the legacy columns.
    - entity: AuthorNameVariant
      origin: user-input
      description: User entry, rename, and display selection are persisted as User variants.
    - entity: AuthorNameVariant
      origin: provider/import payload
      description: The infallible enrichment observer records in-hand provider names including GB; road fetches and every import/creation door record their own associated names. Candidate names remain in review until selected.
    - entity: AuthorLinkCandidate
      origin: OpenLibrary author search and catalog
      description: Tier 2 always parks; separate paced catalog pages provide Same-only title corroboration.
    - entity: AuthorLinkProgress
      origin: author creation, re-resolve, migration, fingerprint comparison, and recurring due-time
      description: create_author atomically ensures a progress row; bounded missing-row discovery repairs prior omissions, a changed settled-evidence fingerprint starts a new evidence generation, and each generation durably materializes one attempt per settled provider key.
  sinks:
    - entity: AuthorRoute
      destination: SQLite author_provider_routes
      description: Active routes, provenance upgrades, and removed tombstones share one durable row.
    - entity: AuthorNameVariant
      destination: SQLite author_name_variants and authors.name
      description: Variants are retained; the selected display is cascaded through the existing works.author_name/merge_generation mechanism.
    - entity: AuthorLinkCandidate
      destination: SQLite author_link_candidates and Review Authors UI
      description: Unsure, tombstoned, ownership-collision, and legacy-contradiction evidence remains user-visible.
    - entity: AuthorLinkProgress
      destination: SQLite author_link_progress and progress API
      description: Per-author cursor, lease, due time, evidence generation, error, and shadow-metric state plus author_link_key_attempts make the sweep resumable and honest under partial provider failure.
    - entity: AuthorRoute
      destination: Author monitor and series/bibliography consumers
      description: Monitor and bibliography union all active OL routes; series unions all active GR routes; each consumer deduplicates by its provider object key and no consumer reads or falls back to legacy columns.
  state_machines:
    - entity: AuthorRoute
      states: [absent, active_legacy, active_validated, removed]
      transitions:
        - { from: absent, to: active_legacy, trigger: numbered legacy ingestion migration }
        - { from: absent, to: active_validated, trigger: Tier-1 Agree, guarded Readarr evidence, or explicit user pick }
        - { from: active_legacy, to: active_validated, trigger: same route confirmed by Tier-1 evidence or explicit user pick }
        - { from: active_legacy, to: removed, trigger: explicit user removal }
        - { from: active_validated, to: removed, trigger: explicit user removal }
        - { from: removed, to: active_validated, trigger: explicit user re-pick only }
    - entity: AuthorLinkCandidate
      states: [pending, dismissed, picked, superseded]
      transitions:
        - { from: pending, to: dismissed, trigger: explicit user dismiss }
        - { from: pending, to: picked, trigger: explicit user pick }
        - { from: pending, to: superseded, trigger: fresher evidence generation replaces the review set }
        - { from: dismissed, to: pending, trigger: new evidence generation or explicit re-resolve }
    - entity: AuthorLinkProgress
      states: [queued, running, parked_no_settled_work, parked_no_evidence, needs_review, linked, retryable_failure]
      transitions:
        - { from: queued, to: running, trigger: lease-based worker claim }
        - { from: running, to: linked, trigger: at least one active route and no outstanding contradiction }
        - { from: running, to: needs_review, trigger: Tier-2 result, failed guard, tombstone, ownership collision, or legacy contradiction }
        - { from: running, to: parked_no_settled_work, trigger: Tier 3 finds no Confirmed/Provisional work }
        - { from: running, to: parked_no_evidence, trigger: settled work keys yield no agreeing contributor and Tier 2 yields no candidate }
        - { from: running, to: retryable_failure, trigger: one or more provider-key retries remain after all currently runnable sibling keys have been attempted }
        - { from: parked_no_settled_work, to: queued, trigger: recurring due-time after a work may have settled }
        - { from: parked_no_evidence, to: queued, trigger: recurring due-time or explicit re-resolve }
        - { from: needs_review, to: queued, trigger: explicit re-resolve or new work evidence }
        - { from: retryable_failure, to: queued, trigger: persisted backoff expires }
        - { from: linked, to: queued, trigger: settled-evidence fingerprint changed or display_name_dirty }
        - { from: parked_no_settled_work, to: queued, trigger: settled-evidence fingerprint changed }
    - entity: AuthorKeyAttempt
      states: [pending, running, succeeded, retryable, skipped_not_configured, skipped_permanent, parked_layout_drift]
      transitions:
        - { from: pending, to: running, trigger: owning author lease reaches this key }
        - { from: running, to: succeeded, trigger: provider response is processed and every contributor route/candidate commit completes }
        - { from: running, to: retryable, trigger: AuthorProviderError::Retryable with persisted key-local backoff }
        - { from: retryable, to: running, trigger: key-local next_attempt_at expires under a fresh author lease }
        - { from: running, to: skipped_not_configured, trigger: AuthorProviderError::NotConfigured }
        - { from: running, to: skipped_permanent, trigger: AuthorProviderError::Permanent }
        - { from: running, to: parked_layout_drift, trigger: AuthorProviderError::LayoutDrift }
        - { from: skipped_not_configured, to: pending, trigger: explicit re-resolve or a new evidence generation after configuration changes }
        - { from: skipped_permanent, to: pending, trigger: explicit re-resolve or a new evidence generation }
        - { from: parked_layout_drift, to: pending, trigger: explicit re-resolve or a new evidence generation after adapter repair }
  invariants:
    - Every automatic route acquisition enters AuthorLinkingCore and reaches apply_guarded_route only as an opaque AgreedAuthorRouteEvidence constructed by guard_author_route; the capability has no public constructor or Deserialize implementation. Grey, Abstain, Disagree, and caller-authored verdicts can never write a route.
    - Tier 2 never writes a route. Catalog overlap changes ordering/evidence only, and only title_verdict Same increments the count.
    - Tier 1 reads work identity but never calls work matching and never mutates work identity, CapturedIdentity, or IdentityStatus.
    - All provider keys on every Confirmed/Provisional work are materialized and walked per evidence generation; Pending, NeedsReview, Conflict, and NotFound works contribute no Tier-1 evidence.
    - Tier-1 provider errors are key-local. Retryable stores backoff and is revisited after later siblings; NotConfigured and Permanent are terminal skips for that generation; LayoutDrift is a visible key-local park. None rolls back an attached route/candidate or prevents later OL/GR/HC siblings from being processed.
    - Tier 2 waits only for an outstanding retryable OpenLibrary key. Goodreads and Hardcover retries/skips/layout drift never block Tier 2, a completed OpenLibrary attach, or monitoring eligibility; author-level RetryableFailure is a scheduling summary and never hides active routes.
    - After a Tier-1 pass, author progress is RetryableFailure when any current-generation key retry remains; otherwise it is NeedsReview for pending candidates, Linked for active routes, or proceeds through Tier 2/Tier 3 to a parked state. Terminal key skips and layout-drift diagnostics alone do not override that derivation.
    - There is no GR name-search tier. The old GR book-autocomplete comparison is retained only as a post-park, read-only metric and cannot produce candidates or writes.
    - Author routes are user-scoped, plural per provider, and monotonic under automation; no unique constraint assumes one OL route per person.
    - Every route value is parsed to AuthorRouteKey before comparison or persistence; uniqueness, ownership, tombstone lookup/clear, migration, merge, review picks, Readarr, and compatibility projections operate on canonical values only.
    - A removed route row is its own tombstone. Automatic evidence can only create a previously-removed candidate; only a user re-pick reactivates it.
    - A different route found beside an active legacy-unguarded route of the same provider parks as a legacy contradiction; neither route is automatically removed or replaced.
    - Linked means at least one active route of any provider. Monitorable means at least one active OpenLibrary route. NeedsReview takes badge precedence over Linked when a contradiction is pending.
    - 'Author monitoring eligibility is enforced by the server against active OpenLibrary routes and preserves exactly AuthorServiceError::Validation { field: "monitored", message: "cannot monitor author without OL linkage" } for both unlinked and GR/HC-only authors.'
    - The monitor DB surface returns one target per author with all active OL routes. The workflow unions every route feed by canonical OL work key before screening, notification, or add, so routes do not multiply report counts or actions.
    - Bibliography unions active OL route results by canonical OL work key; series unions active GR results by canonical Goodreads series key. Compatibility scalar fields are deterministic projections only.
    - Display ranking is User first, then GR/HC/GB/OL for English-or-undetermined and GB/HC/GR/OL for foreign-dominant; import/legacy names are fallback only. dominant_language ties or absence select English.
    - Display-name changes update authors.name and works.author_name and increment works.merge_generation, but never write works.normalized_author.
    - A newly observed distinct name atomically increments display_name_generation and makes the author immediately claimable through display_name_dirty even from a terminal progress state. A dirty-only claim performs the local rank/cascade first, makes no provider call, and does not increment evidence_generation or reset the Tier-1 cursor. It clears dirty only after the cascade commits and only if the generation still equals the claim snapshot; a concurrent observation stays dirty and due.
    - create_author and its progress-row insert share one transaction; concurrent creation convergence leaves exactly one author and at least one durable task.
    - A fixed deterministic fingerprint covers every sorted settled work id/status/provider-key tuple. Unchanged fingerprints skip provider I/O; changed fingerprints reset the road cursor/evidence generation and re-enter Tier 1.
    - New HTTP re-resolution returns Accepted after enqueue; it never waits for OpenLibrary.
    - New provider calls use the shared queue and existing user-agent profiles; background road calls use RequestPriority::Low.
    - Legacy key columns remain physically present for additive rollback safety but are frozen after ingestion and are not authoritative for consumers or writes.
    - Startup does not serve requests unless canonical backfill verification is clean. No post-cutover reader falls back to a legacy scalar, and the recurring worker is enabled only after verification and consumer cutover.
    - Upgrade acceptance starts from a real migration-077 fixture and exercises monitor, gate, bibliography, series, projections, remove/re-pick, merge, and restart through real SQLite/router doors.
    - No implementation outside livrarr-db contains SQL, and no handler contains link/matching/provider business logic.
