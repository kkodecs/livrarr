amendments:
  - date: 2026-07-28
    change: Add AuthorRoute to the canonical entity spine in livrarr-domain.
    reason: An author route is persisted, user-visible, provenance-bearing Author identity state with an active/removed lifecycle and tombstone invariant. F1 does not pre-generalize the concept; F2 decides whether work routes justify a later generic route amendment.
  - date: 2026-07-29
    change: "r4 design-stage amendments (A/B/C), PO-approved. A — Tier-2 candidate evidence: add AuthorCandidateCatalogState, OpenLibraryNameRole, AuthorCandidateAlternateNameEvidence; OpenLibraryAuthorCandidate gains alternate_names; AuthorLinkCandidate gains primary_name_verdict, alternate_name_evidence, top_work_preview, catalog_evidence_state; AuthorNameVariant gains open_library_role. B — rejected Readarr evidence: name the AuthorRouteGuardResult::Rejected payload as the opaque guard-constructed RejectedAuthorRouteEvidence, add AuthorLinkCandidateReason::ReadarrNameGuardFailed, add the claimless AuthorLinkWorkflow/AuthorLinkDb record_readarr_rejection pair, and change readarr_author_route_evidence to take a pre-observation name snapshot and return Option<AuthorRouteGuardResult>. C — retry timing: AuthorProviderError::Retryable carries a structured retry_not_before alongside its message."
    reason: "The design stage's own P2/P3/P4 rulings (build/design-176/architect/DESIGN-ANSWERS.md) require values the r3 structures cannot represent; the draftsman escalated rather than repairing silently, and the architect chair ruled AMEND on all three (build/design-176/architect/AMENDMENT-RULINGS.md). No new canonical spine entity (all value objects/capabilities), no works-table or settle-road surface, F1/F2 boundary intact. r3 is preserved byte-identical at build/contest-arch-176/architect-1/ir-v1-author-provider-linking.yaml."
  - date: 2026-07-29
    change: "r5 design-review fold amendments. F-002: HardcoverClient::fetch_work_authors gains LayoutDrift to its error set. F-006: add AuthorLinkService::attach_selected_route and AuthorLinkDb::attach_route_as_user — the explicit user-sovereign route attach for a UI-selected key that is not a persisted review candidate; it shares one private user-attach transaction with pick_candidate_as_user, so there are two UI entry shapes but one user-sovereign persistence standard."
    reason: "Design review r1 (xai) F-002 and F-006, both ruled ACCEPT by the architect chair (build/design-176/architect/REVIEW-RULINGS.md). F-002 is conformance to already-ratified contract FP-010, which requires Hardcover Tier-1 to degrade to a key-local NotConfigured skip or LayoutDrift park — the r4 error set could only report Permanent, losing the operator-visible re-resolvable park. F-006 replaces the disguised scalar ol_key write on the interactive add path with an explicit classified user operation, preserving REQ-004's exhaustive user-sovereign/keyed-evidence/road-guarded vocabulary. No new route type, provenance, table, entity, or handler-level SQL."
  - date: 2026-07-31
    change: "r6 close-out fold to as-built. Every row below is an already-ruled item transcribed after verification against source; none is a new decision. (a) livrarr-db gains CreateAuthorGateRequest and four U3/U6 trait methods the units added — AuthorLinkDb::create_or_adopt_author, ::load_progress, ::begin_evidence_generation, ::list_routes_for_view — plus AuthorNameVariantDb::record_author_observed_names and AuthorNameVariantDb::list_name_variants, the U6 name-variant list read seam. (b) AuthorDb gains converge_author_display_name, the AutomaticConvergence door into the one shared display-name cascade; RenameAuthorDbRequest keeps its four fields. (c) U9 surface: ProviderCredit replaces ProviderAuthorRef.role; AuthorLinkDb::complete_key_attempt takes authorial_credits_seen: u32; AuthorLinkDb::generation_authorial_credit_count and ::revoke_dismissals_and_replay are added; AuthorLinkCandidate gains revoked_at; AuthorRouteGuardResult gains UnlabeledMismatchDropped(DroppedAuthorCreditEvidence); identity_matching::dedupe_associated_names and crate-internal text_norm::contains_non_latin_letters are recorded. (d) approved_libraries gains unicode-script 0.5 and dev-only tracing-test 0.2, each PO-approved 2026-07-31, and the existing-dependencies-only row is corrected. (e) metadata gains design-supersession pointers to the U8 and U9 design documents."
    reason: "Ruling sources, one per row: (a) U3 handback PM ruling and BLOCKED-U5 §3 / BLOCKED-U6 §3, all recorded in build/design-176/DEV-UNITS.md — list_routes_for_view and list_name_variants are the two seams BLOCKED-U5 §3's ruling authorised together (DEV-UNITS.md:207-212: 'U6 adds it' plus 'U6 also adds a name-variant list read seam'), the second folded on the 2026-07-31 follow-up ruling to BLOCKED-IR-FOLD §2.2. (b) BLOCKED-U5 §1, ruled ACCEPTED and amending BLOCKED-U3 §4's earlier request for an origin field — a green exhaustive struct literal in test_author_link_db.rs made a fifth field impossible, so the classification moved to which trait door is entered while FP-017's one-cascade rule holds. (c) U9 unit, whose contract is DESIGN-U9-unlabeled-credit-gate.md r4 (PO gate 2026-07-31). (d) PO approval 2026-07-31 recorded in the U9 DEV-UNITS entry. (e) close-out packet PACKET-IR-FOLD.md. Two entries in (c) carry a scope note: AuthorRouteGuardResult::NonAuthorial/NonAuthorialProviderRef and AuthorLinkCandidate.evidence_work_id/evidence_work_title are U8 surface, added here only because writing the U9 arm/field into an otherwise stale enum and struct would have published a shape that is complete and wrong; see BLOCKED-IR-FOLD.md."

