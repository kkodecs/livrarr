data_flow:
  sources:
    - { entity: "Work",         origin: "lifecycle moments: add_fast created=true (REQ-001), delete road (REQ-006), merge (REQ-007), enrichment pass completion at run_unified_enrichment (REQ-002), identity door actions (REQ-008)" }
    - { entity: "LibraryItem",  origin: "file moments: manual/grab imports (REQ-003), tag passes (REQ-004), file deletions via every enumerated door (REQ-005)" }
    - { entity: "Grab",         origin: "existing grabbed/downloadFailed writers (payload migration only, REQ-013); backfill fact rows: grabs.grabbed_at/title/indexer/guid/status/import_error (REQ-010)" }
    - { entity: "HistoryDraft", origin: "typed constructors in livrarr-domain — the only sanctioned payload builder (REQ-013)" }
  sinks:
    - { entity: "HistoryEvent", destination: "history table via record_history → HistoryDb::create_history_event — the one write chokepoint (REQ-009); rows survive work deletion (ON DELETE SET NULL, 001_initial_schema.sql:216)" }
    - { entity: "HistoryEvent", destination: "existing read surfaces: GET /history (router.rs:391) for both UI pages + the secondary HistoryApi — with unknown kinds skipped at read (REQ-012) and rendered generically on version skew (REQ-011)" }
  state_machines: []
  invariants:
    - "Observer, never actor: a failed history write warns and returns; it never fails, blocks, or retries the host operation; no event for an operation that did not happen (REQ-009)."
    - "One moment, one event: composite delete = one workDeleted, no per-file events; materialize's in-enrichment tag write = tags_written flag on the enriched event, never a separate tag event; a dedup-hit add (created=false) writes nothing; a merge_deferred background attempt writes nothing (REQ-001/002/004/006)."
    - "Self-identifying payloads: every work-attached event carries work_title (work_author where sensible) under exactly those keys; grab-family `title` stays the RELEASE title (REQ-013)."
    - "History is append-only: no code path deletes or rewrites history rows; the backfill's idempotency is non-destructive; merge REPOINTS rows, never drops them (REQ-007/010)."
    - "Backfill honesty: synthesize only from persisted timestamps; every synthesized row carries backfilled: true; per-fact dedup (guid-exact for grabs; declared best-effort window for imported); completed pass never reruns; server stays responsive while it runs (REQ-010)."
    - "Robust reads: an unrecognized stored kind is skipped with a warning at list time and never fails the query; the typed EventType enum stays strict for writes (REQ-012)."
    - "Every event write is user-attributed from the owning entity (spec ST-010 — user_id NOT NULL on works/grabs/library_items); no global system user."

domain_entities:
  - Work
  - Grab
  - LibraryItem
  - HistoryEvent

