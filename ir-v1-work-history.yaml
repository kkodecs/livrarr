decisions:
  - id: "D-WRITE-PATH"
    title: "One write discipline: domain constructors → HistoryDraft → record_history (db) / HistoryService::record (handlers)"
    decision: >
      Typed per-kind constructors live in livrarr-domain (compile-wall-visible to every writer);
      the single observer-write helper record_history lives in livrarr-db beside the HistoryDb
      trait it consumes (a domain-resident generic helper is impossible — HistoryDb is a
      livrarr-db trait and domain depends on nothing). The two handler-crate doors write via ONE
      new method on the existing domain HistoryService trait, impl'd by LiveHistoryService.
      Rejected: (a) per-site serde_json::json! payloads (today's shape) — REQ-013's reserved keys
      become unenforceable across ~15 sites and the existing 4 sites already drifted three
      payload conventions; (b) writing identity events INSIDE the db-layer door methods
      (apply_review_candidate etc.) gated on AnchorSetter::User — puts human-readable payload
      composition in the persistence layer and couples REQ-008's user/system distinction to a
      parameter whose semantics can drift; the doors themselves know the action.
  - id: "D-ENRICH-HOME"
    title: "The REQ-002 writer lives at run_unified_enrichment's completion, NOT inside livrarr-enrichment"
    decision: >
      AC-002 requires the enriched payload to carry tags_written, which is knowable only AFTER
      materialization — and materialize runs in run_unified_enrichment Step 5 (work_service.rs
      :2606-2614), after enrich_work returns. The workspace's ONLY production enrich_work
      dispatch is that function's Step 2 (:2471; the second textual hit is the
      EnrichmentWorkflowImpl adapter's inner delegation on the same road —
      enrichment_workflow_service.rs:63-74), so writing the event at the function's completion
      covers every trigger (add, manual, bulk, convergence, monitors) by construction, sees
      changed/status/merge_deferred (DomainEnrichmentResult fields :76-86) for the payload and
      the no-event rules, and keeps livrarr-enrichment history-free (spec ST-004 stays the
      application chokepoint; the EVENT rides the orchestration moment one level up).
  - id: "D-DATE-PARAM"
    title: "CreateHistoryEventDbRequest gains an optional caller-supplied date"
    decision: >
      create_history_event stamps date = Utc::now() server-side (sqlite_history.rs:154-172,
      survey-verified) — the backfill's per-fact historical dates (REQ-010, AC-010) are
      impossible without a date field. Optional with None = now keeps all live writers unchanged
      in behavior. Rejected: a separate backfill-only insert method — two insert paths for one
      table reintroduces the divergence class this feature exists to close.
  - id: "D-NO-MIGRATION"
    title: "Zero DB migrations"
    decision: >
      history.event_type is TEXT (spec ST-008) — new kinds need no schema change. The backfill
      marker is a runtime row in the existing _livrarr_meta table (migration 010), inserted by
      the pass itself on completion (INSERT ... ON CONFLICT DO UPDATE per insight 20; the
      069-style migration-seeded marker is unnecessary — nothing needs the row to pre-exist).
  - id: "D-EXISTING-WRITERS"
    title: "The 3 live writers + the dead wrapper migrate onto the shared path"
    decision: >
      REQ-013 forces a payload change (add work_title) on release_service/download_poller/
      import_workflow anyway, so they adopt the constructors + helper in the same touch —
      closing REQ-009's silent-discard gap at release_service (`let _ =`, :461) and REQ-003's
      false affordance (the zero-caller ManualImportServiceImpl::create_history_event wrapper is
      REMOVED; the manual-import writer uses the shared path its D: HistoryDb bound already
      permits). Payload compatibility: every existing key keeps its exact name and meaning
      (release `title`, batch counts, guid); REQ-013 keys are ADDED. Existing stored rows are
      untouched.
  - id: "D-SPINE"
    title: "HistoryEvent joins the canonical entity spine (r1 fold, both families)"
    decision: >
      HistoryEvent is marked in domain_entities and added to docs/canonical-model.yaml with an
      amendments[] row (2026-07-18). The initial draft treated history rows as non-spine records
      about spine entities; both review families independently rejected that framing (google R-1,
      openai R-2), and the model's own contents decide it: PlaybackProgress, Bookmark, and
      AudiobookChapter — per-user/consumption records of the same altitude — are already spine.
      HistoryEvent is persisted, user-visible on two surfaces, and now carries cross-feature
      invariants every future feature conforms to (append-only, survives work deletion,
      observer-never-actor). Spine growth is deliberate and logged, not silent — exactly what
      the amendment mechanism is for.
  - id: "D-TAG-HANDLE"
    title: "LiveTagService gains a history handle by constructor injection"
    decision: >
      retag_library_items is the per-pass chokepoint (spec ST-006) but LiveTagService holds no
      persistence handle (tag_service.rs:7-10). Constructor injection (explicit field, wiki
      no-OnceLock rule — overview.md:60-65) over writing events at its two callers
      (import_service.rs:111/284) — caller-side writes duplicate the discipline and any future
      third caller silently loses coverage. Concrete type vs generic at design.

