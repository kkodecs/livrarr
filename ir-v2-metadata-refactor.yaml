# IR v2 — Design (pseudocode + call annotations + capability surveys + TDD directives)
# Feature: metadata-refactor
#
# References ir-v1-metadata-refactor.yaml for STRUCTURE (modules, dependency graph, data_flow,
# shared_types, the 10 decisions D-001..D-010). This file does NOT duplicate that; it adds the
# per-function DESIGN: pseudocode, call annotations (NEW/EXISTING/LIBRARY/STDLIB), capability
# surveys (the DRY/reuse check), invariants, and TDD directives.
#
# DESIGN STANCE: this is a REUSE-FIRST design. Grounding the live signatures (2026-06-08) showed
# most of the machinery already exists — EnrichmentService::enrich_work + inject_source_data,
# MergeEngine::merge + merge_from_cached, EnrichmentMode, ProviderQueue::dispatch_enrichment,
# download_cover_to_disk, write_tags_batch, AddWorkRequest. The refactor REWIRES + DELETES far
# more than it invents. The bulk of call_annotations are EXISTING, by design.

metadata:
  feature: metadata-refactor
  stage: v2-design
  ir_v1_ref: ir-v1-metadata-refactor.yaml
  spec_ref: spec-metadata-refactor.md
  contract_ref: contract-metadata-refactor.yaml
  version: 2
  grounded_against: "live code @ 2026-06-08 (Serena signatures cited inline as EXISTING)"

# ---------------------------------------------------------------------------
# DESIGN DECISIONS — the 4 PO-delegated calls + 3 grounding-driven refinements.
# (D-001..D-010 live in ir-v1; DD-* are design-stage decisions on top.)
decisions:
  - id: DD-001
    topic: "Cache reconciliation (ir-v1 Q-D04) — REVISED r1 (design-review R-001)"
    choice: >-
      TWO caches, two roles, NO overlap: (a) the EXISTING in-memory transport_cache (keyed
      user_id+CandidateId) holds the discovery payloads the user's PICKED candidate already fetched;
      the enrich path CONSUMES them once via cache_take (the zero-network REUSE — DD-007). (b) the NEW
      persistent (work,provider) MetadataCache (24h TTL, HardRefresh bypasses) is the GATEWAY's cache for
      providers it must FETCH during enrich. The gateway-fetch path does NOT read transport_cache; the
      candidate-reuse path does NOT read the persistent cache. Different keys, lifetimes, roles — no
      double-cache.
    rationale: "REQ-009 + the live reuse mechanism (cache_take, work_service.rs:2559). My earlier 'transport_cache untouched by enrich' was wrong — the reuse path reads it."
  - id: DD-002
    topic: "Pacing numerics (ir-v1 Q-002)"
    choice: >-
      Conservative TOML-configurable defaults (NO env-var overrides — Servarr convention): GB daily
      budget 1000/day (= the ST-004 hard quota) with backoff-to-reset at 00:00 PT (AC-008); GR rate
      ~1 call / 3s (DataDome, ST-005); other providers ~5 concurrent; foreground worker pool drains
      before background. All values live in config (TOML), not code constants.
    rationale: "Spec §4 defers numerics to design; ST-004/005 bound them; TOML per the no-env-config rule."
  - id: DD-003
    topic: "Generic-row membership (ir-v1 Q-003) — CORRECTED for the no-OL-foreign rule"
    choice: >-
      The generic row (unlisted = foreign languages) EXCLUDES OpenLibrary AND Hardcover. ebook list =
      [GoogleBooks] (the verified foreign-capable enrichment provider; Goodreads MAY be added as a
      cautious secondary — it is not in the REQ-014 foreign-exclusion set, but is DataDome-sensitive +
      LLM-required, so default OFF). audiobook list = [Audible, Audnexus].
    rationale: >-
      REQ-014 (foreign excludes HC+OL) + the standing rule: never use OpenLibrary for foreign-language
      ENRICHMENT (OL is search/discovery only). My initial GB+OL lean violated this; corrected. FLAGGED
      for PO/review — generic-row membership is partly a product/coverage call.
  - id: DD-004
    topic: "Policy snapshot swap (ir-v1 Q-D05)"
    choice: "RwLock<Arc<ProviderPolicySnapshot>> — arc-swap is NOT in the workspace (verified). Reads clone the Arc under a read lock; an edit builds a new snapshot and swaps under a write lock."
    rationale: "P-E / no new dependency. The snapshot is read-heavy, write-rare; RwLock<Arc<>> is sufficient."
  - id: DD-005
    topic: "REUSE EnrichmentMode; do NOT invent ExecutionContext (DRY, grounding-driven)"
    choice: >-
      ir-v1's ExecutionContext{Foreground,Background} is NOT a new type. The existing
      EnrichmentMode{Background,Manual,HardRefresh} (livrarr-enrichment/src/lib.rs:125) already
      encodes the invocation kind. The PacingLane DERIVES: Manual|HardRefresh -> Foreground;
      Background -> Background. The cache-bypass DERIVES: HardRefresh -> bypass (REQ-009 refresh).
    rationale: "DRY (WCC D-001 reuse-and-widen). A parallel ExecutionContext would duplicate EnrichmentMode."
  - id: DD-006
    topic: "EnrichmentSeed is a CONCEPT realized by existing types, not a new struct (DRY) — REVISED r2 (R-005)"
    choice: >-
      The door's add input is the EXISTING WorkCandidate (livrarr-domain/src/identity.rs:467) — NOT a
      new struct and NOT AddWorkRequest. It already carries: `fields: WorkSeedFields` (the REQ-002 seed —
      title/author/language), `identity: IdentityState` (the anchors), `candidate_id: Option<CandidateId>`
      ("lets add() reuse cached payloads; None = enrich from network" — the reuse key is ALREADY here),
      and `file_path`. WorkService::add(user_id, WorkCandidate) -> AddWorkResult creates the Work; the
      pipeline then reads the created Work's {title,author,language} for provider selection. The add
      signature is UNCHANGED (R-005): the cutover extracts `candidate.candidate_id` and threads it to
      enrich_work — no widening of add, no parallel AddWorkRequest API.
    rationale: "DRY + the VERIFIED live add boundary (work.rs:244 add(WorkCandidate); identity.rs:471 candidate_id). My r1 'seed=AddWorkRequest + widen add' was wrong — WorkCandidate already has it all."
  - id: DD-007
    topic: "MOVE the candidate-reuse logic into enrich_work WITH always-save; DELETE the fork (REVISED r1, design-review R-001)"
    choice: >-
      CORRECTION (both families, R-001): the discovery-payload reuse is NOT inject_source_data — that is
      the Readarr single-SourceProviderData path (lib.rs:70 + AddWorkRequest.source_provider_data),
      UNRELATED, left as-is. The REAL reuse path (work_service.rs:2553-2620) is: candidate_id ->
      transport_cache.cache_take(user_id, candidate_id) -> cached_payloads_match_work REVALIDATION (D-005,
      mismatch falls back to network) -> merge_from_cached -> apply_enrichment_merge. The ONLY bug is it
      SKIPS materialize. So: MOVE that logic INTO enrich_work (widened to take candidate_id:
      Option<CandidateId>) and ADD the materialize step; DELETE the standalone fork. enrich_work then:
      consume the picked candidate's revalidated cached payloads (if any) -> gateway-fetch the providers
      NOT in that map -> merge_from_cached over the union (policy-aware via language; zero-LLM, D-010) ->
      CAS apply -> materialize ALWAYS. One road, no save-skip.
    rationale: >-
      REQ-001/005/012 + the VERIFIED live mechanism. The reuse logic (revalidation, CAS, provenance,
      merge_from_cached) is correct + load-bearing — it MOVES, it is not deleted; only the missing
      materialize step + the standalone-fork shape were the bug.

# ---------------------------------------------------------------------------
# MODULES — design detail. Structure (deps, responsibility) is in ir-v1; here = pseudocode + reuse.
modules:

  # ════════════════════════════════════════════════════════════════════════
  - name: domain-contracts
    home_crate: livrarr-domain
    capability_survey:
      - { capability: "EnrichmentMode enum", exists: true, location: "livrarr-enrichment/src/lib.rs:125", decision: "REUSE (DD-005) — move/re-export to domain if the lane/bypass derivation needs it domain-side; lane+refresh derive from it." }
      - { capability: "AddWorkRequest (the seed)", exists: true, location: "livrarr-domain/src/services/work.rs", decision: "REUSE (DD-006) — the door input; no new EnrichmentSeed struct." }
      - { capability: "EnrichmentStatus enum", exists: true, location: "livrarr-domain/src/lib.rs:72", decision: "REUSE unchanged {Unenriched,Enriched,Thin,Failed} (REQ-011, no migration)." }
      - { capability: "provenance / ProvenanceSetter", exists: true, location: "livrarr-domain (work_metadata_provenance)", decision: "REUSE — Setter=User is the single user-lock (REQ-008); no parallel flag." }
      - { capability: "MaterializeService / MetadataCache / PacingQueue / ProviderPolicy traits", exists: false, decision: "NEW — the feature's ports (ir-v1 domain-contracts)." }
    public_api:
      functions:
        - name: "PacingLane::from(mode: EnrichmentMode)"
          signature: "fn from(mode: EnrichmentMode) -> PacingLane"
          pseudocode:
            - "match mode { Manual | HardRefresh => Foreground, Background => Background }   // DD-005 derivation"
          call_annotations:
            - { call: "EnrichmentMode (match)", type: EXISTING, note: "livrarr-enrichment/src/lib.rs:125 — reused, not redefined" }
          tdd: ["Manual->Foreground", "HardRefresh->Foreground", "Background->Background"]
        - name: "EnrichmentMode::bypasses_cache"
          signature: "fn bypasses_cache(&self) -> bool"
          pseudocode:
            - "matches!(self, HardRefresh)   // REQ-009: a refresh bypasses the 24h cache; Manual/Background use it"
          call_annotations:
            - { call: "matches! (HardRefresh)", type: STDLIB, note: "REQ-009 refresh semantics" }
          tdd: ["HardRefresh=>true", "Manual=>false", "Background=>false"]
        - name: "ProviderPolicy::list_for"
          signature: "fn list_for(&self, kind: ListKind) -> &ProviderList   // ListKind = Ebook | Audiobook"
          pseudocode:
            - "match kind { Ebook => &self.ebook, Audiobook => &self.audiobook }   // REQ-003 two self-contained lists"
          call_annotations:
            - { call: "ProviderList (field access)", type: NEW, note: "ir-v1 domain-contracts" }
          invariants: ["each ProviderList is de-duplicated (no provider twice WITHIN a list — AC-015); a provider MAY appear in both lists (ST-001/002)"]
          tdd: ["ebook list returns ebook providers in priority order", "audiobook list returns audiobook providers", "dup-within-list rejected at construction"]
    decisions: ["DD-005", "DD-006"]

  # ════════════════════════════════════════════════════════════════════════
  - name: deterministic-merge
    home_crate: livrarr-enrichment
    capability_survey:
      - { capability: "MergeEngine::merge + merge_from_cached", exists: true, location: "livrarr-enrichment/src/lib.rs:334-353", decision: "REUSE the trait; merge_from_cached stays (deterministic, DD-007); merge LOSES its LLM branch." }
      - { capability: "merge_impl (deterministic field-winner)", exists: true, location: "livrarr-enrichment/src/lib.rs", decision: "REUSE — the pure per-field highest-priority-non-empty logic (REQ-004)." }
      - { capability: "the LLM-merge override layer (the merge LLM branch + its Llm* merge-response/field-selection structs)", exists: true, location: "livrarr-enrichment/src/lib.rs:21-46", decision: "DELETE (D-010/REQ-005) — see the contract's symbol-level forbidden_pattern." }
      - { capability: "MERGE_FIELDS / field_category (shared vs audiobook)", exists: true, location: "livrarr-enrichment/src/lib.rs", decision: "REUSE — drives REQ-004 (shared fields from ebook list, audio fields from audiobook list)." }
      - { capability: "drop_language_incompatible_providers / priority_list_for", exists: true, location: "livrarr-enrichment/src/lib.rs", decision: "REUSE — REQ-014 language integrity is already partly here." }
      - { capability: "cover_resolution (resolve_cover/derive_cover_trust/measure_dimensions/maybe_upgrade_cover)", exists: true, location: "livrarr-enrichment/src/cover_resolution.rs", decision: "REUSE resolve/trust; DELETE dimension+upgrade machinery (REQ-006 priority-only, no size rank)." }
    public_api:
      functions:
        - name: "MergeEngine::merge (deterministic-only successor)"
          signature: "async fn merge(&self, inputs: MergeInput) -> Result<MergeOutput, MergeError>"
          pseudocode:
            - "// REQ-004/005: pure, deterministic, ZERO LLM. (Was: branched to the LLM arbitration path when configured.)"
            - "for field in MERGE_FIELDS:                                  // EXISTING constant"
            - "    let list = match field_category(field) { Shared|Ebook => policy.ebook, Audiobook => policy.audiobook }"
            - "    winner = first provider in `list` priority order whose payload has a non-empty `field`   // REQ-004"
            - "    if winner.is_some() AND not user_locked(field): set field = winner    // REQ-008 provenance=User wins"
            - "    else if field is an identifier: ACCUMULATE — keep existing if no provider supplied it    // REQ-007"
            - "covers: for slot in {ebook, audiobook}: choose highest-PRIORITY source returning that cover kind (NOT by size); keep existing if none (non-destructive) and never overwrite a user-locked cover   // REQ-006"
            - "compute change-flag = (any field/identifier/cover URL actually changed) -> feeds REQ-012 idempotency"
            - "return MergeOutput { merged fields, chosen cover URLs per slot, accumulated ids, provenance, changed: bool }"
          call_annotations:
            - { call: "MERGE_FIELDS / field_category", type: EXISTING, note: "lib.rs — shared-vs-audio routing" }
            - { call: "merge_impl (deterministic winner)", type: EXISTING, note: "lib.rs — reuse the field-winner core" }
            - { call: "the merge LLM-arbitration branch", type: EXISTING, note: "DELETE this branch (D-010, lib.rs:21-46) — do NOT call" }
            - { call: "user_locked via provenance Setter=User", type: EXISTING, note: "REQ-008 single lock mechanism" }
            - { call: "cover priority select (resolve_cover, priority index)", type: EXISTING, note: "cover_resolution.rs — keep priority; drop dimensions" }
          preconditions: ["inputs carry only provider payloads + the ProviderPolicy + current Work fields/provenance — NO db/http handle (purity, RE-001)"]
          invariants:
            - "ZERO LLM calls (REQ-005/AC-003)"
            - "a known identifier is never blanked by a merge lacking it (REQ-007/AC-004)"
            - "an existing cover is never blanked; user-locked fields/cover never overwritten (REQ-006/008/AC-005)"
            - "covers chosen by PRIORITY, not pixel size (REQ-006/AC-012)"
          tdd:
            - "two providers, higher-priority non-empty wins per field (AC-007 audio Audible-first)"
            - "no provider supplies gr_key -> existing gr_key retained (AC-004)"
            - "user-set series/cover survives merge (AC-005)"
            - "two covers different sizes -> higher-priority source wins regardless of dimensions (AC-012)"
            - "zero LLM calls during a full merge (AC-003)"
        - name: "MergeEngine::merge_from_cached (REUSE — the injected-payload path)"
          signature: "async fn merge_from_cached(&self, work: Work, payloads: HashMap<MetadataProvider, NormalizedWorkDetail>, current_provenance: Vec<FieldProvenance>, language: Option<&str>) -> Result<MergeOutput, MergeError>"
          pseudocode:
            - "// EXISTING signature (lib.rs:344). Same deterministic merge over PRE-FETCHED payloads — zero network."
            - "// Used when a door injected discovery payloads (DD-007). Result still flows to save (materialize)."
            - "apply the same field-winner + cover-priority + accumulate + user-lock rules as merge(), over `payloads`"
          call_annotations:
            - { call: "merge_from_cached", type: EXISTING, note: "lib.rs:344 — reuse verbatim; only ensure its caller saves" }
          invariants: ["same invariants as merge(); zero provider network calls"]
          tdd: ["injected payloads merge identically to a live fetch of the same data (AC-001 convergence)"]
    decisions: ["DD-007", "D-010"]

  # ════════════════════════════════════════════════════════════════════════
  - name: enrichment-pipeline
    home_crate: livrarr-enrichment
    capability_survey:
      - { capability: "EnrichmentService::enrich_work", exists: true, location: "livrarr-enrichment/src/lib.rs:48", decision: "REUSE + WIDEN with candidate_id: Option<CandidateId> (R-001); BECOMES the single reuse|fetch -> merge -> save road." }
      - { capability: "inject_source_data (Readarr single SourceProviderData)", exists: true, location: "livrarr-enrichment/src/lib.rs:70", decision: "UNCHANGED — the Readarr path; NOT the discovery-reuse mechanism (R-001 correction)." }
      - { capability: "transport_cache.cache_take(user_id, CandidateId) -> payload map + cached_payloads_match_work revalidation", exists: true, location: "work_service.rs:2559-2566", decision: "RELOCATE the reuse LOGIC into enrich_work + ADD the materialize step (DD-007)." }
      - { capability: "EnrichmentServiceImpl (the impl)", exists: true, location: "livrarr-enrichment/src/lib.rs", decision: "REWIRE — reuse|gateway -> merge_from_cached -> CAS apply -> materialize; resolve status." }
      - { capability: "EnrichmentResult / EnrichmentError / build_apply_request", exists: true, location: "livrarr-enrichment/src/lib.rs + work_service.rs:2618", decision: "REUSE — return/error taxonomy + the CAS apply-request builder." }
      - { capability: "the cached-payload-reuse fork (work_service)", exists: true, location: "livrarr-metadata/src/work_service.rs:2553", decision: "DELETE the standalone fork (DD-007) — its LOGIC moves into enrich_work + gains materialize; see the contract's forbidden_pattern." }
    public_api:
      functions:
        - name: "EnrichmentService::enrich_work (the ONE road) — WIDENED with candidate_id (R-001)"
          signature: "async fn enrich_work(&self, user_id: UserId, work_id: WorkId, mode: EnrichmentMode, candidate_id: Option<CandidateId>) -> Result<EnrichmentResult, EnrichmentError>"
          pseudocode:
            - "let work = db.get_work(user_id, work_id)?                            // EXISTING"
            - "let policy = policy_source.for_language(work.language_or_english())   // REQ-003/002 (English default applied at add)"
            - "let lane = PacingLane::from(mode); let refresh = mode.bypasses_cache()  // DD-005"
            - "// REUSE: consume the picked candidate's discovery payloads (zero network) — relocated fork logic (DD-007)"
            - "let mut reused = empty_map; let mut had_cached_ok = false"
            - "if let Some(cid) = candidate_id {"
            - "    if let Some(cached) = external_data.cache_take(user_id, cid) {              // EXISTING transport_cache (work_service.rs:2559)"
            - "        if cached_payloads_match_work(&work, &cached) { reused = cached; had_cached_ok = true }   // EXISTING revalidation (D-005); mismatch -> network"
            - "    } }"
            - "// ASK: gateway-fetch only providers NOT already supplied by the reused payloads"
            - "let needed = policy.all_providers() MINUS reused.keys()"
            - "let fetched = gateway.ask_many(&work, needed, lane, refresh).await            // NEW gateway (cache|pace|fetch); never blocks (REQ-013)"
            - "let payloads = reused ∪ fetched.ok_payloads"
            - "// MERGE: deterministic, policy-aware via language, ZERO LLM (D-010). One surface over the payload map."
            - "let provenance = db.list_work_provenance(user_id, work_id)?; let generation = db.get_merge_generation(user_id, work_id)?   // EXISTING — user locks + CAS snapshot"
            - "let out = merge_engine.merge_from_cached(work.clone(), payloads, provenance, work.language.as_deref()).await?   // EXISTING (lib.rs:344)"
            - "// SAVE: CAS apply THEN materialize ALWAYS (the fork's missing step) — REQ-001/012"
            - "db.apply_enrichment_merge(build_apply_request(&out, user_id, work_id, generation))?   // EXISTING CAS (work_service.rs:2618)"
            - "// derive materialize inputs (materialize is DB-FREE, so the caller resolves them — R-005 r2):"
            - "let file_paths = db.list_library_items_by_work(user_id, work_id)?.map(|i| i.path)   // EXISTING (db/lib.rs:544)"
            - "let cover_state = current cover per slot from the Work record (cover_url/source/trust/cover_manual + audiobook_cover_*)   // NEW small helper over existing Work fields"
            - "if out.changed { materialize.materialize(build_request(work_id, &out, file_paths, cover_state, self.covers_dir)).await? }   // REQ-012/015; covers_dir from AppState"
            - "let status = resolve_status(had_cached_ok, &fetched, &out)                   // REQ-011"
            - "db.set_enrichment_status(work_id, status)?"
            - "if status == Failed { notifications.failed_with_retry(work_id) }             // NO auto-retry"
            - "Ok(EnrichmentResult{ status, identity_not_found: fetched.identity_not_found, changed: out.changed })"
          call_annotations:
            - { call: "db.get_work / list_work_provenance / get_merge_generation / apply_enrichment_merge / set_enrichment_status / list_library_items_by_work", type: EXISTING, note: "sqlite_work.rs CAS txn + provenance + generation; db/lib.rs:544 library items for materialize paths (R-005)" }
            - { call: "external_data.cache_take + cached_payloads_match_work", type: EXISTING, note: "the relocated reuse (work_service.rs:2559-2566) — DD-007" }
            - { call: "policy_source.for_language", type: NEW, note: "ProviderPolicySource (ir-v1)" }
            - { call: "PacingLane::from / mode.bypasses_cache", type: NEW, note: "DD-005 derivations (domain-contracts)" }
            - { call: "gateway.ask_many", type: NEW, note: "provider-gateway (cache+pace+fetch)" }
            - { call: "merge_engine.merge_from_cached + build_apply_request", type: EXISTING, note: "lib.rs:344 + build_apply_request (work_service.rs:2618)" }
            - { call: "materialize.materialize", type: NEW, note: "MaterializeService (ir-v1) — the ALWAYS-save step" }
            - { call: "notifications.failed_with_retry", type: EXISTING, note: "notification service — reuse" }
          invariants:
            - "ALWAYS reaches save when out.changed (no fork skips materialize) — REQ-001/012"
            - "never blocks: a fetch error/empty still saves the work + sets status (REQ-013/AC-017/018)"
            - "covers materialize regardless of identity state (REQ-015/AC-002)"
            - "zero LLM (REQ-005)"
          tdd:
            - "add-from-author-page (injected payloads) -> cover present on the work (AC-002 — the originating bug)"
            - "same book via two doors -> identical final fields+ids+covers (AC-001 convergence)"
            - "all providers fail -> work saved with seed, status Thin/Failed, add not blocked (AC-018)"
            - "HardRefresh -> cache bypassed, providers re-fetched (AC-011)"
            - "no-change re-run -> materialize NOT invoked (AC-010)"
        - name: "resolve_status (REQ-011 resolution rule) — counts reused payloads (R-004)"
          signature: "fn resolve_status(had_cached_ok: bool, fetched: &AskOutcomes, out: &MergeOutput) -> EnrichmentStatus"
          pseudocode:
            - "if out.usable_field_count >= 1 { return Enriched }                          // ≥1 usable field saved"
            - "if had_cached_ok || fetched.any_provider_responded_ok() { return Thin }      // ≥1 success (reused OR fetched), 0 usable — R-004: a pure-reuse work is NOT Failed"
            - "Failed                                                                       // no usable response, reused or fetched"
          call_annotations:
            - { call: "EnrichmentStatus variants", type: EXISTING, note: "domain/lib.rs:72 — no new variant" }
          invariants: ["mixed (one empty success + others error) => Thin (AC-020)", "pure-reuse work, 0 usable fields => Thin, not Failed (R-004)"]
          tdd: ["≥1 field => Enriched (AC-018)", "0 fields, 1 ok fetch => Thin (AC-020)", "0 fields, only reused payloads => Thin (R-004)", "all errored, none reused => Failed (AC-009)"]
    decisions: ["DD-001", "DD-007", "D-010"]

  # ════════════════════════════════════════════════════════════════════════
  - name: provider-gateway
    home_crate: livrarr-enrichment
    capability_survey:
      - { capability: "ProviderQueue::dispatch_enrichment (scatter-gather + breakers)", exists: true, location: "livrarr-enrichment/src/lib.rs:201-214", decision: "REUSE/EXTEND — the fetch underneath; pacing-queue adds lanes+budget+status." }
      - { capability: "transport_cache (in-memory LRU)", exists: true, location: "livrarr-external-data", decision: "BYPASS for the enrich path (DD-001) — use the persistent MetadataCache instead." }
      - { capability: "MetadataCache (work,provider) persistent", exists: false, decision: "NEW — provider-cache (db impl)." }
    public_api:
      functions:
        - name: "ProviderGateway::ask_many (the transparent ask)"
          signature: "async fn ask_many(&self, work: &Work, providers: Vec<MetadataProvider>, lane: PacingLane, refresh: bool) -> AskOutcomes"
          pseudocode:
            - "for each provider (fan-out, submit-N-and-join):"
            - "    if !refresh { if let Some(p) = cache.get(work.id, provider, max_age=24h) { record HIT; continue with p } }   // REQ-009"
            - "    let outcome = pacing_queue.submit(provider, lane, || external_data.fetch(work, provider)).await           // REQ-010 lane + rate + budget"
            - "    match outcome { Ok(p) => { cache.put(work.id, provider, p); record OK }, RateLimited|QuotaExhausted|Blocked => record + status-page write (REQ-010); never error the whole run (REQ-013) }"
            - "join all; return AskOutcomes { ok_payloads, per-provider outcomes, identity_not_found, any_provider_responded_ok }"
          call_annotations:
            - { call: "cache.get / cache.put", type: NEW, note: "MetadataCache (db impl) — REQ-009" }
            - { call: "pacing_queue.submit", type: NEW, note: "PacingQueue (extends ProviderQueue) — REQ-010" }
            - { call: "external_data.fetch (ProviderFetch)", type: EXISTING, note: "livrarr-external-data — the dumb-pipe fetch" }
          invariants:
            - "external-data is reached ONLY through the queue (REQ-010 single gate)"
            - "a provider failure is recorded, never propagated as a run failure (REQ-013)"
            - "refresh=true skips cache.get but still cache.put (REQ-009)"
          tdd:
            - "cache hit within 24h => no fetch call for that provider (AC-011)"
            - "refresh => cache skipped, fetch called (AC-011)"
