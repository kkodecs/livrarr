    public_api:
      functions:
        - name: "MaterializeService::materialize"
          signature: "async fn materialize(&self, req: MaterializeRequest) -> Result<MaterializeOutcome, MaterializeError>"
          pseudocode:
            - "if !req.changed { return Ok(MaterializeOutcome::skipped) }                         // REQ-012 idempotency"
            - "let mut ebook_cover_bytes: Option<Vec<u8>> = None"
            - "for slot in {ebook, audiobook}:"
            - "    let cur = req.cover[slot]; if cur.user_locked { continue }                       // REQ-008 never overwrite user cover"
            - "    if let Some(url) = cur.chosen_new_url { if url != cur.current_url {              // non-destructive: only a NEW cover (REQ-006)"
            - "        let bytes = download_cover_to_disk(http_safe, url, req.covers_dir, req.work_id, slot.suffix).await?   // RELOCATED+WIDENED: writes to disk AND returns Vec<u8> (R-002)"
            - "        if slot == ebook { ebook_cover_bytes = Some(bytes) }                          // carry bytes for the epub tag write"
            - "    } }    // identity-independent: runs for held/unverified works too (REQ-015)"
            - "if !req.file_paths.is_empty() AND req.tag_fields_changed:"
            - "    write_tags_batch(req.file_paths, req.tag_metadata, ebook_cover_bytes).await       // EXISTING (m4b/mp3 writers stay disabled — spec §4)"
            - "return MaterializeOutcome { covers_written: [...], tags_written: bool }               // caller persists cover_path + generation"
          call_annotations:
            - { call: "download_cover_to_disk (widened to return Vec<u8>)", type: EXISTING, note: "RELOCATED from work_service.rs:3340 (cycle break); returns bytes for write_tags_batch (R-002)" }
            - { call: "write_tags_batch", type: EXISTING, note: "tagwrite/lib.rs:83 — paths + metadata + Some(ebook_cover_bytes)" }
            - { call: "http.fetch_ssrf_safe", type: EXISTING, note: "livrarr-http safe client (runtime URL, insight 37)" }
          preconditions: ["req carries ALL DB-derived inputs (R-001): file_paths, current cover state per slot, tag_metadata, covers_dir — materialize reads NO db"]
          invariants:
            - "no-op when !req.changed (REQ-012/AC-010)"
            - "never overwrites a user-locked cover; never blanks an existing cover when no new URL (REQ-006/008)"
            - "runs regardless of identity state (REQ-015/AC-002)"
            - "DB-free — caller persists cover_path + generation (D-002)"
          tdd:
            - "unchanged merge => zero downloads, zero tag writes (AC-010)"
            - "held/unverified work => cover still downloaded (AC-002/REQ-015)"
            - "user-locked cover => not overwritten (AC-005)"
            - "new ebook cover => downloaded + written into the epub tags"
    decisions: ["D-002", "D-003"]

