amendments:
  - date: 2026-08-05
    status: PO-adopted
    change: "Add Edition to the spine: a first-class record owned by exactly one Work, carrying format/language/subtitle/cover and edition-scoped routes; unknown format and absent language are valid."
    reason: "identity-layer-rewrite REQ-005/026 makes edition ownership the single home for ISBN, ASIN, Goodreads book id, edition subtitle, and per-format cover evidence."
  - date: 2026-08-05
    status: PO-adopted
    change: "Add WorkRoute to the spine: a user-scoped provider route whose owner is exactly one Work or Edition, plural per provider, with active/retired audit lifecycle and a derived resolved Work projection."
    reason: "identity-layer-rewrite REQ-001/007 replaces one-column provider anchors and prevents dual-writing edition ids at work scope."
  - date: 2026-08-05
    status: PO-adopted
    change: "Amend Work: own WorkId is the anchor; identity title tuple, ordered author-record contributors, alternative titles, subjects, bidirectional containment/canonical references, per-format defaults, and durable text distinction are work-level state; legacy author-name/provider-id scalar copies retire."
    reason: "identity-layer-rewrite REQ-002/003/004/023/024 and P1/P2/P8 change the structural identity of a Work."
  - date: 2026-08-05
    status: PO-adopted
    change: "Amend CapturedIdentity from five scalar anchors plus copied title/author into the one-way identity contract of own WorkId, stable IdentityTitleTuple, primary AuthorId, active WorkRoute projection, connectedness status, and generation."
    reason: "identity-layer-rewrite REQ-001/003/012/013/023 removes provider ids as anchors while preserving the identity-to-enrichment seam."
  - date: 2026-08-05
    status: PO-adopted
    change: "Amend IdentityStatus to exactly UserConfirmed, Connected, and NotConnected; conflicts and review queues are orthogonal records, and user-confirmed structurally requires a surviving route."
    reason: "identity-layer-rewrite REQ-012 defines one connectedness vocabulary independent of route kind and enrichment eligibility."
  - date: 2026-08-05
    status: PO-adopted
    change: "Amend IdentityConflict to exactly three classes (same-provider work-id disagreement, cross-provider work-key disagreement, and cross-work route ownership), with parked candidate, accept/reject/different-work audited resolutions, explicit surviving route sets, and retired archives."
    reason: "identity-layer-rewrite REQ-007 replaces veto/enforcement semantics with non-blocking, user-resolved route disputes."
  - date: 2026-08-05
    status: PO-adopted
    change: "Amend AuthorRoute description to identify it as the author-scoped counterpart to WorkRoute; the two share route vocabulary but retain separate guarded writer policies."
    reason: "The canonical AuthorRoute row reserved F2's works-side generalization; identity-layer-rewrite supplies it without weakening F1's author name-agreement guard."
  - date: 2026-08-05
    status: PM-owned-canonical-amendment
    change: "Supersede the pre-F2 'Anchors are monotonic' invariant with: route identity is auditable and never silently mutated; established active routes may change owner/state only through audited resolution, audited merge, or user edit."
    reason: "The active/retired lifecycle, cross-work transfer, and same-work merge union are deliberate F2 behavior. This IR records the matching amendment while the PM/PO own docs/canonical-model.yaml."
  - date: 2026-08-05
    status: PM-owned-canonical-amendment
    change: "Amend 'One road' to 'One road per concern': every creation door settles through the single identity road and every enrichable metadata/cover/tag write funnels through the single enrichment pipeline."
    reason: "The identity road and enrichment pipeline are separate first-class chokepoints. This IR records the matching amendment while the PM/PO own docs/canonical-model.yaml."
  - date: 2026-08-05
    status: PM-owned-architecture-amendment
    change: "Supersede the pre-F2 confidence hierarchy with the binding P5 order: UserChoice, OwnedFile, ProviderIdentity, MinimumTitleAuthors, then visible unidentified/review; ISBN/ASIN/Goodreads book ids are edition-scoped lookup keys whose equality may confirm only inside the authority and whose inequality is no evidence."
    reason: "X-F07's fix text identifies the missing IR supersession note. This row records the architect half while the PM/PO own the corresponding ARCHITECTURE.md Part 1 wording."
  - date: 2026-08-08
    status: PO-adopted
    change: "Add ReviewKind::PendingRoute; add ReviewResolutionCommand::PendingRoute { card_id: i64, expected_generation: i64, action: Affirm { surviving_routes: Vec<RouteKey> } }; and add the PendingRoute row to pre_activation_review_cli.reachable_review_kinds."
    reason: "B-DESIGN-004: no closed ReviewKind honestly represents a non-conflicting parked route candidate awaiting user affirmation; ratified by the PO for the AffirmPendingRoute door."

