            - { name: subject_places, type: "Vec<SourcedValue<String>>" }
            - { name: subject_times, type: "Vec<SourcedValue<String>>" }
            - { name: subject_topics, type: "Vec<SourcedValue<String>>" }
        - kind: enum
          name: IdentityStatus
          fields:
            - { name: UserConfirmed, type: unit }
            - { name: Connected, type: unit }
            - { name: NotConnected, type: unit }
        - kind: struct
          name: CapturedIdentity
          fields:
            - { name: user_id, type: UserId }
            - { name: own_work_id, type: WorkId }
            - { name: identity_title, type: IdentityTitleTuple }
            - { name: primary_author_id, type: AuthorId }
            - { name: active_routes, type: "Vec<WorkRoute>" }
            - { name: status, type: IdentityStatus }
            - { name: identity_generation, type: i64 }
        - kind: enum
          name: IdentityConflictClass
          fields:
            - { name: SameProviderWorkIdDisagreement, type: unit }
            - { name: CrossProviderWorkKeyDisagreement, type: unit }
            - { name: RouteOwnedByDifferentWork, type: unit }
        - kind: enum
          name: IdentityConflictResolution
          fields:
            - { name: Accept, type: "{ surviving_routes: Vec<RouteKey>, target_edition: Option<EditionId> }" }
            - { name: Reject, type: "{ surviving_routes: Vec<RouteKey> }" }
            - { name: DifferentWork, type: "{ winning_work_id: WorkId, surviving_routes: Vec<RouteKey>, target_edition: Option<EditionId> }" }
        - kind: struct
          name: IdentityConflict
          fields:
            - { name: id, type: i64 }
            - { name: user_id, type: UserId }
            - { name: class, type: IdentityConflictClass }
            - { name: current_work_id, type: WorkId }
            - { name: candidate, type: ParkedRouteCandidate }
            - { name: status, type: "Pending | Resolved" }
            - { name: resolution, type: "Option<IdentityConflictResolution>" }
            - { name: audit_id, type: "Option<i64>" }
        - kind: enum
          name: ReviewResolutionCommand
          fields:
            - { name: IdentityConflict, type: "{ card_id: i64, expected_generation: i64, action: IdentityConflictResolution }" }
            - { name: PendingRoute, type: "{ card_id: i64, expected_generation: i64, action: Affirm { surviving_routes: Vec<RouteKey> } }" }
            - { name: GroupIdentity, type: "{ card_id: i64, expected_generation: i64, action: AttachOrMerge { anchor: WorkId } | DifferentFromAll }" }
            - { name: FieldResolution, type: "{ card_id: i64, expected_generation: i64, action: ChoosePreservedValue { evidence_id: i64 } | ExplicitAbsence }" }
            - { name: ContributorOrder, type: "{ card_id: i64, expected_generation: i64, partition: Vec<ContributorPartition>, order: Vec<AuthorRef>, primary: AuthorRef }" }
            - { name: EditionEvidence, type: "{ card_id: i64, expected_generation: i64, action: ChooseDirectEvidence { evidence_id: i64 } | RetainUnknownOrAbsent | ArchiveEmptyShell }" }
            - { name: ImportIdentity, type: "{ card_id: i64, expected_generation: i64, action: CorrectedMetadataRetry { evidence: IdentityEvidenceBundle } | ResolvingIdentifier { route: RouteKey } | ExplicitIdentityOrMinimum { choice: ImportIdentityChoice } }" }
            - { name: MigrationRepair, type: "{ card_id: i64, expected_generation: i64, action: CorrectTypedValue { route: RouteKey } | AssignScopeAndOwner { route: RouteKey, owner: RouteOwner } | DiscardProvenNonIdentity { reason: String } }" }
            - { name: InvariantRepair, type: "{ card_id: i64, expected_generation: i64, action: Recompute | SupplyMissingReference { reference: WorkReference } | DiscardMalformedDerivedRow { reason: String } }" }
        - kind: enum
          name: DoorKind
          fields:
            - { name: DirectAdd, type: unit }
            - { name: ManualImport, type: unit }
            - { name: ListImport, type: unit }
            - { name: AuthorMonitor, type: unit }
            - { name: SeriesMonitor, type: unit }
            - { name: ReadarrImport, type: unit }
        - kind: enum
          name: IdentityRoadOrigin
          fields:
            - { name: CreationDoor, type: DoorKind }
            - { name: EnrichmentPass, type: unit }
            - { name: ManualRefresh, type: unit }
            - { name: ConvergenceVisit, type: unit }
        - kind: struct
          name: IdentityEvidenceBundle
          fields:
            - { name: user_choice, type: "Option<UserIdentityChoice>" }
            - { name: owned_files, type: "Vec<OwnedFileEvidence>" }
            - { name: provider_identity, type: "Vec<ProviderIdentityEvidence>" }
            - { name: minimum, type: "Option<MinimumWorkEvidence>" }
        - kind: struct
          name: IdentityRoadRequest
          fields:
            - { name: user_id, type: UserId }
            - { name: origin, type: IdentityRoadOrigin }
            - { name: evidence, type: IdentityEvidenceBundle }
            - { name: interaction, type: "HumanWatching | MachineAlone" }
            - { name: existing_work_id, type: "Option<WorkId>" }
        - kind: enum
          name: IdentityRoadOutcome
          fields:
            - { name: Settled, type: "{ work_id: WorkId, created: bool, routes: Vec<WorkRoute>, status: IdentityStatus }" }
            - { name: ReviewPending, type: "{ review_id: i64, kind: ReviewKind, unattached: bool }" }
            - { name: Deferred, type: "{ reason: DeferReason }" }
            - { name: Rejected, type: "{ reason: IdentityRoadError }" }
        - kind: struct
          name: LostMatchGuardSet
          fields:
            - { name: one_sided_subtitle_recovery, type: bool }
            - { name: shared_edition_id_confirmation, type: bool }
            - { name: translation_same_text_signals, type: "Set<SampledSignalId>" }
        - kind: struct
          name: WrongMergeGuardSet
          fields:
            - { name: main_title_guard, type: MainTitleGuard }
            - { name: volume_conflict_guard, type: bool }
            - { name: author_disagreement_guard, type: bool }
            - { name: work_key_contradiction_guard, type: bool }
            - { name: audited_different_text_guard, type: bool }
        - kind: opaque
          name: SampledTextSignal
          fields:
            - { name: probe_id, type: "private PROBE-ST006-E" }
            - { name: provider_path, type: "private String" }
            - { name: class, type: "private Translation | Abridgement | Adaptation | StudyGuide | Omnibus" }
          construction: "Only provider adapters backed by the accepted PROBE-ST006-E registry can construct this non-Deserialize capability."
        - kind: opaque
          name: AliasEquivalenceProof
          fields:
            - { name: provider, type: "private IdentityProvider" }
            - { name: work_ids, type: "private nonempty set" }
            - { name: probe_id, type: "private PROBE-ST006-F" }
          construction: "Only an adapter arm backed by accepted PROBE-ST006-F evidence can construct this non-Deserialize capability."
        - kind: enum
          name: TextIdentityVerdict
          fields:
            - { name: SameText, type: SampledTextSignal }
            - { name: DifferentText, type: SampledTextSignal }
            - { name: ReviewRequired, type: unit }
        - kind: enum
          name: AuthorInheritanceOutcome
          fields:
            - { name: Linked, type: RouteWriteOutcome }
            - { name: F1ReviewCandidate, type: AuthorLinkCandidate }
            - { name: NoAuthorId, type: unit }
        - kind: enum
          name: EmbeddedCoverInspectionResult
          fields:
            - { name: Extracted, type: "{ revision: FileRevision, bytes: Vec<u8>, media_type: String }" }
            - { name: VerifiedNoCover, type: "{ revision: FileRevision }" }
            - { name: CouldNotInspect, type: "{ revision: FileRevision, error: InspectionError }" }
            - { name: FileGone, type: unit }
        - kind: struct
          name: EmbeddedCoverInspectionRecord
          fields:
            - { name: user_id, type: UserId }
            - { name: library_item_id, type: LibraryItemId }
            - { name: revision, type: FileRevision }
            - { name: outcome, type: "Extracted | VerifiedNoCover | CouldNotInspect | FileGone" }
            - { name: cover_candidate_id, type: "Option<i64>; points to retained materialized candidate, never stores cover bytes" }
            - { name: sanitized_error_code, type: "Option<String>" }
            - { name: inspected_at, type: "DateTime<Utc>" }
        - kind: enum
          name: CoverPlaceholderState
          fields:
            - { name: FormatNeeded, type: "{ candidates: Vec<CoverCandidate> }" }
            - { name: NowhereToLook, type: unit }
            - { name: Searching, type: unit }
            - { name: NoCoverFound, type: unit }
        - kind: struct
          name: IdentityMigrationReport
          fields:
            - { name: source_schema_version, type: "u32; schema version of the frozen legacy-source snapshot used by rehearsal and pre-activation comparison" }
            - { name: source_fingerprint, type: "[u8; 32]; fingerprint only of the frozen legacy-source domain, excluding staged and resolution rows" }
            - { name: canonical_output_fingerprint, type: "[u8; 32]; rehearsal value on snapshot reports, recomputed fresh from the resolved graph on the activation report" }
            - { name: mapped_route_count, type: u64 }
            - { name: edition_count, type: u64 }
            - { name: repair_cards, type: u64 }
            - { name: group_cards, type: u64 }
            - { name: field_cards, type: u64 }
            - { name: contributor_cards, type: u64 }
            - { name: index_ready, type: bool }
            - { name: trivially_empty, type: bool }
            - { name: legacy_work_count, type: u64 }
      functions:
        - name: "IdentityRoadService::settle"
          inputs:
            - { name: request, type: IdentityRoadRequest }
          output: "Result<IdentityRoadOutcome, IdentityRoadError>"
          errors: [InvalidDoorEvidence, StaleGeneration, Database, ProviderBoundary]
        - name: "IdentityRoadService::resolve_review"
          inputs:
            - { name: actor, type: ReviewActor }
            - { name: command, type: ReviewResolutionCommand }
          output: "Result<IdentityRoadOutcome, IdentityRoadError>"
          errors: [NotFound, ReviewKindMismatch, UnauthorizedScope, StaleGeneration, InvalidResolution, Cancelled, Database]
        - name: "WorkIdentityRepository::read_captured_identity"
          inputs: [{ name: user_id, type: UserId }, { name: work_id, type: WorkId }]
          output: "Result<CapturedIdentity, IdentityRepositoryError>"
          errors: [NotFound, Database]
        - name: "WorkIdentityRepository::commit_settlement"
          inputs: [{ name: command, type: SettlementCommit }]
          output: "Result<SettlementCommitOutcome, IdentityRepositoryError>"
          errors: [StaleGeneration, RouteOwnershipCollision, KeyCollision, Database]
        - name: "WorkIdentityRepository::resolve_conflict_atomically"
          inputs: [{ name: command, type: ResolveIdentityConflictCommand }]
          output: "Result<CapturedIdentity, IdentityRepositoryError>"
          errors: [NotFound, StillAmbiguous, StaleGeneration, Database]
        - name: "EditionRepository::apply_evidence"
          inputs: [{ name: command, type: EditionEvidenceCommand }]
          output: "Result<EditionEvidenceOutcome, EditionRepositoryError>"
          errors: [ContradictoryEvidenceParked, RouteOwnershipCollision, Database]
        - name: "IdentityCutoverService::rehearse"
          inputs: [{ name: snapshot, type: SnapshotDatabase }, { name: cancel, type: CancellationToken }]
          output: "Result<IdentityMigrationReport, IdentityMigrationError>"
          errors: [NotSnapshot, SchemaMismatch, Cancelled, Database]
        - name: "IdentityCutoverService::apply"
          inputs: [{ name: approved_report, type: IdentityMigrationReport }, { name: cancel, type: CancellationToken }]
          output: "Result<IdentityMigrationReport, IdentityMigrationError>; first Apply may stage typed rows/cards and return Blocked. Rerun Apply upserts/reuses staged rows by stable typed key, treats committed resolutions as authoritative, and never re-derives over or re-inserts either. Before zero-blocker activation it compares only source_schema_version plus legacy source_fingerprint with the approved report, then recomputes canonical_output_fingerprint fresh for the activation report."
          errors: [RehearsalMismatch, Collision, Cancelled, Database]
        - name: "IdentityCutoverService::ensure_authority_ready"
          inputs: [{ name: cancel, type: CancellationToken }]
          output: "Result<IdentityAuthorityReadiness, IdentityMigrationError>; Active for an existing marker, ActivatedFresh only after a transaction proves works and all legacy identity/review sources empty, CutoverRequired for any non-empty inactive database"
          errors: [Collision, Cancelled, Database]
        - name: "title_parts_from_provider"
          inputs: [{ name: provider_title, type: String }, { name: structured_subtitle, type: "Option<String>" }]
          output: IdentityTitleTuple
          errors: [InvalidMainTitle]
        - name: "evaluate_match"
          inputs: [{ name: left, type: WorkIdentityEvidence }, { name: right, type: WorkIdentityEvidence }, { name: lost_match, type: LostMatchGuardSet }, { name: wrong_merge, type: WrongMergeGuardSet }]
          output: "DirectionalMatchVerdicts"
          errors: []
        - name: "select_machine_subtitle"
          inputs: [{ name: user_id, type: UserId }, { name: work_id, type: WorkId }, { name: editions, type: "Vec<Edition>" }, { name: defaults, type: "Vec<DefaultEdition>" }]
          output: MachineSubtitleProjection
          errors: []
        - name: "select_covers_and_placeholders"
          inputs: [{ name: identity, type: CapturedIdentity }, { name: _editions, type: "Vec<Edition>; retained by the ratified signature but intentionally unused" }, { name: candidates, type: "Vec<CoverCandidate>" }]
          output: WorkCoverPresentation
          errors: []

  - name: livrarr-db
    responsibility: "Own every SQL statement and migration; implement domain repositories for routes, editions, settlement, atomic transfers, projections, covers, reviews, merge/archive, and snapshot-gated activation."
    requirements: [REQ-001, REQ-002, REQ-003, REQ-004, REQ-005, REQ-006, REQ-007, REQ-012, REQ-013, REQ-014, REQ-015, REQ-016, REQ-017, REQ-018, REQ-019, REQ-020, REQ-021, REQ-022, REQ-023, REQ-024, REQ-025, REQ-026]
    dependencies: [livrarr-domain]
    blocking_probes: []
    public_api:
      types:
        - kind: struct
          name: LegacyIdentityFixture
          fields:
            - { name: works_and_authors, type: "Vec<LegacyWorkFixture>" }
            - { name: legacy_routes_ledgers_and_reviews, type: "LegacyIdentityRows" }
            - { name: legacy_badge_route_matrix, type: "Vec<LegacyBadgeRouteCase>" }
            - { name: monitoring_flags, type: "Vec<LegacyMonitoringFixture>" }
        - kind: struct
          name: PreCutoverIdentityTestDb
          fields:
            - { name: db, type: "SqliteDb; test-only access, marker guaranteed NotRun/inactive" }
        - kind: struct
          name: IdentityRouteRow
          fields:
            - { name: user_id, type: UserId }
            - { name: work_id, type: "Option<WorkId>" }
            - { name: edition_id, type: "Option<EditionId>" }
            - { name: provider, type: String }
            - { name: kind, type: String }
            - { name: route_value, type: String }
            - { name: state, type: String }
        - kind: struct
          name: IdentityCutoverRun
          fields:
            - { name: id, type: i64 }
            - { name: scope, type: "InstallationWide; contains no per-user payload" }
            - { name: mode, type: "Rehearsal | Apply" }
            - { name: branch, type: "Snapshot | TriviallyEmpty" }
            - { name: source_fingerprint, type: "[u8; 32]" }
            - { name: output_fingerprint, type: "[u8; 32]" }
            - { name: status, type: "Running | Blocked | Ready | Activated | Failed" }
            - { name: report, type: IdentityMigrationReport }
      functions:
        - name: "SqliteDb::commit_settlement"
          inputs: [{ name: command, type: SettlementCommit }]
          output: "Result<SettlementCommitOutcome, IdentityRepositoryError>"
          errors: [StaleGeneration, RouteOwnershipCollision, KeyCollision, Database]
        - name: "SqliteDb::transfer_route"
          inputs: [{ name: command, type: TransferRouteCommand }]
          output: "Result<CapturedIdentity, IdentityRepositoryError>"
          errors: [NotFound, StillAmbiguous, AtomicRollback, Database]
        - name: "SqliteDb::recompute_work_projections"
          inputs: [{ name: work_id, type: WorkId }, { name: expected_generation, type: i64 }]
          output: "Result<WorkProjectionSnapshot, IdentityRepositoryError>"
          errors: [StaleGeneration, Database]
        - name: "SqliteDb::record_embedded_cover_inspection"
          inputs: [{ name: record, type: EmbeddedCoverInspectionRecord }]
          output: "Result<(), IdentityRepositoryError>; upserts only the exact user/item/FileRevision key and never persists extracted bytes"
          errors: [StaleGeneration, Database]
        - name: "SqliteDb::read_embedded_cover_inspection"
          inputs: [{ name: user_id, type: UserId }, { name: library_item_id, type: LibraryItemId }, { name: revision, type: FileRevision }]
          output: "Result<Option<EmbeddedCoverInspectionRecord>, IdentityRepositoryError>"
          errors: [Database]
        - name: "SqliteDb::run_identity_cutover"
          inputs: [{ name: mode, type: IdentityCutoverMode }, { name: approved_report, type: "Option<IdentityMigrationReport>" }]
          output: "Result<IdentityMigrationReport, IdentityMigrationError>; Apply may commit only deterministic staged new rows/cards and return Blocked. A rerun idempotently upserts/revalidates those typed-key rows plus authoritative resolution records; it neither collides with its own rows nor recreates resolved cards. Activation checks approved source_schema_version and frozen legacy source_fingerprint, not the old canonical output, then records a freshly recomputed canonical_output_fingerprint before committing the marker/index."
          errors: [NotSnapshot, RehearsalMismatch, Collision, Database]
        - name: "SqliteDb::ensure_identity_authority_ready"
          inputs: []
          output: "Result<IdentityAuthorityReadiness, IdentityMigrationError>"
          errors: [Collision, Database]
        - name: "test_helpers::create_pre_cutover_identity_test_db"
          inputs: [{ name: fixture, type: LegacyIdentityFixture }]
          output: "PreCutoverIdentityTestDb; #[cfg(any(test, feature = \"test-helpers\"))], real single-connection SQLite :memory:, migrations 082/083 applied, marker inactive, readiness never called"
          errors: [InvalidFixture, Database]

  - name: livrarr-external-data
    responsibility: "Fetch and normalize existing-provider work, edition, contributor-id, cover, text-signal, alias, and Goodreads work-id evidence; fail closed on every unsampled or drifting shape."
    requirements: [REQ-003, REQ-004, REQ-005, REQ-006, REQ-011, REQ-013, REQ-014, REQ-025]
    dependencies: [livrarr-domain, livrarr-http]
    blocking_probes: [PROBE-ST006-A, PROBE-ST006-B, PROBE-ST006-C, PROBE-ST006-D, PROBE-ST006-E, PROBE-ST006-F]
    public_api:
      types:
        - kind: struct
          name: NormalizedWorkIdentityEvidence
          fields:
            - { name: provider, type: IdentityProvider }
            - { name: work_routes, type: "Vec<ProviderRouteEvidence>" }
            - { name: editions, type: "Vec<NormalizedEditionEvidence>" }
            - { name: contributors, type: "Vec<ProviderContributorEvidence>" }
            - { name: text_signals, type: "Vec<SampledTextSignal>" }
            - { name: alias_proof, type: "Option<AliasEquivalenceProof>" }
        - kind: enum
          name: ProviderEvidenceError
          fields:
            - { name: NotConfigured, type: unit }
            - { name: Retryable, type: String }
            - { name: Permanent, type: String }
            - { name: LayoutDrift, type: String }
            - { name: ProbeBlocked, type: ProbeId }
      functions:
        - name: "IdentityProviderGateway::fetch_by_route"
          inputs: [{ name: route, type: WorkRoute }, { name: priority, type: RequestPriority }]
          output: "Result<NormalizedWorkIdentityEvidence, ProviderEvidenceError>"
          errors: [NotConfigured, Retryable, Permanent, LayoutDrift, ProbeBlocked]
        - name: "GoodreadsAdapter::capture_work_route_from_fetched_book_page"
          inputs: [{ name: fetched_page, type: GoodreadsBookPage }]
          output: "Result<Option<ProviderRouteEvidence>, ProviderEvidenceError>"
          errors: [LayoutDrift, ProbeBlocked]

  - name: livrarr-identity
    responsibility: "Orchestrate route-aware deterministic identity decisions, conflict classification, P8 review/classification, and GR work-id capture using only domain traits and provider evidence; own no SQL and call no enrichment API."
    requirements: [REQ-001, REQ-006, REQ-007, REQ-008, REQ-009, REQ-011, REQ-012, REQ-013, REQ-018, REQ-019, REQ-020, REQ-021, REQ-023, REQ-024, REQ-025]
    dependencies: [livrarr-domain, livrarr-external-data, livrarr-http]
    blocking_probes: [PROBE-ST006-E, PROBE-ST006-F]
    public_api:
      types:
        - kind: struct
          name: IdentityDecision
          fields:
            - { name: match_verdicts, type: DirectionalMatchVerdicts }
            - { name: conflict, type: "Option<ParkedRouteCandidate>" }
            - { name: text_verdict, type: TextIdentityVerdict }
            - { name: settlement, type: "Decide | Review | Defer" }
      functions:
        - name: "IdentityEngine::decide"
          inputs: [{ name: request, type: IdentityDecisionRequest }]
          output: "Result<IdentityDecision, IdentityEngineError>"
          errors: [ProbeBlocked, InvalidEvidence]
        - name: "IdentityEngine::classify_route_conflict"
          inputs: [{ name: existing, type: CapturedIdentity }, { name: candidate, type: ProviderRouteEvidence }]
          output: "Option<IdentityConflictClass>"
          errors: []

  - name: livrarr-enrichment
    responsibility: "Derive provider queries from the closed usable-route list, persist normalized work/edition facts through domain repository APIs, return captured route evidence to its livrarr-metadata caller, delete private title/cover recipes, and recompute subtitle/cover presentation without writing identity routes."
    requirements: [REQ-003, REQ-004, REQ-005, REQ-006, REQ-010, REQ-012, REQ-013, REQ-014, REQ-016, REQ-017]
    dependencies: [livrarr-domain, livrarr-external-data, livrarr-db, livrarr-http]
    blocking_probes: [PROBE-ST006-B, PROBE-ST006-C]
    public_api:
      types:
        - kind: struct
          name: RouteEnrichmentPlan
          fields:
            - { name: usable_routes, type: "Vec<WorkRoute>" }
            - { name: provider_calls, type: "Vec<RouteProviderCall>" }
            - { name: manual_search_only, type: bool }
        - kind: struct
          name: WorkPresentationProjection
          fields:
            - { name: subtitle, type: MachineSubtitleProjection }
            - { name: covers, type: WorkCoverPresentation }
        - kind: struct
          name: EnrichmentApplyOutcome
          fields:
            - { name: metadata_generation, type: i64 }
            - { name: captured_route_evidence, type: "Vec<ProviderRouteEvidence>; includes readable Goodreads work id from the already-fetched book page" }
            - { name: presentation, type: WorkPresentationProjection }
      functions:
        - name: "EnrichmentService::plan_from_routes"
          inputs: [{ name: identity, type: CapturedIdentity }]
          output: RouteEnrichmentPlan
          errors: []
        - name: "EnrichmentService::apply_provider_evidence"
          inputs: [{ name: work_id, type: WorkId }, { name: evidence, type: NormalizedWorkIdentityEvidence }]
          output: "Result<EnrichmentApplyOutcome, EnrichmentError>"
          errors: [StaleGeneration, ProviderDrift, Database]

  - name: livrarr-matching
    responsibility: "Replace V5/V8 dedup and V7 fast-cover title comparisons with adapters over livrarr-domain matching primitives; own no independent sameness recipe."
    requirements: [REQ-008, REQ-010]
    dependencies: [livrarr-domain]
    blocking_probes: []
    public_api:
      types: []
      functions:
        - name: "find_matching_work"
          inputs: [{ name: authority_inputs, type: WorkMatchAuthorityInputs }]
          output: "MatchAuthorityOutcome"
          errors: []

  - name: livrarr-metadata
    responsibility: "Implement the single identity road, P5 door orchestration, Readarr precedence, group reconciliation/merge, author-route inheritance, review continuations, route-driven refresh, the enrichment/manual-refresh/convergence route-evidence handoff, and atomic presentation recomputation."
    requirements: [REQ-001, REQ-002, REQ-003, REQ-004, REQ-005, REQ-006, REQ-007, REQ-008, REQ-009, REQ-010, REQ-011, REQ-012, REQ-013, REQ-014, REQ-015, REQ-016, REQ-017, REQ-018, REQ-019, REQ-020, REQ-021, REQ-022, REQ-023, REQ-024, REQ-025, REQ-026]
    dependencies: [livrarr-domain, livrarr-http, livrarr-db, livrarr-matching, livrarr-external-data, livrarr-identity, livrarr-enrichment, livrarr-materialize]
    blocking_probes: [PROBE-ST006-A, PROBE-ST006-B, PROBE-ST006-D, PROBE-ST006-E, PROBE-ST006-F]
    public_api:
      types:
        - kind: struct
          name: IdentityRoadServiceImpl
          fields:
            - { name: identity_engine, type: "generic livrarr-identity implementation" }
            - { name: identity_repository, type: "generic WorkIdentityRepository" }
            - { name: edition_repository, type: "generic EditionRepository" }
            - { name: author_link_workflow, type: "generic AuthorLinkWorkflow" }
        - kind: struct
          name: CompleteGroupReconciliation
          fields:
            - { name: broad_main_author_candidates, type: "Vec<WorkId>" }
            - { name: exact_tuple_author_group, type: "Vec<WorkId>" }
            - { name: pairwise_outcomes, type: "Vec<PairwiseIdentityOutcome>" }
            - { name: action, type: "AutoMerge | CommitDifferent | Review" }
      functions:
        - name: "IdentityRoadServiceImpl::settle"
          inputs: [{ name: request, type: IdentityRoadRequest }]
          output: "Result<IdentityRoadOutcome, IdentityRoadError>"
          errors: [InvalidDoorEvidence, StaleGeneration, ProviderBoundary, Database]
        - name: "IdentityRoadServiceImpl::reconcile_complete_group"
          inputs: [{ name: candidate, type: ProposedWorkIdentity }]
          output: "Result<CompleteGroupReconciliation, IdentityRoadError>"
          errors: [ReviewRequired, ProbeBlocked, Database]
        - name: "IdentityRoadServiceImpl::inherit_primary_author_route"
          inputs: [{ name: settled_work, type: CapturedIdentity }, { name: author_evidence, type: "Option<ProviderAuthorRef>" }]
          output: "Result<AuthorInheritanceOutcome, AuthorLinkError>; Linked when F1 guard agrees, F1ReviewCandidate when it rejects, NoAuthorId when absent/unreadable"
          errors: [Database]
        - name: "IdentityRoadServiceImpl::apply_captured_enrichment_routes"
          inputs: [{ name: user_id, type: UserId }, { name: work_id, type: WorkId }, { name: trigger, type: "EnrichmentPass | ManualRefresh | ConvergenceVisit" }, { name: outcome, type: EnrichmentApplyOutcome }]
          output: "Result<IdentityRoadOutcome, IdentityRoadError>; resubmits outcome.captured_route_evidence through settle with the named existing-work origin"
          errors: [InvalidDoorEvidence, StaleGeneration, ProviderBoundary, Database]
        - name: "IdentityRoadServiceImpl::resolve_review"
          inputs: [{ name: actor, type: ReviewActor }, { name: command, type: ReviewResolutionCommand }]
          output: "Result<IdentityRoadOutcome, IdentityRoadError>; validates card kind, scope, allowed action, and expected generation, then persists continuation plus actor audit atomically"
          errors: [NotFound, ReviewKindMismatch, UnauthorizedScope, StaleGeneration, Cancelled, Database]

  - name: livrarr-library
    responsibility: "Inspect owned EPUB revisions in spawn_blocking, persist every four-way outcome by user/library item/FileRevision, and feed extracted cover evidence into the shared road without provider traffic. Before background inspection, read the durable record and suppress an unchanged CouldNotInspect retry; an explicit force or changed revision may retry. Persist the sanitized outcome and retained candidate reference in the same local workflow transaction before returning; extracted bytes flow to materialization and never into the inspection row."
    requirements: [REQ-002, REQ-005, REQ-014, REQ-015, REQ-016, REQ-019]
    dependencies: [livrarr-domain, livrarr-db]
    blocking_probes: [PROBE-ST007-EPUB]
    public_api:
      types:
        - kind: struct
          name: EpubCoverInspector
          fields:
            - { name: max_uncompressed_bytes, type: u64 }
            - { name: max_entries, type: u32 }
      functions:
        - name: "EmbeddedCoverInspector::inspect_revision"
          inputs: [{ name: item, type: LibraryItem }, { name: revision, type: FileRevision }, { name: force, type: bool }]
          output: "Result<EmbeddedCoverInspectionResult, InspectionServiceError>; reads the durable exact-revision record first, performs zero provider requests, and persists Extracted/VerifiedNoCover/CouldNotInspect/FileGone before return"
          errors: [Database, Cancelled]

  - name: livrarr-materialize
    responsibility: "Write selected cover bytes and tags through the existing single save port; trust grades disappear, source labels survive, and tags read the primary author record's display name at write time."
    requirements: [REQ-002, REQ-014, REQ-015, REQ-017, REQ-020, REQ-023]
    dependencies: [livrarr-domain, livrarr-http, livrarr-tagwrite]
    blocking_probes: []
    public_api:
      types:
        - kind: struct
          name: MaterializeIdentityRequest
          fields:
            - { name: work_id, type: WorkId }
            - { name: primary_author_display_name, type: String }
            - { name: selected_covers, type: WorkCoverSelection }
            - { name: tags, type: MaterializeTags }
      functions:
        - name: "MaterializeService::materialize"
          inputs: [{ name: request, type: MaterializeRequest }]
          output: "Result<MaterializeOutcome, MaterializeError>"
          errors: [CoverDownload, TagWrite]

  - name: livrarr-handlers
    responsibility: "Expose narrow capability-bound HTTP doors and review/manual-search/cover actions; validate requests, call domain traits, and map outcomes without SQL or orchestration."
    requirements: [REQ-002, REQ-007, REQ-012, REQ-013, REQ-016, REQ-017, REQ-018, REQ-019, REQ-021, REQ-022, REQ-023, REQ-024]
    dependencies: [livrarr-domain, livrarr-http, livrarr-matching, livrarr-jobs]
    blocking_probes: []
    public_api:
      types:
        - kind: trait
          name: HasIdentityRoadService
          fields:
            - { name: identity_road_service, type: "&S where S: IdentityRoadService" }
      functions:
        - name: "identity_review::resolve"
          inputs: [{ name: request, type: ReviewResolutionRequest }]
          output: "Json<IdentityRoadOutcome>"
          errors: [BadRequest, Conflict, NotFound, Internal]
        - name: "work::manual_provider_search"
          inputs: [{ name: _work_id, type: "WorkId; route path retained but not consumed by the ratified read-only candidate search" }, { name: query, type: TitleAuthorQuery }]
          output: "Json<Vec<ProviderIdentityCandidate>>"
          errors: [BadRequest, NotFound, ProviderUnavailable]

  - name: livrarr-server
    responsibility: "Compose concrete generic services, wire every server-owned machine door to the identity-road capability, run cancellation-aware convergence/probes, and invoke snapshot/apply cutover modes explicitly."
    requirements: [REQ-006, REQ-013, REQ-015, REQ-018, REQ-019, REQ-025, REQ-026]
    dependencies: [livrarr-domain, livrarr-http, livrarr-db, livrarr-matching, livrarr-external-data, livrarr-identity, livrarr-enrichment, livrarr-metadata, livrarr-library, livrarr-materialize, livrarr-jobs, livrarr-handlers]
    blocking_probes: [PROBE-ST006-A, PROBE-ST006-B, PROBE-ST006-C, PROBE-ST006-D, PROBE-ST006-E, PROBE-ST006-F, PROBE-ST007-EPUB]
    public_api:
      types:
        - kind: struct
          name: IdentityLayerComposition
          fields:
            - { name: identity_road, type: "Arc<IdentityRoadServiceImpl<...>>" }
            - { name: cutover, type: "Arc<IdentityCutoverServiceImpl<...>>" }
            - { name: epub_inspector, type: "Arc<EpubCoverInspector>" }
        - kind: enum
          name: IdentityCutoverCliCommand
          fields:
            - { name: Rehearse, type: "{ snapshot: PathBuf }" }
            - { name: ListReviews, type: unit }
            - { name: ShowReview, type: "{ card_id: i64 }" }
            - { name: ResolveReview, type: "{ card_id: i64, expected_generation: i64, action_file: PathBuf }" }
            - { name: Apply, type: "{ approved_report: PathBuf }" }
        - kind: enum
          name: IdentityCutoverCliOutcome
          fields:
            - { name: Report, type: IdentityMigrationReport }
            - { name: ReviewList, type: "Vec<CutoverReviewSummary>" }
            - { name: ReviewDetail, type: CutoverReviewDetail }
            - { name: ReviewResolved, type: IdentityRoadOutcome }
      functions:
        - name: "run_identity_convergence_tick"
          inputs: [{ name: cancel, type: CancellationToken }]
          output: "Result<IdentityConvergenceReport, JobError>"
          errors: [Cancelled, Database]
        - name: "run_identity_cutover_command"
          inputs: [{ name: command, type: IdentityCutoverCliCommand }, { name: data_dir, type: PathBuf }, { name: cancel, type: CancellationToken }]
          output: "Result<IdentityCutoverCliOutcome, IdentityCutoverCommandError>; list/show/resolve operate only under the local exclusive CutoverOperator actor and ResolveReview parses a kind-matched ReviewResolutionCommand before calling the shared road continuation"
          errors: [NotSnapshot, RehearsalMismatch, ReviewKindMismatch, StaleGeneration, InvalidActionFile, Cancelled, Database]
        - name: "ensure_identity_authority_ready_before_serve"
          inputs: [{ name: db, type: SqliteDb }]
          output: "Result<IdentityAuthorityReadiness, StartupError>; production-only wrapper called by init_database after migrations and before repositories/HTTP/jobs; delegates to SqliteDb::ensure_identity_authority_ready. create_test_db calls the DB method directly, so there is no livrarr-db -> livrarr-server call."
          errors: [CutoverRequired, Database]

  - name: livrarr-behavioral
    responsibility: "Provide trait+impl+stub behavioral harnesses, six-door gate rows, direction-isolation fixtures, migration repeatability, atomic transfer, merge-field, cover, Readarr, and tree-wide edition-id comparison enumeration tests."
    requirements: [REQ-001, REQ-002, REQ-003, REQ-004, REQ-005, REQ-006, REQ-007, REQ-008, REQ-009, REQ-010, REQ-011, REQ-012, REQ-013, REQ-014, REQ-015, REQ-016, REQ-017, REQ-018, REQ-019, REQ-020, REQ-021, REQ-022, REQ-023, REQ-024, REQ-025, REQ-026]
    dependencies: [livrarr-domain, livrarr-http, livrarr-db, livrarr-matching, livrarr-external-data, livrarr-identity, livrarr-enrichment, livrarr-metadata, livrarr-library, livrarr-tagwrite, livrarr-materialize, livrarr-jobs, livrarr-handlers]
    blocking_probes: [PROBE-ST006-A, PROBE-ST006-B, PROBE-ST006-C, PROBE-ST006-D, PROBE-ST006-E, PROBE-ST006-F, PROBE-ST007-EPUB]
    public_api:
      types:
        - kind: struct
          name: StubIdentityRoadService
          fields:
            - { name: requests, type: "Arc<Mutex<Vec<IdentityRoadRequest>>>" }
            - { name: outcomes, type: "VecDeque<IdentityRoadOutcome>" }
      functions: []

  - name: frontend
    responsibility: "Render the connectedness vocabulary, route/edition provenance, all review cards, one shared format-needed panel plus three slot states, source-only cover labels, manual search, and informational sibling state."
    requirements: [REQ-002, REQ-007, REQ-012, REQ-013, REQ-014, REQ-016, REQ-017, REQ-019, REQ-021, REQ-022, REQ-023, REQ-024]
    dependencies: []
    blocking_probes: []
    public_api:
      types:
        - kind: enum
          name: IdentityBadge
          fields:
            - { name: userConfirmed, type: unit }
            - { name: connected, type: unit }
            - { name: notConnected, type: unit }
        - kind: struct
          name: WorkCoverUiState
          fields:
            - { name: formatNeeded, type: "FormatNeededPanel | null" }
            - { name: ebook, type: CoverSlotUiState }
            - { name: audiobook, type: CoverSlotUiState }
      functions: []

