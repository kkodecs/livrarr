data_flow:
  sources:
    - { entity: Work, origin: user-input, description: "Explicit identity choice or minimum title plus at least one author through a human-watching door." }
    - { entity: Work, origin: provider-evidence, description: "Provider work record through author/series monitor or a route-bearing door; no provider is required for existence." }
    - { entity: Edition, origin: file, description: "Owned-file ISBN/ASIN, format/language, subtitle, and embedded EPUB cover; identifiers without direct format/language remain unknown/absent." }
    - { entity: Edition, origin: http-api, description: "Normalized provider edition evidence after its capture probe; every edition attaches to exactly one Work." }
    - { entity: WorkRoute, origin: user-input, description: "Explicit candidate pick or manual route action, top evidence in P5." }
    - { entity: WorkRoute, origin: file, description: "Embedded ISBN/ASIN attached to an edition and projected to its work." }
    - { entity: WorkRoute, origin: http-api, description: "Provider work/edition id from an already-fetched payload; GR work id capture adds no request." }
    - { entity: IdentityConflict, origin: identity-authority, description: "Exactly one of conflict classes A/B/C; candidate parks while uncontested evidence continues." }
    - { entity: EmbeddedCoverInspectionRecord, origin: file, description: "A four-way local inspection outcome tied to one user, library item, and exact FileRevision; extracted bytes are materialized separately." }
    - { entity: CapturedIdentity, origin: db-read, description: "Own WorkId, tuple, primary AuthorId, active route projection, badge, and generation read through the repository." }
  sinks:
    - { entity: WorkRoute, destination: sqlite, description: "identity_routes active/retired rows, one owner per id, with audit archive and per-user uniqueness." }
    - { entity: Edition, destination: sqlite, description: "Edition facts/defaults/covers and attached route ownership." }
    - { entity: IdentityConflict, destination: review-ui, description: "Pending candidate with accept/reject/different-work actions and explicit surviving route set." }
    - { entity: EmbeddedCoverInspectionRecord, destination: sqlite, description: "embedded_cover_inspections durably distinguishes extracted, verified absence, inspection failure, and file-gone for the exact revision; no cover bytes are stored." }
    - { entity: CapturedIdentity, destination: enrichment, description: "Only the route/status/title/author identity contract crosses to enrichment; no raw metadata payload." }
    - { entity: Work, destination: http-api, description: "Title main, rendered subtitle, author-record contributor display, connectedness badge, routes, editions, and cover state." }
    - { entity: Work, destination: filesystem, description: "Selected cover artifacts and tags carrying the primary author record's current display name at write time." }
    - { entity: HistoryEvent, destination: sqlite, description: "Append-only audited identity resolution, route transfer/retirement, review resolution, merge/archive, and cutover facts." }
  invariant_durability_sweep:
    entries:
      - { invariant: I01, subject: "own WorkId and nonempty contributors", durable_home: "works plus work_contributors" }
      - { invariant: I02, subject: "exactly-one route owner and edition-to-work projection", durable_home: "identity_routes XOR owner columns plus editions" }
      - { invariant: I03, subject: "per-user active route uniqueness and collision parking", durable_home: "identity_routes unique constraint plus identity_conflicts_v2/identity_route_archives" }
      - { invariant: I04, subject: "closed usable route kinds", durable_home: "RouteKind code-level closed enum/predicate; Undeclared rows remain stored in identity_routes but are ineligible, so no additional durable policy row is required" }
      - { invariant: I05, subject: "connectedness derives from active routes and confirmation provenance", durable_home: "works.identity_status projection plus identity_routes provenance; recomputation asserts agreement" }
      - { invariant: I06, subject: "captured title tuple is separate from display projection/defaults", durable_home: "works normalized identity tuple columns plus machine_subtitle_projections and work_default_editions" }
      - { invariant: I07, subject: "edition-id equality confirm-only and inequality no-evidence", durable_home: "pure matching contract and typed route scope; no independent runtime state" }
      - { invariant: I08, subject: "lost-match/wrong-merge guard separation", durable_home: "disjoint typed configuration and behavioral fixtures; no migration-082 table" }
      - { invariant: I09, subject: "ST006-E whose-text probe gate", durable_home: "accepted probe artifact/registry and opaque SampledTextSignal construction; not runtime database state" }
      - { invariant: I10, subject: "ST006-F alias proof gate", durable_home: "accepted probe artifact/registry and opaque AliasEquivalenceProof construction; not runtime database state" }
      - { invariant: I11, subject: "six-door settle chokepoint", durable_home: "compile-time wiring plus behavioral door matrix; settlement/audit outcomes persist through identity_audit_events" }
      - { invariant: I12, subject: "primary author is contributor ordinal zero", durable_home: "work_contributors" }
      - { invariant: I13, subject: "works.primary_author_id projection equality", durable_home: "works.primary_author_id plus work_contributors, transactionally asserted" }
      - { invariant: I14, subject: "user scope on every migration-082 type/table", durable_home: "the 20-row schema inventory and 22-row persisted-type audit in this IR plus schema constraints" }
      - { invariant: I15, subject: "legal crate dependency graph and sibling seam", durable_home: "dependency graph and contract rules; no runtime data" }
      - { invariant: I16, subject: "handler compile wall", durable_home: "module contract and compile-time dependency checks; no runtime data" }
      - { invariant: I17, subject: "cover rank/default/fallback", durable_home: "edition_cover_candidates, work_cover_selections, and work_default_editions" }
      - { invariant: I18, subject: "four-way local inspection outcome by FileRevision", durable_home: "embedded_cover_inspections and EmbeddedCoverInspectionRecord; candidate bytes remain outside the row" }
      - { invariant: I19, subject: "repeatable snapshot/trivially-empty activation and blocker zero", durable_home: "identity_cutover_runs, identity_cutover_reports, identity_review_cards, identity_conflicts_v2, and final index" }
      - { invariant: I20, subject: "one read/write authority event and no post-marker legacy consumers", durable_home: "_livrarr_meta authority marker, cutover run/audit rows, and enumerated startup/consumer guards" }
    completeness: "All twenty IR invariants were swept. Every fact requiring runtime durability has a named schema/type home; policy, dependency, probe-capability, and compile-wall invariants are deliberately enforced by code/artifacts/tests and do not invent database state. The only r2 gap was I18, closed by embedded_cover_inspections."
  state_machines:
    - entity: IdentityStatus
      states: [NotConnected, Connected, UserConfirmed]
      transitions:
        - { from: NotConnected, to: Connected, trigger: "first active route without user-confirmation provenance" }
        - { from: NotConnected, to: UserConfirmed, trigger: "explicit user choice creates/attaches the first surviving route" }
        - { from: Connected, to: UserConfirmed, trigger: "user confirms an active route" }
        - { from: UserConfirmed, to: Connected, trigger: "audited user action retires confirmed provenance while another active route survives" }
        - { from: Connected, to: NotConnected, trigger: "audited removal/transfer retires the last active route" }
        - { from: UserConfirmed, to: NotConnected, trigger: "audited removal/transfer retires the last active route" }
        - { from: UserConfirmed, to: NotConnected, trigger: "invariant repair observes zero routes; emits repair card" }
    - entity: WorkRoute
      states: [CandidateParked, Active, Retired, Rejected]
      transitions:
        - { from: CandidateParked, to: Active, trigger: "accept/different-work resolution atomically selects owner and surviving set" }
        - { from: CandidateParked, to: Rejected, trigger: "reject resolution" }
        - { from: Active, to: Retired, trigger: "audited displacement, transfer, removal, or same-work merge" }
        - { from: Retired, to: Active, trigger: "never; a later observation is a new candidate subject to archive suppression" }
    - entity: Edition
      states: [ActiveUnknown, ActiveKnown, EvidenceReview, Archived]
      transitions:
        - { from: ActiveUnknown, to: ActiveKnown, trigger: "direct payload/file evidence or explicit user format assignment" }
        - { from: ActiveUnknown, to: EvidenceReview, trigger: "contradictory direct format/language evidence" }
        - { from: ActiveKnown, to: EvidenceReview, trigger: "contradictory direct format/language evidence" }
        - { from: EvidenceReview, to: ActiveUnknown, trigger: "resolution retains unknown/absent" }
        - { from: EvidenceReview, to: ActiveKnown, trigger: "resolution chooses direct evidence" }
        - { from: EvidenceReview, to: Archived, trigger: "audited resolution discards the only candidate evidence and the route-less shell has no retained facts" }
        - { from: ActiveUnknown, to: Archived, trigger: "last route transferred from otherwise-empty shell" }
        - { from: ActiveKnown, to: Archived, trigger: "audited same-work merge/explicit archival; facts retained" }
    - entity: IdentityConflict
      states: [Pending, Accepted, Rejected, DifferentWork]
      transitions:
        - { from: Pending, to: Accepted, trigger: "audited accept naming surviving routes and target edition when needed" }
        - { from: Pending, to: Rejected, trigger: "audited reject; current graph intact" }
        - { from: Pending, to: DifferentWork, trigger: "audited ownership choice naming winner and surviving routes" }
    - entity: SubtitleOverride
      states: [Automatic, UserValue, UserAbsent]
      transitions:
        - { from: Automatic, to: UserValue, trigger: "explicit value edit; updates tuple and re-keys" }
        - { from: Automatic, to: UserAbsent, trigger: "explicit absence edit; updates tuple and re-keys" }
        - { from: UserValue, to: UserValue, trigger: "another explicit value edit" }
        - { from: UserValue, to: UserAbsent, trigger: "explicit absence edit" }
        - { from: UserValue, to: Automatic, trigger: "reset display override only; tuple unchanged" }
        - { from: UserAbsent, to: UserValue, trigger: "explicit value edit" }
        - { from: UserAbsent, to: Automatic, trigger: "reset display override only; tuple unchanged" }
    - entity: EmbeddedCoverInspectionResult
      states: [Uninspected, Extracted, VerifiedNoCover, CouldNotInspect, FileGone]
      transitions:
        - { from: Uninspected, to: Extracted, trigger: "inspect readable revision with embedded cover" }
        - { from: Uninspected, to: VerifiedNoCover, trigger: "inspect readable revision without cover" }
        - { from: Uninspected, to: CouldNotInspect, trigger: "malformed/encrypted/unreadable revision" }
        - { from: Uninspected, to: FileGone, trigger: "file disappears before or during its first inspection" }
        - { from: CouldNotInspect, to: Extracted, trigger: "changed revision or explicit retry succeeds with cover" }
        - { from: CouldNotInspect, to: VerifiedNoCover, trigger: "changed revision or explicit retry verifies absence" }
        - { from: CouldNotInspect, to: CouldNotInspect, trigger: "changed revision or explicit retry still fails; record refreshes" }
        - { from: Extracted, to: Extracted, trigger: "new file revision is inspected and contains a cover; replace the prior revision outcome" }
        - { from: Extracted, to: VerifiedNoCover, trigger: "new file revision is inspected and verifies absence" }
        - { from: Extracted, to: CouldNotInspect, trigger: "new file revision is malformed/encrypted/unreadable" }
        - { from: VerifiedNoCover, to: Extracted, trigger: "new file revision is inspected and now contains a cover" }
        - { from: VerifiedNoCover, to: VerifiedNoCover, trigger: "new file revision is inspected and again verifies absence" }
        - { from: VerifiedNoCover, to: CouldNotInspect, trigger: "new file revision is malformed/encrypted/unreadable" }
        - { from: Extracted, to: FileGone, trigger: "file removal" }
        - { from: VerifiedNoCover, to: FileGone, trigger: "file removal" }
        - { from: CouldNotInspect, to: FileGone, trigger: "file removal" }
        - { from: FileGone, to: Extracted, trigger: "replacement/new revision appears and inspection finds a cover" }
        - { from: FileGone, to: VerifiedNoCover, trigger: "replacement/new revision appears and inspection verifies absence" }
        - { from: FileGone, to: CouldNotInspect, trigger: "replacement/new revision appears but is malformed/encrypted/unreadable" }
    - entity: IdentityCutoverRun
      states: [NotRun, Rehearsed, Blocked, Ready, Activated, Failed]
      transitions:
        - { from: NotRun, to: Rehearsed, trigger: "first snapshot run" }
        - { from: NotRun, to: Activated, trigger: "shared startup guard proves a fresh/test database transactionally empty, records trivially-empty rehearsal, and immediately creates the new authority" }
        - { from: Rehearsed, to: Ready, trigger: "second identical run, zero unresolved cards" }
        - { from: Rehearsed, to: Blocked, trigger: "repair/group/field/contributor card exists" }
        - { from: Blocked, to: Blocked, trigger: "rerun Apply idempotently revalidates staged typed-key rows and authoritative committed resolutions but one or more cards remain" }
        - { from: Blocked, to: Ready, trigger: "all cards resolved, staged-state revalidation passes, and approved schema/legacy-source fingerprint still match" }
        - { from: Ready, to: Activated, trigger: "exclusive live apply creates final unique index" }
        - { from: NotRun, to: Failed, trigger: "schema/input/database failure" }
        - { from: Rehearsed, to: Failed, trigger: "non-repeatable output" }
        - { from: Blocked, to: Failed, trigger: "staged-state/resolution revalidation, source-schema/fingerprint comparison, or database operation fails" }
        - { from: Ready, to: Failed, trigger: "exclusive apply fails and its transaction rolls back before marker/index commit" }
        - { from: Failed, to: NotRun, trigger: "explicit operator retry after correcting the reported failure; immutable prior run remains audited" }
  transition_class_sweep:
    IdentityStatus: "All externally caused projection changes are explicit: first/last route, user confirmation, confirmed-provenance retirement, and invariant repair. Added the ordinary UserConfirmed -> NotConnected last-route edge."
    WorkRoute: "Candidate accept/reject and active audited retirement cover every allowed external lifecycle change. Retired/Rejected are immutable; a later observation creates a new CandidateParked row rather than reactivating either."
    Edition: "Direct evidence, contradictory evidence, review resolution, empty-shell transfer, and audited archival are explicit. Added the review-to-archive edge; Archived is immutable and later evidence creates/reuses an active edition only through explicit co-edition proof."
    IdentityConflict: "Pending has exactly the three audited exits. Accepted/Rejected/DifferentWork are immutable audit outcomes; retries are idempotent against the same resolved action."
    SubtitleOverride: "Every value-changing user action and reset is explicit. Repeating the same value/absence is an idempotent write, not a state change."
    EmbeddedCoverInspectionResult: "Every initial, revision-change, explicit-retry, removal, and replacement outcome is explicit. Added new-revision edges from both success outcomes, pre-first-inspection removal, and replacement edges from FileGone."
    IdentityCutoverRun: "Snapshot, blocked staging, idempotent Blocked -> Blocked revalidation with remaining cards, authoritative-resolution advancement to Ready, trivially-empty activation, apply/revalidation failure, and explicit operator retry are explicit. Activated is immutable."
  invariants:
    - "Every Work has an own WorkId anchor and at least one WorkContributor; zero provider routes is valid."
    - "An identity_routes row has exactly one owner: Work or Edition. Edition ownership resolves through exactly one Edition.work_id; no edition id is stored or written again at work scope."
    - "Within one user, one active (provider, kind, provider_scoped_id) resolves to at most one Work. A collision parks class C and changes no owner."
    - "The usable enrichment kinds are closed: OpenLibraryWork, GoodreadsWork, HardcoverWork, Isbn13Edition, AsinEdition, GoodreadsBookEdition."
    - "IdentityStatus is derived from active routes and user-confirmation provenance; conflict/review state never changes the connectedness vocabulary."
    - "IdentityTitleTuple is captured from P5-winning evidence. Machine subtitle projection, defaults, monitoring, and provider refresh never mutate it or its uniqueness key."
    - "Edition-id inequality is no evidence. Edition-id equality can confirm only inside the matching authority or migration mapping and can never be required."
    - "LostMatchGuardSet and WrongMergeGuardSet expose disjoint configuration/state; direction-specific fixtures prove tuning one cannot change the other."
    - "Before accepted PROBE-ST006-E, every whose-text classification returns ReviewRequired. No title keyword or LLM produces a match/class."
    - "Before accepted PROBE-ST006-F, every same-provider work-id disagreement is conflict class A."
    - "All six doors call one IdentityRoadService::settle entry and satisfy the typed door evidence matrix. Threading evidence into a WorkCandidate without that call is not wiring."
    - "The primary author is the first stored contributor at reference, uniqueness, tags, matching, and F1 inheritance; roles and incoming provider order never choose it."
    - "For every Work, works.primary_author_id equals the sole work_contributors row at ordinal zero. It is a derived indexed projection, never a second authority; contributor/order/projection changes and v2 key collision checks commit or roll back together."
    - "Every migration-082 user-scoped table/type carries user_id and every query filters by it. Only installation-wide cutover run/report rows omit user_id, and they contain fingerprints/counts rather than per-user identity payload."
    - "livrarr-identity has no livrarr-db edge; livrarr-identity and livrarr-enrichment are non-dependent siblings; route/edition SQL lives only in livrarr-db behind domain traits."
    - "livrarr-handlers keeps the compile wall and contains no business orchestration or SQL."
    - "Cover rank is user slot choice, owned-file same-format, default same-format edition, then another same-format edition; audiobook may explicitly fall back to selected ebook. Unknown format fills no slot."
    - "CouldNotInspect and VerifiedNoCover are distinct durable outcomes tied to FileRevision; an unchanged failure receives no background retry and every local inspection makes zero provider requests."
    - "Migration never edits 001-081. A non-empty database rehearses twice on copied real-library snapshots; a transactionally empty fresh/test database records the trivially-empty branch. Both create idx_works_identity_v2 only as the final activation write after zero unresolved cards/collisions."
    - "The authority marker is the shared read/write cutover event. A non-empty inactive database cannot bind HTTP or start jobs; after commit, every listed legacy uniqueness reader/writer is disabled and all production identity operations use the new road/index."
