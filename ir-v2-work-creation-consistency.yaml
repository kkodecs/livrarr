# ---------------------------------------------------------------------------
# Design-stage decisions (continue IR v1's D-001..D-012). PO-CONFIRM items are
# flagged for the PO's review; CC proceeded per delegated-internals authority and
# the cross-family review gate.
# ---------------------------------------------------------------------------
design_decisions:
  - id: D-013
    resolves: Q-001
    topic: "LLM identity-validation: synchronous gate vs background verify"
    choice: "BACKGROUND + CONDITIONAL. The synchronous create path resolves identity DETERMINISTICALLY only (shared-anchor / normalized title+author quorum, REQ-018) — no LLM call, so interactive paths return fully-formed without network latency (REQ-015, REQ-023, principle 15). LLM identity-validation runs as a background verify pass (in metadata-async-resolver), triggered ONLY when (a) an LLM is configured AND (b) the deterministic layer could not disambiguate (no shared anchor to compare, cross-axis reconcile, or a payload whose identity is suspect). If the background verify finds a mismatch it raises a Conflict (REQ-018/020) on the already-created Work, which pauses further automatic enrichment (REQ-025)."
    rationale: "Matches the PO's stated lean (Q-001: 'background + conditional, only when harvested anchors disagree'). REQ-017 mandates deterministic merge without an LLM; REQ-018 already says the LLM is consulted only for ambiguity the deterministic rules cannot resolve; blocking an interactive add on an LLM network call would violate REQ-015/023 and principle 15 (RPi4 floor). Consistent with the cover fast-then-upgrade pattern."
    po_confirm: true
    po_confirm_note: "UX tradeoff: a Work can briefly display as confirmed-identity before a rare background LLM verify flags it Conflict (only when anchors were deterministically ambiguous). Acceptable per fast-then-upgrade, but it is a user-visible behavior — confirm."
  - id: D-014
    resolves: Q-003
    topic: "gr_key bare-numeric backfill migration: ship with feature or separate"
    choice: "SEPARATE backfill STEP, SAME feature PR. The schema federation is the conflict-store rebuild migration (052). The bare-numeric backfill is a separate Rust one-shot step ordered AFTER the schema migrations — NOT a .sql file, because SQL cannot call the domain normalize_gr_key helper and a SQL reimplementation would fork the single normalization authority (r3 C-R010). Both ship with this feature and run once at deploy."
    rationale: "REQ-002 makes the backfill mandatory, so it ships with the feature. A dedicated, append-only file keeps the data-repair auditable and independently revertible, and does not muddy the schema migration's intent (insight 19: migrations are immutable once applied). Drifted-row volume is small (~19), so no maintenance-window gating is needed."
    po_confirm: true
    po_confirm_note: "Low-stakes; confirm you do not want the backfill deferred to a separate maintenance step."
  - id: D-015
    resolves: Q-004
    topic: "Provenance granularity for harvested fields"
    choice: "PRESERVE PER-PROVIDER PROVENANCE — do not flatten to a single source tag. The candidate_id payload cache (D-005) stores per-provider payloads as a map keyed by MetadataProvider; WorkService::add feeds that map directly into the existing merge engine's MergeInput.provider_results (which is already a HashMap<MetadataProvider, ReconstructedOutcome>). The merge engine already derives per-field FieldProvenance from the winning provider, so no new provenance machinery is added; the legacy single-blob source_provider_data rail is retained only for genuinely single-source paths (e.g. a Readarr record with no multi-provider harvest)."
    rationale: "REQ-016 demands per-field provenance fidelity (User > Provider > System). The merge engine already operates per-provider (verified: lib.rs MergeInput.provider_results). Caching per-provider payloads is already required by D-005. So per-provider provenance is the no-extra-cost outcome; flattening would DISCARD fidelity the engine already supports."
    po_confirm: true
    po_confirm_note: "IR-internal mechanics; flagged for awareness only."
  - id: D-016
    topic: "Foundation principle #6 wording vs the M9 carve-out (D-002)"
    choice: "HONOR the PO-approved M9 carve-out (interactive paths synchronous + fully-formed; batch/monitor paths create identity-pending works that converge async, terminal needs-review for the unresolvable). DO NOT edit build/foundation/principles.md — it is the highest-authority document and editing it is a PO decision."
    rationale: "principles.md #6 ('Metadata enrichment is synchronous at add time ... Nothing blocks') predates D-002. Its INTENT — partial metadata beats a spinner/error, nothing blocks — is preserved: identity-pending creation does not block and degrades gracefully. But the literal 'synchronous at add time' is in tension with batch identity-pending creation. Per project rule, conflicts with principles must be surfaced, never silently overridden."
    po_confirm: true
    po_confirm_note: "Decide: reword principle #6 to scope 'synchronous' to interactive paths, OR affirm the M9 carve-out as a documented scoped exception. D-002 already flagged this ('harmonize later?')."
  - id: D-017
    topic: "Stage-5 review fixes (Layer 0-2 model-attribution audit, 2026-05-29): conflict-source param + series/narrator deferral"
    choice: "(a) detect_conflicting_anchors gains a `source: ConflictSource` parameter so a conflict raised on a non-manual path (Readarr / list / series-monitor) is attributed to that path instead of the previously hardcoded ManualAdd; the db-anchors signature below is updated to match. (b) Embedded series/narrator harvest in matching-embedded-harvest (extract_epub calibre series; extract_m4b narrator/series) is DEFERRED. extract_epub DOES now harvest the publication year from dc:date."
    rationale: "Reviewing the Layer 0-2 code (accidentally authored on Sonnet 4.6, Opus 4.8 restored) surfaced a conflict-source mis-attribution: REQ-020 observability was correct but raised_by was wrong for non-manual paths, and the IR had not threaded a source so correct attribution was impossible. Series/narrator deferral: no codebase convention exists to mirror (series/narrator are provider-sourced — Audible/Audnexus/HC), and rbook calibre-series + m4b narrator/series atom conventions are unverified; implementing without prototyping against real fixtures would risk a silent no-op or wrong-field extraction (project rule: prototype parsers first). Non-identity-critical: the feature core is isbn/asin/anchors (#97); AC-011 permits narrator to complete in the background."
    po_confirm: true
    po_confirm_note: "PO approved both the source-param fix and the series/narrator deferral on 2026-05-29."

# ---------------------------------------------------------------------------
# MODULES — design detail. Types referenced here are defined in IR v1.
# Dependencies mirror IR v1 (acyclic; verified by verify_architecture).
# ---------------------------------------------------------------------------
modules:

  # ════════════════════════════ livrarr-domain ════════════════════════════
  - name: domain-identity-federate
    component: livrarr-domain
    responsibility: "Federate the identity types + the IdentityResolver/WorkService contracts (see IR v1 module of same name). This module is the leaf foundation: ZERO outward deps; names no metadata payload type (compile wall, insight 9e)."
    req_ids: [REQ-001, REQ-003, REQ-008, REQ-009, REQ-010, REQ-011, REQ-014, REQ-015, REQ-018, REQ-019, REQ-020, REQ-022, REQ-023, REQ-025, REQ-028]
    dependencies: [domain-normalization]
    capability_survey:
      - { capability: "Federated anchor storage", status: EXISTS-REUSE, location: "identity.rs:11-37 WorkIdentityAnchor + AnchorType(String) newtype with consts", note: "AnchorType is already a string newtype; adding GR_WORK is one const. No anchor-table migration (value column is free-form). DO NOT build a new anchor type." }
      - { capability: "Resolver trait", status: EXISTS-GENERALIZE, location: "services/identity_resolver.rs:2-5 IdentityResolver::resolve(&EnglishSeed)->IdentityResolution", note: "Generalize the EXISTING trait signature (add user_id+tier+Result+federated Resolution). Do NOT invent a parallel resolver (r1 R-003)." }
      - { capability: "Repository trait + error", status: EXISTS-GENERALIZE, location: "services/work_identity.rs WorkIdentityRepository + WorkIdentityError; find_work_by_anchor already takes AnchorType", note: "find_work_by_anchor is ALREADY anchor-type-generic — gr_work lookups work unchanged." }
      - { capability: "Creation contract", status: EXISTS-GENERALIZE, location: "identity.rs:230-261 EnglishSeedFields + EnglishWorkCandidate", note: "Rename to WorkSeedFields/WorkCandidate; drop standalone gr_key (R-010) + fields.isbn/asin (R-011); add candidate_id; anchors live solely in identity." }
      - { capability: "Identifier normalization", status: NEW, location: "domain-normalization (this feature)", note: "WorkSeed entry calls it; see that module." }
      - { capability: "Opaque payload handle", status: NEW, location: "CandidateId (uuid v4)", note: "New; user-scoped consume-once cache key (D-005)." }
    public_api:
      functions:
        - name: "WorkSeed::sanitized"
          signature: "fn sanitized(raw: RawHarvest) -> Result<WorkSeed, WorkIdentityError>"
          pseudocode:
            - "Run each raw identifier through domain-normalization: isbn_13 via normalize_isbn13; asin via normalize_asin (AsinNorm: Isbn13 folds into isbn_13 and clears asin per REQ-004; Asin retained; Invalid dropped); gr_key via normalize_gr_key; language via normalize_language."
            - "Drop any identifier that normalizes to None/Invalid — a malformed identifier is treated as absent (REQ-029); it is neither persisted nor sent to a provider."
            - "If, after normalization, the seed carries no usable signal at all (no identifier, no title+author), return Err(WorkIdentityError::EmptySeed)."
            - "Set user_confirmed from the caller (true only for an explicit Add-Work user pick, REQ-019)."
            - "Return the validated WorkSeed."
          call_annotations:
            - { type: NEW, call: "normalize_isbn13(raw.isbn)", target: "livrarr-domain::normalization::normalize_isbn13" }
            - { type: NEW, call: "normalize_asin(raw.asin)", target: "livrarr-domain::normalization::normalize_asin" }
            - { type: NEW, call: "normalize_gr_key(raw.gr)", target: "livrarr-domain::normalization::normalize_gr_key" }
            - { type: NEW, call: "normalize_language(raw.lang)", target: "livrarr-domain::normalization::normalize_language" }
            - { type: NEW, call: "WorkIdentityError::EmptySeed", target: "livrarr-domain::work_identity::WorkIdentityError (new variant)" }
          preconditions: ["raw is whatever a path harvested; fields may be malformed or absent"]
          invariants: ["Output identifiers are canonical-or-absent (REQ-029). No identifier is ever the empty string."]
          tdd:
            - "RED (AC-037): a malformed/empty isbn_13 in raw → WorkSeed.isbn_13 is None (treated absent)."
            - "RED (AC-004/AC-029): an ISBN-10-shaped asin that passes checksum → isbn_13 set, asin None; one that FAILS checksum → asin retained."
            - "RED (REQ-029): a seed with no identifier and no title+author → Err(EmptySeed)."
        - name: "CapturedIdentity::merge_missing"
          signature: "fn merge_missing(&mut self, incoming: &CapturedIdentity)"
          pseudocode:
            - "For each anchor/bridge slot (ol_key, gr_key, hc_key, isbn_13, asin): if self's slot is None and incoming's is Some, copy it in."
            - "Never overwrite a slot self already holds (REQ-028 — convergence adds, never clobbers)."
          call_annotations:
            - { type: STDLIB, call: "Option::is_none / get_or_insert", target: "std::option::Option" }
          invariants: ["Monotonic: anchors only added, never removed or changed (feeds REQ-022 convergence + REQ-028 anchor-merge-on-match)."]
          tdd: ["RED (AC-028): existing CapturedIdentity lacking gr_key merged with incoming carrying gr_key → gr_key present; an existing ol_key is NOT overwritten."]
        - name: "IdentityResolver::resolve (trait contract — GENERALIZED)"
          signature: "async fn resolve(&self, user_id: UserId, seed: &WorkSeed, tier: LatencyTier) -> Result<Resolution, WorkIdentityError>"
          pseudocode:
            - "CONTRACT (impl lives in metadata-identity-resolver): given a user scope, a harvested seed, and a latency tier, return a Resolution."
            - "A provider that abstains (timeout/unreachable) MUST NOT turn into Err and MUST NOT count as quorum disagreement (REQ-025) — it yields Unresolved, not Err."
            - "Err is reserved for programmer/db faults (e.g. EmptySeed, Db)."
            - "Whenever the impl fetched provider payloads, the returned payload-bearing variant carries a CandidateId (D-005)."
          call_annotations:
            - { type: NEW, call: "-> Resolution", target: "livrarr-domain::identity::Resolution (new enum, generalizes IdentityResolution)" }
            - { type: EXISTING, call: "trait_variant::make(Send) on the trait", target: "trait-variant (existing macro on IdentityResolver)" }
            - { type: EXISTING, call: "UserId / WorkId domain ids", target: "livrarr-domain::{UserId,WorkId}" }
          invariants: ["Total over provider failure (REQ-025): provider down ⇒ Unresolved, never Err.", "Tier-agnostic identity result (REQ-022): tier changes DEPTH/latency, not the identity rule."]
          tdd: ["RED (AC-018): Interactive resolve returns without awaiting a background-only provider.", "RED (AC-022): one provider times out → Resolution still built from responders; no Conflict from the abstainer."]
        - name: "WorkService::add (CHANGED — impl is WorkServiceImpl in livrarr-metadata)"
          signature: "async fn add(&self, user_id: UserId, candidate: WorkCandidate) -> Result<AddWorkResult, WorkServiceError>"
          pseudocode:
            - "If candidate.candidate_id is Some, take the cached per-provider payloads for (user_id, candidate_id) from the transport cache and REVALIDATE that the captured anchors in candidate.identity match the cached result; on mismatch / cache-miss / TTL-expiry, fall back to network enrichment (the exceptional path, D-005)."
            - "Derive the persisted identifiers SOLELY from candidate.identity (CapturedIdentity in IdentityState::Confirmed) — never from descriptive fields (R-010/R-011). isbn_13/asin are identity, not fields."
            - "Dedup, preserving today's control flow (work_service.rs add): (1) anchor match via find_work_by_anchor over EACH present anchor type incl. gr_work; (2) adopt path — an anchorless existing normalized-title+author match absorbs the incoming anchors via merge_missing_anchors (REQ-028) instead of only confirm_ol_anchor; (3) normalized-match dedup."
            - "CONFLICT PREFLIGHT (generalizes the warn-only step-3e site to ALL match paths — r3 C-R009): on EVERY match (anchor-match, adopt, normalized-dedup, race-loser), BEFORE merging, call detect_conflicting_anchors(existing_work_id, incoming.identity). For each anchor type the existing work has CONFIRMED with a DIFFERENT incoming value, raise NewIdentityConflict of the matching federated kind (REQ-020) — not only the normalized-title ol_key case. This closes the unwired conflict path AND stops merge_missing_anchors from silently dropping a conflicting anchor."
            - "On create, persist every present anchor through confirm_anchor(anchor_type, value, setter). On any match (AFTER the conflict preflight above), call merge_missing_anchors — ADDITIVE-ONLY: it fills anchor types the existing work LACKS so no harvested anchor is dropped (REQ-028), and never overwrites a confirmed anchor (conflicts were already raised by the preflight — r3 C-R009)."
            - "BRIDGE-ANCHOR mismatch policy (r4 C-R011): a Work stores at most one isbn_13 and one asin (spec Non-Req). When a match carries a DIFFERENT incoming bridge value than the existing confirmed one, KEEP the existing (never overwrite a confirmed anchor, REQ-028) and RECORD the divergence via a structured tracing::warn — observable in logs, the minimal 'not silent' (reusing the existing step-3e warn pattern); a DURABLE user-facing surface is NOT required by any REQ (edition variance is expected + low-stakes) and is deferred as a small optional follow-up (r5 C-R011 P3). This is NOT a silent skip and NOT an identity Conflict (a different edition's ISBN is edition variance, not an identity dispute; REQ-020 covers only ol/gr/hc). merge_missing_anchors still fills a bridge the existing work LACKS."
            - "Feed the (revalidated) cached payloads to the merge engine in-process via metadata-merge-reuse (no network re-query, REQ-014/015); then evict the cache entry."
          call_annotations:
            - { type: EXISTING, call: "db.find_work_by_anchor(user_id, &AnchorType, value)", target: "livrarr-domain::services::work_identity::WorkIdentityRepository::find_work_by_anchor (already anchor-type-generic)" }
            - { type: EXISTING, call: "db.find_normalized_match_no_anchor_for_user(...)", target: "livrarr-metadata::work_service adopt path (work_service.rs ~:290-309)" }
            - { type: EXISTING, call: "db.find_by_normalized_match(...)", target: "livrarr-metadata::work_service (work_service.rs ~:345)" }
            - { type: EXISTING, call: "handle_race_loser(...)", target: "livrarr-metadata::work_service::handle_race_loser (~:1476)" }
            - { type: NEW, call: "confirm_anchor(work_id, anchor_type, value, setter)", target: "livrarr-db::anchors::confirm_anchor (generalizes confirm_ol_anchor)" }
            - { type: NEW, call: "detect_conflicting_anchors(existing_work_id, incoming, source)", target: "livrarr-db::anchors::detect_conflicting_anchors (source = the calling path's ConflictSource, D-017)" }
            - { type: NEW, call: "merge_missing_anchors(work_id, captured)", target: "livrarr-db::anchors::merge_missing_anchors" }
            - { type: NEW, call: "raise_identity_conflict(new_conflict)", target: "livrarr-db::conflicts::raise_identity_conflict (wires the conflict preflight + step-3e)" }
            - { type: NEW, call: "transport_cache.take(user_id, candidate_id)", target: "livrarr-metadata::transport_cache::cache_take" }
            - { type: EXISTING, call: "tracing::warn! to record a bridge-anchor divergence (r5 C-R011)", target: "livrarr-metadata work_service logging (the existing step-3e warn pattern)" }
          preconditions: ["candidate.identity is the sole identifier authority (R-010/R-011).", "user_id scopes both the work and the cache lookup (Principle 4 multi-user)."]
          invariants: ["No harvested anchor is silently discarded on ANY match path (REQ-028).", "A different same-type anchor on a title+author match is terminal Conflict, not a silent merge (REQ-018/020)."]
          tdd:
            - "RED (AC-002): Readarr-sourced candidate with gr_key+isbn+asin in identity → all persisted; hc_key filled once HC resolves the ISBN."
            - "RED (AC-015/AC-034/AC-035): same normalized title+author, different ol_key (or gr_key/hc_key) → observable Conflict row, not warn-only."
            - "RED (AC-010/AC-024): add with a valid candidate_id issues ZERO provider network calls (provider spy)."
            - "RED (AC-028): match to an anchorless existing work merges the incoming anchor onto it."
            - "RED (r5 C-R011): a match with a DIFFERENT incoming isbn_13 or asin keeps the existing bridge, emits a structured warn (observable), and does NOT raise an identity Conflict (edition variance)."

  - name: domain-normalization
    component: livrarr-domain
    responsibility: "Single authority for identifier + language normalization/validation (see IR v1). Leaf; zero outward deps."
    req_ids: [REQ-002, REQ-004, REQ-005, REQ-029]
    dependencies: []
    capability_survey:
      - { capability: "ISBN-10 → ISBN-13 conversion", status: EXISTS-GENERALIZE, location: "metadata google_books.rs::isbn10_to_isbn13", note: "MOVE the existing converter into domain (D-009); google_books delegates back. Do NOT reimplement the checksum (insight: ecosystem-crate / existing-logic reuse)." }
      - { capability: "Language normalization", status: EXISTS-GENERALIZE, location: "metadata lib.rs normalize_language (names + 3-letter; inline split('-') in google_books)", note: "Extend with primary-subtag strip; metadata delegates here (DRY)." }
      - { capability: "ASIN shape-guard", status: NEW, location: "this module (AsinNorm)", note: "No normalize_asin exists today (verified)." }
      - { capability: "gr_key bare-numeric", status: NEW, location: "this module", note: "No normalize for it exists; extract_gr_key keeps the full slug form today." }
    public_api:
      functions:
        - name: normalize_isbn13
          signature: "fn normalize_isbn13(raw: &str) -> Option<String>"
          pseudocode:
            - "Strip non-alphanumerics; uppercase a trailing check char."
            - "If 10 chars: validate the ISBN-10 mod-11 checksum; on pass convert to ISBN-13 (978 prefix + mod-10 check) using the relocated converter; on fail return None."
            - "If 13 chars: validate the ISBN-13 mod-10 checksum; pass → return; fail → None."
            - "Any other length → None (REQ-029: validation is length + checksum, not mere stripping)."
          call_annotations:
            - { type: EXISTING, call: "isbn10_to_isbn13(s)", target: "livrarr-metadata::google_books::isbn10_to_isbn13 (relocated into this module per D-009)" }
            - { type: STDLIB, call: "char::is_ascii_digit / str manipulation", target: "std::primitive::char" }
          tdd: ["RED (AC-037): bad checksum / 11-char input → None.", "RED: valid ISBN-10 → 13-digit ISBN-13."]
        - name: normalize_asin
          signature: "fn normalize_asin(raw: &str) -> AsinNorm"
          pseudocode:
            - "Trim/uppercase. If empty → AsinNorm::Invalid."
            - "If the value matches the ISBN-10 shape (9 digits + digit-or-X) AND passes the ISBN-10 checksum, return AsinNorm::Isbn13(converted) — a print-book ASIN is really an ISBN-10 (ST-006); store as isbn_13, not asin (REQ-004)."
            - "If it matches the shape but FAILS the checksum, it is a genuine Amazon ASIN — return AsinNorm::Asin(value) so audiobook lookups still work."
            - "A B-prefixed (Kindle/Audible) value or other valid ASIN form → AsinNorm::Asin(value). Otherwise AsinNorm::Invalid (REQ-029)."
          call_annotations:
            - { type: NEW, call: "normalize_isbn13(raw) for the checksum/convert", target: "livrarr-domain::normalization::normalize_isbn13" }
            - { type: STDLIB, call: "regex-free shape test on bytes", target: "std::primitive::str" }
          invariants: ["An ISBN-10-shaped, checksum-VALID value never lands in an asin slot (REQ-004)."]
          tdd: ["RED (AC-004): '0439139600' (valid ISBN-10) in asin → Isbn13.", "RED (AC-029): ISBN-10-shaped but checksum-invalid → Asin (retained)."]
        - name: normalize_gr_key
          signature: "fn normalize_gr_key(raw: &str) -> Option<String>"
          pseudocode:
            - "Take the leading run of ASCII digits from the input."
            - "Drop everything from the first non-digit onward (slug suffixes introduced by a dot, hyphen, or slash path are discarded)."
            - "Return the leading digit run if non-empty; otherwise None (a value with no leading digits is not a usable key, REQ-002/REQ-029)."
          call_annotations:
            - { type: STDLIB, call: "take_while(is_ascii_digit)", target: "std::primitive::char" }
          invariants: ["Output matches the bare-numeric form required by the contract; the persisted key never carries a slug. (The scraper MAY keep a slug-form URL for fetching — that is separate from the persisted key, REQ-002.)"]
          tdd: ["RED (AC-003): a dotted slug form normalizes to its leading digits; a hyphenated slug form likewise; a non-numeric value → None."]
        - name: normalize_language
          signature: "fn normalize_language(raw: &str) -> Option<String>"
          pseudocode:
            - "Lowercase. Split on '-' or '_' and keep the primary subtag ('en-US' → 'en', 'pt-BR' → 'pt'); REQ-005."
            - "Map any full language name or 3-letter code to its ISO 639-1 2-letter code using the existing table."
            - "Return the 2-letter code, or None if unrecognized."
          call_annotations:
            - { type: EXISTING, call: "existing name/3-letter table", target: "livrarr-metadata::lib::normalize_language (logic folded in here; metadata delegates)" }
            - { type: STDLIB, call: "str::split / to_lowercase", target: "std::primitive::str" }
          tdd: ["RED (AC-005): 'en-US' → 'en'; 'pt-BR' → 'pt'."]

  - name: domain-states
    component: livrarr-domain
    responsibility: "Add EnrichmentStatus::NeedsReview; generalize IdentityPending semantics (see IR v1)."
    req_ids: [REQ-026]
    dependencies: []
    capability_survey:
      - { capability: "EnrichmentStatus enum", status: EXISTS-GENERALIZE, location: "livrarr-domain lib.rs:73-91 (Unenriched/Enriched/Failed/Conflict/IdentityPending)", note: "Add NeedsReview variant. IdentityPending already exists — drop its English/OL scoping note." }
      - { capability: "No-migration check", status: EXISTS-REUSE, location: "migrations 001 works.enrichment_status (NO CHECK constraint, verified); parsed in code at db sqlite_work.rs::parse_enrichment_status", note: "Adding a variant needs NO migration — only the enum + parse_enrichment_status arm. D-010 verification CONFIRMED: no CHECK on the column." }

  # ════════════════════════════ livrarr-db ════════════════════════════
  - name: db-conflicts-migration
    component: livrarr-db
    responsibility: "Migration 052: data-preserving rebuild of work_identity_conflicts (federated kinds + SeriesMonitor + ReplaceAnchor, drop forbidden enum constraints). Repo: raise + list + resolve for any federated kind (see IR v1)."
    req_ids: [REQ-020]
    dependencies: [domain-identity-federate]
    capability_survey:
