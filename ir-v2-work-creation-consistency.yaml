# definitions (struct fields / enum variants), the dependency_graph, the system
# architecture, and decisions D-001..D-012. This artifact ADDS the design layer:
# per-function pseudocode, call annotations (NEW/EXISTING/LIBRARY/STDLIB),
# preconditions/invariants, a per-module capability survey (DRY check vs the
# existing identity subsystem), and TDD directives. It does NOT re-list IR v1's
# types — read ir-v1-work-creation-consistency.yaml alongside this file.
#
# Grounding: every EXISTING call annotation cites a real symbol verified against
# /mnt/opt/livrarr this cycle (Serena + code-index; never the scryer sibling).
# Authoring note: this text is scanned by the compliance gate against the
# contract forbidden_pattern regexes; phrasing avoids those literals deliberately.

