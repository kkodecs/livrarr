  - name: metadata-identity-resolver
    component: livrarr-metadata
    responsibility: "The #97 fix: generalize english_identity_resolver into the tier-scoped multi-provider IdentityResolver impl (see IR v1)."
    req_ids: [REQ-007, REQ-008, REQ-009, REQ-010, REQ-011, REQ-013, REQ-018, REQ-019, REQ-021, REQ-023, REQ-024, REQ-025, REQ-027]
    dependencies: [domain-identity-federate, domain-normalization]
    capability_survey:
      - { capability: "Resolver impl to generalize", status: EXISTS-GENERALIZE, location: "english_identity_resolver.rs LiveEnglishIdentityResolver::resolve (OL-only, single provider)", note: "Today it is single-provider OL; generalize to a fan-out. This is the #97 locus (OL-absent ⇒ zero candidates)." }
      - { capability: "Provider fetch + clients", status: EXISTS-REUSE, location: "provider_client.rs ProviderClient::fetch(work: &Work, ctx: &EnrichmentContext) -> ProviderOutcome<NormalizedWorkDetail>; per-provider clients (OL/HC/GB/GR/Audnexus/Audible)", note: "Reuse the existing dispatch + clients; fetch takes &Work (NOT a seed, cR-004) — see the seed-to-transient-Work adapter below." }
      - { capability: "Seed-to-transient-Work adapter", status: NEW, location: "this module (build_transient_work_from_seed)", note: "cR-004: pre-create discovery has no persisted Work; build a transient Work from the WorkSeed to drive ProviderClient::fetch — the cover fan-out already passes a Work the same way." }
      - { capability: "ISBN bridges", status: EXISTS-REUSE, location: "OpenLibraryClient::isbn_lookup (ISBN→ol_key); hardcover::query_hardcover_by_isbn (ISBN→hc_key)", note: "Bridges already fire inside fetch — capture their results instead of discarding." }
      - { capability: "GR resolution", status: EXISTS-REUSE, location: "GoodreadsClient::resolve_detail_url (gr_key direct / isbn-scrape+LLM / title+author+LLM)", note: "Reuse; gate behind LLM availability (ST-001). 202 anti-bot ⇒ treat as abstain/unverified (gotcha)." }
      - { capability: "Audiobook lookups", status: EXISTS-REUSE, location: "lookup_audible_by_asin; query_audnexus", note: "Audible interactive-eligible; Audnexus background-only (REQ-021). NOTE gotcha: Audnexus currently returns REGION_UNAVAILABLE for all ASINs — the background path is correct but a no-op until that service issue clears (not a design defect)." }
      - { capability: "Parallel fan-out + payload retention", status: EXISTS-GENERALIZE, location: "cover_alternatives.rs::fetch_internal_alternatives (join_all over providers under a 10s timeout) — DISCARDS all but cover_url+title at :38-54", note: "Promote this fan-out to keep the FULL NormalizedWorkDetail payloads (D-004). Reuse the timeout+join mechanism; stop discarding." }
      - { capability: "candidate_id mint + cache", status: NEW, location: "metadata-transport-cache (this feature)", note: "uuid v4 + per-(user,candidate) cache." }
      - { capability: "Quorum + verify + provider-select", status: NEW, location: "this module", note: "REQ-018/024/008 logic — no existing equivalent." }
      - { capability: "Resolver-discovery semantics (suppress fuzzy fallback + payload-inspection gr-verify)", status: NEW, location: "this module + an EnrichmentContext discovery flag honored by the provider fetch fallback branches", note: "r2-R006/R007 + r3-C-R006/G-R009: existing fetch fuzzy-falls-back to title/author across ALL THREE providers — HC query_hardcover, OL title_author_search, AND GoodreadsClient::resolve_detail_url (gr_llm_key_lookup + search_goodreads). The resolver suppresses ALL of them for hard-id seeds (REQ-010/AC-024). A non-harvested Goodreads key is verified by INSPECTING the already-returned payload (title+author present and matching the seed) — no extra network (REQ-014); otherwise the key is stripped." }
    public_api:
      functions:
        - name: "resolve (impl of IdentityResolver::resolve)"
          signature: "async fn resolve(&self, user_id: UserId, seed: &WorkSeed, tier: LatencyTier) -> Result<Resolution, WorkIdentityError>"
          pseudocode:
            - "Guard: if seed has no usable signal → Err(EmptySeed)."
            - "providers = self.select_providers(seed, tier) — the REQ-008 matrix scoped by seed, tier, and language (REQ-027), excluding any provider lacking its prerequisite (GB-key / LLM / Audnexus-tier), read from resolver-held config (r2-R-008)."
            - "Build a transient (unpersisted) Work from the seed via build_transient_work_from_seed(seed, user_id) — cR-004: ProviderClient::fetch takes &Work and there is no persisted Work pre-create. Fan out to providers in parallel, passing that transient Work + an EnrichmentContext (reuse the cover_alternatives timeout+join mechanism); each yields ProviderOutcome<NormalizedWorkDetail>. A timeout/unreachable provider is recorded as an ABSTENTION, not a result (REQ-025)."
            - "For a seed carrying a resolving HARD id, set the EnrichmentContext discovery flag that SUPPRESSES each provider's built-in title/author fuzzy fallback (r2-R-006: HardcoverClient::fetch otherwise calls query_hardcover(title,author) after an ISBN miss; OpenLibraryClient::fetch otherwise calls title_author_search). REQ-010/AC-024 require a resolving id to issue NO fuzzy search — so a hard-id miss becomes an abstention and falls to the EXPLICIT Tier B/C NeedsConfirmation step (REQ-013), never an implicit fuzzy search inside the fan-out."
            - "Bridge: capture ol_key from OL's isbn_lookup and hc_key from HC's isbn path (they already fire inside fetch); GB contributes edition metadata only — never a work anchor (ST-002, REQ-009)."
            - "gr_key: GR runs INSIDE the fan-out (no separate scrape-search — r3 G-R009 avoids the redundant network/LLM call). For a hard-id seed, the discovery flag ALSO suppresses GoodreadsClient::resolve_detail_url's title/author fuzzy fallbacks — gr_llm_key_lookup(title,author) and search_goodreads(title,author) — leaving only a directly-harvested seed key or the isbn: search path (r3 C-R006; REQ-010, AC-024). A non-harvested key from the GR payload is captured ONLY if verify_gr_payload confirms the already-returned NormalizedWorkDetail has a populated title AND its title/author match the RESOLVED identity (captured) — the seed's, or for an ISBN-only seed the consensus from the providers that resolved the hard id (r4 G-R011; REQ-024); a minimal/anti-bot payload (title None, the 202 case) or a mismatch strips the key (ST-001). A directly-harvested seed key skips the gate."
            - "Run quorum (REQ-018): group responders by shared RETURNED anchor or normalized title+author (NOT by shared seed); an anchorless provider (GB) corroborates the edition unless its title diverges beyond the similarity threshold (then it dissents and its metadata is rejected). Majority wins, outliers dropped; a 1-vs-1 no-majority split → Conflict{QuorumTie}; two providers agreeing on title+author but returning different same-type anchors → terminal Conflict (REQ-020). seed.user_confirmed counts as the strongest vote (REQ-019)."
            - "If any payloads were fetched: mint candidate_id (uuid v4) and cache_put the per-provider payload map under (user_id, candidate_id) (D-005, all tiers, D-015 per-provider provenance)."
            - "Build the Resolution: a resolving hard id (incl. GB-only ISBN, REQ-011 Tier A) → Resolved{captured, method, candidate_id}; no resolving hard id → NeedsConfirmation{candidates each with their candidate_id}; conflict → Conflict{conflict, captured} (no candidate_id); all relevant providers abstained → Unresolved{captured, reason, candidate_id?} (REQ-025). NO LLM identity-validation here — that is the background verify pass (D-013/Q-001)."
          call_annotations:
            - { type: EXISTING, call: "ProviderClient::fetch(&transient_work, ctx)", target: "livrarr-metadata::provider_client::ProviderClient::fetch (takes &Work — fed the transient Work)" }
            - { type: NEW, call: "build_transient_work_from_seed(seed, user_id)", target: "livrarr-metadata::identity_resolver::build_transient_work_from_seed" }
            - { type: EXISTING, call: "OpenLibraryClient::isbn_lookup / query_hardcover_by_isbn", target: "livrarr-metadata::provider_client (ISBN bridges)" }
            - { type: EXISTING, call: "GoodreadsClient::resolve_detail_url", target: "livrarr-metadata::provider_client::GoodreadsClient::resolve_detail_url" }
            - { type: EXISTING, call: "parallel fan-out under timeout (reuse)", target: "livrarr-metadata::cover_alternatives fan-out mechanism (timeout+join, payloads kept)" }
            - { type: NEW, call: "select_providers(seed, tier)", target: "livrarr-metadata::identity_resolver::select_providers" }
            - { type: NEW, call: "verify_gr_payload(gr_payload, captured)", target: "livrarr-metadata::identity_resolver::verify_gr_payload (payload-inspection vs resolved identity, no extra network — r3 G-R009 / r4 G-R011)" }
            - { type: NEW, call: "run_quorum(responders, seed)", target: "livrarr-metadata::identity_resolver::run_quorum" }
            - { type: NEW, call: "cache_put(user_id, candidate_id, payloads)", target: "livrarr-metadata::transport_cache::cache_put" }
            - { type: LIBRARY, call: "uuid v4 mint", target: "uuid.Uuid::new_v4" }
            - { type: LIBRARY, call: "per-provider await timeout", target: "tokio.time::timeout" }
          preconditions: ["seed has been sanitized (REQ-029) by WorkSeed::sanitized."]
          invariants: ["Never narrows a multi-provider-eligible seed to one provider (REQ-008, the #97 guard).", "Provider failure ⇒ abstain, never Err and never quorum-dissent (REQ-025)."]
          tdd:
            - "RED (AC-001): file with HC-resolvable ISBN absent from OL → NeedsConfirmation/Resolved includes the HC-sourced candidate (not zero)."
            - "RED (AC-030): no-GB-key / no-LLM-GR / Audnexus-interactive excluded; discovery still multi-provider."
            - "RED (AC-032): ISBN resolving only to GB → Resolved Tier-A (ISBN identity, no work anchor), not identity-pending."
            - "RED (AC-020/AC-033): two providers, same ISBN, different works → Conflict; an edition-variant title corroborates."
        - name: select_providers
          signature: "fn select_providers(&self, seed: &WorkSeed, tier: LatencyTier) -> Vec<MetadataProvider>  // method on the resolver — reads resolver-held ProviderEligibility (r2-R-008), NOT DefaultMergeEngine internals"
          pseudocode:
            - "ISBN seed → OL + HC + GB (+ GR when an LLM is configured), subject to language routing (REQ-027: a foreign-identified work excludes OL/HC from METADATA contribution, but an anchor may still be captured)."
            - "ASIN seed → Audible (Audnexus excluded from interactive/bulk; background-only, REQ-021)."
            - "Native key seed (ol_key/gr_key) → the owning provider, then bridge via any resolved ISBN."
            - "Title/author only → the enabled English providers (or GB/GR for foreign)."
            - "Exclude any provider lacking its prerequisite: GB without an API key (ST-009), GR without an LLM (ST-001), Audnexus on a non-background tier (REQ-021)."
          call_annotations:
            - { type: NEW, call: "read resolver-held ProviderEligibility (GB-key present, LLM configured, enabled providers, tier capability)", target: "livrarr-metadata::identity_resolver ResolverConfig/ProviderEligibility (r2-R-008 — explicit config, not DefaultMergeEngine private state)" }
            - { type: EXISTING, call: "MetadataProvider enum", target: "livrarr-domain::MetadataProvider" }
          tdd: ["RED (AC-030): prerequisite-lacking providers excluded; never narrowed to one for a multi-eligible seed."]
        - name: "verify_gr_payload (was verify_gr_key — payload-inspection, NO extra network, r3 G-R009)"
          signature: "fn verify_gr_payload(payload: &NormalizedWorkDetail, captured: &CapturedIdentity) -> bool  // 'captured' = the title/author resolved THIS fan-out (seed's if it carried them, else the consensus from the providers that resolved the hard id) — r4 G-R011"
          pseudocode:
            - "A non-harvested Goodreads key is trusted ONLY by inspecting the payload GoodreadsClient::fetch ALREADY returned — no second network call (r3 G-R009; REQ-014; Principle 5)."
            - "ALWAYS require the payload to have a populated title — a minimal/anti-bot payload (title None, the 202 case) fails and the key is stripped."
            - "Compare the payload title+author against captured's title/author (the RESOLVED identity, not the raw seed — r4 G-R011: an ISBN-only seed has no title to match, but OL/HC resolved one). Return true iff they match beyond the similarity threshold (REQ-024 — GR is LLM-disambiguated even via the isbn: path per ST-001, so the match check is mandatory; ~12.5% LLM exact-match)."
            - "If NO title/author is available anywhere to compare against, the key cannot be verified → false (conservative; never persist an unverifiable LLM key)."
            - "A directly-harvested seed key skips this gate (authored by the source, not LLM-resolved)."
          call_annotations:
