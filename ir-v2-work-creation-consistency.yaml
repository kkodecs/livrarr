      functions:
        - name: "confirm_anchor (GENERALIZES confirm_ol_anchor)"
          signature: "async fn confirm_anchor(&self, work_id: WorkId, anchor_type: AnchorType, value: &str, setter: AnchorSetter) -> Result<(), WorkIdentityError>"
          pseudocode:
            - "Validate value is non-empty + canonical for its type (else WorkIdentityError::InvalidAnchorValue, REQ-029)."
            - "Upsert the (work_id, anchor_type, value) row with confidence=confirmed via INSERT ... ON CONFLICT (...) DO UPDATE SET — honoring the uniq_primary_confirmed_anchor partial index; the banned replace idiom is NOT used (contract P1, insight 20)."
            - "Preserve the existing confirm_ol_anchor SQL shape; only the type is now a parameter rather than hardcoded to the OL anchor."
          call_annotations:
            - { type: LIBRARY, call: "sqlx.query upsert", target: "sqlx.query" }
            - { type: EXISTING, call: "AnchorType / AnchorSetter", target: "livrarr-domain::identity::{AnchorType,AnchorSetter}" }
          tdd: ["RED (AC-002): confirm_anchor(HC_WORK, ...) then find_work_by_anchor(HC_WORK,...) returns the work.", "RED (REQ-003): hc_key writable at create (not only via enrichment)."]
        - name: merge_missing_anchors
          signature: "async fn merge_missing_anchors(&self, work_id: WorkId, incoming: &CapturedIdentity) -> Result<(), WorkIdentityError>"
          pseudocode:
            - "list_anchors(work_id) → the set of types already confirmed on the work."
            - "For each anchor present in `incoming` whose type is NOT already confirmed on the work, confirm_anchor it (setter reflecting the merge origin)."
            - "Never supersede or overwrite an already-confirmed anchor (REQ-028) — additive only."
          call_annotations:
            - { type: EXISTING, call: "self.list_anchors(work_id)", target: "livrarr-domain::services::work_identity::WorkIdentityRepository::list_anchors" }
            - { type: NEW, call: "self.confirm_anchor(work_id, ty, val, setter)", target: "livrarr-db::anchors::confirm_anchor" }
          invariants: ["Convergence-safe: only fills gaps; an existing confirmed anchor is immutable here (REQ-022/028)."]
          tdd: ["RED (AC-028): work with ol_key only + incoming gr_key → both anchors present afterward; the ol_key is unchanged."]
        - name: detect_conflicting_anchors
          signature: "async fn detect_conflicting_anchors(&self, existing_work_id: WorkId, incoming: &CapturedIdentity, source: ConflictSource) -> Result<Vec<NewIdentityConflict>, WorkIdentityError>  // source attributes the raised conflict to the creation path (D-017)"
          pseudocode:
            - "list_anchors(existing_work_id); for each WORK-ANCHOR type — ol_work / gr_work / hc_work ONLY (the identity anchors REQ-020 names) — that the existing work has CONFIRMED, compare its value to the incoming value of that type. Edition BRIDGES (isbn_13 / asin) are NOT identity conflicts here; they are handled by the bridge policy in add (r4 C-R011)."
            - "If an incoming value is present AND differs from the existing confirmed value, build a NewIdentityConflict of the matching federated kind (IncomingDifferentOlKey / IncomingDifferentGrKey / IncomingDifferentHcKey) for that type (REQ-020)."
            - "An anchor type the existing work LACKS is a gap for merge_missing_anchors, NOT a conflict. Return all detected conflicts (usually zero or one)."
          call_annotations:
