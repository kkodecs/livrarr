            - { type: EXISTING, call: "AnchorType consts + IdentityConflictKind + NewIdentityConflict", target: "livrarr-domain::identity (federated kinds + existing conflict structs)" }
          invariants: ["Conflict iff same-type, both present, different value (REQ-020). A missing type is a gap, never a conflict (additive merge handles it)."]
          tdd: ["RED (AC-015/AC-034/AC-035): a match by isbn anchor where the existing ol_key differs from the incoming ol_key detects a conflict on ALL match paths (anchor-match / adopt / race-loser), not only the normalized-title branch (r3 C-R009)."]
        - name: "backfill_gr_numeric (Rust one-shot backfill step — NOT a .sql migration; r3 C-R010)"
          signature: "async fn backfill_gr_numeric(&self) -> Result<(), WorkIdentityError>  // runs once at startup, ordered AFTER the schema migrations (like the FK-check harness)"
          pseudocode:
            - "Run as a Rust startup step ordered AFTER the schema migrations — NOT a pure .sql migration: SQL cannot call normalize_gr_key, and reimplementing the leading-numeric rule in SQL would fork the single normalization authority (REQ-002/REQ-005, r3 C-R010)."
            - "PRIMARY: read each works row whose Goodreads-key column carries a non-numeric slug suffix; rewrite it to normalize_gr_key(value); already-bare values are skipped (idempotent)."
            - "Then backfill the goodreads work anchor rows from the normalized column via an idempotent INSERT ... SELECT FROM works WHERE the column is non-empty AND NOT EXISTS a matching anchor row — this step is plain SQL (it only copies the already-normalized value)."
            - "Second pass: normalize any goodreads work anchor rows already written by feature code, for completeness."
          call_annotations:
            - { type: NEW, call: "normalize_gr_key(value) for each drifted row", target: "livrarr-domain::normalization::normalize_gr_key" }
            - { type: LIBRARY, call: "sqlx.query for the read-write loop + the anchor backfill INSERT...SELECT", target: "sqlx.query" }
          invariants: ["Single normalization authority: the rewrite calls the domain normalize_gr_key, never a SQL reimplementation (r3 C-R010). Post-backfill, BOTH the works Goodreads-key column AND every goodreads-work anchor value are bare-numeric (contract P2)."]
          tdd: ["RED (AC-003): a pre-existing slug-form value in the works column is rewritten to bare numeric via the domain normalizer AND yields a matching bare-numeric anchor row; an already-bare value is unchanged."]

