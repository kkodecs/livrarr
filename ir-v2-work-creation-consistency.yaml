        - name: "extract_epub (CHANGED)"
          signature: "fn extract_epub(path: &Path) -> Option<Extraction>"
          pseudocode:
            - "Parse the OPF with the existing XML reader; read dc:title/dc:creator/dc:language as today."
            - "Read dc:identifier elements; for one whose scheme is ISBN (or whose value normalizes as an ISBN), set Extraction.isbn via normalize_isbn13 — replacing the current hardcoded None."
