axum = { workspace = true }
assert_matches = "1"
futures = { workspace = true }
rapidfuzz = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }
sqlx = { workspace = true }
unicode-normalization = { workspace = true }
image = { workspace = true, features = ["jpeg"] }
livrarr-enrichment = { workspace = true }
zip = { workspace = true }

