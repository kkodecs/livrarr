[package]
name = "livrarr-behavioral"
version = "0.1.0-alpha5"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies]
livrarr-domain = { workspace = true }
livrarr-db = { workspace = true, features = ["test-helpers"] }
livrarr-tagwrite = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true }
tokio-util = { workspace = true }
trait-variant = { workspace = true }
urlencoding = "2"
livrarr-domain = { workspace = true }
livrarr-db = { workspace = true, features = ["test-helpers"] }
livrarr-metadata = { workspace = true }
livrarr-matching = { workspace = true }
livrarr-download = { workspace = true }
livrarr-library = { workspace = true }
livrarr-handlers = { workspace = true }
livrarr-http = { workspace = true }
livrarr-external-data = { workspace = true }
livrarr-materialize = { workspace = true }
livrarr-server = { workspace = true }
axum = "0.8"
assert_matches = "1"
futures = "0.3"
rapidfuzz = "0.5"
tempfile = "3"
tower = "0.5"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
unicode-normalization = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
livrarr-enrichment = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }

