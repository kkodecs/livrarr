[package]
name = "livrarr-behavioral"
version = "0.1.0-alpha6"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[features]
qw2_compile_red = []
# identity-edit staged-red suites (design r4): final-form tests referencing
# not-yet-implemented surfaces compile only under this feature. See the file
# headers of tests/behavioral/test_identity_edit*.rs for the protocol.
identity_edit_red = []

[dependencies]
livrarr-domain = { workspace = true }
livrarr-db = { workspace = true, features = ["test-helpers"] }
livrarr-tagwrite = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
trait-variant = { workspace = true }
urlencoding = { workspace = true }
livrarr-domain = { workspace = true }
livrarr-db = { workspace = true, features = ["test-helpers"] }
livrarr-metadata = { workspace = true }
livrarr-matching = { workspace = true }
livrarr-download = { workspace = true }
livrarr-library = { workspace = true }
livrarr-handlers = { workspace = true }
livrarr-http = { workspace = true, features = ["test-helpers"] }
livrarr-identity = { workspace = true }
livrarr-external-data = { workspace = true }
livrarr-materialize = { workspace = true }
livrarr-server = { workspace = true, features = ["test-helpers"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
