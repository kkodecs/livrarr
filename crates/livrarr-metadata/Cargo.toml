[package]
name = "livrarr-metadata"
version = "0.1.0-alpha6"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
chrono = { workspace = true }
thiserror = { workspace = true }
trait-variant = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
livrarr-domain = { workspace = true }
livrarr-matching = { workspace = true }
livrarr-db = { workspace = true }
livrarr-external-data = { workspace = true }
livrarr-identity = { workspace = true }
livrarr-enrichment = { workspace = true }
livrarr-materialize = { workspace = true }
livrarr-http = { workspace = true }
unicode-normalization = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
regex = { workspace = true }
csv = { workspace = true }
uuid = { workspace = true }
lru = { workspace = true }
futures = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
livrarr-db = { workspace = true, features = ["test-helpers"] }
reqwest = { workspace = true, features = ["blocking", "rustls-tls"] }
tempfile = { workspace = true }
