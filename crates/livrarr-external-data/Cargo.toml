[package]
name = "livrarr-external-data"
version = "0.1.0-alpha6"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
chrono = { workspace = true }
thiserror = { workspace = true }
trait-variant = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
livrarr-domain = { workspace = true }
livrarr-http = { workspace = true }
unicode-normalization = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
regex = { workspace = true }
csv = { workspace = true }
uuid = { workspace = true }
lru = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true, features = ["blocking", "rustls-tls"] }
tempfile = { workspace = true }
# The breaker reset/config seams used by the provider-refusal tests are gated
# behind livrarr-http's `test-helpers`; same pattern as livrarr-enrichment.
livrarr-http = { workspace = true, features = ["test-helpers"] }
