        existing_source: "crates/livrarr-matching/src/m1_embedded.rs:24-88"
        reuse_decision: wrap
        rationale: "Use as a read-path precedent while the cover inspector uses approved bounded ZIP/XML/image primitives."
      - capability: "Workspace-pinned archive, XML, hashing, and image libraries"
        existing_source: "Cargo.toml:23-58"
        reuse_decision: reuse
        rationale: "No archive/XML/image/hash parser is hand-written."
    public_api:
      types_ref: "ir-v1-identity-layer-rewrite.yaml#/modules[name=livrarr-library]/public_api/types"
      functions:
        - name: "EmbeddedCoverInspector::inspect_revision"
          signature_ref: "ir-v1-identity-layer-rewrite.yaml#/modules[name=livrarr-library]/public_api/functions[name=EmbeddedCoverInspector::inspect_revision]"
          error_contract_ref: "same selector /errors"
          pseudocode:
            - "Read the exact user/library-item/FileRevision durable inspection record before opening the file."
            - "If an unchanged record is Extracted, VerifiedNoCover, or FileGone, return it idempotently; if it is CouldNotInspect and force is false, suppress the background retry and return it."
            - "Check cancellation before scheduling and after the blocking task; return Cancelled without inventing an outcome if cancelled before an inspection result exists."
            - "Run bounded file access in spawn_blocking. Enforce maximum archive entries/uncompressed bytes, parse container/OPF with zip and quick-xml, decode candidate bytes with image, and hash FileRevision with sha2."
            - "Until the accepted ST-007 capture capability admits a real shape, map any unrecognized/malformed/encrypted/unreadable shape to CouldNotInspect; never assume a cover or VerifiedNoCover."
            - "Map disappearance before/during read to FileGone, a sampled readable no-cover shape to VerifiedNoCover, and sampled readable cover bytes to Extracted. Make zero provider requests."
            - "Persist the sanitized four-way exact-revision record through SqliteDb::record_embedded_cover_inspection before returning; bytes stay only in Extracted and never in the record."
            - "Return Database for durable read/write failure; a changed revision or force=true may inspect again."
          call_annotations:
            - { callee: "SqliteDb::read_embedded_cover_inspection", call: "durable read-first suppression", type: NEW, target: "livrarr-db::SqliteDb::read_embedded_cover_inspection" }
            - { callee: spawn_blocking, call: "bounded blocking file work", type: LIBRARY, target: tokio }
            - { callee: ZipArchive, call: "bounded EPUB archive read", type: LIBRARY, target: zip }
            - { callee: Reader, call: "container/OPF XML parse", type: LIBRARY, target: quick-xml }
            - { callee: load_from_memory, call: "cover-byte validation", type: LIBRARY, target: image }
            - { callee: Sha256, call: "revision hash", type: LIBRARY, target: sha2 }
            - { callee: "SqliteDb::record_embedded_cover_inspection", call: "persist exact outcome", type: NEW, target: "livrarr-db::SqliteDb::record_embedded_cover_inspection" }
          invariants:
            - "This feature creates no livrarr-library to livrarr-materialize edge; the caller brokers extracted bytes."
            - "Unchanged CouldNotInspect is retried only by explicit force, never a background pass."
          tdd_directives:
            - "RED inspector_real_epub_cover_absence_malformed_and_filegone_are_distinct: invoke production inspector over bounded temporary revisions."
            - "RED inspector_unchanged_failure_suppressed_changed_or_forced_retries: count blocking opens through the real service."
            - "RED inspector_zero_provider_calls_and_no_bytes_in_row: compose the production dependencies and inspect outbound/DB records."

