legacy_consumer_cutover:
  startup_sequence_ref: "ir-v1-identity-layer-rewrite.yaml#/migration_plan/startup_legacy_identity_sequence"
  category_dispositions_ref: "ir-v1-identity-layer-rewrite.yaml#/migration_plan/legacy_uniqueness_authority_cutover"
  execution: "Implement the IR v4 category dispositions for all sixteen production/test-helper consumer groups. After an active marker, every identity-mutating startup category is skipped and every normalized-key/legacy-ledger selector is disabled; the ordinary test helper follows its specific remove-old-index/activate-new-authority disposition. No line-range resurvey changes those ratified categories."
  surface_dispositions:
    - { surface: "work::update title/contributor identity edit", disposition: "replace the direct normalized-key write with a HumanWatching settle-class reconcile/commit continuation from G; when a choice is required its one SettlementCommit mints GroupIdentity, advances to G+1, and the inline action then resolves the returned card id at expected_generation G+1; presentation-only edits remain nonidentity" }
    - { surface: "preview_identity_edit / commit_identity_edit / clear_identity_slot", disposition: "retire LIS-01 through LIS-03 and remove their router registrations; no post-marker scalar or ledger writer survives" }
    - { surface: "work::preview_merge / work::merge", disposition: "keep preview read-only; POST enters HumanWatching settle-class reconciliation, mints GroupIdentity only through commit_settlement when choice is required, then resolves that returned card through resolve_review under the exhaustive merge policy" }
    - { surface: "work::affirm_pending_anchor", disposition: "use the PO-ratified PendingRoute kind; mint its card only through the settle-class commit from G and resolve the returned card id at expected_generation G+1 as user-confirmed; the private claimed anchor writer is removed" }
    - { surface: "work::retry_all_incomplete", disposition: "classify each pass as ConvergenceVisit, reuse converge_work plus captured-route handoff, and delete the pre-refresh settle_identity side channel" }
    - { surface: "legacy identity conflict resolve/dismiss and grey-park dismiss", disposition: "rewire conflict resolve/dismiss to resolve_review as typed resolve/reject; retire the old grey-park dismiss route under LIS-04" }
    - { surface: "root_folder::scan / scan_path file-to-work link matching", disposition: "adapt the in-memory lookup at crates/livrarr-handlers/src/root_folder.rs:181,258,427,467 to the new authority's normalized main plus primary AuthorId lookup projection; it remains a nonidentity file-link selector and performs no identity write" }

tdd_execution_policy:
  - "Every door or workflow directive begins at the production handler/job/workflow/CLI listed in doors and observes the composed service/repository boundary; tests do not preinsert the outcome they are meant to prove."
  - "Pure deterministic policy may be unit-tested through its declared public function, but the same behavior is also pinned by at least one real door integration."
  - "SQLite state is created by real migrations and production settlement/cutover calls; fault tests may fail a boundary statement but may not fabricate a postcondition."
  - "RED door_gate_work_update_rekey_mints_then_resolves: drive PUT /work/{id} with an identity-title change that needs a choice; trace one settle/commit from G that mints GroupIdentity and advances once, followed by one resolve_review using its returned card id and expected_generation G+1; an absent or no-longer-pending card returns NotFound and a generation mismatch returns StaleGeneration with zero writes."
  - "RED door_gate_legacy_identity_preview_route_is_absent: route the former preview request and require no registered post-marker mutation surface."
  - "RED door_gate_legacy_identity_commit_route_is_absent: route the former commit request and require no registered post-marker scalar writer."
  - "RED door_gate_legacy_identity_clear_route_is_absent: route the former clear request and require no registered post-marker scalar writer."
  - "RED door_gate_manual_merge_mints_then_resolves: drive preview then POST merge through one settle/commit from G that mints GroupIdentity when a choice is needed and advances once, then one resolve_review with the returned id and expected_generation G+1; absent or resolved card returns NotFound and mismatched generation returns StaleGeneration without mutation."
  - "RED door_gate_pending_affirm_mints_then_resolves: drive the real affirm route through one settle/commit from G that mints the PO-ratified PendingRoute kind and advances once, then one resolve_review with its returned id and expected_generation G+1; absent or resolved card returns NotFound and mismatched generation returns StaleGeneration without mutation."
  - "RED door_gate_retry_incomplete_uses_convergence_visit_settle_only: drive POST /work/retry-incomplete and fail on any direct legacy settle call."
  - "RED door_gate_conflict_resolve_calls_resolve_review_once: drive the registered legacy resolve URL and trace the typed shared continuation."
  - "RED door_gate_conflict_dismiss_calls_resolve_review_once: drive the registered legacy dismiss URL and trace typed Reject through the shared continuation."
  - "RED door_gate_legacy_grey_dismiss_route_is_absent: route the former identity-review dismiss URL and require no registered direct writer."

modules:
  - name: livrarr-domain
    structural_ref: "ir-v1-identity-layer-rewrite.yaml#/modules[name=livrarr-domain]"
    responsibility_ref: "ir-v1-identity-layer-rewrite.yaml#/modules[name=livrarr-domain]/responsibility"
    dependencies_ref: "ir-v1-identity-layer-rewrite.yaml#/modules[name=livrarr-domain]/dependencies"
    module_invariants_ref: "ir-v1-identity-layer-rewrite.yaml#/data_flow/invariants"
    capability_survey:
      - capability: "Canonical title, contributor, identifier, and stored-key matching primitives"
        existing_source: "crates/livrarr-domain/src/identity_matching.rs:161-668"
        reuse_decision: wrap
        rationale: "Keep one deterministic authority and extend it with typed route/guard inputs rather than another sameness recipe."
      - capability: "Six door-specific WorkCandidate seed constructors over one private assembler"
        existing_source: "crates/livrarr-domain/src/seed.rs:83-245"
        reuse_decision: wrap
        rationale: "Each existing door harvests through its established constructor, then converts the result into the ratified evidence bundle."
      - capability: "F1 primary-author route proof guard"
        existing_source: "crates/livrarr-domain/src/author_link.rs:418-459"
        reuse_decision: reuse
        rationale: "Work settlement inherits a provider author route only through the already-shipped author agreement proof."
      - capability: "Bounded keyed concurrency primitive"
        existing_source: "crates/livrarr-domain/src/keyed_mutex.rs:12-28"
        reuse_decision: reuse
        rationale: "Existing per-key capacity semantics remain the precedent for caller-owned locks; the identity repository still relies on durable generation claims."
    public_api:
      types_ref: "ir-v1-identity-layer-rewrite.yaml#/modules[name=livrarr-domain]/public_api/types"
      functions:
        - name: "IdentityRoadService::settle"
          signature_ref: "ir-v1-identity-layer-rewrite.yaml#/modules[name=livrarr-domain]/public_api/functions[name=IdentityRoadService::settle]"
          error_contract_ref: "same selector /errors"
          pseudocode:
            - "Accept only a typed IdentityRoadRequest whose user scope and origin are present."
            - "Validate CreationDoor evidence against the Always/Conditional/Never/minimum-only matrix; return InvalidDoorEvidence before any provider or repository call on a mismatch."
            - "For a MachineAlone existing-work request, admit only EnrichmentPass, ManualRefresh, or ConvergenceVisit evidence built from EnrichmentApplyOutcome.captured_route_evidence, with empty capture as an idempotent no-op. Separately admit only the named HumanWatching WorkUpdateRekey, ManualWorkMerge, or AffirmPendingRoute card-origination continuations; the last uses the PO-ratified PendingRoute kind. No other interactive or machine existing-work shape is legal."
            - "Before any dedup, adopt, insert-race-winner, or captured-route decision can mutate an existing Work, obtain one coherent captured identity graph plus generation G and require the implementation to decide and reconcile only against that snapshot."
            - "Dispatch through the composed generic implementation; ProviderBoundary is returned without changing committed identity when a provider adapter fails or drifts."
            - "Require SettlementCommit.expected_generation = G and exactly one claim; map a lost claim to StaleGeneration with zero writes and never re-decide or resubmit the stale decision. Map repository failure to Database."
            - "Return Settled, ReviewPending, Deferred, or Rejected exactly as the implementation reports. For a named interactive continuation requiring choice, ReviewPending contains the card id/kind minted only inside the sole SettlementCommit; because that commit advances coherent snapshot G exactly once, the subsequent resolve_review must pair the returned card id with expected_generation G+1."
          call_annotations:
            - { callee: validate_door_evidence, call: "validate origin/evidence matrix", type: NEW, target: "livrarr-metadata::identity_road::validate_door_evidence" }
            - { callee: "IdentityRoadServiceImpl::settle", call: "dispatch composed implementation", type: NEW, target: "livrarr-metadata::identity_road::IdentityRoadServiceImpl" }
            - { callee: "get_work_with_identity_generation", call: "existing generation precedent", type: EXISTING, target: "WorkIdentityRepository::get_work_with_identity_generation", evidence: "crates/livrarr-domain/src/services/work_identity.rs:348-359" }
          preconditions:
            security: ["request.user_id is the authenticated or installation-validated user scope"]
          postconditions:
            - "Every identity mutation is either one committed claimed transaction or zero writes."
          forbidden_behaviors:
            - "No evidence value is silently inserted to satisfy a door matrix cell."
            - "No caller may persist a route, tuple, contributor, edition, badge, review, or audit outside the settlement transaction."
          decisions:
            - { key: dispatch, value: "generic or enum-dispatched Send trait", rationale: "Project traits are non-dyn and use trait_variant::make(Send)." }
          tdd_directives:
            - "RED identity_road_every_listed_settle_door_reaches_one_settle: drive every creation/capture/retry entry plus WorkUpdateRekey, ManualWorkMerge, and AffirmPendingRoute and assert one typed request reaches this trait."
            - "RED identity_road_rejects_each_door_matrix_violation_before_side_effects: exercise missing Always, injected Never, and invalid minimum-only bundles."
            - "RED identity_road_existing_paths_claim_their_predecision_snapshot: race dedup, adopt, insert-race winner, and captured-route paths; assert expected_generation is the snapshot generation and a lost claim never re-decides."
            - "RED interactive_review_requires_freshly_minted_card: force edit/merge reconciliation from G to ReviewPending, assert one generation advance, then resolve only its returned card id at expected_generation G+1; absent or already-resolved card is NotFound and generation mismatch is StaleGeneration with zero writes."

        - name: "IdentityRoadService::resolve_review"
          signature_ref: "ir-v1-identity-layer-rewrite.yaml#/modules[name=livrarr-domain]/public_api/functions[name=IdentityRoadService::resolve_review]"
          error_contract_ref: "same selector /errors"
          pseudocode:
            - "Load the card named by the typed command; return NotFound when no pending card exists in the actor's admitted scope."
            - "Compare the command variant with stored ReviewKind; return ReviewKindMismatch before mutation on mismatch."
            - "Validate AuthenticatedUser equality or the installation-checked CutoverOperator single-user scope; return UnauthorizedScope otherwise."
            - "Check the command generation against the card and affected identity generation; return StaleGeneration with zero writes when either differs."
            - "Validate the action against the stored allowed action set and complete evidence; return InvalidResolution for an arbitrary value, incomplete route set, or invalid target."
            - "Check cancellation before claiming and immediately before commit; return Cancelled with the card still pending."
            - "Delegate one atomic continuation and actor audit; map storage failure to Database and return the resulting IdentityRoadOutcome."
          call_annotations:
            - { callee: load_pending_review, call: "load card and generation", type: NEW, target: "WorkIdentityRepository::load_pending_review" }
            - { callee: validate_review_action, call: "validate typed action", type: NEW, target: "livrarr-domain::review::validate_review_action" }
            - { callee: "apply_review_candidate_claimed", call: "existing status/generation claim precedent", type: EXISTING, target: "WorkIdentityRepository::apply_review_candidate_claimed", evidence: "crates/livrarr-handlers/src/identity_review.rs:127-159" }
            - { callee: is_cancelled, call: "observe cancellation", type: EXISTING, target: "tokio_util::sync::CancellationToken", evidence: "crates/livrarr-server/src/jobs/convergence.rs:44" }
          preconditions:
            security: ["ReviewActor was constructed only at the authenticated HTTP or exclusive cutover boundary."]
          postconditions:
            - "Success persists the resolution and actor audit atomically and advances generation once."
          tdd_directives:
            - "RED http_and_cli_resolve_share_exact_continuation: resolve the same fixture through each production entry and compare graph plus provenance."
            - "RED review_kind_scope_generation_and_cancel_fail_closed: drive each failure through the real handler/CLI without injected repository state."

        - name: "WorkIdentityRepository::read_captured_identity"
