merge_field_disposition:
  policy_ref: "ir-v1-identity-layer-rewrite.yaml#/merge_field_policy"
  completeness_basis:
    current_work: "crates/livrarr-domain/src/entities.rs:388-438"
    current_library_item: "crates/livrarr-domain/src/entities.rs:483-499"
    edition_authority: "ir-v1-identity-layer-rewrite.yaml#/modules[name=livrarr-domain]/public_api/types[name=Edition]"
  rules:
    - { entity: Work, field: id, disposition: "Keep the selected survivor's stable WorkId; archive every loser id and never reuse it." }
    - { entity: Work, field: user_id, disposition: "Require equality with the caller and every cohort member; reject cross-user reconciliation." }
    - { entity: Work, field: title, disposition: "Map to the selected IdentityTitleTuple main plus its display projection; user/user or differing machine singulars create FieldResolution review." }
    - { entity: Work, field: sort_title, disposition: "Recompute deterministically from the settled display title; never choose a survivor by this derived field." }
    - { entity: Work, field: subtitle, disposition: "Treat as legacy work-level tuple/display evidence during cutover; preserve explicit provenance, never copy it into an Edition, and resolve singular conflict under the v4 title policy." }
    - { entity: Work, field: original_title, disposition: "Preserve equal or sole present evidence; user evidence wins machine, otherwise differing present values require FieldResolution review." }
    - { entity: Work, field: author_name, disposition: "Map to ordered Author-record contributors and retire the scalar as authority; tags/display read the primary Author record at use time." }
    - { entity: Work, field: author_id, disposition: "Map to contributor ordinal zero and the derived primary_author_id projection; conflicting partition/order requires ContributorOrder review." }
    - { entity: Work, field: description, disposition: "Apply the v4 user-beats-machine singular rule; no provider priority or non-null coalescing resolves disagreement." }
    - { entity: Work, field: year, disposition: "Apply the v4 user-beats-machine singular rule; differing machine values park unless a ratified total derivation exists." }
    - { entity: Work, field: series_id, disposition: "Preserve as an explicit local relationship to the survivor; conflicting local relations remain reviewable and never select identity." }
    - { entity: Work, field: series_name, disposition: "Apply the v4 singular rule independently from series_id; it does not select survivor identity." }
    - { entity: Work, field: series_position, disposition: "Apply the v4 singular rule and preserve explicit user absence/value; it can inform volume veto but cannot overwrite the identity tuple." }
    - { entity: Work, field: genres, disposition: "Union into sourced subjects by taxonomy and normalized value while retaining exact spellings and provenance." }
    - { entity: Work, field: language, disposition: "Apply the v4 singular rule; do not infer from route kind, provider name, cover, or sibling edition." }
    - { entity: Work, field: page_count, disposition: "Apply the v4 user-beats-machine singular rule; differing present machine values review." }
    - { entity: Work, field: duration_seconds, disposition: "Apply the v4 user-beats-machine singular rule independently of LibraryItem duration facts." }
    - { entity: Work, field: publisher, disposition: "Apply the v4 user-beats-machine singular rule; preserve provenance." }
    - { entity: Work, field: publish_date, disposition: "Apply the v4 user-beats-machine singular rule; preserve exact sourced value." }
    - { entity: Work, field: ol_key, disposition: "Migrate a nonblank value to an OpenLibrary work-scoped typed route; blank sentinels create no route." }
    - { entity: Work, field: hc_key, disposition: "Migrate a nonblank value to a Hardcover work-scoped typed route; collisions park rather than overwrite ownership." }
    - { entity: Work, field: gr_key, disposition: "Treat the legacy value as Goodreads book/edition evidence, attach it to an Edition, and capture a work route only from an already-fetched readable page." }
    - { entity: Work, field: isbn_13, disposition: "Move to an edition-owned ISBN route; create or select an Edition without inferring format/language, and never copy the route back to work scope." }
    - { entity: Work, field: asin, disposition: "Move to an edition-owned ASIN route; retain Unknown format/absent language unless direct evidence exists." }
    - { entity: Work, field: narrator, disposition: "Treat the entire sourced vector as the v4 narrator singular: user value/absence wins; differing machine vectors require review." }
    - { entity: Work, field: narration_type, disposition: "Apply the v4 singular rule; never infer it from provider or format alone." }
    - { entity: Work, field: abridged, disposition: "Preserve explicit user evidence; an automatic classification requires an opaque accepted sampled-text capability, otherwise review." }
    - { entity: Work, field: rating, disposition: "Apply the v4 singular rule and preserve source; rating never participates in identity." }
    - { entity: Work, field: rating_count, disposition: "Apply the v4 singular rule and preserve source; count never participates in identity." }
    - { entity: Work, field: enrichment_status, disposition: "Recompute from preserved enrichment outcomes after settlement; never choose content or a survivor." }
    - { entity: Work, field: identity_status, disposition: "Derive from the surviving active-route set and user-confirmation provenance; a zero-route confirmed invariant emits repair review and falls back." }
    - { entity: Work, field: enriched_at, disposition: "Recompute/advance with the post-merge enrichment outcome; it never selects content." }
    - { entity: Work, field: enrichment_source, disposition: "Recompute from the applied normalized evidence set; preserve observations separately and do not use first arrival." }
    - { entity: Work, field: cover_url, disposition: "Convert to a retained cover candidate and recompute the ebook selection by source/format rank; do not copy a selected URL as authority." }
    - { entity: Work, field: cover_manual, disposition: "Map true to explicit user-choice provenance at rank zero; false supplies no trust grade." }
    - { entity: Work, field: cover_source, disposition: "Preserve as the visible source label/provenance on the candidate and selection." }
    - { entity: Work, field: legacy_ebook_trust_grade_column, source: "entities.rs:426", disposition: "Remove from domain/storage/DTO/gates; it contributes no migrated selection authority." }
    - { entity: Work, field: cover_width, disposition: "Preserve measured dimensions on the retained candidate; recompute selected dimensions from the winner." }
    - { entity: Work, field: cover_height, disposition: "Preserve measured dimensions on the retained candidate; recompute selected dimensions from the winner." }
    - { entity: Work, field: audiobook_cover_url, disposition: "Convert to a retained audiobook cover candidate and recompute that slot; explicit ebook fallback remains a separate selection fact." }
    - { entity: Work, field: audiobook_cover_source, disposition: "Preserve as visible source/provenance on the candidate and selected slot." }
    - { entity: Work, field: legacy_audiobook_trust_grade_column, source: "entities.rs:431", disposition: "Remove from domain/storage/DTO/gates; it contributes no migrated selection authority." }
    - { entity: Work, field: audiobook_cover_width, disposition: "Preserve measured dimensions on the candidate; recompute the selected dimensions." }
    - { entity: Work, field: audiobook_cover_height, disposition: "Preserve measured dimensions on the candidate; recompute the selected dimensions." }
    - { entity: Work, field: monitor_ebook, disposition: "OR-combine independently across the cohort." }
    - { entity: Work, field: monitor_audiobook, disposition: "OR-combine independently across the cohort." }
    - { entity: Work, field: import_id, disposition: "Move every nonblank value to the lossless import-origin collection; no first-arrival winner." }
    - { entity: Work, field: added_at, disposition: "Retain the earliest fact timestamp and preserve every original Added audit event." }
    - { entity: LibraryItem, field: id, disposition: "Preserve each file record id; LibraryItems are reparented, not merged by arrival." }
    - { entity: LibraryItem, field: user_id, disposition: "Require caller scope on every read/write and reject cross-user reparenting." }
    - { entity: LibraryItem, field: work_id, disposition: "Repoint to the survivor only inside the settlement transaction; a human-watching conflict remains unattached until resolution." }
    - { entity: LibraryItem, field: root_folder_id, disposition: "Preserve the file's collection/root ownership unchanged." }
    - { entity: LibraryItem, field: path, disposition: "Preserve exact path; any destination/path collision creates explicit import/file review and drops no file." }
    - { entity: LibraryItem, field: media_type, disposition: "Preserve direct file classification; it does not infer Edition format without direct evidence." }
    - { entity: LibraryItem, field: file_size, disposition: "Preserve as a file fact and include it in FileRevision; never select work identity." }
    - { entity: LibraryItem, field: import_id, disposition: "Preserve and union its origin record with the survivor's import history." }
    - { entity: LibraryItem, field: imported_at, disposition: "Preserve per item; do not replace with Work.added_at." }
    - { entity: LibraryItem, field: tag_status, disposition: "Preserve per item and recompute only through the existing tag/materialization road." }
    - { entity: LibraryItem, field: tagged_at_generation, disposition: "Preserve per item; later tag writes advance against the settled work generation." }
    - { entity: LibraryItem, field: duration_seconds, disposition: "Preserve direct file measurement independently from the Work-level singular." }
    - { entity: LibraryItem, field: chapter_scan_status, disposition: "Preserve per file; identity settlement does not reinterpret scan state." }
    - { entity: Edition, field: id, disposition: "Preserve on reparent; merge two editions only with direct co-edition proof or explicit user target and archive the loser id." }
    - { entity: Edition, field: user_id, disposition: "Require equality with caller and owner Work." }
    - { entity: Edition, field: work_id, disposition: "Reparent whole edition atomically; a route transfer moves only the contested id unless co-edition proof exists." }
    - { entity: Edition, field: format, disposition: "Use direct file/provider/user evidence only; conflicting direct values park, and Unknown remains valid/ineligible for defaults." }
    - { entity: Edition, field: language, disposition: "Use direct edition/file/provider/user evidence only; conflicting present facts park and absence is valid." }
    - { entity: Edition, field: subtitle, disposition: "Preserve direct edition evidence/explicit absence; never populate from Work tuple, rendered subtitle, or machine projection." }
    - { entity: Edition, field: routes, disposition: "Union by typed key while keeping exactly one Edition owner; ownership collision parks class C." }
    - { entity: Edition, field: covers, disposition: "Union every candidate and provenance; selection is recomputed and is not destructive filtering." }
    - { entity: Edition, field: source_provider, disposition: "Preserve sourced provenance; conflicting machine values do not select identity or an arbitrary winner." }
    - { entity: Edition, field: provider_edition_id, disposition: "Normalize into an edition-scoped typed route; equality can confirm only inside authority and inequality is no evidence." }
    - { entity: Edition, field: state, disposition: "Retain Active unless an audited merge/empty-shell resolution archives it; archived rows never re-enter active scans." }
    - { entity: NewAuthority, field: identity_title_main, disposition: "Apply the v4 title singular policy and re-key the complete group on the chosen value." }
    - { entity: NewAuthority, field: identity_title_subtitle, disposition: "Apply the v4 title singular policy including explicit absence; one-sided subtitle is not a different-work veto." }
    - { entity: NewAuthority, field: identity_title_volume, disposition: "Apply the v4 title singular policy; contradictory volume evidence remains a wrong-merge guard." }
    - { entity: NewAuthority, field: subtitle_override_state, disposition: "UserValue/UserAbsent are protected singulars; Automatic means no override and reset changes display only." }
    - { entity: NewAuthority, field: subtitle_override_value, disposition: "Resolve with override state; conflicting user values/absence park." }
    - { entity: NewAuthority, field: machine_subtitle_projection, disposition: "Never merge stored value; recompute totally from selected direct edition evidence/defaults." }
    - { entity: NewAuthority, field: machine_subtitle_provenance, disposition: "Recompute with the projection and never mutate tuple/key/review state." }
    - { entity: NewAuthority, field: primary_author_id, disposition: "Retain surviving primary contributor or resolve complete ordering before re-key; projection equals ordinal zero." }
    - { entity: NewAuthority, field: text_distinction, disposition: "Retain survivor distinction; only audited same-work merge retires loser distinctions and attach never mints one." }
    - { entity: NewAuthority, field: canonical_work_pointer, disposition: "User evidence beats machine; conflicting user or different present machine pointers park." }
    - { entity: NewAuthority, field: default_edition_per_format, disposition: "Resolve independently per known format; user evidence wins and Unknown is ineligible." }
    - { entity: NewAuthority, field: ebook_cover_selection, disposition: "Recompute from retained candidates with user then owned-file then default/same-format ranking." }
    - { entity: NewAuthority, field: audiobook_cover_selection, disposition: "Recompute independently; explicit fallback to selected ebook is allowed and recorded." }
    - { entity: NewAuthority, field: merge_generation, disposition: "Advance from preserved enrichment results and never select content." }
