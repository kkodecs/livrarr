    current_entry: "crates/livrarr-handlers/src/work.rs::add"
    current_evidence: "crates/livrarr-handlers/src/work.rs:171-272; local resolve, seed_add_box, add_fast, spawned completion, then interactive refresh"
  - door: ManualImport
