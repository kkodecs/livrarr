operational_decisions:
  - key: single_writer
    value: "Every create, dedup, adopt, normalized match, and database race-loser continuation submits one IdentityRoadRequest; only the repository transaction reached through commit_settlement may mutate identity state."
    rationale: "The current preflight-and-additive-merge path at crates/livrarr-metadata/src/work_service.rs:281-308 is a second non-generation writer and is absorbed rather than retained."
  - key: interactive_card_origination
    value: "WorkUpdateRekey and ManualWorkMerge enter the HumanWatching settle class from a coherent snapshot G. If complete-group reconciliation requires an audited choice, that call includes one typed GroupIdentity card draft in its sole SettlementCommit, advances generation exactly once, and returns ReviewPending; the handler may then issue the matching ReviewResolutionCommand only with the returned card_id and expected_generation G+1. AffirmPendingRoute uses the same mint-then-resolve shape with the PO-ratified ReviewKind::PendingRoute (2026-08-08)."
    rationale: "A closed ReviewResolutionCommand cannot address a card-less continuation, and commit_settlement is the only permitted card-origination writer."
  - key: p4_human_machine_split
    value: "Human-watching doors surface a possible duplicate or disagreement before attachment; machine doors decide only authority-certain evidence and otherwise defer or park."
    rationale: "P4 and the ratified per-door evidence matrix distinguish flag from decide without creating a second road."
  - key: probe_capabilities
    value: "Raw unsampled provider or EPUB shapes are not decision inputs. Only opaque capability values constructed by accepted probe registries may unlock their corresponding branches."
    rationale: "This makes every ST-006(a-f) and ST-007 default fail closed and lets code-stage probe artifacts slot in without changing signatures."
  - key: sibling_panel_copy
    value: "The sibling panel is informational and has no identity, route, file, or confirmation mutation action. Frozen by PO 2026-08-08: Confirming this book's identity affects only this book. Other books by this author stay exactly as they are."
    rationale: "REQ-022 binds behavior while FP-023 forbids invented copy."
  - key: feature_scoped_library_boundary
    value: "For this feature, livrarr-library emits local inspection evidence through domain/db seams and has no materialization dependency; the pre-existing canonical S1 materialization road remains intact."
    rationale: "DEP-007 is feature-scoped and does not amend or retire canonical S1."

