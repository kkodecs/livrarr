# IR v2 — Operational
# Feature: metadata-correctness (Sprint B). Extends ir-v1-metadata-correctness.yaml.
# Structural content (components, libraries, shared types, dependency graph) lives in
# IR v1; this file adds pseudocode, call annotations, conditions, and TDD directives
# for every NEW or CHANGED function. All EXISTING signatures verified by direct read
# on main @ ac296ad (survey citations re-verified 2026-06-11).
#
# Grounding corrections vs IR v1 (verified against source):
#   1. BulkRefreshGuard is defined in livrarr-domain (not livrarr-metadata): the
#      WorkService trait (livrarr-domain/src/services/work.rs:253+) declares
#      try_start_bulk_refresh, so the guard type must be nameable from domain.
#   2. REQ-005's residual edge is chapter EXTRACTION, not tag writing: the import
#      save path already routes through livrarr-materialize (verified: zero tag-write
#      calls in livrarr-library; import_workflow.rs:282 calls
#      livrarr_tagwrite::extract_m4b_chapters — a read). Design: ChapterExtractor
#      trait in domain, impl in server, injected into library.
#   3. WorkFilter is consumed only by WorkServiceImpl::list (work_service.rs:1052,
#      in-memory retains) — REQ-015's language facet is a service-level retain; no
#      db change. IR v1's requirements_map listed livrarr-db for REQ-015; corrected:
#      db is NOT touched by REQ-015.
#   4. The bulk-refresh loop stays in the handler (established handler-spawning
#      pattern, wiki insight 9g); IR v1's WorkService::refresh_all_filtered is
#      replaced by: handler builds WorkFilter from request params and owns the loop.
#
# Annotation convention (review r2 R-004): calls whose target is a function
# DECLARED IN THIS IR are annotated EXISTING with target "...(declared in this
# IR)" — the compliance checker rejects NEW annotations targeting declared
# functions. Such calls are NEW CODE; "EXISTING" means "exists in the IR
# universe", not "exists on main today".

metadata:
  feature: "metadata-correctness"
  stage: v2-operational
  spec_ref: "spec-metadata-correctness.md"
  ir_v1_ref: "ir-v1-metadata-correctness.yaml"

# Mirrored from IR v1 because the compliance gate resolves LIBRARY call
# annotations against THIS file's list (gate friction noted: the template says
# don't duplicate IR v1 content, but check_compliance reads approved_libraries
# from IR v2). IR v1 remains the authoritative list; keep in sync.
approved_libraries:
  - { name: "sqlx", version: "0.8", usage: "call-record + dissent tables, eviction, merge UPDATE" }
  - { name: "chrono", version: "workspace", usage: "timestamps" }
  - { name: "image", version: "0.25", usage: "cover dimension decode" }
  - { name: "tracing", version: "0.1", usage: "instrumentation" }
  - { name: "tracing-appender", version: "0.2", usage: "daily rolling appender" }
  - { name: "serde", version: "workspace", usage: "API DTOs" }
  - { name: "trait-variant", version: "workspace", usage: "async service traits" }
  - { name: "tokio", version: "workspace", usage: "spawn, channels, spawn_blocking, guards" }
  - { name: "unicode-normalization", version: "0.1", usage: "diacritic folding" }
  - { name: "rapidfuzz", version: "0.5", usage: "existing matcher core" }
  - { name: "regex", version: "1", usage: "variant-form parsing" }

modules:
  # ================================================================ livrarr-domain
  - name: livrarr-domain
    responsibility: "Shared vocabulary: call-record types + sink trait, stats service trait, dissent types, AnchorQuery, ChapterExtractor, RAII BulkRefreshGuard, Release home, WorkFilter.language, LogSurfaceStatus. REQ-001/002/003/004/005/006/013/014/015/016."
    dependencies: []
    module_invariants:
      - "ProviderCallSink stays sync + dyn-safe (NOT trait_variant): callable from any crate without a db edge or generics explosion; implementations must never block the caller."
      - "BulkRefreshGuard releases its slot on Drop unconditionally — no method exists to leak it."
    capability_survey:
      - { capability: "per-provider call recording", existing_source: "none (ProviderHealthState in livrarr-server is in-memory ok/error only, state.rs:665; zero persisted timing anywhere — ST-008)", reuse_decision: rewrite, rationale: "nothing persists outcomes today; new types + sink trait" }
      - { capability: "provider stats query service", existing_source: "ProviderHealthState::statuses() (server/state.rs:704)", reuse_decision: rewrite, rationale: "replaced by record-fed 24h aggregates (REQ-002 'replaces the ok/error-only view'); ProviderHealthState retired" }
      - { capability: "dissent recording", existing_source: "none (whole-work Conflict short-circuit at enrichment lib.rs:692-710 discards instead of recording)", reuse_decision: rewrite, rationale: "#110: per-field/provider isolation with queryable records is new" }
      - { capability: "anchor-only fetch vocabulary", existing_source: "ProviderClient::fetch(&Work) tier chains ending in text search (provider_client.rs:757-861, google_books.rs:177-200)", reuse_decision: wrap, rationale: "AnchorQuery enum names exactly the anchor tiers; text tiers stay on lookup/identity surfaces only" }
      - { capability: "m4b chapter extraction contract", existing_source: "livrarr_tagwrite::extract_m4b_chapters (called from library import_workflow.rs:282)", reuse_decision: wrap, rationale: "REQ-005: trait in domain + server impl removes library's last tagwrite use; extraction logic unchanged" }
      - { capability: "bulk-refresh slot guard", existing_source: "bulk_refresh_users HashSet + bool try_start/finish (work_service.rs:67,1961-1969)", reuse_decision: wrap, rationale: "same slot set, RAII ownership: Drop releases on every exit path incl. panic unwind (AC-018)" }
      - { capability: "release entity", existing_source: "the legacy release-search struct in livrarr-download/src/lib.rs:199 (all-primitive fields)", reuse_decision: reuse, rationale: "field-for-field relocation to the spine home; behavior unchanged (REQ-004)" }
    public_api:
      types:
        - kind: struct
          name: BulkRefreshGuard
          fields:
            - { name: slots, type: "Arc<std::sync::Mutex<std::collections::HashSet<i64>>>" }
            - { name: user_id, type: "i64" }
      functions:
        - name: "ProviderCallSink::record"
          inputs: [{ name: rec, type: ProviderCallRecord }]
          output: "()"
          errors: []
          pseudocode:
            - "trait contract: accept the record and return immediately (fire-and-forget)"
            - "implementations enqueue for asynchronous persistence; on a full queue, drop the record and count the drop — never block or propagate errors to the instrumented call path"
          call_annotations:
            - { call: "enqueue to channel", type: NEW, target: "impl-specific (server CallSinkTask)" }
          forbidden_behaviors:
            - "blocking the calling task"
            - "carrying payload bodies, filenames, or credentials in detail (LLM/privacy boundary: outcome class + short error class only)"
          tdd_directives:
            - "record() returns in O(1) even when the persistence backend is wedged (stub sink with a full channel)"
        - name: "ChapterExtractor::extract_m4b_chapters"
          inputs: [{ name: path, type: "&Path" }]
          output: "Result<Vec<AudiobookChapter>, ChapterExtractionError>"
          errors: ["ChapterExtractionError"]
          pseudocode:
            - "trait contract mirroring the existing livrarr_tagwrite::extract_m4b_chapters signature so the server impl is a one-line delegation"
          call_annotations:
            - { call: "livrarr_tagwrite::extract_m4b_chapters", type: EXISTING, target: "livrarr-tagwrite (delegated in the server impl only)" }
          tdd_directives:
            - "library import behavioral tests pass unchanged with the trait-injected extractor (AC-006 second clause)"
        - name: "BulkRefreshGuard::drop"
          inputs: []
          output: "()"
          errors: []
          pseudocode:
            - "lock slots; remove user_id; (Mutex poisoning: use lock().unwrap_or_else(PoisonError::into_inner) so a panicked peer cannot wedge release)"
          call_annotations:
            - { call: "Mutex::lock", type: STDLIB, target: "std::sync::Mutex" }
          postconditions:
            - "the user's bulk slot is free; a subsequent try_start_bulk_refresh(user_id) returns Some"
          tdd_directives:
            - "guard dropped during panic unwind releases the slot (catch_unwind test, AC-018)"
            - "guard moved into a tokio task that is aborted still releases the slot"

  # ================================================================ livrarr-db
  - name: livrarr-db
    responsibility: "Migrations 059 (provider_call_records), 060 (work_field_dissents), 061 (drop works.metadata_source). Call-record write/query/eviction. Dissent write/query. apply_enrichment_merge hardened (REQ-007 structural + REQ-009 no-clobber)."
    dependencies: [livrarr-domain]
    module_invariants:
      - "New tables use ON-CONFLICT upserts; OR-REPLACE forms are banned (contract pattern + insight 20)."
      - "All writes scoped by user_id (tenant rule) except call records, which are system-scoped (provider telemetry carries no user data)."
    capability_survey:
      - { capability: "per-(work,provider) state table", existing_source: "provider_retry_state (migration 029, sqlite_retry_state.rs)", reuse_decision: reuse, rationale: "schema/index pattern copied for the two new tables" }
      - { capability: "merge write site", existing_source: "apply_enrichment_merge (sqlite_work.rs:866-1062)", reuse_decision: rewrite, rationale: "REQ-007: anchor columns leave the UPDATE entirely; REQ-009: cover_url/language gain populated-never-NULLed guards" }
      - { capability: "retention/eviction", existing_source: "none in migrations 001-058", reuse_decision: rewrite, rationale: "first bounded table; age + count eviction, oldest first (PO: 30d/100k)" }
      - { capability: "cover dimension writer", existing_source: "update_cover_dimensions (db lib.rs:282 trait, sqlite_work.rs:661 impl, verified zero callers)", reuse_decision: reuse, rationale: "REQ-017 wires the existing dead writer; signature untouched" }
    public_api:
      types: []
      functions:
        - name: record_provider_calls
          inputs: [{ name: batch, type: "Vec<ProviderCallRecord>" }]
          output: "Result<(), DbError>"
          errors: ["DbError"]
          pseudocode:
            - "single transaction; multi-row INSERT into provider_call_records (no conflict target — append-only log with autoincrement id)"
            - "columns: provider, operation, work_id (nullable), started_at, duration_ms, outcome, detail"
          call_annotations:
            - { call: "sqlx::query batch insert", type: LIBRARY, target: "sqlx" }
          tdd_directives:
            - "AC-001: records inserted for each operation class survive a pool reopen (restart simulation)"
        - name: query_provider_stats_24h
          inputs: []
          output: "Result<Vec<ProviderStats>, DbError>"
          errors: ["DbError"]
          pseudocode:
            - "one aggregate query over records with started_at >= now-24h, grouped by provider:"
            - "calls_24h = COUNT(*); success_rate = successes over (count minus skipped/cached classes); median_latency_ms over network-outcome rows only (skips/cached excluded from latency)"
            - "last_error = (detail, started_at) of newest row with outcome in (error, timeout, rate_limited); last_success = newest success started_at"
          call_annotations:
            - { call: "sqlx::query aggregate", type: LIBRARY, target: "sqlx" }
          decisions:
            - { key: "latency denominator", value: "network outcomes only", rationale: "skipped_no_anchor/skipped_policy/cached rows have ~0 duration and would fake the median (ST-010 baseline comparability)" }
          tdd_directives:
            - "AC-003: aggregates match a hand-computed fixture set incl. mixed outcome classes"
        - name: evict_call_records
          inputs: [{ name: policy, type: RetentionPolicy }]
          output: "Result<u64, DbError>"
          errors: ["DbError"]
          pseudocode:
            - "DELETE rows older than max_age_days"
            - "if remaining count > max_records: DELETE oldest (count - max_records) by id ascending"
            - "return total deleted"
          call_annotations:
            - { call: "sqlx::query delete", type: LIBRARY, target: "sqlx" }
          tdd_directives:
            - "AC-002: store stays within bounds under simulated overflow; oldest evicted first"
        - name: record_field_dissents
          inputs: [{ name: user_id, type: UserId }, { name: work_id, type: WorkId }, { name: dissents, type: "Vec<FieldDissent>" }]
          output: "Result<(), DbError>"
          errors: ["DbError"]
          pseudocode:
            - "transaction: DELETE existing dissent rows for work_id with merge_generation < incoming generation (supersede)"
            - "insert incoming rows (work_id, provider, field, offered_value, winning_value, reason, merge_generation, recorded_at)"
          call_annotations:
            - { call: "sqlx::query", type: LIBRARY, target: "sqlx" }
          postconditions:
            - "dissents are queryable per work (providers, fields, values — REQ-014 wording) and reflect the newest merge generation"
          tdd_directives:
            - "AC-016: dissent rows present after a conflicted merge; superseded rows gone after the next merge"
        - name: "migration 061 — drop works.metadata_source"
          inputs: []
          output: "n/a (SQL migration)"
          errors: []
          pseudocode:
            - "NEW migration file (numbering after current max 058, adjusted to land after 059/060): ALTER TABLE works DROP COLUMN metadata_source"
            - "applied migrations are never edited (insight 19); the add-column migration 012 stays untouched"
          call_annotations:
            - { call: "sqlx::migrate! embedded runner", type: LIBRARY, target: "sqlx" }
          tdd_directives:
            - "AC-020: post-migrate schema has no metadata_source column (PRAGMA table_info assertion); a workspace scan finds zero .rs references to the column (review r1 G-R-002)"
        - name: apply_enrichment_merge
          inputs: [{ name: req, type: ApplyEnrichmentMergeRequest }]
          output: "Result<ApplyMergeOutcome, DbError>"
          errors: ["DbError"]
          pseudocode:
            - "MODIFIED existing fn (sqlite_work.rs:866). Type change upstream: UpdateWorkEnrichmentDbRequest loses hc_key/gr_key/ol_key/isbn_13/asin fields; ApplyEnrichmentMergeRequest loses external_id_updates (REQ-007 made structural — anchor data cannot reach this statement)"
            - "UPDATE column list drops the five anchor columns entirely"
            - "cover_url bind becomes guarded: only overwrite when incoming is non-empty (populated value never replaced by NULL/empty) — same guard shape as the existing asin guard"
            - "language bind becomes guarded the same way (REQ-009: NULLed language flips foreign policy)"
            - "existing optimistic merge_generation check and status-only path unchanged"
          call_annotations:
            - { call: "sqlx::query UPDATE", type: LIBRARY, target: "sqlx" }
          invariants:
            - "no anchor column appears in any enrichment-merge SQL (AC-009 inline-store clause)"
            - "a populated cover_url/language is never overwritten by NULL or empty string (AC-011)"
          tdd_directives:
            - "AC-008 (F1 fixture): forensic starting state + full merge → zero anchor changes, series_name stays NULL"
            - "AC-011: update carrying NULL for populated cover_url/language leaves stored values byte-identical"

  # ================================================================ livrarr-external-data
  - name: livrarr-external-data
    responsibility: "Anchor-only enrichment fetch surface per provider + call recording at the client boundary (covers lookup, identity, enrich, cover ops in one place). REQ-001/006."
    dependencies: [livrarr-domain, livrarr-http]
    module_invariants:
      - "fetch_by_anchor never constructs a text-search request: its input type admits no title/author (AC-007)."
      - "Every public client call emits exactly one ProviderCallRecord (including NotConfigured and rate-limit rejections)."
    capability_survey:
      - { capability: "per-provider fetch chains", existing_source: "ProviderClient::fetch(&Work) (provider_client.rs:42-52) with internal tiers: GR provider_client.rs:757-861 (gr_key → isbn+LLM → LLM key → title/author+LLM), GB google_books.rs:177-200 (isbn → intitle/inauthor), HC :273 (isbn → title/author), OL :422 (isbn → ol_key → title/author), Audnexus :174 (asin → title), Audible (internal)", reuse_decision: wrap, rationale: "anchor tiers extracted into fetch_by_anchor; text tiers remain only behind the existing lookup/identity entry points (REQ-006). fetch(&Work) is removed from the enrichment dispatch path" }
      - { capability: "transport cache", existing_source: "transport_cache.rs cache_take (consume-once, 300s)", reuse_decision: reuse, rationale: "unchanged; Cached records are emitted by the enrichment pipeline at the cache_take hit (lib.rs:1256-1259), not here" }
      - { capability: "provider name strings", existing_source: "provider_name() (enrichment lib.rs:635-647): hardcover/openlibrary/goodreads/audnexus/google_books/audible", reuse_decision: reuse, rationale: "record.provider uses these canonical strings; handler maps to display names" }
    public_api:
      types: []
      functions:
        - name: "ProviderClient::fetch_by_anchor"
          inputs: [{ name: query, type: AnchorQuery }, { name: language, type: "Option<&str>" }]
          output: "ProviderOutcome<NormalizedWorkDetail>"
          errors: []
          pseudocode:
            - "match (self, query): each provider accepts exactly the spec's anchor mapping (REQ-006) — GoogleBooks: Isbn13; Goodreads: GrKey ONLY (the existing GR ISBN→LLM disambiguation tier is an identity-surface capability consumed by anchor completion, never an enrichment fetch); Hardcover: HcKey or Isbn13; OpenLibrary: OlKey or Isbn13; Audnexus/Audible: Asin"
            - "a (provider, query-kind) mismatch is a programming error surfaced as NotFound + warn (the queue derives queries, so mismatch should be unreachable)"
            - "run the provider's existing anchor-tier request/parse code (moved, not rewritten) with pacing/timeout/breaker behavior unchanged"
            - "no branch may fall through to a title/author search — those code paths live only behind the lookup/identity entry points"
            - "start timer before the request; on return emit ProviderCallRecord{provider, operation: Enrich, duration, outcome mapped from ProviderOutcome} via the injected sink"
          call_annotations:
            - { call: "existing per-provider anchor request/parse fns", type: EXISTING, target: "provider modules (goodreads.rs, google_books.rs, hardcover.rs, openlibrary.rs, audnexus.rs, audible.rs)" }
            - { call: "ProviderCallSink::record", type: EXISTING, target: "livrarr-domain (declared in this IR)" }
            - { call: "reqwest via HttpClient", type: EXISTING, target: "livrarr-http" }
          preconditions:
            data_invariants: ["query value is non-empty (queue derives only from present anchors)"]
          forbidden_behaviors:
            - "constructing any request URL containing title or author terms"
            - "GR: any endpoint other than autocomplete/detail-by-key (ST-012); GB: any keyless call (ST-014)"
          decisions:
            - { key: "outcome mapping", value: "Success→Success; NotFound→NotFound; NotConfigured→SkippedPolicy; WillRetry(RateLimited)→RateLimited; WillRetry(Timeout)→Timeout; PermanentFailure→Error. LlmRejected arises on Identity-operation records (GR disambiguation during resolution/completion), never on Enrich records", rationale: "REQ-001's enum is the reporting vocabulary; ProviderOutcome is the control-flow vocabulary — explicit map, no catch-all; REQ-006 keeps every LLM-disambiguation tier off the enrichment surface" }
            - { key: "recording at client boundary", value: "all four operations (lookup/identity/enrich/cover) record inside client methods with the operation passed by the caller context", rationale: "one choke covers every call site; pipeline-level skips (no anchor, policy, cached) are recorded by the layer that decides them since no client call happens" }
          tdd_directives:
            - "AC-007: with Goodreads reachable and gr_key absent, no GR request is issued and no text-search URL is constructible (type-level: a test that tries to express a title query via AnchorQuery must not compile — compile-fail test)"
            - "each provider × anchor-kind: request URL matches the existing anchor-tier shape (regression against current behavior)"

  # ================================================================ livrarr-identity
  - name: livrarr-identity
    responsibility: "Anchor completion on refresh (REQ-008) built on the existing convergence path; add-time resolution extended to ASIN (REQ-010). Identity-operation records (REQ-001)."
    dependencies: [livrarr-domain, livrarr-external-data, livrarr-http]
    module_invariants:
      - "Completion never adopts a fuzzy match: deterministic anchors or LLM-confirmed only; failure leaves the anchor absent (spec principle: a skipped provider beats a wrong merge)."
    capability_survey:
      - { capability: "refresh-time anchor completion", existing_source: "converge_identity_pending (async_resolver.rs:20-85): builds WorkSeed from work, resolver.resolve(Background), merge_missing_anchors on Resolved", reuse_decision: wrap, rationale: "exactly the completion shape; complete_anchors adds (a) the caller-supplied suppression filter, (b) an AnchorCompletionReport return for recording + scatter gating, (c) runs for anchor-incomplete Confirmed works, not just Pending" }
      - { capability: "anchor persistence", existing_source: "WorkIdentityRepository::merge_missing_anchors (domain trait; sqlite impl routes every write through confirm_anchor — verified sqlite_work_identity.rs:203-238)", reuse_decision: reuse, rationale: "monotonicity is already enforced at this surface; identity stays db-crate-free (generic over the domain trait, existing precedent)" }
      - { capability: "LLM disambiguation", existing_source: "GR resolution tiers in provider_client.rs:757-861 + llm_identity_verify (async_resolver.rs:87-143)", reuse_decision: reuse, rationale: "REQ-008's 'LLM where the provider requires it' is the existing GR behavior" }
      - { capability: "ASIN resolution at add", existing_source: "resolver fan-out (english_identity_resolver.rs) — currently resolves ol/gr/hc/isbn; CapturedIdentity already carries asin (identity.rs:114-127)", reuse_decision: wrap, rationale: "REQ-010/Sprint-E prerequisite: add an Audnexus/Audible leg to the fan-out so CapturedIdentity.asin populates when deterministically resolvable" }
    public_api:
      types: []
      functions:
        - name: complete_anchors
          inputs: [{ name: resolver, type: "&impl EnglishIdentityResolver" }, { name: repo, type: "&impl WorkIdentityRepository" }, { name: user_id, type: UserId }, { name: work, type: "&Work" }, { name: suppressed_providers, type: "&[String]" }, { name: sink, type: "&Arc<dyn ProviderCallSink>" }]
          output: "Result<AnchorCompletionReport, WorkIdentityError>"
          errors: ["WorkIdentityError"]
          pseudocode:
            - "if work has all five anchors OR identity_status is Conflict: return empty report (nothing to complete / paused pending user)"
            - "if every missing anchor's source provider is in suppressed_providers: return report with all skipped(suppressed) — zero network (REQ-008 boundedness)"
            - "build WorkSeed from work's existing anchors + title/author/language (existing converge shape)"
            - "resolver.resolve(user_id, seed, LatencyTier::Background) — emits Identity-operation records inside the client layer"
            - "on Resolved{identity}: repo.merge_missing_anchors(work_id, identity) — appends only missing types via confirm_anchor (monotonic; established anchors untouched)"
            - "on Unresolved/NeedsConfirmation/Conflict: no anchor writes; report skipped(not_found) per unresolved provider — caller records the terminal outcome into retry suppression"
            - "return report listing resolved (anchor_type, value) and skipped (provider, reason)"
          call_annotations:
            - { call: "resolver.resolve", type: EXISTING, target: "IdentityResolver trait (domain) / LiveEnglishIdentityResolver" }
            - { call: "repo.merge_missing_anchors", type: EXISTING, target: "WorkIdentityRepository (domain trait)" }
            - { call: "ProviderCallSink::record", type: EXISTING, target: "livrarr-domain (declared in this IR)" }
          preconditions:
            domain_state: ["work was loaded in this refresh pass (fresh anchor view)"]
          postconditions:
            - "no established anchor changed; only absent anchor types may now be present (AC-010)"
          forbidden_behaviors:
            - "first-hit adoption of a text-search result"
            - "writing identity state for Conflict-status works"
          tdd_directives:
            - "AC-010: gr_key-less work whose completion confirms gains gr_key; unconfirmable completion leaves it absent and the provider skipped"
            - "suppressed providers produce zero resolver calls (record assertions)"

  # ================================================================ livrarr-enrichment
  - name: livrarr-enrichment
    responsibility: "Anchor-grounded dispatch (skip+record without anchor), per-field/provider dissent replacing the whole-work conflict discard, no identity writes out of merge, Cached/policy-skip records. REQ-001/006/007/012/013/014."
    dependencies: [livrarr-domain, livrarr-external-data, livrarr-db, livrarr-http]
    module_invariants:
      - "MergeOutput carries no anchor values and no external-id requests (the fields are deleted — REQ-007 structural across stores 1 and 3; store 2, the ledger, has no merge write today: verified)."
      - "A dissent excludes at most one provider's (or one field's) contribution; the merge always proceeds with the rest (REQ-014)."
    capability_survey:
      - { capability: "scatter dispatch", existing_source: "DefaultProviderQueue::dispatch_enrichment — JoinSet per provider calling client.fetch(&work_arc) (provider_queue.rs:432-435)", reuse_decision: wrap, rationale: "dispatch now derives Option<AnchorQuery> per provider from the work's anchors; Some → fetch_by_anchor, None → skip + SkippedNoAnchor record, no task spawned" }
      - { capability: "whole-work conflict handling", existing_source: "merge_impl conflict short-circuit (lib.rs:692-710, verified verbatim): any OutcomeClass::Conflict → MergeOutput{conflict_detected, work_update: None, status Unenriched}", reuse_decision: rewrite, rationale: "#110 root: replace block-everything with exclude-that-provider + FieldDissent(PayloadMismatch) rows; conflict_detected field retires with it" }
      - { capability: "foreign provider drop", existing_source: "drop_language_incompatible_providers (lib.rs:478-497), called once at the merge entry (lib.rs:435)", reuse_decision: reuse, rationale: "REQ-012 pins it; rule documentation stays at this site; HC/OL drops also emit SkippedPolicy records (they produce no fetch when the applicability closure excludes them — the record comes from whichever layer drops them)" }
      - { capability: "language incompatibility detection", existing_source: "NormalizedWorkDetail.language (per-payload, types.rs:6-36) + work.language", reuse_decision: reuse, rationale: "REQ-013: payload language known + incompatible with work language → text fields (description, subtitle, series_name, genres) become FieldDissent(LanguageIncompatible) instead of writes; unknown language unaffected" }
      - { capability: "external-id emission", existing_source: "merge_impl collection of additional_isbns/additional_asins → UpsertExternalIdRequest (lib.rs:951-973) → ExternalIdDb upsert", reuse_decision: rewrite, rationale: "REQ-007: deleted outright; identity track owns external_ids (the F1 incident wrote 3 wrong ASINs through this path)" }
      - { capability: "cached-payload path", existing_source: "transport cache_take hit inside enrich_work (lib.rs:1256-1276) → merge_from_cached", reuse_decision: reuse, rationale: "hook: emit one Cached record per provider payload served from the cache" }
      - { capability: "LLM-reject accounting", existing_source: "LiveLlmValidator (llm_validator.rs:247-252) — verified DORMANT: the main pipeline no longer calls validate (lib.rs Step 8.5 removed)", reuse_decision: reuse, rationale: "LlmRejected records therefore originate in the GR client's LLM disambiguation tiers (identity-grade), not the dormant validator — recorded at the client boundary" }
    public_api:
      types: []
      functions:
        - name: "DefaultProviderQueue::dispatch_enrichment"
          inputs: [{ name: work, type: "&Work" }, { name: context, type: EnrichmentContext }]
          output: "Result<ScatterGatherResult, ProviderQueueError>"
          errors: ["ProviderQueueError"]
          pseudocode:
            - "MODIFIED existing fn. for each applicable provider (existing applicability/language closure unchanged):"
