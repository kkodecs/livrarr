data_flow:
  sources:
    - { entity: "Work",            origin: "the resolving door / refresh / the convergence selector", description: "The persisted work to settle; carries its current badge + denormalized anchors (read in-memory)." }
    - { entity: "Resolution",      origin: "EnglishIdentityResolver::resolve", description: "Now carries AnchorProvenance on Resolved/Unresolved (resolver-provenance)." }
    - { entity: "AnchorProvenance", origin: "project_cluster",                 description: "Per-anchor Hard/Fuzzy basis derived from each cluster member's seed-hard-bridge status (Q2)." }
    - { entity: "WorkIdentityAnchor", origin: "affirm-api POST",               description: "The held pending guess the user affirm promotes to confirmed (REQ-005)." }
  sinks:
    - { entity: "WorkIdentityAnchor", destination: "work_identity_anchors ledger + denormalized works.* columns", description: "HARD anchors: merge_missing_anchors/confirm_anchor — used by enrichment immediately (REQ-003)." }
    - { entity: "WorkIdentityAnchor",   destination: "work_identity_anchors ledger ONLY (never works.*)",          description: "FUZZY guesses: record_pending_anchor — invisible to enrichment until affirmed (REQ-004, the safety property)." }
    - { entity: "AnchorDeadEnd",   destination: "work_anchor_dead_ends table (durable counter)",                             description: "Bumped per failed convergence attempt; at threshold the anchor is unobtainable (REQ-009)." }
    - { entity: "Work",            destination: "works.next_convergence_at column",                                         description: "Convergence pacing clock written on the work row (REQ-006)." }
    - { entity: "IdentityStatus",  destination: "works badge column",                                                       description: "Engine badge write, monotonic — derived from HARD anchors only (a fuzzy guess never raises the badge)." }
  state_machines:
    - entity: "AnchorConfidence"
      states: ["(absent)", "Pending", "Confirmed", "Superseded"]
      transitions:
        - { from: "(absent)", to: "Confirmed", trigger: "harvested with MatchBasis::Hard -> confirm_anchor (REQ-003)" }
        - { from: "(absent)", to: "Pending",   trigger: "harvested with MatchBasis::Fuzzy -> record_pending_anchor; held, works.* untouched (REQ-004)" }
        - { from: "Pending",  to: "Confirmed", trigger: "user affirm -> confirm_anchor; works.* synced, enrichment unlocked (REQ-005)" }
        - { from: "Pending",  to: "Pending",   trigger: "convergence tick — the loop does NOT select a work whose only missing anchors are pending-guessed (no re-guess, M9 — combined guard)" }
        - { from: "Confirmed", to: "Confirmed", trigger: "never downgraded; a later harvest only fills MISSING anchors (REQ-008 monotonic)" }
    - entity: "AnchorDeadEnd"
      states: ["(none)", "Counting", "Unobtainable(count>=K)", "Cleared"]
      transitions:
        - { from: "(none)",      to: "Counting",     trigger: "convergence tick attempted the anchor, still unfilled-and-unguessed -> bump_anchor_attempt (REQ-009)" }
        - { from: "Counting",    to: "Counting",     trigger: "another failed convergence attempt -> attempt_count += 1" }
        - { from: "Counting",    to: "(none)",       trigger: "the anchor is finally harvested -> row deleted (no longer missing)" }
        - { from: "Counting",    to: "Unobtainable", trigger: "attempt_count reaches threshold K (TOML)" }
        - { from: "Unobtainable", to: "Unobtainable", trigger: "convergence does NOT re-chase it; a work whose EVERY missing anchor is Unobtainable/pending-guessed is not selected — the loop converges (REQ-006/009)" }
        - { from: "Unobtainable", to: "Cleared",     trigger: "explicit user 'try again' (manual refresh) -> clear_anchor_dead_ends (REQ-009)" }
        - { from: "Unobtainable", to: "Unobtainable", trigger: "a routine refresh's reset_for_manual_refresh does NOT touch it — durable (ST-009)" }
  invariants:
    - "SAFETY (the load-bearing one): a pending (fuzzy-guessed) anchor lives in work_identity_anchors ONLY, never works.*. Enrichment reads IDs solely from works.* (derive_anchor_query, provider_queue.rs:69), so a wrong guess can NEVER be fetched or displayed until affirmed (REQ-004; AC-006)."
    - "Provenance is SEED-relative, not intra-cluster: MatchBasis::Hard requires a hard id the WORK already holds; providers fuzzily corroborating each other on the wrong edition are BOTH Fuzzy (the wrong-book guard, AC-020 lineage)."
    - "Monotonic, no-clobber, identity-only: harvest fills only MISSING ids, never overwrites a confirmed id, never downgrades a badge, writes ZERO enrichment payload (REQ-008, inherited engine contract)."
    - "The loop converges: list_convergence_due selects a work only if it has a CHASEABLE missing anchor (not pending-guessed, not at the threshold) — so a pending-guess-only work is not re-guessed (M9) and an all-dead-ended work falls out (no churn). REQ-006/009."
    - "Dead-end detection is in the CONVERGENCE LOOP, not the engine: settle_identity cannot tell a genuine NotFound from a transient timeout (resolver collapses both to None, english_identity_resolver.rs:100 — R-1), so a dead-end is a per-(work,anchor) failed-attempt count crossing a threshold, durable + clearable (REQ-009)."
    - "Refresh-immune selection: convergence selects by STATUS via its own next_convergence_at clock; it never depends on provider_retry_state (which refresh deletes) — design-convergence R-007/R-008."
    - "Matching logic UNCHANGED: resolver-provenance reports the basis agree()/run_quorum already decide; clustering/quorum/fan-out DECISIONS are byte-identical (spec §4 Non-Req)."
    - "Author monitor is NOT routed through the engine — it asserts a hard OL key (the one deliberate exception; AC-002 negative test locks it)."
    - "REQ-007 volume gate is a BLOCKING pre-activation step: the loop ships disabled until worst-case daily GB calls <= GB quota is computed AND the live DB is snapshotted (AC-011)."

domain_entities:
  - Work
  - IdentityStatus
  - CapturedIdentity

decisions:
  - id: "D-Q2-PROVENANCE"
    title: "Expose a per-anchor MatchBasis from the resolver OUTPUT (Q2) — the matching logic is untouched"
    decision: >
      The safe-vs-guessed split (REQ-003/004) needs, per harvested anchor, whether it rode in on a hard
      cross-reference the work already holds or on a fuzzy title/author match. GROUNDED this session: that
      fact is computed in agree() (english_identity_resolver.rs:461, branch by branch) but returned only as
      bool; project_cluster (:560) flattens to a CapturedIdentity bag and discards it; then settle_identity
      writes EVERY harvested anchor as confirmed via merge_missing_anchors (async_resolver.rs:340-371 ->
      confirm_anchor Import/confirmed + works.* sync). So the signal is NOT exposed and the engine currently
      auto-confirms everything — the exact unsafe behavior REQ-004 forbids. RESOLUTION: add a per-anchor
      MatchBasis (Hard|Fuzzy) computed AT project_cluster (it already holds the seed + each member's raw
      detail) and carried out as an AnchorProvenance sidecar on Resolution::Resolved/Unresolved;
      settle_identity's write-step routes Hard->confirm, Fuzzy->record_pending_anchor. This EXTENDS the
      resolver OUTPUT only — agree()/run_quorum/the provider fan-out DECISION logic are unchanged.
    history: >
      Spec Q2 assumed "the resolver knows; confirm the signal is exposed." Half-true: known transiently,
      destroyed before any writer. Alternative REJECTED: re-derive hard-vs-fuzzy at the write-step from the
      work's existing ids — the flat CapturedIdentity does not say which provider supplied each anchor, so the
      write-step cannot distinguish a fuzzy audiobook ASIN from a hard-bridged one; a downstream re-derivation
      is the band-aid the no-band-aid principle forbids (insight 24). Round-1 reviewers did not break this
      claim; the dedicated MatchBasis test is the standing guard.
    risk: >
      HAZARD (wrong-book trap): basis MUST be computed on the RAW NormalizedWorkDetail, not the
      seed-backfilled captured_from_detail form (:538 inherits the seed's isbn -> every member would falsely
      read as sharing the seed's bridge -> auto-confirm a guess). The exact predicate is pinned at ir-v2; it
      gets a dedicated behavioral test (the audiobook poster child stays Fuzzy)."
  - id: "D-DEADEND-DETECTION"
    title: "Dead-end is a retry-threshold in the convergence loop, NOT a resolver no-candidates signal (R-1)"
    decision: >
      REQ-009 marks a missing ID 'unobtainable' so the loop converges. The original IR had settle_identity
      mark a dead-end on a resolver 'no-candidates' result. R-1 (gemini, P0, verified) showed this is
      unimplementable: resolve() collapses a genuine provider NotFound and a transient timeout into the same
      None and drops both from `responders` (english_identity_resolver.rs:100), so a Resolution carries no
      per-anchor 'this anchor is a dead-end' signal. RESOLUTION: the convergence loop owns dead-end detection.
      After each tick's harvest attempt, for every anchor still missing from works.* AND with no outstanding
      pending guess, bump a durable per-(work,anchor_type) attempt counter (work_anchor_dead_ends); when the
      count reaches the threshold (TOML, default 3 — PO 2026-06-23) the anchor is 'unobtainable' and the work falls out of selection once
      ALL its missing anchors are unobtainable-or-guessed. A transient outage clears within a few ticks (the
      anchor is harvested, the row is deleted); a genuine dead-end never clears and converges out after K
      tries. Clearable by the explicit user 'try again'.
    history: >
      Alternative considered + REJECTED: a SECOND resolver-output extension exposing per-provider
      NotFound-vs-transient. Rejected — it enlarges the resolver change R-1/§4 already pressures us to keep
      minimal, for a precision the retry-threshold does not need (a persistent outage SHOULD eventually be
      treated as a dead-end per M9 'never an indefinite retry loop'; the marker is clearable, so the cost of
      a false dead-end is one user click). SPEC WRINKLE: REQ-009 literally says 'the resolver returns no
      candidates for' the ID; the retry-threshold satisfies REQ-009's INTENT (durable, converges, clearable)
      without that resolver capability. Escalated by codex R-3 (P1, r2) as a PO decision; PO chose 'fail after 3 tries', and REQ-009 was AMENDED to bless threshold-based clearable suppression (default 3, 2026-06-23) — resolved at the spec.
  - id: "D-MANUALRETRY-MODE"
    title: "Insertion C (manual retry-incomplete) uses Background mode, not Interactive (R-001)"
    decision: >
      retry_all_incomplete resolves at LatencyTier::Background today (work_service.rs:1469); select_providers
      adds Audnexus (a background-only audiobook provider) ONLY for the Background tier
      (english_identity_resolver.rs:242). The first IR mapped insertion C to (Interactive, ManualRetry) on a
      'a person clicked it -> Interactive' reading — but that would DROP Audnexus and make the manual 'retry
      incomplete' sweep LESS complete than today, the opposite of this feature's ID-completeness goal.
      RESOLUTION: insertion C = (Background, ManualRetry).
    history: >
      codex R-001 (P1), verified against the two cited lines. Consequence: an ambiguous Pending work resolves
      to terminal NeedsReview under Background (vs staying Pending under Interactive). Acceptable/honest for a
      'retry incomplete' action — it surfaces 'needs attention' rather than silently re-queuing. (If the PO
      later wants a foreground user action with the full background provider set, that is the 'split the mode
      from the tier' option codex offered — a larger change, deferred unless asked.)
  - id: "D-CONVERGENCE-GUARDS"
    title: "The two REQ-006 guards combine into one chaseable-anchor selection predicate"
    decision: >
      Spec REQ-006 lists two guards: (1) exclude a work holding a pending guess for the missing ID; (2)
      exclude a work whose every missing ID is unobtainable. Read as two independent whole-work exclusions,
      (1) would STRAND a work that has one pending-guessed anchor AND another genuinely-chaseable anchor.
      RESOLUTION: combine them at per-ANCHOR granularity — list_convergence_due selects a work iff it has at
      least one CHASEABLE missing anchor = missing AND not pending-guessed AND attempt_count < K. A work with
      some guessed/dead-ended and some chaseable anchors is still selected (to chase the chaseable ones); a
      work with no chaseable anchor falls out. This is the correct implementation of REQ-006's intent (no
      re-guess loop, no dead-end churn, no stranding).
    history: "Architecture clarification of an ambiguous spec phrasing; flagged to PO. The harvest also skips guessed/at-threshold anchors so a legitimately-selected tick does not re-guess them."
  - id: "D-CONVERGENCE-SCOPE"
    title: "This feature BUILDS the background convergence loop (absorbed), not merely widens a pre-built one"
    decision: >
      The loop's CODE does not exist (ST-007; converge_identity_pending/list_works_due_for_retry are
      zero-caller dead; design-convergence-selection-fix is 'NO code yet'; no jobs/ task converges — insight
      54). The spec §4 Non-Req reads as if the loop core were built by a peer feature
      (spec-convergence-unified-path), but the handoff DOC MAP (PO, 2026-06-23, AUTHORITATIVE) marks that peer
      SUPERSEDED and folds it into id-completeness. RESOLUTION: id-completeness BUILDS the loop core (clock +
      status selector + job tick) per the reused, twice-reviewed design-convergence-selection-fix, AND applies
      the REQ-006 widening + guards. 'Does not rebuild the clock/batch/cadence' (§4) means does not re-DESIGN
      it.
    history: >
      The spec's Non-Req wording predates the absorption; the handoff governs (DOC MAP rule: AUTHORITATIVE
      wins). PO call 2026-06-18 (insight 54): Part 1 = restore auto-convergence; Part 2 = throttle/quota
      (deferred). FLAGGED to PO — the single biggest scope swing; the module group (convergence-job +
      db-convergence-selector + db-anchor-dead-end) is the clean seam if the PO wants it sequenced separately.
      Round-1 reviewers did not object to the build-it-here scope.
  - id: "D-REFRESH-CHASE"
    title: "Refresh re-chases MISSING ids on Confirmed works (supersedes the Sprint-E !=Confirmed gate)"
    decision: >
      Insertion B does NOT keep the design-uip-wiring §4 / Sprint-E (fb77b40) 'skip the chase when Confirmed'
      gate. REQ-002 reverses it: ID-completeness overrides speed-first, so refresh re-chases a Confirmed work's
      MISSING ids — gated instead by 'are any ids missing AND not at the unobtainable threshold'. The
      skip-when-nothing-missing smart (which settle_identity lacks, ST-002) is re-added at the caller (insertion
      B). A manual refresh is user-initiated, so it MAY re-attempt a dead-end (the explicit 'try again' =
      clear_anchor_dead_ends then chase); the unbounded-churn guard runs on the BACKGROUND loop (REQ-006/009).
    history: "design-uip-wiring §4 recommended preserving the Sprint-E gate; design-uip-id-completeness §5B reversed it (ID-completeness is the goal, insight 49/55). This IR implements the reversal."
  - id: "D-DEADEND-TABLE"
    title: "Durable dead-end counter is a NEW table, not provider_retry_state"
    decision: >
      REQ-009's durable suppression is a NEW work_anchor_dead_ends table (per (work, anchor_type),
      carrying attempt_count). It MUST NOT reuse provider_retry_state: a manual refresh's
      reset_for_manual_refresh DELETES provider_retry_state before the chase reads it (ST-009), so a counter
      stored there cannot survive refresh. The new table is untouched by reset_for_manual_refresh (durable)
      and reset only by the explicit user 'try again' (clear_anchor_dead_ends).
    history: "ST-009 grounded; design-uip-id-completeness §5C/§9 R-005 (the Codex P1 that produced REQ-009). Counter semantics added per R-1 (D-DEADEND-DETECTION)."
  - id: "D-PENDING-WRITER"
    title: "record_pending_anchor is a NEW writer; the existing 'pending' writer is an empty sentinel"
    decision: >
      REQ-004 needs a writer that persists a REAL pending anchor value to the ledger WITHOUT syncing works.*.
      None exists: confirm_anchor (sqlite_work_identity.rs:10) always writes confirmed + syncs works.*;
      merge_missing_anchors (:204) stamps Import/confirmed; the only 'pending' writer set_identity_pending
      (:356) writes an empty-string sentinel (ST-005). So record_pending_anchor is genuinely new — the inverse
      of confirm_anchor (ledger write, NO works.* UPDATE).
    history: "design-uip-id-completeness §9 R2 (CONFIRMED + RESOLVED): the ~80% 'nothing writes real pending' claim verified against source."
  - id: "D-AUTHORMONITOR-EXCEPTION"
    title: "Author monitor is NOT routed through settle_identity"
    decision: >
      Author monitor seeds IdentityState::Confirmed{ol_key} directly from the authoritative OL author-works
      API (author_monitor_workflow.rs:499) — it ASSERTS a hard id, does not RESOLVE. Routing it would fan out
      the resolver for every auto-added work (the Confirmed-no-short-circuit cost, ST-002) to almost always
      no-op the badge. 'Wire every door' means every door that RESOLVES identity; the one door that asserts a
      hard id is the principled exception (REQ-001; AC-002 locks it with a negative test).
    history: "design-uip-wiring §7; PO Q-2 (recommend exclude). Tradeoff: no conflict-check on author-monitor adds — acceptable (new works, authoritative key, monitor pre-screens)."
