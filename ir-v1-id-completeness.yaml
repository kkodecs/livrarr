metadata:
  feature: "id-completeness"
  stage: v1-structural
  spec_ref: "spec-id-completeness.md"
  version: 1
  review_round: 3
  round1_dispositions: >
    r1 both families FAIL — ACCEPTED ALL THREE (each verified against live source this round):
    (1) gemini R-1 (P0): settle_identity cannot derive a per-anchor dead-end from `Resolution` — the
    resolver collapses genuine NotFound and transient timeout into the same `None`
    (english_identity_resolver.rs:100, read), so "mark dead-end on no-candidates" was unimplementable.
    FIX: dead-end is REDESIGNED as a retry-threshold COUNTER incremented by the convergence loop after a
    harvest attempt leaves an anchor unfilled — not a resolver signal (decision D-DEADEND-DETECTION).
    (2) gemini R-2 (P0): `forbidden_pattern` is a BLUNT global grep over all of crates/ (verify.py:490-509,
    read; contract-metadata-refactor.yaml ENFORCEMENT NOTE confirms) — my `provider_retry_state` / `refresh(`
    / `cover_url|enrich_work` patterns would match legitimate code and fail the code gate. FIX: contract
    restructured — deletion-only forbidden_patterns + module_dependency (cargo-tree-authoritative) +
    review_enforced_invariants for everything that can't be a safe global string.
    (3) codex R-001 (P1): insertion C as Interactive drops Audnexus — retry_all_incomplete currently
    resolves at LatencyTier::Background (work_service.rs:1469) and select_providers gates Audnexus on
    Background (english_identity_resolver.rs:242, read). FIX: insertion C -> (Background, ManualRetry),
    decision D-MANUALRETRY-MODE.
    SPEC WRINKLE (flagged to PO): REQ-009 says "the resolver returns no candidates for" a missing ID, but
    the resolver cannot expose that per-anchor (R-1). The retry-threshold satisfies REQ-009's INTENT
    (durable, converges, clearable) without a second resolver-output change. Not a spec rewrite — an
    architecture realization of how a dead-end is detectable.
  round2_dispositions: >
    r2 — codex FAIL (1 finding R-3, P1): the round-1 SPEC WRINKLE, escalated as a PO decision (the
    retry-threshold bends REQ-009's "distinct from a transient outage" wording). gemini timed out
    (REVIEW_INCOMPLETE, 600s) — no google verdict this round; re-dispatched at r3. PO DECISION
    (2026-06-23): "fail after 3 tries" — spec REQ-009 AMENDED to threshold-based, clearable suppression
    (default 3); R-3 RESOLVED at the spec, not worked around. All other round-1 fixes confirmed by codex
    (contract restructure, Background mode, safety design).
  builds_on:
    - "ir-v1-unified-identity-path.yaml — the settle_identity ENGINE (built + committed 4a7e03d). This feature WIRES it onto every resolving door and EXTENDS its harvest write-step (safe vs guessed). It does NOT re-open the engine's verdict->badge mapping."
    - "design-uip-wiring.md §2/§3/§5 — the grounded 9-door trace, the 4 insertion points, the legacy deletion list (its §4 Confirmed-gate is SUPERSEDED, see D-REFRESH-CHASE)."
    - "design-uip-id-completeness.md — the safe/guessed direction + the R1 cross-family review trail (§9)."
    - "design-convergence-selection-fix.md (r4) — the background loop's selection + pacing. Reused as the loop's design; the loop CODE is built by this feature (D-CONVERGENCE-SCOPE)."
  architecture_open_questions_resolved:
    - "Q2 (is the hard-vs-fuzzy signal exposed at harvest time?) -> D-Q2-PROVENANCE. Answer: NOT today. agree() (english_identity_resolver.rs:461) decides hard-id vs fuzzy-text per provider, returns only bool; project_cluster (:560) flattens to a CapturedIdentity bag, discarding it; settle_identity then writes ALL anchors confirmed via merge_missing_anchors (async_resolver.rs:340-371). FIX: add a per-anchor MatchBasis to the resolver OUTPUT (matching/clustering logic UNCHANGED)."
    - "Q4 (does the in-memory anchor read-model expose setter/confidence?) -> YES. WorkIdentityAnchor (livrarr-domain/src/identity.rs:11) carries setter + confidence; WorkIdentityRepository::list_anchors (services/work_identity.rs:77) returns Vec<WorkIdentityAnchor>. So the harvest decision, the convergence guard, and the affirm UI all read provenance."
    - "Q5 (per-door mode/source + new ConflictSource variants) -> ConflictSource (identity.rs:453) has exactly the 7 door variants; ManualRetry + Convergence are ADDED here. IdentityMode (identity.rs:261) = Interactive | Background. Per-door (mode,source) table lives in module door-wiring."

system_architecture:
  summary: >
    Make every book carry as many trustworthy cross-provider IDs as possible. Three moves, all routed
    through the one engine settle_identity: (1) WIRE — every identity-resolving door + a new background
    loop delegate the identity decision to settle_identity (4 insertion points, legacy resolve->badge
    wrappers deleted). (2) HARVEST SAFELY — extend settle_identity's write-step to split harvested anchors
    by a NEW per-anchor MatchBasis exposed from the resolver: a HARD cross-reference (shared isbn/asin/
    work-key) auto-attaches as confirmed (existing confirm_anchor, syncs works.* -> enrichment uses it
    now); a FUZZY title/author guess is held by a NEW writer record_pending_anchor in the anchor ledger
    ONLY (never works.*), so enrichment (which reads only works.*, provider_queue.rs:69) can never fetch or
    display a wrong guess until the user affirms it via a gentle non-blocking prompt. (3) TOP UP — build the
    background convergence loop (per the reused design-convergence-selection-fix) with its selector WIDENED
    to Confirmed-but-ID-incomplete works; the loop chases only CHASEABLE missing anchors (not those already
    pending-guessed, not those at the unobtainable retry-threshold), and increments a durable per-(work,
    anchor) failed-attempt counter so a genuine dead-end converges out of selection instead of churning.
  components:
    - { name: "resolver-provenance",        crate: "livrarr-identity (+ livrarr-domain type)", kind: "resolver OUTPUT extension (expose per-anchor MatchBasis; matching logic unchanged)" }
    - { name: "identity-engine-harvest",    crate: "livrarr-identity",   kind: "settle_identity write-step extension (route anchors by MatchBasis: hard->confirm, fuzzy->pending)" }
    - { name: "domain-id-completeness-types", crate: "livrarr-domain",   kind: "shared types + trait methods (MatchBasis, AnchorProvenance, AnchorDeadEnd, ConflictSource variants, new repo writers)" }
    - { name: "db-pending-anchor",          crate: "livrarr-db",         kind: "trait impl (SqliteDb) — record_pending_anchor: ledger-only, no works.* sync" }
    - { name: "db-anchor-dead-end",         crate: "livrarr-db",         kind: "trait impl + migration — durable per-(work,anchor_type) failed-attempt counter; unobtainable = count >= threshold" }
    - { name: "db-convergence-selector",    crate: "livrarr-db",         kind: "trait impl + migration — next_convergence_at clock + WIDENED list_convergence_due selecting only works with a chaseable missing anchor" }
    - { name: "door-wiring",                crate: "livrarr-metadata",   kind: "insertion points A/B/C — route doors + refresh + manual-retry through settle_identity; delete legacy wrappers" }
    - { name: "convergence-job",            crate: "livrarr-server",     kind: "insertion D — NEW background tick: select due -> settle_identity(Background,Convergence) -> Background enrichment -> bump dead-end counters for still-unfilled anchors -> pace" }
    - { name: "affirm-api",                 crate: "livrarr-handlers",   kind: "GET pending-guesses (list_anchors filtered) + POST affirm (promote via confirm_anchor)" }
    - { name: "affirm-ui",                  crate: "frontend (testdata/ui)", kind: "gentle non-blocking 'we think this is the audiobook — confirm?' affordance" }
    - { name: "behavioral-id-completeness", crate: "livrarr-behavioral", kind: "faithful door->engine tests + the safety test + convergence faithful tests" }
  connections:
    - "door-wiring (livrarr-metadata) calls settle_identity (livrarr-identity) at insertion A (add chokepoint ensure_identity_and_enrichment ~work_service.rs:2706), B (refresh ~work_service.rs:1340), C (retry_all_incomplete ~work_service.rs:1468)."
    - "convergence-job (livrarr-server) calls db-convergence-selector::list_convergence_due, then per work settle_identity(Background, Convergence), then the EXISTING Background enrichment path (NOT refresh — it would wipe provider_retry_state, design-convergence R-009), then for each anchor still unfilled-and-unguessed it calls bump_anchor_attempt, then set_next_convergence_at."
    - "identity-engine-harvest reads MatchBasis from the resolver Resolution (resolver-provenance), then routes each harvested anchor: Hard -> WorkIdentityRepository::merge_missing_anchors/confirm_anchor (confirmed + works.* sync); Fuzzy -> WorkIdentityRepository::record_pending_anchor (ledger only). It does NOT mark dead-ends (it cannot tell NotFound from a transient timeout — R-1)."
    - "affirm-api (livrarr-handlers) calls WorkIdentityRepository::list_anchors (filter confidence='pending') for the read, and confirm_anchor for the affirm (promotes pending->confirmed, syncs works.*, unlocks enrichment)."
    - "enrichment (livrarr-enrichment provider_queue.rs:69 derive_anchor_query) reads identity IDs ONLY from denormalized works.* — UNCHANGED. This is the load-bearing safety boundary: a pending guess in the ledger is invisible to enrichment by construction."
  deployment: >
    In-process workspace code. NEW DB migrations: (1) works.next_convergence_at TEXT nullable + partial
    index (convergence clock); (2) work_anchor_dead_ends table (durable per-(work,anchor_type) failed-attempt
    counter). NEW background job (convergence tick) registered in server/src/jobs. NEW handler routes (affirm
    GET/POST). NEW frontend affordance. NO new third-party dependency.

languages: ["Rust", "TypeScript/React (frontend affirm affordance only)"]

frameworks:
  - "tokio (async)"
  - "trait_variant::make(Send) for async service traits (insight 8 — non-dyn; generics/enum dispatch)"
  - "axum (existing) for the affirm endpoints"
  - "React + React Query (existing) for the affirm affordance"

approved_libraries:
  - { name: "trait-variant", use: "Send-bounded async trait (existing convention)" }
  - { name: "thiserror",     use: "WorkIdentityError (existing)" }
  - { name: "chrono",        use: "next_convergence_at / last_attempt_at timestamps (project-wide datetime, insight 11)" }
  - { name: "sqlx",          use: "the two new migrations + queries (existing)" }
  - note: "NO new third-party dependency. All new types are livrarr-domain types + std; all persistence is existing sqlx/SqliteDb."

modules:
  - name: "domain-id-completeness-types"
    crate: "livrarr-domain"
    responsibility: >
      The shared vocabulary the harvest split, the dead-end suppression, and the two re-processing callers
      need — all in the dependency sink so no upstream edge is added. (a) MatchBasis + AnchorProvenance: the
      per-anchor hard-vs-fuzzy fact the resolver now exposes (Q2/REQ-003/004). (b) Two ConflictSource
      variants for the loop + manual-retry callers (Q5/REQ-001). (c) NEW WorkIdentityRepository methods:
      record_pending_anchor (REQ-004) and the dead-end counter read/write (REQ-009). The convergence
      selector/clock methods go on WorkDb (module db-convergence-selector).
    dependencies: []
    public_api:
      types:
        - kind: enum
          name: "MatchBasis"
          fields:
            - { name: "Hard",  type: "" }
            - { name: "Fuzzy", type: "" }
          note: >
            REQ-003/004 routing key. Hard = the contributing provider shared a hard identifier the SEED
            already carried (work-key OL/GR/HC or edition bridge ISBN/ASIN) — same book by construction.
            Fuzzy = the provider joined the cluster on title/author text only (the audiobook ASIN is the
            poster child). Determined in resolver-provenance; consumed in identity-engine-harvest. NOTE
            (D-Q2-PROVENANCE): basis is relative to the SEED's hard ids, NOT intra-cluster corroboration —
            two providers fuzzily agreeing on the wrong edition are BOTH Fuzzy. Must be computed on the RAW
            NormalizedWorkDetail, never the seed-backfilled captured form (captured_from_detail:533 inherits
            the seed's isbn — that would falsely read as a shared bridge). This hazard is the wrong-book
            trap; ir-v2 pins the exact predicate and the dedicated test.
        - kind: struct
          name: "AnchorProvenance"
          fields:
            - { name: "ol_key",  type: "Option<MatchBasis>" }
            - { name: "gr_key",  type: "Option<MatchBasis>" }
            - { name: "hc_key",  type: "Option<MatchBasis>" }
            - { name: "isbn_13", type: "Option<MatchBasis>" }
            - { name: "asin",    type: "Option<MatchBasis>" }
          note: >
            Per-anchor-type basis, parallel to CapturedIdentity's identifier fields (Some iff that anchor was
            harvested this resolve). A SIDECAR — CapturedIdentity is unchanged (used project-wide). Carried
            alongside identity on Resolution::Resolved and Resolution::Unresolved. ir-v2 decides
            struct-of-options (shown) vs BTreeMap<AnchorType, MatchBasis>.
        - kind: enum
          name: "ConflictSource (EXTENDED)"
          fields:
            - { name: "ManualRetry",  type: "" }
            - { name: "Convergence",  type: "" }
          note: >
            The 7 existing variants (ManualAdd, ManualImport, ListImport, ReadarrImport, SeriesMonitor,
            AuthorMonitor, Refresh; identity.rs:453) cover creation/refresh doors. Insertion C
            (retry_all_incomplete) is ManualRetry; insertion D (the loop) is Convergence (Q5/REQ-001).
        - kind: struct
          name: "AnchorDeadEnd"
          fields:
            - { name: "work_id",        type: "WorkId" }
            - { name: "anchor_type",    type: "AnchorType" }
            - { name: "attempt_count",  type: "u32" }
            - { name: "last_attempt_at", type: "DateTime<Utc>" }
          note: >
            REQ-009 durable per-(work, anchor_type) failed-attempt counter (REDESIGNED per R-1). A row is
            bumped each convergence tick that attempts the anchor and leaves it unfilled; "unobtainable" is
            the derived predicate attempt_count >= threshold (TOML config, default 3 — PO 2026-06-23). DURABLE = survives
            reset_for_manual_refresh (which deletes provider_retry_state — ST-009 forbids reusing that
            table). The counter row is DELETED when the anchor is finally harvested, and cleared by an
            explicit user 'try again' (manual refresh). This replaces the original "mark on resolver
            no-candidates" design, which R-1 showed unimplementable (the resolver collapses NotFound and
            timeout to the same None, english_identity_resolver.rs:100).
      functions:
        - name: "WorkIdentityRepository::record_pending_anchor"
          kind: "NEW trait method"
          inputs:
            - { name: "work_id",     type: "WorkId" }
            - { name: "anchor_type", type: "AnchorType" }
            - { name: "value",       type: "&str" }
          output: "Result<(), WorkIdentityError>"
          errors: ["WorkIdentityError"]
          note: >
            REQ-004 the safety writer. Writes work_identity_anchors with confidence='pending',
            setter='auto_search', the REAL anchor value, and MUST NOT write/sync the denormalized works.*
            column (the inverse of confirm_anchor, sqlite_work_identity.rs:10 which DOES sync). No live writer
            does this today — the only 'pending' writer set_identity_pending (:356) writes an empty-string
            sentinel (ST-005).
        - name: "WorkIdentityRepository::bump_anchor_attempt"
          kind: "NEW trait method"
          inputs:
            - { name: "work_id",     type: "WorkId" }
            - { name: "anchor_type", type: "AnchorType" }
          output: "Result<(), WorkIdentityError>"
          errors: ["WorkIdentityError"]
          note: "REQ-009. Idempotent upsert on (work_id, anchor_type): attempt_count += 1, last_attempt_at = now. Called by the convergence loop after a harvest attempt leaves the anchor unfilled-and-unguessed. NOT called by settle_identity (it cannot distinguish a dead-end from a timeout — R-1)."
        - name: "WorkIdentityRepository::list_anchor_dead_ends"
          kind: "NEW trait method"
          inputs: [{ name: "work_id", type: "WorkId" }]
          output: "Result<Vec<AnchorDeadEnd>, WorkIdentityError>"
          errors: ["WorkIdentityError"]
          note: "REQ-002/006/009. The refresh chase reads this to skip at-threshold anchors; the selector reads it (in SQL) to drop works with no chaseable anchor."
        - name: "WorkIdentityRepository::clear_anchor_dead_ends"
          kind: "NEW trait method"
          inputs: [{ name: "work_id", type: "WorkId" }]
          output: "Result<(), WorkIdentityError>"
          errors: ["WorkIdentityError"]
          note: "REQ-009. The explicit user 'try again' (manual refresh) resets the counters so a dead-ended anchor may be re-attempted."

  - name: "resolver-provenance"
    crate: "livrarr-identity (+ livrarr-domain type MatchBasis/AnchorProvenance)"
    responsibility: >
      Resolve Q2: EXPOSE the per-anchor hard-vs-fuzzy basis the matcher already computes but discards.
      project_cluster (english_identity_resolver.rs:560) has both the seed and each cluster member's raw
      NormalizedWorkDetail; as it merges each member's missing anchors onto the winner, tag each
      newly-contributed anchor with MatchBasis::Hard iff that member shares a hard identifier the SEED carries
      (work-key OL/GR/HC or edition bridge ISBN/ASIN), else MatchBasis::Fuzzy. Emit an AnchorProvenance
      alongside the projected CapturedIdentity on Resolution::Resolved and Resolution::Unresolved. This
      EXTENDS the resolver OUTPUT only — agree()/run_quorum clustering and the provider fan-out DECISION
      logic are unchanged (spec §4 Non-Req; same boundary as the engine feature's resolver-conflict-payload:
      more is reported, the same is decided).
    dependencies: ["domain-id-completeness-types"]
    public_api:
      functions:
        - name: "project_cluster (MODIFIED, english_identity_resolver.rs:560)"
          note: "Returns (CapturedIdentity, AnchorProvenance) — same projection, now also tagging each merged anchor's basis from its source member's seed-hard-bridge status. Computed on the RAW detail (not captured_from_detail's seed-backfilled form)."
        - name: "Resolution::Resolved / Resolution::Unresolved payload (EXTENDED)"
          note: "Each anchor-bearing verdict gains `provenance: AnchorProvenance` next to `identity`/`captured`. The user-confirmed zero-network shortcut (:75) and the no-responder Tier-A path (:156) emit provenance Hard for the seed's own ids (a user pick / hard-id seed is trusted)."

  - name: "identity-engine-harvest"
    crate: "livrarr-identity"
    responsibility: >
      Extend settle_identity's WRITE-STEP (async_resolver.rs:338-371) to consume AnchorProvenance and split
      the harvest (REQ-003/004): for each anchor the resolver returned, MatchBasis::Hard ->
      merge_missing_anchors/confirm_anchor (confidence='confirmed' + works.* sync, used by enrichment now);
      MatchBasis::Fuzzy -> record_pending_anchor (ledger only, held). Preserve every existing engine
      invariant: monotonic no-clobber, write ZERO enrichment, terminal-respect, idempotent (inherited;
      REQ-008). The badge mapping (Resolved->Confirmed/Provisional etc.) is UNCHANGED — only the anchor-write
      routing changes. settle_identity does NOT mark dead-ends (R-1: it cannot distinguish a genuine
      NotFound from a transient timeout; dead-end detection moves to the convergence loop).
    dependencies: ["domain-id-completeness-types", "resolver-provenance"]
    public_api:
      functions:
        - name: "settle_identity (MODIFIED, async_resolver.rs:303)"
          signature: "pub async fn settle_identity<R: EnglishIdentityResolver, D: WorkIdentityRepository>(resolver: &R, repo: &D, user_id: UserId, work: &Work, mode: IdentityMode, source: ConflictSource) -> Result<IdentityReport, WorkIdentityError>"
          inputs:
            - { name: "(unchanged signature)", type: "the engine signature is stable; only the internal Resolved/Unresolved arms change" }
          output: "Result<IdentityReport, WorkIdentityError>"
          errors: ["WorkIdentityError"]
          maps_reqs: ["REQ-003", "REQ-004", "REQ-008"]
          control_flow_summary: >
            Resolved/Unresolved arm: zip the returned (CapturedIdentity, AnchorProvenance); partition into
            Hard anchors and Fuzzy anchors. Hard -> merge_missing_anchors (existing confirmed + works.* path).
            Fuzzy -> record_pending_anchor per anchor (ledger only). The badge transition is derived from the
            HARD anchors only (a fuzzy guess never raises the badge — it is unaffirmed). Terminal guard /
            Conflict / NeedsConfirmation arms: unchanged from the engine. NO dead-end marking here (R-1).

  - name: "db-pending-anchor"
    crate: "livrarr-db"
    responsibility: "SqliteDb impl of record_pending_anchor: INSERT ... ON CONFLICT into work_identity_anchors with confidence='pending', setter='auto_search', the real value; NO works.* UPDATE (the explicit inverse of confirm_anchor's per-anchor works.* sync at sqlite_work_identity.rs:71-103). REQ-004 / AC-007 / the AC-006 safety test."
    dependencies: ["domain-id-completeness-types"]
    public_api:
      functions:
        - name: "impl WorkIdentityRepository::record_pending_anchor for SqliteDb"
          inputs: [{ name: "work_id", type: "WorkId" }, { name: "anchor_type", type: "AnchorType" }, { name: "value", type: "&str" }]
          output: "Result<(), WorkIdentityError>"
          errors: ["WorkIdentityError (InvalidAnchorValue on blank — mirrors confirm_anchor)"]

  - name: "db-anchor-dead-end"
    crate: "livrarr-db"
    responsibility: >
      Migration + SqliteDb impl of the durable failed-attempt counter (REQ-009, REDESIGNED per R-1). NEW
      table work_anchor_dead_ends(work_id, anchor_type, attempt_count, last_attempt_at, user_id)
      UNIQUE(work_id, anchor_type), FK work_id -> works ON DELETE CASCADE. bump (upsert +1) / list / clear
      impls. DURABLE: NOT touched by reset_for_manual_refresh (ST-009 — provider_retry_state IS deleted
      there; this table is not). "Unobtainable" is the derived predicate attempt_count >= threshold (TOML).
    dependencies: ["domain-id-completeness-types"]
    public_api:
      functions:
        - name: "migration NNN_work_anchor_dead_ends.sql"
          note: "new table + UNIQUE(work_id, anchor_type) + FK CASCADE. Next sequential migration number at impl time (never edit an applied migration, insight 19)."
        - name: "impl WorkIdentityRepository::{bump_anchor_attempt,list_anchor_dead_ends,clear_anchor_dead_ends} for SqliteDb"
          output: "Result<(), WorkIdentityError> / Result<Vec<AnchorDeadEnd>, WorkIdentityError>"
          errors: ["WorkIdentityError"]

  - name: "db-convergence-selector"
    crate: "livrarr-db"
    responsibility: >
      Build the convergence loop's own pacing clock + WIDENED status selector (D-CONVERGENCE-SCOPE, per
      design-convergence-selection-fix §2/§7/§8, with the REQ-006 widening + guards). Migration:
      works.next_convergence_at TEXT nullable + partial index. list_convergence_due selects, by STATUS (NOT
      retry-row existence — refresh-immune): identity_status='pending' OR (identity-complete AND enrichment
      NOT IN ('enriched','thin')) OR (NEW REQ-006: identity Confirmed/Provisional AND missing a harvestable
      anchor) — gated by next_convergence_at — AND the COMBINED guard (D-CONVERGENCE-GUARDS): select a work
      only if it has at least one CHASEABLE missing anchor = a missing anchor that is NEITHER already
      pending-guessed (else re-guess loop, M9 — guard 1/R3) NOR at the unobtainable threshold
      (attempt_count >= K, else dead-end churn — guard 2/REQ-009). set_next_convergence_at paces
      non-completing attempts (+cadence); reset_for_manual_refresh clears it to NULL (design-convergence R-012).
    dependencies: ["domain-id-completeness-types"]
    public_api:
      functions:
        - name: "migration NNN_works_next_convergence_at.sql"
          note: "ADD COLUMN next_convergence_at TEXT (nullable, UTC RFC3339) + partial index on the incomplete predicate (design-convergence R-011)."
        - name: "WorkDb::list_convergence_due (NEW)"
          inputs: [{ name: "user_id", type: "UserId" }, { name: "now", type: "DateTime<Utc>" }, { name: "limit", type: "i64" }]
          output: "Result<Vec<WorkId>, DbError>"
          errors: ["DbError"]
          note: >
            WIDENED predicate + the combined chaseable-anchor guard (LEFT JOIN work_identity_anchors for the
            pending-guess test and work_anchor_dead_ends for the threshold test). Incomplete-by-INVERSION
            (enrichment NOT IN enriched/thin) to be immune to the 'missed a status string' class
            (design-convergence R-014). The threshold K is read from config at the job layer and passed in, or
            inlined per the migration (ir-v2 decides)."
        - name: "WorkDb::set_next_convergence_at (NEW)"
          inputs: [{ name: "user_id", type: "UserId" }, { name: "work_id", type: "WorkId" }, { name: "at", type: "Option<DateTime<Utc>>" }]
          output: "Result<(), DbError>"
          errors: ["DbError"]
        - name: "reset_for_manual_refresh (MODIFIED, sqlite_work.rs)"
          note: "Also set next_convergence_at = NULL (re-derive due-now after a user refresh). Does NOT touch work_anchor_dead_ends — a manual refresh's dead-end re-attempt is the explicit clear_anchor_dead_ends call (REQ-009), not a side effect here."

  - name: "door-wiring"
    crate: "livrarr-metadata"
    responsibility: >
      REQ-001/002: route every identity-RESOLVING door + refresh + manual-retry through settle_identity
      (insertion points A/B/C, design-uip-wiring §3), and DELETE the duplicated resolve->badge wrappers.
      Author monitor is the deliberate exception (it ASSERTS a hard OL key, not resolves; REQ-001/ST-006).
    dependencies: ["domain-id-completeness-types", "identity-engine-harvest"]
    public_api:
      functions:
        - name: "Insertion A — ensure_identity_and_enrichment anchorless leg (work_service.rs:~2706) -> settle_identity"
          note: >
            One chokepoint covers doors 1-6 (every add door funnels here — verified callers
            work_service.rs:485/538/586, design-uip-wiring §2). Per-door (mode, source) threaded from the
            door: Add-from-search/Manual add = (Interactive, ManualAdd); Per-file import = (Interactive,
            ManualImport); List import = (Background, ListImport); Readarr import = (Background, ReadarrImport);
            Series monitor = (Background, SeriesMonitor). Author monitor = NOT routed (asserts Confirmed{ol_key},
            design-uip-wiring §7)."
        - name: "Insertion B — refresh complete_anchors call (work_service.rs:~1340) -> settle_identity"
          note: >
            (Interactive, Refresh). REQ-002 supersedes the Sprint-E !=Confirmed gate (design-uip-wiring §4
            SUPERSEDED): refresh re-chases a work's MISSING ids INCLUDING on Confirmed works, gated to skip
            when NO ids are missing (the smart settle_identity lacks, ST-002 — re-added HERE at the caller) and
            skip anchors at the unobtainable threshold (list_anchor_dead_ends). A manual refresh MAY re-attempt
            a dead-end (user-initiated 'try again' = clear_anchor_dead_ends then chase). See D-REFRESH-CHASE."
        - name: "Insertion C — retry_all_incomplete direct resolve (work_service.rs:~1468) -> settle_identity"
          note: >
            (Background, ManualRetry) — NOT Interactive (R-001/D-MANUALRETRY-MODE). retry_all_incomplete
            resolves at LatencyTier::Background today (work_service.rs:1469); select_providers gates Audnexus
            (a background-only audiobook provider) on Background tier (english_identity_resolver.rs:242), so
            Interactive would silently DROP Audnexus and make the manual 'retry incomplete' sweep less complete
            — the opposite of this feature's goal. Consequence: an ambiguous Pending work resolves to terminal
            NeedsReview under Background (vs staying Pending under Interactive) — acceptable/honest for a
            'retry incomplete' action (it surfaces 'needs your attention' rather than silently re-queuing)."
        - name: "Legacy deletion (design-uip-wiring §5)"
          note: "Delete converge_identity_pending (async_resolver.rs:22, zero callers), complete_anchors (after B re-points), is_terminal_pending (once the two are gone). Collapse the pre-create resolve_identity badge role (exact reshape = ir-v2 / the one internal open question, wiring §8 Q-3)."

  - name: "convergence-job"
    crate: "livrarr-server"
    responsibility: >
      Insertion D (REQ-006): the NEW background job tick the M9 silent-limbo gap needs (insight 54).
      Registered in server/src/jobs (today: download_poller, session_cleanup, author_monitor,
      state_map_cleanup, rss_sync, tag_convergence, call_record_retention — NONE does identity convergence,
      design-uip-wiring §2). Per tick per user: list_convergence_due(now, BATCH) -> per work
      settle_identity(Background, Convergence) -> the EXISTING Background enrichment path (NOT refresh,
      design-convergence R-009) -> for each anchor still missing from works.* AND with no outstanding pending
      guess, bump_anchor_attempt (REQ-009 dead-end detection lives HERE, not in settle_identity — R-1) ->
      set_next_convergence_at. Bounded batch + conservative TOML cadence + the attempt threshold (no env,
      TOML-only config). CancellationToken-cooperative sleeps (insight 36).
    dependencies: ["domain-id-completeness-types", "identity-engine-harvest"]
    public_api:
      functions:
        - name: "convergence tick (NEW job)"
          note: >
            Selection + pacing read/write ONLY works.next_convergence_at + work_anchor_dead_ends; it NEVER
            reads/writes provider_retry_state (that is enrichment's rate-limit clock, design-convergence §2).
            REQ-007 pre-activation: the worst-case daily GB-call volume for the widened Confirmed backlog MUST
            be computed <= GB daily quota AND the live DB snapshotted BEFORE first enable — a BLOCKING
            pre-activation gate (not an architecture deliverable; carried to AC-011). The job ships
            disabled-by-default until that gate passes."

  - name: "affirm-api"
    crate: "livrarr-handlers"
    responsibility: >
      REQ-005: the read + promote surface for pending guesses. GET a work's pending guesses
      (WorkIdentityRepository::list_anchors filtered to confidence='pending' — the read path works.* cannot
      represent, Q4 confirms list_anchors exposes confidence). POST affirm -> confirm_anchor (promotes
      pending->confirmed, syncs works.*, unlocks enrichment). Handlers validate -> call trait -> map (no
      SQL/business logic in handlers, insight 9). Affirm SHOULD trigger a Background enrichment for the
      just-unlocked provider (handler-level spawn, insight 9g).
    dependencies: ["domain-id-completeness-types"]
    public_api:
      functions:
        - name: "GET /works/{id}/pending-anchors (NEW)"
          output: "list of {anchor_type, value, setter} for confidence='pending' rows"
          note: "Read for the affirm affordance. Behind a narrow Has* capability bound (insight 9h)."
        - name: "POST /works/{id}/pending-anchors/{anchor_type}/affirm (NEW)"
          output: "204 + spawned Background enrichment for the unlocked provider"
          note: "REQ-005 promote. Idempotent (already-confirmed = no-op)."

  - name: "affirm-ui"
    crate: "frontend (testdata/ui)"
    responsibility: >
      REQ-005 PO decision (a): a SUBTLE, NON-BLOCKING 'we think this is the audiobook — confirm?' affordance
      on a work holding a pending guess. NOT a modal; the work is fully usable unaffirmed. Reads GET
      pending-anchors; one-click POST affirm. Placement (work-detail inline vs a small review queue) + whether
      multiple pending guesses batch into one affordance = Q1, a DESIGN-stage question (spec §5).
      Restore-from-source on mount (insight 18).
    dependencies: ["affirm-api"]
    public_api:
      types: []
      functions: []

  - name: "behavioral-id-completeness"
    crate: "livrarr-behavioral"
    responsibility: >
      The faithful door->engine tests (the lesson that bit this project twice, insight 46): each door driven
      through its REAL entry path (no injected identity state), asserting it settles VIA settle_identity with
      the expected (mode, source) — not a legacy writer. Plus the negative author-monitor test, the safety
      test (a pending ASIN yields SkippedNoAnchor/NotFound + absent from works.asin until affirmed), the
      MatchBasis test (the title-matched audiobook ASIN stays Fuzzy/held; a shared-isbn bridge is Hard), and
      the convergence faithful tests (seed Pending the way Readarr does, no retry-row injection; a dead-end
      converges out of selection after K attempts; a pending-guess work is not re-selected). Real Resolution
      values + real starting badges on a real create_test_db() — never injected end-states.
    dependencies: ["domain-id-completeness-types"]
    public_api:
      types: []
      functions: []

