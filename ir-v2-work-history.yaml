  # ───────────────────────────────────────────────────────────────────────────
  - name: "server-history-backfill"
    crate: "livrarr-server"
    responsibility: "REQ-010: the one-time, non-blocking, non-destructive startup synthesis pass."
    dependencies: ["domain-history-model", "db-history-write-core"]
    module_invariants:
      - "Synthesizes ONLY from persisted timestamps (ST-007); every row backfilled:true + work_title; NEVER deletes or rewrites rows; marker written only on full completion; server serves while it runs."
      - "The backfill's inserts are FALLIBLE and tracked (r4 codex R-5): REQ-009's observer rule protects live HOST operations — the backfill has none; a swallowed insert error here becomes permanent loss once the marker lands. Every insert failure defers the marker."
    capability_survey:
      - { capability: "startup registration", existing_source: "JobRunner::spawn_startup_pass (jobs/mod.rs:254-313) + run_startup_passes (main.rs:977-1012, 3 existing calls)", reuse_decision: "REUSE — 4th call, identical shape", rationale: "panic-isolated, JobStatus-visible, fire-and-forget (REQ-010 non-gating)" }
      - { capability: "completion marker", existing_source: "_livrarr_meta reads/writes are inline sqlx at call sites; identity-key precedent does UPDATE-only and WORKS ONLY because migration 069 pre-seeded the row (pool.rs:425-493)", reuse_decision: "NEW inline queries with INSERT ... ON CONFLICT(key) DO UPDATE", rationale: "IR v1 D-NO-MIGRATION (no seeding migration) — a bare UPDATE on an unseeded key silently no-ops (survey-flagged trap); insert-or-update is immune. INSERT OR REPLACE stays banned (insight 20)" }
      - { capability: "bulk fact reads", existing_source: "UserDb::list_users (api/user.rs:22); WorkDb::list_works (api/work.rs:40, unbounded); LibraryItemDb::list_library_items (api/library_item.rs:19, unbounded); GrabDb list_grabs_paginated ONLY (api/grab.rs:65-71 — no unbounded grab list exists)", reuse_decision: "REUSE all — grabs via paging (500/page)", rationale: "zero new DB surface; paging doubles as batching for the biggest table" }
      - { capability: "coverage lookups", existing_source: "HistoryDb::list_history filters by event_type AND work_id AND dates, unbounded (sqlite_history.rs:66-99)", reuse_decision: "REUSE — one per-kind query per user, folded into in-memory sets", rationale: "per-fact dedup (REQ-010) without N queries" }
    public_api:
      functions:
        - name: "run_history_backfill"
          signature: "pub async fn run_history_backfill(db: SqliteDb)  (new file crates/livrarr-server/src/jobs/history_backfill.rs; registered in run_startup_passes as spawn_startup_pass(\"history_backfill\", svc_db.clone(), run_history_backfill(svc_db.clone())))"
          output: "() — errors are warned, never crash the pass (panic isolation is the runner's backstop)"
          maps_reqs: ["REQ-010","REQ-013"]
          pseudocode:
            - "MARKER GUARD: SELECT value FROM _livrarr_meta WHERE key='history_backfill_generation'; parsed >= 1 → return (completed pass never reruns)."
            - "insert(draft) helper (BACKFILL-LOCAL, r4 codex R-5): build CreateHistoryEventDbRequest from the draft and call db.create_history_event DIRECTLY — on Err: tracing::warn! + set the current user's clean flag false + CONTINUE with the remaining facts. NOT record_history: the infallible observer helper is for live writers with a host operation to protect; here a swallowed failure would poison the marker."
            - "all_users_clean := true. FOR user IN db.list_users():"
            - "  COVERAGE PRELOAD (one list_history call per kind, this user): grabbed_guids := set of payload.guid over {event_type: Grabbed}; added_covered := set of work_id over {Added}; enriched_covered := set of work_id over {Enriched}; imported_events := Vec<(work_id, date)> over {Imported} ∪ {ImportFailed}; failure_covered := set of (work_id, payload.title) over {DownloadFailed} ∪ {ImportFailed}."
            - "  WORKS PASS: works := db.list_works(user); titles := map id→(title, author). FOR work: if !added_covered.contains(work.id) → insert(added_backfilled(work.id, title, author, parse(work.added_at))). If work.enriched_at is Some AND !enriched_covered.contains(work.id) → insert(enriched_backfilled(work.id, title, author, work.enrichment_source, parse(enriched_at))) (at most one — ST-007's last-success-only)."
            - "  GRABS PASS: page through list_grabs_paginated(user, page, 500). FOR grab: title_of := |id| titles.get(&id).map(|(t, _)| t.as_str()).unwrap_or_default() (NEVER index — r1 gemini R-1: a work deleted mid-pass must degrade to empty-title + warn, not panic). if !grabbed_guids.contains(grab.guid) → insert(grabbed_backfilled(grab.work_id, title_of(grab.work_id), &grab.title, &grab.indexer, &grab.guid, parse(grab.grabbed_at))). THEN the failure mapping (spec REQ-010, GrabStatus entities.rs:59-67): Failed → insert(download_failed_backfilled(..., grab.import_error, grabbed_at)) unless failure_covered contains (work_id, grab.title); ImportFailed → insert(import_failed_backfilled(...)) (same guard); Sent/Confirmed/Importing/Imported/Removed → nothing."
            - "  ITEMS PASS: FOR item IN db.list_library_items(user): covered := imported_events.any(|(w, d)| w == item.work_id && d ∈ [imported_at − 5s, imported_at + 1h]); if !covered → insert(imported_backfilled(item.work_id, title_of(item.work_id), &item.path, media_type, parse(imported_at))) (spec's declared BEST-EFFORT window; both sides pinned)."
            - "  PACING: tokio::task::yield_now() every 50 writes (each insert is its own implicit tx — no long writer lock; see D-ROW-TX)."
            - "  Any per-user hard error (a list query failing) OR any insert() failure during the user's passes → tracing::warn!, all_users_clean = false; list failures skip to the next user, insert failures continue the current user's remaining facts (r4 codex R-5)."
            - "MARKER: if all_users_clean → INSERT INTO _livrarr_meta(key, value) VALUES('history_backfill_generation','1') ON CONFLICT(key) DO UPDATE SET value='1'. Else no marker (rerun next boot; per-fact coverage makes the rerun additive-only)."
            - "Title map note: grabs/items always reference live works (their FKs cascade on work delete), so titles[work_id] is total; a race with a concurrent delete degrades to empty-title + warn, never a crash."
          call_annotations:
            - { call: "UserDb::list_users / WorkDb::list_works / LibraryItemDb::list_library_items / GrabDb::list_grabs_paginated / HistoryDb::list_history", type: "EXISTING", target: "livrarr-db api traits (survey §12)" }
            - { call: "HistoryDb::create_history_event (direct, fallible — via the local insert() helper)", type: "EXISTING", target: "livrarr-db api/history.rs:24 (r4: NOT record_history — insert failures must defer the marker)" }
            - { call: "backfill constructors (drafts)", type: "NEW", target: "domain-history-model" }
            - { call: "sqlx::query (marker)", type: "EXISTING", target: "inline _livrarr_meta access, same style as pool.rs:427/:481" }
            - { call: "tokio::task::yield_now", type: "LIBRARY", target: "tokio" }
            - { call: "chrono date parse", type: "LIBRARY", target: "chrono" }
          decisions:
            - { key: "D-ROW-TX", value: "per-row autocommit inserts + yield every 50, not explicit batch transactions", rationale: "REQ-010's actual constraint is never starving the single writer; per-row implicit txs hold the lock per-statement (shortest possible), and an explicit batching layer would need new DB surface for zero user-visible gain. The spec's 'small batched transactions' intent (no long lock, yielding) is met; deviation noted for review." }
            - { key: "D-FAILURE-COVERAGE", value: "grab-failure dedup is TWO-TIER: a DownloadFailed/ImportFailed row carrying a guid key (backfill-written rows stamp it) covers exactly that grab; a guid-less row (live failure writers persist no guid) covers by (work_id, release title)", rationale: "real live failure payloads carry no guid (survey §13: {title, error}), so guid-exactness is impossible against THEM — but rows the backfill itself writes CAN self-identify, and must: (work, title) alone loses the second of two same-titled failed grabs from different indexers across a crash-rerun (code-review r2 codex R-4, folded 2026-07-20 — pinned by wh_backfill_failure_dedup_is_per_guid_for_same_title_grabs). Guid rows stay out of the title tier; the guid-less tier keeps erring toward not synthesizing — same trade the spec's imported window makes" }
          tdd_directives:
            - "AC-010 (the full fixture): mixed library (works + grabs in each terminal status + items + some real history rows incl. a batch imported row) → synthesizes exactly the uncovered facts, all backfilled:true with fact dates; a manual-import item newer than a real imported row AND outside +1h → synthesized; just-inside vs just-outside window items → skipped vs synthesized; rerun (and rerun after a simulated mid-pass crash: kill after user 1 of 2, marker absent) → zero duplicates, zero lost rows incl. backfilled rows of a since-deleted work; marker present after a clean full pass → third run does nothing; server accepts requests while running (behavioral: the pass is a spawned task, assert non-blocking registration shape)."
            - "AC-010 insert-failure case (r4): a HistoryDb double whose create fails for one row mid-pass → the pass completes the remaining facts, writes NO marker, and the next run synthesizes exactly the missing row (no duplicates of the succeeded ones)."

