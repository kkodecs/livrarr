metadata:
  feature: "work-history"
  stage: v2-operational
  spec_ref: "spec-work-history.md"
  ir_v1_ref: "ir-v1-work-history.yaml"
  version: 1
  review_round: 1
  round1_dispositions: >
    Design r1: gemini PASS (1 P2), codex FAIL (2 P1) — all three verified against source and
    folded. gemini R-1: backfill pseudocode used panicking map indexing (titles[work_id]) while
    claiming graceful degradation — now .get().unwrap_or_default() everywhere. codex R-1
    CONFIRMED (the trace-the-branch class): import_single_item constructs early
    ImportResult{Failed} returns (unrecognized media :901-911, missing root folder,
    work-creation failure) BEFORE the ImportFileResult match my writer sat on — silent failures.
    Fix: the REQ-003 writer moves to import_single_item's SOLE caller (manual_import.rs:863
    confirm loop, caller census: one production call site), seeing every ImportResult regardless
    of path; a no-work failure records with work_id None (path + error payload; work_title only
    when a work exists). codex R-2 CONFIRMED by direct read: the adopt handler's success arm
    matches Adopted | Imported | Skipped together (root_folder.rs:279-283) — writer now
    exhaustive: Adopted|Imported → imported, Skipped → nothing, Err arms (:286-299) →
    importFailed. TDD directives updated to pin early+late manual failures and adopt-arm
    exhaustiveness.
  round2_dispositions: >
    Design r2: gemini TIMEOUT (600s, REVIEW_INCOMPLETE — no verdict; round 3 covers it), codex
    FAIL (1 P1). codex R-2 CONFIRMED by tracing the cited branch (lib.rs:515-564): the
    cached-candidate reuse arm returns provider_outcomes: HashMap::new() on a COMPLETED
    attempt (comment ':554 — No provider_outcomes on the cached-reuse path') with changed
    computed from merge output (:545-547) — so the r1 predicate (outcomes empty && !changed)
    would suppress a completed no-op reuse's enriched{changed:false}, violating REQ-002/AC-002/
    Q-001. The pre-declared fallback is PROMOTED to the design: EnrichmentResult gains
    `attempted: bool` — authored by enrich_work's own control flow (true on the cached-reuse
    completion arm and the network completion path; false only when the pass ends with no
    dispatch and no merge), threaded through the EnrichmentWorkflowImpl adapter onto the domain
    result. The heuristic predicate is DELETED; the writer gates on !attempted. New TDD case:
    cached reuse + ApplyMergeOutcome::NoChange → enriched{changed:false}.
  round3_dispositions: >
    Design r3: gemini PASS (2 P2), codex FAIL (1 P1) — all three verified by direct read and
    folded. gemini R-3: the history repoint now matches its siblings' exact shape — UPDATE
    history SET work_id = ? WHERE user_id = ? AND work_id = ? (library_items/grabs repoints at
    sqlite_work.rs:779/:787 both filter user_id and bind req.user_id; history's only index is
    idx_history_user_id). gemini R-4 CONFIRMED against my survey's wrong "in scope" claim: the
    delete road DISCARDS get_work's result (:1476-1482, ownership check only) — pseudocode now
    binds `let work = ...` so title/author exist for the payload. codex R-3 CONFIRMED (an
    inconsistency I introduced in the r1 fold): the required-field constructor cannot express
    the early no-work failures, and ImportResult carries no media_type (manual_import.rs:253-260;
    early failures return work_id: None at :913-921/:925-933). Fix: failure shapes split —
    import_failed_manual keeps a required work_id/work_title with media_type now Option;
    NEW import_failed_unattached(path, media_type: Option, error) for the no-work case;
    ImportResult gains media_type: Option<MediaType> (Some once classification succeeds), so
    the confirm loop's writes are typed end-to-end. TDD pins the two failure payload shapes
    separately.
  round4_dispositions: >
    Design r4: gemini PASS (0 findings), codex FAIL (1 NEW P1) — ACCEPTED. codex R-5: the
    backfill routed its inserts through record_history (infallible, absorbs errors — REQ-009's
    observer shape), so insert failures were invisible to the all_users_clean marker decision:
    a transient insert error could lose rows AND write history_backfill_generation=1 —
    permanent, contradicting REQ-010/AC-010 and the contract's marker-only-on-full-completion
    invariant. Root cause: I over-applied observer semantics — REQ-009 protects live HOST
    operations from history failures; the backfill has no host operation, its history writes
    ARE the operation. Fix: the backfill calls the FALLIBLE HistoryDb::create_history_event
    directly (constructors still build every draft — payload discipline unchanged; a local
    draft→request helper); any insert Err → warn + mark the user failed + continue (one bad row
    must not abort the user's remaining facts) → no marker → rerun next boot is additive via
    per-fact dedup. Live writers keep record_history unchanged. New TDD case pins
    insert-failure → no marker → rerun completes.
  round6_dispositions: >
    Design r6 (PO-sanctioned confirm round): gemini PASS (0 findings), codex FAIL (1 P1, R-8 —
    a residue of MY r5 fold): the success arm still passed Option<MediaType> into
    imported_manual's required &str (I had converted only the two failure arms). Folded: the
    confirm-loop match now destructures (status, work_id, media_type) — the success arm binds
    the proven Some(mt) and calls mt.as_str(); an impossible (Imported, None-shape) gets a
    defensive warn + no event, never a panic. One-line class; gate re-PASS.
  code_review_dispositions: >
    Code-review r1 (codex FAIL 3, gemini REVIEW_INCOMPLETE ×2 — 600s dispatcher timeout, since
    raised to 1200s): R-1 (P1) FOLDED — poll_sabnzbd's Failed arm wrote downloadFailed even when
    update_grab_status Err'd, and the still-active grab re-entered the arm next tick (duplicate);
    the write now sits inside the update's Ok(()) arm (adjacent-shape sweep: release_service's
    grabbed writer already sits after its upsert's success point; the SAB orphan arm writes no
    event by design). R-2 (P2) REJECTED as re-litigation of the ratified D-COUNT decision
    (db-history-robust-reads.decisions — raw COUNT is the documented accepted drift, pinned by
    test_wh_robust_reads). R-3 (P3) ACCEPTED as a record correction: the staged-vs-worktree
    fixture delta on test_wh_backfill.rs is three changes (seed_download_client FK fix this
    session; import_id Some→None and a lifetime elision from an earlier session) — zero test
    bodies touched; session log corrected. Code-review r2 (codex FAIL 3): R-2/R-3 persist-flags
    dispositioned as above (no change); R-4 (P1) FOLDED — D-FAILURE-COVERAGE upgraded to the
    two-tier dedup recorded in that decision row, backfilled failure constructors gained guid,
    new behavioral pin wh_backfill_failure_dedup_is_per_guid_for_same_title_grabs.
  tests_stage_dispositions: >
    Tests-review r1 (Gemini-only by policy — Codex auto-excluded as test author): FAIL, 4
    findings, dispositioned together with the two integrator-withheld flags 2026-07-19.
    R-1 (P1) CONFIRMED AND EXTENDED: the secondary-API deletion test drove raw
    SqliteDb::delete_library_item and asserted a fileDeleted event there — forbidden by
    D-WRITE-PATH (no writer inside DB methods). Source verification went further: lib.rs
    gates `api_secondary_impl` behind #[cfg(test)], SecondaryApiImpl has ZERO production
    references (Serena reference sweep + main.rs/router search), and no other type
    implements LibraryFileApi — REQ-005 door (c) has NO production surface today (the
    door-(d) empty-set shape). Test DELETED with an in-file disposition record; NO writer
    will be built for the cfg(test)-only module; flagged to the PO as a spec-level stale
    enumeration (spec untouched). R-2 (P1) CONFIRMED: the Readarr-undo test drove
    LiveReadarrImportService wrapper methods and asserted events the design writes in
    LiveReadarrImportWorkflow::undo (:248-363, titles pre-fetched before deletion); the
    workflow is unconstructible from behavioral (concrete LiveWorkService/LiveImportWorkflow
    chain). Converted to a todo!() placeholder carrying the Stage-5 plan: undo's body
    touches only readarr_import_service + data_dir + db, so implementation extracts the
    deletion+event loop into a pub fn (trait method delegates) and the test realizes
    against that seam red-first. R-3/R-4 (P1, converging with withheld flag 2): the
    identity-events TestState pattern disproves blanket handler-context unreachability —
    ALL SEVEN import_events placeholders realized at disposition (manual confirm success/
    early/late + adopt Adopted/Skipped/Err via a TestState with 11 Has* impls and a
    scripted domain ImportService; grab-road batch via the real ImportWorkflowImpl<SqliteDb>
    mirroring test_consolidation_import_workflow). The three tags placeholders stay
    todo!() with named Stage-5 seams: reorganize (LiveImportService explicit construction)
    and the two convergence tests (tick takes AppState — jobs/tag_convergence.rs:13 —
    so Stage 5 extracts the per-item recovery helper the tick calls and both tests realize
    against it). Withheld flag 1 folded (Gemini missed it): the tags_written metadata test
    scripted a flag its own double discarded while the design derives it from REAL
    materialization (MaterializeOutcome.tags_written) — rewritten onto a real minimal-EPUB
    library item driving the real materialize step (n2 t_e precedent), the scripted field
    deleted (clears the one deliberate clippy warning), and the changed-pass test now also
    pins tags_written:false for the no-files side. Fixture-satisfiability fix folded in the
    same pass: metadata_events' seed helper now sets IdentityStatus::Confirmed explicitly
    (create_work alone does not confirm; without it the completed-pass fixtures could stay
    gate-blocked forever — n2 precedent). Disposition verification also caught two fixture
    bugs the 47-red consolidated run masked: BOTH grabbed-event tests were red-for-the-wrong-
    reason — ReleaseService::grab SSRF-rejects raw magnet download URLs at entry
    (release_service.rs:330-336; is_trusted is false for non-http schemes and validate_url
    returns InvalidScheme), so grab().unwrap() panicked before any event — fixed to a
    trusted http torrent URL + three scripted responses (the indexer-citizenship-pins
    recipe); and test_wh_deletion's per-item root-folder creation hit the
    UNIQUE(root_folders.media_type) constraint on the two-file work-delete fixture —
    get-or-create fix. Side flag for the PO (surfaced, not fixed — out of feature scope):
    production magnet handling lives only BEHIND the grab entry gate (http links that
    redirect to magnets); a raw magnet: download_url from an indexer result appears
    front-door-blocked. Stage-5 obligations from this disposition: the Readarr-undo
    extracted seam, the convergence per-item recovery helper, realizing the 4 remaining
    todo!() tests red-first as those seams land, and NO secondary-API writer.
  round5_dispositions: >
    Design r5: both families FAIL — 3 findings, all detail-class, all verified and folded.
    gemini R-6 (P2, true by my own text): the Readarr-undo pseudocode kept the panicking
    titles[..] indexing I had fixed in the backfill at r3 — now the same safe-lookup shape.
    gemini R-7 (P1) CONFIRMED by symbol read: MediaType (entities.rs:33-41) is a bare 2-variant
    enum with NO impl block anywhere (code-index: zero `impl MediaType` hits) — as_str()/
    as_deref() in my pseudocode did not exist. Fix: domain-history-model declares
    MediaType::as_str(&self) -> &'static str ("ebook"/"audiobook", equal to the serde lowercase
    strings; AnchorType::as_str convention), and the Option sites use .map(|m| m.as_str()).
    codex R-6 (P1): the two REQ-013 migration surfaces (ReleaseService::grab grabbed writer,
    download_poller SAB downloadFailed writer) were designed as modules but MISSING from the
    doors inventory — two rows added (25 total), contract count updated; their payload-separation
    TDD already existed in the modules and is now referenced by the rows.
  note: >
    Extends IR v1 with pseudocode, call annotations, conditions, capability surveys, and TDD
    directives. IR v1 remains the source of truth for system_architecture, shared_types,
    dependency_graph, domain_entities, and data_flow. Every signature below was read from live
    source 2026-07-19 (design-stage survey + direct reads). Two stale-spec-citation flags carried
    for the PO (spec text untouched): ST-006 lists 2 retag callers where 3 exist
    (import_service.rs:522 reorganize road); ST-005's "create_work_with_anchor arm (~852)" is a
    COMMENT in live code, not a call — both add_fast arms call create_work, and
    create_work_with_anchor has zero production callers (test-only). Neither weakens the STs'
    actual guarantees; both STRENGTHEN this design (in-method tag hook; single birth funnel).

# Inherited verbatim from IR v1 so the compliance gate can validate LIBRARY call annotations.
approved_libraries:
  - { name: "serde_json", use: "event payload construction (existing workspace dep)" }
  - { name: "chrono",     use: "event/backfill dates (existing project-wide convention)" }
  - { name: "tracing",    use: "REQ-009 warn on failed history writes; REQ-012 warn on skipped rows" }
  - { name: "tokio",      use: "backfill spawn + yielding (existing)" }
  - { name: "trait-variant", use: "the HistoryService trait extension keeps the existing trait_variant::make(Send) form (insight 8 convention)" }
  - { name: "sqlx",       use: "the merge-repoint UPDATE + _livrarr_meta marker queries (existing workspace dep)" }
  - note: "NO new third-party dependency, backend or frontend."

modules:
  # ───────────────────────────────────────────────────────────────────────────
  - name: "domain-history-model"
    crate: "livrarr-domain"
    responsibility: >
      The shared vocabulary: 4 new EventType variants, the HistoryDraft + typed constructor
      family (the ONLY sanctioned payload builder — REQ-013 keys enforced by signature), the
      WorkAddSource door label carried on WorkCandidate and stamped by the six seed_*
      constructors, and the one new write method on the domain HistoryService trait.
    dependencies: []
    module_invariants:
      - "Constructors are pure (no I/O, no clock reads except none — date is a parameter or None)."
      - "Every work-attached constructor REQUIRES work_title; grab-family constructors keep `title` = RELEASE title and never alias it to work_title (REQ-013)."
      - "WorkAddSource is stamped ONLY inside seed_* constructors — no caller passes it separately, so a door cannot mislabel itself (REQ-001)."
    capability_survey:
      - { capability: "event payload building", existing_source: "4 ad-hoc serde_json::json! sites (release_service.rs:461-474, download_poller.rs:545-559, import_workflow.rs:1288-1313, dead manual_import_service.rs:106-123)", reuse_decision: "REPLACE with typed constructors", rationale: "3 sites already drifted 3 payload conventions; REQ-013's reserved keys are unenforceable as ad-hoc JSON" }
      - { capability: "event kind enum", existing_source: "EventType, 10 variants (entities.rs:141-157, serde camelCase)", reuse_decision: "EXTEND same enum (+4)", rationale: "REQ-001/006/007/008; TEXT column, no migration (ST-008)" }
      - { capability: "door-scoped candidate facts", existing_source: "the six per-door seed_* constructors (seed.rs:99-241) — insight 53's single seed-construction point", reuse_decision: "REUSE as the label carrier — add one field, stamp per constructor", rationale: "REQ-001's design-stage question answered: the constructor IS the door; a candidate field survives every intermediate hop into add_fast unchanged" }
      - { capability: "history write surface for handler doors", existing_source: "HistoryService trait, read-only 1 method (services/history.rs:11-20); HasHistoryService accessor exists (handlers/context.rs:156-159)", reuse_decision: "EXTEND the trait with `record`", rationale: "compile wall (overview.md:31-33): handlers reach persistence only via domain traits; no HistoryService stub exists anywhere (survey census) so exactly one impl updates" }
    public_api:
      types:
        - { kind: enum,   name: "EventType (+4 variants)", note: "Added | WorkDeleted | WorksMerged | IdentityResolved appended to entities.rs:147-156; serde camelCase strings added/workDeleted/worksMerged/identityResolved" }
        - { kind: struct, name: "HistoryDraft", note: "{ work_id: Option<WorkId>, event_type: EventType, data: serde_json::Value, date: Option<DateTime<Utc>> } — date None = write-time now (live writers); Some = fact date (backfill)" }
        - { kind: enum,   name: "WorkAddSource", note: "Search | ListImport | Readarr | AuthorMonitor | SeriesMonitor | FileImport; as_str() → the spec's labels search|list-import|readarr|author-monitor|series-monitor|file-import" }
        - { kind: "field-add", name: "WorkCandidate.add_source", note: "NEW field `add_source: WorkAddSource` on WorkCandidate (identity.rs:556-574). Stamped: seed_add_box→Search (:99-122), seed_manual_import→FileImport (:124-146), seed_list_import→ListImport (:148-169), seed_author_monitor→AuthorMonitor (:171-189), seed_series_monitor→SeriesMonitor (:191-215), seed_readarr_import→Readarr (:217-241). Constructor census exhaustive (survey: no other seed_* exists); struct-literal sites outside seed.rs are illegal per insight 53 and unchanged." }
        - { kind: "impl-add", name: "MediaType::as_str", note: "NEW `impl MediaType { pub fn as_str(&self) -> &'static str }` → \"ebook\" | \"audiobook\" — equal to the serde lowercase strings (entities.rs:33-41). r5 gemini R-7: NO impl MediaType exists today (code-index: zero hits), so every pseudocode payload conversion routes through this one impl (AnchorType::as_str convention); Option sites use .map(|m| m.as_str())." }
      functions:
        - name: "history_events constructor family"
          signature: "pub fn <kind>(...typed fields...) -> HistoryDraft — one per written shape, module livrarr-domain/src/history_events.rs (NEW)"
          output: "HistoryDraft"
          maps_reqs: ["REQ-001","REQ-002","REQ-003","REQ-004","REQ-005","REQ-006","REQ-007","REQ-008","REQ-010","REQ-013"]
          pseudocode:
            - "Pattern (every constructor): build serde_json::json!({...}) with EXACTLY the keys listed below; return HistoryDraft{ work_id, event_type, data, date } (date None unless a backfill variant taking `date: DateTime<Utc>`)."
            - "added(work_id, work_title, work_author: Option, source: WorkAddSource) → Added; keys: work_title, work_author?, source (source.as_str())."
            - "added_backfilled(work_id, work_title, work_author?, date) → Added; keys: work_title, work_author?, backfilled:true (source omitted — spec Non-Requirements: not reconstructible)."
            - "enriched(work_id, work_title, work_author?, changed: bool, status: &EnrichmentStatus, tags_written: bool) → Enriched; keys: work_title, work_author?, changed, status (status string incl. thin), tags_written."
            - "enriched_backfilled(work_id, work_title, work_author?, source: Option<String>, date) → Enriched; keys: work_title, work_author?, source?, backfilled:true."
            - "enrichment_failed(work_id, work_title, work_author?, reason: &str) → EnrichmentFailed; keys: work_title, work_author?, reason."
            - "imported_manual(work_id, work_title, path: &str, media_type: &str) → Imported; keys: work_title, path, media_type (spec REQ-003 per-file shape; success always has a classified type)."
            - "import_failed_manual(work_id: WorkId, work_title, path, media_type: Option<&str>, error: &str) → ImportFailed; keys: work_title, path, media_type?, error (work-ATTACHED failure)."
            - "import_failed_unattached(path: &str, media_type: Option<&str>, error: &str) → ImportFailed with work_id None; keys: path, media_type?, error (r3: the early manual-import failures — unrecognized media, missing root folder, work-create failure — have NO work to snapshot; identified by path)."
            - "imported_batch(work_id, work_title, work_author?, release_title: &str, imported: usize, failed: usize, skipped: usize) → Imported|ImportFailed chosen by caller's existing final_status ternary; keys: title (RELEASE — preserved meaning), imported, failed, skipped, work_title, work_author? (REQ-013 adds, never renames)."
            - "imported_backfilled(work_id, work_title, path, media_type, date) → Imported; keys: work_title, path, media_type, backfilled:true."
            - "import_failed_backfilled(work_id, work_title, release_title, guid, import_error: Option<&str>, date) → ImportFailed; keys: title (release), guid, error?, work_title, backfilled:true (GrabStatus::ImportFailed mapping, REQ-010; guid added at code-review r2 — the per-fact failure dedup key)."
            - "download_failed_backfilled(work_id, work_title, release_title, guid, import_error: Option<&str>, date) → DownloadFailed; keys: title (release), guid, error?, work_title, backfilled:true (GrabStatus::Failed mapping; guid as above)."
            - "tag_written(work_id, work_title, attempted: usize, succeeded: usize) → TagWritten; keys: work_title, attempted, succeeded."
            - "tag_write_failed(work_id, work_title, attempted: usize, first_error: &str) → TagWriteFailed; keys: work_title, attempted, error."
            - "tag_written_item(work_id, work_title, path: &str) → TagWritten; keys: work_title, path (convergence single-file shape, spec REQ-004 round-3)."
            - "file_deleted(work_id, work_title, path, media_type, undo: bool) → FileDeleted; keys: work_title, path, media_type, undo (undo:true only on the Readarr-undo road, else key omitted)."
            - "work_deleted(work_title, work_author?, files_removed: usize, undo: bool) → WorkDeleted with work_id: None (see D-DELETE-ORDER); keys: work_title, work_author?, files_removed, undo?."
            - "works_merged(survivor_work_id, survivor_title, merged_title, merged_work_id) → WorksMerged on the survivor; keys: work_title (survivor snapshot), merged_title, merged_work_id."
            - "grabbed(work_id, work_title, work_author?, release_title, indexer, guid, download_client_id) → Grabbed; keys: title (RELEASE), indexer, guid, download_client_id (all four preserved verbatim — backfill dedup depends on guid), work_title, work_author?."
            - "grabbed_backfilled(work_id, work_title, release_title, indexer, guid, date) → Grabbed; keys: title, indexer, guid, work_title, backfilled:true."
            - "download_failed(work_id, work_title, release_title, error: &str) → DownloadFailed; keys: title (release — preserved), error, work_title (download_poller migration)."
            - "identity_resolved(work_id, work_title, action: &str, identity: String) → IdentityResolved; keys: work_title, action, identity (human-readable chosen-identity summary, e.g. 'Title — Author (gr_key 123)')."
          call_annotations:
            - { call: "serde_json::json!", type: "LIBRARY", target: "serde_json" }
            - { call: "WorkAddSource::as_str", type: "NEW", target: "domain-history-model" }
          preconditions:
            - "Callers pass the work's CURRENT title (post-merge state where applicable) — constructors never fetch."
          postconditions:
            - "Every returned draft's data contains work_title for work-attached kinds; backfill variants contain backfilled:true and carry Some(date)."
          decisions:
            - { key: "constructors-not-builder", value: "one flat fn per shape, no builder type", rationale: "16 fixed shapes; a builder invites optional-key drift, the exact REQ-013 failure mode" }
          tdd_directives:
            - "AC-013: every constructor's output contains work_title (property-style test over the family); grab-family outputs keep title == release title distinct from work_title."
        - name: "HistoryService::record"
          signature: "async fn record(&self, user_id: UserId, draft: HistoryDraft)  — NEW method on the trait (services/history.rs:11-20, trait_variant::make(Send))"
          output: "() — infallible by signature (REQ-009 in the type)"
          maps_reqs: ["REQ-008","REQ-009"]
          pseudocode:
            - "Trait declaration only here; the single impl (survey census: HistoryServiceImpl is the trait's only impl, no stub exists) delegates to record_history (module db-history-write-core)."
          call_annotations:
            - { call: "trait_variant::make", type: "LIBRARY", target: "trait-variant" }
          tdd_directives:
            - "AC-009 (handler-door slice): a failing HistoryDb underneath record() logs a warning and the calling handler still returns success."

  # ───────────────────────────────────────────────────────────────────────────
  - name: "db-history-write-core"
    crate: "livrarr-db"
    responsibility: "The one physical write chokepoint (record_history), the caller-supplied date, and the kind maps."
    dependencies: ["domain-history-model"]
    module_invariants:
      - "record_history NEVER returns an error and never panics on write failure — warn + return (REQ-009)."
      - "parse_event_type / event_type_str / serde camelCase agree for all 14 kinds (tri-map test)."
    capability_survey:
      - { capability: "history insert", existing_source: "HistoryDb::create_history_event (api/history.rs:24-26; impl sqlite_history.rs:154-172, stamps date=now server-side)", reuse_decision: "REUSE + EXTEND request with date: Option<DateTime<Utc>>", rationale: "backfill needs fact dates (D-DATE-PARAM); a second insert path was rejected in IR v1" }
      - { capability: "kind string maps", existing_source: "parse_event_type (sqlite_history.rs:32-48) + event_type_str (:50-63), exhaustive matches", reuse_decision: "EXTEND both (+4 arms each), keep as matches", rationale: "exhaustive match = the compiler forces every future variant's arms; consolidation onto serde adds runtime cost for zero drift benefit once the tri-map test exists (settles the IR v1 open item)" }
    public_api:
      functions:
        - name: "record_history"
          signature: "pub async fn record_history<D: HistoryDb>(db: &D, user_id: UserId, draft: HistoryDraft)"
          output: "()"
          maps_reqs: ["REQ-009","REQ-013"]
          pseudocode:
            - "req := CreateHistoryEventDbRequest{ user_id, work_id: draft.work_id, event_type: draft.event_type, data: draft.data, date: draft.date }."
            - "match db.create_history_event(req).await { Ok(()) => (), Err(e) => tracing::warn!(?event_type, ?work_id, \"history write failed: {e}\") } — never propagate, never retry (REQ-009)."
          call_annotations:
            - { call: "HistoryDb::create_history_event", type: "EXISTING", target: "livrarr-db api/history.rs:24 (request struct extended)" }
            - { call: "tracing::warn!", type: "LIBRARY", target: "tracing" }
          tdd_directives:
            - "AC-009: with a HistoryDb double whose create fails, record_history returns () and the host operation (driven end-to-end) succeeds; a warning is observable."
        - name: "CreateHistoryEventDbRequest.date + create_history_event"
          signature: "struct gains date: Option<DateTime<Utc>>; impl uses req.date.unwrap_or_else(Utc::now).to_rfc3339() (sqlite_history.rs:154-172)"
          output: "Result<(), DbError> (unchanged)"
          maps_reqs: ["REQ-010"]
          pseudocode:
            - "Only the date-derivation line changes: Some(d) → d.to_rfc3339(); None → Utc::now().to_rfc3339() (exact current behavior)."
            - "Compile ripple (mechanical): the 3 live writer literals (migrating anyway) + the test StubDb impl (livrarr-download/tests/indexer_citizenship_pins.rs:935) gain the field."
          call_annotations:
