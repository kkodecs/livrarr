    usage: "datetime handling (existing)"
  - name: serde/serde_json
    version: "workspace"
    usage: "serialization (existing)"
  - name: tokio
    version: "workspace"
    usage: "async runtime, spawn_blocking (existing)"
  - name: tracing
    version: "0.1"
    usage: "logging (existing)"
  - name: sqlx
    version: "0.8"
    usage: "SQLite (existing)"
  - name: thiserror
    version: "workspace"
    usage: "error types (existing)"
  - name: react-reader
    version: "existing"
    usage: "EPUB rendering (existing)"
  - name: "@radix-ui/react-popover"
