# ═══════════════════════════════════════════════════════════════════════════
# WIRING: New Has* traits, AppState fields, router routes
# ═══════════════════════════════════════════════════════════════════════════

wiring:
  new_has_traits:
    - name: HasChapterService
      file: crates/livrarr-handlers/src/context.rs
      method: "chapter_service() -> &Self::ChapterSvc"
      type_alias: "type ChapterSvc: ChapterService"

    - name: HasBookmarkService
      file: crates/livrarr-handlers/src/context.rs
      method: "bookmark_service() -> &Self::BookmarkSvc"
      type_alias: "type BookmarkSvc: BookmarkService"

  app_state_additions:
    - field: chapter_service
      type: "Arc<LiveChapterService>"
      note: "LiveChapterService wraps DB, implements ChapterService"

    - field: bookmark_service
      type: "Arc<LiveBookmarkService>"
      note: "LiveBookmarkService wraps DB, implements BookmarkService"

  new_routes:
    - method: GET
      path: "/api/v1/workfile/{id}/chapters"
      handler: "livrarr_handlers::chapter::get_chapters::<AppState>"

    - method: GET
      path: "/api/v1/workfile/{id}/bookmarks"
      handler: "livrarr_handlers::bookmark::list_bookmarks::<AppState>"

    - method: POST
      path: "/api/v1/workfile/{id}/bookmarks"
      handler: "livrarr_handlers::bookmark::create_bookmark::<AppState>"

    - method: PATCH
      path: "/api/v1/bookmarks/{id}"
      handler: "livrarr_handlers::bookmark::rename_bookmark::<AppState>"

    - method: DELETE
      path: "/api/v1/bookmarks/{id}"
      handler: "livrarr_handlers::bookmark::delete_bookmark::<AppState>"

  db_trait_additions:
    - trait: ChapterDb
      file: crates/livrarr-db/src/lib.rs
      methods: [get_chapters, replace_chapters, has_chapters, list_unscanned_audiobook_items, update_chapter_scan_result]
      note: "New trait. Add to D bounds on ImportWorkflowImpl."

    - trait: BookmarkDb
      file: crates/livrarr-db/src/lib.rs
      methods: [list_bookmarks, create_bookmark, rename_bookmark, delete_bookmark]
      note: "New trait."

    - trait: PlaybackProgressDb
      file: crates/livrarr-db/src/lib.rs
      methods: [get_progress_for_items, upsert_progress_no_lifecycle]
      note: "Add 2 methods to existing trait."

    - trait: LibraryItemDb
      note: "No new methods — update_chapter_scan_result is on ChapterDb to keep concerns separate."

  service_trait_additions:
    - trait: ChapterService
      file: crates/livrarr-domain/src/services/chapter.rs (NEW)
      methods: [get_chapters]

    - trait: BookmarkService
      file: crates/livrarr-domain/src/services/bookmark.rs (NEW)
      methods: [list_bookmarks, create_bookmark, rename_bookmark, delete_bookmark]

    - trait: FileService
      file: crates/livrarr-domain/src/services/file.rs
      new_methods: [get_progress_for_items]
      note: "Add to existing trait. Existing methods unchanged."

  import_workflow_db_bounds:
    note: "ImportWorkflowImpl<D> needs D: ChapterDb added to its where clauses for extract_and_store_chapters to compile"

  startup_additions:
    - description: "After AppState construction, spawn chapter backfill"
      code: "tokio::spawn(chapter_backfill::run_chapter_backfill(db.clone()))"
