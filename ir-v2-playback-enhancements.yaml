      - "duration_seconds fallback: library_item.duration_seconds ?? work.duration_seconds"

    capability_survey:
      - capability: "Work list handler"
        existing_source: "crates/livrarr-handlers/src/work.rs:347 — list handler"
        reuse_decision: wrap
        rationale: "Extend handler to fetch progress batch after getting works"
      - capability: "detail_from_view mapping"
        existing_source: "crates/livrarr-handlers/src/work.rs:54 — maps WorkDetailView to response"
        reuse_decision: wrap
        rationale: "Extend to accept progress data and populate LibraryItemResponse fields"
      - capability: "FileService.get_progress"
        existing_source: "crates/livrarr-domain/src/services/file.rs:70 — single item"
        reuse_decision: wrap
        rationale: "Add batch method get_progress_for_items to FileService trait"

    public_api:
      types:
        - kind: struct
          name: ItemProgress
          location: "crates/livrarr-domain/src/services/file.rs (NEW)"
          fields:
            - { name: library_item_id, type: LibraryItemId }
            - { name: progress_pct, type: f64 }
            - { name: finished_at, type: "Option<DateTime<Utc>>" }
          derives: "Debug"

      functions:
        - name: "FileService::get_progress_for_items"
          inputs:
            - { name: user_id, type: UserId }
            - { name: library_item_ids, type: "&[LibraryItemId]" }
          output: "Result<Vec<ItemProgress>, FileServiceError>"
          errors: [FileServiceError]
          description: "NEW method on FileService trait"

          pseudocode:
            - "Call self.db.get_progress_for_items(user_id, library_item_ids)"
            - "Map Vec<PlaybackProgress> to Vec<ItemProgress>:"
            - "  ItemProgress { library_item_id: pp.library_item_id, progress_pct: pp.progress_pct, finished_at: pp.finished_at }"
            - "Return"

          call_annotations:
            - { call: "self.db.get_progress_for_items(user_id, library_item_ids)", type: NEW, target: "PlaybackProgressDb::get_progress_for_items" }

          preconditions:
            data_invariants: []
            domain_state: []
            security: []
          postconditions: []
          invariants: []
          forbidden_behaviors: []
          decisions: []
          tdd_directives:
            - "Batch fetch returns correct progress for multiple items"

        - name: "FileService::update_progress (MODIFIED)"
          inputs:
            - { name: user_id, type: UserId }
            - { name: item_id, type: i64 }
            - { name: position, type: "&str" }
            - { name: progress_pct, type: f64 }
          output: "Result<(), FileServiceError>"
          errors: [FileServiceError]
          description: "MODIFIED — adds duration guard for audiobook finished_at lifecycle"

          pseudocode:
            - "let item = self.db.get_library_item(user_id, item_id).await? — ownership check + get media_type"
            - "let suppress_lifecycle = item.media_type == MediaType::Audiobook && {"
            - "  let d = item.duration_seconds;"
            - "  d.is_none() || !d.unwrap().is_finite() || d.unwrap() <= 0.0"
            - "};"
            - "if suppress_lifecycle:"
            - "  // Save position + progress but preserve finished_at unchanged"
            - "  self.db.upsert_progress_no_lifecycle(user_id, item_id, position, progress_pct).await?"
            - "else:"
            - "  // Normal path — lifecycle CASE runs in SQL"
            - "  self.db.upsert_progress(user_id, item_id, position, progress_pct).await?"
            - "Ok(())"

          call_annotations:
            - { call: "self.db.get_library_item(user_id, item_id)", type: EXISTING, target: "LibraryItemDb::get_library_item" }
            - { call: "self.db.upsert_progress(user_id, item_id, position, progress_pct)", type: EXISTING, target: "PlaybackProgressDb::upsert_progress (modified)" }
            - { call: "self.db.upsert_progress_no_lifecycle(...)", type: NEW, target: "PlaybackProgressDb::upsert_progress_no_lifecycle" }

          preconditions:
            data_invariants:
              - "progress_pct is in [0.0, 1.0]"
            domain_state: []
            security:
              - "user_id is the authenticated user"

          postconditions:
            - "Progress position and progress_pct are always saved (resume works)"
            - "finished_at lifecycle only triggers when audiobook has finite duration or media is ebook"

          invariants:
            - "Resume position is never lost — only lifecycle mutation is suppressed"

          forbidden_behaviors:
            - "Must not skip the upsert entirely — position must always be saved for resume"
            - "Must not set finished_at for audiobooks with non-finite duration"

          decisions:
            - key: "Two upsert variants instead of clamping"
              value: "upsert_progress (lifecycle CASE runs) vs upsert_progress_no_lifecycle (finished_at = COALESCE(playback_progress.finished_at, NULL))"
              rationale: "Clamping progress_pct was a hack — it prevented finished_at from being SET but still allowed it to be CLEARED when pct < 0.95. Two SQL variants cleanly separate: the no_lifecycle variant's ON CONFLICT preserves finished_at unchanged via 'finished_at = playback_progress.finished_at'. Position and progress_pct are saved accurately in both variants."
            - key: "Guard at service layer, not DB"
              value: "Service chooses which DB method to call"
              rationale: "DB doesn't know about audio.duration validity. Service has access to LibraryItem.duration_seconds. Clean separation."

          tdd_directives:
            - "Audiobook with finite duration at pct=0.99 → finished_at is set"
            - "Audiobook with NULL duration at pct=0.99 → progress saved, finished_at NOT set"
            - "Audiobook with non-finite duration at pct=0.99 → progress saved, finished_at NOT set"
            - "Ebook at pct=0.99 → finished_at is set (no duration guard for ebooks)"
            - "Audiobook with finite duration, backward seek pct=0.50 → finished_at cleared"
            - "Resume position always saved regardless of duration validity"

        - name: "work list handler enrichment"
          inputs: []
          output: "N/A"
          errors: []
          description: "WHERE to add progress enrichment in the work list handler"

          pseudocode:
            - "In handlers/work.rs::list, after getting PaginatedWorksView:"
            - "  // Collect all library item IDs across all works"
            - "  let all_item_ids: Vec<LibraryItemId> = view.works.iter()"
            - "    .flat_map(|w| w.library_items.iter().map(|li| li.id))"
            - "    .collect();"
            - "  // Batch fetch progress"
            - "  let progress_list = state.file_service().get_progress_for_items(ctx.user.id, &all_item_ids).await?"
            - "  let progress_map: HashMap<LibraryItemId, &ItemProgress> = progress_list.iter()"
            - "    .map(|p| (p.library_item_id, p))"
            - "    .collect();"
            - "  // Map works to responses with progress"
            - "  let items = view.works.into_iter().map(|wv| {"
            - "    let mut detail = work_to_detail_with_cover_mtime(&wv.work, wv.cover_mtime);"
            - "    detail.library_items = wv.library_items.iter().map(|li| {"
            - "      let prog = progress_map.get(&li.id);"
            - "      let duration_secs = li.duration_seconds.or(wv.work.duration_seconds);"
            - "      LibraryItemResponse {"
            - "        id: li.id,"
            - "        path: li.path.clone(),"
            - "        media_type: li.media_type,"
            - "        file_size: li.file_size,"
            - "        imported_at: li.imported_at.to_rfc3339(),"
            - "        progress_pct: prog.map(|p| p.progress_pct),"
            - "        duration_seconds: duration_secs,"
            - "        finished_at: prog.and_then(|p| p.finished_at.map(|d| d.to_rfc3339())),"
            - "      }"
            - "    }).collect();"
            - "    detail"
            - "  }).collect();"

          call_annotations:
            - { call: "state.file_service().get_progress_for_items(...)", type: NEW, target: "FileService::get_progress_for_items" }
            - { call: "work_to_detail_with_cover_mtime(...)", type: EXISTING, target: "work_to_detail_with_cover_mtime" }

