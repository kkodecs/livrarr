# ═══════════════════════════════════════════════════════════════════════════
# MODULES — Structural + Operational
# ═══════════════════════════════════════════════════════════════════════════

modules:

  # ═════════════════════════════════════════
  # 1. domain-types
  # ═════════════════════════════════════════
  - name: domain-types
    responsibility: "Define new domain types and extend existing ones for chapters, bookmarks, and progress lifecycle"
    dependencies: []
    crate: livrarr-domain
    file: crates/livrarr-domain/src/lib.rs

    module_invariants:
      - "AudiobookChapter.start_time_secs < AudiobookChapter.end_time_secs"
      - "AudiobookChapter.chapter_index is 0-based and unique per library_item_id"
      - "Bookmark.sort_key is progress_pct for ebook, seconds for audio"
      - "PlaybackProgress.finished_at is set only when progress_pct >= 0.98 and was previously NULL"
      - "PlaybackProgress.finished_at is cleared only when progress_pct < 0.95 and was previously non-NULL"
      - "LibraryItem.chapter_scan_status is one of: NULL, 'scanned', 'no_chapters', 'parse_error'"

    capability_survey:
      - capability: "PlaybackProgress struct"
        existing_source: "crates/livrarr-domain/src/lib.rs:460 — PlaybackProgress with 6 fields"
        reuse_decision: reuse
        rationale: "Extend with finished_at field. All existing consumers continue to work."
      - capability: "LibraryItem struct"
        existing_source: "crates/livrarr-domain/src/lib.rs:442 — LibraryItem with 11 fields"
        reuse_decision: reuse
        rationale: "Extend with duration_seconds and chapter_scan_status."
      - capability: "MediaType enum"
        existing_source: "crates/livrarr-domain/src/lib.rs — MediaType { Ebook, Audiobook }"
        reuse_decision: reuse
        rationale: "Used directly in Bookmark.media_type."
      - capability: "UserId, WorkId, LibraryItemId newtypes"
        existing_source: "crates/livrarr-domain/src/lib.rs — type aliases to i64"
        reuse_decision: reuse
        rationale: "Used in new struct fields."

    public_api:
      types:
        - kind: struct
          name: AudiobookChapter
          location: "crates/livrarr-domain/src/lib.rs (NEW)"
          fields:
            - { name: id, type: i64 }
            - { name: library_item_id, type: LibraryItemId }
            - { name: chapter_index, type: i32 }
            - { name: title, type: String }
            - { name: start_time_secs, type: f64 }
            - { name: end_time_secs, type: f64 }
          derives: "Debug, Clone, Serialize, Deserialize"

        - kind: struct
          name: Bookmark
          location: "crates/livrarr-domain/src/lib.rs (NEW)"
          fields:
            - { name: id, type: i64 }
            - { name: user_id, type: UserId }
            - { name: work_id, type: WorkId }
            - { name: library_item_id, type: LibraryItemId }
            - { name: media_type, type: MediaType }
            - { name: position, type: String }
            - { name: sort_key, type: f64 }
            - { name: name, type: String }
            - { name: chapter_title, type: "Option<String>" }
            - { name: paired_bookmark_id, type: "Option<i64>" }
            - { name: created_at, type: "DateTime<Utc>" }
          derives: "Debug, Clone, Serialize, Deserialize"

        - kind: struct
          name: PlaybackProgress
          location: "crates/livrarr-domain/src/lib.rs (MODIFIED — add finished_at)"
          note: "Add finished_at after updated_at"
          new_field:
            name: finished_at
            type: "Option<DateTime<Utc>>"

        - kind: struct
          name: LibraryItem
          location: "crates/livrarr-domain/src/lib.rs (MODIFIED — add 2 fields)"
          note: "Add after tag_status/tagged_at_generation"
          new_fields:
            - { name: duration_seconds, type: "Option<f64>" }
            - { name: chapter_scan_status, type: "Option<String>" }

      functions: []

  # ═════════════════════════════════════════
  # 2. db-chapters
  # ═════════════════════════════════════════
  - name: db-chapters
    responsibility: "SQLite persistence for audiobook chapters (CRUD, bulk replace on re-import)"
    dependencies: [domain-types]
    crate: livrarr-db
    trait_file: crates/livrarr-db/src/lib.rs
    impl_file: crates/livrarr-db/src/sqlite_chapters.rs (NEW)

    module_invariants:
      - "All chapter queries filter by library_item_id — never return chapters across items"
      - "replace_chapters is atomic (DELETE + INSERT in one transaction)"
      - "Chapters are always returned ordered by start_time_secs ASC"

    capability_survey:
      - capability: "SQLite trait+impl pattern"
        existing_source: "crates/livrarr-db/src/sqlite_playback_progress.rs — PlaybackProgressDb"
        reuse_decision: reuse
        rationale: "Follow identical pattern: trait in lib.rs, impl in sqlite_chapters.rs"
      - capability: "row mapping helper"
        existing_source: "row_to_progress pattern in sqlite_playback_progress.rs"
        reuse_decision: reuse
        rationale: "Write row_to_chapter using same try_get pattern"

    public_api:
      types: []
      functions:
        - name: get_chapters
          inputs:
            - { name: library_item_id, type: LibraryItemId }
          output: "Result<Vec<AudiobookChapter>, DbError>"
          errors: [DbError]
          description: "Get all chapters for a library item, ordered by start_time_secs ASC"

          pseudocode:
            - "SELECT id, library_item_id, chapter_index, title, start_time_secs, end_time_secs FROM audiobook_chapters WHERE library_item_id = ? ORDER BY start_time_secs ASC"
            - "Map each row to AudiobookChapter via row_to_chapter helper"
            - "Return Vec"

          call_annotations:
            - { call: "sqlx::query(...).bind(...).fetch_all(self.pool())", type: LIBRARY, target: "sqlx::query" }
            - { call: "row_to_chapter(row)", type: NEW, target: "row_to_chapter" }

          preconditions:
            data_invariants: []
            domain_state: []
            security: []

          postconditions:
            - "Returned Vec is ordered by start_time_secs ASC"
            - "All returned chapters belong to the given library_item_id"

          invariants: []
          forbidden_behaviors:
            - "Must not return chapters from other library items"

          decisions:
            - key: "No user_id filter"
              value: "Chapters are per-item metadata, not per-user data"
              rationale: "Any user with access to the library item can see its chapters. Access control is at the service layer (service verifies user owns the item)."

          tdd_directives:
            - "Insert 3 chapters for item A, 2 for item B. get_chapters(A) returns exactly 3, sorted by start_time."
            - "get_chapters for non-existent item returns empty Vec, not error"

        - name: replace_chapters
          inputs:
            - { name: library_item_id, type: LibraryItemId }
            - { name: chapters, type: "&[AudiobookChapter]" }
          output: "Result<(), DbError>"
          errors: [DbError]
          description: "Delete existing chapters for item and insert new ones (atomic transaction)"

          pseudocode:
            - "Begin transaction"
            - "DELETE FROM audiobook_chapters WHERE library_item_id = ?"
            - "For each chapter in chapters:"
            - "  INSERT INTO audiobook_chapters (library_item_id, chapter_index, title, start_time_secs, end_time_secs) VALUES (?, ?, ?, ?, ?)"
            - "  Use chapter.chapter_index, chapter.title, chapter.start_time_secs, chapter.end_time_secs"
            - "  Ignore chapter.id (auto-generated, pass 0 per insert convention)"
            - "Commit transaction"

          call_annotations:
            - { call: "self.pool().begin()", type: LIBRARY, target: "sqlx::Pool::begin" }
            - { call: "sqlx::query(DELETE).bind(...).execute(&mut *tx)", type: LIBRARY, target: "sqlx::query" }
            - { call: "sqlx::query(INSERT).bind(...).execute(&mut *tx)", type: LIBRARY, target: "sqlx::query" }
            - { call: "tx.commit()", type: LIBRARY, target: "sqlx::Transaction::commit" }

          preconditions:
            data_invariants:
              - "chapters are sorted by start_time_secs ASC"
              - "chapter_index values are 0-based contiguous"
            domain_state: []
            security: []

          postconditions:
            - "Previous chapters for this item are gone"
            - "New chapters are stored with generated IDs"
            - "Existing bookmarks for this item are unaffected (REQ-010)"

          invariants:
            - "Operation is atomic — either all chapters replaced or none"

          forbidden_behaviors:
            - "Must not use INSERT OR REPLACE (Insight 20)"
            - "Must not affect bookmarks table"

          decisions:
            - key: "DELETE + INSERT vs UPSERT"
              value: "DELETE all + INSERT fresh"
              rationale: "On re-import, chapter data may change completely (different count, different titles). Bulk replace is simpler than diffing. Bookmarks survive because they reference the library_item, not individual chapters."

          tdd_directives:
            - "Insert 3 chapters, then replace_chapters with 2 different ones. get_chapters returns exactly 2 new ones."
            - "replace_chapters with empty slice results in zero chapters for item"
            - "Bookmarks on the same library_item survive replace_chapters"

        - name: has_chapters
          inputs:
            - { name: library_item_id, type: LibraryItemId }
          output: "Result<bool, DbError>"
          errors: [DbError]
          description: "Check if chapters exist for a library item (used by backfill)"

          pseudocode:
            - "SELECT EXISTS(SELECT 1 FROM audiobook_chapters WHERE library_item_id = ?) as has"
            - "Return row.has == 1"

          call_annotations:
            - { call: "sqlx::query(...).bind(...).fetch_one(self.pool())", type: LIBRARY, target: "sqlx::query" }

          preconditions:
            data_invariants: []
            domain_state: []
            security: []

          postconditions:
            - "Returns true iff at least one chapter row exists"

          invariants: []
          forbidden_behaviors: []
          decisions: []

          tdd_directives:
            - "has_chapters returns false for item with no chapters"
            - "has_chapters returns true after replace_chapters with non-empty list"

        - name: list_unscanned_audiobook_items
          inputs: []
          output: "Result<Vec<(LibraryItemId, String)>, DbError>"
          errors: [DbError]
          description: "List library items where chapter_scan_status IS NULL AND media_type = 'audiobook'. Returns (id, path) tuples."

          pseudocode:
            - "SELECT id, path FROM library_items WHERE chapter_scan_status IS NULL AND media_type = 'audiobook'"
            - "Map each row to (id, path) tuple"
            - "Return Vec"

          call_annotations:
            - { call: "sqlx::query(...).fetch_all(self.pool())", type: LIBRARY, target: "sqlx::query" }

          preconditions:
            data_invariants: []
            domain_state: []
            security: []

          postconditions:
            - "Only returns audiobook items with NULL chapter_scan_status"
            - "Caller filters by file extension (.m4b/.m4a) before mp4ameta parsing"

          invariants: []
          forbidden_behaviors:
            - "Must not return ebook items"
            - "Must not return items with non-NULL chapter_scan_status"

          decisions:
            - key: "No extension filter in SQL"
              value: "Caller filters by extension"
              rationale: "SQL LIKE on path suffix is fragile. The backfill job filters programmatically after querying."

          tdd_directives:
            - "Create ebook item (NULL scan_status) and audiobook item (NULL scan_status). Returns only the audiobook."
            - "Audiobook with scan_status = 'scanned' is excluded"

        - name: update_chapter_scan_result
          inputs:
            - { name: library_item_id, type: LibraryItemId }
            - { name: chapter_scan_status, type: "&str" }
            - { name: duration_seconds, type: "Option<f64>" }
          output: "Result<(), DbError>"
          errors: [DbError]
          description: "Update chapter_scan_status and optionally duration_seconds on a library_items row"

          pseudocode:
            - "UPDATE library_items SET chapter_scan_status = ?, duration_seconds = COALESCE(?, duration_seconds) WHERE id = ?"
            - "COALESCE preserves existing duration if new value is None"

          call_annotations:
            - { call: "sqlx::query(...).bind(...).execute(self.pool())", type: LIBRARY, target: "sqlx::query" }

          preconditions:
            data_invariants:
              - "chapter_scan_status is one of: 'scanned', 'no_chapters', 'parse_error'"
            domain_state: []
            security: []

          postconditions:
            - "library_items row has updated chapter_scan_status"
            - "duration_seconds is set if provided, preserved if None"

          invariants: []
          forbidden_behaviors:
            - "Must not clear an existing duration_seconds when called with None"

          decisions:
            - key: "COALESCE for duration"
              value: "Only overwrite if new value provided"
              rationale: "duration_seconds may have been set by a previous enrichment. Chapter extraction provides it as a bonus but shouldn't overwrite a better source."

          tdd_directives:
            - "Set scan_status and duration. Verify both persisted."
            - "Set scan_status with None duration. Verify existing duration preserved."

  # ═════════════════════════════════════════
  # 3. db-bookmarks
  # ═════════════════════════════════════════
  - name: db-bookmarks
    responsibility: "SQLite persistence for bookmarks (CRUD, user-scoped, sorted by position)"
    dependencies: [domain-types]
    crate: livrarr-db
    trait_file: crates/livrarr-db/src/lib.rs
    impl_file: crates/livrarr-db/src/sqlite_bookmarks.rs (NEW)

    module_invariants:
      - "All bookmark queries include user_id in WHERE clause (IDOR prevention)"
      - "Bookmarks are always returned ordered by sort_key ASC"
      - "Deleting a bookmark with paired_bookmark_id triggers ON DELETE SET NULL on the partner"

    capability_survey:
      - capability: "User-scoped CRUD pattern"
        existing_source: "crates/livrarr-db/src/sqlite_playback_progress.rs — user_id in all queries"
        reuse_decision: reuse
        rationale: "Same pattern: every query includes user_id"
      - capability: "ON DELETE SET NULL for self-referencing FK"
        existing_source: "none — first self-referencing FK in codebase"
        reuse_decision: rewrite
        rationale: "New pattern but handled by SQLite FK engine, no application code needed"

    public_api:
      types: []
      functions:
        - name: list_bookmarks
          inputs:
            - { name: user_id, type: UserId }
            - { name: library_item_id, type: LibraryItemId }
          output: "Result<Vec<Bookmark>, DbError>"
          errors: [DbError]

          pseudocode:
            - "SELECT id, user_id, work_id, library_item_id, media_type, position, sort_key, name, chapter_title, paired_bookmark_id, created_at FROM bookmarks WHERE user_id = ? AND library_item_id = ? ORDER BY sort_key ASC"
            - "Map each row to Bookmark via row_to_bookmark helper"
            - "Return Vec"

          call_annotations:
            - { call: "sqlx::query(...).bind(...).fetch_all(self.pool())", type: LIBRARY, target: "sqlx::query" }
            - { call: "row_to_bookmark(row)", type: NEW, target: "row_to_bookmark" }

          preconditions:
            data_invariants: []
            domain_state: []
            security:
              - "user_id must be the authenticated user"

          postconditions:
            - "Only bookmarks owned by user_id are returned"
            - "Sorted by sort_key ASC"

          invariants: []
          forbidden_behaviors:
            - "Must never omit user_id from WHERE"

          decisions: []

          tdd_directives:
            - "Create bookmarks for user A and user B on same item. list_bookmarks(A) returns only A's."
            - "Bookmarks returned in sort_key order"

        - name: create_bookmark
          inputs:
            - { name: bookmark, type: "&Bookmark" }
          output: "Result<Bookmark, DbError>"
          errors: [DbError]

          pseudocode:
            - "INSERT INTO bookmarks (user_id, work_id, library_item_id, media_type, position, sort_key, name, chapter_title, paired_bookmark_id, created_at) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)"
            - "Use bookmark fields. media_type as string via media_type_str() (local helper, same as sqlite_library_item.rs pattern). created_at via Utc::now ISO format."
            - "Get last_insert_rowid()"
            - "Fetch the inserted row with user-scoped SELECT: SELECT ... FROM bookmarks WHERE id = ? AND user_id = ?"
            - "Return the fetched Bookmark"

          call_annotations:
            - { call: "sqlx::query(INSERT).bind(...).execute(self.pool())", type: LIBRARY, target: "sqlx::query" }
            - { call: "media_type_str(bookmark.media_type)", type: NEW, target: "media_type_str (local fn in sqlite_bookmarks.rs, same pattern as sqlite_library_item.rs)" }
            - { call: "Utc::now()", type: LIBRARY, target: "chrono::Utc::now" }

          preconditions:
            data_invariants:
              - "bookmark.id is 0 (insert convention)"
            domain_state: []
            security: []

          postconditions:
