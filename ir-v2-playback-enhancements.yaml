shared_types:
  - kind: struct
    name: ChapterResponse
    serde: "rename_all = camelCase"
    fields:
      - { name: id, type: i64 }
      - { name: chapter_index, type: i32 }
      - { name: title, type: String }
      - { name: start_time_secs, type: f64 }
      - { name: end_time_secs, type: f64 }

  - kind: struct
    name: BookmarkResponse
    serde: "rename_all = camelCase"
    fields:
      - { name: id, type: i64 }
      - { name: library_item_id, type: i64 }
      - { name: media_type, type: String }
      - { name: position, type: String }
      - { name: sort_key, type: f64 }
      - { name: name, type: String }
      - { name: chapter_title, type: "Option<String>" }
      - { name: paired_bookmark_id, type: "Option<i64>" }
      - { name: created_at, type: String }

  - kind: struct
    name: LibraryItemResponse
    note: "MODIFIED — 3 new fields. Wire format uses camelCase."
    serde: "rename_all = camelCase"
    fields:
      - { name: id, type: LibraryItemId }
      - { name: path, type: String }
      - { name: media_type, type: MediaType }
      - { name: file_size, type: i64 }
      - { name: imported_at, type: String }
      - { name: progress_pct, type: "Option<f64>", description: "NEW — 0.0–1.0, null when no progress" }
      - { name: duration_seconds, type: "Option<f64>", description: "NEW — file-parsed ?? work-level fallback" }
      - { name: finished_at, type: "Option<String>", description: "NEW — ISO 8601 when pct >= 0.98" }

dependency_graph:
  - { source: livrarr-handlers, target: livrarr-domain }
  - { source: livrarr-library, target: livrarr-domain }
  - { source: livrarr-library, target: livrarr-db }
  - { source: livrarr-library, target: livrarr-tagwrite }    # NEW
  - { source: livrarr-db, target: livrarr-domain }
  - { source: livrarr-tagwrite, target: livrarr-domain }
  - { source: livrarr-server, target: livrarr-domain }
  - { source: livrarr-server, target: livrarr-db }
  - { source: livrarr-server, target: livrarr-library }
  - { source: livrarr-server, target: livrarr-handlers }
  - { source: livrarr-server, target: livrarr-tagwrite }

migrations:
  - number: "048"
    name: add_audiobook_chapters
    sql: |
      CREATE TABLE audiobook_chapters (
        id INTEGER PRIMARY KEY,
        library_item_id INTEGER NOT NULL REFERENCES library_items(id) ON DELETE CASCADE,
        chapter_index INTEGER NOT NULL,
        title TEXT NOT NULL,
        start_time_secs REAL NOT NULL,
        end_time_secs REAL NOT NULL,
        UNIQUE(library_item_id, chapter_index)
      );
      CREATE INDEX idx_chapters_item ON audiobook_chapters(library_item_id);

  - number: "049"
    name: add_bookmarks
    sql: |
      CREATE TABLE bookmarks (
        id INTEGER PRIMARY KEY,
        user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        work_id INTEGER NOT NULL REFERENCES works(id) ON DELETE CASCADE,
        library_item_id INTEGER NOT NULL REFERENCES library_items(id) ON DELETE CASCADE,
        media_type TEXT NOT NULL,
        position TEXT NOT NULL,
        sort_key REAL NOT NULL,
        name TEXT NOT NULL,
        chapter_title TEXT,
        paired_bookmark_id INTEGER REFERENCES bookmarks(id) ON DELETE SET NULL,
        created_at TEXT NOT NULL DEFAULT (strftime('%Y-%m-%dT%H:%M:%SZ', 'now'))
      );
      CREATE INDEX idx_bookmarks_user_item ON bookmarks(user_id, library_item_id);
      CREATE INDEX idx_bookmarks_paired ON bookmarks(paired_bookmark_id);

  - number: "050"
    name: add_progress_finished_at_and_item_duration
    sql: |
      ALTER TABLE playback_progress ADD COLUMN finished_at TEXT;
      ALTER TABLE library_items ADD COLUMN duration_seconds REAL;
      ALTER TABLE library_items ADD COLUMN chapter_scan_status TEXT;

