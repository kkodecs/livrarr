  # ═════════════════════════════════════════
  # 4. db-progress-extended
  # ═════════════════════════════════════════
  - name: db-progress-extended
    responsibility: "Extend PlaybackProgressDb with finished_at lifecycle and batch fetch"
    dependencies: [domain-types]
    crate: livrarr-db
    impl_file: crates/livrarr-db/src/sqlite_playback_progress.rs (MODIFIED)

    module_invariants:
      - "finished_at transitions are one-way per update: NULL→timestamp (pct≥0.98), timestamp→NULL (pct<0.95)"
      - "finished_at is never overwritten with a new timestamp (only set when NULL)"
      - "Audiobook duration guard: skip lifecycle when duration_seconds is NULL or non-finite"

    capability_survey:
      - capability: "upsert_progress"
        existing_source: "crates/livrarr-db/src/sqlite_playback_progress.rs:53 — simple INSERT ON CONFLICT DO UPDATE"
        reuse_decision: wrap
        rationale: "Extend the existing SQL with finished_at CASE expression. Modify in place."
      - capability: "get_progress"
        existing_source: "crates/livrarr-db/src/sqlite_playback_progress.rs:31 — single item fetch"
        reuse_decision: reuse
        rationale: "Extend SELECT to include finished_at column. Modify row_to_progress."
      - capability: "row_to_progress"
        existing_source: "crates/livrarr-db/src/sqlite_playback_progress.rs:6"
        reuse_decision: wrap
        rationale: "Add finished_at field extraction"

    public_api:
      types: []
      functions:
        - name: upsert_progress
          inputs:
            - { name: user_id, type: UserId }
            - { name: library_item_id, type: LibraryItemId }
            - { name: position, type: "&str" }
            - { name: progress_pct, type: f64 }
          output: "Result<(), DbError>"
          errors: [DbError]
          description: "MODIFIED — now manages finished_at hysteresis in SQL"

          pseudocode:
            - "let now = Utc::now() formatted as ISO 8601"
            - "Compute initial_finished_at in Rust before SQL:"
            - "  let initial_finished_at: Option<&str> = if progress_pct >= 0.98 { Some(&now) } else { None };"
            - "Execute SQL:"
            - "  INSERT INTO playback_progress (user_id, library_item_id, position, progress_pct, updated_at, finished_at)"
            - "  VALUES (?, ?, ?, ?, ?, ?)"
            - "  ON CONFLICT(user_id, library_item_id) DO UPDATE SET"
            - "    position = excluded.position,"
            - "    progress_pct = excluded.progress_pct,"
            - "    updated_at = excluded.updated_at,"
            - "    finished_at = CASE"
            - "      WHEN excluded.progress_pct >= 0.98 AND playback_progress.finished_at IS NULL THEN excluded.updated_at"
            - "      WHEN excluded.progress_pct < 0.95 AND playback_progress.finished_at IS NOT NULL THEN NULL"
            - "      ELSE playback_progress.finished_at"
            - "    END"
            - "Bind params: user_id, library_item_id, position, progress_pct, now, initial_finished_at"
            - "Note: initial_finished_at handles the INSERT branch. The ON CONFLICT CASE handles updates using excluded.* pseudo-table (references the attempted INSERT values)."

          call_annotations:
            - { call: "Utc::now()", type: LIBRARY, target: "chrono::Utc::now" }
            - { call: "sqlx::query(...).bind(...).execute(self.pool())", type: LIBRARY, target: "sqlx::query" }

          preconditions:
            data_invariants:
              - "progress_pct is in [0.0, 1.0]"
            domain_state: []
            security: []

          postconditions:
            - "Progress row exists for (user_id, library_item_id)"
            - "finished_at is set if pct >= 0.98 and was previously NULL"
            - "finished_at is cleared if pct < 0.95 and was previously non-NULL"
            - "finished_at is unchanged in the dead zone [0.95, 0.98)"

          invariants:
            - "finished_at timestamp, once set, is never overwritten with a different timestamp — only cleared to NULL"

          forbidden_behaviors:
            - "Must not overwrite existing finished_at with a new timestamp (transition-only)"
            - "Must not use INSERT OR REPLACE"

          decisions:
            - key: "Hysteresis in SQL, not application code"
              value: "CASE expression in ON CONFLICT DO UPDATE"
              rationale: "Single atomic SQL statement. No read-then-write race. The DB handles the state machine in one round trip."
            - key: "Duration guard at service layer"
              value: "DB executes CASE unconditionally"
              rationale: "The DB doesn't know about audio.duration or isFinite. The service layer (update_progress in FileService) checks duration validity before calling upsert_progress. For ebooks, progress_pct comes from epub.js and is always valid."

          tdd_directives:
            - "Upsert with pct=0.99. Verify finished_at is set."
            - "Upsert with pct=0.50 on row with finished_at set. Verify finished_at cleared."
            - "Upsert with pct=0.96 on row with finished_at set. Verify finished_at preserved (dead zone)."
            - "Upsert with pct=0.99 on row with finished_at already set. Verify original finished_at preserved, not overwritten."
            - "Fresh insert with pct=0.99. Verify finished_at is set (INSERT branch)."
            - "Fresh insert with pct=0.50. Verify finished_at is NULL."

        - name: upsert_progress_no_lifecycle
          inputs:
            - { name: user_id, type: UserId }
            - { name: library_item_id, type: LibraryItemId }
            - { name: position, type: "&str" }
            - { name: progress_pct, type: f64 }
          output: "Result<(), DbError>"
          errors: [DbError]
          description: "NEW — saves position/progress without touching finished_at. Used for audiobooks with non-finite duration."

          pseudocode:
            - "let now = Utc::now() formatted as ISO 8601"
            - "Execute SQL:"
            - "  INSERT INTO playback_progress (user_id, library_item_id, position, progress_pct, updated_at, finished_at)"
            - "  VALUES (?, ?, ?, ?, ?, NULL)"
            - "  ON CONFLICT(user_id, library_item_id) DO UPDATE SET"
            - "    position = excluded.position,"
            - "    progress_pct = excluded.progress_pct,"
            - "    updated_at = excluded.updated_at"
            - "    -- finished_at deliberately omitted from SET — preserves existing value"
            - "Bind params: user_id, library_item_id, position, progress_pct, now"

          call_annotations:
            - { call: "Utc::now()", type: LIBRARY, target: "chrono::Utc::now" }
            - { call: "sqlx::query(...).bind(...).execute(self.pool())", type: LIBRARY, target: "sqlx::query" }

          preconditions:
            data_invariants:
              - "progress_pct is in [0.0, 1.0]"
            domain_state: []
            security: []

          postconditions:
            - "Position and progress_pct are saved"
            - "finished_at is unchanged (preserved from existing row, or NULL on fresh insert)"

          invariants:
            - "finished_at is never modified by this method"

          forbidden_behaviors:
            - "Must not modify finished_at"

          decisions:
            - key: "Separate method vs parameter flag"
              value: "Separate SQL method"
              rationale: "Cleaner than a bool parameter that changes SQL semantics. Two small SQL strings, each obviously correct."

          tdd_directives:
            - "Upsert_no_lifecycle with pct=0.99 on fresh row. Verify finished_at is NULL."
            - "Upsert_no_lifecycle with pct=0.99 on row with existing finished_at. Verify finished_at preserved."
            - "Upsert_no_lifecycle with pct=0.50 on row with existing finished_at. Verify finished_at preserved (not cleared)."

        - name: get_progress
          inputs:
            - { name: user_id, type: UserId }
            - { name: library_item_id, type: LibraryItemId }
          output: "Result<Option<PlaybackProgress>, DbError>"
          errors: [DbError]
          description: "MODIFIED — now includes finished_at in SELECT and row mapping"

          pseudocode:
            - "SELECT id, user_id, library_item_id, position, progress_pct, updated_at, finished_at FROM playback_progress WHERE user_id = ? AND library_item_id = ?"
            - "Map via row_to_progress (MODIFIED to include finished_at)"
            - "finished_at: parse optional DateTime from TEXT column (NULL → None)"

          call_annotations:
            - { call: "sqlx::query(...).bind(...).fetch_optional(self.pool())", type: LIBRARY, target: "sqlx::query" }
            - { call: "row_to_progress(row)", type: EXISTING, target: "row_to_progress (modified)" }
            - { call: "parse_dt_opt for finished_at", type: EXISTING, target: "parse_dt helper pattern" }

          preconditions:
            data_invariants: []
            domain_state: []
            security: []

          postconditions:
            - "PlaybackProgress.finished_at correctly reflects DB state"

          invariants: []
          forbidden_behaviors: []
          decisions: []

          tdd_directives:
            - "get_progress returns finished_at when set"
            - "get_progress returns None finished_at when not set"

        - name: get_progress_for_items
          inputs:
            - { name: user_id, type: UserId }
            - { name: library_item_ids, type: "&[LibraryItemId]" }
          output: "Result<Vec<PlaybackProgress>, DbError>"
          errors: [DbError]
          description: "NEW — batch fetch progress for multiple items"

          pseudocode:
            - "If library_item_ids is empty, return Ok(vec![])"
            - "Build SQL with IN clause using positional params:"
            - "  SELECT id, user_id, library_item_id, position, progress_pct, updated_at, finished_at"
            - "  FROM playback_progress"
            - "  WHERE user_id = ? AND library_item_id IN (?, ?, ...)"
            - "  Build param string dynamically: repeat '?' for each ID, join with ','"
            - "Bind user_id, then bind each library_item_id"
            - "Map rows via row_to_progress"
            - "Return Vec (may be shorter than input if some items have no progress)"

          call_annotations:
            - { call: "sqlx::query(...).bind(...).fetch_all(self.pool())", type: LIBRARY, target: "sqlx::query" }
            - { call: "row_to_progress(row)", type: EXISTING, target: "row_to_progress" }

          preconditions:
            data_invariants: []
            domain_state: []
            security: []

          postconditions:
            - "Only returns progress for the given user_id"
            - "Result Vec length <= input length"

          invariants: []
          forbidden_behaviors:
            - "Must not return progress for other users"

          decisions:
            - key: "Dynamic IN clause"
              value: "Build SQL string with ? placeholders"
              rationale: "sqlx doesn't support binding Vec to IN clause directly. Build the param string programmatically. This is safe — we're generating '?' placeholders, not interpolating values."

          tdd_directives:
            - "Create progress for items A, B, C. Fetch for [A, B]. Returns 2 rows."
            - "Fetch for empty slice returns empty Vec"
            - "Fetch for items with no progress returns empty Vec"
            - "User A cannot see user B's progress via batch fetch"

  # ═════════════════════════════════════════
  # 5. chapter-extraction
  # ═════════════════════════════════════════
  - name: chapter-extraction
    responsibility: "Parse M4B files for chapter metadata using mp4ameta"
    dependencies: []
    crate: livrarr-tagwrite
    file: crates/livrarr-tagwrite/src/lib.rs (add to existing file)

    module_invariants:
      - "Function is purely read-only — never modifies the M4B file"
      - "Chapters are returned sorted by start_time_secs ASC"
      - "Non-monotonic or out-of-range chapters are discarded with warning"

    capability_survey:
      - capability: "mp4ameta Tag reading"
        existing_source: "crates/livrarr-tagwrite/src/lib.rs:1027 — write_m4b uses Tag::read_from_path"
        reuse_decision: reuse
        rationale: "Same crate, same library. Chapter extraction uses Tag with ReadConfig."
      - capability: "mp4ameta chapter API"
        existing_source: "mp4ameta 0.13 docs — Tag::chapter_list() and Tag::chapter_track()"
        reuse_decision: reuse
        rationale: "Confirmed in architecture review. ReadConfig enables chapter reading."

    public_api:
      types:
        - kind: struct
          name: ExtractedChapter
          fields:
            - { name: title, type: String }
            - { name: start_time_secs, type: f64 }
          derives: "Debug, Clone"

        - kind: struct
          name: ChapterExtractionResult
          fields:
            - { name: chapters, type: "Vec<ExtractedChapter>" }
            - { name: duration_secs, type: "Option<f64>" }
          derives: "Debug"

        - kind: enum
          name: ChapterExtractionError
          derives: "Debug, thiserror::Error"
          variants:
            - { name: IoError, description: "File not found or read error (transient)" }
            - { name: ParseError, description: "Corrupt MP4 container (terminal)" }

      functions:
        - name: extract_m4b_chapters
          inputs:
            - { name: path, type: "&Path" }
          output: "Result<ChapterExtractionResult, ChapterExtractionError>"
          errors: [ChapterExtractionError]

          pseudocode:
            - "Build ReadConfig via struct literal:"
            - "  let cfg = ReadConfig { read_chapter_track: true, read_chapter_list: true, read_image_data: false, ..ReadConfig::DEFAULT }"
            - "Call Tag::read_with_path(path, &cfg)"
            - "  On io::ErrorKind::NotFound or PermissionDenied: return ChapterExtractionError::IoError"
            - "  On other mp4ameta errors: return ChapterExtractionError::ParseError"
            - "Get duration from tag.duration() → Duration → .as_secs_f64() → Some(f64)"
            - "  (Tag::duration() always returns Duration regardless of read_audio_info)"
            - "Try chapter_track() first (QuickTime, higher precedence):"
            - "  let track = tag.chapter_track(); // returns &[Chapter]"
            - "  if !track.is_empty(): iterate, each has .start (Duration) and .title (String)"
            - "  Map each to ExtractedChapter { title: ch.title.clone(), start_time_secs: ch.start.as_secs_f64() }"
            - "If chapter_track() was empty, try chapter_list() (Nero):"
            - "  let list = tag.chapter_list(); // returns &[Chapter]"
            - "  if !list.is_empty(): iterate, same .start/.title fields"
            - "  Map to ExtractedChapter the same way"
            - "NOTE: Both APIs return &[Chapter] (slices), not Option. Confirmed by compiler."
            - "Collect into Vec<ExtractedChapter>"
            - "Sort by start_time_secs ASC"
            - "Validate monotonicity: for each chapter, if start_time < previous end or start_time > duration:"
            - "  tracing::warn!(\"discarding non-monotonic chapter\")"
            - "  Remove from Vec"
            - "Return ChapterExtractionResult { chapters, duration_secs }"

          call_annotations:
            - { call: "ReadConfig { ..ReadConfig::DEFAULT }", type: LIBRARY, target: "mp4ameta::ReadConfig struct literal" }
            - { call: "Tag::read_with_path(path, &cfg)", type: LIBRARY, target: "mp4ameta::Tag::read_with_path" }
            - { call: "tag.duration()", type: LIBRARY, target: "mp4ameta::Tag::duration" }
            - { call: "tag.chapter_track()", type: LIBRARY, target: "mp4ameta::Tag::chapter_track" }
            - { call: "tag.chapter_list()", type: LIBRARY, target: "mp4ameta::Tag::chapter_list" }
            - { call: "tracing::warn!(...)", type: LIBRARY, target: "tracing::warn" }

          preconditions:
            data_invariants:
              - "path points to a file (existence checked by caller)"
            domain_state: []
            security: []

          postconditions:
            - "Returned chapters are sorted by start_time_secs ASC"
            - "All start_time_secs values are non-negative and monotonically increasing"
            - "The file is not modified"

          invariants:
            - "This function is pure file-read — no side effects on the filesystem"

          forbidden_behaviors:
            - "Must not write to the file"
            - "Must not read image data (performance — set read_image_data = false)"

          decisions:
            - key: "QuickTime > Nero precedence"
              value: "Try chapter_track first, fall back to chapter_list"
              rationale: "ST-001: QuickTime chapter tracks have richer metadata. When both exist, QuickTime takes precedence."
            - key: "read_image_data = false"
              value: "Skip artwork for chapter extraction"
              rationale: "Confirmed in architecture review. Chapter extraction doesn't need cover art. Saves I/O."
            - key: "IoError vs ParseError distinction"
              value: "IoError is transient (retry), ParseError is terminal (don't retry)"
              rationale: "File missing/permission = might fix itself. Corrupt container = will never fix itself."

          tdd_directives:
            - "Test with M4B containing Nero chapters — returns chapters sorted by time"
            - "Test with M4B containing no chapters — returns empty chapters Vec with duration"
            - "Test with non-existent path — returns IoError"
            - "Test with corrupt file — returns ParseError"
            - "Test that non-monotonic chapters are filtered out"

  # ═════════════════════════════════════════
  # 6. import-chapter-hook
  # ═════════════════════════════════════════
  - name: import-chapter-hook
    responsibility: "Hook chapter extraction into the import pipeline for M4B files"
    dependencies: [chapter-extraction, db-chapters]
    crate: livrarr-library
    file: crates/livrarr-library/src/import_workflow.rs (add function, call from import_grab)

    module_invariants:
      - "Only called for M4B/M4A files (caller checks extension)"
      - "IoError propagates (transient — scan_status stays NULL for retry)"
      - "ParseError is terminal — scan_status set to 'parse_error'"

    capability_survey:
      - capability: "import_grab workflow"
        existing_source: "crates/livrarr-library/src/import_workflow.rs:252 — import_grab (442 lines)"
        reuse_decision: wrap
        rationale: "Add chapter extraction call after create_library_item succeeds. Non-blocking — failure doesn't fail the import."
      - capability: "extract_m4b_chapters"
        existing_source: "NEW — crates/livrarr-tagwrite/src/lib.rs"
        reuse_decision: reuse
        rationale: "Call from import hook"
      - capability: "spawn_blocking for file I/O"
        existing_source: "import_grab already uses spawn_blocking for file existence checks"
        reuse_decision: reuse
        rationale: "Chapter extraction is blocking file I/O — must use spawn_blocking"

    public_api:
      types:
        - kind: enum
          name: ChapterScanOutcome
          derives: "Debug"
          variants:
            - { name: Scanned, description: "Chapters extracted and stored" }
            - { name: NoChapters, description: "Valid M4B, no chapters found" }
            - { name: ParseError, description: "Corrupt file, terminal" }

      functions:
        - name: extract_and_store_chapters
          inputs:
            - { name: library_item_id, type: LibraryItemId }
            - { name: path, type: "&Path" }
            - { name: db, type: "&D" }
          output: "Result<ChapterScanOutcome, anyhow::Error>"
          errors: []
          description: "Called after M4B file import. Extracts chapters, stores in DB, sets scan_status. Returns outcome for caller logging."

          pseudocode:
            - "let path_owned = path.to_path_buf()"
            - "let result = tokio::task::spawn_blocking(move || extract_m4b_chapters(&path_owned)).await?"
            - "Match result:"
            - "  Ok(extraction_result):"
            - "    if extraction_result.chapters.is_empty():"
            - "      db.update_chapter_scan_result(library_item_id, 'no_chapters', extraction_result.duration_secs).await?"
            - "      return Ok(ChapterScanOutcome::NoChapters)"
            - "    else:"
            - "      let mut chapters = Vec::new();"
            - "      let extracted = &extraction_result.chapters;"
            - "      for (i, ch) in extracted.iter().enumerate() {"
            - "        let title = if ch.title.is_empty() { format!('Chapter {}', i + 1) } else { ch.title.clone() };"
            - "        let end_time = if i + 1 < extracted.len() {"
            - "          extracted[i + 1].start_time_secs"
            - "        } else {"
            - "          match extraction_result.duration_secs {"
            - "            Some(d) if d > ch.start_time_secs => d,"
            - "            _ => {"
            - "              tracing::warn!(library_item_id, 'last chapter has no valid end time — dropping');"
            - "              continue;"
            - "            }"
            - "          }"
            - "        };"
            - "        chapters.push(AudiobookChapter {"
            - "          id: 0, library_item_id, chapter_index: i as i32,"
            - "          title, start_time_secs: ch.start_time_secs, end_time_secs: end_time"
            - "        });"
            - "      }"
            - "      // After filtering, if all chapters were dropped, treat as no_chapters"
            - "      if chapters.is_empty() {"
            - "        db.update_chapter_scan_result(library_item_id, 'no_chapters', extraction_result.duration_secs).await?"
            - "        return Ok(ChapterScanOutcome::NoChapters)"
            - "      }"
            - "      db.replace_chapters(library_item_id, &chapters).await?"
            - "      db.update_chapter_scan_result(library_item_id, 'scanned', extraction_result.duration_secs).await?"
            - "      return Ok(ChapterScanOutcome::Scanned)"
            - "  Err(ChapterExtractionError::ParseError):"
            - "    tracing::warn!(library_item_id, 'corrupt M4B — marking parse_error')"
            - "    db.update_chapter_scan_result(library_item_id, 'parse_error', None).await?"
            - "    return Ok(ChapterScanOutcome::ParseError)"
            - "  Err(ChapterExtractionError::IoError):"
            - "    return Err — propagate (scan_status stays NULL for retry)"

          call_annotations:
            - { call: "tokio::task::spawn_blocking(extract_m4b_chapters)", type: LIBRARY, target: "tokio::task::spawn_blocking" }
            - { call: "extract_m4b_chapters(path)", type: NEW, target: "livrarr_tagwrite::extract_m4b_chapters" }
            - { call: "db.update_chapter_scan_result(...)", type: NEW, target: "ChapterDb::update_chapter_scan_result" }
            - { call: "db.replace_chapters(...)", type: NEW, target: "ChapterDb::replace_chapters" }
            - { call: "tracing::warn!(...)", type: LIBRARY, target: "tracing::warn" }

          preconditions:
            data_invariants:
              - "path is an M4B/M4A file (caller verified extension)"
              - "library_item_id refers to an existing library_items row"
            domain_state: []
            security: []

          postconditions:
            - "On success: chapters stored (or 'no_chapters'), duration_seconds set, scan_status set"
            - "On ParseError: scan_status = 'parse_error' (terminal)"
            - "On IoError: scan_status remains NULL (retryable)"

          invariants:
            - "Import succeeds regardless of chapter extraction outcome (extraction failure is logged, not propagated to import caller)"

          forbidden_behaviors:
            - "Must not fail the import if chapter extraction fails"
            - "Must not modify the source file"

          decisions:
            - key: "Non-fatal in import flow"
              value: "Log and continue on extraction failure"
              rationale: "Chapter metadata is optional enrichment. Import must succeed even for corrupt M4B chapter atoms."
            - key: "Chapter title fallback"
              value: "Empty title → 'Chapter N' (1-indexed)"
              rationale: "REQ-008: empty titles stored as 'Chapter N'"
            - key: "End time derivation"
              value: "Next chapter start, or file duration for last chapter"
              rationale: "REQ-008: end time = next start or file duration"

          tdd_directives:
            - "M4B with 3 chapters → 3 rows in DB, scan_status = 'scanned', duration set"
            - "M4B with no chapters → 0 rows, scan_status = 'no_chapters', duration set"
            - "Corrupt M4B → 0 rows, scan_status = 'parse_error'"
            - "Empty chapter titles → 'Chapter 1', 'Chapter 2', etc."
            - "Last chapter end_time = file duration"
            - "Last chapter dropped (with warning) when file duration is missing or <= chapter start time — invariant start < end preserved"

        - name: "import_grab integration"
          inputs: []
          output: "N/A"
          errors: []
          description: "WHERE to call extract_and_store_chapters within the existing import_grab flow"

          pseudocode:
            - "In import_grab, after successful create_library_item for each file:"
            - "  let ext = sf.path.extension().and_then(|e| e.to_str()).unwrap_or('')"
            - "  if matches!(ext, 'm4b' | 'm4a') {"
            - "    let target_path = target.clone();"
            - "    if let Err(e) = extract_and_store_chapters(item.id, &target_path, &*self.db).await {"
            - "      tracing::warn!(library_item_id = item.id, error = %e, 'chapter extraction failed — continuing import');"
            - "    }"
            - "  } else if sf.media_type == MediaType::Audiobook {"
            - "    // Non-M4B audiobook (MP3/FLAC) — mark as no_chapters immediately"
            - "    let _ = self.db.update_chapter_scan_result(item.id, 'no_chapters', None).await;"
            - "  }"
            - "This goes after the ImportedFile push, inside the Ok(item) branch of create_library_item"

          call_annotations:
            - { call: "extract_and_store_chapters(...)", type: NEW, target: "extract_and_store_chapters" }
            - { call: "self.db.update_chapter_scan_result(...)", type: NEW, target: "ChapterDb::update_chapter_scan_result" }

          preconditions:
            data_invariants: []
            domain_state: []
            security: []
          postconditions: []
          invariants: []
          forbidden_behaviors:
            - "Chapter extraction failure must not prevent import success"
          decisions:
            - key: "Non-M4B audiobooks get 'no_chapters' immediately"
              value: "Mark at import time, not during backfill"
              rationale: "MP3/FLAC audiobooks can't have embedded chapters. Setting 'no_chapters' prevents the backfill job from wasting time on them."
          tdd_directives:
            - "Import M4B → chapters extracted and stored"
            - "Import MP3 audiobook → scan_status = 'no_chapters'"
            - "Import ebook → no scan_status change (remains NULL, irrelevant)"

