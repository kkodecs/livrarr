  # ═════════════════════════════════════════
  # 12. backfill-job
  # ═════════════════════════════════════════
  - name: backfill-job
    responsibility: "One-time async job to extract chapters from existing M4B library items"
    dependencies: [db-chapters, chapter-extraction, import-chapter-hook]
    crate: livrarr-server
    file: crates/livrarr-server/src/jobs/chapter_backfill.rs (NEW)

    module_invariants:
      - "Runs once at startup, then exits"
      - "Processes items sequentially to avoid overwhelming disk I/O"
      - "Terminal outcomes (scanned, no_chapters, parse_error) are never re-processed"

    capability_survey:
      - capability: "Job startup pattern"
        existing_source: "crates/livrarr-server/src/jobs/mod.rs — JobRunner::spawn_job"
        reuse_decision: reuse
        rationale: "Spawn as a one-shot task after startup, not a recurring job"
      - capability: "extract_and_store_chapters"
        existing_source: "NEW — crates/livrarr-library/src/import_workflow.rs"
        reuse_decision: reuse
        rationale: "Same function used by import hook"

    public_api:
      types: []
      functions:
        - name: run_chapter_backfill
          inputs:
            - { name: db, type: "&SqliteDb" }
          output: "Result<(), anyhow::Error>"
          errors: []

          pseudocode:
            - "let items = db.list_unscanned_audiobook_items().await?"
            - "if items.is_empty() { tracing::info!('chapter backfill: no items to scan'); return Ok(()) }"
            - "tracing::info!(count = items.len(), 'chapter backfill: starting')"
            - "let mut chapters_found = 0; let mut no_chapters = 0; let mut parse_errors = 0; let mut io_errors = 0;"
            - "for (item_id, path) in &items {"
            - "  let path = PathBuf::from(path);"
            - "  let ext = path.extension().and_then(|e| e.to_str()).unwrap_or('');"
            - "  if !matches!(ext.to_lowercase().as_str(), 'm4b' | 'm4a') {"
            - "    // Non-M4B audiobook — mark immediately"
            - "    let _ = db.update_chapter_scan_result(*item_id, 'no_chapters', None).await;"
            - "    no_chapters += 1;"
            - "    continue;"
            - "  }"
            - "  match extract_and_store_chapters(*item_id, &path, db).await {"
            - "    Ok(ChapterScanOutcome::Scanned) => chapters_found += 1,"
            - "    Ok(ChapterScanOutcome::NoChapters) => no_chapters += 1,"
            - "    Ok(ChapterScanOutcome::ParseError) => parse_errors += 1,"
            - "    Err(e) => {"
            - "      tracing::warn!(item_id, error = %e, 'backfill: transient I/O error');"
            - "      io_errors += 1;"
            - "    }"
            - "  }"
            - "}"
            - "tracing::info!(chapters_found, no_chapters, parse_errors, io_errors, 'chapter backfill: complete')"
            - "Ok(())"

          call_annotations:
            - { call: "db.list_unscanned_audiobook_items()", type: NEW, target: "ChapterDb::list_unscanned_audiobook_items" }
            - { call: "extract_and_store_chapters(item_id, &path, db)", type: NEW, target: "extract_and_store_chapters" }
            - { call: "db.update_chapter_scan_result(...)", type: NEW, target: "ChapterDb::update_chapter_scan_result" }
            - { call: "tracing::info!(...)", type: LIBRARY, target: "tracing::info" }

          preconditions:
            data_invariants: []
            domain_state:
              - "DB is initialized and migrations have run"
            security: []

          postconditions:
            - "All M4B items have chapter_scan_status set (scanned/no_chapters/parse_error)"
            - "Non-M4B audiobooks have chapter_scan_status = 'no_chapters'"
            - "Items with transient errors remain NULL for retry on next startup"

          invariants:
            - "Sequential processing — one item at a time"

          forbidden_behaviors:
            - "Must not process items with non-NULL scan_status"
            - "Must not panic on individual item failure"

          decisions:
            - key: "Sequential, not parallel"
              value: "Process one item at a time"
              rationale: "Chapter extraction is disk I/O bound. Parallel extraction would thrash the disk on Raspberry Pi targets."
            - key: "One-shot, not recurring"
              value: "Run once at startup via tokio::spawn"
              rationale: "Not a periodic job. Runs once, processes backlog, exits. New imports handle their own chapters."
            - key: "Startup integration"
              value: "tokio::spawn(run_chapter_backfill(db.clone())) after AppState construction"
              rationale: "Fire-and-forget. Doesn't block server startup."

          tdd_directives:
            - "Backfill processes unscanned M4B items"
            - "Backfill skips already-scanned items"
            - "Non-M4B audiobooks get 'no_chapters'"
            - "Backfill logs summary counts"

