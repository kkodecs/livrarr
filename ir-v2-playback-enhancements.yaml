# IR v2 — Operational (Self-Contained)
# Produced by: Tech Lead (Stage 3: Design)

metadata:
  feature: "playback-enhancements"
  stage: v2-operational
  spec_ref: "spec-playback-enhancements.md"
  version: 1

# ---------------------------------------------------------------------------
# Structural (from v1 — abbreviated, full detail in ir-v1)
# ---------------------------------------------------------------------------

system_architecture:
  components:
    - name: livrarr-domain
      description: "New domain types (AudiobookChapter, Bookmark), extended PlaybackProgress/LibraryItem, new service traits"
      type: library
    - name: livrarr-db
      description: "SQLite implementations for chapter, bookmark, and extended progress persistence. Three new migrations."
      type: database
    - name: livrarr-tagwrite
      description: "New chapter extraction function for M4B files (reads MP4 atoms)"
      type: library
    - name: livrarr-library
      description: "Extended import pipeline — chapter extraction hook after M4B import"
      type: library
    - name: livrarr-handlers
      description: "New chapter/bookmark endpoints. Extended progress handlers. Extended work list enrichment."
      type: service
    - name: livrarr-server
      description: "Wire new services into AppState. Chapter backfill job. Extended router."
      type: service
    - name: frontend
      description: "Chapter UI, bookmarks, progress overlays, mobile icons, dark mode fix"
      type: frontend
  connections:
    - from: livrarr-handlers
      to: livrarr-domain
      protocol: in-process
      description: "Handlers call service traits defined in domain"
    - from: livrarr-library
      to: livrarr-tagwrite
      protocol: in-process
      description: "Import pipeline calls chapter extraction after M4B import (NEW dependency)"
    - from: livrarr-server
      to: livrarr-db
      protocol: SQL
      description: "Direct DB access for backfill job (server-only startup task)"
    - from: frontend
      to: livrarr-handlers
      protocol: HTTP
      description: "REST API calls for progress, chapters, bookmarks"
  deployment:
    topology: single-process
    notes: "No new processes. All backend changes in existing binary."

languages:
  - language: Rust
    version: "2024 edition"
    usage: "primary backend"
  - language: TypeScript
    version: "5.x"
    usage: "frontend (React SPA)"

frameworks:
  - name: axum
    version: "0.8"
    usage: "HTTP framework (existing)"
  - name: React
    version: "19"
    usage: "frontend SPA (existing)"
  - name: sqlx
    version: "0.8"
    usage: "SQLite async queries + migrations (existing)"

approved_libraries:
