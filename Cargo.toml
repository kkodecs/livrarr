[workspace]
resolver = "2"
members = [
    "crates/livrarr-domain",
    "crates/livrarr-http",
    "crates/livrarr-db",
    "crates/livrarr-matching",
    "crates/livrarr-external-data",
    "crates/livrarr-identity",
    "crates/livrarr-enrichment",
    "crates/livrarr-metadata",
    "crates/livrarr-download",
    "crates/livrarr-library",
    "crates/livrarr-tagwrite",
    "crates/livrarr-materialize",
    "crates/livrarr-jobs",
    "crates/livrarr-handlers",
    "crates/livrarr-server",
    "crates/livrarr-cli",
    "crates/livrarr-behavioral",
]

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full", "test-util"] }
async-trait = "0.1"
trait-variant = "0.1"
tokio-util = "0.7"
axum = "0.8"
csv = "1"
futures = "0.3"
hmac = "0.12"
id3 = "1.16"
image = { version = "0.25", default-features = false }
libc = "0.2"
lru = "0.12"
mp4ameta = "0.13"
quick-xml = "0.37"
rapidfuzz = "0.5"
regex = "1"
reqwest = { version = "0.12", default-features = false }
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
subtle = "2"
tempfile = "3"
toml = "1.1"
tower = "0.5"
tower-http = "0.6"
tracing = "0.1"
unicode-normalization = "0.1"
unicode-script = "0.5"
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# Internal crates
livrarr-domain = { path = "crates/livrarr-domain" }
livrarr-http = { path = "crates/livrarr-http" }
livrarr-db = { path = "crates/livrarr-db" }
livrarr-external-data = { path = "crates/livrarr-external-data" }
livrarr-identity = { path = "crates/livrarr-identity" }
livrarr-enrichment = { path = "crates/livrarr-enrichment" }
livrarr-metadata = { path = "crates/livrarr-metadata" }
livrarr-download = { path = "crates/livrarr-download" }
livrarr-library = { path = "crates/livrarr-library" }
livrarr-tagwrite = { path = "crates/livrarr-tagwrite" }
livrarr-materialize = { path = "crates/livrarr-materialize" }
livrarr-jobs = { path = "crates/livrarr-jobs" }
livrarr-matching = { path = "crates/livrarr-matching" }
livrarr-handlers = { path = "crates/livrarr-handlers" }
livrarr-server = { path = "crates/livrarr-server" }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
