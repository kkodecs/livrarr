  contract_check:
    - "handlers-cross-format imports only livrarr-domain + axum/serde — no forbidden targets; verified pattern: cargo tree -p livrarr-handlers."
    - "No banned replace-style upsert anywhere above — all writes are INSERT ... ON CONFLICT ... DO UPDATE."
    - "INV-1: sha2 appears exactly twice (server validate, scan-hook candidate match) — both EPUB-only; m4b duration comes from stored metadata / the existing header parse."
    - "INV-2: position strings never ordered cross-format; every comparison is f64 ts."
  req_coverage:
    REQ-001: ["establish_kash_link", "call-site wiring"]
    REQ-002: ["establish_kash_link (hash match)", "KashLinkDb::upsert_link"]
    REQ-003: ["upsert_progress extension (kind gate)", "ProgressKind", "audio/ebook kind classification"]
    REQ-004: ["resume_prompt", "get_resume_prompt", "ResumePromptBanner", "prompt effects"]
    REQ-005: ["onJump/onStay paths", "resume_prompt postcondition"]
    REQ-006: ["resolve_target never-backward guard"]
    REQ-007: ["load_validated", "resume_prompt silent None"]
    REQ-008: ["load_validated drift -> LinkStale", "error mapping -> 404 fallback", "establish_kash_link scan reconciliation (delete stale links)", "delete_link_for_audio"]
    REQ-009: ["establish_kash_link (no audio reads)", "module invariant"]
