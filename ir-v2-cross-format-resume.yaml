  # ==========================================================================
  # 7. handlers-cross-format — livrarr-handlers/src/cross_format.rs + router
  # ==========================================================================
  - name: "handlers-cross-format"
    responsibility: "Four thin handlers behind HasCrossFormatService. validate -> call trait -> map result (insight 9). Routes under /workfile/{id}/cross-format/*."
    dependencies: ["domain-cross-format-contract"]

    module_invariants:
      - "No livrarr-db/metadata/tagwrite/download imports (compile wall, contract module_dependency)."

    capability_survey:
      - capability: "handler + error-mapping shape"
        existing_source: "handlers/src/bookmark.rs + types/api_error.rs From<FileServiceError>"
        reuse_decision: "reuse"
        rationale: "same AuthContext + Path + Json pattern; add From<CrossFormatError> beside the others"

    public_api:
      types:
        - kind: struct
          name: "CurrentTsQuery"
          fields:
            - { name: "current_ts", type: "f64 (serde, snake_case wire param)" }
        - kind: struct
          name: "ResumePromptResponse"
          fields:
            - { name: "format", type: "String — \"ebook\"|\"audiobook\" via the bookmark.rs format!(\"{:?}\").to_lowercase() pattern" }
            - { name: "position", type: "String" }
            - { name: "label", type: "String" }
          # serde rename_all = camelCase, matching BookmarkResponse. AnchorResponse { cfi: String, ts: f64 } likewise.

      functions:
        - name: "get_resume_prompt / get_anchors / post_decline / post_sync_to_here"
          inputs: [{ name: "see IR v1", type: "State<S>, AuthContext, Path<i64>; prompt+sync also Query<CurrentTsQuery>; decline has NO query (DEV-1)" }]
          output: "Json<Option<ResumePromptResponse>> | Json<Vec<AnchorResponse>> | StatusCode::NO_CONTENT | StatusCode::NO_CONTENT"
          errors: ["ApiError"]
          pseudocode:
            - "each: call the corresponding CrossFormatService method with ctx.user.id; map domain values to response DTOs"
            - "From<CrossFormatError> for ApiError: NotLinked -> NotFound; LinkStale -> NotFound (reader treats any 404 as 'no cross-format here' — REQ-008 silent fallback); KashUnreadable -> NotFound (same UX posture; details to tracing::warn); Db(msg) -> Internal(msg)"
            - "guard: current_ts must be finite and >= 0 else ApiError::BadRequest"
            - "router.rs (after the bookmarks block, inside the auth-middleware router): GET /workfile/{id}/cross-format/prompt, GET .../anchors, POST .../decline, POST .../sync"
          call_annotations:
            - { call: "state.cross_format_service().*", type: "NEW", target: "HasCrossFormatService" }
            - { call: "route registration", type: "EXISTING", target: "livrarr-server/src/router.rs:489 insertion point" }
          tdd_directives:
            - "unlinked item: prompt 200 null body; anchors 404; decline 404; sync 404"
            - "non-finite/negative current_ts -> 400"
            - "compile wall: cargo tree -p livrarr-handlers shows no forbidden deps (existing CI check)"

  # ==========================================================================
  # 8. frontend-resume — anchors, kind classification, prompt banner, sync (TS)
  # ==========================================================================
  - name: "frontend-resume"
    responsibility: "Ebook CFI<->ts resolution + kind classification + Jump/Stay banner + sync-to-here in both players. REQ-004, REQ-005, REQ-013(display), REQ-018."
    dependencies: []

    module_invariants:
      - "The frontend never compares CFIs to seconds; all cross-format ordering happens in ts after anchor resolution (contract INV-2)."
      - "Accepting a prompt jumps to EXACTLY prompt.position as delivered (REQ-016/AC-012) — no re-fetch, no re-resolution."

    capability_survey:
      - capability: "CFI ordering"
        existing_source: "epubjs (EpubCFI.compare) — transitive dep of react-reader 2.0.15"
        reuse_decision: "reuse"
        rationale: "the canonical CFI comparator; never parse CFIs by hand"
      - capability: "toasts"
        existing_source: "sonner 2.0.7 (package.json)"
        reuse_decision: "reuse"
        rationale: "approved; non-blocking"
      - capability: "server prompt/anchors/decline/sync"
        existing_source: "none"
        reuse_decision: "rewrite"
        rationale: "new endpoints — four functions in src/api/index.ts beside the Playback progress block (index.ts:458)"

    public_api:
      types:
        - kind: interface
          name: "ResumePromptDTO"
          fields:
            - { name: "format", type: "'ebook' | 'audiobook'" }
            - { name: "position", type: "string" }
            - { name: "label", type: "string" }
        - kind: interface
          name: "AnchorDTO"
          fields:
            - { name: "cfi", type: "string" }
            - { name: "ts", type: "number" }

      functions:
        - name: "api/index.ts additions"
          inputs: []
          output: "typed fetch wrappers"
          errors: []
          pseudocode:
            - "getCrossFormatPrompt(id, currentTs) -> apiFetch<ResumePromptDTO | null>(`/workfile/${id}/cross-format/prompt?current_ts=${currentTs}`)"
            - "getCrossFormatAnchors(id) -> apiFetch<AnchorDTO[]>(`/workfile/${id}/cross-format/anchors`)"
            - "declineCrossFormat(id) -> POST .../decline; syncCrossFormatToHere(id, currentTs) -> POST `.../sync?current_ts=${currentTs}`"
            - "updatePlaybackProgress gains optional trailing args (kind?: 'progress'|'seek', crossFormatTs?: number) -> body { position, progress_pct, kind, cross_format_ts } (snake_case keys; omit undefined)"
          call_annotations:
            - { call: "apiFetch", type: "EXISTING", target: "src/api/client.ts" }
          decisions:
            - { key: "epubjs-direct-dep", value: "add \"epubjs\" to package.json dependencies at react-reader's own version", rationale: "pnpm strict node_modules does not expose transitive deps for direct import; the code already ships in the bundle via react-reader, so this pins — not adds — a library (within IR v1's approved 'react-reader / epub.js (existing)')" }

        - name: "resolveTsForCfi (shared helper, e.g. src/utils/kashAnchors.ts)"
          inputs: [{ name: "anchors", type: "AnchorDTO[] (server order = ascending ts)" }, { name: "cfi", type: "string" }]
          output: "number   # ts of nearest anchor at-or-before cfi; 0 when before the first anchor"
          errors: []
          pseudocode:
            - "comparator = new EpubCFI(); binary search for the LAST anchor with comparator.compare(anchor.cfi, cfi) <= 0"
            - "return its ts, else 0   # mirrors domain anchor_at_or_before semantics in CFI space"
          call_annotations:
            - { call: "new EpubCFI().compare", type: "LIBRARY", target: "epubjs" }
            # epubjs is in the (inherited) approved list — see metadata note on name normalization
          tdd_directives:
            - "(vitest) exact-anchor cfi returns its ts; between-anchors returns preceding; before-first returns 0 — with EpubCFI mocked or real epubjs"

        - name: "ResumePromptBanner (src/components/ResumePromptBanner.tsx)"
          inputs: [{ name: "props", type: "{ label: string; onJump(): void; onStay(): void }" }]
          output: "non-modal dismissible banner"
          errors: []
          pseudocode:
            - "fixed bottom-center card: text 'Resume at {label}?' + Jump (primary) + Stay buttons; rendering it never blocks or pauses the underlying reader/player (REQ-004 'position is not changed without explicit confirmation'); Stay and the X both call onStay"
          call_annotations:
            - { call: "tailwind + lucide", type: "EXISTING", target: "frontend conventions" }

        - name: "EpubReader integration"
          inputs: []
          output: "edits to EpubReader.tsx"
          errors: []
          pseudocode:
            - "anchors = useQuery(['cross-format-anchors', libraryItemId], getCrossFormatAnchors, { retry: false }); on error/404 -> anchors undefined -> ALL cross-format behavior below disabled (REQ-007/REQ-008 fallback)"
            - "jumpUntilRef = useRef(Date.now() + 3000)   # settle WINDOW, not a consume-once flag (review r1 R-002): every relocated inside the window is a seek. Initialized at mount to cover the entire restore burst (initial setLocation + locations.generate relocations)"
            - "TOC navigate, bookmark click, and prompt-accept each set jumpUntilRef.current = Date.now() + 1500 immediately before setLocation(...)"
            - "in the relocated handler: kind = Date.now() < jumpUntilRef.current ? 'seek' : 'progress'; ts = anchors ? resolveTsForCfi(anchors, loc.start.cfi) : undefined; saveProgress(cfi, pct, kind, ts)   # page turns outside any window -> progress (Q-006 ebook signal)"
            - "saveProgress threads (kind, crossFormatTs) into updatePlaybackProgress (debounce unchanged)"
            - "prompt effect: when initialLoaded && anchors && rendition's first relocation has produced a current cfi: currentTs = resolveTsForCfi(anchors, currentCfi); getCrossFormatPrompt(id, currentTs) -> if non-null setPrompt(dto) (fetch once per mount)"
            - "onJump: jumpUntilRef.current = Date.now() + 1500; setLocation(prompt.position); clear prompt   # the ensuing relocated save(s) (kind=seek inside the window, ts of the target anchor) are the position write — no extra call (r2 R-004: settle window, not the dropped consume-once flag)"
            - "onStay: declineCrossFormat(id).catch(noop); clear prompt"
            - "sync-to-here: button in the settings popover, visible only when anchors loaded; onClick -> syncCrossFormatToHere(id, resolveTsForCfi(anchors, currentCfi)) + sonner toast 'Position synced'"
          call_annotations:
            - { call: "useQuery / useMutation", type: "EXISTING", target: "@tanstack/react-query (file conventions)" }
            - { call: "resolveTsForCfi / api fns / banner", type: "NEW", target: "this module" }
            - { call: "setLocation / relocated handler", type: "EXISTING", target: "EpubReader.tsx:166,589" }
          decisions:
            - { key: "seek-settle-window", value: "time window (1500ms per jump; 3000ms at mount) classifies ALL relocated events inside it as seek — replaces the consume-once boolean from draft 1", rationale: "epub.js can emit multiple relocated events for one programmatic jump (intermediate + final + layout), and react-reader's built-in arrows call rendition.next/prev internally where we have no hook — so neither a consume-once flag nor clear-on-user-event is reliable (review r1 R-002). A settle window classifies the whole burst as seek with no react-reader internals. Residual: a resize-triggered relocated OUTSIDE any window posts progress at an unchanged position — harmless, its ts equals the stored furthest candidate and MAX() makes it a no-op; and a genuine page turn within 1.5s of a jump posts seek — one turn's advancement delayed, conservative direction (kind misclassification toward seek never corrupts furthest)." }
          tdd_directives:
            - "(vitest, handler-level) TWO relocated events fired from one TOC jump inside the window both post kind=seek (AC-015, R-002 regression); same for a PROMPT-ACCEPT jump (R-004); relocated after the window posts kind=progress; relocations during the mount window post seek"
            - "prompt accept calls setLocation with EXACTLY dto.position (AC-012)"

        - name: "AudioPlayer integration"
          inputs: []
          output: "edits to AudioPlayer.tsx"
          errors: []
          pseudocode:
            - "periodic 10s interval save (line 178) -> kind 'progress', crossFormatTs = t   # playback ticks = genuine consumption (Q-006)"
            - "saveProgress(time, dur) gains kind param: togglePlay-pause / sleep-expiry / chapter-end-sleep saves -> 'progress' (they persist the last LISTENED position); onSeek slider -> 'seek' (AC-015)"
            - "crossFormatTs accompanies every save (= the position being saved); kind decides whether the server advances"
            - "skip/chapter-nav/bookmark-click set currentTime without saving (unchanged); the next playing tick reports the post-jump position as progress — consumption AFTER a jump is genuine progress (Q-006 resolution: the seek itself never advances the mark; continued listening does; sync-to-here is the backstop)"
            - "prompt effect: after initial progress restore (the getPlaybackProgress effect), currentTs = restored seconds (0 if none); getCrossFormatPrompt(id, currentTs) -> non-null -> setPrompt (once per mount; works for unlinked items because prompt returns null, not 404)"
            - "onJump: t = parseFloat(prompt.position); audioRef.currentTime = t; setCurrentTime(t); updatePlaybackProgress(id, prompt.position, duration > 0 ? t/duration : 0, 'seek', t); clear prompt   # explicit save: paused players have no tick to persist the jump"
            - "onStay: declineCrossFormat(id).catch(noop); clear prompt"
            - "sync-to-here: row in the player settings popover; onClick -> syncCrossFormatToHere(id, currentTime) + toast (server resolves to the nearest anchor — REQ-018)"
          call_annotations:
            - { call: "updatePlaybackProgress(+kind,+ts)", type: "EXISTING", target: "extended in api/index.ts" }
            - { call: "prompt/decline/sync api + banner", type: "NEW", target: "this module" }
          decisions:
            - { key: "audio-kind-map", value: "ticks/pause/sleep-saves=progress; slider=seek; post-jump listening=progress", rationale: "Q-006 as resolved in the spec: the scrub itself never advances; consumption after it is real consumption (Whispersync-parity), and skip-to-end-without-playing leaves furthest untouched because the tick only fires while playing" }
          tdd_directives:
            - "(vitest) slider seek posts kind=seek; interval tick posts kind=progress with crossFormatTs; accept jump posts seek at exactly prompt.position"

