            - "Both writes commit or neither does."
          decisions:
            - { key: "monotonic-in-sql", value: "MAX() inside DO UPDATE, not read-modify-write", rationale: "concurrent saves from two devices can interleave; MAX in the statement makes the advance order-independent (REQ-016 monotonic under races)" }
            - { key: "no_lifecycle-unchanged", value: "upsert_progress_no_lifecycle keeps its current signature", rationale: "that branch exists solely for audiobooks with missing/invalid duration (file_service.rs:229) — such items can never pass duration-identity validation, so a validated link cannot exist for them; threading dead parameters through would be noise" }
          tdd_directives:
