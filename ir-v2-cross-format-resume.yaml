            - "kind=Seek never advances (AC-015); kind=Progress with lower ts never lowers (monotonic)"
            - "unlinked item: progress write succeeds, no state row appears"
            - "two users, same link: independent furthest rows (AC-021)"
            - "finished_at lifecycle outcomes identical to pre-change behavior for all three pct zones (existing playback_enhancement_tests stay green after mechanical arg addition)"

        - name: "FileService::update_progress (extended) + FileServiceImpl"
