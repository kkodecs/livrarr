  # ==========================================================================
  # 5. server-cross-format-service — CrossFormatServiceImpl (livrarr-library/src/cross_format_service.rs)
  # ==========================================================================
  # PLACEMENT (amended at stub time, 2026-06-09): the impl lives in
  # livrarr-LIBRARY, not livrarr-server — that IS the FileService pattern this
  # module mirrors (FileServiceImpl/BookmarkServiceImpl/ChapterServiceImpl are
  # all livrarr_library types aliased in state.rs:81-83), and livrarr-behavioral
  # tests can only reach livrarr-library (livrarr-server is not a dev-dep).
  # Crate dependency edges are unchanged (library already depends on domain+db).
  - name: "server-cross-format-service"
    responsibility: "Implements CrossFormatService in livrarr-library/src/cross_format_service.rs. Generic CrossFormatServiceImpl<D, F> { db: D, files: F } where D: KashLinkDb + CrossFormatStateDb + LibraryItemDb, F: FileService (path resolution reuse). Mirrors the FileServiceImpl shape."
    dependencies: ["domain-kash", "domain-cross-format-contract", "db-cross-format"]

    module_invariants:
      - "All file reads + hashing run in spawn_blocking (insight 10)."
      - "Every entry point loads the item via LibraryItemDb::get_library_item(user_id, item_id) — user scoping enforced before any link lookup (AC-021)."
      - "The m4b is never opened, read, or hashed here; audio identity = stored library_items.duration_seconds vs kash.duration_seconds (REQ-009/REQ-014; contract INV-1)."

    capability_survey:
      - capability: "absolute path resolution for a library item"
        existing_source: "FileService::resolve_path (domain trait; impl in livrarr-library)"
        reuse_decision: "reuse"
        rationale: "root-folder join + traversal checks already exist; reimplementing is the duplication trap (insight 26). state.rs constructs a second FileServiceImpl::new(db) — the impl is a stateless wrapper over the same pool"
      - capability: "EPUB hashing"
        existing_source: "sha2 (workspace, approved)"
        reuse_decision: "reuse"
        rationale: "small file; read + Sha256 in spawn_blocking"
      - capability: "service impl + wiring pattern"
        existing_source: "manual_import_service.rs + state.rs Arc fields + context.rs Has*"
        reuse_decision: "reuse"
        rationale: "identical generic-over-DB service shape (insights 9c/9h)"

    public_api:
      functions:
        - name: "load_validated (private helper)"
          inputs: [{ name: "user_id", type: "UserId" }, { name: "library_item_id", type: "LibraryItemId" }]
          output: "Result<Validated { link, kash, opened: LibraryItem, audio: LibraryItem, ebook: LibraryItem }, CrossFormatError>"
          errors: ["CrossFormatError"]
          pseudocode:
            - "opened = db.get_library_item(user_id, library_item_id); DbError::NotFound -> NotLinked (also covers foreign-user probing)"
            - "link = db.link_for_item(library_item_id); None -> NotLinked"
            - "audio = db.get_library_item(user_id, link.audio_item_id); ebook = db.get_library_item(user_id, link.ebook_item_id); NotFound -> LinkStale (REQ-007 'both items present')"
            - "audio identity: audio.duration_seconds must be Some(d) with |d - (kash duration, read below)| <= DURATION_TOLERANCE_SECS — order note: read .kash first, then compare"
            - "kash_path = root_folder(audio.root_folder_id).path JOIN audio.path, extension swapped to 'kash' (sibling <stem>.kash — derived, never persisted). AS-BUILT AMENDMENT (S5 C5): NOT via files.resolve_path for the AUDIO side — resolve_path canonicalizes, which stats/requires the m4b on disk; the direct join keeps the audio side stat-free (REQ-009 strict). The EBOOK path (step 7) still reuses files.resolve_path. Adds RootFolderDb to the impl-block bounds only."
            - "bytes = spawn_blocking(std::fs::read(kash_path)); IO error -> KashUnreadable"
            - "kash = parse_kash(&bytes); error -> KashUnreadable"
            - "duration check (above) fails -> LinkStale (REQ-008/REQ-014/AC-009)"
            - "ebook identity: epub_path = files.resolve_path(user_id, ebook.id); hash = spawn_blocking(read + Sha256 hex); hash != kash.epub_hash -> LinkStale (REQ-008)"
            - "return Validated{..}"
          call_annotations:
            - { call: "db.get_library_item", type: "EXISTING", target: "LibraryItemDb" }
            - { call: "db.link_for_item", type: "NEW", target: "db-cross-format" }
            - { call: "files.resolve_path", type: "EXISTING", target: "FileService::resolve_path" }
            - { call: "tokio::task::spawn_blocking", type: "EXISTING", target: "tokio runtime (project-wide blocking-IO rule, insight 10)" }
            - { call: "sha2::Sha256 (EPUB only)", type: "LIBRARY", target: "sha2" }
            - { call: "parse_kash", type: "NEW", target: "domain-kash" }
          decisions:
            - { key: "validate-per-open", value: "full validation (duration + epub hash) on every prompt/anchors/sync call", rationale: "reads are reader-open-frequency (not per-tick); the epub is a few MB (ms to hash); guarantees REQ-007 freshness without a cache-invalidation design. The .kash read is required anyway to serve anchors/resolve targets." }
            - { key: "duration-tolerance", value: "±2.0s (DURATION_TOLERANCE_SECS)", rationale: "the .kash was generated from this exact file — sub-second agreement expected; header rounding across muxers stays well under 2s; a different rip/edition differs by far more (intros, chapter marks). Constant lives in domain-kash beside the types." }
          tdd_directives:
            - "unlinked -> NotLinked; missing counterpart item -> LinkStale; duration drift > tolerance -> LinkStale (AC-009); epub hash mismatch -> LinkStale; unreadable/malformed kash -> KashUnreadable; foreign user's item id -> NotLinked (AC-021)"

        - name: "CrossFormatService::resume_prompt"
          inputs: [{ name: "user_id", type: "UserId" }, { name: "library_item_id", type: "LibraryItemId" }, { name: "current_ts", type: "f64" }]
          output: "Result<Option<ResumePrompt>, CrossFormatError>"
          errors: ["CrossFormatError"]
          pseudocode:
            - "v = load_validated(...); on NotLinked | LinkStale | KashUnreadable return Ok(None) — SILENT fallback (REQ-007/REQ-008/Q-004: no prompt, independent positions); on Db(e) return Err"
            - "state = db.get_or_default(user_id, v.link.id)"
            - "if state.furthest_ts <= 0 return Ok(None)   # nothing recorded yet"
            - "declined = match v.opened.media_type { Ebook -> state.ebook_declined_at_ts, Audiobook -> state.audio_declined_at_ts }"
            - "if declined is Some(d) and state.furthest_ts <= d return Ok(None)   # REQ-017 suppression: re-arms only when furthest advances beyond the declined value"
            - "target = resolve_target(&v.kash, state.furthest_ts, current_ts); None -> Ok(None)   # never-backward (REQ-015/AC-007)"
            - "match v.opened.media_type:"
            - "  Audiobook -> position = target.ts as string (seconds, matching existing audio position encoding); label = formatted H:MM:SS of target.ts (AC-013)"
            - "  Ebook -> position = target.cfi; label = chapter_label(&v.kash, target.ts) (chapter + percent, never raw CFI — AC-013)"
            - "return Ok(Some(ResumePrompt { format: opened.media_type, position, label }))"
          call_annotations:
            - { call: "load_validated / get_or_default", type: "NEW", target: "this module / db-cross-format" }
            - { call: "resolve_target / chapter_label", type: "NEW", target: "domain-kash" }
          postconditions:
            - "A returned prompt's target is strictly ahead of current_ts and is the exact position the frontend will jump to on accept (REQ-016 honor-shown-target: accept does not re-query)."
          tdd_directives:
            - "listen-then-open-ebook yields prompt with CFI position + chapter/percent label (AC-004/AC-013); symmetric read-then-open-audio yields seconds + timestamp label (AC-014)"
            - "furthest at/behind current -> None (AC-007); fresh link no progress -> None"
            - "decline then same furthest -> None; decline then advanced furthest -> prompt returns (AC-006)"
            - "two links in one work: progress on link A never prompts on link B (AC-003)"

        - name: "CrossFormatService::anchors_for_item"
          inputs: [{ name: "user_id", type: "UserId" }, { name: "library_item_id", type: "LibraryItemId" }]
          output: "Result<Vec<AlignmentEntry>, CrossFormatError>"
          errors: ["CrossFormatError"]
          pseudocode:
            - "v = load_validated(...)? — errors PROPAGATE here (the ebook reader uses an error/404 as 'not linked: skip all cross-format reporting'; serving anchors for a stale link would let garbage CFIs poison furthest_ts)"
            - "return Ok(v.kash.alignment)"
          call_annotations:
            - { call: "load_validated", type: "NEW", target: "this module" }
          tdd_directives:
            - "linked+valid returns the alignment in order; unlinked errors NotLinked; drifted errors LinkStale"

        - name: "CrossFormatService::decline_resume"
          inputs: [{ name: "user_id", type: "UserId" }, { name: "library_item_id", type: "LibraryItemId" }]
          output: "Result<(), CrossFormatError>"
          errors: ["CrossFormatError"]
          pseudocode:
            - "opened = db.get_library_item(user_id, item_id) (NotFound -> NotLinked); link = link_for_item (None -> NotLinked)   # no kash/file validation: declining must work even if files drifted moments ago"
            - "state = get_or_default; db.set_decline(user_id, link.id, opened.media_type, state.furthest_ts)   # threshold = furthest at decline time (REQ-017 literal)"
          call_annotations:
            - { call: "set_decline", type: "NEW", target: "db-cross-format" }
          tdd_directives:
            - "decline records the current furthest for the opened format only (AC-006 setup)"

        - name: "CrossFormatService::sync_to_here"
          inputs: [{ name: "user_id", type: "UserId" }, { name: "library_item_id", type: "LibraryItemId" }, { name: "current_ts", type: "f64" }]
          output: "Result<(), CrossFormatError>"
          errors: ["CrossFormatError"]
          pseudocode:
            - "v = load_validated(...)? — errors propagate (sync needs a valid alignment to resolve the anchor)"
            - "ts = anchor_at_or_before(&v.kash, current_ts) map .ts, else 0.0 (before first anchor -> start; REQ-018 'nearest anchor at or before')"
            - "db.sync_to(user_id, v.link.id, ts)   # override, may decrease; clears declines"
          call_annotations:
            - { call: "anchor_at_or_before", type: "NEW", target: "domain-kash" }
            - { call: "sync_to", type: "NEW", target: "db-cross-format" }
          tdd_directives:
            - "sync at mid-book stores the preceding anchor's ts even when below prior furthest (AC-016); sync before first anchor stores 0"

        - name: "AppState wiring (state.rs + context.rs)"
          inputs: []
          output: "compile-time wiring"
          errors: []
          pseudocode:
            - "context.rs: pub trait HasCrossFormatService { type CrossFormatSvc: CrossFormatService; fn cross_format_service(&self) -> &Self::CrossFormatSvc; } — copy HasBookmarkService shape (context.rs:39)"
            - "AppContext supertrait union gains + HasCrossFormatService (insight 9h)"
            - "state.rs: alias LiveCrossFormatService = livrarr_library::cross_format_service::CrossFormatServiceImpl<SqliteDb, LiveFileService>; AppState field cross_format_service: Arc<LiveCrossFormatService>; constructed in main.rs with svc_db.clone() + FileServiceImpl::new(svc_db.clone()) (stateless); impl HasCrossFormatService for AppState returns &self.cross_format_service (deref coercion, insight 9c)"
          call_annotations:
            - { call: "Has* + Arc field pattern", type: "EXISTING", target: "context.rs/state.rs conventions" }

  # ==========================================================================
  # 6. library-scan-hook — establish_kash_link (livrarr-library/src/import_workflow.rs)
  # ==========================================================================
  - name: "library-scan-hook"
    responsibility: "Detect sibling .kash at import time and upsert the link. Generic over D: ChapterDb + LibraryItemDb + KashLinkDb. REQ-001, REQ-002, REQ-009, REQ-014."
    dependencies: ["domain-kash", "db-cross-format"]

    module_invariants:
      - "Kash failures NEVER fail or slow an import beyond reading the small sidecar + candidate epubs — warn-and-continue at both call sites (matches try_extract_chapters' fire-and-forget posture)."
      - "The m4b is never read here; container duration arrives as a parameter from the chapter extraction that already parsed the header (REQ-009/AC-010)."

    capability_survey:
      - capability: "m4b container duration"
        existing_source: "livrarr_tagwrite::extract_m4b_chapters (already called in try_extract_chapters)"
        reuse_decision: "reuse"
        rationale: "duration_secs already extracted; DEV-3 returns it instead of re-parsing"
      - capability: "ebook candidates for the work"
        existing_source: "LibraryItemDb::list_library_items_by_work (lib.rs:546)"
        reuse_decision: "reuse"
        rationale: "exact query needed; user+work scoped"

    public_api:
      functions:
        - name: "try_extract_chapters (modified return — DEV-3)"
          inputs: [{ name: "(unchanged)", type: "item_id, target, media_type, db" }]
          output: "Option<f64>   # container duration when an m4b header was successfully parsed"
          errors: []
          pseudocode:
            - "body unchanged; in the Ok(Ok(extraction)) arm capture extraction.duration_secs and return it at the end; all failure arms return None"
          call_annotations:
            - { call: "extract_m4b_chapters", type: "EXISTING", target: "livrarr-tagwrite (unchanged)" }
          tdd_directives:
            - "existing chapter-extraction behavior unchanged (no_chapters / scanned statuses); returns Some(duration) on parse success, None otherwise"

        - name: "establish_kash_link"
          inputs:
            - { name: "db", type: "&D where D: ChapterDb + LibraryItemDb + KashLinkDb" }
            - { name: "user_id", type: "UserId" }
            - { name: "audio_item_id", type: "LibraryItemId" }
            - { name: "audio_path", type: "&Path (absolute target path)" }
            - { name: "work_id", type: "WorkId" }
            - { name: "duration_secs", type: "f64" }
          output: "Result<(), KashLinkError>"
          errors: ["KashLinkError"]
          pseudocode:
            - "kash_path = audio_path.with_extension(\"kash\"); if !exists (async fs metadata): db.delete_link_for_audio(audio_item_id) then return Ok(()) — sidecar gone = unlink; idempotent no-op for the common no-sidecar audiobook (r2 R-003 reconciliation)"
            - "bytes = tokio::fs::read(kash_path) else Err(KashUnreadable) — transient IO: existing link left intact (read-side suppression covers it; don't destroy state on an IO blip)"
            - "kash = parse_kash(&bytes) else Err(KashUnreadable) — same conservative posture"
            - "if |kash.duration_seconds - duration_secs| > DURATION_TOLERANCE_SECS: db.delete_link_for_audio(audio_item_id); log info; return Ok(()) — the sidecar does not describe THIS audio cut: removing the link (and its state, via cascade) prevents wrong-timeline marks from accumulating while reads are suppressed, the R-003 poison window (and a known-stale link row is pointless anyway)"
            - "candidates = db.list_library_items_by_work(user_id, work_id) filtered to media_type == Ebook AND path extension == epub"
            - "for each candidate: abs path = root-join NOT available here — candidates carry RELATIVE paths; resolve via the same root_folder the workflow already holds for the work's ebook root? NO — simpler: the import workflow call sites pass a resolver closure? AVOID complexity: hash via files on disk addressed from the AUDIO item's perspective is wrong too."
            - "RESOLUTION (load-bearing, see decision path-resolution-at-scan): D additionally bounds RootFolderDb (the workflow's D already satisfies it — import_workflow constructs paths from root folders today); abs = root_folder(candidate.root_folder_id).path JOIN candidate.path"
            - "hash candidate epub in spawn_blocking (std::fs::read + Sha256, hex-encode); skip candidates that fail to read (warn)"
            - "first candidate whose hash == kash.epub_hash -> matched; none -> Err(NoMatchingEbook) (REQ-002: no link)"
            - "db.upsert_link(NewKashLink { audio_item_id, ebook_item_id: matched.id, container_duration_secs: duration_secs, epub_hash: kash.epub_hash })"
            - "on DbError::Constraint (ebook already linked to another audio): log warn 'first link wins (v1 1:1 limitation)' + return Ok(()); other DbError -> Err(KashLinkError::Db)"
          call_annotations:
            - { call: "tokio::fs::read / try_exists", type: "EXISTING", target: "tokio runtime (project-wide)" }
            - { call: "parse_kash", type: "NEW", target: "domain-kash" }
            - { call: "list_library_items_by_work", type: "EXISTING", target: "LibraryItemDb" }
            - { call: "root folder lookup", type: "EXISTING", target: "RootFolderDb (workflow already bounds it)" }
            - { call: "spawn_blocking for candidate read+hash", type: "EXISTING", target: "tokio runtime (insight 10)" }
            - { call: "sha2::Sha256 (EPUB candidates only)", type: "LIBRARY", target: "sha2" }
            - { call: "delete_link_for_audio", type: "NEW", target: "db-cross-format" }
            - { call: "upsert_link", type: "NEW", target: "db-cross-format" }
          preconditions:
            domain_state:
              - "Called only after the audio library item exists (post create_library_item)."
          decisions:
            - { key: "path-resolution-at-scan", value: "bound D with RootFolderDb and join root.path + item.path", rationale: "library_items.path is relative; the workflow crate already depends on RootFolderDb for target construction, so no new crate edge; reusing FileService here would invert the dependency direction (library -> domain service impl)" }
            - { key: "scan-reconciles-stale-links", value: "rescan with sidecar ABSENT or duration-MISMATCHED deletes the existing link (cascading its state); unreadable/malformed sidecar leaves it intact (warn)", rationale: "r2 R-003: scan is the moment disk truth updates the DB (it also writes the new stored duration the read-side validates against). Without reconciliation, listening during a drifted interval writes wrong-timeline furthest marks that survive a later return-to-validity and can produce a poisoned prompt. Deleting the link makes stale-period advancement structurally impossible — upsert_progress finds no link row. Cost: a drift event resets the shared mark (Whispersync parity; per-item progress/bookmarks untouched). Unreadable is kept conservative because a transient IO failure should not destroy state, and reads are suppressed meanwhile." }
            - { key: "scan-granularity-residual", value: "drift detection is SCAN-granularity; an in-place file swap with no rescan is out of v1 scope", rationale: "between a physical replacement and the next scan, the DB's stored duration still describes the old file, so reads validate against stale truth — the same lag applies to plain per-item playback positions in any scan-based library manager; the next scan reconciles (documented limitation, accepted)" }
          tdd_directives:
            - "m4b + sibling kash + matching epub in work -> link row with that ebook (AC-001/AC-002)"
            - "no sibling kash -> Ok, no row; malformed kash -> KashUnreadable, EXISTING link (if any) left intact"
            - "no epub whose hash matches -> NoMatchingEbook, no row (AC-002 negative)"
            - "kash duration far from container duration -> Ok, no row; an EXISTING link for that audio is deleted and its state gone (R-003)"
            - "rescan with the sidecar removed deletes the existing link + state (R-003)"
            - "R-003 poison regression (service-level): valid link + progress to T1 -> replace audio cut + rescan (link deleted) -> listen on new cut (furthest advances NOTHING) -> restore original audio + rescan (link recreated, fresh state) -> prompt derives only from post-restore progress, never from the drifted interval"
            - "ebook already linked to a different audio -> Ok (warn), original link intact"
            - "AC-010 (audio never opened): fixtures NEVER create the .m4b file at all — any implementation that opens/reads/hashes the audio fails on the missing file. This is strictly stronger than a sparse multi-GB fixture, whose zero-reads would silently succeed. (Amended at tests stage, r1: replaces the earlier 'file-size-tier fixtures' suggestion.)"

        - name: "call-site wiring (ALL THREE chapter-extraction paths)"
          inputs: []
          output: "one shared private helper + three call-site edits"
          errors: []
          pseudocode:
            - "private helper extract_chapters_and_kash(db, item_id, target, media_type, user_id, work_id): let dur = try_extract_chapters(item_id, target, media_type, db).await; when dur is None fall back to the item's STORED library_items.duration_seconds (a prior scan's truth — the same value read-side validation compares; lets rescans/manual paths reconcile when the header is unreadable); if media_type == Audiobook && target extension == m4b && a duration is available: if let Err(e) = establish_kash_link(db, user_id, item_id, target, work_id, d).await { tracing::warn!(...) } — never fails the import (fallback amended at S5 C4, test-pinned by the manual_extract tests)"
            - "call path 1+2 (grab import): import_workflow.rs lines 684 and 737 replace the bare try_extract_chapters call with the helper (user_id, work_id already in scope at both sites)"
            - "call path 3 (manual import): the PUBLIC ImportWorkflowImpl::extract_chapters_for_item (import_workflow.rs:56) gains user_id + work_id params and delegates to the helper; its impl-block bound widens from D: ChapterDb to D: ChapterDb + LibraryItemDb + KashLinkDb + RootFolderDb. Sole caller LiveImportService::import_file (livrarr-server/src/import_service.rs:191) already has user_id + work_id in scope (lines 174-175) — one-line call-site update"
            - "(production D = SqliteDb implements all four traits; any behavioral fake DB bound only to ChapterDb gains the new trait impls — compile-driven)"
          call_annotations:
            - { call: "establish_kash_link", type: "NEW", target: "this module" }
            - { call: "extract_chapters_for_item", type: "EXISTING", target: "import_workflow.rs:56 (signature extended)" }
          tdd_directives:
