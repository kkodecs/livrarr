# IR v2 — Operational
# Extends IR v1 with pseudocode, call annotations, conditions, and TDD directives.
# IR v1 (ir-v1-cross-format-resume.yaml) remains the source of truth for
# system_architecture, languages, frameworks, approved_libraries, shared_types,
# and dependency_graph. This document adds the operational layer only.
#
# Grounding (verified against code on wcc-stage5-green, 2026-06-09):
#   PlaybackProgressDb::upsert_progress(user_id, library_item_id, position: &str, progress_pct: f64)
#     -> crates/livrarr-db/src/lib.rs:1600; sole production caller FileServiceImpl::update_progress
#     (crates/livrarr-library/src/file_service.rs:214); finished_at lifecycle >=0.98 set / <0.95 clear.
#   FileService::update_progress trait: crates/livrarr-domain/src/services/file.rs:77.
#   Handler: workfile::update_progress + UpdateProgressRequest {position, progress_pct} (snake_case,
#     no rename_all) crates/livrarr-handlers/src/workfile.rs:78; route PUT /workfile/{id}/progress
#     registered crates/livrarr-server/src/router.rs:475.
#   try_extract_chapters<D: ChapterDb>(item_id, target, media_type, db) -> () at
#     crates/livrarr-library/src/import_workflow.rs:260; call sites lines 684, 737 (user_id, work_id,
#     target absolute path all in scope); extraction.duration_secs: Option<f64>.
#   LibraryItemDb::list_library_items_by_work(user_id, work_id) lib.rs:546.
#   LibraryItem { path (RELATIVE to root folder), media_type, duration_seconds: Option<f64>, .. }.
#   FileService::resolve_path(user_id, item_id) -> PathBuf — existing absolute-path resolution.
#   FileServiceImpl<D> { db } stateless, ::new(db) — cheap to construct a second instance.
#   Latest migration: 057_provider_policy.sql -> migration 058 is next.
#   Bookmarks: CreateBookmarkRequest {position, sortKey, name, chapterTitle} camelCase;
#     POST /workfile/{id}/bookmarks; frontend mutations already in AudioPlayer.tsx.
#   AudioPlayer.tsx: startSleepTimer(minutes) line 277; end-of-chapter path = popover onClick that
#     sets sleepAtChapterEnd(true); periodic 10s progress interval while playing; onSeek slider save.
#   EpubReader.tsx: rendition.on("relocated") -> saveProgress(cfi, pct); jumps via setLocation().
#   frontend deps: react-reader 2.0.15 (epubjs transitive), sonner 2.0.7 present.

metadata:
  feature: "cross-format-resume"
  stage: v2-operational
  spec_ref: "spec-cross-format-resume.md"
  ir_v1_ref: "ir-v1-cross-format-resume.yaml"
  version: 1

# Inherited verbatim from IR v1 (semantics unchanged) so the compliance gate can
# validate LIBRARY call annotations against it. Two name normalizations only:
# IR v1's combined "react-reader / epub.js" entry is split into "react-reader" +
# "epubjs" (the gate's dot-splitting matcher cannot match a name containing '.').
approved_libraries:
  - { name: "serde / serde_json", version: "existing", usage: "parse the .kash JSON sidecar" }
  - { name: "sha2", version: "existing", usage: "hash the small EPUB to match .kash epub_hash (REQ-002) — NEVER the m4b" }
  - { name: "chrono", version: "existing", usage: "timestamps (project-wide)" }
  - { name: "sonner", version: "existing (frontend)", usage: "non-blocking toasts" }
  - { name: "react-reader", version: "existing (frontend)", usage: "EPUB rendition" }
  - { name: "epubjs", version: "existing (transitive via react-reader; pinned as direct dep — see epubjs-direct-dep decision)", usage: "EpubCFI compare for CFI->anchor resolution" }

# Deviations from IR v1 (operational refinements, with rationale; structure otherwise unchanged):
#   DEV-1: CrossFormatService::decline_resume drops the current_ts input. REQ-017 defines the
#          suppression threshold as "furthest position at decline time" — the opened format's
#          current position plays no role; an unused parameter would be a review finding.
#   DEV-2: The "cross_format_service -> playback_progress (read both items' position)" connection
#          in IR v1 is not used. current_ts is always client-supplied (the opened reader holds the
#          freshest position; the DB copy is 2s-debounce stale). No PlaybackProgressDb bound on the
#          service impl. Prompt math needs only furthest_ts + current_ts + .kash.
#   DEV-3: library-scan-hook: try_extract_chapters gains a return value (Option<f64> container
#          duration) so the existing call sites can invoke establish_kash_link without re-reading
#          the m4b header. IR v1 left the duration hand-off unspecified.

modules:
  # ==========================================================================
  # 1. domain-kash — pure .kash parsing + numeric lookups (livrarr-domain/src/kash.rs)
  # ==========================================================================
  - name: "domain-kash"
    responsibility: "Pure KASH parsing + ts-space lookups. No file IO, no CFI structural parsing (CFI strings are opaque payloads). REQ-014, REQ-015."
    dependencies: []

    module_invariants:
      - "alignment is strictly increasing in ts AFTER parse normalization (equal-ts runs collapse to their final anchor; a decrease is Malformed); all lookups may binary-search (partition_point) without re-checking."
      - "No function reads a file or hashes anything — callers pass bytes."
      - "CFI strings pass through untouched; ordering decisions use ts only (contract INV-2)."

    capability_survey:
      - capability: "JSON parsing"
        existing_source: "serde / serde_json (workspace)"
        reuse_decision: "reuse"
        rationale: "approved_libraries; .kash is a JSON sidecar"
      - capability: "sorted-slice lookup"
        existing_source: "std slice::partition_point"
        reuse_decision: "reuse"
        rationale: "stdlib; no dependency"

    public_api:
      types:
        - kind: const
          name: "DURATION_TOLERANCE_SECS"
          fields:
            - { name: "value", type: "f64 = 2.0" }

      functions:
        - name: "parse_kash"
          inputs: [{ name: "bytes", type: "&[u8]" }]
          output: "Result<Kash, KashError>"
          errors: ["KashError"]
          pseudocode:
            - "deserialize bytes as JSON into a serde struct mirroring Kash; on serde error return KashError::Malformed(serde message)"
            - "if version != 1 return Malformed(\"unsupported version\")"
            - "if duration_seconds is not finite or <= 0 return Malformed"
            - "if epub_hash is empty return Malformed"
            - "if alignment is empty return Malformed"
            - "walk alignment: any non-finite ts -> Malformed; any ts DECREASE -> Malformed; equal-ts runs NORMALIZE by keeping the run's final anchor (AS-BUILT AMENDMENT, S5: the real generator emits occasional same-second ties — 15 of 4003 in the first production sidecar; strict rejection bricked the file. Normalization preserves the strictly-increasing invariant every lookup relies on.)"
            - "return Ok(Kash) with the normalized alignment"
          call_annotations:
            - { call: "serde_json::from_slice", type: "LIBRARY", target: "serde / serde_json" }
          postconditions:
            - "Returned Kash satisfies the module invariant (monotonic alignment, positive duration)."
          decisions:
            - { key: "strict-monotonic", value: "AMENDED at S5: parse NORMALIZES equal-ts runs (final anchor wins) and rejects only decreases; output alignment is strictly increasing", rationale: "the original strictly-increasing REJECTION assumed the generator emits unique sample times — the first production sidecar (4003 anchors) carried 15 same-second ties and was bricked. Collapsing ties at parse keeps at-or-before unambiguous (last tie wins, deterministic) without rejecting real files; decreases still indicate corruption." }
          tdd_directives:
            - "valid minimal kash (2 anchors) parses"
            - "equal-ts ties collapse to the run's final anchor (not rejected)"
            - "rejects: wrong version, empty alignment, DECREASING ts, NaN ts, zero/negative/NaN duration, empty epub_hash, malformed JSON"

        - name: "anchor_at_or_before"
          inputs:
            - { name: "kash", type: "&Kash" }
            - { name: "ts", type: "f64" }
          output: "Option<&AlignmentEntry>"
          errors: []
          pseudocode:
            - "i = kash.alignment.partition_point(entry.ts <= ts)   # count of entries with ts <= target"
            - "if i == 0 return None   # ts is before the first anchor"
            - "return Some(&kash.alignment[i - 1])   # nearest at-or-before; for ts at/beyond the last anchor this is the LAST anchor (REQ-015: never skip unanchored tail)"
          call_annotations:
            - { call: "slice::partition_point", type: "STDLIB", target: "core" }
          tdd_directives:
            - "ts exactly on an anchor returns that anchor"
            - "ts in a gap returns the preceding anchor"
            - "ts beyond the last anchor returns the last anchor (AC-011)"
            - "ts before the first anchor returns None"

        - name: "resolve_target"
          inputs:
            - { name: "kash", type: "&Kash" }
            - { name: "furthest_ts", type: "f64" }
            - { name: "current_ts", type: "f64" }
          output: "Option<ResolvedTarget>"
          errors: []
          pseudocode:
            - "match anchor_at_or_before(kash, furthest_ts):"
            - "  Some(anchor) -> target = ResolvedTarget { cfi: anchor.cfi.clone(), ts: anchor.ts }"
            - "  None -> target = ResolvedTarget { cfi: first anchor's cfi, ts: 0.0 }   # 'before first anchor resolves to the start' (REQ-015/AC-011): ts 0 = audio start; the first anchor is the earliest CFI-addressable point for the ebook side"
            - "if target.ts <= current_ts return None   # never-backward, strict (REQ-006/REQ-015/AC-007 incl. the in-gap case: current resolved anchor == target anchor -> suppressed)"
            - "return Some(target)"
          call_annotations:
            - { call: "anchor_at_or_before", type: "NEW", target: "domain-kash" }
          invariants:
            - "Returned target.ts > current_ts (strictly) — a prompt target is never at/behind the opened position."
          decisions:
            - { key: "before-first-anchor", value: "ResolvedTarget{ts: 0.0, cfi: first anchor cfi}", rationale: "AC-011 'resolves to the start': ts 0 is the literal audio start; ebooks have no 'start CFI', and the first anchor is at most one sample (~4-18s) past the start — within the approximate-but-instant principle. The never-backward guard then suppresses it in virtually every real case." }
          tdd_directives:
            - "furthest in gap + current before that gap -> preceding anchor returned"
            - "furthest beyond last anchor -> last anchor (AC-011)"
            - "target anchor == current resolved anchor -> None (AC-007 in-gap)"
            - "target anchor behind current -> None; equal ts -> None (strict)"
            - "furthest before first anchor + current 0 -> None (target ts 0 not > 0)"

        - name: "chapter_label"
          inputs:
            - { name: "kash", type: "&Kash" }
            - { name: "ts", type: "f64" }
          output: "String"
          errors: []
          pseudocode:
            - "pct = clamp(ts / kash.duration_seconds, 0.0, 1.0) rendered as integer percent"
            - "find the chapter where start <= ts < end"
            - "if found return \"{chapter.title} — {pct}%\" else return \"{pct}%\"   # kash chapters may be empty/sparse"
          call_annotations:
            - { call: "f64::clamp", type: "STDLIB", target: "core" }
          tdd_directives:
            - "ts inside a chapter yields title + percent; ts outside any chapter yields percent only"

  # ==========================================================================
  # 2. domain-cross-format-contract — trait + DTOs (livrarr-domain/src/services/cross_format.rs)
  # ==========================================================================
  - name: "domain-cross-format-contract"
    responsibility: "CrossFormatService trait + ResumePrompt/ProgressKind/CrossFormatError. Signatures per IR v1 (minus DEV-1). trait_variant::make(Send), matching every other domain service."
    dependencies: ["domain-kash"]

    module_invariants:
      - "No types from walled-off crates in signatures (insight 9e); only domain types."

    capability_survey:
      - capability: "async trait pattern"
        existing_source: "livrarr-domain/src/services/file.rs (FileService)"
        reuse_decision: "reuse"
        rationale: "identical trait_variant::make(Send) + thiserror error enum shape"

    public_api:
      types:
        - kind: enum
          name: "ProgressKind"
          fields:
            - { name: "Progress", type: "genuine consumption — may advance furthest_ts" }
            - { name: "Seek", type: "manual jump/scrub — never advances furthest_ts (REQ-003)" }
          # serde: rename_all = "lowercase"; Default = Seek (see D-kind below). Derives Clone, Copy, PartialEq, Debug, Serialize, Deserialize.
        # ResumePrompt { format: MediaType, position: String, label: String } and
        # CrossFormatError { NotLinked, LinkStale, KashUnreadable, Db(String) } exactly per IR v1.

      functions:
        - name: "CrossFormatService (trait signatures)"
          inputs: []
          output: "see IR v1"
          errors: ["CrossFormatError"]
          pseudocode:
            - "resume_prompt(user_id, library_item_id, current_ts) -> Result<Option<ResumePrompt>, CrossFormatError>"
            - "anchors_for_item(user_id, library_item_id) -> Result<Vec<AlignmentEntry>, CrossFormatError>"
            - "decline_resume(user_id, library_item_id) -> Result<(), CrossFormatError>   # DEV-1: no current_ts"
            - "sync_to_here(user_id, library_item_id, current_ts) -> Result<(), CrossFormatError>"
          call_annotations:
            - { call: "trait_variant::make(Send)", type: "EXISTING", target: "project-wide async trait pattern (insight 8)" }
          decisions:
            - { key: "D-kind-default", value: "serde default for ProgressKind = Seek", rationale: "REQ-003: furthest advances ONLY from genuine progress. A stale cached frontend bundle sends no kind; defaulting to Progress would let old clients' scrubs advance the mark (poisoning). Defaulting to Seek merely delays advancement until the bundle refreshes — safe direction. In practice kind only matters when cross_format_ts is present, which only new clients send." }

  # ==========================================================================
  # 3. db-cross-format — migration 058 + KashLinkDb + CrossFormatStateDb (livrarr-db)
  # ==========================================================================
  - name: "db-cross-format"
    responsibility: "kash_links + cross_format_state tables; trait + SQLite impls mirroring PlaybackProgressDb (traits in lib.rs, impls in sqlite_kash_link.rs / sqlite_cross_format_state.rs)."
    dependencies: ["domain-cross-format-contract"]

    module_invariants:
      - "INSERT ... ON CONFLICT ... DO UPDATE only — the replace-style upsert is banned project-wide (contract forbidden_pattern, insight 20: it deletes+reinserts, losing FK children)."
      - "furthest_ts changes monotonically (MAX) everywhere except sync_to (REQ-016/REQ-018)."
      - "No file IO in this module — pure SQL."

    capability_survey:
      - capability: "upsert + row-mapping + error mapping conventions"
        existing_source: "crates/livrarr-db/src/sqlite_playback_progress.rs"
        reuse_decision: "reuse"
        rationale: "same table-per-user-item shape; copy map_db_err/parse_dt/row mapping style"
      - capability: "migration conventions (FK, timestamps)"
        existing_source: "crates/livrarr-db/migrations/ (latest 057)"
        reuse_decision: "reuse"
        rationale: "new file 058_cross_format.sql; never edit applied migrations (insight 19)"

    public_api:
      functions:
        - name: "migration 058_cross_format.sql"
          inputs: []
          output: "DDL"
          errors: []
          pseudocode:
            - "CREATE TABLE kash_links: id INTEGER PRIMARY KEY AUTOINCREMENT; audio_item_id INTEGER NOT NULL UNIQUE REFERENCES library_items(id) ON DELETE CASCADE; ebook_item_id INTEGER NOT NULL UNIQUE REFERENCES library_items(id) ON DELETE CASCADE; container_duration_secs REAL NOT NULL; epub_hash TEXT NOT NULL; created_at TEXT NOT NULL"
            - "CREATE TABLE cross_format_state: user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE; kash_link_id INTEGER NOT NULL REFERENCES kash_links(id) ON DELETE CASCADE; furthest_ts REAL NOT NULL DEFAULT 0; ebook_declined_at_ts REAL NULL; audio_declined_at_ts REAL NULL; updated_at TEXT NOT NULL; PRIMARY KEY (user_id, kash_link_id)"
            - "(table/column FK names: confirm 'users' / 'library_items' spelling against an existing migration before writing — convention copy, not invention)"
          call_annotations:
            - { call: "sqlx migrate", type: "EXISTING", target: "migration runner" }
          invariants:
            - "UNIQUE(audio_item_id) + UNIQUE(ebook_item_id) = 1:1 links (IR v1 round-3 decision)."
            - "ON DELETE CASCADE: deleting either library item dissolves the link and its per-user state (REQ-008 'both items present' holds trivially after deletes)."

        - name: "KashLinkDb::upsert_link"
          inputs: [{ name: "link", type: "NewKashLink" }]
          output: "Result<KashLink, DbError>"
          errors: ["DbError"]
          pseudocode:
            - "begin transaction"
            - "existing = SELECT * FROM kash_links WHERE audio_item_id = ? (on the tx)"
            - "if existing is None: INSERT the row; on SQLite constraint violation (UNIQUE ebook_item_id — that ebook is already in another link) map to DbError::Constraint and bubble up (caller treats as first-link-wins, see establish_kash_link); commit; return row"
            - "identity_changed = existing.ebook_item_id != link.ebook_item_id OR existing.epub_hash != link.epub_hash OR |existing.container_duration_secs - link.container_duration_secs| > DURATION_TOLERANCE_SECS"
            - "if identity_changed: DELETE FROM cross_format_state WHERE kash_link_id = existing.id (on the tx) — a furthest_ts recorded against a different alignment/timeline must not be reinterpreted (review r1 R-001)"
            - "UPDATE kash_links SET ebook_item_id, container_duration_secs, epub_hash WHERE id = existing.id; UNIQUE(ebook_item_id) violation -> DbError::Constraint (rollback)"
            - "commit; return updated row"
          call_annotations:
            - { call: "sqlx tx + query", type: "EXISTING", target: "sqlx transactions (existing usage in livrarr-db)" }
          postconditions:
            - "Same-identity refresh (same ebook, same hash, duration within tolerance): cross_format_state rows survive."
            - "Identity-changing relink: that link's cross_format_state rows are gone — every user's mark restarts from zero on the new alignment."
          decisions:
            - { key: "conflict-target", value: "explicit SELECT-then-INSERT/UPDATE in one tx; UNIQUE(ebook_item_id) violations surface as Constraint errors", rationale: "the scan hook is keyed by the audio item (it found the .kash); a second audio claiming an already-linked ebook is the documented v1 multi-narration limitation — first link wins, caller logs and continues" }
            - { key: "reset-state-on-identity-change", value: "link identity = (ebook_item_id, epub_hash, duration within tolerance); any change deletes the link's cross_format_state in the same tx", rationale: "furthest_ts lives on the AUDIO timeline — a duration change means a different audio cut, so an old mark can resolve near a wrong position (e.g. past the end of a shorter rip); an ebook/hash change is reset conservatively too (rare event, Whispersync parity: replacing the files restarts the shared mark; per-item playback_progress and bookmarks are untouched). Review r1 R-001." }
          tdd_directives:
            - "fresh insert returns the row"
            - "re-upsert same identity with duration drift WITHIN tolerance preserves cross_format_state rows"
            - "re-upsert with changed epub_hash (or changed ebook_item_id, or duration drift beyond tolerance) deletes that link's cross_format_state rows; other links' state untouched"
            - "upsert linking a NEW audio item to an ALREADY-LINKED ebook returns Constraint error (not silent overwrite)"

        - name: "KashLinkDb::delete_link_for_audio"
          inputs: [{ name: "audio_item_id", type: "LibraryItemId" }]
          output: "Result<(), DbError>"
          errors: ["DbError"]
          pseudocode:
            - "DELETE FROM kash_links WHERE audio_item_id = ?   # cross_format_state rows die via ON DELETE CASCADE; idempotent when no row exists"
          call_annotations:
            - { call: "sqlx::query", type: "EXISTING", target: "db delete pattern" }
          postconditions:
            - "No link row for that audio item -> the extended upsert_progress finds no link and advances nothing (the R-003 poison window is structurally closed)."
          tdd_directives:
            - "deleting a link removes its cross_format_state rows; deleting a non-existent link succeeds"

        - name: "KashLinkDb::link_for_item"
          inputs: [{ name: "library_item_id", type: "LibraryItemId" }]
          output: "Result<Option<KashLink>, DbError>"
          errors: ["DbError"]
          pseudocode:
            - "SELECT * FROM kash_links WHERE audio_item_id = ? OR ebook_item_id = ? LIMIT 1; map to Option<KashLink>"
          call_annotations:
            - { call: "sqlx fetch_optional", type: "EXISTING", target: "sqlite_playback_progress.rs get pattern" }
          invariants:
            - "Both UNIQUE constraints guarantee at most one row matches either column."
          tdd_directives:
            - "found via audio id; found via ebook id; None for unlinked item"

        - name: "CrossFormatStateDb::get_or_default"
          inputs: [{ name: "user_id", type: "UserId" }, { name: "kash_link_id", type: "i64" }]
          output: "Result<CrossFormatState, DbError>"
          errors: ["DbError"]
          pseudocode:
            - "SELECT by (user_id, kash_link_id); if no row return CrossFormatState { user_id, kash_link_id, furthest_ts: 0.0, ebook_declined_at_ts: None, audio_declined_at_ts: None } WITHOUT inserting (read-only default)"
          call_annotations:
            - { call: "sqlx fetch_optional", type: "EXISTING", target: "db read pattern" }
          tdd_directives:
            - "missing row returns zero-default without creating a row; existing row round-trips all fields"

        - name: "CrossFormatStateDb::set_decline"
          inputs: [{ name: "user_id", type: "UserId" }, { name: "kash_link_id", type: "i64" }, { name: "format", type: "MediaType" }, { name: "declined_at_ts", type: "f64" }]
          output: "Result<(), DbError>"
          errors: ["DbError"]
          pseudocode:
            - "column = ebook_declined_at_ts when format == Ebook else audio_declined_at_ts"
            - "INSERT (user_id, kash_link_id, furthest_ts=0 default, {column}=?, updated_at=now) ON CONFLICT(user_id, kash_link_id) DO UPDATE SET {column} = excluded.{column}, updated_at = excluded.updated_at   # two static SQL strings, one per format — no string interpolation of user data"
          call_annotations:
            - { call: "sqlx::query", type: "EXISTING", target: "upsert pattern" }
          postconditions:
            - "Only the named format's threshold changes; furthest_ts untouched (REQ-005: decline never resets furthest)."
          tdd_directives:
            - "decline on ebook leaves audio threshold + furthest untouched (and vice versa); works when no state row existed yet"

        - name: "CrossFormatStateDb::sync_to"
          inputs: [{ name: "user_id", type: "UserId" }, { name: "kash_link_id", type: "i64" }, { name: "ts", type: "f64" }]
          output: "Result<(), DbError>"
          errors: ["DbError"]
          pseudocode:
            - "INSERT (user_id, kash_link_id, furthest_ts=?, updated_at=now) ON CONFLICT(user_id, kash_link_id) DO UPDATE SET furthest_ts = excluded.furthest_ts, ebook_declined_at_ts = NULL, audio_declined_at_ts = NULL, updated_at = excluded.updated_at   # explicit override: may DECREASE (REQ-018)"
          call_annotations:
            - { call: "sqlx::query", type: "EXISTING", target: "upsert pattern" }
          decisions:
            - { key: "sync-clears-declines", value: "sync_to NULLs both declined_at thresholds", rationale: "a deliberate position reset re-arms prompting from the new baseline; stale thresholds from the pre-sync timeline would suppress prompts the user now expects" }
          tdd_directives:
            - "sync below current furthest decreases it (AC-016); both decline thresholds cleared"

  # ==========================================================================
  # 4. progress-extension — atomic furthest advance inside upsert_progress
  # ==========================================================================
  - name: "progress-extension"
    responsibility: "Extend PlaybackProgressDb::upsert_progress + FileService::update_progress + the PUT /workfile/{id}/progress handler to carry kind + cross_format_ts; the SQLite impl performs the playback write AND the furthest advance in ONE transaction. REQ-003, REQ-016."
    dependencies: ["domain-cross-format-contract", "db-cross-format"]

    module_invariants:
      - "playback_progress write semantics (incl. finished_at lifecycle and the no-lifecycle audio branch) are byte-for-byte unchanged when kind=Seek or cross_format_ts=None."
      - "The furthest advance never occurs outside the same SQLite transaction as the progress write (IR v1 atomicity invariant)."
      - "No link validation (file IO) on the write path — the write advances furthest on whatever link row exists; the READ side (resume_prompt/anchors) gates all offers on validation, and the SCAN side reconciles: a rescan that finds the sidecar gone or duration-mismatched DELETES the link row (cascading its state), so wrong-timeline marks cannot accumulate against a link that later returns to validity (r2 R-003; see establish_kash_link reconciliation + scan-granularity residual decision). Keeps the hot save path IO-free."

    capability_survey:
      - capability: "existing upsert + lifecycle SQL"
        existing_source: "sqlite_playback_progress.rs:60 (upsert_progress)"
        reuse_decision: "wrap"
        rationale: "same statement, now executed on a transaction handle; cross-format statement appended conditionally"
      - capability: "transactions"
        existing_source: "sqlx pool.begin() (used elsewhere in livrarr-db)"
        reuse_decision: "reuse"
        rationale: "standard sqlx tx"

    public_api:
      functions:
        - name: "PlaybackProgressDb::upsert_progress (extended signature)"
          inputs:
            - { name: "user_id", type: "UserId" }
            - { name: "library_item_id", type: "LibraryItemId" }
            - { name: "position", type: "&str" }
            - { name: "progress_pct", type: "f64" }
            - { name: "kind", type: "ProgressKind" }
            - { name: "cross_format_ts", type: "Option<f64>" }
          output: "Result<(), DbError>"
          errors: ["DbError"]
          pseudocode:
            - "if kind == Seek OR cross_format_ts is None OR cross_format_ts is not finite: execute the EXISTING single upsert statement unchanged and return (no tx overhead on the common path)"
            - "begin transaction"
            - "execute the existing playback_progress upsert (unchanged SQL incl. finished_at CASE) on the tx"
            - "SELECT id FROM kash_links WHERE audio_item_id = ? OR ebook_item_id = ? (the reporting item) on the tx"
            - "if a link row exists: INSERT INTO cross_format_state (user_id, kash_link_id, furthest_ts, updated_at) VALUES (?,?,?,now) ON CONFLICT(user_id, kash_link_id) DO UPDATE SET furthest_ts = MAX(cross_format_state.furthest_ts, excluded.furthest_ts), updated_at = excluded.updated_at   # SQLite scalar max() — monotonic"
            - "commit"
          call_annotations:
            - { call: "pool.begin / tx.commit", type: "EXISTING", target: "sqlx transactions (IR v1 framework; existing usage in livrarr-db)" }
            - { call: "existing upsert SQL", type: "EXISTING", target: "sqlite_playback_progress.rs:73-94" }
            - { call: "max()", type: "EXISTING", target: "SQLite builtin scalar, via the existing sqlx layer" }
          preconditions:
            data_invariants:
              - "cross_format_ts, when Some, is the reporting item's position in audio-timestamp space (audio: native seconds; ebook: anchor-resolved by the client)."
          postconditions:
            - "kind=Progress + linked item: furthest_ts' = max(furthest_ts, cross_format_ts); declines untouched."
