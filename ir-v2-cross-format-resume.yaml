    REQ-013: ["reuse of existing bookmark store/UI"]
    REQ-014: ["DURATION_TOLERANCE_SECS check (scan + validate)", "no file-size use"]
    REQ-015: ["anchor_at_or_before", "resolve_target", "before-first decision"]
    REQ-016: ["MAX() monotonic upsert", "honor-shown-target (frontend jumps to delivered position)"]
