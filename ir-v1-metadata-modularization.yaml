# IR v1 — Structural
# Feature: metadata-modularization
# Framing: REORGANIZATION, not a rebuild. Decompose the ~20.6k-LOC livrarr-metadata
# monolith into FOUR library crates on a shared substrate, with a one-way
# Identity -> Enrichment boundary that is COMPILE-ENFORCED via the existing
# compile-wall pattern (insight 9b/9e — livrarr-handlers is already walled). The
# four crates: livrarr-providers (shared substrate), livrarr-identity, livrarr-enrichment,
# livrarr-materialize; plus the EstablishedIdentity CONTRACT in livrarr-domain (the leaf).
# Method: C' structured extraction (decision-metadata-modularization-sequencing.md v3) —
# extract the stable foundation + ports first (Track 1, behavior-preserving), then cut
# each feature-touched seam via its feature INTO the target crate (Track 2). First move =
# extract livrarr-providers as a FALSIFIABLE CANARY (GO iff no back-edge providers->metadata).
#
# Reuses & RELOCATES (NOT replaces): NormalizedWorkDetail/ProviderOutcome (lib.rs ->
# providers), provider_client/provider_queue/6 clients/transport_cache (-> providers),
# english_identity_resolver/async_resolver/bulk_resolver/llm_validator (-> identity),
# merge engine + enrichment_workflow_service (-> enrichment), cover*/preadd_cover_service
# (-> materialize). The federated identity types (CapturedIdentity/IdentityState — WCC
# f78f3bc, already on main) are PROMOTED to the EstablishedIdentity contract in domain.
#
# v1 (2026-06-02): initial architecture, distilled from the decision brief (§2.2 module->crate
# map, §2.3 the 8 seams, §6 the three tracks) + the design seed (the 7 PO-locked decisions).
# Folds WCC's Track-2 feature REQs (GR ladder / cover-decouple / two-state-machines / Bug #2 /
# de-facto identity) as the seam-cutting forcing functions.

metadata:
  feature: metadata-modularization
  stage: v1-structural
  spec_ref: spec-metadata-modularization.md
  decision_ref: docs/decision-metadata-modularization-sequencing.md
  design_ref: design-metadata-modularization.md
  folds: work-creation-consistency
  version: 1

system_architecture:
  components:
    - name: livrarr-domain
      type: library
      description: "THE LEAF. Gains the `EstablishedIdentity` CONTRACT type (promote WCC's federated CapturedIdentity/IdentityState — anchors+bridges+title+author+language+state+method+generation; NO metadata field, REQ-007). Hosts the cross-crate service TRAITS (DiscoveryService, EnrichmentService, MaterializeService) so siblings depend on contracts, not each other (insight 9e). Zero outward deps."
    - name: livrarr-providers
      type: library
      description: "NEW. The shared STATELESS dumb-pipe substrate (REQ-004): provider_client (HTTP fetch), the 6 clients (openlibrary/hardcover/google_books/goodreads/audnexus/audible), llm_caller (LLM HTTP transport only), transport_cache (in-memory (provider,key) payload cache), language, parsers (response->NormalizedWorkDetail), normalize. OWNS the relocated contract types NormalizedWorkDetail + ProviderOutcome (out of metadata lib.rs, REQ-005/BT-003). Exposes BOTH a discovery/search surface AND an enrichment-fetch surface (REQ-005). Owns the GCRA limiter + circuit-breaker (REQ-022). Depends ONLY on domain + http — NO livrarr-db (REQ-006). REVIEW-FIX r1: provider_queue, llm_scraper, title_cleanup are NOT here (see below). The canary (REQ-011)."
    - name: livrarr-identity
      type: library
      description: "NEW. 'What work is this?' — english_identity_resolver (-> the tier-scoped multi-provider resolver), async_resolver + bulk_resolver (Background convergence), llm_validator, llm_scraper (GR scrape POLICY + prompts — REVIEW-FIX r1, moved out of the dumb pipe), title_cleanup (matching heuristic — REVIEW-FIX r1), and the re-homed inline discovery policy (lookup_filtered, seam #5). Owns the GR anti-bot ACCESS LADDER (REQ-018, seam #5) + its OWN negative-resolution/seed cache (REVIEW-FIX r1, gemini #5 — distinct from providers' HTTP payload cache: caches 'this seed resolved to nothing across tiers' to avoid redundant fan-outs). Produces EstablishedIdentity. Depends on domain + providers. MUST NOT depend on livrarr-enrichment (REQ-002, sibling)."
    - name: livrarr-enrichment
      type: library
      description: "NEW. 'Fill the work's metadata record' — the merge engine + enrichment_workflow_service + the enrich spine + **provider_queue (the durable queue + retry orchestration; reads the livrarr-db provider_retry_state table — REVIEW-FIX r1: this is why the queue is NOT in providers)** (from metadata lib.rs). Consumes EstablishedIdentity (the contract, not identity) + the warmed provider cache. Owns the two-state-machine ENRICHMENT track (Unenriched/Enriched/Thin) + Fork-F status reclassification (REQ-014/019, seams #2/#4). On a remote identity contradiction it EMITS a domain IdentityContradiction event/error (REVIEW-FIX r1) — it MUST NOT write identity state (REQ-002); livrarr-server catches it and invokes livrarr-identity. Drives Bug #2 id-change invalidation via the db merge txn (REQ-020). Depends on domain + providers + livrarr-db (the queue/retry-state + merge). MUST NOT depend on livrarr-identity (REQ-002, sibling)."
    - name: livrarr-materialize
      type: library
      description: "NEW. 'Project the record onto artifacts: cover image + file tags' — cover*, cover_alternatives, preadd_cover_service, tag projection (seams #3/#7/#8). Two entry points: SYNC materialize_cover(work_id) (add path blocks on it) + ASYNC materialize_tags(...) (heavy/fragile disk writes, REQ-019). Idempotent on merge_generation > tag_generation (REQ-021). Depends on domain + db + tagwrite + http. MUST NOT depend on enrichment (REQ-003 — library/import path uses it without enrichment's network/LLM deps)."
    - name: livrarr-metadata
      type: library
      description: "SHRINKS to a thin re-export / facade during migration, then is emptied. Post-extraction it holds only what has not yet been distributed (the list/author/series/rss workflows, ~3,500 LOC) until Track-2 relocates them to server/identity/enrichment. NO code lands BACK here (REQ-010)."
    - name: livrarr-server
      type: service
      description: "Composition root (unchanged role). Wires the flow via work state + jobs: identity discovery -> add; enrichment after add; a materialize JOB that reacts to merge_generation deltas (REQ-021 — the enrichment->materialize 'arrow' is a DATA-FLOW via the generation counter, NOT a crate edge, so failure-isolation REQ-003 holds). Distributes the workflow services (list/author/series/rss) that consume the new crates."
    - name: livrarr-handlers
      type: library
      description: "Add Work + manual_import seams call DiscoveryService (domain trait) + MaterializeService::materialize_cover (sync). Unchanged compile wall (still walled off db/metadata/tagwrite/download — now also providers/identity/enrichment; binds domain traits only)."
    - name: frontend
      type: frontend
      description: "Surfaces the two independent tracks (REQ-014): identity badges (pending/confirmed/provisional/conflict/needs-review) vs enrichment badges (unenriched/enriched/thin). Cover may arrive after Enriched (REQ-019, fast-then-upgrade). No new screens."
  connections:
    - { from: livrarr-providers, to: livrarr-domain, protocol: in-process, description: "owns NormalizedWorkDetail/ProviderOutcome; consumes domain ids/traits" }
    - { from: livrarr-identity, to: livrarr-providers, protocol: in-process, description: "discovery surface + fetch surface; warms the (provider,key) cache (REQ-008/017)" }
    - { from: livrarr-identity, to: livrarr-domain, protocol: in-process, description: "produces EstablishedIdentity; impls DiscoveryService trait" }
    - { from: livrarr-enrichment, to: livrarr-providers, protocol: in-process, description: "enrichment-fetch surface; reads the warmed cache (tops up only what's missing, REQ-017)" }
    - { from: livrarr-enrichment, to: livrarr-domain, protocol: in-process, description: "consumes EstablishedIdentity (contract); impls EnrichmentService trait; emits IdentityContradiction. Does NOT see livrarr-identity (REQ-002)" }
    - { from: livrarr-enrichment, to: livrarr-db, protocol: in-process, description: "REVIEW-FIX r1: owns the DB-stateful provider_queue (provider_retry_state via ProviderRetryStateDb) + the merge CAS txn (Bug #2, REQ-020)" }
    - { from: livrarr-server, to: livrarr-identity, protocol: in-process, description: "composes the resolver; ROUTES the enrichment-emitted IdentityContradiction event -> DiscoveryService to set state->Conflict (REVIEW-FIX r1, seam #2)" }
    - { from: livrarr-materialize, to: livrarr-domain, protocol: in-process, description: "reads the canonical record via domain types; impls MaterializeService trait" }
    - { from: livrarr-materialize, to: livrarr-tagwrite, protocol: in-process, description: "EPUB/m4b tag writing (existing)" }
    - { from: livrarr-handlers, to: livrarr-domain, protocol: in-process, description: "DiscoveryService + MaterializeService via Has* bounds (compile wall)" }
    - { from: livrarr-server, to: livrarr-enrichment, protocol: in-process, description: "composes the enrich spine" }
    - { from: livrarr-server, to: livrarr-materialize, protocol: in-process, description: "runs the materialize job (generation-delta driven, REQ-021)" }
    - { from: frontend, to: livrarr-handlers, protocol: HTTP, description: "REST API; two-track status surface" }
  deployment:
    topology: single-process
    notes: "All Rust crates compile to one binary; frontend is a static SPA served by the same process. FOUR new crates, but NO new third-party dependencies and NO new compile-wall infrastructure (reuses insight 9b/9e). The new walls are enforced the same way livrarr-handlers' wall is — by the dependency graph + cargo tree."

languages:
  - { language: Rust, version: "1.80+", usage: primary backend }
  - { language: TypeScript, version: "5.x", usage: frontend (React SPA) }

frameworks:
  - { name: axum, version: "0.8", usage: HTTP framework (existing) }
  - { name: React, version: "19", usage: frontend UI (existing) }
  - { name: TanStack Query, version: "5", usage: frontend data fetching (existing) }

# Identical to WCC IR (D-012: no new deps). Listed so the compliance gate can validate LIBRARY annotations.
approved_libraries:
  - { name: serde, version: "1", usage: "Serialization (existing)" }
  - { name: sqlx, version: "0.8", usage: "DB queries + migrations (existing)" }
  - { name: chrono, version: "0.4", usage: "DateTime (existing)" }
  - { name: tokio, version: "1", usage: "Async runtime, spawn_blocking, time::timeout (existing)" }
  - { name: reqwest, version: "0.12", usage: "Provider HTTP via livrarr-http clients (existing)" }
  - { name: quick-xml, version: "0.37", usage: "EPUB OPF parsing (existing)" }
  - { name: trait-variant, version: "0.1", usage: "Send async traits (existing)" }
  - { name: thiserror, version: "2", usage: "Typed error enums (existing)" }
  - { name: uuid, version: "1", usage: "v4 CandidateId — already a DIRECT dep of livrarr-metadata, moves with providers/identity" }
  - { name: governor, version: "0.10", usage: "GCRA rate limiter (existing; moves into providers)" }

# ---------------------------------------------------------------------------
decisions:
  - id: D-001
    topic: "Four crates + the EstablishedIdentity contract in domain — the physical decomposition"
    choice: "Split livrarr-metadata into livrarr-providers (substrate), livrarr-identity, livrarr-enrichment, livrarr-materialize, and add the EstablishedIdentity contract type to livrarr-domain (the leaf). Module->crate map per decision brief §2.2 (see `modules` below). NOT a parallel rebuild — every module RELOCATES, behavior-preserving (REQ-009)."
    rationale: "Design decision 6a/6b (PO-locked 2026-06-02): three concerns on a shared substrate; Materialize is its own box (cardinality 1:N + failure isolation + per-format policy). The contract lives in the leaf so siblings depend on it, not each other."
  - id: D-002
    topic: "One-way Identity->Enrichment is compile-enforced via non-dependent siblings (REQ-002)"
    choice: "livrarr-identity and livrarr-enrichment are SIBLINGS — neither is in the other's Cargo.toml. They share types ONLY through livrarr-domain (EstablishedIdentity + the service traits). Enforced exactly like the existing handlers compile wall (insight 9b): verified by `cargo tree`. Enrichment cannot call into identity to mutate an anchor because it cannot NAME any identity symbol."
    rationale: "Design decision 1 + 6a. Compile-time is the only durable enforcement of one-way; a doc convention rots. The codebase already proves this pattern works (handlers walled off db/metadata/tagwrite/download)."
  - id: D-003
    topic: "Materialize is decoupled from Enrichment via the merge_generation counter, not a crate edge (REQ-003/021)"
    choice: "Enrichment does NOT depend on livrarr-materialize. After a merge, enrichment bumps merge_generation (existing field). A server-run materialize JOB reacts to `merge_generation > tag_generation` and projects artifacts. The SYNC materialize_cover(work_id) is called by the add path (handlers/server), not by enrichment. So the design diagram's 'enrichment ---> materialize' arrow is a DATA-FLOW (via the DB generation counter), not a compile dependency."
    rationale: "REQ-003 failure isolation: the audio-tag OOM class must not be able to stall enrichment; if enrichment doesn't depend on materialize, a materialize panic is structurally unable to reach the enrich spine. REQ-021 idempotency (generation-delta) makes the reaction self-healing + retriable. Also lets livrarr-library depend on materialize without pulling enrichment."
  - id: D-004
    topic: "Promote WCC's federated identity types to the EstablishedIdentity contract (DRY — do not invent a parallel type)"
    choice: "The contract IS the existing WCC CapturedIdentity (federated anchors+bridges) wrapped with state/method/generation = the existing IdentityState. Relocate these from where WCC landed them into the domain contract surface; add NO new parallel 'EstablishedIdentity' struct if the federated types already express it (resolve Q-003 at design)."
    rationale: "WCC D-001 (reuse-and-widen, never build parallel types). The federated CapturedIdentity already carries exactly {ol/gr/hc/isbn/asin + title + author + language}; adding {state, method, generation} completes the contract. A second identity type would re-introduce the duplication WCC just removed."
  - id: D-005
    topic: "providers exposes TWO surfaces; the contract types move FIRST (the canary, REQ-005/011)"
    choice: "livrarr-providers exposes (a) a DISCOVERY/search surface (consumed by identity's discovery policy — the re-homed lookup_filtered) and (b) an ENRICHMENT-FETCH surface (ProviderClient::fetch — consumed by enrichment). The relocation of NormalizedWorkDetail + ProviderOutcome out of metadata lib.rs into providers is step 1 AND the falsification test: if metadata compiles against providers with no back-edge, GO."
    rationale: "Decision brief §6.2 (Codex's baked-in refinement): the enrichment shape != the discovery shape, so a fetch-only providers crate cannot serve lookup_filtered. Both surfaces + the contract types are the thing that makes C' real. The relocation is cheap + reversible = the ideal canary."
  - id: D-006
    topic: "Cross-crate triggering via domain service traits (DiscoveryService / EnrichmentService / MaterializeService)"
    choice: "Each crate's outward-facing capability is a TRAIT in livrarr-domain; the crate provides the impl; livrarr-server composes. Handlers bind Has* capability traits (insight 9h) for DiscoveryService + MaterializeService. This keeps siblings decoupled (D-002) and preserves the handler compile wall. trait_variant::make(Send) (non-dyn — enum/generic dispatch, insight 8)."
    rationale: "The established trait+impl+stub pattern (insight 7) + Has* capability binding (9h) is how every existing service boundary works. Reusing it for the new crate seams means zero new architectural mechanism — just more of the same wall."
  - id: D-007
    topic: "Track sequencing (not strict phases) — Track 0 stabilize, Track 1 stable-first, Track 2 feature-cuts (REQ-009/010/011)"
    choice: "Track 0: the in-flight WCC green work is the clean baseline (this worktree = HEAD). Track 1 (behavior-preserving, independent of features): extract providers (canary), then materialize, then promote the contract. Track 2 (feature-cuts, into the target crate): discovery seam via the GR ladder (-> identity/providers); cover seam via cover-decouple (-> materialize); status seam via the two-state-machine split (-> identity+enrichment). Each Track-2 cut DELETES the monolith code, never duplicates it."
    rationale: "C' (decision brief §6/§8). The clean ~73% (providers/materialize/contract) extracts cheaply first; the three messy couplings are cut by the three features that already had to touch them — avoiding both throwaway ports and more-in-the-monolith."
  - id: D-008
    topic: "Workflow ownership — list/author/series/rss are NOT a 5th crate; they decompose along the new boundaries (REVIEW-FIX r1, codex MAJOR #1)"
    choice: "The ~3,500 LOC of list/author/series/rss workflows are NOT left as an undifferentiated 'distribute later' bucket. Each decomposes: ORCHESTRATION (the per-user tick, batching, scheduling) -> livrarr-server/jobs (the composition root already owns background ticks, insight 36); IDENTITY decisions (resolve a seed, monitor a new work) -> via DiscoveryService (identity); ENRICHMENT calls -> via EnrichmentService; provider scraping (e.g. OL author-works fetch) -> via providers' ProviderDiscovery. No workflow keeps its own inline provider/identity/enrichment logic. They become thin orchestrators over the three domain service ports."
    rationale: "codex MAJOR: these workflows call add/discovery/provider code, so 'distribute later' hid a fifth migration area. Decomposing them along the SAME service-port boundaries (D-006) means they need no new crate and cannot re-introduce the monolith's inline coupling. The orchestration-in-server pattern already exists (author_monitor tick, insight 36)."

# ---------------------------------------------------------------------------
# MODULES = the target crates. Each lists what it ABSORBS (module->crate map, brief §2.2),
# the SEAMS it cuts (brief §2.3), its deps, and its outward port. Acyclic + one-way.
# ---------------------------------------------------------------------------
modules:
  # ── livrarr-domain (the contract) ──
  - name: domain-established-identity
    responsibility: "Add the EstablishedIdentity contract (promote WCC CapturedIdentity+IdentityState; +state/method/generation; NO metadata, REQ-007) and the three cross-crate service traits (DiscoveryService, EnrichmentService, MaterializeService). The leaf — zero outward deps; names no provider payload type (insight 9e)."
    absorbs: ["(new contract surface — promotes existing federated identity types already in domain)"]
    cuts_seams: []
    req_ids: [REQ-001, REQ-002, REQ-007, REQ-012, REQ-014]
    dependencies: []
    public_api:
      types:
        - kind: struct
          name: EstablishedIdentity
          description: "The one-way contract Identity hands Enrichment. Pure identity, no metadata (REQ-007). Promotes WCC CapturedIdentity (anchors+bridges) + the {state, method, generation} envelope."
          fields:
            - { name: work_id, type: WorkId }
            - { name: anchors, type: CapturedIdentity, description: "ol/gr/hc/isbn/asin + title + author + language (existing WCC federated type)" }
            - { name: state, type: IdentityState, description: "Pending|Confirmed|Provisional|Conflict|NeedsReview (the IDENTITY state machine, REQ-014)" }
            - { name: method, type: IdentityMethod }
            - { name: generation, type: i64, description: "bumps on anchor add / user edit; re-fires enrichment (REQ-013/015)" }
        - kind: enum
          name: "IdentityState (REQ-014 — the identity track)"
          variants:
            - { name: Pending, description: "fuzzy title+author, no key — hold enrichment (converge first)" }
            - { name: Confirmed, description: "has a resolved WORK anchor (ol/gr/hc) — enrich" }
            - { name: Provisional, description: "ISBN resolved, no work anchor — enrich (the point of Provisional; the REQ-016 de-facto identity state). Upgrades to Confirmed when a work anchor appears." }
            - { name: Conflict, description: "contradicting anchor — pause (user resolves)" }
            - { name: NeedsReview, description: "unresolvable residue — hold (user resolves)" }
        - kind: trait
          name: DiscoveryService
          description: "Identity's outward port (impl in livrarr-identity). resolve(user_id, seed, tier) -> Resolution. Handlers bind HasDiscoveryService."
        - kind: trait
          name: EnrichmentService
          description: "Enrichment's outward port (impl in livrarr-enrichment). enrich(established: &EstablishedIdentity) -> Result<EnrichOutcome, EnrichmentError>. Consumes the contract, never the identity crate (REQ-002). REVIEW-FIX r1: when a remote fetch reveals an identity contradiction, it returns EnrichOutcome::Contradiction(IdentityContradiction) — it does NOT write identity state; livrarr-server routes the event to livrarr-identity."
        - kind: struct
          name: IdentityContradiction
          description: "REVIEW-FIX r1 (BLOCKER both families) — the replacement path for seam #2. Emitted by EnrichmentService when a provider/LLM result contradicts the established identity (e.g. a fetched anchor disagrees). Pure domain value: { work_id, observed_anchor: WorkIdentityAnchor, against: AnchorType, source: MetadataProvider }. livrarr-server (composition root) catches it and invokes livrarr-identity (DiscoveryService) to transition the Work to IdentityState::Conflict transactionally (REQ-002 one-way preserved: enrichment never mutates identity; it only reports evidence)."
        - kind: trait
          name: MaterializeService
          description: "Materialize's outward port (impl in livrarr-materialize). SYNC materialize_cover(work_id) + ASYNC materialize_tags(work_id). Handlers/library bind HasMaterializeService (REQ-019)."
      enrichment_state_machine:
        - kind: enum
          name: "EnrichmentState (REQ-014 — the SEPARATE enrichment track)"
          variants:
            - { name: Unenriched, description: "not yet filled" }
            - { name: Enriched, description: "identity + >=1 meaningful text field (cover NOT required, REQ-019)" }
            - { name: Thin, description: "confirmed identity but no meaningful text -> needs-review surface (REQ-014/019)" }

  # ── livrarr-providers (the substrate + the canary) ──
  - name: providers-substrate
    responsibility: "The shared STATELESS dumb pipe + in-memory cache (REQ-004). RELOCATE from metadata: provider_client, the 6 clients, llm_caller (LLM HTTP transport), transport_cache (in-memory payload cache), language, parsers, normalize, and the contract types NormalizedWorkDetail + ProviderOutcome (out of lib.rs, REQ-005). Expose discovery + fetch surfaces. Own GCRA + circuit-breaker + the in-memory cache keyed (provider, provider-key) (REQ-008). Depends ONLY on domain + http — NO livrarr-db (REQ-006). REVIEW-FIX r1 (BLOCKER, both families, VERIFIED provider_queue.rs:33 imports livrarr_db): provider_queue is DB-stateful (durable provider_retry_state) -> it STAYS in livrarr-enrichment, NOT here; otherwise providers gains a providers->db back-edge that dooms the canary + breaks the dumb-pipe invariant. llm_scraper (scrape policy) + title_cleanup (matching heuristic) move to livrarr-identity (policy, not mechanism)."
    absorbs: [provider_client, openlibrary_client, hardcover_client, google_books_client, goodreads_client, audnexus_client, audible_client, llm_caller, transport_cache, language, parsers, normalize, "NormalizedWorkDetail (from lib.rs)", "ProviderOutcome (from lib.rs)"]
    does_not_absorb: ["provider_queue -> livrarr-enrichment (DB-stateful, REVIEW-FIX r1)", "llm_scraper -> livrarr-identity (scrape policy)", "title_cleanup -> livrarr-identity (matching heuristic)"]
    cuts_seams: ["#1 provider_queue <- EnrichmentMode/EnrichmentContext: RESOLVED by keeping the queue in enrichment (REVIEW-FIX r1). providers' fetch surface takes a providers-local mechanical FetchRequest; EnrichmentContext/mode/priority stay enrichment-side and never enter providers."]
    req_ids: [REQ-004, REQ-005, REQ-006, REQ-008, REQ-011, REQ-017, REQ-022, REQ-023]
    dependencies: [domain-established-identity]
    public_api:
      types:
        - kind: struct
          name: "NormalizedWorkDetail (RELOCATED from livrarr-metadata lib.rs)"
          description: "The normalized per-provider payload. Now OWNED by providers so any consumer (identity, enrichment) uses it without depending on the monolith (REQ-005/BT-003)."
        - kind: enum
          name: "ProviderOutcome (RELOCATED from livrarr-metadata lib.rs)"
          description: "fetch result taxonomy (Ok/NotFound/WillRetry/...). Relocated with NormalizedWorkDetail."
        - kind: trait
          name: ProviderDiscovery
          description: "Surface (a): cost-ordered search by seed -> Vec<NormalizedWorkDetail> (warms the cache). Consumed by identity's discovery policy (the re-homed lookup_filtered)."
        - kind: trait
          name: ProviderFetch
          description: "Surface (b): fetch(&Work, &request) -> ProviderOutcome<NormalizedWorkDetail> (the existing enrichment shape). Consumed by enrichment."
      functions:
        - { name: cache_warm, inputs: [{name: provider, type: MetadataProvider}, {name: provider_key, type: "&str"}, {name: payload, type: NormalizedWorkDetail}], output: "()", errors: [], description: "store under (provider, provider-key) — never work_id (REQ-008); subject to retention (REQ-023)." }
        - { name: cache_take, inputs: [{name: provider, type: MetadataProvider}, {name: provider_key, type: "&str"}], output: "Option<NormalizedWorkDetail>", errors: [], description: "enrichment reads the warmed payload; tops up only the misses (REQ-017)." }

  # ── livrarr-identity (what work is this?) ──
  - name: identity-resolver
    responsibility: "RELOCATE from metadata: english_identity_resolver (-> tier-scoped multi-provider resolver, the #97 fix), async_resolver + bulk_resolver (Background convergence), llm_validator. RE-HOME the inline discovery policy (lookup_filtered, seam #5) consuming providers' ProviderDiscovery. Produce EstablishedIdentity. Owns ADD/CONFLICT/EDIT monotonic write paths (REQ-012/013). De-facto ISBN identity (REQ-016). Depends on domain + providers; NOT enrichment (REQ-002)."
    absorbs: [english_identity_resolver, async_resolver, bulk_resolver, llm_validator, "llm_scraper (GR scrape POLICY/prompts — REVIEW-FIX r1, out of the dumb pipe)", "title_cleanup (matching heuristic — REVIEW-FIX r1)", "lookup_filtered (re-homed as discovery policy, seam #5)", "negative-resolution/seed cache (NEW — REVIEW-FIX r1, gemini #5: 'this seed resolved to nothing'; distinct from providers' HTTP payload cache)"]
    cuts_seams: ["#5 inline discovery in work_service (re-home as identity discovery policy over ProviderDiscovery)", "#6 work_service reaches resolver's concrete transport_cache (Track 2 — replace with the providers cache capability, REQ-008 — kills the BT-004 leak)"]
    req_ids: [REQ-002, REQ-012, REQ-013, REQ-015, REQ-016, REQ-018]
    dependencies: [domain-established-identity, providers-substrate]
    public_api:
      types:
        - kind: struct
          name: LiveDiscoveryService
          description: "impls domain::DiscoveryService. Tier-scoped multi-provider fan-out over ProviderDiscovery; bridge/quorum; ADD/CONFLICT/EDIT; de-facto ISBN settle (REQ-016)."
      functions:
        - { name: "DiscoveryService::resolve (impl)", inputs: [{name: user_id, type: UserId}, {name: seed, type: WorkSeed}, {name: tier, type: LatencyTier}], output: "Result<Resolution, WorkIdentityError>", errors: [WorkIdentityError], description: "the single discovery seam; warms the cache; produces EstablishedIdentity (REQ-015 gating decided by state)." }

  - name: identity-gr-ladder
    responsibility: "The Goodreads anti-bot ACCESS LADDER (REQ-018, the discovery seam's forcing function). Cost-ordered rungs (auto_complete JSON -> TLS-impersonation HTML -> LLM-locator -> give-up); Blocked is transient (WillRetry), never terminal NotFound; verified gr_key only from a stable /book/show page. The ladder + classify() live across identity (policy) + providers (transport)."
    absorbs: ["(NEW feature code — the discovery seam-cut, lands here NOT in the monolith, REQ-010)"]
    cuts_seams: ["#5 (the GR half of the discovery refactor)"]
    req_ids: [REQ-010, REQ-018]
    dependencies: [domain-established-identity, providers-substrate, identity-resolver]
    public_api:
      types:
        - kind: trait
          name: DiscoveryRung
          description: "uniform cost-ordered scraped-source access path: cost(), available(), async search(&str)->RungOutcome. Walk in cost order; Hit wins; Blocked escalates + trips the per-(provider,rung) breaker (transient, REQ-018)."
        - kind: enum
          name: RungOutcome
          variants:
            - { name: "Hit(Vec<Candidate>)", description: "stop, pass on" }
            - { name: Empty, description: "real miss — do NOT escalate" }
            - { name: Blocked, description: "WAF/format failure -> next rung; transient WillRetry, never terminal (REQ-018)" }
            - { name: Unavailable, description: "not configured — skip" }

  # ── livrarr-enrichment (fill the record) ──
  - name: enrichment-spine
    responsibility: "RELOCATE from metadata lib.rs: the merge engine (field merge + provider priority + provenance) + enrichment_workflow_service + the enrich spine + **provider_queue (durable queue + retry orchestration; reads livrarr-db provider_retry_state — REVIEW-FIX r1)**. Consume EstablishedIdentity (the contract) + the warmed provider cache (top up misses only, REQ-017). Own the ENRICHMENT state track (Unenriched/Enriched/Thin) + Fork-F reclassification: Enriched = identity + >=1 text, cover decoupled, textless -> Thin/NeedsReview (REQ-014/019, seams #2/#4). Depends on domain + providers + livrarr-db (queue/retry-state + merge); NOT identity (REQ-002)."
    absorbs: ["merge engine (lib.rs)", "status classification (lib.rs merge_impl step-6)", enrichment_workflow_service, "the enrich_work spine", "provider_queue (durable queue + retry orchestration — REVIEW-FIX r1, moved here from the providers plan)"]
    cuts_seams: ["#2 enrich_work -> EnrichmentStatus::Conflict writeback (ONE-WAY VIOLATION): RESOLVED (REVIEW-FIX r1, BLOCKER both families) — enrichment NEVER writes identity state; when a remote fetch reveals an identity contradiction it EMITS a domain IdentityContradiction event/error (see domain-established-identity), and livrarr-server catches it and invokes livrarr-identity to transition state->Conflict transactionally. Enrichment's own track emits only Enriched/Thin (REQ-014).", "#4 merge_impl status (decouple cover from Enriched, REQ-019)"]
    req_ids: [REQ-002, REQ-014, REQ-015, REQ-017, REQ-019, REQ-024]
    dependencies: [domain-established-identity, providers-substrate, db-merge-invalidation]
    public_api:
      types:
        - kind: struct
          name: LiveEnrichmentService
          description: "impls domain::EnrichmentService. Gated by EstablishedIdentity.state (REQ-015): Confirmed/Provisional enrich; Pending/Conflict/NeedsReview do not. Clean-overwrite on generation bump (REQ-024)."

  # ── livrarr-materialize (project onto artifacts) ──
  - name: materialize-artifacts
    responsibility: "RELOCATE from metadata: cover*, cover_alternatives, preadd_cover_service, tag projection. SYNC materialize_cover(work_id) (add path blocks) + ASYNC materialize_tags(work_id) (heavy/fragile disk, REQ-019). Idempotent on merge_generation > tag_generation (REQ-021). Depends on domain + db + tagwrite + http; NOT enrichment (REQ-003 — generation-delta data-flow only, D-003)."
    absorbs: [cover, cover_alternatives, preadd_cover_service, "tag projection / tag-sync (seam #8)"]
    cuts_seams: ["#3 cover-gate in enrich_work (cover no longer gates Enriched — moved here as lazy backfill, REQ-019)", "#7 phase-1 cover + cover-upgrade inline calls (behind MaterializeService::materialize_cover)", "#8 tag-sync store (tag projection owned here; idempotent on generation, REQ-021)"]
    req_ids: [REQ-003, REQ-019, REQ-021]
    dependencies: [domain-established-identity]
    public_api:
      types:
        - kind: struct
          name: LiveMaterializeService
          description: "impls domain::MaterializeService. materialize_cover sync (fetch via http_client_safe — runtime URL, insight 37); materialize_tags async-queued; idempotency gate merge_generation > tag_generation (REQ-021)."

  # ── livrarr-db (the one shared write that crosses a seam) ──
  - name: db-merge-invalidation
    responsibility: "Bug #2 (REQ-020): identifier-change invalidation INSIDE apply_enrichment_merge's existing CAS txn. When a merge flips a dependent identifier None->Some (asin/isbn/ol/gr/hc), DELETE the dependent provider's TERMINAL provider_retry_state row in the same txn so the next bg pass re-queries -> converges. Reused from WCC IR (db-merge-invalidation); lives in db (the merge txn's home), invoked by enrichment-spine. REVIEW-FIX r1 (gemini BLOCKER reconciled): provider_retry_state is a livrarr-DB-OWNED table (accessed via ProviderRetryStateDb — verified provider_queue.rs:33), NOT a providers-internal table. So the DELETE is db touching its OWN table inside its OWN CAS txn — there is NO db->providers edge. gemini's concern was predicated on the queue/retry-state living in providers; with provider_queue moved to enrichment (REVIEW-FIX r1 #1) and retry-state staying in db, the boundary is clean. (The queue READS/WRITES retry-state via the db trait from enrichment; the merge-txn invalidation is internal to db.)"
    absorbs: ["(WCC's db-merge-invalidation — re-homed here unchanged)"]
    cuts_seams: []
    req_ids: [REQ-020]
    dependencies: [domain-established-identity]
    public_api: {}

