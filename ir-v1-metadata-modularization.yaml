# The full crate dependency graph — ACYCLIC + ONE-WAY (cargo tree-verifiable, REQ-002/006).
# Read top-down: an arrow A -> B means 'A depends on B'.
dependency_graph:
  # the substrate depends only on the leaf (+ http)
  - { source: providers-substrate, target: domain-established-identity }
  # identity and enrichment are SIBLINGS over providers — NEITHER points at the other (REQ-002)
  - { source: identity-resolver, target: domain-established-identity }
  - { source: identity-resolver, target: providers-substrate }
  - { source: identity-gr-ladder, target: identity-resolver }
  - { source: identity-gr-ladder, target: providers-substrate }
  - { source: enrichment-spine, target: domain-established-identity }
  - { source: enrichment-spine, target: providers-substrate }
  - { source: enrichment-spine, target: db-merge-invalidation }   # REVIEW-FIX r1: enrichment owns the DB-stateful provider_queue + the merge txn -> depends on livrarr-db
  # materialize depends only on the leaf (+ db/tagwrite/http) — NOT enrichment (REQ-003/D-003)
  - { source: materialize-artifacts, target: domain-established-identity }
  - { source: db-merge-invalidation, target: domain-established-identity }
  # NOTE (the non-edges that MATTER — verified by their ABSENCE in cargo tree):
  #   identity-resolver        -X-> enrichment-spine   (REQ-002 one-way)
  #   enrichment-spine         -X-> identity-resolver   (REQ-002 one-way)
  #   providers-substrate      -X-> {identity,enrichment,metadata}  (REQ-006 no back-edge — THE CANARY)
  #   providers-substrate      -X-> livrarr-db          (REVIEW-FIX r1: the canary's KEY invariant — only holdable because the DB-stateful provider_queue stays in enrichment; providers' cache is in-memory)
  #   materialize-artifacts    -X-> enrichment-spine    (REQ-003 failure isolation)

# ---------------------------------------------------------------------------
# The 8 seams (decision brief §2.3) and where each is cut. Track 1 = stable/behavior-preserving;
# Track 2 = cut via a feature, into the target crate (REQ-010).
seam_map:
  - { seam: 1, what: "provider_queue <- EnrichmentMode/EnrichmentContext", track: 1, cut_in: enrichment-spine, how: "REVIEW-FIX r1: the DB-stateful queue STAYS in enrichment (not providers); providers' fetch surface takes a providers-local mechanical FetchRequest, so EnrichmentContext/mode/priority never enter providers" }
  - { seam: 2, what: "enrich_work -> EnrichmentStatus::Conflict writeback (one-way violation)", track: 2, cut_in: "enrichment-spine (emit) + server (route) + identity (apply)", how: "REVIEW-FIX r1: enrichment emits a domain IdentityContradiction event; server catches it and invokes identity to set state->Conflict. Enrichment NEVER writes identity state. Enrichment's own track emits only Enriched/Thin (REQ-014)" }
  - { seam: 3, what: "cover-gate in enrich_work", track: 2, cut_in: materialize-artifacts, how: "cover-decouple — cover is lazy backfill, never gates Enriched (REQ-019)" }
  - { seam: 4, what: "merge_impl status", track: 2, cut_in: enrichment-spine, how: "Fork-F reclassification (REQ-014/019)" }
  - { seam: 5, what: "inline discovery in work_service (lookup_filtered)", track: 2, cut_in: identity-resolver, how: "re-home as discovery policy over ProviderDiscovery + the GR ladder (REQ-018)" }
  - { seam: 6, what: "work_service reaches resolver's concrete transport_cache (BT-004 leak)", track: 2, cut_in: identity-resolver, how: "REVIEW-FIX r1 (codex): TRACK 2 (cut in extraction step 5 with the discovery re-home), NOT Track 1 — the canary (step 1) does NOT resolve this leak and its GO must not assume seam #6 is closed. Replace the concrete Arc<LiveEnglishIdentityResolver> reach with the providers cache capability (REQ-008)" }
  - { seam: 7, what: "phase-1 cover + cover-upgrade inline calls", track: 2, cut_in: materialize-artifacts, how: "behind MaterializeService::materialize_cover (REQ-019); the generation-delta bg job ALSO refreshes cover, not only tags (REVIEW-FIX r1, gemini — else cover upgrades are lost)" }
  - { seam: 8, what: "tag-sync + enrichment lock/source-data stores", track: 2, cut_in: "materialize-artifacts (tag projection) + enrichment-spine (provenance/source-data)", how: "REVIEW-FIX r1 (codex): SPLIT — tag PROJECTION (file writes, idempotent on generation, REQ-021) -> materialize; provider source-data/provenance/lock stores are enrichment concerns -> stay in enrichment, NOT materialize" }
